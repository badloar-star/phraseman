# Current two-emulator lifecycle helper: Pixel searches the Fold account code.
# Update the inputText value when the seeded emulator accounts change.
appId: app.phraseman
---
- launchApp
- runFlow: ../../_dismiss_bug_hunt.yaml
- runFlow: ../../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "tab-friends"
- extendedWaitUntil:
    visible:
      id: "screen-friends"
    timeout: 30000
- tapOn:
    id: "friends-open-add"
- extendedWaitUntil:
    visible:
      id: "friends-code-input"
    timeout: 15000
- tapOn:
    id: "friends-code-input"
- eraseText
- inputText: "NA38SB"
- assertVisible: "NA38SB"
- tapOn:
    id: "friends-search"
- extendedWaitUntil:
    visible:
      id: "friends-found-user-card"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "friends-add-found"
    commands:
      - tapOn:
          id: "friends-add-found"
      - extendedWaitUntil:
          visible:
            id: "friends-add-feedback"
          timeout: 30000
