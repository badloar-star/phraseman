# Общий вход: холодный старт → таб «Главная» и стабильный экран home.
# Подключать через runFlow из maestro/flows/modules/** (не запускать папку _shared отдельно).
# Координатный тап по зоне таб «Главная» — не зависит от testID (на части билдов id табов вне иерархии).
appId: app.phraseman
---
- stopApp
- runFlow: open_dev_client.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- runFlow: ../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 10000
- runFlow: ../_dismiss_bug_hunt.yaml
- runFlow: ../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "(Задания дня|Завдання дня|Tareas del día)"
    commands:
      - pressKey: BACK
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    point: "10%,95%"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "first-lesson-later"
    commands:
      - tapOn:
          id: "first-lesson-later"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 120000
