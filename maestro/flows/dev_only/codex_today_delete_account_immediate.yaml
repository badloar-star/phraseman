appId: app.phraseman
clearState: true
---
- runFlow: ../_shared/open_dev_client_8082.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- openLink: "phraseman://settings"
- runFlow: ../_shared/accept_ios_open_prompt.yaml
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "settings-delete-account"
    direction: DOWN
    timeout: 30000
    speed: 70
    visibilityPercentage: 30
- tapOn:
    id: "settings-delete-account"
- extendedWaitUntil:
    visible:
      id: "delete-account-confirm-input"
    timeout: 15000
- tapOn:
    id: "delete-account-confirm-input"
- inputText: "УДАЛИТЬ"
- hideKeyboard
- tapOn:
    id: "delete-account-confirm"
- extendedWaitUntil:
    visible: "Аккаунт удаляется"
    timeout: 20000
- assertVisible: "Серверная очистка продолжится в фоне"
- takeScreenshot: codex_today_delete_account_immediate_pass
