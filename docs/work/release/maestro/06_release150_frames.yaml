# зачем (координатор, Эмулятор 2 · Maestro, 05.11): кадры релиза 150 на РУССКОМ и УКРАИНСКОМ интерфейсе (en прогнал Эмулятор 1).
# Запуск: maestro --device emulator-5562 test -e LANGUI=ru|uk --test-output-dir <папка кадров> 06_release150_frames.yaml
# Путь: новичок без подписки → Главная → ромб Plus → экран Plus → «Фраза дня» до/после ответа → урок 11 закрыт → dev-подписка → ромб исчез → урок 11 (меню).
# dev_state: uiLang и coinRank живут только в памяти — применять ПОСЛЕ запуска, без перезапуска приложения.
appId: app.phraseman
name: 06 release150 frames
---
- launchApp:
    stopApp: true
- openLink: "exp+phraseman://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Today|Сегодня|Сьогодні|Пропустить|Пропустити|Skip|Start lesson 1|Continue lesson 1"
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 20000
- runFlow:
    file: _dev_state.yaml
    env:
      LINK: "onboarding=done&plus=off&newbie=on&coinRank=0&uiLang=${LANGUI}"
- takeScreenshot: 01_home_newbie_overlay
- tapOn:
    text: "Пропустить|Пропустити|Skip"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 02_home_newbie_free
- tapOn:
    point: "85%,92%"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03_plus_top
- scroll
- takeScreenshot: 04_plus_middle
- scroll
- scroll
- scroll
- waitForAnimationToEnd
- takeScreenshot: 05_plus_bottom
- tapOn:
    point: "15%,92%"
- waitForAnimationToEnd
- tapOn:
    id: "home-v2-phrase-of-day"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 06_phrase_quiz_before
- tapOn:
    point: "50%,73%"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 07_phrase_after_answer
- back
- waitForAnimationToEnd
- openLink: "phraseman:///lesson_menu?id=11"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 08_lesson11_locked_free
- back
- waitForAnimationToEnd
- runFlow:
    file: _dev_state.yaml
    env:
      LINK: "plus=on&plan=monthly"
- takeScreenshot: 09_home_monthly_no_diamond
- openLink: "phraseman:///lesson_menu?id=11"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 10_lesson11_menu
