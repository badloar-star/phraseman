# Главная → карточки → назад (пустой список или обычный хедер — один testID).
appId: app.phraseman
---
- runFlow: ../_shared/boot_to_home_fast.yaml
# Быстрый ряд может быть ниже первого кадра (анимация секций / клавиатура).
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "home-quick-flashcards"
    direction: DOWN
    timeout: 20000
    speed: 80
    visibilityPercentage: 50
- tapOn:
    id: "home-quick-flashcards"
- extendedWaitUntil:
    visible:
      id: "flashcards-header-back"
    timeout: 20000
- tapOn:
    id: "flashcards-header-back"
- extendedWaitUntil:
    visible:
      id: "home-quick-flashcards"
    timeout: 15000
