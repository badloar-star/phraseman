name: Apply daily challenges audit

on:
  push:
    branches:
      - audit/daily-challenges-2026-08-06
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-daily-challenges-2026-08-06
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_SHA: 57216c95f5b2fcbbbd52e2206135953596511f64
      PATCH_FILE: .audit/daily-challenges-2026-08-06.patch
      PATCH_PART1: .audit/daily-challenges-2026-08-06.patch.part1
      PATCH_PART2: .audit/daily-challenges-2026-08-06.patch.part2
      PATCH_PART3: .audit/daily-challenges-2026-08-06.patch.part3
      WORKFLOW_FILE: .github/workflows/apply-daily-challenges-audit.yml
      PATCH_SHA256: e1fcf6ea3cc36d4008e03c64b318b5f106a013847bd4c8497c2b1f78e4e25594
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/daily-challenges-2026-08-06
          fetch-depth: 0

      - name: Verify isolated starting state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -f "$PATCH_FILE"
          test -f "$PATCH_PART1"
          test -f "$PATCH_PART2"
          test -f "$PATCH_PART3"
          test -f "$WORKFLOW_FILE"
          test "$(git hash-object "$PATCH_FILE")" = "395a25dd810c8f2791facaf3558c5d886819b183"
          test "$(git hash-object "$PATCH_PART1")" = "7ba3057fe894d3c61066fef68a822f89ea1508b7"
          test "$(git hash-object "$PATCH_PART2")" = "54fd7b44a2dd543974c6b42ae69a78772409466d"
          test "$(git hash-object "$PATCH_PART3")" = "96624f10cb4549021e1d1f865858eb1c2a955f24"
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/preflight-paths.txt
          printf '%s\n' "$PATCH_FILE" "$PATCH_PART1" "$PATCH_PART2" "$PATCH_PART3" "$WORKFLOW_FILE" | sort > /tmp/preflight-allowed.txt
          diff -u /tmp/preflight-allowed.txt /tmp/preflight-paths.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run baseline root Jest before patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run assets:verify:boons
          set +e
          npx jest --testPathPattern=tests/ --no-cache --runInBand --json \
            --outputFile=artifacts/root-jest-base.json \
            > artifacts/root-jest-base.log 2>&1
          code=$?
          set -e
          echo "$code" > artifacts/root-jest-base.exit
          test -s artifacts/root-jest-base.json

      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat "$PATCH_FILE" "$PATCH_PART1" "$PATCH_PART2" "$PATCH_PART3" \
            | base64 --decode | gzip --decompress > /tmp/daily-challenges-2026-08-06.patch
          echo "$PATCH_SHA256  /tmp/daily-challenges-2026-08-06.patch" | sha256sum --check
          git apply --check /tmp/daily-challenges-2026-08-06.patch
          git apply /tmp/daily-challenges-2026-08-06.patch
          rm -f "$PATCH_FILE" "$PATCH_PART1" "$PATCH_PART2" "$PATCH_PART3" "$WORKFLOW_FILE"
          git diff --check

      - name: Enforce exact code scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowed-code-paths.txt <<'EOF'
          app/daily_task_navigation.ts
          app/daily_tasks.ts
          app/daily_tasks_es_locale.ts
          app/daily_tasks_screen.tsx
          app/review.tsx
          app/trainer_phrases_session.tsx
          app/trainer_words_session.tsx
          tests/daily_quests_active_catalog_contract.test.ts
          tests/daily_task_reroll.test.ts
          tests/daily_tasks_active_executability_contract.test.ts
          tests/daily_tasks_claim.test.ts
          tests/daily_tasks_completed_card_stability.test.ts
          tests/daily_tasks_inflight_progress.test.ts
          tests/daily_tasks_language_availability.test.ts
          tests/daily_tasks_recall_availability.test.ts
          tests/daily_tasks_safe_fallback.test.ts
          tests/daily_tasks_screen_cache.test.ts
          tests/daily_tasks_trainer_availability.test.ts
          tests/trainer_entrypoint_reservation.test.ts
          EOF
          sed -i 's/^          //' /tmp/allowed-code-paths.txt
          sort -o /tmp/allowed-code-paths.txt /tmp/allowed-code-paths.txt
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-code-paths.txt
          diff -u /tmp/allowed-code-paths.txt /tmp/actual-code-paths.txt
          if grep -Ei '(^|/)(premium|revenuecat|paywall|purchase|subscription|auth|account)' /tmp/actual-code-paths.txt; then
            echo 'Protected Premium/auth/account path changed' >&2
            exit 1
          fi

      - name: Verify French is absent from daily-challenge runtime
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/daily_task_navigation.ts app/daily_tasks.ts app/daily_tasks_es_locale.ts
            app/daily_tasks_screen.tsx app/review.tsx app/trainer_words_session.tsx
            app/trainer_phrases_session.tsx
            tests/daily_quests_active_catalog_contract.test.ts tests/daily_task_reroll.test.ts
            tests/daily_tasks_active_executability_contract.test.ts tests/daily_tasks_claim.test.ts
            tests/daily_tasks_completed_card_stability.test.ts tests/daily_tasks_inflight_progress.test.ts
            tests/daily_tasks_language_availability.test.ts tests/daily_tasks_recall_availability.test.ts
            tests/daily_tasks_safe_fallback.test.ts tests/daily_tasks_screen_cache.test.ts
            tests/daily_tasks_trainer_availability.test.ts tests/trainer_entrypoint_reservation.test.ts
          )
          if grep -InE '(French|french|FRENCH|Француз|француз|::fr::)' "${files[@]}"; then
            echo 'French residue remains in daily-challenge scope' >&2
            exit 1
          fi

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Text integrity
        run: npm run text-integrity:audit

      - name: Secret scan
        run: npm run scan:secrets

      - name: Focused daily challenge tests
        shell: bash
        run: |
          set -euo pipefail
          npx jest --no-cache --runInBand --runTestsByPath \
            tests/daily_quests_active_catalog_contract.test.ts \
            tests/daily_task_reroll.test.ts \
            tests/daily_tasks_active_executability_contract.test.ts \
            tests/daily_tasks_claim.test.ts \
            tests/daily_tasks_completed_card_stability.test.ts \
            tests/daily_tasks_inflight_progress.test.ts \
            tests/daily_tasks_language_availability.test.ts \
            tests/daily_tasks_recall_availability.test.ts \
            tests/daily_tasks_safe_fallback.test.ts \
            tests/daily_tasks_screen_cache.test.ts \
            tests/daily_tasks_trainer_availability.test.ts \
            tests/trainer_entrypoint_reservation.test.ts \
            --json --outputFile=artifacts/focused-jest.json \
            > artifacts/focused-jest.log 2>&1

      - name: Run patched full root Jest
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx jest --testPathPattern=tests/ --no-cache --runInBand --json \
            --outputFile=artifacts/root-jest-patched.json \
            > artifacts/root-jest-patched.log 2>&1
          code=$?
          set -e
          echo "$code" > artifacts/root-jest-patched.exit
          test -s artifacts/root-jest-patched.json

      - name: Reject new root Jest failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def failed_suites(data):
              return {row.get('name', '') for row in data.get('testResults', []) if row.get('status') == 'failed'}

          def failed_tests(data):
              result = set()
              for suite in data.get('testResults', []):
                  for assertion in suite.get('assertionResults', []):
                      if assertion.get('status') == 'failed':
                          result.add(f"{suite.get('name', '')}::{assertion.get('fullName', assertion.get('title', ''))}")
              return result

          base = load('artifacts/root-jest-base.json')
          patched = load('artifacts/root-jest-patched.json')
          base_suites = failed_suites(base)
          patched_suites = failed_suites(patched)
          base_tests = failed_tests(base)
          patched_tests = failed_tests(patched)
          report = {
              'base_failed_suites': len(base_suites),
              'patched_failed_suites': len(patched_suites),
              'new_failed_suites': sorted(patched_suites - base_suites),
              'base_failed_tests': len(base_tests),
              'patched_failed_tests': len(patched_tests),
              'new_failed_tests': sorted(patched_tests - base_tests),
          }
          Path('artifacts/jest-baseline-comparison.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report['new_failed_suites'] or report['new_failed_tests']:
              raise SystemExit('Patched branch introduced new Jest failures')
          PY

      - name: Validate Cloud Functions remain healthy
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          npm ci
          npm run build
          npm test -- --runInBand

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-challenges-audit-evidence
          path: artifacts
          retention-days: 7

      - name: Commit validated code only
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$PATCH_FILE" "$PATCH_PART1" "$PATCH_PART2" "$PATCH_PART3" "$WORKFLOW_FILE"
          git add -A
          git diff --cached --check
          cat > /tmp/expected-final-paths.txt <<'EOF'
          app/daily_task_navigation.ts
          app/daily_tasks.ts
          app/daily_tasks_es_locale.ts
          app/daily_tasks_screen.tsx
          app/review.tsx
          app/trainer_phrases_session.tsx
          app/trainer_words_session.tsx
          tests/daily_quests_active_catalog_contract.test.ts
          tests/daily_task_reroll.test.ts
          tests/daily_tasks_active_executability_contract.test.ts
          tests/daily_tasks_claim.test.ts
          tests/daily_tasks_completed_card_stability.test.ts
          tests/daily_tasks_inflight_progress.test.ts
          tests/daily_tasks_language_availability.test.ts
          tests/daily_tasks_recall_availability.test.ts
          tests/daily_tasks_safe_fallback.test.ts
          tests/daily_tasks_screen_cache.test.ts
          tests/daily_tasks_trainer_availability.test.ts
          tests/trainer_entrypoint_reservation.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-final-paths.txt
          sort -o /tmp/expected-final-paths.txt /tmp/expected-final-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/actual-final-paths.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make daily challenges executable and route-safe'
          git push origin HEAD:audit/daily-challenges-2026-08-06
