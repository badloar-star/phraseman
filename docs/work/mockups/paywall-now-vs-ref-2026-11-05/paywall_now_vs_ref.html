<h1>Платный экран, как сейчас и как в образце</h1>
<p class="lead">Слева настоящий кадр приложения (русский интерфейс, эмулятор 05.11), справа образец «вариант 3». Переключай вид и тему. Образец показывает свой текст и пока не утверждён.</p>

var DIFF={
lang:["<span class=\"bug\">Подзаголовок налезает на первую строку списка</span>: две строки текста лежат друг на друге, читать трудно.","Заголовок другой: в образце «Ещё один язык. Больше тебя.», в приложении «Ещё один язык для занятий».","Список другой. В образце «Языки на выбор», «Курс дальше», «Больше практики». В приложении «Все 32 урока курса» и «AI разбирает каждую ошибку», а первая строка повторяет подзаголовок.","В образце есть абзац про то, что уроки 1–3 бесплатны в первом языке. В приложении его нет.","Плитки «Год» и «Месяц»: в образце только названия, в приложении ещё цены, кружок выбора и «Цена уточнится в магазине».","Главная кнопка: в образце «Подключить Plus», в приложении «Оформить за ≈ €39,99 в год».","Внизу: в образце «Восстановить покупки», в приложении «Восстановить» и «Ввести промокод»."],
plus:["Заголовок другой: в образце «Больше способов учиться», в приложении «Дальше — в Plus». Образец показывает общий вид, приложение — вид после 3-го урока.","<span class=\"bug\">Первая строка списка сразу под подзаголовком и повторяет его слово в слово</span> («Впереди ещё 29 уроков…» два раза подряд).","Список другой: в образце «Языки на выбор», «Курс дальше», «Больше практики»; в приложении «Весь курс целиком», «Все 32 урока курса», «AI разбирает каждую ошибку».","В образце есть абзац про бесплатные уроки 1–3. В приложении его нет.","Плитки «Год» и «Месяц», главная кнопка и нижние ссылки отличаются так же, как в виде «Другой язык»."]};
var THEME={light:"Тон: в образце главная кнопка серая и спокойная, в приложении она тёмно-зелёная, заметнее.",dark:"Тон: в образце главная кнопка тёмно-серая, в приложении яркая мятная. Фон в образце чёрный, в приложении почти чёрный."};
var kind="lang",mode="light";
function show(){var i=IMG[kind][mode];document.getElementById("now").src=i.now;document.getElementById("ref").src=i.ref;
document.getElementById("diff").innerHTML=DIFF[kind].concat([THEME[mode]]).map(function(t){return "<li>"+t+"</li>"}).join("");
["lang","plus"].forEach(function(k){document.getElementById("k-"+k).setAttribute("aria-pressed",k===kind?"true":"false")});
["light","dark"].forEach(function(k){document.getElementById("m-"+k).setAttribute("aria-pressed",k===mode?"true":"false")});}
["lang","plus"].forEach(function(k){document.getElementById("k-"+k).addEventListener("click",function(){kind=k;show()})});
["light","dark"].forEach(function(k){document.getElementById("m-"+k).addEventListener("click",function(){mode=k;show()})});
show();
</script>
