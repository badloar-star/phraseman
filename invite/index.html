<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phraseman Invite</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --card: #1b1f25;
      --text: #f7f8fa;
      --muted: #a7afbd;
      --line: rgba(255,255,255,0.12);
      --blue: #6aa7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% -10%, #223047 0, var(--bg) 52%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }
    .code {
      display: none;
      margin: 18px 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      letter-spacing: 0.16em;
      font-weight: 800;
      font-size: 22px;
      text-align: center;
    }
    .actions {
      display: grid;
      gap: 10px;
    }
    a {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #06111f;
      background: var(--blue);
      border-radius: 12px;
      padding: 14px 16px;
      font-weight: 800;
    }
    a.secondary {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
    }
    small {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>Install Phraseman</h1>
    <p>This invitation is for a new user. Referral rewards count only when Phraseman is installed for the first time.</p>
    <div id="code" class="code"></div>
    <div class="actions">
      <a id="store" class="secondary" href="https://play.google.com/store/apps/details?id=app.phraseman">Install Phraseman</a>
    </div>
    <small id="hint">On Android, Google Play carries the invitation code automatically. On iOS, copy or enter the code after installation.</small>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var ref = String(params.get('ref') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
      var isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(navigator.userAgent);
      var androidStore = 'https://play.google.com/store/apps/details?id=app.phraseman' +
        (ref ? '&referrer=' + encodeURIComponent('ref=' + ref) : '');
      var iosStore = 'https://apps.apple.com/app/id6764800879';

      var store = document.getElementById('store');
      var code = document.getElementById('code');
      var hint = document.getElementById('hint');

      store.href = isiOS ? iosStore : androidStore;
      store.textContent = isiOS ? 'Install from App Store' : 'Install from Google Play';

      if (ref) {
        code.style.display = 'block';
        code.textContent = ref;
        hint.textContent = isiOS
          ? 'Install Phraseman, then enter this code in Friends.'
          : 'On Android the install link also carries the invite code through Google Play.';
      }

      if (isAndroid) {
        setTimeout(function () { window.location.href = androidStore; }, 600);
      } else if (!isiOS) {
        setTimeout(function () { window.location.href = store.href; }, 1800);
      }
    })();
  </script>
</body>
</html>
