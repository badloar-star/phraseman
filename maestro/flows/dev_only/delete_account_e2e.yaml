appId: app.phraseman
clearState: true
---
- stopApp
- openLink: "exp+phraseman://expo-development-client/?url=http%3A%2F%2F192.168.68.105%3A8081"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "New development server"
    commands:
      - tapOn:
          point: "50%,26%"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow: ../_dismiss_bug_hunt.yaml
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible: "Got it"
          commands:
            - tapOn: "Got it"
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            visible: "New development server"
          commands:
            - tapOn:
                point: "50%,26%"
            - waitForAnimationToEnd:
                timeout: 8000
      - runFlow: ../_precondition.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- openLink: "phraseman://admin_premium_delivery_test"
- extendedWaitUntil:
    visible:
      id: "screen-admin-premium-delivery-e2e"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "admin-premium-e2e-reset"
    timeout: 30000
- tapOn:
    id: "admin-premium-e2e-reset"
- extendedWaitUntil:
    visible: "Context premium: false"
    timeout: 90000
- openLink: "phraseman://settings"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Настройки"
    timeout: 20000
- assertNotVisible: "Premium активирован"
- scrollUntilVisible:
    element:
      id: "settings-delete-account"
    direction: DOWN
    timeout: 20000
    speed: 70
    visibilityPercentage: 30
- extendedWaitUntil:
    visible:
      id: "settings-delete-account"
    timeout: 10000
- tapOn:
    id: "settings-delete-account"
- extendedWaitUntil:
    visible:
      id: "delete-account-confirm-input"
    timeout: 10000
- tapOn:
    id: "delete-account-confirm-input"
- inputText: "УДАЛИТЬ"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "delete-account-confirm"
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome-screen"
    timeout: 240000
- assertNotVisible:
    id: "delete-account-confirm"
- assertNotVisible: "Kairos7217"
