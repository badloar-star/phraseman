<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточки 2.0</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* зачем (владелец 04.10): прошлый макет «мусор, это не хаб». Новый раздел целиком на токенах kit.css:
     графит/белый/серый, Inter, стекло. Карточка — ГОРИЗОНТАЛЬНАЯ, как word() в etalon.html (≥118, озвучка слева,
     EN, слово 26/32, «…» в углу, радиус 16). Сетка масштабируется щипком и ползунком как Apple Photos. */

  /* ---------- горизонтальная карточка слова в масштабируемой сетке ---------- */
  .zg { display: grid; position: relative; transform-origin: 0 0; }
  .zg.s0 { grid-template-columns: 1fr; grid-auto-rows: 118px; gap: 10px; }
  .zg.s1 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 96px; gap: 10px; }
  .zg.s2 { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 62px; gap: 8px; }
  .zg.s3 { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: 37px; gap: 5px; }
  .wc { position: relative; min-width: 0; border-radius: 16px; overflow: hidden; cursor: pointer; user-select: none;
    background: linear-gradient(158deg, #1B1B1E 0%, #151517 55%, #131315 100%);
    box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.07), 0 10px 24px -16px rgba(0,0,0,.9); }
  .wc::before { content: ""; position: absolute; inset: 0; background: var(--lg-sheen); pointer-events: none; }
  .wc:active .ct { opacity: .7; }
  .zg.s1 .wc { border-radius: 14px; } .zg.s2 .wc { border-radius: 12px; } .zg.s3 .wc { border-radius: 8px; }
  .wc .ct { position: absolute; inset: 0; display: flex; align-items: center; gap: 22px; padding: 0 46px 0 12px; }
  .wc .vb { width: 38px; height: 38px; border-radius: 50%; background: #262628; display: flex; align-items: center; justify-content: center; flex: none; }
  .wc .tx { flex: 1; min-width: 0; }
  .wc .lg { font-size: 12px; line-height: 14px; color: var(--sec); font-weight: 600; }
  .wc .w { font-size: 26px; line-height: 32px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.2px; }
  .wc .tr { font-size: 15px; line-height: 20px; color: var(--sec); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wc .dt { position: absolute; right: 18px; top: 14px; color: var(--sec); }
  .zg.s1 .ct { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; padding: 0 44px 0 16px; }
  .zg.s1 .vb { position: absolute; right: 12px; bottom: 12px; width: 28px; height: 28px; }
  .zg.s1 .vb svg { width: 14px; height: 14px; }
  .zg.s1 .tx { flex: none; width: 100%; }
  .zg.s1 .lg { font-size: 11px; }
  .zg.s1 .w { font-size: 20px; line-height: 25px; margin-top: 4px; }
  .zg.s1 .tr { font-size: 13.5px; line-height: 18px; }
  .zg.s1 .dt, .zg.s2 .dt, .zg.s3 .dt, .zg.s2 .vb, .zg.s3 .vb, .zg.s2 .lg, .zg.s3 .lg, .zg.s2 .tr, .zg.s3 .tr { display: none; }
  .zg.s2 .ct { padding: 0 12px; }
  .zg.s2 .w { font-size: 15px; line-height: 19px; margin: 0; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .zg.s3 .ct { padding: 0 7px; }
  .zg.s3 .w { font-size: 10.5px; line-height: 13px; margin: 0; letter-spacing: 0; }
  .wc .w mark { background: none; color: var(--text); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }

  /* ---------- полоса масштаба (над сеткой, прилипает) ---------- */
  .zbar { position: sticky; top: 46px; z-index: 6; margin: 0 -20px; padding: 10px 20px 12px;
    background: linear-gradient(rgba(14,14,15,.94) 72%, rgba(14,14,15,0)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .zs { display: flex; align-items: center; height: 34px; color: var(--sec); touch-action: none; }
  .zi { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; transition: color 200ms; }
  .zi:hover { color: var(--text); }
  .ztr { position: relative; flex: 1; height: 34px; margin: 0 12px; cursor: pointer; }
  .ztr::before { content: ""; position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--track); }
  .zf { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.55); }
  .zd { position: absolute; top: 14.5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #48484C; }
  .zth { position: absolute; top: 5px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: #F4F4F6;
    box-shadow: inset 0 1px 0 #fff, 0 2px 8px rgba(0,0,0,.55), 0 0 0 .5px rgba(0,0,0,.4); transition: left 380ms cubic-bezier(.2,.8,.2,1), transform 160ms; }
  .zs.drag .zth { transition: transform 160ms; transform: scale(1.12); }
  .zf { transition: width 380ms cubic-bezier(.2,.8,.2,1); }
  .zs.drag .zf { transition: none; }

  /* ---------- поиск, чипы, сегменты, поля ---------- */
  .srch { display: flex; align-items: center; gap: 10px; height: 44px; border-radius: 22px; background: #18181A; border: 1px solid var(--line); padding: 0 16px; color: var(--muted); font-size: 16px; }
  .srch .v { color: var(--text); }
  .srch .x { margin-left: auto; color: var(--sec); }
  .caret { display: inline-block; width: 2px; height: 20px; background: #fff; margin-left: 1px; vertical-align: middle; border-radius: 1px; animation: blink 1.05s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chipbtn { height: 36px; padding: 0 16px; border-radius: 18px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--sec); background: #18181A; border: 1px solid var(--line); white-space: nowrap; flex: none; cursor: pointer; transition: background 200ms, color 200ms; }
  .chipbtn.on { color: var(--cta-ink); background: var(--cta); border-color: transparent; }
  .seg3 { display: flex; padding: 4px; border-radius: 14px; background: #161618; border: 1px solid var(--line); }
  .seg3 span { flex: 1; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--sec); cursor: pointer; transition: background 220ms, color 220ms; font-variant-numeric: tabular-nums; }
  .seg3 span.on { background: #2C2C2E; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 4px 12px -6px rgba(0,0,0,.8); }
  .flab { font-size: 13px; font-weight: 600; color: var(--sec); margin: 0 4px 8px; }
  .field { border-radius: 14px; background: #161618; border: 1px solid var(--line-2); min-height: 56px; display: flex; align-items: center; padding: 0 16px; font-size: 18px; gap: 10px; }
  .field input { all: unset; flex: 1; min-width: 0; font: 500 18px Inter, sans-serif; color: var(--text); caret-color: #fff; }
  .field input::placeholder { color: var(--muted); }
  .field.ok { border-color: rgba(111,208,140,.45); background: rgba(111,208,140,.08); }
  .field.no { border-color: rgba(242,118,107,.45); background: rgba(242,118,107,.08); }
  .hint { color: var(--muted); }

  /* ---------- мини-карточки (превью в хабе, обложки наборов) ---------- */
  .mc { display: flex; align-items: center; padding: 0 10px; height: 40px; border-radius: 9px; font-size: 12px; line-height: 15px; font-weight: 600; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(160deg, #26262A, #1C1C1F); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.08); }
  .mc span { overflow: hidden; text-overflow: ellipsis; }

  /* ---------- хаб: «продолжить» — стопка горизонтальных карточек, как кошелёк ---------- */
  .hstk { position: relative; padding-top: 22px; margin-top: 22px; }
  .hstk .sl { position: absolute; left: 50%; height: 40px; border-radius: 18px; background: linear-gradient(#232326, #18181A); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.08); }
  .hstk .sl.a { top: 0; width: 84%; margin-left: -42%; opacity: .55; }
  .hstk .sl.b { top: 10px; width: 92%; margin-left: -46%; opacity: .85; }
  .hc { position: relative; height: 192px; border-radius: 22px; padding: 18px 20px 20px; display: flex; flex-direction: column;
    background: linear-gradient(160deg, #222225 0%, #18181A 60%, #141416 100%); border: 1px solid var(--line-2); }
  .hc .ov { letter-spacing: 2.4px; font-size: 11px; }
  .hc .hw { font-size: 38px; line-height: 44px; font-weight: 700; letter-spacing: -.8px; margin-top: auto; }
  .hc .hs { font-size: 15px; color: var(--sec); margin-top: 4px; }
  .hc .trk { margin-top: 16px; height: 4px; }
  .hc .vb2 { position: absolute; right: 16px; top: 14px; }
  .vb2 { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.08); display: inline-flex; align-items: center; justify-content: center; color: var(--text); }

  /* ---------- хаб: «твои карточки» — две живые плитки ---------- */
  .ygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ytile { position: relative; border-radius: 22px; padding: 12px 12px 14px; background: var(--card-2); border: 1px solid var(--line); overflow: hidden; }
  .ymos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 92px; align-content: start; }
  .ymos .mc { height: 43px; }
  .ystk { position: relative; height: 92px; }
  .ystk .cv { position: absolute; left: 0; right: 0; height: 52px; border-radius: 11px; padding: 8px 10px; font-size: 12px; font-weight: 700;
    box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.09), 0 -6px 14px -8px rgba(0,0,0,.8); display: flex; justify-content: space-between; }
  .ystk .cv b { font-weight: 600; color: var(--sec); font-variant-numeric: tabular-nums; }
  .yft { display: flex; align-items: flex-end; gap: 8px; margin-top: 14px; padding: 0 4px; }
  .ytt { font-size: 17px; line-height: 22px; font-weight: 700; }
  .ysu { font-size: 15px; color: var(--sec); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .yft .i { color: var(--sec); margin-bottom: 2px; }

  /* ---------- ленты и видео ---------- */
  .rail { display: flex; gap: 12px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 4px; scroll-snap-type: x mandatory; scroll-padding: 0 20px; scrollbar-width: none; cursor: grab; }
  .rail::-webkit-scrollbar { display: none; }
  .rail.drag { cursor: grabbing; scroll-snap-type: none; }
  .rail > * { scroll-snap-align: start; flex: none; }
  .vfr { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #111113; }
  .vfr::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.1); pointer-events: none; }
  .vsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .dur { position: absolute; right: 8px; bottom: 10px; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.72); font-size: 12px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; z-index: 2; }
  .vprog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.2); z-index: 2; }
  .vprog i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
  .vplay { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; z-index: 2; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.12); }
  .vcard { width: 252px; cursor: pointer; }
  .vt { font-size: 16px; line-height: 21px; font-weight: 600; margin-top: 10px; }
  .vm { font-size: 14px; color: var(--sec); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tch { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px; border-radius: 13px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }

  /* ---------- сообщество: чарт ---------- */
  .chart > .cr + .cr { border-top: 1px solid var(--line); }
  .cr { display: flex; align-items: center; gap: 14px; padding: 12px 2px; cursor: pointer; }
  .cr .rk { width: 18px; font-size: 20px; font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; flex: none; }
  .cov { position: relative; width: 92px; height: 46px; flex: none; }
  .cov::before { content: ""; position: absolute; left: 7px; right: 7px; top: -5px; height: 12px; border-radius: 8px; background: #232326; box-shadow: inset 0 0 0 1px var(--line); }
  .cov .mc { position: relative; height: 46px; font-size: 13px; padding: 0 10px; border-radius: 10px; }
  .cr .tt { font-size: 17px; line-height: 22px; font-weight: 700; }
  .cr .st { font-size: 14px; line-height: 18px; color: var(--sec); margin-top: 2px; }
  .likes { display: inline-flex; align-items: center; gap: 5px; color: var(--sec); font-size: 14px; font-variant-numeric: tabular-nums; }

  /* ---------- наборы: обложка-колода ---------- */
  .deck { position: relative; padding-top: 12px; cursor: pointer; }
  .deck .dk { position: absolute; left: 50%; height: 30px; border-radius: 16px; background: linear-gradient(#222225, #19191B); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.07); }
  .deck .dk.a { top: 0; width: 86%; margin-left: -43%; opacity: .55; }
  .deck .dk.b { top: 6px; width: 93%; margin-left: -46.5%; opacity: .9; }
  .dc { position: relative; border-radius: 20px; padding: 16px 16px 16px 18px; background: linear-gradient(160deg, #1F1F22, #161618 70%); border: 1px solid var(--line); }
  .dc .dt1 { font-size: 21px; line-height: 26px; font-weight: 700; letter-spacing: -.2px; }
  .dc .ds { font-size: 14px; color: var(--sec); margin-top: 3px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
  .dc .dw { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .dc .dw .mc { height: 38px; }
  .pl { width: 44px; height: 44px; border-radius: 50%; background: var(--cta); color: var(--cta-ink); display: inline-flex; align-items: center; justify-content: center; flex: none;
    box-shadow: inset 0 1px 0 #fff, 0 8px 18px -8px rgba(0,0,0,.8); }
  .av { width: 22px; height: 22px; border-radius: 50%; background: #2A2A2C; display: inline-flex; align-items: center; justify-content: center; color: #8C8C90; flex: none; }
  .stack.g14 > * + * { margin-top: 14px; }

  /* ---------- разворот карточки ---------- */
  .flip { position: relative; perspective: 1200px; cursor: pointer; user-select: none; }
  .flip .fl { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 560ms cubic-bezier(.2,.8,.2,1); }
  .flip.on .fl { transform: rotateY(180deg); }
  .flip .fa, .flip .fb { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 20px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 30px;
    background: linear-gradient(160deg, #202023 0%, #161618 62%, #131315 100%);
    box-shadow: inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255,255,255,.1), 0 22px 44px -22px rgba(0,0,0,.95); }
  .flip .fb { transform: rotateY(180deg); background: linear-gradient(160deg, #26262A 0%, #1C1C1F 62%, #18181A 100%); }
  .flip .fa::before, .flip .fb::before { content: ""; position: absolute; inset: 0; background: var(--lg-sheen); pointer-events: none; }
  .flip .lgf { position: absolute; left: 20px; top: 18px; font-size: 12px; font-weight: 600; color: var(--sec); }
  .flip .vb2 { position: absolute; right: 14px; top: 12px; }
  .flip .fw { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.5px; }
  .flip .fs { font-size: 15px; line-height: 20px; color: var(--sec); margin-top: 8px; }
  .flip .turn { position: absolute; right: 16px; bottom: 14px; color: var(--muted); }
  .flip.no .fa, .flip.no .fb { box-shadow: inset 0 0 0 1px rgba(242,118,107,.45), 0 22px 44px -22px rgba(0,0,0,.95); }
  .flip.ok .fa, .flip.ok .fb { box-shadow: inset 0 0 0 1px rgba(111,208,140,.45), 0 22px 44px -22px rgba(0,0,0,.95); }

  /* ---------- смахивание (правда / ложь) ---------- */
  .swz { position: relative; height: 210px; margin-top: 40px; }
  .swz .under { position: absolute; left: 14px; right: 14px; top: 14px; bottom: -10px; border-radius: 20px; background: #161618; box-shadow: inset 0 0 0 1px var(--line); }
  .swc { position: absolute; inset: 0; touch-action: none; cursor: grab; border-radius: 20px; }
  .swc .fa { position: absolute; inset: 0; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    background: linear-gradient(160deg, #222225 0%, #18181A 62%, #141416 100%); box-shadow: inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255,255,255,.1), 0 22px 44px -22px rgba(0,0,0,.95); }
  .swc .fw { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.5px; }
  .swc .eq { width: 40px; height: 1px; background: var(--line-2); margin: 14px 0; }
  .swc .ft { font-size: 22px; line-height: 28px; color: #E4E4E6; font-weight: 600; }
  .stmp { position: absolute; top: 18px; padding: 4px 12px; border-radius: 10px; font-size: 15px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0; }
  .stmp.y { left: 18px; color: var(--good); background: rgba(111,208,140,.14); }
  .stmp.n { right: 18px; color: var(--bad); background: rgba(242,118,107,.14); }
  .tfb { display: flex; justify-content: center; gap: 56px; margin-top: 46px; }
  .tfx { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--sec); }
  .tfx .o { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1C1C1E; color: var(--text);
    box-shadow: inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255,255,255,.12), 0 14px 28px -14px rgba(0,0,0,.9); }

  /* ---------- сессии ---------- */
  .bot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; padding: 18px 20px 34px; background: linear-gradient(rgba(12,12,13,0), #0C0C0D 30%); }
  .bot .two { display: flex; gap: 10px; } .bot .two > * { flex: 1; }
  .qh { position: relative; height: 188px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    background: linear-gradient(160deg, #202023 0%, #161618 62%, #131315 100%); box-shadow: inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255,255,255,.1), 0 22px 44px -22px rgba(0,0,0,.95); }
  .qh .k { font-size: 15px; color: var(--sec); position: absolute; top: 18px; left: 0; right: 0; }
  .qh .q { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.5px; }
  .opt { position: relative; cursor: pointer; }
  .opt .mk { position: absolute; right: 16px; top: 50%; margin-top: -10px; }
  .opt.ok .mk { color: var(--good); } .opt.no .mk { color: var(--bad); }
  .opt.fade { opacity: .38; }
  .plus10 { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(111,208,140,.14); color: var(--good); font-size: 14px; font-weight: 700; }
  .hearts span { display: inline-flex; transition: opacity 300ms, transform 300ms; }
  .hearts span.lost { opacity: .2; transform: scale(.85); }
  .shdr { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .shdr .tl { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; }
  .shdr .cnt { font-size: 15px; color: var(--sec); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mic { width: 92px; height: 92px; border-radius: 50%; background: var(--cta); color: var(--cta-ink); display: inline-flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 #fff, 0 14px 30px -12px rgba(0,0,0,.8); cursor: pointer; }
  .mic.live { animation: ring 1.6s ease-in-out infinite; }
  @keyframes ring { 0%,100% { box-shadow: 0 0 0 12px rgba(255,255,255,.08), 0 0 0 26px rgba(255,255,255,.035); } 50% { box-shadow: 0 0 0 16px rgba(255,255,255,.06), 0 0 0 34px rgba(255,255,255,.02); } }
  .wave { display: flex; gap: 4px; align-items: center; justify-content: center; height: 40px; margin-top: 28px; }
  .wave i { width: 4px; border-radius: 2px; background: #E9E9EB; animation: wv 900ms ease-in-out infinite alternate; }
  @keyframes wv { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
  .ans { border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .ans .k { font-size: 13px; font-weight: 600; color: var(--sec); }

        c.animate([{ transformOrigin: '0 0', transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` }, { transformOrigin: '0 0', transform: 'none' }], { duration: MORPH_MS, easing: EASE });

      const c = e.target.closest('.wc'); if (!c) return;
      const body = ph.querySelector('[data-cdbody]'); const sh = ph.querySelector('[data-sheet="cd"]');
      if (!body || !sh) { console.warn(LOG, 'нет шторки карточки в телефоне — тап не обработан'); return; }
      const wd = W[+c.dataset.wi] || W[0];
      body.innerHTML = cardSheetInner(wd[0], wd[1], '');
      sh.classList.add('on'); ph.querySelector('[data-dim="cd"]')?.classList.add('on');
    });
  }

  // ---------- разворот ----------
  document.body.addEventListener('click', (e) => {
    const f = e.target.closest('.flip'); if (!f || e.target.closest('[data-noflip]')) return;
    f.classList.toggle('on');
  });

  // ---------- ленты: перетаскивание мышью ----------
  function initRail(r) {
    let x0 = 0; let s0 = 0; let down = false; let moved = false;
    r.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') return; down = true; moved = false; x0 = e.clientX; s0 = r.scrollLeft; });
    window.addEventListener('pointermove', (e) => {
      if (!down) return; const dx = e.clientX - x0;
      if (Math.abs(dx) > 4) { moved = true; r.classList.add('drag'); }
      r.scrollLeft = s0 - dx;
    });
    window.addEventListener('pointerup', () => {
      if (!down) return; down = false;
      if (r.classList.contains('drag')) { r.classList.remove('drag'); }
    });
    r.addEventListener('click', (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  }

  // ---------- смахивание «Правда / ложь» ----------
  const TF = [['Gate', 'выход на посадку'], ['Delay', 'задержка'], ['Customs', 'багаж'], ['Fare', 'стоимость проезда'], ['Aisle', 'окно']];
  function initSwipe(z) {
    const ph = z.closest('.ph'); let card = z.querySelector('.swc'); let k = 0;
    if (card.getAttribute('style')) return; // статичный кадр «неверно»
    let x0 = 0; let y0 = 0; let dx = 0; let dragging = false;
    const paint = () => {
      card.style.transform = `translateX(${dx}px) translateY(${Math.abs(dx) * .04}px) rotate(${dx / 22}deg)`;
      card.querySelector('.stmp.y').style.opacity = clamp(dx / 90, 0, 1);
      card.querySelector('.stmp.n').style.opacity = clamp(-dx / 90, 0, 1);
    };
    const next = () => {
      k = (k + 1) % TF.length;
      card.querySelector('.fw').textContent = TF[k][0]; card.querySelector('.ft').textContent = TF[k][1];
      card.style.transition = 'none'; dx = 0; paint(); card.style.opacity = '0'; card.style.transform = 'scale(.94)';
      requestAnimationFrame(() => requestAnimationFrame(() => { card.style.transition = `transform 380ms ${EASE}, opacity 240ms`; card.style.opacity = '1'; card.style.transform = 'none'; }));
    };
    const fly = (dir) => {
      card.style.transition = `transform 320ms cubic-bezier(.4,0,.7,.4)`; dx = dir * 520; paint();
      setTimeout(next, 320);
    };
    card.addEventListener('pointerdown', (e) => { dragging = true; x0 = e.clientX; y0 = e.clientY; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
    card.addEventListener('pointermove', (e) => { if (!dragging) return; dx = e.clientX - x0; paint(); });
    const end = () => {
      if (!dragging) return; dragging = false;
      if (Math.abs(dx) > 110) { fly(Math.sign(dx)); return; }
      card.style.transition = `transform 420ms cubic-bezier(.3,1.4,.5,1)`; dx = 0; paint();
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
    ph.querySelectorAll('[data-tf]').forEach((b) => b.addEventListener('click', () => fly(b.dataset.tf === '1' ? 1 : -1)));
    void y0;
  }

  // ---------- новая карточка: живое превью ----------
  function initLive(ph) {
    const fw = ph.querySelectorAll('[data-live] .fw'); const fs = ph.querySelector('[data-live] .fb');
    const en = ph.querySelector('[data-en]'); const ru = ph.querySelector('[data-ru]'); const ex = ph.querySelector('[data-ex]');
    if (!en || !ru || fw.length < 2) return;
    en.addEventListener('input', () => { fw[0].textContent = en.value || 'Слово'; ph.querySelector('[data-live] .flip').classList.remove('on'); });
    ru.addEventListener('input', () => { fw[1].textContent = ru.value || 'Перевод'; ph.querySelector('[data-live] .flip').classList.add('on'); });
    ex.addEventListener('input', () => { let s = fs.querySelector('.fs'); if (!s) { s = document.createElement('div'); s.className = 'fs'; fs.appendChild(s); } s.textContent = ex.value; ph.querySelector('[data-live] .flip').classList.add('on'); });
  }

  // ---------- чипы, сегменты, выбор наборов, «тряска» ----------
  document.body.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-chip]');
    if (chip) { chip.parentElement.querySelectorAll('[data-chip]').forEach((c) => c.classList.toggle('on', c === chip)); return; }
    const seg = e.target.closest('[data-seg] > span');
    if (seg) { seg.parentElement.querySelectorAll('span').forEach((s) => s.classList.toggle('on', s === seg)); return; }
    const p = e.target.closest('[data-pk]');
    if (p) { p.classList.toggle('on'); return; }
    const sh = e.target.closest('[data-shake]');
    if (sh) { sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake'); }
  });

  document.querySelectorAll('.ph').forEach((ph) => { initZoom(ph); initLive(ph); });
  document.querySelectorAll('.rail').forEach(initRail);
  document.querySelectorAll('[data-swz]').forEach(initSwipe);
  console.info(LOG, 'телефонов:', document.querySelectorAll('.ph').length, 'сеток:', document.querySelectorAll('.zg[data-step]').length);
})();
</script>
</body>
</html>
