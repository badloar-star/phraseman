<head>

<link rel="stylesheet" href="kit.css">
<style>
  /* зачем (аудит покрытия 12.10, раздел «Карточки»): дорисованы состояния, которых нет в cards-v2.html — сбои и пустота при старте тренировки,
     хаб с исчерпанным лимитом, окно итога модерации, шторка «В какой набор?», выпадающий «Фильтр», тосты и «Голос озвучки · EN».
     Стиль «Тень» (SHADOW_STYLE_SPEC.md): ни одной обводки; плашка = градиент 180° белый 8,5 % → 4 % + тень 0 16 28 −14; вложенное — 0 6 12 −6;
     выбранное приподнято (translateY −3) и глубже тень. Классы страницы начинаются с gs-, kit.css не переопределяется. Все тексты — из русской ветки кода (источники в отчёте). */
  .ph { --gs-s1: rgba(255,255,255,.085); --gs-s2: rgba(255,255,255,.04); --gs-so1: rgba(255,255,255,.15); --gs-so2: rgba(255,255,255,.07);
    --gs-sh: 0 16px 28px -14px rgba(0,0,0,.75); --gs-sh2: 0 6px 12px -6px rgba(0,0,0,.6); --gs-sho: 0 26px 40px -14px rgba(0,0,0,.9); --gs-ti: rgba(255,255,255,.07); }
  .gs-pl { background: linear-gradient(180deg, var(--gs-s1), var(--gs-s2)); box-shadow: var(--gs-sh); }
  .gs-pl.on { background: linear-gradient(180deg, var(--gs-so1), var(--gs-so2)); box-shadow: var(--gs-sho); transform: translateY(-3px); }
  .gs-tl { width: 44px; height: 44px; border-radius: 14px; background: var(--gs-ti); box-shadow: var(--gs-sh2); display: flex; align-items: center; justify-content: center; flex: none; color: var(--text); }
  .gs-pl .gs-tl { box-shadow: none; }
  .gs-tl.b61 { width: 61px; height: 61px; border-radius: 16px; }
  .gs-tl.b42 { width: 42px; height: 42px; border-radius: 13px; }
  .gs-tl.b46 { width: 46px; height: 46px; border-radius: 12px; }
  .gs-rb { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(180deg, var(--gs-s1), var(--gs-s2)); box-shadow: var(--gs-sh2); display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--text); }
  .gs-rb.l { width: 48px; height: 48px; }
  .gs-rb.s { width: 36px; height: 36px; }

  .gs-ttl { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.5px; margin-top: 14px; }
  .gs-ttl span { color: var(--muted); font-weight: 600; margin-left: 12px; font-size: 22px; letter-spacing: 0; }

  /* ---------- служебное состояние по центру (PracticeStatePanel) ---------- */

  .gs-stage { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 28px 40px; }
  .gs-st-m { margin-top: 18px; font-size: 16px; line-height: 22px; font-weight: 700; }
  .gs-st-t { margin-top: 18px; font-size: 20px; line-height: 26px; font-weight: 700; }
  .gs-st-s { margin-top: 8px; font-size: 16px; line-height: 22px; color: var(--sec); }
  .gs-st-b { margin-top: 22px; }
  .gs-bad { color: var(--bad); }

  /* ---------- шапка занятия ---------- */
  .gs-shdr { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .gs-shdr .tl { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; }
  .gs-shdr .cnt { font-size: 15px; color: var(--sec); font-weight: 600; font-variant-numeric: tabular-nums; }
  .gs-pillc { display: inline-flex; align-items: center; gap: 7px; height: 37px; padding: 0 12px; border-radius: 19px; background: var(--gs-ti); box-shadow: var(--gs-sh2); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gs-pillc img { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .gs-pillc.h { gap: 4px; padding: 0 11px; }

  .gs-trk { height: 6px; border-radius: 3px; background: var(--track); margin-top: 18px; position: relative; }
  .gs-trk i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: #E9E9EB; }

  /* ---------- экран выбора наборов (Правда / ложь) ---------- */
  .gs-flab { font-size: 13px; line-height: 17px; font-weight: 600; color: var(--muted); margin: 26px 4px 10px; }
  .gs-err { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--bad); margin: 0 4px 10px; }
  .gs-src { display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 12px; border-radius: 18px; margin-top: 10px; }
  .gs-src .t1 { font-size: 16px; line-height: 21px; font-weight: 700; }
  .gs-src .t2 { font-size: 13px; line-height: 17px; color: var(--muted); margin-top: 2px; }
  .gs-chk { width: 24px; height: 24px; border-radius: 50%; background: var(--gs-ti); display: flex; align-items: center; justify-content: center; flex: none; color: transparent; }
  .gs-chk.on { background: var(--cta); color: var(--cta-ink); }
  .gs-bot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; padding: 18px 20px 34px; background: linear-gradient(rgba(12,12,13,0), #0C0C0D 30%); }

  /* ---------- шторки ---------- */
  .gs-sheadt { text-align: center; font-size: 22px; line-height: 28px; font-weight: 700; }
  .gs-sheads { text-align: center; font-size: 16px; line-height: 21px; color: var(--sec); margin-top: 4px; }
  .gs-sheadr { text-align: center; font-size: 16px; line-height: 21px; font-weight: 700; margin-top: 4px; }
  .gs-mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
  .gs-mgrid.dis { opacity: .48; }
  /* зачем (D175, координатор 13.10: плитки режимов — образец к коду): тона сняты с кадра приложения cards-v2-027 (FlashcardsTrainingModeSheet: шторка shadowSheetGradient, плитки sheetPlateFill, плашка значка iconTileColors) */
  .gs-mgrid .gs-mt { background: linear-gradient(180deg, #34363A, #2C2E33); box-shadow: 0 8px 18px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); }
  .gs-mgrid .gs-tl { background: linear-gradient(160deg, #858589, #5E5E60); color: #fff; box-shadow: 0 4px 10px -4px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18); }
  .gs-mt { border-radius: 20px; padding: 16px; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; }

  /* ---------- окно итога модерации (GlassAlertDialog) ---------- */
  .gs-scrim { position: absolute; inset: 0; z-index: 48; background: rgba(0,0,0,.62); }
  .gs-al { position: absolute; left: 50%; top: 50%; width: 360px; transform: translate(-50%, -50%); z-index: 56; padding: 20px; border-radius: 25px; text-align: center;
    background: linear-gradient(180deg, #262629, #1C1C1E); box-shadow: var(--gs-sho); }
  .gs-al .at { font-size: 23px; line-height: 29px; font-weight: 800; }
  .gs-al .ab { margin-top: 9px; font-size: 16px; line-height: 22px; color: var(--sec); white-space: pre-line; }
  .gs-al .cta { margin-top: 18px; height: 44px; border-radius: 22px; font-size: 16px; }

  /* зачем (Темы DIFF_COLOR_TRIAGE группа В + координатор 13.10, cards-gap-011): шторка режима тренировки — нейтральный градиент #28282E→#1E1E24 стиля «Тень» (как .sheet в shadow-skin.css), а не плоский kit #1B1B1D */
  .ph .sheet[data-sheet="mw"], .ph .sheet[data-sheet="mf"] { background: linear-gradient(180deg, #43454A, #2F3136); } /* D175: тон шторки с кадра приложения */
  /* ---------- тост ActionToast ---------- */
  /* зачем: по коду ActionToast: карточка от 76, радиус 20, слева рейка 3, плитка значка 44, подпись-тон 13/800 капсом и сообщение 16/22; цвета не зависят от типа — отличаются только значок и подпись тона */
  .gs-toast { position: absolute; left: 14px; right: 14px; bottom: 42px; z-index: 60; min-height: 76px; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, #2D2D30, #232326); box-shadow: var(--gs-sho); }
  .gs-toast .rail { align-self: stretch; width: 3px; border-radius: 3px; background: var(--cta); flex: none; }
  .gs-toast .tb { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; flex: none; }
  .gs-toast .tc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .gs-toast .tk { font-size: 13px; line-height: 17px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
  .gs-toast .tm { font-size: 16px; line-height: 22px; }

  /* ---------- выпадающий «Фильтр» ---------- */
  .gs-dd { position: absolute; top: 106px; right: 16px; z-index: 60; min-width: 200px; max-height: 420px; border-radius: 14px; overflow: hidden; background: #1B1B1D; box-shadow: var(--gs-sho); }
  .gs-dd .r { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; font-size: 16px; }
  .gs-dd .r.i { padding: 10px 24px; box-shadow: inset 0 .5px 0 rgba(255,255,255,.07); }
  .gs-dd .r.on { font-weight: 700; }
  .gs-dd .g { padding: 10px 16px 4px; font-size: 13px; line-height: 17px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--sec); background: #202023; box-shadow: inset 0 .5px 0 rgba(255,255,255,.07); }

  /* ---------- слова, сетка, наборы (фон кадров) ---------- */
  .gs-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 96px; gap: 10px; }
  .gs-wc { position: relative; border-radius: 14px; padding: 0 44px 0 16px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .gs-wc .lg { font-size: 11px; line-height: 14px; color: var(--sec); font-weight: 600; }
  .gs-wc .w { font-size: 20px; line-height: 25px; font-weight: 600; margin-top: 4px; }
  .gs-wc .tr { font-size: 13.5px; line-height: 18px; color: var(--sec); }
  .gs-wc .vb { position: absolute; right: 12px; bottom: 12px; width: 28px; height: 28px; border-radius: 50%; background: var(--gs-ti); display: flex; align-items: center; justify-content: center; }
  .gs-wc .vb svg { width: 14px; height: 14px; }
  .gs-zs { display: flex; align-items: center; height: 34px; color: var(--sec); margin: 10px 0 12px; }
  .gs-zi { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex: none; }
  .gs-ztr { position: relative; flex: 1; height: 34px; margin: 0 12px; }
  .gs-ztr::before { content: ""; position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--track); }
  .gs-zf { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.55); }
  .gs-zd { position: absolute; top: 14.5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #48484C; }
  .gs-zth { position: absolute; top: 5px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: #F4F4F6; box-shadow: 0 2px 8px rgba(0,0,0,.55); }
  .gs-fab { position: absolute; left: 0; right: 0; bottom: 30px; z-index: 20; display: flex; justify-content: center; }
  .gs-mc { display: flex; align-items: center; padding: 0 10px; height: 38px; border-radius: 9px; font-size: 12px; line-height: 15px; font-weight: 600; min-width: 0; white-space: nowrap; background: var(--gs-ti); }
  .gs-deck { position: relative; padding-top: 12px; }
  .gs-deck .dk { position: absolute; left: 50%; height: 30px; border-radius: 16px; background: linear-gradient(180deg, var(--gs-s1), var(--gs-s2)); }
  .gs-deck .dk.a { top: 0; width: 86%; margin-left: -43%; opacity: .55; }
  .gs-deck .dk.b { top: 6px; width: 93%; margin-left: -46.5%; opacity: .9; }
  .gs-deck .dc { position: relative; border-radius: 20px; padding: 16px 16px 16px 18px; background: #18181A; box-shadow: var(--gs-sh); }
  .gs-deck .dt1 { font-size: 21px; line-height: 26px; font-weight: 700; letter-spacing: -.2px; }
  .gs-deck .ds { font-size: 14px; color: var(--sec); margin-top: 3px; display: flex; align-items: center; gap: 8px; }
  .gs-deck .dw { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .gs-av { width: 22px; height: 22px; border-radius: 50%; background: var(--gs-ti); display: inline-flex; align-items: center; justify-content: center; color: #8C8C90; flex: none; }
  .gs-likes { display: inline-flex; align-items: center; gap: 5px; color: var(--sec); font-size: 14px; font-variant-numeric: tabular-nums; }
  .gs-stk > * + * { margin-top: 14px; }
  .gs-srch { display: flex; align-items: center; gap: 10px; height: 44px; border-radius: 22px; padding: 0 16px; color: var(--muted); font-size: 16px; margin-top: 16px; }
  .gs-chips { display: flex; gap: 8px; margin: 14px -20px 0; padding: 4px 20px; overflow: hidden; }
  .gs-chip { height: 36px; padding: 0 16px; border-radius: 18px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--sec); white-space: nowrap; flex: none; background: var(--gs-ti); box-shadow: var(--gs-sh2); }
  .gs-chip.on { background: var(--cta); color: var(--cta-ink); }
  .gs-lvl { min-width: 38px; height: 26px; padding: 0 9px; border-radius: 8px; background: var(--gs-ti); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #DADADC; flex: none; }

  /* ---------- хаб ---------- */
  .gs-hstk { position: relative; padding-top: 22px; margin-top: 22px; }
  .gs-sl { position: absolute; left: 50%; height: 40px; border-radius: 18px; background: linear-gradient(180deg, var(--gs-s1), var(--gs-s2)); box-shadow: var(--gs-sh2); }
  .gs-sl.a { top: 0; width: 84%; margin-left: -42%; opacity: .55; }
  .gs-sl.b { top: 10px; width: 92%; margin-left: -46%; opacity: .85; }
  .gs-hc { position: relative; height: 192px; border-radius: 22px; padding: 18px 20px 20px; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--gs-so1), var(--gs-so2)); box-shadow: var(--gs-sho); }
  .gs-hc .hw { font-size: 38px; line-height: 44px; font-weight: 700; letter-spacing: -.8px; margin-top: auto; }
  .gs-hc .hs { font-size: 16px; line-height: 22px; color: var(--sec); margin-top: 4px; }
  .gs-lockcta { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 8px 20px; border-radius: 28px; text-align: center; font-size: 17px; line-height: 22px; font-weight: 700;
    background: linear-gradient(180deg, var(--gs-so1), var(--gs-so2)); box-shadow: var(--gs-sh2); }
  .gs-sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 30px 2px 14px; }
  .gs-sec .ti { font-size: 20px; line-height: 26px; font-weight: 700; }
  .gs-sec .ac { font-size: 14px; color: var(--sec); display: flex; align-items: center; gap: 4px; }
  .gs-yg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .gs-yt { border-radius: 22px; padding: 12px 12px 14px; }
  .gs-ymos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 92px; align-content: start; }
  .gs-ymos .gs-mc { height: 43px; }
  .gs-ystk { position: relative; height: 92px; }
  .gs-ystk .cv { position: absolute; left: 0; right: 0; height: 52px; border-radius: 11px; padding: 8px 10px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; box-shadow: 0 -6px 14px -8px rgba(0,0,0,.8); }
  .gs-ystk .cv b { font-weight: 600; color: var(--sec); font-variant-numeric: tabular-nums; }
  .gs-yft { display: flex; align-items: flex-end; gap: 8px; margin-top: 14px; padding: 0 4px; }
  .gs-ytt { font-size: 17px; line-height: 22px; font-weight: 700; }
  .gs-ysu { font-size: 15px; color: var(--sec); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .gs-yft .i { color: var(--sec); margin-bottom: 2px; }
  .gs-rail { display: flex; gap: 12px; margin: 0 -20px; padding: 0 20px 4px; overflow: hidden; }
  .gs-vc { width: 252px; flex: none; }

  .gs-vsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .gs-dur { position: absolute; right: 8px; bottom: 10px; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.72); font-size: 12px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .gs-vt { font-size: 16px; line-height: 21px; font-weight: 600; margin-top: 10px; }
  .gs-vm { font-size: 14px; color: var(--sec); margin-top: 2px; }
  .gs-cr { display: flex; align-items: center; gap: 14px; padding: 12px 2px; }
  .gs-cr + .gs-cr { box-shadow: inset 0 1px 0 var(--gs-ti); }
  .gs-cr .rk { width: 18px; font-size: 20px; font-weight: 700; color: var(--muted); text-align: center; flex: none; }
  .gs-cr .cov { width: 92px; flex: none; }
  .gs-cr .cov .gs-mc { height: 46px; font-size: 13px; padding: 0 10px; border-radius: 10px; }
  .gs-cr .tt { font-size: 17px; line-height: 22px; font-weight: 700; }
  .gs-cr .st { font-size: 14px; line-height: 18px; color: var(--sec); margin-top: 2px; }

  /* ---------- «Голос озвучки · EN» ---------- */
  .gs-vh { display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .gs-vh .ti { font-size: 20px; line-height: 26px; font-weight: 700; }
  .gs-vlab { font-size: 13px; line-height: 17px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 22px 0 0; }
  .gs-rates { display: flex; gap: 8px; margin-top: 10px; }

  .gs-rate s { display: block; text-decoration: none; font-size: 12px; line-height: 16px; margin-top: 1px; color: var(--muted); }
  .gs-rate.on { color: var(--text); } .gs-rate.on b { font-weight: 800; } .gs-rate.on s { color: var(--sec); }
  .gs-vrow { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 12px 14px; margin-top: 10px; min-height: 62px; }
  .gs-vrow .rd { color: var(--muted); flex: none; } .gs-vrow.on .rd { color: var(--text); }
  .gs-vrow .tx { flex: 1; min-width: 0; }
  .gs-vrow .nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 16px; line-height: 21px; font-weight: 700; }
  .gs-vrow .lg { font-size: 13px; line-height: 17px; color: var(--muted); margin-top: 2px; }
  .gs-enh { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; background: var(--gs-ti); box-shadow: var(--gs-sh2); font-size: 12px; font-weight: 800; color: var(--text); }
  .gs-vprev { width: 36px; height: 36px; border-radius: 50%; background: var(--gs-ti); box-shadow: var(--gs-sh2); display: flex; align-items: center; justify-content: center; flex: none; color: var(--text); }

</style>

    fixed: `<div class="gs-bot" style="padding-bottom:50px"><div class="cta t" style="height:54px;border-radius:20px">${ic('play', 's18')}Начать</div></div>` });
  // 8–9. Напиши
  const recallEmpty = (energy) => phone(recallHdr(energy), { time: '9:41', fixed: stage({ top: 190, icon: X.layers26, msg: 'В выбранных наборах нет карточек с переводом.', btn: 'Выбрать наборы', btnIcon: X.albums20 }) });
  const recallUnavailable = () => phone(recallHdr(), { time: '9:41', fixed: stage({ top: 190, icon: X.layers26, msg: 'Сейчас недоступно', btn: 'Попробовать снова', btnIcon: X.refresh }) });
  // 10. Устно — пусто
  // зачем (аудит 7a207bc4a): при пустой очереди счёта «1 / 1» и полосы нет — в шапке только название и сердца + энергия
  const speakEmpty = () => phone(`${sessHdr('Устно', '', hud())}`, { time: '9:41', fixed: stage({ top: 150, icon: X.mic26, msg: 'Здесь пока нечего говорить — выбери наборы', btn: 'Выбрать наборы', btnIcon: X.albums20 }) });
  // 11–12. Шторка режима при раннем тапе
  const modeTile = (i, n, s) => `<div class="gs-mt gs-pl"><span class="gs-tl b46">${ic(i, 's22')}</span><div><div class="n">${n}</div><div class="s">${s}</div></div></div>`;
  const modeSheetInner = (sub, retry) => `<div class="gs-sheadt">Режим тренировки</div><div class="gs-sheads">${sub}</div>${retry ? `<div class="gs-sheadr t">${retry}</div>` : ''}
    <div class="gs-mgrid dis">${modeTile('bolt', 'Блиц', '60 секунд')}${modeTile('mic', 'Устно', 'Вслух')}${modeTile('check', 'Правда / ложь', 'Да или нет')}${modeTile('edit', 'Напиши', 'По памяти')}</div>`;
  const modeFrame = (sub, retry) => phone(`<div style="opacity:.35">${bgHub()}</div>`, { time: '9:41', overlay: sheet('m' + (retry ? 'f' : 'w'), modeSheetInner(sub, retry), true) });

  // 13. Хаб: лимит исчерпан
  const hubLimit = () => phone(`${hubTop}${heroBody({ ov: 'Продолжить', w: 'Лимит на этот месяц исчерпан', s: 'Обновится 1 ноября' })}
      <div class="flex" style="gap:10px;margin-top:14px"><div class="gs-lockcta t grow">${X.lock18}Осталось 0 из 30 · до 1 ноября</div><span class="gs-rb l t">${ic('layers', 's20')}</span></div>${yours()}${videoRail()}${commChart()}`, { time: '9:41' });

  // 14–17. Итог модерации
  const alertFrame = (title, body) => phone(bgHub(), { time: '9:41', overlay: `<div class="gs-scrim"></div><div class="gs-al"><div class="at">${title}</div><div class="ab">${body}</div><span class="cta t">Закрыть</span></div>` });
  const SID = 'Заявка: 4tK9mQe2Rw7LxB1c';
  const modApproved = () => alertFrame('Твой набор одобрен', `Путешествия\n\n${SID}\n\nБез дополнительного комментария.`);
  const modRejected = () => alertFrame('Твой набор отклонён', `Путешествия\n\n${SID}\n\nКомментарий:\nВ нескольких карточках перевод не совпадает с английской фразой.`);
  const modRevision = () => alertFrame('Нужна доработка', `Путешествия\n\n${SID}\n\nДоработай набор и отправь снова.`);
  const modRemoved = () => alertFrame('Набор снят с продажи', `Путешествия\n\n${SID}`);

  // 18–22. «В какой набор?»
  const sr = (i, t) => `<div class="gs-sr gs-pl t"><span class="gs-tl b42">${i.startsWith('<') ? i : ic(i, 's20')}</span><div class="x">${t}</div></div>`;
  const pickList = () => `<div class="gs-pick-t">В какой набор?</div>${sr(X.albums20, 'Путешествия')}${sr(X.albums20, 'Работа')}${sr(X.albums20, 'Фразовые глаголы')}`;
  const pickOnlyPublished = () => `<div class="gs-pick-t">В какой набор?</div><div class="gs-pick-e">Нет наборов, куда можно добавить</div>${sr('plus', 'Создать набор')}`;
  const pickEmpty = () => `<div class="gs-pick-t">В какой набор?</div><div class="gs-pick-e">Своих наборов пока нет</div>${sr('plus', 'Создать набор')}`;
  const toast = (kind, msg) => { const [i, l] = { success: [X.checkC, 'Готово'], error: [X.alertC, 'Что-то пошло не так'], info: [X.infoC, 'Сообщение'] }[kind]; return `<div class="gs-toast"><i class="rail"></i><span class="tb">${i}</span><div class="tc"><div class="tk">${l}</div><div class="tm">${msg}</div></div></div>`; };
  const dimSaved = () => `<div style="opacity:.5">${bgSaved()}</div>`;
  const pickFrame = (inner, t, bg) => phone(bg || dimSaved(), { time: '9:41', overlay: sheet('pk', `<div>${inner}</div>`, true) + (t || '') });
  const pickAdded = () => phone(bgSaved(), { time: '9:41', fixed: savedFab, overlay: toast('success', 'Добавлено в набор') });

  // 23–24. Фильтр
  const dd = (act) => { const r = (k, l, inner) => `<div class="r${inner ? ' i' : ''}${act === k ? ' on' : ''}"><span>${l}</span>${act === k ? ic('check', 's16') : ''}</div>`;
    return `<div class="gs-dd">${r('all', 'Все')}<div class="g">Уроки</div>${r('l1', 'Урок 1', 1)}${r('l3', 'Урок 3', 1)}${r('l12', 'Урок 12', 1)}<div class="g">Прочее</div>${r('verb', 'Глаголы', 1)}${r('dialog', 'Диалоги', 1)}${r('word', 'Слова', 1)}${r('daily', 'Фраза дня', 1)}${r('video', 'Фразы из видео', 1)}</div>`; };
  const filterFrame = (act, list) => phone(bgSaved(list), { time: '9:41', fixed: savedFab, overlay: dd(act) });

  // 25–35. Тосты
  const msgFrame = (bg, kind, text) => phone(bg, { time: '9:41', overlay: toast(kind, text) });
  const T_PUB = { ok: 'Набор отправлен на публикацию.', lim: 'Сегодня можно опубликовать не больше 3 наборов, попробуй завтра.', inv: 'Для публикации нужны название, описание и достаточное число карточек.', fail: 'Не удалось отправить набор на публикацию.' };
  const T_DEL = { cnt: 'В наборе должно остаться минимум 10 карточек.', pend: 'Набор на проверке — удалить сейчас нельзя.', net: 'Нет связи — карточку не удалось удалить.' };

  // 36–38. Голос озвучки
  const vhead = `<div class="gs-vh"><span class="rb bare t">${ic('back', 's28')}</span><span class="ti">Голос озвучки · EN</span><span style="width:28px"></span></div>`;
  const rate = (lbl, v, on) => `<div class="gs-rate gs-pl t${on ? ' on' : ''}"><b>${lbl}</b><s>${v}x</s></div>`;
  const vrow = (name, lng, enh, on) => `<div class="gs-vrow gs-pl t${on ? ' on' : ''}"><span class="rd">${on ? X.radioOn : X.radioOff}</span><div class="tx"><div class="nm">${name}${enh ? '<span class="gs-enh">Улучшенный</span>' : ''}</div>${lng ? `<div class="lg">${lng}</div>` : ''}</div><span class="gs-vprev">${ic('vol', 's18')}</span></div>`;
  const voiceBody = (sel, voices) => `${vhead}<div class="gs-vlab" style="margin-top:4px">Скорость речи</div>
      <div class="gs-rates">${rate('Медленно', '0.7', false)}${rate('Норма', '0.9', true)}${rate('Быстро', '1.0', false)}</div>
      <div class="gs-vlab">Голос</div>
      ${vrow('Системный (авто)', '', false, sel === 'sys')}${voices.map(([n, l, e]) => vrow(n, l, e, sel === n)).join('')}
      <div class="cta t" style="margin-top:20px">${ic('play', 's18')}Прослушать пример</div>
      <div class="gs-samp">«Look forward to seeing you»</div>`;
  const VOICES = [['Samantha', 'en-US', true], ['Daniel', 'en-GB', true], ['Karen', 'en-AU', false], ['Moira', 'en-IE', false]];
  const voiceMain = () => phone(voiceBody('Samantha', VOICES), { time: '9:41' });
  const voiceOnlySystem = () => phone(voiceBody('sys', []), { time: '9:41' });
  const voiceLoading = () => phone(`${vhead}<div class="gs-sk" style="width:140px;height:13px;margin:4px 0 0"></div>
      <div style="display:flex;gap:8px;margin-top:10px">${[0, 1, 2].map(() => '<div class="gs-sk" style="width:92px;height:38px;border-radius:12px"></div>').join('')}</div>
      <div class="gs-sk" style="width:110px;height:13px;margin:22px 0 0"></div>
      ${[0, 1, 2, 3, 4].map(() => '<div class="gs-sk" style="width:100%;height:62px;border-radius:16px;margin-top:10px"></div>').join('')}`, { time: '9:41' });

  // =====================================================================
  const BLOCKS = [
    ['start', 'Старт тренировки: не открылась или пусто', 'Служебные состояния режимов — плитка, сообщение, одна кнопка (PracticeStatePanel). Сбои «Правды / лжи» в приложении — красная строка на экране выбора наборов, не тост.', [
      col('Блиц — «Тренировка не открылась»', quotaFail()),
      col('Устно — «Тренировка не открылась» (вид тот же)', quotaFail()),
      col('Правда / ложь — быстрый старт: «Готовим тренировку…»', swipePreparing()),
      col('Правда / ложь — быстрый старт: нет карточек', swipeNoCards()),
      col('Правда / ложь — «Не удалось подготовить тренировку. Энергия возвращена.»', swipeSelect('Не удалось подготовить тренировку. Энергия возвращена.')),
      col('Правда / ложь — «Не удалось проверить лимит тренировки»', swipeSelect('Не удалось проверить лимит тренировки. Попробуй ещё раз.')),
      col('Правда / ложь — нет карточек с переводом', swipeSelect('В выбранных наборах нет карточек с переводом.')),
      col('Напиши — нет карточек с переводом', recallEmpty()),
      col('Напиши — «Сейчас недоступно»', recallUnavailable()),
      col('Устно — «Здесь пока нечего говорить»', speakEmpty()),
      col('Шторка режима — «Готовим тренировку…»', modeFrame('Готовим тренировку…', '')),
      col('Шторка режима — «Не получилось подготовить тренировку»', modeFrame('Не получилось подготовить тренировку', 'Повторить'))]],
    ['hub', 'Хаб: лимит тренировок исчерпан', 'Главная карточка читается как «лимит вышел», кнопка закрыта замком, дата — первое число следующего месяца.', [
      col('Хаб — «Осталось 0 из 30 · до 1 ноября» — заменено вариантом А (cards-section №4)', hubLimit())]],
    ['moder', 'Итог модерации набора', 'Окно по центру поверх любого экрана — приходит из входящих автора и показывается по очереди. Одна кнопка «Закрыть».', [
      col('Твой набор одобрен', modApproved()), col('Твой набор отклонён (с комментарием)', modRejected()),
      col('Нужна доработка', modRevision()), col('Набор снят с продажи', modRemoved())]],
    ['pick', '«В какой набор?»', 'Кнопка «В набор» на раскрытой карточке открывает в той же шторке список своих наборов. Исходы — тосты.', [
      col('Список своих наборов', pickFrame(pickList())),
      col('Своих наборов пока нет', pickFrame(pickEmpty())),
      col('Добавлено — шторка закрылась', pickAdded()),
      col('Эта карточка уже в наборе', pickFrame(pickList(), toast('info', 'Эта карточка уже в наборе'))),
      col('Не удалось добавить карточку', pickFrame(pickList(), toast('error', 'Не удалось добавить карточку')))]],
    ['filter', 'Фильтр «Сохранённых»', 'Меню «⋯» → «Фильтр»: список под кнопкой справа сверху, без затемнения. Галочка — у выбранного.', [
      col('Фильтр — выбрано «Все»', filterFrame('all')),
      col('Фильтр — выбран «Урок 3», список отфильтрован', filterFrame('l3', W.slice(2, 8)))]],
    ['msg', 'Тосты и сообщения', 'Тост снизу: рейка, значок, подпись тона («Готово» / «Сообщение» / «Что-то пошло не так») и текст.', [
      col('Мои наборы — «Открыть сообществу»: отправлено', msgFrame(bgMine(), 'success', T_PUB.ok)),
      col('Мои наборы — суточный лимит публикаций', msgFrame(bgMine(), 'info', T_PUB.lim)),
      col('Свой набор — для публикации не хватает данных', msgFrame(bgPackOwn(), 'error', T_PUB.inv)), /* зачем (кадры cards-gap-027/028): ошибка публикации показывается на экране самого набора */
      col('Свой набор — не удалось отправить', msgFrame(bgPackOwn(), 'error', T_PUB.fail)),
      col('Свой набор — «минимум 10 карточек»', msgFrame(bgPackOwn(), 'error', T_DEL.cnt)),
      col('Свой набор — «Набор на проверке»', msgFrame(bgPackOwn(), 'error', T_DEL.pend)),
      col('Свой набор — «Нет связи»', msgFrame(bgPackOwn(), 'error', T_DEL.net)),
      col('Чужой набор — лайк до добавления', msgFrame(bgPackOther(false), 'info', 'Сначала добавь набор себе — потом можно поставить лайк.')),
      col('Чужой набор — лайк не прошёл', msgFrame(bgPackOther(true), 'error', 'Не удалось поставить лайк. Попробуй ещё раз')),
      col('Каталог — набор ещё не скачан', msgFrame(bgCatalog(), 'info', 'Набор ещё не скачан — нужен интернет.')),
      col('Каталог — не сохранился на телефоне', msgFrame(bgCatalog(), 'error', 'Не получилось сохранить набор на телефоне. Попробуй ещё раз.'))]],
    ['voice', 'Голос озвучки · EN', 'Вход — «Настройки» → «Обучение» → «Голос озвучки (EN)». Скорость речи — общая настройка. Тап по строке выбирает голос и сразу произносит образец.', [
      col('Выбор голоса (выбран «Samantha»)', voiceMain()),
      col('Загрузка списка голосов', voiceLoading()),
      col('Список пуст — только «Системный (авто)»', voiceOnlySystem())]],
    ['pick2', '«В какой набор?»: есть только опубликованные наборы', 'У автора нет ни одного набора, куда можно добавить карточку, но опубликованные есть (в них добавлять нельзя). Текст другой, кнопка «Создать набор» остаётся.', [
      col('Нет наборов, куда можно добавить', pickFrame(pickOnlyPublished(), '', `<div style="opacity:.5">${bgPackOwn()}</div>`)) /* зачем (cards-gap-039): в коде шторка открывается с экрана набора */]],
    ['flag', 'Под флагом energy_mistake_charge (выкл. по умолчанию)', 'В первом выпуске флаг выключен — в шапках сессий сердца (кадры выше). Если его включить, вместо сердец стоит пилюля энергии с числом (EnergyMistakeHud, energy_mode.ts); при ошибке «−1». Кадр показан только как запасной вариант.', [
      col('Напиши — нет карточек: под флагом energy_mistake_charge (выкл.) — пилюля энергии вместо сердец', recallEmpty(true))]],
  ];
  document.getElementById('nav').innerHTML = BLOCKS.map(([id, t]) => `<a href="#${id}">${t}</a>`).join('');
  document.getElementById('root').innerHTML = BLOCKS.map(([id, t, l, c]) => block(id, t, l, c)).join('');
  K.init();
})();
</script>
</body>
</html>
