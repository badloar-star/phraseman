name: Validate French removal

on:
  push:
    branches:
      - audit/remove-french-runtime-fixes-2026-08-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and collect compiler diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p artifacts

          set +e
          npm ci --ignore-scripts > artifacts/npm-ci.log 2>&1
          npm_exit=$?
          echo "$npm_exit" > artifacts/npm-ci.exit

          if [ "$npm_exit" -eq 0 ]; then
            npx tsc --noEmit --pretty false > artifacts/tsc.log 2>&1
            tsc_exit=$?
          else
            printf 'TypeScript was not run because npm ci failed.\n' > artifacts/tsc.log
            tsc_exit=125
          fi
          echo "$tsc_exit" > artifacts/tsc.exit
          set -e

          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          tracked = [path for path in tracked if path]
          text_suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.json', '.md', '.html', '.yml', '.yaml'}
          patterns = [
              re.compile(r'French|french|FRENCH'),
              re.compile(r'["\']fr["\']'),
              re.compile(r'::fr::'),
              re.compile(r'fr-FR'),
              re.compile(r'lesson_data_fr'),
              re.compile(r'lesson_intro_screens_fr'),
          ]
          deleted_import_patterns = [
              re.compile(r'(?:from\s+|import\s*\()["\'][^"\']*(?:french_|lesson_data_fr|lesson_intro_screens_fr)[^"\']*["\']'),
              re.compile(r'require\(["\'][^"\']*(?:french_|lesson_data_fr|lesson_intro_screens_fr)[^"\']*["\']\)'),
          ]

          matches = []
          broken_imports = []
          for raw_path in tracked:
              path = Path(raw_path)
              if path.suffix.lower() not in text_suffixes and path.name not in {'package.json', 'package-lock.json'}:
                  continue
              try:
                  if path.stat().st_size > 8 * 1024 * 1024:
                      continue
                  text = path.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              reasons = [pattern.pattern for pattern in patterns if pattern.search(text)]
              if reasons:
                  matches.append({'path': raw_path, 'patterns': reasons})
              for line_no, line in enumerate(text.splitlines(), start=1):
                  if any(pattern.search(line) for pattern in deleted_import_patterns):
                      broken_imports.append({'path': raw_path, 'line': line_no, 'text': line.strip()[:500]})

          Path('artifacts/remaining-french-references.json').write_text(
              json.dumps(matches, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('artifacts/deleted-french-imports.json').write_text(
              json.dumps(broken_imports, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('artifacts/remaining-french-references.txt').write_text(
              ''.join(f"{row['path']}\n" for row in matches),
              encoding='utf-8',
          )
          Path('artifacts/deleted-french-imports.txt').write_text(
              ''.join(f"{row['path']}:{row['line']}: {row['text']}\n" for row in broken_imports),
              encoding='utf-8',
          )
          PY

          {
            echo '# French removal validation'
            echo
            echo "- npm ci exit: $(cat artifacts/npm-ci.exit)"
            echo "- TypeScript exit: $(cat artifacts/tsc.exit)"
            echo "- Remaining French-reference files: $(wc -l < artifacts/remaining-french-references.txt | tr -d ' ')"
            echo "- Imports of removed French modules: $(wc -l < artifacts/deleted-french-imports.txt | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-removal-validation
          path: artifacts/
          retention-days: 7
