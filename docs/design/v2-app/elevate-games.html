<head>

<body data-theme="ink" data-page="games">
<div class="page">
  <h1 class="page-h1">Новые игры на материалах PhraseMan</h1>
  <p class="page-lead">Предложение, не эталон. Девять игр, каждая собрана из того, что уже лежит в приложении: уроки, словарь, неправильные глаголы, задания Пика, наборы карточек. Код приложения не менялся.</p>
  <div id="nav"></div>
  <div class="switch"><span class="k">Тема</span>
    <button class="on" data-theme-set="ink">Сумерки</button>
    <button data-theme-set="marine">Океан</button>
    <button data-theme-set="graphite">Затмение</button>
    <button data-theme-set="amethyst">Аметист</button>
  </div>
  <div id="root"></div>
</div>
