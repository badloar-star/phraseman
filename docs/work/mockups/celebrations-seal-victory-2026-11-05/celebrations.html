<title>Печать и Победа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* раскладка: переключатели сверху; телефон с настоящим кадром и окном поверх; справа решения и вопросы владельцу */
:root{--bg:#f4f1f7;--fg:#1c1822;--mut:#645c70;--card:#ffffff;--on:#1c1822;--on-fg:#f4f1f7;--line:rgba(28,24,34,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d11;--fg:#f3eef6;--mut:#a79fb0;--card:#1a1820;--on:#f3eef6;--on-fg:#0e0d11;--line:rgba(255,255,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d11;--fg:#f3eef6;--mut:#a79fb0;--card:#1a1820;--on:#f3eef6;--on-fg:#0e0d11;--line:rgba(255,255,255,.14);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 16px;color:var(--mut);max-width:64ch}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.row button[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:transparent}
.row button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;margin-top:12px}
.ph{position:relative;width:min(330px,100%);border-radius:30px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.3);container-type:inline-size}
.ph img.base{display:block;width:100%;height:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center}
.card{width:84cqw;border-radius:7cqw;padding:7cqw 6cqw 6cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3.6cqw}
.card[data-m="light"]{--cbg:#eef0fb;--cfg:#15151f;--cmut:#55566b;--cbtn:#1f2033;--cbtnfg:#ffffff;--cwave:#6a5fd1}
.card[data-m="dark"]{--cbg:#171a24;--cfg:#f3f5fb;--cmut:#aab0c4;--cbtn:#ecedfb;--cbtnfg:#15151f;--cwave:#a9a0f2}
.card{background:var(--cbg);color:var(--cfg);box-shadow:0 6cqw 14cqw rgba(0,0,0,.35)}
.coinbox{position:relative;width:30cqw;height:30cqw}
.coinbox img{position:absolute;inset:0;width:100%;height:100%;display:block}
.wave{position:absolute;left:50%;top:50%;width:30cqw;height:30cqw;margin:-15cqw 0 0 -15cqw;border-radius:50%;background:var(--cwave);opacity:0}
.ttl{font-size:6.6cqw;line-height:1.12;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.big{font-size:11cqw;line-height:1;font-weight:900;margin:0;font-variant-numeric:tabular-nums}
.goal{font-size:3.9cqw;color:var(--cmut);margin:0}
.btn{margin-top:1.6cqw;width:100%;height:12.4cqw;border-radius:999px;background:var(--cbtn);color:var(--cbtnfg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:4.2cqw;border:0;font-family:inherit;cursor:pointer;transition:transform .15s cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--cfg);outline-offset:2px}
/* движение: монета падает и ставит оттиск (660 мс), волна от удара */
@keyframes drop{0%{transform:translateY(-26cqw) scale(1.08);opacity:0}55%{opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes wave{0%{transform:scale(.7);opacity:.38}100%{transform:scale(1.9);opacity:0}}
@keyframes rise{0%{transform:translateY(6cqw);opacity:0}100%{transform:translateY(0);opacity:1}}
.play .coinbox img{animation:drop .66s cubic-bezier(.23,1,.32,1) both}
.play .wave{animation:wave .7s cubic-bezier(.23,1,.32,1) .62s both}
.play .ttl,.play .big,.play .goal{animation:rise .4s cubic-bezier(.23,1,.32,1) .72s both}
.play .btn{animation:rise .4s cubic-bezier(.23,1,.32,1) .9s both}
.rm .coinbox img,.rm .wave,.rm .ttl,.rm .big,.rm .goal,.rm .btn{animation:none!important}
.info{flex:1 1 280px;min-width:0;max-width:460px}
.info h2{font-size:16px;margin:0 0 8px}
.info ul{margin:0 0 16px;padding-left:20px}.info li{margin:6px 0}
@media (prefers-reduced-motion:reduce){.coinbox img,.wave,.ttl,.big,.goal,.btn{animation:none!important}}
</style>
<h1>Печать и Победа</h1>
<p class="lead">Два праздничных окна поверх настоящих кадров приложения. Основа — тёмные кадры эмулятора, светлые основы снимутся отдельно. Переключай окно, тему окна и движение, «Показать снова» запускает анимацию.</p>

var W={seal:{base:BR,ttl:"Plus подключён",btn:"Продолжить",big:null,goal:null,
 txt:["<h2>Где и когда</h2><ul><li>Один раз, после первой успешной покупки Plus на аккаунте.</li><li>Показывается на экране, откуда открыли платный экран: брифинг диалога или список уроков. Не поверх чужого экрана.</li><li>Восстановление покупки и продление окно не показывают.</li><li>Если приложение закрыли до показа, окно не ждёт в очереди: доступ уже выдан покупкой.</li></ul>","<h2>Что в окне</h2><ul><li>Монета текущего ранга падает и ставит оттиск, от удара идёт одна волна (660 мс).</li><li>Заголовок и одна кнопка «Продолжить»; она же закрывает окно.</li><li>Уменьшить движение: монета на месте, без волны.</li></ul>","<h2>Решить владельцу</h2><ul><li>Показывать ли окно после первой покупки Plus?</li><li>Куда ставить: на экран, откуда открыли платный экран (как в коде), или сразу после платного экрана поверх всего?</li></ul>"]},
 win:{base:CO,ttl:"Диалог пройден",btn:"К диалогам",big:"+30",goal:"2 из 2 целей",
 txt:["<h2>Где и когда</h2><ul><li>После кнопки «Готово» на экране итога, только если диалог дошёл до конца честно.</li><li>Выход на полпути и платный выход окно не показывают.</li><li>Экран итога остаётся как есть, окно ложится поверх.</li></ul>","<h2>Награда</h2><ul><li>+30 монет без ошибок, +25 с ошибками, +10 если диалог завершён вручную.</li><li>Монета текущего ранга, число поднимается от нуля. Счётчик монет в шапке растёт сразу, до ответа сервера.</li><li>Уменьшить движение: число сразу итоговое, без подъёма.</li></ul>","<h2>Решить владельцу</h2><ul><li>Показывать ли окно победы в диалоге?</li><li>Оставить ли его только для диалогов без ошибок или показывать всегда, с меньшей суммой?</li></ul>"]}};
var kind="seal",mode="light",rm=false;
function cnt(el,to,ms){var t0=performance.now();(function f(n){var k=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-k,3);el.textContent="+"+Math.round(to*e);if(k<1)requestAnimationFrame(f)})(t0)}
function render(replay){var w=W[kind],c=document.getElementById("card");
document.getElementById("base").src=w.base;document.getElementById("ttl").textContent=w.ttl;document.getElementById("ok").textContent=w.btn;
var big=document.getElementById("big"),goal=document.getElementById("goal");big.hidden=!w.big;goal.hidden=!w.goal;if(w.big)big.textContent=rm?w.big:"+0";if(w.goal)goal.textContent=w.goal;
c.setAttribute("data-m",mode);c.classList.toggle("rm",rm);c.classList.remove("play");void c.offsetWidth;if(!rm)c.classList.add("play");
if(w.big&&!rm)setTimeout(function(){cnt(big,30,900)},720);
document.getElementById("info").innerHTML=w.txt.join("");
document.getElementById("w-seal").setAttribute("aria-pressed",kind==="seal"?"true":"false");document.getElementById("w-win").setAttribute("aria-pressed",kind==="win"?"true":"false");
document.getElementById("m-light").setAttribute("aria-pressed",mode==="light"?"true":"false");document.getElementById("m-dark").setAttribute("aria-pressed",mode==="dark"?"true":"false");document.getElementById("rm").setAttribute("aria-pressed",rm?"true":"false");}
document.getElementById("w-seal").addEventListener("click",function(){kind="seal";render()});
document.getElementById("w-win").addEventListener("click",function(){kind="win";render()});
document.getElementById("m-light").addEventListener("click",function(){mode="light";render()});
document.getElementById("m-dark").addEventListener("click",function(){mode="dark";render()});
document.getElementById("rm").addEventListener("click",function(){rm=!rm;render()});
document.getElementById("again").addEventListener("click",function(){render()});
render();
</script>
