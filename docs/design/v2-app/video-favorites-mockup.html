<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видео: избранное</title>
<link rel="stylesheet" href="kit.css">
<style>
.lang { display: inline-flex; align-items: center; gap: 8px; height: 35px; padding: 0 12px 0 10px; border-radius: 18px; background: var(--control); font-size: 15px; font-weight: 700; flex: none; }
.lang img { width: 24px; height: 15px; border-radius: 3px; object-fit: cover; display: block; }
.chbtn { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 6px; border-radius: 22px; background: #1C1C1E; border: 1px solid var(--line); font-size: 16px; font-weight: 700; }
.chav { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(145deg, #3A3A3E, #1B1B1D); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex: none; }
.dot { position: relative; }
.dot::after { content: ""; position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #0C0C0D; }
.tabs3 { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: 18px; }
.tabs3 > div { padding: 12px 0; font-size: 16px; font-weight: 600; color: var(--sec); position: relative; }
.tabs3 > div.on { color: var(--text); }
.tabs3 > div.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 1px; background: #fff; }
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: radial-gradient(90% 120% at 80% 20%, #3B3B3F, #121214 70%); border: 1px solid var(--line); }
.thumb .cap { position: absolute; left: 16px; top: 14px; right: 60px; font-size: 22px; line-height: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: -.3px; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
.thumb.sm .cap { font-size: 14px; line-height: 16px; left: 10px; top: 9px; right: 20px; }
.thumb .du { position: absolute; right: 10px; bottom: 10px; height: 22px; padding: 0 7px; border-radius: 7px; background: rgba(0,0,0,.72); font-size: 12px; font-weight: 700; display: flex; align-items: center; }
.thumb .pl { position: absolute; left: 14px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; }
.thumb.sm .pl { width: 28px; height: 28px; left: 8px; bottom: 7px; }
.vt { font-size: 17px; line-height: 22px; font-weight: 700; margin-top: 10px; }
.vm { font-size: 14px; color: var(--sec); margin-top: 4px; }
.hero { border-radius: 22px; background: var(--card-2); border: 1px solid var(--line); padding: 12px; }
.hero .badge { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(0,0,0,.6); font-size: 12px; font-weight: 700; letter-spacing: .3px; position: absolute; left: 12px; top: 12px; z-index: 2; }
.live { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.vrow { display: flex; gap: 14px; align-items: center; }
.vrow .thumb { width: 150px; flex: none; border-radius: 12px; }
.plrow { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.plstack { position: relative; width: 128px; flex: none; }
.plstack::before, .plstack .thumb.sm .cap { font-size: 11px; line-height: 13px; top: 7px; }
.plstack::after { content: ""; position: absolute; left: 8px; right: 8px; top: -6px; height: 10px; border-radius: 10px 10px 0 0; background: #232326; }
.plstack::after { left: 16px; right: 16px; top: -11px; background: #1A1A1C; }
.player { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 0; margin: 0 -20px; }
.player .bar { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; }
.player .bar .trk { flex: 1; height: 4px; }
.pack { border-radius: 20px; background: var(--card-2); border: 1px solid var(--line); padding: 16px; }
.tc { display: flex; gap: 14px; align-items: flex-start; padding: 12px 12px; border-radius: 14px; transition: background 300ms; }
.tc .tm { font-size: 13px; font-weight: 700; color: var(--sec); width: 40px; padding-top: 2px; font-variant-numeric: tabular-nums; flex: none; }
.tc .en { font-size: 16px; font-weight: 700; }
.tc .ru { font-size: 14px; color: var(--sec); margin-top: 2px; }
.tc .bm { color: var(--sec); flex: none; margin-left: auto; }
.tc.cur { background: #232326; }
.tc.cur .tm { color: #fff; }
.bmF path { fill: currentColor; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 34px; z-index: 60; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 16px; border-radius: 16px; background: var(--control); border: 1px solid var(--line); font-size: 15px; line-height: 20px; box-shadow: 0 14px 34px rgba(0,0,0,.5); }
.note { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); font-size: 14.5px; line-height: 19px; color: var(--sec); }
.note svg { color: var(--text); }
.skel { background: linear-gradient(90deg, #17171A, #1F1F22, #17171A); background-size: 300px 100%; animation: sk 1.3s infinite linear; border-radius: 12px; }
@keyframes sk { from { background-position: -300px 0; } to { background-position: 300px 0; } }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spn .8s linear infinite; display: inline-block; flex: none; }
@keyframes spn { to { transform: rotate(360deg); } }
.pgbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--line-2); background: #161618; color: var(--text); font: 600 14px Inter, sans-serif; cursor: pointer; }
.addbtn { transition: background 260ms, color 260ms; }
.addbtn.done { background: transparent !important; color: #fff; border: 1px solid var(--outline); }
.addbtn .no, .addbtn .ok { display: inline-flex; align-items: center; gap: 8px; } .addbtn .ok { display: none; } .addbtn.done .ok { display: inline-flex; } .addbtn.done .no { display: none; }
.pop { animation: pop 420ms cubic-bezier(.3,1.5,.5,1); }
@keyframes pop { 40% { transform: scale(1.06); } }
.cov { width: 100%; max-width: 980px; border-collapse: collapse; font-size: 14px; margin-top: 18px; }
.cov td, .cov th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); color: #D6D6D8; vertical-align: top; }
.cov th { color: var(--sec); font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <h1 class="page-h1">Видео: избранное, сохранения, «Тренировать»</h1>
  <p class="page-lead">Новые элементы раздела «Видео» (логика готова у Ядра: избранное, число сохранений, кнопка тренировки набора ролика). В макетах их не было, поэтому три варианта на выбор. Всё в стиле video.html; данные — пример.</p>
  <nav class="page-nav"><a href="index.html">Все разделы</a><a href="video.html">Видео</a></nav>
  <div id="root"></div>
</div>
<script src="kit.js"></script>
<script>
const { icon, phone, col, block } = K;
const A = 'assets/';
const VIDS = [['Catch<br>a flight', '30 фраз для поездки за границу', '12:34', '2 дня назад · 4,1 тыс.', 128, true], ['How’s it<br>going?', 'Small talk без неловкости', '8:02', 'неделю назад · 2,7 тыс.', 46, false], ['Get over<br>it', 'Фразовые глаголы с get', '10:51', '2 недели назад · 9,8 тыс.', 1200, false]];
const n = (x) => x >= 1000 ? (x / 1000).toFixed(1).replace('.', ',') + ' тыс.' : String(x);
const bm = (on, size = 's20') => `<span class="${on ? 'bmF' : ''}" style="color:${on ? '#fff' : 'var(--sec)'};display:inline-flex">${icon('bookmark', size)}</span>`;
const head = (tabsOn, withSavedTab) => `<div class="flex" style="justify-content:space-between"><div style="font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.5px">Видео</div><span class="lang t"><img src="${A}language_en.webp" alt="">EN${icon('down', 's16')}</span></div><div style="margin-top:14px"><span class="chbtn t"><span class="chav">PE</span>Phraseman English${icon('down', 's16')}</span></div>
  <div class="tabs3">${(withSavedTab ? ['Главная', 'Плейлисты', 'Сохранённые'] : ['Главная', 'Плейлисты']).map((t, i) => `<div class="t${i === tabsOn ? ' on' : ''}">${t}</div>`).join('')}</div>`;
const thumb = (cap, du, extra = '') => `<div class="thumb"><span class="cap">${cap}</span><span class="pl">${icon('play', 's24')}</span><span class="du">${du}</span>${extra}</div>`;
const playerBlock = `<div class="player"><div class="thumb" style="border-radius:0;border:none;height:100%"><span class="cap" style="font-size:26px;line-height:28px">Catch<br>a flight</span></div><span class="rb t" style="position:absolute;right:12px;top:12px;width:34px;height:34px;background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.2)">${icon('close', 's16')}</span><div class="bar"><span>4:46</span><div class="trk"><i style="width:38%"></i></div><span>12:34</span></div></div>`;
const toast = (t, ic = 'check') => `<div class="toast">${icon(ic, 's18')}${t}</div>`;
const savedRow = `<div class="card t" style="margin-top:18px;display:flex;align-items:center;gap:14px;padding:12px 14px"><div class="tile">${icon('bookmark', 's20')}</div><div class="grow"><div style="font-size:16px;font-weight:700">Сохранённые видео</div><div style="font-size:14px;color:var(--sec);margin-top:2px">3 ролика</div></div><span style="color:var(--sec)">${icon('fwd', 's20')}</span></div>`;

// ── Вариант A: значок закладки справа от названия, число сохранений в строке под названием
const cardA = ([cap, t, du, m, cnt, on]) => `<div class="t">${thumb(cap, du)}<div style="display:flex;gap:10px;align-items:flex-start"><div class="grow"><div class="vt">${t}</div><div class="vm">${m} · ${n(cnt)} сохранили</div></div><span class="rb t" style="margin-top:8px;width:40px;height:40px">${bm(on)}</span></div></div>`;
const homeA = (o = {}) => phone(`${head(0)}${savedRow}<div class="sec" style="margin-top:26px"><div class="ti">Новые видео</div></div><div style="display:flex;flex-direction:column;gap:20px">${VIDS.map(cardA).join('')}</div>`, { time: '12:52', overlay: o.overlay || '' });
const watchA = (o = {}) => phone(`<div style="margin-top:-6px"></div>${playerBlock}<div style="display:flex;gap:10px;align-items:flex-start;margin-top:16px"><div class="grow"><div style="font-size:20px;line-height:26px;font-weight:700">30 фраз для поездки за границу</div><div class="vm">Phraseman English · 4,1 тыс. · ${n(o.saved ? 129 : 128)} сохранили</div></div><span class="rb t" style="width:44px;height:44px">${bm(o.saved, 's22')}</span></div>
  <span class="cta t" style="margin-top:16px">${icon('layers', 's18')}Тренировать фразы ролика</span>`, { time: '12:52', overlay: o.overlay || '' });

// ── Вариант B: на превью — закладка в углу и чип с числом; в плеере — две кнопки в ряд
const chip = (cnt) => `<span style="position:absolute;left:12px;top:12px;height:26px;padding:0 10px;border-radius:13px;background:rgba(0,0,0,.62);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700">${icon('bookmark', 's16')}${n(cnt)}</span>`;
const corner = (on) => `<span class="t" style="position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:19px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center">${bm(on)}</span>`;
const cardB = ([cap, t, du, m, cnt, on]) => `<div class="t">${thumb(cap, du, chip(cnt) + corner(on))}<div class="vt">${t}</div><div class="vm">${m}</div></div>`;
const homeB = (o = {}) => phone(`${head(0, true)}<div class="sec" style="margin-top:22px"><div class="ti">Новые видео</div></div><div style="display:flex;flex-direction:column;gap:20px">${VIDS.map(cardB).join('')}</div>`, { time: '12:52', overlay: o.overlay || '' });
const savedTabB = () => phone(`${head(2, true)}<div style="display:flex;flex-direction:column;gap:20px;margin-top:18px">${VIDS.filter((v) => v[5] || v[4] === 46).map((v) => cardB([...v.slice(0, 5), true])).join('')}</div>`, { time: '12:52' });
const watchB = (o = {}) => phone(`<div style="margin-top:-6px"></div>${playerBlock}<div style="font-size:20px;line-height:26px;font-weight:700;margin-top:16px">30 фраз для поездки за границу</div><div class="vm">Phraseman English · 2 дня назад · 4,1 тыс.</div>
  <div style="display:flex;gap:10px;margin-top:16px"><span class="cta t" style="flex:1">${icon('layers', 's18')}Тренировать</span><span class="cta gh t" style="flex:1">${o.saved ? `${icon('check', 's18')}В избранном` : `${icon('bookmark', 's18')}В избранное`}</span></div>
  <div class="vm" style="margin-top:10px;text-align:center">${n(o.saved ? 129 : 128)} человек сохранили этот ролик</div>`, { time: '12:52', overlay: o.overlay || '' });

// ── Вариант C: на карточках ничего нового (только число в строке), действия — в плеере, в блоке набора
const cardC = ([cap, t, du, m, cnt]) => `<div class="t">${thumb(cap, du)}<div class="vt">${t}</div><div class="vm">${m} · ${icon('bookmark', 's16').replace('<svg', '<svg style="vertical-align:-3px"')} ${n(cnt)}</div></div>`;
const homeC = () => phone(`${head(0)}${savedRow}<div class="sec" style="margin-top:26px"><div class="ti">Новые видео</div></div><div style="display:flex;flex-direction:column;gap:20px">${VIDS.map(cardC).join('')}</div>`, { time: '12:52' });
const watchC = (o = {}) => phone(`<div style="margin-top:-6px"></div>${playerBlock}<div style="font-size:20px;line-height:26px;font-weight:700;margin-top:16px">30 фраз для поездки за границу</div><div class="vm">Phraseman English · 4,1 тыс.</div>
  <div class="pack" style="margin-top:16px"><div class="flex"><img src="${A}community_26_ocean_pearl_fan.webp" style="width:58px" alt=""><div class="grow"><div class="ov" style="letter-spacing:2px">Набор к ролику</div><div style="font-size:17px;font-weight:700;margin-top:4px">30 фраз для поездки</div><div class="vm">30 карточек · ${n(o.saved ? 129 : 128)} сохранили ролик</div></div><span class="rb t" style="width:44px;height:44px">${bm(o.saved, 's22')}</span></div>
  <span class="cta t" style="margin-top:14px">${icon('layers', 's18')}Тренировать</span></div>`, { time: '12:52', overlay: o.overlay || '' });

document.getElementById('root').innerHTML =
  block('A', 'Вариант A — закладка справа от названия, число в строке под названием; «Сохранённые» — плашка на Главной', '', [
    col('Главная', homeA()), col('Плеер', watchA()), col('Сохранено (сразу, тост)', watchA({ saved: true, overlay: toast('Сохранено в избранное') })), col('Сеть отказала — откат', watchA({ overlay: toast('Не удалось сохранить, попробуй ещё раз', 'close') })),
  ]) +
  block('B', 'Вариант B — закладка и число прямо на превью; «Сохранённые» — третья вкладка; в плеере две кнопки', '', [
    col('Главная', homeB()), col('Вкладка «Сохранённые»', savedTabB()), col('Плеер', watchB()), col('Сохранено (сразу)', watchB({ saved: true, overlay: toast('Сохранено в избранное') })),
  ]) +
  block('C', 'Вариант C — карточки почти без изменений (число в строке), сохранение и «Тренировать» — в блоке набора под плеером', '', [
    col('Главная', homeC()), col('Плеер', watchC()), col('Сохранено (сразу)', watchC({ saved: true, overlay: toast('Сохранено в избранное') })),
  ]);
</script>
</body>
</html>
