name: Refine lesson Daily Challenge delivery

on:
  push:
    branches:
      - fix/lesson-daily-task-delivery-2026-08-07

permissions:
  contents: write

concurrency:
  group: refine-lesson-daily-task-delivery
  cancel-in-progress: false

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sparse checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/lesson-daily-task-delivery-2026-08-07
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /app/
            /components/
            /constants/
            /contexts/
            /hooks/
            /services/
            /utils/
            /lib/
            /modules/
            /tests/
            /package.json
            /package-lock.json
            /jest.config.js
            /jest.setup.js
            /babel.config.js
            /tsconfig.json

      - name: Filter stale targets and normalize audited blocks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/daily_tasks.ts)" = "b2dcaaea10f70dc9f802546270d8906e04fb1447"
          test "$(git hash-object app/lesson1.tsx)" = "97f5a31ac26ef8274dfa4070849edf59012274b5"
          test "$(git hash-object tests/daily_task_progress_event_delivery.test.ts)" = "870818e227c8b9c85181c5d73f1643d87f0981db"
          python <<'PY'
          from pathlib import Path

          daily_path = Path('app/daily_tasks.ts')
          daily = daily_path.read_text()

          old_merge = '''function mergeProgressDeliveryJournalTargets(
            progress: readonly TaskProgress[],
            journal: DailyTaskProgressDeliveryJournal,
          ): TaskProgress[] {
            return journal.entries.reduce(
              (current, entry) => mergeProgressAtLeast(current, entry.targetRows),
              [...progress],
            );
          };
          '''.replace('          ', '')
          new_merge = '''function deliveryTargetRowsForActiveTasks(
            entry: DailyTaskProgressDeliveryEntry,
            activeTaskIds: ReadonlySet<string>,
          ): TaskProgress[] {
            return entry.targetRows.filter((row) => activeTaskIds.has(row.taskId));
          }

          function mergeProgressDeliveryJournalTargets(
            progress: readonly TaskProgress[],
            journal: DailyTaskProgressDeliveryJournal,
            activeTaskIds: ReadonlySet<string>,
          ): TaskProgress[] {
            return journal.entries.reduce(
              (current, entry) => mergeProgressAtLeast(
                current,
                deliveryTargetRowsForActiveTasks(entry, activeTaskIds),
              ),
              [...progress],
            );
          };
          '''.replace('          ', '')
          if daily.count(old_merge) != 1:
              raise SystemExit('delivery merge helper drifted')
          daily = daily.replace(old_merge, new_merge, 1)

          old_load = '''    const reconciled = reconcileProgressToTasks(stored, tasks);
            const recovered = mergeProgressDeliveryJournalTargets(reconciled, deliveryJournal);
          '''.replace('          ', '')
          new_load = '''    const reconciled = reconcileProgressToTasks(stored, tasks);
            const activeTaskIds = new Set(tasks.map((task) => task.id));
            const recovered = mergeProgressDeliveryJournalTargets(
              reconciled,
              deliveryJournal,
              activeTaskIds,
            );
          '''.replace('          ', '')
          if daily.count(old_load) != 1:
              raise SystemExit('delivery load recovery marker drifted')
          daily = daily.replace(old_load, new_load, 1)

          old_current = '''    let current = mergeProgressDeliveryJournalTargets(
              reconcileProgressToTasks(stored, tasks),
              journal,
            );
          '''.replace('          ', '')
          new_current = '''    const activeTaskIds = new Set(tasks.map((task) => task.id));
            let current = mergeProgressDeliveryJournalTargets(
              reconcileProgressToTasks(stored, tasks),
              journal,
              activeTaskIds,
            );
          '''.replace('          ', '')
          if daily.count(old_current) != 1:
              raise SystemExit('delivery current snapshot marker drifted')
          daily = daily.replace(old_current, new_current, 1)

          old_apply = '    current = mergeProgressAtLeast(current, entry.targetRows);\n'
          new_apply = '''    current = mergeProgressAtLeast(
              current,
              deliveryTargetRowsForActiveTasks(entry, activeTaskIds),
            );
          '''.replace('          ', '')
          if daily.count(old_apply) != 1:
              raise SystemExit('delivery target replay marker drifted')
          daily = daily.replace(old_apply, new_apply, 1)

          old_emit = '      completedTaskIdsToEmit = deliveredEntry.completedTaskIds;\n'
          new_emit = '''      completedTaskIdsToEmit = deliveredEntry.completedTaskIds.filter(
                (taskId) => activeTaskIds.has(taskId),
              );
          '''.replace('          ', '')
          if daily.count(old_emit) != 1:
              raise SystemExit('delivery completion emit marker drifted')
          daily = daily.replace(old_emit, new_emit, 1)

          weird_prepared = '''        entries: compactDailyTaskProgressDeliveryEntries([
          ...journal.entries.filter((candidate) => candidate.eventId !== normalizedEventId),
          entry,
                  ]),
          '''.replace('          ', '')
          pretty_prepared = '''        entries: compactDailyTaskProgressDeliveryEntries([
            ...journal.entries.filter((candidate) => candidate.eventId !== normalizedEventId),
            entry,
          ]),
          '''.replace('          ', '')
          if daily.count(weird_prepared) != 1:
              raise SystemExit('prepared journal formatting marker drifted')
          daily = daily.replace(weird_prepared, pretty_prepared, 1)

          weird_delivered = '''        entries: compactDailyTaskProgressDeliveryEntries([
          ...journal.entries.filter((candidate) => candidate.eventId !== normalizedEventId),
          deliveredEntry,
                  ]),
          '''.replace('          ', '')
          pretty_delivered = '''        entries: compactDailyTaskProgressDeliveryEntries([
            ...journal.entries.filter((candidate) => candidate.eventId !== normalizedEventId),
            deliveredEntry,
          ]),
          '''.replace('          ', '')
          if daily.count(weird_delivered) != 1:
              raise SystemExit('delivered journal formatting marker drifted')
          daily = daily.replace(weird_delivered, pretty_delivered, 1)
          daily_path.write_text(daily)

          lesson_path = Path('app/lesson1.tsx')
          lesson = lesson_path.read_text()

          finish_start = lesson.index('        const finishDailyTaskEventId = [')
          finish_end = lesson.index("        void bumpStatsDaily('lessons_completed', 1, studyTargetRef.current);", finish_start)
          finish_block = '''        const finishDailyTaskEventId = [
            'lesson-finish',
            finishTodayKey,
            safeProgressEventPart(studyTargetRef.current),
            safeProgressEventPart(lessonId),
            safeProgressEventPart(nextAttemptId),
          ].join(':');
          const startLessonFinishDelivery = () => deliverDailyTaskProgressEvent(
            finishDailyTaskEventId,
            lessonFinishUpdates,
            { studyTarget: studyTargetRef.current },
          );
          let lessonFinishDeliveryPromise = startLessonFinishDelivery();
          void lessonFinishDeliveryPromise.catch((deliveryError) => {
            void trackFeatureError('lesson', 'daily_task_delivery', deliveryError, {
              lessonId,
              finishDailyTaskEventId,
            }, 'lesson1');
          });
          '''.replace('          ', '')
          lesson = lesson[:finish_start] + finish_block + lesson[finish_end:]

          finalize_start = lesson.index('        const finalizeLessonCompletion = async () => {')
          finalize_end = lesson.index('        } catch (e) {', finalize_start)
          finalize_block = '''        const finalizeLessonCompletion = async () => {
            try {
              try {
                await lessonFinishDeliveryPromise;
              } catch {
                // The first attempt starts while the learner reads the completion modal.
                // A failed Continue performs one explicit retry with the same event id.
                lessonFinishDeliveryPromise = startLessonFinishDelivery();
                await lessonFinishDeliveryPromise;
              }
            } catch (deliveryError) {
              void trackFeatureError('lesson', 'daily_task_delivery_retry', deliveryError, {
                lessonId,
                finishDailyTaskEventId,
              }, 'lesson1');
              emitAppEvent('action_toast', {
                type: 'error',
                messageRu: 'Урок завершён, но вызовы не сохранились. Нажми «Продолжить» ещё раз.',
                messageUk: 'Урок завершено, але виклики не збереглися. Натисни «Продовжити» ще раз.',
                messageEs: 'La lección terminó, pero los desafíos no se guardaron. Pulsa «Continuar» otra vez.',
              });
              return;
            }
            setShowCycleEndModal(false);
            cycleEndCallbackRef.current = null;
            navigate();
          };

          const hasErrors = np.some(x => x !== 'correct' && x !== 'replay_correct');
          cycleEndContinueInFlightRef.current = false;
          cycleEndCallbackRef.current = finalizeLessonCompletion;
          setCycleEndHasErrors(hasErrors);
          setShowCycleEndModal(true);
          '''.replace('          ', '')
          lesson = lesson[:finalize_start] + finalize_block + lesson[finalize_end:]

          modal_marker = '    <LessonCycleEndModal\n'
          modal_start = lesson.index(modal_marker)
          close_start = lesson.index('      onClose={() => {', modal_start)
          close_end = lesson.index('      }}\n    />', close_start) + len('      }}')
          close_block = '''      onClose={() => {
            const callback = cycleEndCallbackRef.current;
            if (!callback || cycleEndContinueInFlightRef.current) return;
            cycleEndContinueInFlightRef.current = true;
            void Promise.resolve(callback()).finally(() => {
              cycleEndContinueInFlightRef.current = false;
            });
          }}'''.replace('          ', '')
          lesson = lesson[:close_start] + close_block + lesson[close_end:]
          lesson_path.write_text(lesson)

          test_path = Path('tests/daily_task_progress_event_delivery.test.ts')
          test_source = test_path.read_text()
          insert = '''

            it('does not resurrect a journal target after the active task set changed', async () => {
              const eventId = `lesson-finish:${getTodayKey()}:en:1:attempt_4`;
              await deliverDailyTaskProgressEvent(eventId, [
                { type: 'lesson_complete', increment: 1 },
              ]);

              delete storage[dailyTasksProgressKey(getTodayKey())];
              storage[dailyTasksAdminOverrideKey()] = JSON.stringify({
                dayKey: getTodayKey(),
                taskIds: ['ta1'],
              });

              const tasks = await getTodayTasksSafe();
              expect(tasks.map((task) => task.id)).toEqual(['ta1']);
              const progress = await loadTodayProgress(tasks);
              expect(progress.some((row) => row.taskId === 'da1')).toBe(false);
              expect(progress.find((row) => row.taskId === 'ta1')).toMatchObject({
                current: 0,
                completed: false,
                claimed: false,
              });
            });
          '''.replace('            ', '')
          suite_end = test_source.rfind('\n});')
          if suite_end < 0:
              raise SystemExit('delivery test suite end marker missing')
          test_path.write_text(test_source[:suite_end] + insert + test_source[suite_end:])
          PY

      - name: Validate refined behavior
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python <<'PY'
          from pathlib import Path
          daily = Path('app/daily_tasks.ts').read_text()
          lesson = Path('app/lesson1.tsx').read_text()
          assert 'deliveryTargetRowsForActiveTasks' in daily
          assert daily.count('mergeProgressDeliveryJournalTargets(') == 3
          assert 'completedTaskIds.filter(' in daily
          assert '\n...journal.entries' not in daily
          assert "\n          'lesson-finish'," in lesson
          assert '\n          const finalizeLessonCompletion' in lesson
          assert '\n        const callback = cycleEndCallbackRef.current;' in lesson
          PY
          npx --yes esbuild@0.25.8 app/daily_tasks.ts --bundle --loader:.ts=ts --format=esm --outfile=/tmp/daily_tasks.js --external:'*'
          npx --yes esbuild@0.25.8 app/lesson1.tsx --bundle --loader:.tsx=tsx --format=esm --outfile=/tmp/lesson1.js --external:'*'
          npm ci --ignore-scripts --no-audit --no-fund
          npx jest --no-cache --runInBand --runTestsByPath \
            tests/daily_task_progress_event_delivery.test.ts \
            tests/lesson_completion_daily_task_delivery_contract.test.ts \
            tests/daily_task_reroll.test.ts \
            tests/daily_tasks_claim.test.ts

      - name: Commit product-only refinement
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refine-lesson-daily-task-delivery.yml
          git add app/daily_tasks.ts app/lesson1.tsx tests/daily_task_progress_event_delivery.test.ts
          git diff --cached --check
          git diff --cached --name-only \
            | grep -v '^.github/workflows/refine-lesson-daily-task-delivery.yml$' \
            | sort > /tmp/actual.txt
          printf '%s\n' \
            app/daily_tasks.ts \
            app/lesson1.tsx \
            tests/daily_task_progress_event_delivery.test.ts \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep lesson delivery scoped to active challenges'
          git push origin HEAD:fix/lesson-daily-task-delivery-2026-08-07
