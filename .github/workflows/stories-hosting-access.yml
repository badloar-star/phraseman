name: Deploy Stories only

on:
  push:
    branches: [feature/referral-roulette]
    paths: [.github/workflows/stories-hosting-access.yml]

permissions:
  contents: read

concurrency:
  group: admin-hosting-stories-production
  cancel-in-progress: false

jobs:
  deploy-stories-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /admin/v2/
            /scripts/deploy_admin_stories_only.py
            /tests/admin_stories_regression.py
            /tests/admin_stories_layout_regression.py
            /tests/admin_stories_deploy_test.py

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test and deployment clients
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.57.0' 'google-auth>=2.40,<3' 'requests==2.32.5'
          python -m playwright install --with-deps chromium

      - name: Verify Stories lifecycle, preview layout and deployment isolation
        shell: bash
        run: |
          set -euo pipefail
          export STORIES_TEST_OUTPUT="$RUNNER_TEMP/stories-test-output"
          node --check admin/v2/scripts/pages/story_announcements_v2.js
          python tests/admin_stories_regression.py
          python tests/admin_stories_layout_regression.py
          python tests/admin_stories_deploy_test.py

      - name: Locate existing project credential without logging secrets
        env:
          CLOUD_SECRETS: ${{ toJSON(secrets) }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, re
          from pathlib import Path
          values = json.loads(os.environ.get('CLOUD_SECRETS', '{}'))
          found = None
          for key, value in values.items():
              if not re.search(r'FIREBASE|GOOGLE|GCLOUD|GCP|SERVICE_ACCOUNT', key, re.I) or not value:
                  continue
              candidates = [str(value)]
              try:
                  candidates.append(base64.b64decode(value, validate=True).decode())
              except Exception:
                  pass
              for candidate in candidates:
                  try:
                      data = json.loads(candidate)
                  except Exception:
                      continue
                  if isinstance(data, dict) and data.get('type') in ('service_account', 'authorized_user') and data.get('project_id', 'phraseman-ea0b3') == 'phraseman-ea0b3':
                      found = candidate
                      break
              if found:
                  break
          if not found:
              raise SystemExit('STORIES_DEPLOY_BLOCKED: no existing Google deployment credential for phraseman-ea0b3 was found in cloud-named repository secrets. No Hosting changes were made.')
          target = Path(os.environ['RUNNER_TEMP']) / 'stories-hosting-credential.json'
          target.write_text(found)
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('GOOGLE_APPLICATION_CREDENTIALS=' + str(target) + '\n')
          print('Existing project credential located. Its contents are not logged or uploaded.')
          PY

      - name: Replace only the two tested Stories files and verify live bytes
        run: python scripts/deploy_admin_stories_only.py --apply

      - name: Retain non-sensitive release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stories-release-verification
          path: |
            stories-release-result.json
            ${{ runner.temp }}/stories-test-output/layout-results.json
            ${{ runner.temp }}/stories-test-output/stories-after.png
            /tmp/story_announcements_v2-regression-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/stories-hosting-credential.json"
