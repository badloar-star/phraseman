  { stage: 'СМЫСЛ', n: 1, title: 'Назвать предмет на полке', body: 'Вы распаковываете вещи для дома. Друг показывает на предмет, который удерживает книги на полке, и спрашивает, что это. Bookend — книжный упор; его можно посчитать. Назовите один предмет: This is a bookend. Порядок: This + is + a bookend. Перед названием одного исчисляемого предмета здесь нужен артикль. A выбираем перед согласным звуком, an — перед гласным; bookend начинается с согласного, поэтому a bookend.' },
  { stage: 'СХЕМА', n: 2, title: 'Два пуфа в комнате', body: 'Друг спрашивает, где можно сесть, и вы сообщаете, что в комнате два пуфа. Ottoman — пуф; один — an ottoman, два — two ottomans. Соберите предложение: There are + two ottomans + in the room → There are two ottomans in the room. Для нескольких предметов используем are и множественное ottomans с -s. Перед two артикль a не ставим; место называем в конце.' },
  { stage: 'ЛОВУШКА', n: 3, title: 'Новая посуда', body: 'Вы показываете другу только что купленную керамическую посуду. Crockery — посуда в целом: отдельные тарелки можно посчитать, но общее название crockery неисчисляемое. Скажите: This crockery is new. Соберите фразу: This crockery + is + new. С этим общим названием используем this и is, не добавляем a или множественное -s. New в конце сообщает, какая посуда.' },
];
const CHOICES = ['This crockery is new.', 'This crockery are new.', 'These crockeries are new.'];
const head = (stage, n) => `<div class="sb"><span>9:41</span><span>●●● ▮</span></div><div class="hd"><span class="x">${IC.x}</span><div class="meta"><span class="stage">${stage}</span><span class="cnt">${n} из 3</span></div><span class="pill">${IC.bolt}4</span></div>
  <div class="prog">${[1, 2, 3].map((k) => `<i class="${k <= n ? 'on' : ''}"></i>`).join('')}</div>`;
const page = (p) => `<div class="ph" id="ph-${p.n}">${head(p.stage, p.n)}<div class="col"><div class="ttl">${esc(p.title)}</div><div class="card"><p class="par">${rich(p.body)}</p></div></div></div>`;
// «Проверь себя»: варианты — английский своим тоном, но без подсветки частиц (подсветка is/are подсказала бы ответ)
const check = () => `<div class="ph" id="ph-q">${head('ЛОВУШКА', 3)}<div class="col"><div class="ttl">Новая посуда</div>
  <div class="qp"><div class="qe"><span>Проверь себя</span><span>3 / 3</span></div><div class="qq">Выберите фразу для этой ситуации.</div>
  <div class="ans">${CHOICES.map((c, i) => `<button class="ch" data-i="${i}"><span class="lt">${'ABC'[i]}</span><span class="tx"><span class="en">${esc(c)}</span></span></button>`).join('')}</div>
  <div class="verdict" id="verdict" aria-live="polite"></div></div></div></div>`;
// эталон урока 1: правильный и ошибочный пример — роли «правильный» / «неверный» уже размечены в материалах
const lesson1 = () => `<div class="ph" id="ph-l1">${head('СМЫСЛ', 1)}<div class="col"><div class="ttl"><b>am, is, are</b> — это и есть «быть»</div><div class="sub">Одно короткое слово связывает, кто есть кто.</div>
  <div class="card"><p class="par">${rich('В русском мы говорим «Я — Анна» и обходимся без глагола. В английском между словами обязательно стоит связка.')}</p>
  <p class="par okline"><span style="color:var(--t-goodText)">${IC.check}</span><span class="tgt-wrap">${rich('I am Anna.')}</span></p>
  <p class="par okline"><span style="color:var(--t-badText)">${IC.cross}</span><span class="wrong">I Anna.</span></p></div></div></div>`;

const CELLS = [
  ['СМЫСЛ', 'урок 17 · страница 1', () => page(L17[0])],
  ['СХЕМА', 'урок 17 · страница 2 — формула с «+» и «→»', () => page(L17[1])],
  ['ЛОВУШКА', 'урок 17 · страница 3 — снимок владельца', () => page(L17[2])],
  ['Проверь себя', 'нажми вариант', check],
  ['Ошибочный пример', 'урок 1 — зачёркнут красным', lesson1],
];

// ── контраст WCAG ──
const rgb = (c) => { const h = c.replace('#', ''); const a = h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1; return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), a]; };
const over = (fg, bg) => { const f = rgb(fg); const b = rgb(bg); return '#' + [0, 1, 2].map((i) => Math.round(f[i] * f[3] + b[i] * (1 - f[3])).toString(16).padStart(2, '0')).join(''); };
const lum = (c) => rgb(c).slice(0, 3).map((x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; }).reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
const cr = (a, b) => { const A = lum(a); const B = lum(b); return (Math.max(A, B) + 0.05) / (Math.min(A, B) + 0.05); };

function applyTheme(el, t) {
  const map = { bg: t.bg, bgTop: t.bgTop, bgBottom: t.bgBottom, card: t.card, ctl: t.ctl, text: t.text, secondary: t.secondary, muted: t.muted, accent: t.accentTextSafe, accentG: t.accentGraphic,
    soft: t.accentSoft, en: t.langText, gloss: t.gloss, pt: t.particle, ptSoft: `${t.particle}2E`, good: t.good, bad: t.bad, goodText: t.goodText, badText: t.badText, ctaInk: t.ctaInk, shadow: t.shadow };
  for (const [k, v] of Object.entries(map)) el.style.setProperty(`--t-${k}`, v);
}
function render() {
  const t = TOK[`${st.theme}:${st.level}`];
  const strip = document.getElementById('strip');
  strip.innerHTML = CELLS.map(([c, s, f]) => `<div class="cell"><div class="cap">${c}<small>${s}</small></div>${f()}</div>`).join('');
  strip.querySelectorAll('.ph').forEach((ph) => { applyTheme(ph, t); ph.classList.add(`v-${st.v}`); });
  // правильный пример урока 1: в «как сейчас» — роль target (жирный основной), в предложении — английский с частицами
  strip.querySelectorAll('.tgt-wrap').forEach((w) => { if (st.v === 'now') w.querySelectorAll('span').forEach((s) => { s.className = 'tgt'; }); });
  wireChoices(t);
  legend(t);
}
function wireChoices() {
  const ph = document.getElementById('ph-q'); const v = document.getElementById('verdict');
  ph.querySelectorAll('.ch').forEach((b) => b.addEventListener('click', () => {
    const i = Number(b.dataset.i);
    if (i === 0) { b.classList.add('good'); v.innerHTML = '<span style="color:var(--t-goodText)">Верно</span>'; ph.querySelectorAll('.ch').forEach((x) => { x.disabled = true; }); }
    else { b.classList.add('bad'); v.innerHTML = `<span style="color:var(--t-badText)">${esc(b.textContent.slice(1))}</span> <span class="ru">— не так. Попробуй ещё.</span>`; }
  }));
}
function legend(t) {
  const card = t.card;
  const pBg = st.v === 'b' ? over(`${t.particle}2E`, card) : card;
  const pFg = st.v === 'b' ? t.langText : st.v === 'a' ? t.particle : t.text;
  const rows = st.v === 'now'
    ? [['Весь абзац', t.text, card, 'Русский и английский одним цветом и весом']]
    : [['Русское пояснение', t.gloss, card, 'gloss, обычный вес'], ['Английский', t.langText, card, 'langText, жирный'],
      ['Частицы и служебные', pFg, pBg, st.v === 'a' ? 'particle, жирный' : 'подложка из particle, текст langText'], ['Знаки формулы + →', t.muted, card, 'приглушённые, жирные'],
      ['Ошибочный пример', t.badText, card, 'красный, зачёркнут — как сейчас']];
  const sample = { 'Русское пояснение': '<span class="ru">Соберите фразу:</span>', 'Английский': '<span class="en">crockery new</span>', 'Частицы и служебные': '<span class="pt">this</span> <span class="pt">is</span> <span class="pt">a</span> <span class="pt">-s</span>',
    'Знаки формулы + →': '<span class="op">+ →</span>', 'Ошибочный пример': '<span class="wrong">I Anna.</span>', 'Весь абзац': '<span class="ru">Скажите: This crockery is new.</span>' };
  const sep = st.v === 'a' ? cr(t.particle, t.langText) : null;
  const themeName = THEMES.find((x) => x[0] === st.theme)[1]; const levelName = LEVELS.find((x) => x[0] === st.level)[1];
  document.getElementById('legend').innerHTML = `<div class="lg v-${st.v}" id="lg-roles"><h2>Роли текста · ${themeName}, ${levelName}</h2>
    ${rows.map(([n, fg, bg, d]) => { const c = cr(fg, bg); return `<div class="lrow"><span class="nm">${n} — ${d}</span><span class="cr ${c >= 4.5 ? 'ok' : 'warn'}">${c.toFixed(1)} : 1 ${c >= 4.5 ? '✓' : '!'}</span><div class="swatch" style="background:${card}">${sample[n]}</div></div>`; }).join('')}
    ${sep !== null && sep < 1.6 ? `<div class="warnbox">На уровне «${levelName}» в этой теме акцент почти совпадает с цветом английского (${sep.toFixed(1)} : 1) — частицы в варианте А почти не видны. Вариант Б работает на всех уровнях.</div>` : ''}</div>
    <div class="lg"><h2>Как это сделать в приложении</h2><p class="note">Сейчас абзацы вступления приходят из материалов одной строкой без ролей, поэтому весь текст одного цвета. Предлагаем делить текст на роли <b>при показе</b>: кириллица — русский, латиница — английский, служебные слова (am/is/are, a/an/the, this/these, there, do/does, will, to, not) и окончания <b>-s/-es</b> — частицы, «+» и «→» — знаки формулы. Материалы курса трогать не нужно, на 9 языках работает так же.</p>
    <p class="note">Ситуация в раскладке «Скажи так» сейчас рисуется вообще без ролей — она получит тот же разбор. В «Проверь себя» варианты ответа — тоном английского, но <b>без подсветки частиц</b>: иначе is/are подсказывали бы ответ.</p></div>`;
  applyTheme(document.getElementById('lg-roles'), t);
}
function seg(id, list, key) {
  const el = document.getElementById(id);
  el.innerHTML = list.map(([v, a, b]) => `<button data-v="${v}" aria-pressed="${st[key] === v}">${a}${b ? ` · ${b}` : ''}</button>`).join('');
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    st[key] = b.dataset.v; el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    try { localStorage.setItem('intro-colors', JSON.stringify(st)); } catch (err) { console.warn('[INTRO-COLORS] выбор не сохранён', err); }
    render();
  });
}
seg('g-theme', THEMES, 'theme'); seg('g-level', LEVELS, 'level'); seg('g-var', VARS, 'v');
render();
</script>
</body>
</html>
