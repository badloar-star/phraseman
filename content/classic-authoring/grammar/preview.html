<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>PhraseMan · ES-01 · Estar</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#172f35;font:16px/1.55 system-ui,-apple-system,sans-serif}main{max-width:960px;margin:auto;padding:18px clamp(14px,4vw,46px) 60px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #b2c1bc;padding:8px 0 14px}.brand{font-weight:800;letter-spacing:.03em}.brand span,.muted,small{color:#52696a}.hero{padding:27px 0 14px}.tag{color:#1a675e;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.06;margin:11px 0 9px;letter-spacing:-.045em}h2{font-size:1.5rem;line-height:1.24}h3{margin:10px 0;font-size:1.1em}p{margin:8px 0 12px}.nav,.row,.choices,.chips,.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nav{margin:13px 0 22px}button{font:inherit;cursor:pointer;min-height:40px;background:#fffefa;color:#193b3d;border:1px solid #a8bcb6;border-radius:9px;padding:6px 12px}button:focus-visible,summary:focus-visible{outline:3px solid #bb6704;outline-offset:2px}button[aria-pressed=true],.primary{background:#194f49;color:#fffefa;border-color:#194f49}button:disabled{cursor:default;opacity:.5}article,.pane{background:#fffefa;border:1px solid #c7d1c9;border-radius:14px;padding:15px 19px;margin:10px 0}.band{border-top:2px solid #538276;margin:24px 0 8px;padding:11px 0 3px}.band h2{margin:2px 0}.num{font:700 .82rem/1.5 ui-monospace,monospace;color:#476864}.phrase{display:grid;grid-template-columns:2.6rem 1fr auto;align-items:start;column-gap:8px}.phrase strong{font-size:1.13rem}.chip{display:inline-block;background:#edf3ed;color:#254e43;border-radius:5px;padding:1px 7px;margin:2px 2px 0 0;font-weight:600}.verb{background:#d9ece6;color:#0a5947}.chain{font-size:.88rem;line-height:1.75;margin-top:5px}.try{font-size:.86rem}.translation{margin-bottom:2px}.chiprow{padding:12px 0}.prompt{font-size:clamp(1.35rem,3.5vw,1.9rem);line-height:1.3;margin:10px 0}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:570px;margin-top:10px}.choices button{min-height:47px;font-weight:650}.notice{background:#f0e9da;border-radius:8px;padding:10px 12px}.feedback{min-height:1.7em;margin:8px 0;color:#6c4313}.controls{margin:12px 0}details>summary{cursor:pointer;min-height:36px;font-weight:650}a{color:#135d51}td,th{text-align:left;padding:9px;border-bottom:1px solid #d8dfd8;vertical-align:top}table{border-collapse:collapse;width:100%}footer{margin-top:35px;border-top:1px solid #b2c1bc;padding-top:13px;font-size:.86em}.scope{font-size:.86rem}.pill{font:700 .8rem ui-monospace,monospace;color:#19574d}.sr{position:absolute;left:-9999px}select{font:inherit;max-width:100%;padding:6px;border-radius:6px}#panel{scroll-margin:12px}body:not(.js) #app,body:not(.js) .enhanced{display:none}[hidden]{display:none!important}@media(max-width:540px){main{padding:12px}.phrase{grid-template-columns:1.8rem 1fr}.phrase .try{grid-column:2;justify-self:start;margin-top:8px}.choices{gap:5px}article,.pane{padding:12px}.brand span{display:none}.nav{gap:5px}.nav button{font-size:.87rem}}@media print{.enhanced,.try,.controls,.nav,footer{display:none!important}.phrase{break-inside:avoid}main{max-width:100%}body{background:white}}
</style></head><body><main><header><div class="brand">PhraseMan <span>/ CLASSIC</span></div><div class="enhanced"><button id="ru" lang="ru">RU</button> <button id="uk" lang="uk">UA</button></div></header><section class="hero"><span class="tag">Español · A1 · ES-01</span><h1 id="heading">Estar: где кто находится</h1><p id="lead">50 фраз · одно правило · пошаговая сборка из слов</p></section><noscript><p>Все фразы и сборка по словам. Для интерактивной тренировки включите JavaScript.</p>@@STATIC@@</noscript><div id="app"><nav class="nav" id="nav"></nav><section id="panel"></section></div><footer id="sources"><b>Источники / Джерела:</b> <a href="https://github.com/badloar-star/phraseman/blob/7bf2258cdc5d2647bea7a6f9ed9115035ee2d581/app/lesson_data_1_8_phrases_es.gen.ts">English Classic · wordsEn</a> · <a href="https://github.com/badloar-star/phraseman/blob/7bf2258cdc5d2647bea7a6f9ed9115035ee2d581/app/lesson_intro_screens_lesson1_v2.ts">Теория урока 1 / Теорія уроку 1</a> · <a href="https://cvc.cervantes.es/ensenanza/biblioteca_ele/plan_curricular/niveles/02_gramatica_inventario_a1-a2.htm">Instituto Cervantes A1–A2</a> · <a href="https://cvc.cervantes.es/ensenanza/biblioteca_ele/plan_curricular/niveles/02_gramatica_inventario_b1-b2.htm">B1–B2</a></footer></main><script type="application/json" id="data">@@DATA@@</script><script>
'use strict';const D=JSON.parse(document.getElementById('data').textContent),L=D.lesson,P=L.phrases,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lang='ru',tab=0,idx=0,slot=0,msg='';const tr=(r,u)=>lang==='ru'?r:u,ix=()=>lang==='ru'?0:1,navs=()=>[tr('Все 50 фраз','Усі 50 фраз'),tr('Собрать фразу','Зібрати фразу'),tr('Правило и формы','Правило й форми'),tr('Словарь','Словник'),tr('План 32 уроков','План 32 уроків')];function chip(w){return '<span class="chip '+(w.kind==='verb'?'verb':'')+'" lang="es">'+esc(w.correct)+'</span>'}function note(p){return esc(p[lang]);}function runButton(i,label){return `<button class="try" data-run="${i}">${label}</button>`}function chain(p){return p.practiceWords.map(chip).join(' <span aria-hidden="true">›</span> ')}function go(i){idx=i;slot=0;msg='';tab=1;render();$('panel').scrollIntoView({block:'start'});$('trainer-title').focus({preventScroll:true})}function bank(){let s='';for(let i=0;i<P.length;i++){const p=P[i];if(i%10===0){const b=L.steps[i/10];s+=`<div class="band"><span class="tag">${tr('Ступень','Сходинка')} ${i/10+1} / 5 · ${b[0]}–${i+10}</span><h2>${esc(b[1+ix()])}</h2><p>${esc(b[3+ix()])}</p></div>`}s+=`<article class="phrase"><span class="num">${p.num}</span><div><div class="translation">${note(p)}</div><strong lang="es">${esc(p.targetText)}</strong><div class="chain">${chain(p)}</div></div>${runButton(i,tr('Собрать','Зібрати'))}</article>`}return s}
function trainer(){const p=P[idx],w=p.practiceWords,done=slot===w.length;const ref=L.forms.find(f=>f[0]===p.person);const explain=tr('Кто?','Хто?')+' '+esc(ref[3+ix()])+' → <strong lang="es">'+esc(ref[2])+'</strong>.';return `<div class="controls"><label>${tr('Фраза','Фраза')} <select id="jump">${P.map((z,i)=>`<option value="${i}" ${idx===i?'selected':''}>${z.num} · ${note(z)}</option>`).join('')}</select></label></div><article class="pane"><span class="tag">${p.num} / 50 · ${tr('Сборка по словам','Збірка за словами')}</span><h2 class="prompt" id="trainer-title" tabindex="-1">${note(p)}</h2><div class="chiprow">${w.slice(0,slot).map(chip).join(' ')} ${done?'':`<span class="chip">___</span>`}</div>${done?`<p><b lang="es">${esc(p.targetText)}</b> · ${tr('Готово','Готово')}</p><p>${explain}</p>${p.alternatives.length?`<p class="muted">${tr('Так тоже можно сказать','Так теж можна сказати')}: ${p.alternatives.map(esc).join(' / ')}</p>`:''}`:`<div>${tr('Выбери слово','Обери слово')} ${slot+1} / ${w.length}:</div><div class="choices">${w[slot].choices.map((c,i)=>`<button lang="es" data-opt="${i}">${esc(c)}</button>`).join('')}</div>`}<div role="status" aria-live="polite" class="feedback" id="feedback">${esc(msg)}</div><div class="controls">${!done?`<button id="hint">${tr('Подсказка','Підказка')}</button>`:''}<button id="reset">${tr('С начала фразы','Від початку фрази')}</button>${done&&idx<49?`<button class="primary" data-run="${idx+1}">${tr('Следующая фраза','Наступна фраза')} →</button>`:''}${done&&idx===49?`<button class="primary" data-tab="0">${tr('К списку фраз','До переліку фраз')}</button>`:''}</div></article><p class="scope muted">${tr('Это сборка заданного образца, не проверка всех возможных переводов. Точка добавляется автоматически. Попытки и энергия не списываются.','Це збірка заданого зразка, а не перевірка всіх можливих перекладів. Крапка додається автоматично. Спроби й енергія не списуються.')}</p>`}
function rules(){return '<div class="pane"><span class="tag">Fórmula</span><h2>'+tr('(Кто / что) + форма estar + место','(Хто / що) + форма estar + місце')+'</h2><p lang="es">Estoy aquí. · Ana está en casa. · Las llaves están aquí.</p><table><tbody>'+L.forms.map(r=>`<tr><td>${esc(r[3+ix()])}</td><td lang="es">${esc(r[1])}</td><td lang="es"><b>${esc(r[2])}</b></td></tr>`).join('')+'</tbody></table></div>'+L.rules.map(r=>'<article><h3>'+esc(r[ix()])+'</h3><p>'+esc(r[2+ix()])+'</p>'+r[4].split(',').map(n=>runButton(Number(n)-1,'№ '+n)).join(' ')+'</article>').join('')}
function vocab(){let s='';for(const [tier,title] of [['core',tr('Активный словарь','Активний словник')],['recognize',tr('Слова для понимания','Слова для розуміння')],['support',tr('Служебные слова и местоимения','Службові слова й займенники')],['name',tr('Имена','Імена')]]){const es=Object.values(D.ledger).filter(x=>x.tier===tier&&x.examples.some(y=>y.split(':')[1]===L.id));s+='<div class="band"><h2>'+title+' · '+es.length+'</h2></div>'+es.map(e=>`<article><b lang="es">${esc(e.lemma)}</b> — ${esc(e[lang])}<p class="muted">${tr('Формы','Форми')}: ${e.forms.map(esc).join(', ')} · ${tr('Впервые','Вперше')}: ${esc(e.firstPhrase)}</p>${runButton(Number(e.examples.find(y=>y.split(':')[1]===L.id).split(':')[2])-1,tr('Пример','Приклад'))}</article>`).join('')}return s}
function plan(){return '<p class="notice">'+tr('Редакторский план на русском: 32 грамматических шага. Это не обещание уровня B2. Полный банк написан для ES-01.','Редакторський план російською: 32 граматичні кроки. Це не обіцянка рівня B2. Повний банк написано для ES-01.')+'</p>'+D.programme.map(r=>`<article><span class="num">ES-${r[0]}</span> <strong>${esc(r[1])}</strong><p lang="es">${esc(r[2])}</p></article>`).join('')}
function render(){document.documentElement.lang=lang;$('ru').setAttribute('aria-pressed',lang==='ru');$('uk').setAttribute('aria-pressed',lang==='uk');$('heading').textContent=L.title[ix()];$('lead').textContent=tr('50 фраз · одно правило · выбери слово на каждом шаге','50 фраз · одне правило · обери слово на кожному кроці');$('nav').innerHTML=navs().map((t,i)=>`<button data-tab="${i}" aria-pressed="${i===tab}">${t}</button>`).join('');$('panel').innerHTML=[bank,trainer,rules,vocab,plan][tab]();if($('jump'))$('jump').onchange=e=>go(Number(e.target.value))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='ru'||b.id==='uk'){lang=b.id;msg='';render()}else if(b.hasAttribute('data-tab')){tab=Number(b.dataset.tab);render()}else if(b.hasAttribute('data-run'))go(Number(b.dataset.run));else if(b.id==='reset')go(idx);else if(b.id==='hint'){const p=P[idx],w=p.practiceWords[slot],f=L.forms.find(x=>x[0]===p.person);$('feedback').textContent=w.kind==='verb'?tr('Вспомни форму для «','Згадай форму для «')+f[3+ix()]+'»: '+f[2]+'.':tr('Следующее слово: ','Наступне слово: ')+w.correct+'.'}else if(b.hasAttribute('data-opt')){const p=P[idx],w=p.practiceWords[slot];if(!w)return;const c=w.choices[Number(b.dataset.opt)];if(c===w.correct){slot++;msg='';render();const focus=$('panel').querySelector('.choices button,.primary');if(focus)focus.focus({preventScroll:true})}else{const f=L.forms.find(x=>x[0]===p.person);let m;if(w.kind==='verb'){const picked=L.forms.find(x=>x[2]===c.toLowerCase());m=picked?`${c} → ${picked[3+ix()]}. `:'';m+=tr('Здесь нужно говорить о: ','Тут ідеться про: ')+f[3+ix()]+'.'}else m=tr('Это не то слово для данного образца. Сверься с переводом или открой подсказку.','Це не те слово для цього зразка. Звірся з перекладом або відкрий підказку.');$('feedback').textContent=m}}});document.body.classList.add('js');render();</script></body></html>
