appId: app.phraseman
---
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: profile_card_fold_seed_standard

# Open the upgrade sheet from the avatar card.
- tapOn:
    point: "71%,49%"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: profile_card_fold_upgrade_standard

# Upgrade to Polished I.
- tapOn:
    point: "50%,86%"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: profile_card_fold_upgrade_polished_i

# Upgrade to Signature II.
- tapOn:
    point: "50%,86%"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: profile_card_fold_upgrade_signature_ii

# Select Gold theme, then close the setup sheet.
- tapOn:
    point: "38%,50%"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 2000
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: profile_card_fold_avatar_signature_ii

# Open the public preview card as another user would see it.
- tapOn:
    point: "35%,49%"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: profile_card_fold_public_signature_ii
