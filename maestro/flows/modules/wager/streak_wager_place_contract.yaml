# Home -> streak stats -> wager modal -> place tier 0 if no active wager exists.
appId: app.phraseman
---
- runFlow: ../../_shared/open_dev_client.yaml
- runFlow: ../../_dismiss_bug_hunt.yaml
- runFlow: ../../_precondition.yaml
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 90000
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "home-stats-card"
    timeout: 45000
- tapOn:
    id: "home-stats-card"
- scrollUntilVisible:
    element:
      id: "wager-open"
    direction: DOWN
    timeout: 30000
    speed: 80
    visibilityPercentage: 40
- runFlow:
    when:
      visible:
        id: "wager-open"
    commands:
      - tapOn:
          id: "wager-open"
      - extendedWaitUntil:
          visible:
            id: "wager-modal"
          timeout: 15000
      - tapOn:
          id: "wager-tier-0"
      - tapOn:
          id: "wager-place"
      - runFlow:
          when:
            visible:
              id: "wager-confirm-confirm"
          commands:
            - tapOn:
                id: "wager-confirm-confirm"
      - extendedWaitUntil:
          visible:
            id: "wager-active-card"
          timeout: 30000
