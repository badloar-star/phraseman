<!-- Admin gallery uses the same 36 renderers without creating 36 live Players. -->
<style id="ann-admin-gallery-style">
html.ann-gallery-root, body.ann-gallery-mode { margin: 0; padding: 0; background: transparent; overflow-x: hidden; }
body.ann-gallery-mode .st-page { padding: 0; max-width: none; }
/* Show three natural-size phones per row when space permits; narrow screens wrap. */
#ann-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); align-items: start; justify-items: start; gap: 20px; padding: 3px; box-sizing: border-box; width: 100%; max-width: 1246px; }
.ann-gallery-card { appearance: none; display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 400px; min-width: 0; margin: 0; padding: 3px; border: 2px solid #344b43; border-radius: 12px; background: #12271f; color: #ecf4f0; font: 600 15px/1.3 system-ui, sans-serif; text-align: left; cursor: pointer; box-sizing: border-box; }
.ann-gallery-card:hover { border-color: #8ab49f; background: #19352a; }
.ann-gallery-card[aria-pressed="true"] { border-color: #a8e1be; background: #213e30; box-shadow: 0 0 0 1px #a8e1be; }
.ann-gallery-card:focus-visible { outline: 3px solid #e1f6e9; outline-offset: 2px; }
.ann-gallery-card:disabled { cursor: default; opacity: .75; }
.ann-gallery-thumb { position: relative; display: block; align-self: center; width: 100%; max-width: 390px; min-width: 0; aspect-ratio: 390 / 844; border-radius: 8px; overflow: hidden; background: #0b1512; pointer-events: none; }
.st-page .ann-gallery-thumb .ph { position: absolute; left: 0; top: 0; width: 390px !important; min-width: 390px !important; max-width: none !important; height: 844px !important; min-height: 844px !important; margin: 0; box-shadow: none; transform: scale(var(--ann-thumb-scale, 1)); transform-origin: left top; pointer-events: none; }
.ann-gallery-label { display: block; min-height: 2.6em; overflow-wrap: break-word; word-break: normal; }
.ann-gallery-index { color: #b1c9bc; font-variant-numeric: tabular-nums; margin-right: 4px; }
.ann-gallery-card[aria-pressed="true"] .ann-gallery-index { color: #d5f2df; }

/* Static final frames keep every thumbnail readable while the owner types. */
.ann-static .story, .ann-static .story *, .ann-static .story *::before, .ann-static .story *::after { animation: none !important; transition: none !important; will-change: auto !important; }
.ann-static .story { pointer-events: none; }
.ann-static :is(.a, .pop, .fade, .rise, .fromL, .fromR, .fromT), .ann-static .story .scta, .ann-static .mani .ln span, .ann-static .edit .epanel, .ann-static .tl .it, .ann-static .chat .qb, .ann-static .chat .ab, .ann-static .leaf3 .leaf, .ann-static .hl .stp, .ann-static .story .sl > .bg.curt, .ann-static .soonw b, .ann-static .stamp .cen, .ann-static .g4 .gt, .ann-static .fly .fc, .ann-static .vsbg i, .ann-static .vs2 .cL, .ann-static .vs2 .cR, .ann-static .vs2 .vsw, .ann-static .letters .ch, .ann-static .tilt, .ann-static .vk, .ann-static .chips .chip, .ann-static .pz2, .ann-static .podium .pc .bar, .ann-static .lnk .cL, .ann-static .lnk .cR, .ann-static .codecard, .ann-static .pb2 .op, .ann-static .pb2 .op b, .ann-static .ribbon, .ann-static .yr b, .ann-static .gift, .ann-static .bento .bt, .ann-static .notes .nt { opacity: 1 !important; transform: none !important; }
.ann-static .wipe, .ann-static .twr, .ann-static .story .sl > .bg.wipebg { clip-path: none !important; }
.ann-static .tl .line, .ann-static .tl .line i, .ann-static .hl .ln, .ann-static .hl .ln i, .ann-static .path .ln i, .ann-static .pb2 .op i, .ann-static .win .tr i, .ann-static .tilt .wrong i { transform: none !important; }
.ann-static .ring7 .seg.on { stroke-dasharray: 60 443 !important; }
.ann-static .lnk svg path { stroke-dashoffset: 0 !important; }
.ann-static .poster .plane { clip-path: inset(0 0 0 0 round 32px) !important; }
.ann-static .story .sl > .bg.qdisc, .ann-static .bg .disc2, .ann-static .story .sl > .bg.hplane, .ann-static .bdisc .bnum { opacity: 1 !important; transform: none !important; }
.ann-static .notes .bplane { opacity: 1 !important; transform: rotate(-3deg) !important; }
.ann-static .chat .dots, .ann-static .bigring, .ann-static .snow, .ann-static .conf, .ann-static .sparks, .ann-static .hp, .ann-static .bl { display: none !important; }
.ann-static .odo .dg .strip { transform: translateY(var(--dy)) !important; }
.ann-static .soonw b:not(.fill) { opacity: 0 !important; }
.ann-static .fly .flipw { transform: rotateY(180deg) !important; }
.ann-static .bulb .ray { opacity: 1 !important; transform: none !important; }
.ann-static .notes .nt { transform: rotate(var(--r)) !important; }
.ann-static .fly .fc { transform: translate(0, var(--ty)) rotateZ(var(--rz)) !important; }
.ann-static .path .run { transform: translateX(var(--dx)) !important; }
.story.offscreen, .story.offscreen *, .story.offscreen *::before, .story.offscreen *::after { animation-play-state: paused !important; }
</style>
<script id="ann-admin-gallery-runtime">
(() => {
  'use strict';
  if (!document.body.classList.contains('ann-gallery-mode')) return;
  const engine = window.ST;
  const support = engine?.gallerySupport;
  if (!support || engine.TPL.length !== 36) throw new Error('Stories gallery requires all 36 templates.');
  const origin = location.origin;
  const targetOrigin = origin === 'null' ? '*' : origin;
  const send = (message) => { if (window.parent !== window) window.parent.postMessage(message, targetOrigin); };
  const root = document.createElement('div'); root.id = 'ann-gallery'; root.setAttribute('role', 'group'); root.setAttribute('aria-label', 'Все 36 шаблонов историй');
  document.getElementById('preview').replaceChildren(root);
  const cards = [];
  let enabled = true, selected = 'manifest', lastSignature = '', lastMessage = null, lastHeight = 0, layoutFrame = 0, renderFrame = 0, pending = null;
  const updateSelection = () => {
    for (const card of cards) {
      card.button.setAttribute('aria-pressed', String(card.template.id === selected));
      card.button.disabled = !enabled;
    }
  };
  const layout = () => {
    layoutFrame = 0;
    for (const card of cards) {
      if (card.thumb.clientWidth > 0) card.thumb.style.setProperty('--ann-thumb-scale', String(Math.min(1, card.thumb.clientWidth / 390)));
    }
    const height = Math.ceil(root.getBoundingClientRect().height) + 4;
    if (height > 4 && height !== lastHeight) { lastHeight = height; send({ channel: 'pm-ann-gallery-size', height }); }
  };
  const scheduleLayout = () => { if (!layoutFrame) layoutFrame = requestAnimationFrame(layout); };
  const shell = () => support.sbHtml('9:41') + '<div class="hi"></div><div class="story"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="wash"></div><div class="sbars"><i><b style="width:100%"></b></i></div><div class="shead"><span class="pm">P</span><div><div class="nm">PhraseMan</div><div class="tm">объявление</div></div><span class="x">' + support.io('close', 22) + '</span></div><div class="sl"></div></div>';
  for (const [index, template] of engine.TPL.entries()) {
    const button = document.createElement('button'); button.type = 'button'; button.className = 'ann-gallery-card'; button.dataset.design = template.id;
    button.setAttribute('aria-label', 'Выбрать шаблон «' + template.name + '»'); button.title = 'Выбрать «' + template.name + '» для этой истории. Текст сохранится.';
    const thumb = document.createElement('span'); thumb.className = 'ann-gallery-thumb'; thumb.setAttribute('aria-hidden', 'true');
    const phone = document.createElement('div'); phone.className = 'ph dk ann-static'; phone.dataset.ph = 'gallery-' + template.id; phone.innerHTML = shell(); thumb.appendChild(phone);
    const label = document.createElement('span'); label.className = 'ann-gallery-label';
    const number = document.createElement('span'); number.className = 'ann-gallery-index'; number.textContent = String(index + 1).padStart(2, '0') + '.';
    label.append(number, document.createTextNode(' ' + template.name)); button.append(thumb, label); root.appendChild(button);
    const card = { button, thumb, phone, template, slide: phone.querySelector('.sl') }; cards.push(card);
    button.addEventListener('click', () => {
      if (!enabled) return;
      selected = template.id; updateSelection(); send({ channel: 'pm-ann-gallery-select', design: selected });
    });
    button.addEventListener('keydown', (event) => {
      const columns = getComputedStyle(root).gridTemplateColumns.split(' ').filter(Boolean).length;
      const next = { ArrowRight: index + 1, ArrowLeft: index - 1, ArrowDown: index + columns, ArrowUp: index - columns, Home: 0, End: cards.length - 1 }[event.key];
      if (next === undefined) return;
      event.preventDefault(); cards[Math.max(0, Math.min(cards.length - 1, next))].button.focus();
    });
  }
  const render = (message) => {
    lastMessage = message;
    enabled = message.enabled !== false;
    if (engine.TPL.some((template) => template.id === message.selectedDesign)) selected = message.selectedDesign;
    updateSelection();
    const theme = engine.THEMES[message.theme] ? message.theme : 'ink';
    const ap = message.ap === 'light' ? 'light' : 'dark';
    const content = message.content && typeof message.content === 'object' ? message.content : {};
    const signature = JSON.stringify([content, theme, ap]);
    if (signature === lastSignature) { scheduleLayout(); return; }
    lastSignature = signature;
    for (const card of cards) {
      const entry = support.previewEntry({ ...content, design: card.template.id });
      support.applyTheme(card.phone, theme, ap);
      card.slide.className = 'sl' + (entry.cta ? ' hascta' : '') + (entry.left ? ' left' : '');
      card.slide.innerHTML = entry.render(card.phone, entry.s, { title: entry.s.short, long: false });
      card.phone.querySelector('.scta')?.remove();
      if (entry.cta) {
        const cta = document.createElement('div'); cta.className = 'scta t'; cta.innerHTML = support.io(entry.cta.icon, 18);
        const text = document.createElement('span'); text.textContent = entry.cta.label; cta.appendChild(text); card.phone.querySelector('.story').appendChild(cta);
      }
      for (const counter of card.slide.querySelectorAll('[data-cnt]')) counter.textContent = support.fmt(Number(counter.dataset.cnt)) + (counter.dataset.suf || '');
      for (const text of card.slide.querySelectorAll('[data-type]')) text.textContent = text.dataset.type || '';
    }
    scheduleLayout();
  };
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || event.origin !== origin || event.data?.channel !== 'pm-ann-gallery') return;
    pending = event.data;
    if (!renderFrame) renderFrame = requestAnimationFrame(() => { renderFrame = 0; const next = pending; pending = null; render(next); });
  });
  if (typeof ResizeObserver === 'function') new ResizeObserver(scheduleLayout).observe(root);
  else window.addEventListener('resize', scheduleLayout);
  document.fonts?.ready.then(() => { lastSignature = ''; if (lastMessage) render(lastMessage); else scheduleLayout(); }).catch(() => {});
  root.addEventListener('load', scheduleLayout, true);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { event.preventDefault(); send({ channel: 'pm-ann-gallery-close' }); }
  });
  window.addEventListener('pagehide', () => { cancelAnimationFrame(layoutFrame); cancelAnimationFrame(renderFrame); });
  render({ content: { title: 'Ваш заголовок', badge: 'Новая история', blocks: [{ text: 'Текст истории', size: 16, style: 'normal' }] }, theme: 'ink', ap: 'dark', selectedDesign: selected });
  send({ channel: 'pm-ann-gallery-ready', count: cards.length, designs: engine.TPL.map(({ id, name, group }) => ({ id, name, group })), themes: engine.IDS.map((id) => ({ id, name: engine.THEMES[id].name, gradient: !!engine.THEMES[id].gradient })) });
})();
</script>
