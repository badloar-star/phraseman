<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макеты 2.0</title>
<link rel="stylesheet" href="kit.css">
<style>
.hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 26px; max-width: 960px; }
.hub .card { padding: 18px 18px 18px 20px; display: flex; align-items: center; gap: 16px; min-height: 74px; }
.hub .tt { font-size: 17px; font-weight: 700; }
.hub .st { font-size: 14px; color: var(--sec); margin-top: 3px; }
.hub .soon { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<div class="page">
  <h1 class="page-h1">PhraseMan 2.0 — макеты</h1>
  <p class="page-lead">Собрано с нуля 24.09 по семи скриншотам живого приложения. Разделы появляются по мере готовности — каждый экран проверен рядом с эталоном.</p>
  <div class="hub" id="hub"></div>
</div>
<script src="kit.js"></script>
<script>
// зачем: владелец должен видеть, что КАЖДЫЙ раздел приложения нарисован — список идёт по COVERAGE.md
const PAGES = [
  // зачем (владелец 04.10): «всё на один макет» — единая точка входа во ВСЕ утверждённые и новые макеты 2.0
  ['etalon.html', 'Эталон', '7 экранов приложения — база стиля'],
  ['home-by-language-mockup.html', 'Главная', 'по языкам; варианты плиток и вход в ошибки — ниже'],
  ['home-tiles-variants.html', 'Главная — варианты плиток', 'раскладки «один/два раздела»'],
  ['home-mistakes-entry.html', 'Главная — вход в ошибки', 'плитка «N ошибок»'],
  ['cards-v2.html', 'Карточки — НОВЫЕ 04.10', '47 экранов: хаб, наборы, сообщество, 4 тренировки, ответы, итог, лимит'],
  ['mistakes-v2.html', 'Мои ошибки — НОВЫЕ 04.10', '17 экранов: хаб, карточка ошибки, отработка, разбор, итог'],
  ['themes-gradient.html', 'Темы — градиенты и ползунок', 'одобрено 04.10: Графит + 10 градиентов'],
  ['redesign-round-1.html', 'Раунд 1 (выбрано)', 'Настройки — A, Словарь — A'],

  ['practice.html', 'Тренировки и итог', 'Блиц, Устно, Правда/ложь, Вспомни; энергия; единый итог'],
  ['spire.html', 'Шпиль', 'башня, ступень, итоги'],
  ['video.html', 'Видео', 'каналы, премьеры, плеер, набор к ролику, таймкоды'],
  ['dialogs.html', 'Диалоги', 'хаб, брифинг, сессия, тьютор, компаньон'],
  ['learn.html', 'Обучение (уроки)', 'список, урок, задания, экзамены, диагностика'],
  ['learning-v2.html', 'Learning V2', 'карта курса, сессии, режимы'],
  ['community.html', 'Сообщество и друзья', 'друзья, заявки, визитка, приглашения'],
  ['profile.html', 'Профиль и настройки', 'аккаунт, язык, уведомления, приватность'],
  ['results.html', 'Результаты', 'серия, витрина достижений, ошибки, статистика'],
  ['coins.html', 'Монеты, ранги, Plus', 'кошелёк, ранги, повышение, пейволлы'],
  ['system.html', 'Системные окна', 'обновления, офлайн, ошибки, подтверждения, тосты, таббар'],

// зачем: владелец жаловался «макеты не открываются» — ссылка ведёт только на существующие страницы
Promise.all(PAGES.map(([h]) => fetch(h, { method: 'HEAD' }).then((r) => r.ok).catch(() => location.protocol === 'file:'))).then((ok) => {
  document.getElementById('hub').innerHTML = PAGES.map(([h, t, s], i) => `<a href="${h}" class="card t${ok[i] ? '' : ' soon'}"><div class="grow"><div class="tt">${t}</div><div class="st">${ok[i] ? s : 'готовится'}</div></div><span style="color:var(--sec)">${K.icon('fwd', 's20')}</span></a>`).join('');
  K.init();
});
</script>
</body>
</html>
