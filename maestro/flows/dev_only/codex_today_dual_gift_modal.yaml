appId: app.phraseman
clearState: true
---
- runFlow: ../_shared/open_dev_client_8082.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- openLink: "phraseman:///settings_testers?qaDualGiftLevel=2"
- runFlow: ../_shared/accept_ios_open_prompt.yaml
- extendedWaitUntil:
    visible:
      id: "level-gift-dual-modal"
    timeout: 60000
- assertVisible:
    id: "level-gift-dual-f2p-open"
- assertVisible:
    id: "level-gift-dual-prem-open"
- assertVisible: "Подарок за уровень"
- assertVisible: "Бонус премиум"
- tapOn:
    id: "level-gift-dual-f2p-open"
- extendedWaitUntil:
    visible: "Ещё награда!"
    timeout: 15000
- tapOn:
    id: "level-gift-dual-prem-open"
- extendedWaitUntil:
    visible:
      id: "level-gift-dual-rewards"
    timeout: 20000
- assertVisible:
    id: "level-gift-dual-claim"
- assertVisible:
    id: "level-gift-dual-save-opened"
- assertVisible: "Использовать сейчас"
- assertVisible: "Сохранить в подарках"
- takeScreenshot: codex_today_dual_gift_modal_pass
