appId: app.phraseman
clearState: false
---
- runFlow: ../_shared/open_dev_client_8082.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- runFlow: ../_precondition.yaml
- scrollUntilVisible:
    element:
      id: "home-league-open"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 30
- tapOn:
    id: "home-league-open"
- extendedWaitUntil:
    visible:
      id: "club-tab-chat"
    timeout: 30000
- tapOn:
    id: "club-tab-chat"
- extendedWaitUntil:
    visible:
      id: "league-chat-panel"
    timeout: 30000
- tapOn:
    id: "league-chat-input"
- inputText: "codex keyboard check"
- assertVisible:
    id: "league-chat-input"
- takeScreenshot: codex_today_league_chat_keyboard_visible
