<header class="review"><div><div class="eyebrow">Phraseman · продуктовый макет / 01</div><h1>Ошибки становятся навыком.</h1><p>Один слот с последним уроком. Полный путь: от первого разбора до самостоятельного ответа через несколько дней.</p></div><div class="controls"><button class="control active" id="walk">Пройти сценарий</button><button class="control" id="all">Все экраны</button><button class="control" id="theme" aria-pressed="false">Светлая тема</button></div></header>
<main id="work" class="work"><nav id="nav" class="nav" aria-label="Экраны макета"></nav><section class="phone-wrap"><div id="device" class="phone"><div class="statusbar"><span>9:41</span><span class="hardware">▂▄▆ ▰</span></div><div id="app" class="app" aria-live="polite"></div><div class="safe"></div></div><div class="under"><button class="control" id="prev">← Назад</button><button class="control" id="next">Следующий экран →</button></div></section><aside id="notes" class="notes"></aside></main><section id="gallery" class="gallery hidden" aria-label="Все состояния"></section>
<script>
const assets={mistakes:'../../../assets/images/home_mistakes/home-mistakes-dark.webp',lesson:'../../../assets/images/home_menu/home-forest-lessons.webp',cards:'../../../assets/images/home_menu/home-forest-cards.webp',logo:'../../../assets/images/icon.webp'};
const screens=[
['home','Вход','Главная · ошибки','Один общий слот. Предлагаем заметные переключатели «Ошибки / Последний урок» внутри него: урок остаётся доступен. В макете порог показа ещё не меняем — здесь 12 готовых ошибок.'],
['lesson','Вход','Тот же слот · последний урок','Геометрия слота не меняется. Переключение не двигает плитки ниже. Это предлагаемое явное управление вместо необходимости угадывать долгое нажатие.'],
['setup','Вход','Короткое занятие','Один bottom sheet. По умолчанию три затруднения, примерно две минуты. 5/10/15/Все сохраняются как варианты объёма. Числа и примеры — демонстрационные.'],
['recap','Отработка','Вспоминаем затруднение','Знакомый промах и конкретный контраст. Это объяснение перед практикой, поэтому показ ответа не засчитывается как самостоятельный успех.'],
['choice','Отработка','Выбор в новом контексте','Та же конструкция, другая знакомая фраза. Правильный вариант не закреплён за последней позицией. Можно выбрать любой ответ и увидеть соответствующий разбор.'],
['wrong','Отработка','Разбор выбранного ответа','Пояснение относится к реально выбранной ловушке. Никакого универсального «обрати внимание». Это не потеря энергии.'],
['correct','Отработка','Промежуточный успех','Небольшой успех без заявления, что ошибка уже устранена. Переходим к следующему затруднению; к этой конструкции вернёмся позже.'],
['build','Отработка','Порядок слов','Вторая ошибка: вопрос. Собери предложение из плиток; плитку в ответе можно убрать. Правильная фраза до проверки не показана.'],
['build-feedback','Отработка','Обратная связь сборки','После действия показываем правильный порядок. Этот формат помогает собрать конструкцию, но ещё не доказывает самостоятельное воспроизведение.'],
['listening','Отработка','Сначала услышать','Третье затруднение: различить похожие слова на слух. В интерактивном макете звук читает браузер; это не запись из приложения.'],
['listen-feedback','Отработка','Результат аудирования','При неверном выборе объясняем hear/here. При верном — отмечаем услышанное слово без лишнего разбора.'],
['typing','Отработка','Возврат без подсказки','После двух других заданий возвращаем первую конструкцию в новом контексте. Здесь уже нужно самостоятельно вспомнить ответ.'],
['typed-feedback','Отработка','Самостоятельный ответ','Показаны оба исхода. Верный ответ — первый самостоятельный успех, а не «закреплено навсегда». Неверный — разбор и возврат позже.'],
['finish','Результат','Занятие закончено','Отдельно показываем практику, самостоятельный ответ и ожидание следующей проверки. XP в макете соответствует 10 за завершение и 5 за верный самостоятельный ответ. Руны показаны отдельно.'],
['due','Результат','Следующая проверка · общий слот','В другой день общий слот предлагает короткую проверку без повторного объяснения. Последний урок доступен в том же месте.'],
['check','Результат','Проверка через несколько дней','Новый контекст, никакого target на экране. Для примера у навыка уже есть два самостоятельных успеха в разные дни. Это отдельная временная ветка макета.'],
['mastered','Результат','Теперь закреплено','Только после третьей разнесённой независимой проверки. Показываем понятное изменение и звезду закрепления. Исторические даты — демонстрационные.'],
['speech','Другие состояния','Произношение','Отдельный пример ошибки произношения. Показ образца допустим для повторения, но не для проверки извлечения смысла из памяти. Голосовой результат здесь симулируется.'],
['speech-error','Другие состояния','Речь не распознана','Техническая неопределённость не создаёт новую ошибку. Можно повторить или вернуться позже; фраза не объявляется закреплённой.'],
['pause','Другие состояния','Выйти из занятия','Сохраняем текущий шаг. Никакого наказания за прерывание. Сохранение должно работать для входа с главной.'],
['resume','Другие состояния','Продолжить · общий слот','Та же карточка предлагает продолжить с места остановки. Энергия за повторный вход в эту сессию не списывается.'],
['small','Другие состояния','Одна готовая ошибка','Показываем содержательный focus-сценарий, а не требование накопить пять ошибок. Доступен через контекстный вход; это не предложение постоянно занимать Home-слот.'],
['empty','Другие состояния','Сейчас всё разобрано','При отсутствии готовых ошибок общий слот возвращается к последнему уроку. Здесь показано состояние раздела при открытии из старого контекстного входа.'],
['cooldown','Другие состояния','Несколько промахов подряд','Остановка действует до следующего дня. Показываем понятный итог без бесконечного повторения той же карточки.'],
['loading','Другие состояния','Подготовка','Спокойное состояние загрузки. В сценарии доступна отмена; в галерее можно рассмотреть экран без автоперехода.'],
['load-error','Другие состояния','Не получилось загрузить','Сохранённая сессия не потеряна. Повтор и выход — реальные действия макета.'],
['plus','Другие состояния','Доступ Plus','Показываем ценность без придуманной цены, скидки или изменения доступа. Покупки в макете нет.'],
['energy','Другие состояния','Не хватает энергии','Одна энергия за новый старт; ноль за ответы и возобновление. Само упражнение не начинается без подтверждённого старта.'],
['hide','Другие состояния','Скрытие и отмена','Скрытие не равнозначно закреплению. Пользователь может сразу отменить действие.'],
['report','Другие состояния','Сообщить о задании','Сохранён существующий путь сообщения о проблеме. Макет только показывает локальное подтверждение, ничего не отправляет.']
];
let current='home',light=false,gallery=false,chosen='on',built=[],typed='',listenAnswer='',typedOK=true,notice='',small=false;
const btn=(text,to,cls='primary')=>`<button class="${cls}" data-go="${to}">${text}</button>`;
const appTop=(label='Отработка ошибок',sub='Короткая тренировка')=>`<div class="top"><button class="icon-btn" data-go="pause" aria-label="Приостановить">×</button><div class="label"><strong>${label}</strong><div class="tiny">${sub}</div></div><button class="icon-btn" data-go="report" aria-label="Сообщить о задании">⚑</button></div>`;
const progress=(n=1)=>`<div class="progress">${[1,2,3,4].map(i=>`<span class="${i<=n?'filled':''}"></span>`).join('')}</div>`;
const foot=(text,to,sub='',second='')=>`<div class="footer">${btn(text,to)}${second}${sub?`<p class="tiny">${sub}</p>`:''}</div>`;
const tags=()=>`<div class="chipline"><span class="badge green">Без потери энергии</span></div>`;
const path=(n=1)=>`<div class="path">${['Разобрался','Ответил сам','Закрепил'].map((s,i)=>`<div class="${i<n?'done':''}"><i></i>${s}</div>`).join('')}</div>`;
const art=()=>`<img class="hero-art" src="${assets.mistakes}" alt="">`;
const row=(name,sub,status='✓')=>`<div class="list-row"><span class="round">${status}</span><div class="grow"><b>${name}</b><small>${sub}</small></div></div>`;
function home(kind='home'){
 const lesson=kind==='lesson'||kind==='empty',due=kind==='due',resume=kind==='resume';
 return `<div class="home-head"><div class="brand"><img src="${assets.logo}" alt="">Phraseman</div><span class="badge gold">PLUS</span></div><div class="home-body"><div class="daily"><span>АНГЛИЙСКИЙ · A1</span><strong>7 дней подряд</strong></div><h2>Привет, Саша.</h2><p>Ещё один небольшой шаг вперёд.</p><div class="slot"><div class="slot-tabs"><button class="${!lesson?'selected':''}" data-go="${due?'due':'home'}">Ошибки ${due?'· 1':'· 12'}</button><button class="${lesson?'selected':''}" data-go="lesson">Последний урок</button></div><div class="slot-main"><img src="${lesson?assets.lesson:assets.mistakes}" alt=""><div><h3>${lesson?'Расскажи о себе':due?'Получится без подсказки?':resume?'Продолжим разбор?':'Давай разберёмся'}</h3><p>${lesson?'Урок 4 · осталось 6 заданий':due?'Одна фраза · меньше минуты':resume?'Остановились на порядке слов':'3 затруднения · около 2 минут'}</p><button class="link" data-go="${lesson?'lesson-view':due?'check':resume?'build':'setup'}">${lesson?'Продолжить урок':due?'Проверить себя':resume?'Продолжить':'Разобрать ошибки'} →</button></div></div></div><div class="home-tiles"><div class="home-tile"><img src="${assets.lesson}" alt=""><strong>Уроки</strong><small>От слов к разговору</small></div><div class="home-tile"><img src="${assets.cards}" alt=""><strong>Карточки</strong><small>Твоя коллекция слов</small></div></div><div class="list-row"><span class="round">◇</span><div class="grow"><b>Клуб</b><small>Твоя лига и друзья</small></div><span class="muted">→</span></div></div><div class="bottomnav"><span>⌂</span><span>◇</span><span>≡</span></div>`;
}
function render(id){
 if(['home','lesson','due','resume'].includes(id))return home(id);
 if(id==='setup'||id==='small')return home()+`<div class="sheetbg"><div class="sheet"><div class="handle"></div>${art()}<div class="chipline"><span class="badge green">Твои настоящие затруднения</span></div><h2>${id==='small'?'Разберём одну ошибку':'Пара минут.<br>Больше уверенности.'}</h2><p class="muted">${id==='small'?'Не нужно копить ошибки. Эту уже можно разобрать.':'Разберём, что запутало, и попробуем ещё раз — с меньшим количеством подсказок.'}</p>${row('Предлоги','interested in, а не interested on','1')}${id==='small'?'':row('Порядок слов','Вопросы с do','2')+row('Похожие на слух слова','hear и here','3')}<div class="lengths">${(id==='small'?['1']:['3','5','10','15','Все']).map((v,i)=>`<button class="${i===0?'selected':''}" data-length="${v}">${v}</button>`).join('')}</div><p class="tiny" id="length-note">${id==='small'?'Одна фраза · около минуты':'Выбрано 3 · около 2 минут'}</p>${btn('Начать разбор','recap')}<p class="tiny">−1 энергия за занятие. За ошибки — 0.</p>${btn('Не сейчас','home','textbtn')}</div></div>`;
 if(id==='recap')return appTop()+progress(1)+`<div class="content"><div class="step-label"><span>1 из 3 затруднений</span><span>Разбираемся</span></div><h2>Маленькое слово.<br>Большая разница.</h2><p class="muted">В прошлый раз тебя запутал предлог после interested.</p><div class="feedback"><span class="tiny">Твой прошлый вариант</span><div class="phrase" style="margin:12px 0">I’m interested <span class="cross">on</span> music.</div><div class="answerline"><span>interested <span class="green-text">in</span></span><span class="green-text">✓</span></div></div><div class="rule"><h3>Запомни вместе</h3><p>Interested <b>in</b> — «интересоваться чем-то».<br>После interested нужен in: in music, in films.</p></div>${path(1)}</div>`+foot('Попробовать в другой фразе','choice','Это объяснение. Дальше попробуешь сам.');
 if(id==='choice'||id==='wrong'||id==='correct'){
 const wrong=id==='wrong',correct=id==='correct';
 return appTop()+progress(1)+`<div class="content"><div class="step-label"><span>1 из 3 · предлоги</span><span>С небольшой опорой</span></div><h2>Выбери предлог</h2><p class="muted">Она интересуется искусством.</p><div class="phrase">She is interested <span class="blank">${wrong?chosen:correct?'in':'…'}</span> art.</div>${['in','at','on'].map(v=>wrong||correct?`<div class="option ${v==='in'?'right':wrong&&v===chosen?'wrong':''}">${v}<span>${v==='in'?'✓':wrong&&v===chosen?'×':''}</span></div>`:`<button class="option" data-choice="${v}">${v}<span class="tiny">→</span></button>`).join('')}${wrong?`<div class="feedback wrong"><h3>Здесь нужен <span class="green-text">in</span></h3><p>${chosen==='at'?'At подходит в good at — «хорошо умеет». Но после interested используется in.':'On часто означает «на». Здесь говорим об интересе к чему-то: interested in art.'}</p></div>`:correct?`<div class="feedback success"><h3 class="green-text">Верно. Interested in.</h3><p>Теперь другая задача. К этому предлогу вернёмся чуть позже, уже без вариантов.</p></div>`:`<p class="hint spaced">Вспомни сочетание из предыдущего шага.</p>`}</div>`+(wrong||correct?foot('Дальше','build',wrong?'Ничего не потеряно. Продолжаем.':''): `<div class="footer">${btn('Нужна подсказка','recap','textbtn')}</div>`);
 }
 if(id==='build')return appTop()+progress(2)+`<div class="content"><div class="step-label"><span>2 из 3 · порядок слов</span><span>Собираем вопрос</span></div><h2>Спроси по-английски</h2><div class="meaning">Ты живёшь здесь?</div><div class="build-zone" id="build-zone">${built.length?built.map(v=>`<button class="token" data-remove="${v}">${v}</button>`).join(''):'<span class="muted">Нажимай на слова ниже</span>'}</div><div class="tokens">${['here','you','Do','live'].map(v=>`<button class="token" data-token="${v}" ${built.includes(v)?'disabled':''}>${v}</button>`).join('')}</div><p class="hint spaced">Нажми на слово в ответе, чтобы убрать его.</p></div><div class="footer"><button class="primary" data-action="check-build" ${built.length!==4?'disabled':''}>Проверить</button>${btn('Вернуться к этому позже','listening','textbtn')}</div>`;
 if(id==='build-feedback')return appTop()+progress(2)+`<div class="content"><div class="step-label"><span>2 из 3 · порядок слов</span><span>Проверка</span></div><h2>${built.join(' ')==='Do you live here'?'Вопрос получился.':'Начни с Do.'}</h2><div class="meaning">Ты живёшь здесь?</div><div class="phrase"><span class="green-text">Do</span> you live here?</div><div class="feedback"><h3>Помощник идёт первым</h3><p>В таком вопросе ставим do перед you. Сам глагол live остаётся без изменений.</p></div><div class="rule"><p>Do + you + live + here?</p></div></div>`+foot('Дальше','listening');
 if(id==='listening')return appTop()+progress(3)+`<div class="content"><div class="step-label"><span>3 из 3 · похожие слова</span><span>На слух</span></div><h2>Какое слово<br>ты слышишь?</h2><p class="muted">Послушай фразу и выбери её смысл.</p><button class="speaker" data-action="play"><span class="play">▶</span><div><div class="wave">${[12,24,36,19,29,40,22,13,27,16].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><span class="tiny">Послушать ещё раз</span></div></button><div id="audio-note" class="hint"></div><button class="option" data-listen="here">Останься здесь.<span>→</span></button><button class="option" data-listen="hear">Я тебя слышу.<span>→</span></button><p class="hint spaced">hear — слышать · here — здесь<br>Они звучат одинаково. Помогает вся фраза.</p></div>`;
 if(id==='listen-feedback')return appTop()+progress(3)+`<div class="content"><div class="step-label"><span>3 из 3 · похожие слова</span><span>Проверка</span></div><h2>${listenAnswer==='here'?'Фраза была о слухе.':'Да, «я тебя слышу».'}</h2><div class="phrase">I can <span class="green-text">hear</span> you.</div><div class="feedback ${listenAnswer==='here'?'wrong':'success'}"><h3>${listenAnswer==='here'?'Hear — действие, here — место.':'Смысл помог различить слова.'}</h3><p>После can здесь нужно действие: hear, «слышать». Here означает «здесь».</p></div><p class="hint spaced">Теперь вернёмся к первому предлогу. Попробуем без готовых вариантов.</p></div>`+foot('Попробовать самостоятельно','typing');
 if(id==='typing'||id==='check')return appTop(id==='check'?'Проверка памяти':'Отработка ошибок',id==='check'?'Без подсказок · около минуты':'Возвращаемся к первой фразе')+progress(4)+`<div class="content"><div class="step-label"><span>${id==='check'?'Проверка 3 из 3':'Самостоятельный ответ'}</span><span>Без вариантов</span></div><h2>Напиши по-английски</h2><div class="meaning">${id==='check'?'Они интересуются музыкой.':'Мы интересуемся фильмами.'}</div><textarea class="input" id="typed" aria-label="Ответ по-английски" placeholder="Твой ответ…" autocomplete="off" spellcheck="false">${typed}</textarea><p class="hint">${id==='check'?'Вспомни выражение сам. Здесь нет таймера.':'Вспомни маленькое слово после interested.'}</p>${id==='check'?`<div class="rule"><p class="muted">Уже получилось самостоятельно</p><p>5 сентября ✓ &nbsp; 7 сентября ✓</p></div>`:''}</div><div class="footer"><button class="primary" data-action="${id==='check'?'check-delayed':'check-type'}">Проверить</button>${btn('Не помню — покажи объяснение','recap','textbtn')}</div>`;
 if(id==='typed-feedback')return appTop()+progress(4)+`<div class="content"><h2>${typedOK?'Теперь — без подсказки.':'Ещё немного практики.'}</h2><div class="phrase">We are interested <span class="green-text">in</span> films.</div><div class="feedback ${typedOK?'success':'wrong'}"><h3>${typedOK?'Ты вспомнил сочетание сам.':'Здесь всё ещё нужен in.'}</h3><p>${typedOK?'Это первый самостоятельный успех. Проверим позже, осталось ли сочетание в памяти.':'Interested in — интересоваться чем-то. Сегодня мы разобрали сочетание; самостоятельный ответ ещё потренируем.'}</p></div>${path(typedOK?2:1)}</div>`+foot('Посмотреть результат','finish');
 if(id==='finish')return appTop('Итог занятия','Три затруднения — чуть понятнее')+`<div class="content center"><div class="big-check">✓</div><h2>Хорошая работа.</h2><p class="muted">Сегодня ты разобрал три затруднения.<br>Закрепление продолжится позже.</p><div class="rewardline"><span>+${typedOK?'15':'10'} XP</span><span>Руны за ответы ◇</span></div><div style="text-align:left">${row('Interested in',typedOK?'Ответил самостоятельно · проверим завтра':'Разобрался · нужна самостоятельная проверка',typedOK?'✓':'↻')}${row('Вопросы с do','Собрал с опорой · ещё потренируем','↻')}${row('Hear / here','Разобрал различие в контексте','✓')}</div><p class="hint spaced">Один верный ответ — шаг вперёд.<br>Устойчивый навык проверим со временем.</p></div>`+foot('На главную','lesson','Последний урок снова в общем слоте');
 if(id==='mastered')return appTop('Закреплено','Результат нескольких дней')+`<div class="content center"><div class="big-check" style="color:var(--yellow)">★</div><h2>Теперь получается.</h2><p class="muted">Ты вспомнил interested in самостоятельно в трёх проверках в разные дни.</p><div class="phrase">They are interested<br><span class="green-text">in</span> music.</div>${path(3)}<div class="mini"><b>5 сентября → 7 сентября → сегодня</b><br>Разные фразы. Без готового ответа.</div><div class="rewardline"><span>+1 звезда закрепления</span></div><p class="hint">Эта ошибка уходит из активной отработки.<br>Если снова запутаешься, поможем ещё раз.</p></div>`+foot('Продолжить последний урок','lesson');
 if(id==='speech')return appTop('Отработка произношения','Другой пример затруднения')+`<div class="content center"><span class="badge">Повторение по образцу</span><h2>Скажи спокойно.</h2><p class="muted">Послушай, затем произнеси фразу целиком.</p><div class="phrase">Three green trees.</div><button class="secondary" data-action="play-speech">▶ Послушать образец</button><button class="mic" data-go="speech-error" aria-label="Попробовать произнести">●</button><p class="hint">Нажми, чтобы попробовать</p><div class="mini">Здесь тренируем произношение.<br>Это не проверка перевода по памяти.</div></div>`+foot('Вернуться позже','home','Ошибки распознавания не считаются твоими');
 if(id==='speech-error')return appTop('Отработка произношения','Техническая пауза')+`<div class="content center"><div class="big-check">↻</div><h2>Не получилось<br>расслышать.</h2><p class="muted">Это не ошибка в английском.<br>Попробуй ещё раз в тихом месте.</p><div class="mini">Эта попытка не повлияла на прогресс.<br>Дополнительная энергия не потрачена.</div></div>`+foot('Попробовать ещё раз','speech','',btn('Вернуться к фразе позже','home','textbtn'));
 if(id==='pause')return render('choice')+`<div class="sheetbg"><div class="sheet"><div class="handle"></div><h2>Продолжим позже?</h2><p class="muted">Сохраним твои ответы и место остановки. Начинать заново не придётся.</p>${btn('Остаться в занятии','build')}${btn('Сохранить и выйти','resume','secondary')}<p class="tiny">При продолжении энергия не списывается.</p></div></div>`;
 if(id==='empty')return appTop('Ошибки','Всё готовое уже разобрано')+`<div class="content center">${art()}<h2>Сейчас всё разобрано.</h2><p class="muted">Можно двигаться дальше.<br>Когда придёт время проверки, покажем её в общем слоте на главной.</p><div class="mini">Следующая проверка — завтра<br><b>Interested in</b></div></div>`+foot('К последнему уроку','lesson');
 if(id==='cooldown')return appTop()+`<div class="content"><span class="badge">Дадим памяти паузу</span><h2>На сегодня<br>достаточно.</h2><p class="muted">Этот предлог пока путается. Мы сохранили результат и вернёмся к нему завтра.</p><div class="feedback"><div class="phrase" style="margin:0">interested <span class="green-text">in</span></div><p>Интересоваться чем-то.<br>I’m interested in music.</p></div><div class="mini">Следующая попытка — завтра.<br>Сегодня эту фразу больше не повторяем.</div></div>`+foot('Завершить занятие','finish');
 if(id==='loading')return appTop('Готовим занятие','Твои ошибки уже сохранены')+`<div class="content center"><div class="loading">◌</div><h2>Подбираем практику.</h2><p class="muted">Берём то, что сейчас полезно повторить.</p></div>`+foot('Отменить','home','',btn('Показать готовое занятие','recap','textbtn'));
 if(id==='load-error')return appTop('Не удалось открыть занятие','Можно попробовать ещё раз')+`<div class="content"><h2>Ответы не потеряны.</h2><p class="muted">Сейчас не получилось подготовить задания. Попробуй ещё раз.</p><div class="mini">Сохранённый прогресс останется на месте.</div></div>`+foot('Попробовать снова','loading','',btn('На главную','home','textbtn'));
 if(id==='plus')return home()+`<div class="sheetbg"><div class="sheet"><div class="handle"></div>${art()}<span class="badge gold">PHRASEMAN PLUS</span><h2>Практика под твои<br>затруднения.</h2><p class="muted">Конкретный разбор, новые примеры и проверка спустя время — чтобы стало получаться самостоятельно.</p>${row('Твои ошибки уже сохранены','Ничего не нужно собирать вручную')}${btn('Посмотреть возможности Plus','plus-details')}${btn('Продолжить обычный урок','lesson','textbtn')}</div></div>`;
 if(id==='energy')return home()+`<div class="sheetbg"><div class="sheet"><div class="handle"></div><span class="badge gold">ЭНЕРГИЯ · 0</span><h2>Для старта нужна<br>1 энергия.</h2><p class="muted">Ошибки сохранены. Вернись к разбору, когда энергия восстановится.</p><div class="mini">Один расход за новое занятие.<br>За неверные ответы энергия не списывается.</div>${btn('Вернуться позже','home')}</div></div>`;
 if(id==='hide')return appTop()+`<div class="content"><h2>Скрыть эту ошибку?</h2><div class="phrase">interested in</div><p class="muted">Уберём её из отработки. Закреплённой она не станет.</p>${notice?`<div class="toast" role="status">Скрыто. <button class="textbtn" data-action="undo-hide">Отменить</button></div>`:''}</div><div class="footer"><button class="primary" data-action="hide">Скрыть ошибку</button>${btn('Оставить в отработке','choice','textbtn')}</div>`;
 if(id==='report')return appTop('Сообщить о задании','Помоги нам исправить неточность')+`<div class="content"><h2>Что не так?</h2><p class="muted">She is interested … art.</p><textarea class="input" id="report-text" aria-label="Описание проблемы" placeholder="Например, правильный вариант не принимается"></textarea>${notice?'<div class="toast" role="status">Предпросмотр обращения готов. В макете ничего не отправляется.</div>':''}</div><div class="footer"><button class="primary" data-action="report">Готово</button>${btn('Вернуться к заданию','choice','textbtn')}</div>`;
 return home();
}
function show(id){if(id==='lesson-view'){alert('В приложении откроется существующий последний урок. Этот макет посвящён отработке ошибок.');return}if(id==='plus-details'){alert('В приложении откроется существующий экран Plus с актуальными условиями. Покупки в этом макете нет.');return}current=id;notice='';if(id==='typing'||id==='check')typed='';document.getElementById('app').innerHTML=render(id);document.getElementById('app').scrollTop=0;const i=screens.findIndex(s=>s[0]===id),s=screens[i];document.getElementById('notes').innerHTML=`<div class="eyebrow">${s[1]} · экран ${i+1} / ${screens.length}</div><div class="number">${String(i+1).padStart(2,'0')}</div><h2>${s[2]}</h2><p>${s[3]}</p><div class="note-rule"><div class="eyebrow">Интерактивный прототип</div><p>Нажимай кнопки внутри телефона. Варианты ответа, сборка, ввод и переходы работают. Любое состояние можно открыть слева.</p><p>Учебные примеры, даты и прогресс демонстрационные. Это предложение интерфейса, не действующий аккаунт.</p><button class="control" data-go="hide">Показать скрытие ошибки</button></div>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===screens.length-1;}
let group='';document.getElementById('nav').innerHTML=screens.map((s,i)=>{let h=s[1]!==group?`<div class="group">${s[1]}</div>`:'';group=s[1];return h+`<button data-go="${s[0]}"><b>${String(i+1).padStart(2,'0')}</b>${s[2]}</button>`}).join('');
function galleryRender(){document.getElementById('gallery').innerHTML=screens.map((s,i)=>`<article class="phone-wrap"><div class="phone ${light?'light':''}"><div class="statusbar"><span>9:41</span><span>▂▄▆ ▰</span></div><div class="app">${render(s[0])}</div><div class="safe"></div></div><div class="caption"><b>${String(i+1).padStart(2,'0')} · ${s[2]}</b><p>${s[3]}</p><button class="control" data-open="${s[0]}">Открыть интерактивно →</button></div></article>`).join('')}
document.getElementById('all').onclick=()=>{gallery=true;galleryRender();document.getElementById('work').classList.add('hidden');document.getElementById('gallery').classList.remove('hidden');document.getElementById('all').classList.add('active');document.getElementById('walk').classList.remove('active')};
document.getElementById('walk').onclick=()=>{gallery=false;document.getElementById('work').classList.remove('hidden');document.getElementById('gallery').classList.add('hidden');document.getElementById('walk').classList.add('active');document.getElementById('all').classList.remove('active')};
document.getElementById('theme').onclick=()=>{light=!light;document.getElementById('device').classList.toggle('light',light);document.getElementById('theme').textContent=light?'Тёмная тема':'Светлая тема';document.getElementById('theme').setAttribute('aria-pressed',String(light));if(gallery)galleryRender()};
document.getElementById('next').onclick=()=>show(screens[Math.min(screens.length-1,screens.findIndex(s=>s[0]===current)+1)][0]);document.getElementById('prev').onclick=()=>show(screens[Math.max(0,screens.findIndex(s=>s[0]===current)-1)][0]);
function say(text){if(!('speechSynthesis' in window)){const el=document.getElementById('audio-note');if(el)el.textContent='В этом браузере звук недоступен. Эталон: I can hear you.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u)}
const normalize=s=>s.toLowerCase().replace(/[.,!?]/g,'').replace(/[’]/g,"'").replace(/\s+/g,' ').trim();
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){document.getElementById('walk').click();show(b.dataset.open);window.scrollTo(0,0);return}if(b.dataset.go){show(b.dataset.go);return}if(b.dataset.choice){chosen=b.dataset.choice;show(chosen==='in'?'correct':'wrong');return}if(b.dataset.listen){listenAnswer=b.dataset.listen;show('listen-feedback');return}if(b.dataset.token){built.push(b.dataset.token);show('build');return}if(b.dataset.remove){built=built.filter(x=>x!==b.dataset.remove);show('build');return}if(b.dataset.length){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('length-note').textContent=b.dataset.length==='Все'?'Все готовые · максимум 30':`Выбрано ${b.dataset.length} · ${b.dataset.length==='3'?'около 2 минут':'более длинное занятие'}`;return}switch(b.dataset.action){case'check-build':show('build-feedback');break;case'play':say('I can hear you.');break;case'play-speech':say('Three green trees.');break;case'check-type':{typed=document.getElementById('typed').value;if(!typed.trim()){document.getElementById('typed').focus();return}typedOK=['we are interested in films',"we're interested in films",'we are interested in movies',"we're interested in movies"].includes(normalize(typed));show('typed-feedback');break}case'check-delayed':{typed=document.getElementById('typed').value;if(!typed.trim()){document.getElementById('typed').focus();return}if(['they are interested in music',"they're interested in music"].includes(normalize(typed)))show('mastered');else show('cooldown');break}case'hide':notice='hidden';document.getElementById('app').innerHTML=render('hide');break;case'undo-hide':show('choice');break;case'report':notice='report';document.getElementById('app').innerHTML=render('report');break}});
show('home');
</script></body></html>
