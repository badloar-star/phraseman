<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщество — плашка про наборы</title>
<style>
:root{color-scheme:dark;--chip:#1c1c21;--chipOn:#f4f4f6;--mut:#8d8e97;--ink:#0b0b0d}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:#fff;font-family:-apple-system,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:720px;margin:0 auto;padding:18px 16px 40px}h1{font-size:21px;line-height:26px;margin:0 0 12px;letter-spacing:-.3px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}.lbl{color:var(--mut);font-size:14px;font-weight:700;margin:0 4px 0 8px}.lbl:first-child{margin-left:0}
.chp{padding:9px 14px;border-radius:999px;background:var(--chip);color:#fff;font-weight:700;font-size:14px;line-height:18px;font-family:inherit;border:0;cursor:pointer;transition:transform 140ms ease-out}
.chp:active{transform:scale(.96)}.chp.on{background:var(--chipOn);color:var(--ink)}
.stage{display:flex;justify-content:center;margin-top:16px}.ph{position:relative;width:430px;max-width:100%;aspect-ratio:390/844;border-radius:34px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none}
.ph canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.dp{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0}
.note{color:var(--mut);font-size:15px;line-height:21px;margin:16px auto 0;text-align:center;max-width:560px;text-wrap:balance}
/* плашка: компактная, 1px полупрозрачная обводка (разрешена в 2.0), мягкая иконка «!» янтарного тона, ✕ с зоной 44×44 */
.nt{position:absolute;left:14px;width:362px;display:flex;align-items:center;gap:8px;padding:8px 40px 8px 10px;border-radius:16px;box-sizing:border-box;transition:opacity 160ms ease-out,transform 220ms cubic-bezier(.2,.8,.2,1)}
.nt.out{opacity:0;transform:translateY(-6px);pointer-events:none}
.nt .ic{flex:none;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;line-height:1}
.nt p{margin:0;flex:1;min-width:0;font-size:15px;line-height:20px;font-weight:500}
.nt button{position:absolute;right:-2px;top:50%;margin-top:-22px;flex:none;width:44px;height:44px;border:0;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:inherit;transition:transform 120ms ease-out}
.nt button:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.nt,.chp,.nt button{transition:none}}
</style></head><body>

<script>
(() => {
  /* ─── кадр Codex rev8-social (390×844 dp): заголовок «Наборы» + «+» заканчивается около y=512, список карточек с y=526, нижняя панель с y≈744 ─── */
  const FR = window.PK_FR; const W = 390, H = 844, NT_Y = 522, GAP = 10, NAV_Y = 744, LIST_Y = 516; let NT_H = 62, SHIFT = NT_H + GAP;
  /* пять текстов выбраны владельцем; в приложении показывается тот, чей номер = (номер недели mod 5), без сети и Firebase */
  const TEXTS = ['Наборы от пользователей. Если выглядит странно — так и есть.', 'Наборы сообщества: бесплатно, от души и без гарантий.', 'Наборы от пользователей. Не проверяли, но уважаем смелость.', 'Наборы пользовательские. Опечатка — ваше новое слово.', 'Эти наборы мы даже не открывали. Честно.'];
  const q = new URLSearchParams(location.search); const pick = (k, l, d) => (l.includes(q.get(k)) ? q.get(k) : d);
  let MODE = pick('mode', ['was', 'now'], 'now'), WEEK = +pick('w', ['1', '2', '3', '4', '5'], '1'), AP = pick('ap', ['dark', 'light'], 'dark'), CLOSED = q.get('closed') === '1'; const VAR_OF = () => (WEEK - 1) % 5;
  const imgs = {}; let cur = 0 /* текущий сдвиг, dp */, raf = 0;
  const ctl = (id, items, c, key) => { document.getElementById(id).innerHTML = items.map(([k, n]) => '<button class="chp' + (String(c) === String(k) ? ' on' : '') + '" data-' + key + '="' + k + '">' + n + '</button>').join(''); };
  /* палитра плашки — по кадру: карточка списка чуть светлее фона (тёмная) / белая (светлая); янтарная иконка, не красная */
  const PAL = { dark: { bg: 'rgba(255,255,255,.07)', line: 'rgba(255,255,255,.14)', text: '#F2F3F6', sub: '#B8BBC4', ic: 'rgba(245,181,68,.22)', icFg: '#F5B544' }, light: { bg: 'rgba(0,0,0,.045)', line: 'rgba(0,0,0,.12)', text: '#1B1D22', sub: '#585C66', ic: 'rgba(214,140,20,.20)', icFg: '#B36B00' } };
  const draw = (shift) => {
    const cv = document.getElementById('cv'), g = cv.getContext('2d'), im = imgs[AP]; if (!im) return; const k = cv.width / W; g.clearRect(0, 0, cv.width, cv.height);
    g.drawImage(im, 0, 0, im.width, LIST_Y * im.width / W, 0, 0, cv.width, LIST_Y * k); // верх без изменений
    if (shift > 0) { g.drawImage(im, 2 * im.width / W, LIST_Y * im.width / W, 1.5 * im.width / W, 6 * im.width / W, 0, LIST_Y * k, cv.width, shift * k); } // «зазор» — растяжка полосы фона
    const sy = LIST_Y * im.width / W, sh = (NAV_Y - LIST_Y - shift) * im.width / W; g.drawImage(im, 0, sy, im.width, sh, 0, (LIST_Y + shift) * k, cv.width, (NAV_Y - LIST_Y - shift) * k); // список уехал вниз
    g.drawImage(im, 0, NAV_Y * im.width / W, im.width, (H - NAV_Y) * im.width / W, 0, NAV_Y * k, cv.width, (H - NAV_Y) * k); // нижняя панель на месте
  };
  const target = () => (MODE === 'now' && !CLOSED ? SHIFT : 0);
  const animate = () => { cancelAnimationFrame(raf); const from = cur, to = target(); const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches; if (reduce || from === to) { cur = to; draw(cur); return; } const t0 = performance.now(), d = 240; const step = (now) => { const p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 3); cur = from + (to - from) * e; draw(cur); if (p < 1) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); };
  const render = () => {
    ctl('cMode', [['was', 'Как сейчас'], ['now', 'Как будет']], MODE, 'mode'); ctl('cVar', [1, 2, 3, 4, 5].map((n) => [n, String(n)]), WEEK, 'w'); ctl('cAp', [['dark', 'Тёмная'], ['light', 'Светлая']], AP, 'ap'); ctl('cSt', [['0', 'Показана'], ['1', 'Закрыта навсегда']], CLOSED ? '1' : '0', 'closed');
    const p = PAL[AP]; const show = MODE === 'now';
    document.getElementById('dp').innerHTML = show ? '<div class="nt' + (CLOSED ? ' out' : '') + '" role="note" style="top:' + NT_Y + 'px;min-height:52px;background:' + p.bg + ';box-shadow:inset 0 0 0 1px ' + p.line + ';color:' + p.text + '"><span class="ic" style="background:' + p.ic + ';color:' + p.icFg + '" aria-hidden="true">!</span><p>' + TEXTS[VAR_OF()] + '</p><button data-act="ok" aria-label="Понял" style="color:' + p.sub + '"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>' : '';
    if (show) { const nt = document.querySelector('.nt'); NT_H = nt.offsetHeight; SHIFT = NT_H + GAP; }
    const lines = show ? Math.round((NT_H - 18) / 20) : 0;
    document.getElementById('note').textContent = !show ? 'Сейчас: список наборов сообщества без предупреждения.' : CLOSED ? 'Закрыта навсегда: после крестика плашка больше не появляется — ни сегодня, ни на новой неделе (запоминается на устройстве). Переключатель недели показывает тексты только тем, кто ещё не закрыл.' : 'Неделя ' + WEEK + ' → текст №' + (VAR_OF() + 1) + ' из пяти (номер недели mod 5, без сети и Firebase). Строк в плашке: ' + lines + '. Кадр — Codex rev8 (не снимок Сверки).';
    animate(); window.__pkDone = true;
    console.log('[NOTICE]', JSON.stringify({ mode: MODE, week: WEEK, ap: AP, closed: CLOSED })); // guard-ok: журнал макета
  };
  const fit = () => { const ph = document.getElementById('ph'); document.getElementById('dp').style.transform = 'scale(' + ph.clientWidth / W + ')'; };
  document.body.addEventListener('click', (e) => { const c = (a) => { const el = e.target.closest('[data-' + a + ']'); return el ? el.dataset[a] : null; };
    const m = c('mode'); if (m) { MODE = m; render(); return; } const v = c('w'); if (v != null) { WEEK = +v; render(); return; } // зачем (владелец): закрытая крестиком плашка не возвращается никогда, даже на новой неделе — смена недели состояние CLOSED не трогает const ap = c('ap'); if (ap) { AP = ap; render(); return; } const st = c('closed'); if (st != null) { CLOSED = st === '1'; render(); return; }
    if (c('act') === 'ok') { CLOSED = true; render(); } });
  window.addEventListener('resize', fit);
  let n = 0; ['dark', 'light'].forEach((ap) => { const im = new Image(); im.onload = () => { imgs[ap] = im; if (++n === 2) { cur = target(); fit(); render(); } }; im.src = FR[ap]; });
  window.__pk = { set: (o) => { if (o.mode) MODE = o.mode; if ('w' in o) WEEK = o.w; if (o.ap) AP = o.ap; if ('closed' in o) CLOSED = o.closed; render(); } };
})();
