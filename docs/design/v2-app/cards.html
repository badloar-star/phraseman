<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточки 2.0</title>
<link rel="stylesheet" href="kit.css">
<style>
/* детали только этой страницы — в манере etalon.html */
.lang { display: inline-flex; align-items: center; gap: 8px; height: 35px; padding: 0 12px 0 10px; border-radius: 18px; background: var(--control); font-size: 15px; font-weight: 700; flex: none; }
.lang img { width: 24px; height: 15px; border-radius: 3px; object-fit: cover; display: block; }
.srch { display: flex; align-items: center; gap: 10px; height: 46px; border-radius: 14px; background: #141416; border: 1px solid var(--line); padding: 0 14px; color: var(--muted); font-size: 16px; }
.seg3 { display: flex; padding: 4px; border-radius: 14px; background: #141416; border: 1px solid var(--line); }
.seg3 > div { flex: 1; text-align: center; height: 36px; line-height: 36px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--sec); }
.seg3 > div.on { background: #2A2A2C; color: var(--text); }
.seg3 .n { color: var(--muted); margin-left: 6px; font-weight: 600; }
.wcard { position: relative; border-radius: 16px; background: var(--card); border: 1px solid var(--line); padding: 16px 16px 16px 18px; display: flex; gap: 16px; align-items: flex-start; }
.wcard .num { width: 18px; color: var(--muted); font-size: 14px; font-weight: 600; padding-top: 5px; flex: none; }
.wcard .w { font-size: 22px; line-height: 28px; font-weight: 600; }
.wcard .ipa { font-size: 15px; color: var(--sec); margin-top: 3px; }
.wcard .tr { font-size: 15px; color: #D6D6D8; margin-top: 7px; line-height: 20px; }
.wcard .acts { display: flex; gap: 10px; align-items: center; flex: none; }
.play { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
.dots { display: flex; gap: 4px; margin-top: 10px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: #3A3A3D; }
.dots i.on { background: #E9E9EB; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 10px; }
.ptile { display: block; }
.ptile .cv { position: relative; aspect-ratio: 1 / 1; border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.ptile .cv img.fan { width: 84%; height: auto; }
.ptile .cnt { position: absolute; right: 7px; bottom: 7px; height: 22px; min-width: 28px; padding: 0 7px; border-radius: 11px; background: rgba(12,12,13,.82); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.ptile .flag { position: absolute; left: 8px; bottom: 9px; width: 20px; height: 13px; border-radius: 3px; object-fit: cover; }
.ptile .own { position: absolute; right: 7px; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: #F2F1F6; color: #0B0C0E; display: flex; align-items: center; justify-content: center; }
.ptile .top { position: absolute; left: 7px; top: 7px; height: 22px; padding: 0 7px; border-radius: 11px; background: rgba(12,12,13,.82); display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; }
.ptile .ed { position: absolute; left: 7px; top: 7px; width: 28px; height: 28px; border-radius: 50%; background: rgba(12,12,13,.82); display: flex; align-items: center; justify-content: center; }
.ptile .del { position: absolute; right: 7px; top: 7px; width: 28px; height: 28px; border-radius: 50%; background: rgba(12,12,13,.82); display: flex; align-items: center; justify-content: center; }
.ptile .nm { font-size: 14px; line-height: 18px; font-weight: 700; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ptile .au { font-size: 13px; color: var(--sec); margin-top: 2px; }
.ptile .mt { display: flex; gap: 10px; color: var(--sec); font-size: 12px; margin-top: 5px; }
.ptile .mt span { display: inline-flex; gap: 4px; align-items: center; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 34px; z-index: 60; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 16px; border-radius: 16px; background: var(--control); border: 1px solid var(--line); font-size: 15px; line-height: 20px; box-shadow: 0 14px 34px rgba(0,0,0,.5); }
.toast b { margin-left: auto; font-weight: 700; flex: none; }
.modal { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); z-index: 60; border-radius: 24px; background: var(--sheet); border: 1px solid var(--line); padding: 24px 20px 20px; text-align: center; }
.modal .mt2 { font-size: 20px; line-height: 26px; font-weight: 700; }
.modal .mb { font-size: 15px; line-height: 21px; color: var(--sec); margin-top: 8px; }
.modal .ma { display: flex; gap: 10px; margin-top: 22px; }
.modal .ma > * { flex: 1; }
.cta.red { background: #3A1E1C; color: #FF8C82; }
.field { border-radius: 14px; background: #141416; border: 1px solid var(--line); padding: 12px 14px; }
.field .lb { font-size: 13px; color: var(--sec); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.field .vl { font-size: 18px; line-height: 24px; margin-top: 6px; }
.field .vl.phd { color: var(--muted); }
.field .hint { font-size: 14px; color: var(--sec); margin-top: 6px; font-style: italic; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--control); font-size: 14px; font-weight: 600; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: #E9E9EB; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; right: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #0B0C0E; }
.sw.off { background: #3A3A3D; } .sw.off::after { right: auto; left: 3px; background: #9A9A9E; }
.chk { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid rgba(255,255,255,.35); flex: none; display: flex; align-items: center; justify-content: center; }
.chk.on { background: #F2F1F6; border-color: #F2F1F6; color: #0B0C0E; }
.bar3 { position: absolute; left: 50%; transform: translateX(-50%); bottom: 32px; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 30px; background: rgba(28,28,30,.96); border: 1px solid var(--line); box-shadow: 0 14px 30px rgba(0,0,0,.5); }
.bar3 .b { height: 44px; padding: 0 20px; border-radius: 22px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--sec); }
.bar3 .b.on { background: #2A2A2C; color: var(--text); }
.bar3 .plus { width: 48px; height: 48px; border-radius: 50%; background: #F2F1F6; color: #0B0C0E; display: flex; align-items: center; justify-content: center; }
.fab { position: absolute; right: 20px; bottom: 34px; z-index: 20; width: 56px; height: 56px; border-radius: 50%; background: #F2F1F6; color: #0B0C0E; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 26px rgba(0,0,0,.5); }
.swipe { position: relative; border-radius: 16px; overflow: hidden; }
.swipe .under { position: absolute; inset: 0; background: #3A1E1C; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; color: #FF8C82; font-weight: 700; font-size: 15px; gap: 8px; }
.swipe .wcard { transform: translateX(-118px); }
.stackv { position: relative; height: 380px; margin-top: 18px; }
.stackv .sc { position: absolute; left: 0; right: 0; top: 0; height: 340px; border-radius: 22px; background: #19191B; border: 1px solid var(--line-2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
.cmt { display: flex; gap: 12px; }
.cmt .av { width: 34px; height: 34px; border-radius: 50%; flex: none; }
.cmt .nm { font-size: 14px; font-weight: 700; }
.cmt .nm span { color: var(--muted); font-weight: 500; margin-left: 6px; }
.cmt .tx2 { font-size: 15px; line-height: 20px; margin-top: 3px; }
.cmt .re { display: flex; gap: 14px; margin-top: 8px; color: var(--sec); font-size: 13px; align-items: center; }
.cmt .re .pl { display: inline-flex; gap: 5px; align-items: center; height: 26px; padding: 0 9px; border-radius: 13px; background: var(--control); color: var(--text); }
.tag2 { display: inline-flex; height: 20px; padding: 0 7px; border-radius: 6px; background: #2A2A2C; font-size: 11px; font-weight: 700; color: var(--sec); align-items: center; margin-left: 6px; }
.opt2 { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line-2); font-size: 16px; }
.opt2 .rd { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.4); flex: none; }
.opt2.on { border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.04); }
.opt2.on .rd { border: 7px solid #F2F1F6; }
.vrow { display: flex; gap: 14px; align-items: center; }
.vthumb { position: relative; width: 150px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; flex: none; background: linear-gradient(135deg, #2E2E31, #151517); border: 1px solid var(--line); }
.vthumb .cap { position: absolute; left: 10px; top: 9px; right: 30px; font-size: 14px; line-height: 16px; font-weight: 800; letter-spacing: -.2px; text-transform: uppercase; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.vthumb .pb2 { position: absolute; left: 10px; bottom: 7px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
.vthumb .du { position: absolute; right: 6px; bottom: 6px; height: 19px; padding: 0 6px; border-radius: 6px; background: rgba(0,0,0,.7); font-size: 11px; font-weight: 700; display: flex; align-items: center; }
.skel { background: linear-gradient(90deg, #17171A, #1F1F22, #17171A); background-size: 300px 100%; animation: sk 1.3s infinite linear; border-radius: 10px; }
@keyframes sk { from { background-position: -300px 0; } to { background-position: 300px 0; } }
.qd { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
.qd i { width: 6px; height: 6px; border-radius: 50%; background: #E9E9EB; } .qd i.off { background: #3A3A3D; }
.plusb { height: 24px; padding: 0 9px; border-radius: 12px; background: #0B0C0E; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
/* дополнение 25.09 */
.spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spn .8s linear infinite; flex: none; display: inline-block; }
@keyframes spn { to { transform: rotate(360deg); } }
.tilespin { position: absolute; inset: 0; background: rgba(12,12,13,.55); display: flex; align-items: center; justify-content: center; border-radius: 16px; z-index: 2; }
.vhero { position: relative; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: radial-gradient(90% 120% at 80% 20%, #3A3A3E, #121214 70%); border: 1px solid var(--line); }
.vhero .cap { position: absolute; left: 18px; top: 16px; font-size: 26px; line-height: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: -.3px; }
.vhero .pbig { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; }
.vhero .du { position: absolute; right: 12px; bottom: 12px; height: 24px; padding: 0 8px; border-radius: 8px; background: rgba(0,0,0,.7); font-size: 13px; font-weight: 700; display: flex; align-items: center; }
.toast.hintin { animation: tin 420ms cubic-bezier(.2,1,.3,1) both; }
@keyframes tin { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.flipin { animation: flp 700ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes flp { 0% { transform: perspective(900px) rotateY(-180deg); opacity: .2; } 55% { opacity: 1; } 100% { transform: perspective(900px) rotateY(0); } }
.likepop svg { animation: lkp 600ms cubic-bezier(.3,1.6,.5,1) both; }
@keyframes lkp { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
.pgbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--line-2); background: #161618; color: var(--text); font: 600 14px Inter, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div class="page">
  <h1 class="page-h1">Карточки</h1>
  <p class="page-lead">Все экраны раздела из кода приложения (опись — spec_cards.md), в стиле эталона. Цены в рунах, покупка наборов за жемчуг, опыт и «набор в подарок» убраны — их в 2.0 нет.</p>
  <nav class="page-nav"><a href="index.html">Все разделы</a><a href="etalon.html">Эталон</a><a class="on" href="cards.html">Карточки</a></nav>

</div>
<script src="kit.js"></script>
<script>
const { icon, phone, col, block, sheet } = K;
const A = 'assets/';
const ch = `<span class="ch" style="color:var(--sec)">${icon('fwd', 's20')}</span>`;
// зачем: владелец — «кнопки языков везде — ОДНА кнопка выбора с флагом»
const lang = (code = 'EN', f = 'language_en') => `<span class="lang t"><img src="${A}${f}.webp" alt="">${code}${icon('down', 's16')}</span>`;
const back = (o = '') => `<span class="rb t" ${o}>${icon('arrowL', 's20')}</span>`;
const hdr = (title, right = '', sub = '') => `<div class="flex" style="gap:14px">${back()}<div class="grow"><div style="font-size:20px;line-height:24px;font-weight:700">${title}</div>${sub ? `<div style="font-size:15px;color:var(--sec);margin-top:2px">${sub}</div>` : ''}</div>${right}</div>`;
const m = (h, p, c) => `<span>${icon('heart', 's18')}${h}</span><span>${icon('people', 's18')}${p}</span>${c != null ? `<span>${icon('chat', 's18')}${c}</span>` : ''}`;

// ---------- 1. Хаб ----------
const packRow = (t, a, meta, n) => `<div class="card t"><div class="row" style="min-height:74px"><div class="tx"><div class="tt">${t}</div><div class="st" style="font-size:16px">${a}</div><div class="meta">${meta}</div></div><span class="cntp">${n}</span>${ch}</div></div>`;
const myRow = (ic, t, s) => `<div class="card t"><div class="row"><div class="tile">${icon(ic, 's20')}</div><div class="tx"><div class="tt">${t}</div><div class="st">${s}</div></div>${ch}</div></div>`;
const hubTop = `<div class="topbar">${back()}<span class="rb t">${icon('plus', 's20')}</span></div>
  <div class="lt"><div class="ti">Карточки</div><div class="su">Учите слова и фразы эффективнее</div></div>
  <div class="sec" style="margin-top:34px"><div class="ti">Лучшее у сообщества</div><div class="ac">Смотреть все ${icon('fwd', 's16')}</div></div>`;
const hubMine = `<div class="divider"></div><div class="sec" style="margin-top:0"><div class="ti">Ваши карточки</div></div>
  <div class="stack">${myRow('bookmark', 'Сохранённые', 'Личная коллекция')}${myRow('layers', 'Мои наборы', 'Созданные и добавленные')}${myRow('people', 'Наборы пользователей', 'Открыть каталог')}</div>`;
const hubLimit = () => phone(`${hubTop}<div class="stack">${packRow('Family', 'Лидия', m(4, 9), 20)}${packRow('B2 глаголы', 'Ирина', m(3, 11, 1), 49)}${packRow('Антоніми дієслів', 'Natalia', m(1, 2), 30)}</div>${hubMine}
  <div class="cta t" style="margin-top:22px"><span class="plusb">${icon('lockF', 's16')}Plus</span>Тренироваться с карточками</div>
  <div class="qd"><i class="off"></i><i class="off"></i><i class="off"></i></div>`, { time: '12:52' });
const hubEmpty = () => phone(`${hubTop}<div class="card" style="padding:26px 20px;text-align:center"><div style="color:var(--sec);display:flex;justify-content:center">${icon('people', 's28')}</div><div style="font-size:16px;font-weight:600;margin-top:12px">Наборы сообщества пока недоступны</div><span class="cta sm gh t" style="margin:16px auto 0;display:inline-flex">Повторить</span></div>${hubMine}
  <div class="cta t" style="margin-top:22px">Тренироваться с карточками<span class="ar">${icon('arrowR', 's20')}</span></div><div class="qd"><i></i><i></i><i class="off"></i></div>`, { time: '12:52' });

// ---------- 2. Сохранённые ----------
const wcard = (n, w, ipa, tr, s = 2) => `<div class="wcard t"><span class="num">${n}</span><div class="grow"><div class="w">${w}</div><div class="ipa">${ipa}</div><div class="tr">${tr}</div><div class="dots">${[0, 1, 2, 3].map((i) => `<i class="${i < s ? 'on' : ''}"></i>`).join('')}</div></div><div class="acts"><span class="play t">${icon('play', 's16')}</span><span style="color:var(--sec)">${icon('dotsH', 's20')}</span></div></div>`;
const savedTop = `<div class="flex" style="gap:12px">${back()}<div class="grow" style="font-size:20px;font-weight:700">Сохранённые</div>${lang()}<span class="rb t">${icon('dotsH', 's20')}</span></div>
  <div class="srch" style="margin-top:18px">${icon('search', 's20')}Поиск по карточкам</div>
  <div class="seg3" style="margin-top:12px"><div class="on">Все<span class="n">128</span></div><div>Слова<span class="n">74</span></div><div>Фразы<span class="n">54</span></div></div>`;
const saved = () => phone(`${savedTop}<div class="stack" style="margin-top:16px">${wcard(1, 'Lay', '[leɪ]', 'класть, помещать', 3)}${wcard(2, 'Claim', '[kleɪm]', 'утверждать, заявлять (право)', 2)}${wcard(3, 'Convince', '[kənˈvɪns]', 'убеждать', 1)}${wcard(4, 'Pitch in', '[pɪtʃ ɪn]', 'вброситься, помочь общему делу', 0)}</div>`, { time: '12:52' });
const savedOpen = () => phone(`${savedTop}<div class="stack" style="margin-top:16px">
  <div class="wcard"><span class="num">1</span><div class="grow"><div class="w">Lay</div><div class="ipa">[leɪ]</div><div class="tr">класть, помещать</div>
    <div style="height:1px;background:var(--line);margin:14px 0"></div>
    <div style="font-size:14px;color:var(--sec)">Дословно: <span style="color:#fff">положить</span></div>
    <div style="font-size:14px;color:var(--sec);margin-top:6px;line-height:19px">Нужен объект: lay the book on the table. Без объекта — lie.</div>
    <div class="flex" style="margin-top:14px;gap:8px"><span class="chipbtn t">${icon('edit', 's16')}Редактировать</span><span class="chipbtn t">${icon('trash', 's16')}Удалить</span><span class="grow"></span><span class="t" style="color:var(--sec)" title="Сообщить об ошибке">${icon('flag', 's18')}</span></div></div>
    <div class="acts"><span class="play t">${icon('play', 's16')}</span></div></div>
  <div class="swipe"><div class="under">${icon('trash', 's20')}Удалить</div>${wcard(2, 'Claim', '[kleɪm]', 'утверждать, заявлять (право)', 2)}</div>
  ${wcard(3, 'Convince', '[kənˈvɪns]', 'убеждать', 1)}</div>`, { time: '12:52', overlay: `<div class="toast">Карточка удалена<b>Вернуть</b></div>` });
const selRow = (on, w, tr, src) => `<div class="card t" style="display:flex;gap:14px;align-items:center;padding:14px 16px"><span class="chk${on ? ' on' : ''}">${on ? icon('check', 's16') : ''}</span><div class="grow"><div style="font-size:17px;font-weight:600">${w}</div><div style="font-size:14px;color:var(--sec);margin-top:2px">${tr} · ${src}</div></div></div>`;
const savedSelect = () => phone(`<div class="flex" style="height:44px"><span class="t" style="font-size:16px;color:var(--sec);width:80px">Отмена</span><div class="grow center" style="font-size:17px;font-weight:700">Отметить</div><span style="width:80px;text-align:right;font-size:16px;font-weight:600">3 / 128</span></div>
  <div class="stack" style="margin-top:14px">${selRow(1, 'Lay', 'класть', 'Урок 12')}${selRow(1, 'Claim', 'утверждать', 'B2 глаголы')}${selRow(0, 'Convince', 'убеждать', 'B2 глаголы')}${selRow(1, 'Pitch in', 'вброситься', 'Фраза дня')}${selRow(0, 'Hire', 'нанимать', 'Видео')}${selRow(0, 'Fire', 'увольнять', 'Видео')}</div>`, { time: '12:52',
  fixed: `<div style="position:absolute;left:0;right:0;bottom:0;height:130px;z-index:15;background:linear-gradient(transparent,#0C0C0D 55%);pointer-events:none"></div><div style="position:absolute;left:20px;right:20px;bottom:34px;z-index:20;display:flex;gap:10px"><span class="cta t" style="flex:1">Создать набор</span><span class="cta red t" style="width:auto;padding:0 20px">Удалить</span></div>` });
