appId: app.phraseman
---
- runFlow: ../_shared/open_dev_client.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- runFlow: ../_precondition.yaml
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "settings-open-testers"
    direction: DOWN
    timeout: 25000
    speed: 80
    visibilityPercentage: 40
- tapOn:
    id: "settings-open-testers"
- extendedWaitUntil:
    visible:
      id: "testers-section-trainer_debug"
    timeout: 25000
- tapOn:
    id: "testers-section-trainer_debug"
- extendedWaitUntil:
    visible:
      id: "trainer-qa-seed-weak"
    timeout: 15000
- tapOn:
    id: "trainer-qa-seed-weak"
- takeScreenshot: trainer_qa_seed_weak
- tapOn:
    id: "trainer-qa-open-hub"
- extendedWaitUntil:
    visible:
      id: "screen-trainer"
    timeout: 30000
- takeScreenshot: trainer_qa_hub_seeded
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "settings-open-testers"
    direction: DOWN
    timeout: 25000
    speed: 80
    visibilityPercentage: 40
- tapOn:
    id: "settings-open-testers"
- tapOn:
    id: "testers-section-trainer_debug"
- scrollUntilVisible:
    element:
      id: "trainer-qa-open-report-preview"
    direction: DOWN
    timeout: 20000
    speed: 80
    visibilityPercentage: 45
- tapOn:
    id: "trainer-qa-open-report-preview"
- extendedWaitUntil:
    visible:
      id: "screen-trainer-smart-session"
    timeout: 30000
- takeScreenshot: trainer_qa_report_preview
- tapOn:
    text: "Готово"
- extendedWaitUntil:
    visible:
      id: "testers-section-trainer_debug"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "trainer-qa-open-mistake-preview"
    direction: DOWN
    timeout: 20000
    speed: 80
    visibilityPercentage: 45
- tapOn:
    id: "trainer-qa-open-mistake-preview"
- extendedWaitUntil:
    visible:
      id: "screen-trainer-smart-session"
    timeout: 30000
- assertVisible: "Разбор"
- takeScreenshot: trainer_qa_mistake_preview
