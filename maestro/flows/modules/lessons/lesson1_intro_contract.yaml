appId: app.phraseman
clearState: true
---
# Cold user-state contract for Lesson 1 intro.
# Covers: first real entry -> 3 progressive intro cards -> CTA -> real lesson UI.
- runFlow: ../../_shared/boot_to_home.yaml
- tapOn:
    id: "tab-index"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "lessons-row-1"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 25
- tapOn:
    id: "lessons-row-1"
- extendedWaitUntil:
    visible:
      id: "lesson-menu-back"
    timeout: 30000
- tapOn:
    id: "lesson-menu-primary"
- runFlow:
    when:
      visible: "Совет"
    commands:
      - tapOn: "Начать урок"
- runFlow:
    when:
      visible: "Порада"
    commands:
      - tapOn: "Почати урок"
- extendedWaitUntil:
    visible:
      id: "lesson-intro-card-1"
    timeout: 30000
- assertNotVisible:
    id: "lesson-intro-start"
- assertNotVisible:
    id: "lesson-intro-card-2"
- tapOn:
    id: "lesson-intro-card-1"
- extendedWaitUntil:
    visible:
      id: "lesson-intro-card-2"
    timeout: 10000
- assertNotVisible:
    id: "lesson-intro-start"
- tapOn:
    id: "lesson-intro-card-2"
- extendedWaitUntil:
    visible:
      id: "lesson-intro-card-3"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "lesson-intro-start"
    timeout: 15000
- tapOn:
    id: "lesson-intro-start"
- extendedWaitUntil:
    visible:
      id: "lesson1-header-back"
    timeout: 30000
- assertVisible:
    id: "lesson1-scroll"
