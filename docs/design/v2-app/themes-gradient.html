<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Градиентные темы 2.0</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* зачем (владелец 04.10): «10 градиентных тем + как ползунок будет влиять на них» —
     макет на настоящих экранах из эталона; ползунок меняет силу цвета вживую. */
  .ctl { position: sticky; top: 0; z-index: 50; background: rgba(5,5,6,.92); backdrop-filter: blur(14px);
    padding: 16px 0 18px; margin-top: 18px; border-bottom: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 7px 12px 7px 8px; border-radius: 999px;
    background: #161618; border: 1px solid var(--line); color: var(--sec); cursor: pointer; user-select: none; }
  .chip.on { color: #fff; border-color: rgba(255,255,255,.4); background: #222224; }
  .sw { width: 22px; height: 22px; border-radius: 50%; flex: none; }
  .sl { display: flex; align-items: center; gap: 16px; margin-top: 16px; max-width: 640px; }
  .sl span { font-size: 14px; color: var(--sec); white-space: nowrap; }
  .sl b { font-size: 15px; min-width: 44px; text-align: right; }
  input[type=range] { flex: 1; accent-color: #fff; height: 28px; }
  .glow { position: absolute; inset: 0; z-index: 0; pointer-events: none; transition: opacity .12s linear; }
  .ph { background: var(--bg) !important; }
  .ph .card, .ph .card.c2 { background: color-mix(in srgb, var(--acc) calc(var(--k) * 10%), rgba(24,24,27,.72)) !important;
    border-color: color-mix(in srgb, var(--acc) calc(var(--k) * 30%), rgba(255,255,255,.09)) !important; }
  .ph .cta { background: color-mix(in srgb, var(--acc) calc(var(--k) * 100%), #F2F1F6) !important;
    color: var(--on) !important; }
  .ph .trk i { background: color-mix(in srgb, var(--acc) calc(var(--k) * 100%), #FFFFFF) !important; }
  .ph .tile { background: color-mix(in srgb, var(--acc) calc(var(--k) * 16%), #2A2A2C) !important; }
  .stops { display: flex; gap: 22px; margin-top: 10px; font-size: 13px; color: var(--muted); max-width: 640px; justify-content: space-between; padding: 0 120px 0 150px; }
</style>
</head>
<body>
<div class="page">
  <h1 class="page-h1">Градиентные темы</h1>
  <p class="page-lead">Настоящие экраны приложения. Выбери тему вверху и тяни ползунок — фон, карточки, кнопки и полоски меняются сразу. Слева — почти чистый графит, справа — цвет на полную.</p>
  <div class="ctl">
    <div class="chips" id="chips"></div>
    <div class="sl"><span>Насыщенность</span><input id="k" type="range" min="0" max="100" step="1" value="60"><b id="kv">60%</b></div>
  </div>
  <div id="root"></div>
</div>
<script src="kit.js"></script>
<script>
const { icon, phone, col, block, energy } = K;
const ch = `<span class="ch">${icon('fwd', 's20')}</span>`;

// Темы: g1/g2 — два световых пятна поверх графита, acc — акцент кнопок, on — текст на акценте.
const THEMES = [
  ['Графит', null, null, '#F2F1F6', '#0B0C0E'],
  ['Аврора', '#38E0AA', '#7C5CFF', '#7EF0C8', '#04261D'],
  ['Ирис', '#788CFF', '#FF78C8', '#C7C9FF', '#1B1C4A'],
  ['Магма', '#FF5A28', '#FFAA3C', '#FFB27A', '#3A1204'],
  ['Полночь', '#286EFF', '#00D2FF', '#8CC4FF', '#06224D'],
  ['Шампань', '#F0BE78', '#E68296', '#F3D39A', '#3A2608'],
  ['Нефрит', '#14BEA0', '#1E78C8', '#7FE6D2', '#032A24'],
  ['Орхидея', '#D246FF', '#FF3C8C', '#EAA6FF', '#3A0A4A'],
  ['Лёд', '#96DCFF', '#78A0FF', '#BFE6FF', '#0A2A44'],
  ['Коралл', '#FF645A', '#FFA046', '#FFB0A0', '#4A0F0A'],
  ['Сирень', '#A78BFA', '#60A5FA', '#D4C8FF', '#24164A'],
];
let cur = 1;

const packRow = (t, a, n) => `<div class="card t"><div class="row" style="min-height:74px"><div class="tx"><div class="tt">${t}</div><div class="st" style="font-size:16px">${a}</div></div><span class="cntp">${n}</span>${ch}</div></div>`;
const myRow = (ic, t, s) => `<div class="card t"><div class="row"><div class="tile">${icon(ic, 's20')}</div><div class="tx"><div class="tt">${t}</div><div class="st">${s}</div></div>${ch}</div></div>`;
const cardsHub = () => phone(`
  <div class="topbar" style="margin-top:0"><span class="rb t">${icon('arrowL', 's20')}</span><span class="rb t">${icon('plus', 's20')}</span></div>
  <div class="lt"><div class="ti">Карточки</div><div class="su">Учите слова и фразы эффективнее</div></div>
  <div class="sec" style="margin-top:34px"><div class="ti">Лучшее у сообщества</div></div>
  <div class="stack">${packRow('Family', 'Лидия', 20)}${packRow('B2 глаголы', 'Ирина', 49)}</div>
  <div class="divider"></div>
  <div class="stack">${myRow('bookmark', 'Сохранённые', 'Личная коллекция')}${myRow('layers', 'Мои наборы', 'Созданные и добавленные')}</div>
  <div class="cta t" style="margin-top:22px">Тренироваться с карточками<span class="ar">${icon('arrowR', 's20')}</span></div>`, { time: '9:41' });
const cat = (ic, t, s, n, p) => `<div class="card c2 t" style="padding:16px 16px 18px"><div class="flex" style="gap:12px"><div class="tile t55" style="margin-right:10px">${icon(ic, 's26')}</div><div class="grow"><div style="font-size:19px;line-height:24px;font-weight:700">${t}</div><div style="font-size:15px;color:var(--sec);margin-top:6px">${s}</div></div><span class="frac"><b>${p}</b><span>/${n}</span></span>${ch}</div><div class="trk dot" style="margin:18px 4px 0"><i style="width:${Math.round(p / n * 100)}%"></i></div></div>`;
const dialogsHub = () => phone(`
  <div class="flex" style="align-items:flex-start;margin-top:22px"><div class="grow"><div style="font-size:40px;line-height:46px;font-weight:700;letter-spacing:-.6px">Диалоги</div><div style="font-size:16px;color:var(--sec);margin-top:8px">Практикуйте язык в жизненных ситуациях</div></div>${energy(5)}</div>
  <div class="stack g13" style="margin-top:32px">${cat('cupF', 'Каждый день', 'Просьбы, советы и мелочи дня', 11, 4)}${cat('planeF', 'Путешествия', 'В поездках и на отдыхе', 8, 2)}${cat('peopleF', 'Общение', 'Знакомства и разговоры', 13, 7)}${cat('docF', 'Дела', 'Работа, учёба и важные дела', 19, 1)}</div>`, { time: '9:41', inStyle: 'padding-left:16px;padding-right:16px' });
const blitz = () => phone(`
  <div class="flex" style="gap:8px;margin-top:16px"><span class="rb l t" style="margin-right:17px">${icon('back', 's20')}</span><div class="grow"><div style="font-size:20px;font-weight:700">Блиц</div><div style="font-size:15px;color:var(--sec);margin-top:2px">Family</div></div></div>
  <div class="trk" style="margin-top:22px;height:6px"><i style="width:45%"></i></div>
  <div class="qc" style="margin-top:38px"><div class="k">Выбери перевод</div><div class="q">Hire, fire, quit</div></div>
  <div class="stack g13" style="margin-top:23px"><div class="opt t">Нанимать, увольнять, уходить</div><div class="opt t">Складывать, сгибать</div><div class="opt t">Обманывать, изменять</div></div>
  <div class="cta t" style="margin-top:28px">Дальше</div>`, { time: '9:41' });

document.getElementById('root').innerHTML = block('th', 'Как выглядит на экранах', '', [
  col('Карточки', cardsHub()), col('Диалоги', dialogsHub()), col('Блиц', blitz())]);
K.init();

const phones = [...document.querySelectorAll('.ph')];
phones.forEach((p) => { const g = document.createElement('div'); g.className = 'glow'; p.prepend(g); });

function apply() {
  const k = document.getElementById('k').value / 100;
  document.getElementById('kv').textContent = Math.round(k * 100) + '%';
  const [, g1, g2, acc, on] = THEMES[cur];
  const root = document.documentElement.style;
  root.setProperty('--k', g1 ? k : 0);
  root.setProperty('--acc', acc);
  // зачем: при слабой насыщенности кнопка почти белая — текст тёмный; при сильной — свой тёмный тон темы.
  root.setProperty('--on', on);
  phones.forEach((p) => {
    const gl = p.querySelector('.glow');
    gl.style.background = g1
      ? `radial-gradient(120% 55% at 10% 0%, ${g1}, transparent 62%), radial-gradient(100% 55% at 100% 45%, ${g2}, transparent 66%), radial-gradient(90% 40% at 30% 105%, ${g1}, transparent 70%)`
      : 'none';
    gl.style.opacity = g1 ? (0.08 + k * 0.62).toFixed(3) : 0;
  });
}
const chips = document.getElementById('chips');
THEMES.forEach(([n, g1, g2], i) => {
  const c = document.createElement('div');
  c.className = 'chip' + (i === cur ? ' on' : '');
  c.innerHTML = `<span class="sw" style="background:${g1 ? `linear-gradient(135deg, ${g1}, ${g2})` : '#2A2A2C'}"></span>${n}`;
  c.onclick = () => { cur = i; [...chips.children].forEach((x, j) => x.classList.toggle('on', j === i)); apply(); };
  chips.appendChild(c);
});
document.getElementById('k').addEventListener('input', apply);
apply();
</script>
</body>
</html>
