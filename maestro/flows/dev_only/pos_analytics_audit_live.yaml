appId: app.phraseman
---
- runFlow:
    when:
      notVisible:
        id: "screen-pos-analytics-audit"
    commands:
      - runFlow: ../_precondition.yaml
      - waitForAnimationToEnd:
          timeout: 10000
      - tapOn:
          point: "73%,93%"
      - runFlow:
          when:
            visible:
              id: "screen-settings"
          commands:
            - scrollUntilVisible:
                element:
                  id: "settings-open-testers"
                direction: DOWN
                timeout: 60000
                speed: 30
                visibilityPercentage: 10
                centerElement: true
            - tapOn:
                id: "settings-open-testers"
      - scrollUntilVisible:
          element:
            text: "POS token audit"
          direction: DOWN
          timeout: 60000
          speed: 30
          visibilityPercentage: 10
          centerElement: true
      - tapOn:
          text: "POS token audit"
- extendedWaitUntil:
    visible:
      id: "screen-pos-analytics-audit"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "pos-audit-release-coverage"
    direction: UP
    timeout: 30000
    speed: 60
    visibilityPercentage: 20
    centerElement: false
- assertVisible:
    id: "pos-audit-release-ready"
- takeScreenshot: pos_audit_release_coverage
- scrollUntilVisible:
    element:
      id: "pos-audit-coverage-sources"
    direction: DOWN
    timeout: 20000
    speed: 60
    visibilityPercentage: 35
- takeScreenshot: pos_audit_coverage_sources
- scrollUntilVisible:
    element:
      id: "pos-audit-runtime-events"
    direction: DOWN
    timeout: 20000
    speed: 60
    visibilityPercentage: 35
- takeScreenshot: pos_audit_runtime_events
