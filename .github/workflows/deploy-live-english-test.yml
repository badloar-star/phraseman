name: Deploy live English Level Test

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: english-level-test-live-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/english-test-live-deploy' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FIREBASE_PROJECT_ID: phraseman-ea0b3
      RELEASE_SHA256: a752ee8af401486948184d422e69c012f90f52eceddd6e8cf69f96669b93a26e

    steps:
      - name: Check out payload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          path: payload

      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}
          path: production

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and apply reviewed release
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          test -s ../payload/.english-test-live/manifest.json
          test "$(find ../payload/.english-test-live -maxdepth 1 -type f -name 'payload.part*' | wc -l | tr -d ' ')" = '8'
          cat ../payload/.english-test-live/payload.part* > "$RUNNER_TEMP/english-test-live.b64"
          base64 --decode "$RUNNER_TEMP/english-test-live.b64" > "$RUNNER_TEMP/english-test-live.tar.xz"
          echo "$RELEASE_SHA256  $RUNNER_TEMP/english-test-live.tar.xz" | sha256sum --check --strict
          xz --test "$RUNNER_TEMP/english-test-live.tar.xz"
          tar -tJf "$RUNNER_TEMP/english-test-live.tar.xz" > "$RUNNER_TEMP/english-test-live-files.txt"
          sed -n '1,120p' "$RUNNER_TEMP/english-test-live-files.txt"
          tar -xJf "$RUNNER_TEMP/english-test-live.tar.xz" -C .
          node scripts/apply_english_test_live_release.mjs
          node scripts/sync-legal-html.mjs
          test -s knowly-www/english-level-test/index.html
          test -s admin/v2/english-test.html
          test -s functions-english-test/index.js
          test -s functions-english-test/questions.en.json

      - name: Validate public test, bank, admin and backend
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          node --check knowly-www/english-level-test/app.js
          node --check admin/v2/scripts/pages/english-test-standalone.js
          node --check functions-english-test/index.js
          python3 - <<'PY'
          import hashlib, json
          from collections import Counter
          public = open('knowly-www/english-level-test/questions.en.json', 'rb').read()
          server = open('functions-english-test/questions.en.json', 'rb').read()
          assert public == server
          bank = json.loads(public)
          assert bank['bankVersion'] == '2026-07-21.8'
          assert len(bank['questions']) == 240
          assert len({q['id'] for q in bank['questions']}) == 240
          assert Counter(q['level'] for q in bank['questions']) == Counter({'A1':40,'A2':40,'B1':40,'B2':40,'C1':40,'C2':40})
          assert Counter(q['correctIndex'] for q in bank['questions']) == Counter({0:60,1:60,2:60,3:60})
          assert all(len(q['options']) == 4 and 0 <= q['correctIndex'] <= 3 for q in bank['questions'])
          print('Question bank SHA-256:', hashlib.sha256(public).hexdigest())
          PY
          npm install --prefix functions-english-test --ignore-scripts
          npm test --prefix functions-english-test
          npm audit --prefix functions-english-test --omit=dev

      - name: Discover Firebase credential
        id: firebase-auth
        env:
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          REPO_VARS_JSON: ${{ toJSON(vars) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, sys
          from pathlib import Path
          def read_map(name):
              try:
                  value = json.loads(os.environ.get(name, '{}'))
              except Exception:
                  return {}
              return value if isinstance(value, dict) else {}
          secrets = read_map('REPO_SECRETS_JSON')
          variables = read_map('REPO_VARS_JSON')
          relevant = sorted(k for k, v in secrets.items() if v and re.search(r'FIREBASE|GOOGLE|GCLOUD|GCP|CLOUD|WORKLOAD|SERVICE_ACCOUNT', k, re.I))
          print('Available cloud credential keys:', ', '.join(relevant) if relevant else '(none)')
          credential = Path(os.environ['RUNNER_TEMP']) / 'firebase-deploy-credential.json'
          for key, value in secrets.items():
              if not value:
                  continue
              candidates = [str(value)]
              try:
                  candidates.append(base64.b64decode(''.join(str(value).split()), validate=True).decode('utf-8'))
              except Exception:
                  pass
              for candidate in candidates:
                  try:
                      data = json.loads(candidate)
                  except Exception:
                      continue
                  if not isinstance(data, dict):
                      continue
                  kind = data.get('type')
                  project = data.get('project_id') or data.get('quota_project_id')
                  if kind in {'service_account', 'external_account', 'authorized_user'} and (not project or project == 'phraseman-ea0b3'):
                      credential.write_text(candidate, encoding='utf-8')
                      with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                          env.write(f'GOOGLE_APPLICATION_CREDENTIALS={credential}\n')
                      with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                          out.write('mode=adc\n')
                      print(f'Using Google credential from {key} ({kind}).')
                      sys.exit(0)
          for key, value in secrets.items():
              if value and re.search(r'FIREBASE.*TOKEN|TOKEN.*FIREBASE', key, re.I):
                  print(f'::add-mask::{value}')
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                      env.write(f'FIREBASE_DEPLOY_TOKEN={value}\n')
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                      out.write('mode=token\n')
                  print(f'Using Firebase token from {key}.')
                  sys.exit(0)
          merged = {**variables, **secrets}
          provider = next((str(v) for k, v in merged.items() if v and re.search(r'WORKLOAD.*IDENTITY.*PROVIDER|WIF.*PROVIDER', k, re.I)), '')
          account = next((str(v) for k, v in merged.items() if v and re.search(r'(WORKLOAD|WIF|DEPLOY).*SERVICE.*ACCOUNT|SERVICE.*ACCOUNT.*EMAIL', k, re.I)), '')
          if provider and account:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write(f'WIF_PROVIDER={provider}\nWIF_SERVICE_ACCOUNT={account}\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('mode=wif\n')
              print('Using Workload Identity Federation.')
              sys.exit(0)
          print('No Firebase deployment credential is configured.', file=sys.stderr)
          sys.exit(31)
          PY

      - name: Authenticate through Workload Identity
        if: steps.firebase-auth.outputs.mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Functions and both Hosting targets
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          args=(deploy --project "$FIREBASE_PROJECT_ID" --only 'functions:english-test,hosting:knowlywww,hosting:admin' --non-interactive)
          if [[ "${{ steps.firebase-auth.outputs.mode }}" == 'token' ]]; then
            args+=(--token "$FIREBASE_DEPLOY_TOKEN")
          fi
          npx --yes firebase-tools@15.24.0 "${args[@]}"

      - name: Verify production pages and API
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local url="$1" marker="$2"
            for attempt in $(seq 1 18); do
              code="$(curl --silent --show-error --location --max-time 25 --output /tmp/page.html --write-out '%{http_code}' "$url" || true)"
              if [[ "$code" == '200' ]] && grep --fixed-strings --quiet "$marker" /tmp/page.html; then
                echo "Verified: $url"
                return 0
              fi
              echo "Attempt $attempt: $url returned $code"
              sleep 5
            done
            return 1
          }
          verify_page 'https://knowlyapps.web.app/english-level-test/' 'Насколько <em>естественно</em> звучит ваш английский?'
          verify_page 'https://knowlyapps.com/english-level-test/' 'Насколько <em>естественно</em> звучит ваш английский?'
          verify_page 'https://phraseman-ea0b3.web.app/v2/english-test.html' 'English Level Test'
          code="$(curl --silent --show-error --request OPTIONS --header 'Origin: https://knowlyapps.com' --output /tmp/api.txt --write-out '%{http_code}' 'https://knowlyapps.com/api/english-test')"
          test "$code" = '204'
          echo 'Verified routed English-test API.'

      - name: Commit verified production source to master
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          rm -rf functions-english-test/node_modules
          rm -f .github/workflows/deploy-live-english-test.yml
          rm -f .github/workflows/english-level-test-pr15-release.yml
          rm -f .github/workflows/export-english-test-pr15-chunks.yml
          rm -f .github/workflows/export-english-test-pr15-history.yml
          printf 'deployed_at=%s\nrelease_sha256=%s\nworkflow_run=%s\n' "$(date -u +%FT%TZ)" "$RELEASE_SHA256" "$GITHUB_RUN_ID" > .english-test-live-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(web): deploy English level test and analytics [skip ci]'
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: english-test-live-deploy-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/english-test-live-files.txt
            /tmp/page.html
            /tmp/api.txt
            production/firebase-debug.log
          if-no-files-found: ignore
          retention-days: 3
