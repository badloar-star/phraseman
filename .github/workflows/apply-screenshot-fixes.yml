name: Apply screenshot-reported runtime fixes v4

on:
  push:
    branches:
      - audit/screenshot-fixes-2026-08-06
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-screenshot-fixes-v4-2026-08-06
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BASE_SHA: 9629139925eaab85368fb7f26d9824003bd4ff7a
      PATCH_SHA256: ed4afb636150f42c3fcd4c55aad8361a7e77b259c616325ba6e932ed260d37e0
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: audit/screenshot-fixes-2026-08-06
          fetch-depth: 0

      - name: Verify exact temporary payload
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          cat > /tmp/expected-infra.txt <<'EOF'
          .audit/screenshot-fixes.patch.b64.00
          .audit/screenshot-fixes.patch.b64.01
          .audit/screenshot-fixes.patch.b64.02
          .audit/screenshot-fixes.patch.b64.03
          .audit/screenshot-fixes.patch.b64.04
          .audit/screenshot-fixes.patch.b64.05
          .audit/screenshot-fixes.patch.b64.06
          .github/workflows/apply-screenshot-fixes.yml
          EOF
          sed -i 's/^          //' /tmp/expected-infra.txt
          sort -o /tmp/expected-infra.txt /tmp/expected-infra.txt
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/actual-infra.txt
          diff -u /tmp/expected-infra.txt /tmp/actual-infra.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture baseline TypeScript diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          timeout 12m npx tsc --noEmit --pretty false > artifacts/tsc-base.log 2>&1
          code=$?
          set -e
          echo "$code" > artifacts/tsc-base.exit
          test "$code" -ne 124
          test "$code" -ne 137

      - name: Decode and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/screenshot-fixes.patch.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/screenshot-fixes.patch
          echo "$PATCH_SHA256  /tmp/screenshot-fixes.patch" | sha256sum --check
          git apply --check /tmp/screenshot-fixes.patch
          git apply /tmp/screenshot-fixes.patch
          rm -f .audit/screenshot-fixes.patch.b64.*
          rm -f .github/workflows/apply-screenshot-fixes.yml
          git diff --check

      - name: Enforce exact product scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-code.txt <<'EOF'
          app/(tabs)/home.tsx
          app/club_screen.tsx
          app/daily_task_navigation.ts
          app/daily_tasks.ts
          app/daily_tasks_es_locale.ts
          app/daily_tasks_screen.tsx
          app/home_last_lesson_resolver.ts
          app/home_screen_hydration.ts
          app/lesson1.tsx
          app/personal_plan_exercise.tsx
          app/personal_plan_progress.ts
          app/plan_content_runtime_adapter.ts
          app/review.tsx
          app/trainer_phrases_session.tsx
          app/trainer_words_session.tsx
          tests/daily_quests_active_catalog_contract.test.ts
          tests/daily_task_reroll.test.ts
          tests/daily_tasks_active_executability_contract.test.ts
          tests/daily_tasks_claim.test.ts
          tests/daily_tasks_completed_card_stability.test.ts
          tests/daily_tasks_inflight_progress.test.ts
          tests/daily_tasks_language_availability.test.ts
          tests/daily_tasks_recall_availability.test.ts
          tests/daily_tasks_safe_fallback.test.ts
          tests/daily_tasks_screen_cache.test.ts
          tests/daily_tasks_trainer_availability.test.ts
          tests/home_runtime_truth_contract.test.ts
          tests/league_focus_refresh_contract.test.ts
          tests/lesson_completion_daily_task_delivery_contract.test.ts
          tests/personal_plan_completion_persistence_contract.test.ts
          tests/plan_content_runtime_adapter.test.ts
          tests/plan_content_screenshot_phrase_integrity.test.ts
          tests/trainer_entrypoint_reservation.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-code.txt
          sort -o /tmp/expected-code.txt /tmp/expected-code.txt
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-code.txt
          diff -u /tmp/expected-code.txt /tmp/actual-code.txt
          if grep -Ei '(^|/)(premium|revenuecat|paywall|purchase|subscription|auth|account)' /tmp/actual-code.txt; then
            echo 'Protected Premium/auth/account path changed' >&2
            exit 1
          fi

      - name: Lint changed source files
        shell: bash
        run: |
          set -euo pipefail
          npx eslint \
            'app/(tabs)/home.tsx' \
            app/club_screen.tsx \
            app/daily_task_navigation.ts \
            app/daily_tasks.ts \
            app/daily_tasks_es_locale.ts \
            app/daily_tasks_screen.tsx \
            app/home_last_lesson_resolver.ts \
            app/home_screen_hydration.ts \
            app/lesson1.tsx \
            app/personal_plan_exercise.tsx \
            app/personal_plan_progress.ts \
            app/plan_content_runtime_adapter.ts \
            app/review.tsx \
            app/trainer_phrases_session.tsx \
            app/trainer_words_session.tsx

      - name: Capture patched TypeScript diagnostics
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 12m npx tsc --noEmit --pretty false > artifacts/tsc-patched.log 2>&1
          code=$?
          set -e
          echo "$code" > artifacts/tsc-patched.exit
          test "$code" -ne 124
          test "$code" -ne 137

      - name: Reject new TypeScript diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def normalized(path: str) -> set[str]:
              rows = set()
              ansi = re.compile(r'\x1b\[[0-9;]*m')
              for raw in Path(path).read_text(encoding='utf-8', errors='replace').splitlines():
                  line = ansi.sub('', raw.strip())
                  if not line:
                      continue
                  line = re.sub(r'\(\d+,\d+\)', '(#,#)', line)
                  rows.add(line)
              return rows

          base_exit = int(Path('artifacts/tsc-base.exit').read_text().strip())
          patched_exit = int(Path('artifacts/tsc-patched.exit').read_text().strip())
          base = normalized('artifacts/tsc-base.log')
          patched = normalized('artifacts/tsc-patched.log')
          new = sorted(patched - base)
          Path('artifacts/tsc-new-diagnostics.txt').write_text('\n'.join(new), encoding='utf-8')
          print({'base_exit': base_exit, 'patched_exit': patched_exit, 'new': len(new)})
          if base_exit == 0 and patched_exit != 0:
              raise SystemExit('TypeScript became red after patch')
          if new:
              raise SystemExit('Patch introduced new TypeScript diagnostics')
          PY

      - name: Verify assets text and secrets
        shell: bash
        run: |
          set -euo pipefail
          npm run assets:verify:boons
          npm run text-integrity:audit
          npm run scan:secrets

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          npx jest --no-cache --runInBand --runTestsByPath \
            tests/daily_quests_active_catalog_contract.test.ts \
            tests/daily_task_reroll.test.ts \
            tests/daily_tasks_active_executability_contract.test.ts \
            tests/daily_tasks_claim.test.ts \
            tests/daily_tasks_completed_card_stability.test.ts \
            tests/daily_tasks_inflight_progress.test.ts \
            tests/daily_tasks_language_availability.test.ts \
            tests/daily_tasks_recall_availability.test.ts \
            tests/daily_tasks_safe_fallback.test.ts \
            tests/daily_tasks_screen_cache.test.ts \
            tests/daily_tasks_trainer_availability.test.ts \
            tests/home_runtime_truth_contract.test.ts \
            tests/league_focus_refresh_contract.test.ts \
            tests/lesson_completion_daily_task_delivery_contract.test.ts \
            tests/personal_plan_completion_persistence_contract.test.ts \
            tests/plan_content_runtime_adapter.test.ts \
            tests/plan_content_screenshot_phrase_integrity.test.ts \
            tests/trainer_entrypoint_reservation.test.ts \
            --json --outputFile=artifacts/focused-jest.json \
            > artifacts/focused-jest.log 2>&1

      - name: Validate Cloud Functions
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          npm ci
          npm run build
          npm test -- --runInBand

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-fixes-validation-v4
          path: artifacts
          retention-days: 7

      - name: Commit validated product code
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/staged-code.txt
          diff -u /tmp/expected-code.txt /tmp/staged-code.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair screenshot-reported learning flows'
          git push origin HEAD:audit/screenshot-fixes-2026-08-06
