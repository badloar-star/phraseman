<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="google" content="notranslate">
  <title>Бета тестеры</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      --acc: #38bdf8;
      --acc-soft: #7dd3fc;
      --acc-rgb: 56,189,248;
      --panel-bg: rgba(2,8,18,0.94);
      --panel-border: rgba(var(--acc-rgb),0.34);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e8f2f5;
      background:
        radial-gradient(ellipse at center, #041018 0%, #020610 55%, #000 100%) fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(var(--acc-rgb),0.05) 0%, rgba(0,0,0,0) 65%),
        linear-gradient(180deg, rgba(0,0,0,0.48) 0%, rgba(0,0,0,0.78) 100%);
    }
    .shell { position: relative; z-index: 1; min-height: 100vh; }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      box-shadow: 0 0 20px rgba(var(--acc-rgb),0.14);
    }
    h1 {
      font-family: "Courier New", Consolas, monospace;
      font-size: 18px;
      letter-spacing: .06em;
      color: var(--acc-soft);
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(var(--acc-rgb),0.55);
    }
    .back-link {
      font-size: 12px; color: var(--acc-soft); text-decoration: none;
      border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 10px;
      background: rgba(var(--acc-rgb),0.10);
    }
    .back-link:hover { background: rgba(var(--acc-rgb),0.2); }
    .status { margin-left: auto; color: #9ca3af; font-size: 12px; }
    main { padding: 18px 24px 30px; }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }
    input, select {
      min-height: 38px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.45);
      color: #fff;
      padding: 8px 11px;
      outline: none;
    }
    input { width: min(360px, 100%); }
    input:focus, select:focus { border-color: var(--acc); box-shadow: 0 0 8px rgba(var(--acc-rgb),0.38); }
    button {
      min-height: 38px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: rgba(var(--acc-rgb),0.16);
      color: var(--acc-soft);
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: rgba(var(--acc-rgb),0.28); box-shadow: 0 0 12px rgba(var(--acc-rgb),0.42); }
    button:disabled { opacity: .58; cursor: wait; box-shadow: none; }
    .section-title {
      margin: 14px 0 8px;
      color: var(--acc-soft);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .6px;
      text-transform: uppercase;
    }
    .table-card {
      border: 1px solid #16303f;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(3,7,14,0.82);
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--panel-bg); }
    th {
      padding: 10px 14px;
      text-align: left;
      white-space: nowrap;
      color: var(--acc-soft);
      opacity: .86;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--panel-border);
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(var(--acc-rgb),0.08);
      font-size: 13px;
      white-space: nowrap;
      vertical-align: middle;
    }
    tr:hover td { background: rgba(var(--acc-rgb),0.055); }
    .nick-btn {
      border: 0;
      background: transparent;
      color: #fff;
      padding: 0;
      min-height: auto;
      font-weight: 850;
      text-decoration: underline;
      text-decoration-color: rgba(var(--acc-rgb),0.35);
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      border: 1px solid #1c4a63;
      background: #04141f;
      color: var(--acc-soft);
      font-size: 12px;
      font-weight: 800;
    }
    .pill.plus { border-color: #245c2f; background: #071a10; color: #86efac; }
    .pill.off { border-color: #4a2424; background: #1a0707; color: #fca5a5; }
    .muted { color: #8b9298; }
    .login { display: grid; place-items: center; min-height: 70vh; padding: 24px; }
    .login-card {
      max-width: 520px;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      background: var(--panel-bg);
      padding: 24px;
      box-shadow: 0 0 24px rgba(var(--acc-rgb),0.16);
    }
    .login-card p { margin: 10px 0 16px; color: #a7aeb2; line-height: 1.5; }
    .error { color: #fca5a5; margin-top: 10px; font-size: 13px; }
    .hidden { display: none !important; }
    .detail-overlay { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.68); }
    .detail {
      position: fixed; top: 0; right: 0; z-index: 21;
      width: min(620px, 100vw); height: 100vh;
      transform: translateX(105%); transition: transform .18s ease;
      overflow-y: auto;
      border-left: 1px solid var(--panel-border);
      background: #05090f;
      box-shadow: -20px 0 60px rgba(0,0,0,.55);
    }
    .detail.open { transform: translateX(0); }
    .detail-head {
      position: sticky; top: 0; background: #05090f;
      border-bottom: 1px solid var(--panel-border);
      padding: 16px 18px; display: flex; align-items: center; gap: 12px;
    }
    .detail-title { font-size: 18px; font-weight: 850; color: #fff; }
    .close-btn { margin-left: auto; min-width: 38px; padding: 7px 10px; }
    .detail-body { padding: 16px 18px 30px; }
    .dsec {
      border: 1px solid #16303f; border-radius: 10px; padding: 12px;
      margin-bottom: 12px; background: rgba(255,255,255,0.025);
    }
    .dsec h3 { color: var(--acc-soft); font-size: 13px; margin-bottom: 10px; }
    .drow {
      display: flex; justify-content: space-between; gap: 14px;
      padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .drow:last-child { border-bottom: 0; }
    .k { color: #8b9298; font-size: 12px; }
    .v { color: #fff; font-size: 13px; text-align: right; word-break: break-word; }
    .actions { display: flex; flex-direction: column; gap: 9px; }
    .actions button { width: 100%; text-align: left; }
    .btn-primary { border-color: rgba(var(--acc-rgb),0.55); background: rgba(var(--acc-rgb),0.2); color: #bae6fd; }
    .btn-plus { border-color: #2a6b39; background: rgba(34,197,94,.16); color: #86efac; }
    .btn-warn { border-color: #6b4a2a; background: rgba(245,158,11,.14); color: #fcd34d; }
    .btn-danger { border-color: #6b2a2a; background: rgba(239,68,68,.14); color: #fca5a5; }
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
      z-index: 40; padding: 11px 18px; border-radius: 10px; font-weight: 700; font-size: 14px;
      opacity: 0; transition: all .2s ease; pointer-events: none;
      border: 1px solid var(--panel-border); background: rgba(2,8,18,0.96); color: var(--acc-soft);
      box-shadow: 0 8px 30px rgba(0,0,0,.6);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { border-color: #6b2a2a; color: #fca5a5; }
    .toast.ok { border-color: #2a6b39; color: #86efac; }
    @media (max-width: 720px) {
      header, main { padding-left: 14px; padding-right: 14px; }
      .toolbar { align-items: stretch; }
      input, select, button { width: 100%; }
      .detail { width: 100vw; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section id="login" class="login">
      <div class="login-card">
        <h1>Бета тестеры</h1>
        <p>Вход только для админа PhraseMan. Здесь — список бета-тестеров и управление: аура «Нимб», Plus навсегда, энергия.</p>
        <button id="signin">Войти с Google</button>
        <div id="login-error" class="error"></div>
      </div>
    </section>

    <section id="app" class="hidden">
      <header>
        <a class="back-link" href="index.html">← Админ</a>
        <h1>🔵 Бета тестеры</h1>
        <div id="status" class="status">загрузка</div>
      </header>
      <main>
        <div class="toolbar">
          <input id="assign-uid" type="search" placeholder="UID или ник — назначить бета-тестером">
          <button id="assign-btn" type="button" class="btn-primary">Найти и открыть</button>
          <button id="refresh" type="button">Обновить список</button>
        </div>

        <div class="section-title">Бета-тестеры (<span id="count">0</span>)</div>
        <div class="table-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Ник</th>
                  <th>UID</th>
                  <th>Аура</th>
                  <th>Plus</th>
                  <th>С</th>
                </tr>
              </thead>
              <tbody id="rows">
                <tr><td colspan="5" class="muted" style="text-align:center;padding:38px">Загрузка...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </section>
  </div>

  <div id="detail-overlay" class="detail-overlay"></div>
  <aside id="detail" class="detail" aria-live="polite">
    <div class="detail-head">
      <div class="detail-title" id="detail-title">Пользователь</div>
      <button id="detail-close" class="close-btn" type="button">x</button>
    </div>
    <div id="detail-body" class="detail-body"></div>
  </aside>
  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, GoogleAuthProvider, getRedirectResult, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, doc, getDoc, getDocs, limit, query, serverTimestamp, setDoc, updateDoc, where } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const app = initializeApp({
      apiKey: 'AIzaSyBxO_8xe9-HV-wFSMO4abkCHvZX8zb-T7s',
      authDomain: 'phraseman-ea0b3.firebaseapp.com',
      projectId: 'phraseman-ea0b3',
      storageBucket: 'phraseman-ea0b3.firebasestorage.app',
    });
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const NIMBUS_AURA_ID = 'aura-nimbus';
    const $ = (id) => document.getElementById(id);
    let betaRows = [];
    let currentUid = null;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }
    function toast(msg, kind) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast show' + (kind ? ' ' + kind : '');
      setTimeout(() => { el.className = 'toast'; }, 2600);
    }
    function readProgress(data) {
      return data && typeof data.progress === 'object' ? data.progress : {};
    }
    function nameOf(data, uid) {
      const p = readProgress(data);
      return p.user_name || data.user_name || data.displayName || uid;
    }
    function parseOwned(progress) {
      try {
        const raw = progress.avatar_aura_owned_v1;
        if (!raw) return {};
        return typeof raw === 'string' ? JSON.parse(raw) : raw;
      } catch { return {}; }
    }
    function isPlusForever(progress) {
      const plan = String(progress.vip_plan || '').toLowerCase();
      const active = String(progress.vip_active || '') === 'true';
      const until = String(progress.vip_until || '0');
      return active && (until === '0' || /admin_vip|lifetime|forever/.test(plan));
    }

    // Канонизация UID: после миграции/слияния аккаунта найденный документ может быть
    // осиротевшим (identityHidden=true + canonicalStableId → живой). Писать надо в живой,
    // иначе выдача (Plus/аура/энергия) уходит в мёртвый документ и на устройстве не видна.
    // Тот же механизм, что resolveAdminVipWriteTarget в index.html.
    async function resolveWriteUid(uid) {
      const requested = String(uid || '').trim();
      if (!requested) return requested;
      try {
        const snap = await getDoc(doc(db, 'users', requested));
        if (!snap.exists()) return requested;
        const data = snap.data() || {};
        const hidden = data.identityHidden === true;
        const canonical = String(data.canonicalStableId || '').trim();
        if (!hidden || !canonical || canonical === requested) return requested;
        const canonSnap = await getDoc(doc(db, 'users', canonical));
        return canonSnap.exists() ? canonical : requested;
      } catch {
        return requested;
      }
    }

    // ── Список бета-тестеров ────────────────────────────────────────────────
    async function loadBetaList() {
      $('status').textContent = 'загрузка списка…';
      try {
        const q = query(collection(db, 'users'), where('progress.beta_tester', '==', 'true'), limit(300));
        const snap = await getDocs(q);
        betaRows = snap.docs.map((d) => {
          const data = d.data() || {};
          const p = readProgress(data);
          return {
            uid: d.id,
            name: nameOf(data, d.id),
            aura: p.user_avatar_aura || '',
            ownsNimbus: !!parseOwned(p)[NIMBUS_AURA_ID],
            plus: isPlusForever(p),
            since: p.beta_tester_since || '',
          };
        });
        renderRows();
      } catch (e) {
        $('status').textContent = 'ошибка';
        toast('Ошибка загрузки: ' + e.message, 'err');
      }
    }

    function fmtSince(ms) {
      const n = Number(ms) || 0;
      if (!n) return '—';
      try { return new Date(n).toISOString().slice(0, 10); } catch { return '—'; }
    }

    function renderRows() {
      $('count').textContent = String(betaRows.length);
      $('status').textContent = betaRows.length + ' бета-тестеров';
      if (!betaRows.length) {
        $('rows').innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;padding:38px">Пока никого. Впиши UID или ник выше и назначь.</td></tr>';
        return;
      }
      $('rows').innerHTML = betaRows.map((r) => `
        <tr>
          <td><button type="button" class="nick-btn" data-uid="${escapeHtml(r.uid)}">${escapeHtml(r.name)}</button></td>
          <td class="muted" style="font-size:11px">${escapeHtml(r.uid)}</td>
          <td>${r.aura === NIMBUS_AURA_ID ? '<span class="pill">🔵 Нимб</span>' : (r.ownsNimbus ? '<span class="pill">есть Нимб</span>' : '<span class="muted">—</span>')}</td>
          <td>${r.plus ? '<span class="pill plus">Plus ∞</span>' : '<span class="muted">—</span>'}</td>
          <td class="muted" style="font-size:11px">${fmtSince(r.since)}</td>
        </tr>
      `).join('');
      document.querySelectorAll('.nick-btn').forEach((btn) => {
        btn.addEventListener('click', () => openCard(btn.dataset.uid));
      });
    }

    // ── Поиск юзера для назначения ──────────────────────────────────────────
    async function findAndOpen() {
      const term = $('assign-uid').value.trim();
      if (!term) { toast('Впиши UID или ник', 'err'); return; }
      $('assign-btn').disabled = true;
      try {
        // 1) пробуем как UID напрямую
        const direct = await getDoc(doc(db, 'users', term));
        if (direct.exists()) { openCard(term); return; }
        // 2) ищем по нику
        const q = query(collection(db, 'users'), where('progress.user_name', '==', term), limit(10));
        const snap = await getDocs(q);
        if (snap.empty) { toast('Не найдено по UID и нику: ' + term, 'err'); return; }
        if (snap.docs.length === 1) { openCard(snap.docs[0].id); return; }
        // несколько кандидатов — покажем в списке (перезапишем таблицу выбором)
        toast(snap.docs.length + ' совпадений — выбери из списка', 'ok');
        betaRows = snap.docs.map((d) => {
          const data = d.data() || {}; const p = readProgress(data);
          return { uid: d.id, name: nameOf(data, d.id), aura: p.user_avatar_aura || '', ownsNimbus: !!parseOwned(p)[NIMBUS_AURA_ID], plus: isPlusForever(p), since: p.beta_tester_since || '' };
        });
        renderRows();
      } catch (e) {
        toast('Ошибка: ' + e.message, 'err');
      } finally {
        $('assign-btn').disabled = false;
      }
    }

    // ── Карточка юзера ──────────────────────────────────────────────────────
    async function openCard(uid) {
      currentUid = uid;
      const snap = await getDoc(doc(db, 'users', uid));
      if (!snap.exists()) { toast('Юзер не найден', 'err'); return; }
      const data = snap.data() || {};
      const p = readProgress(data);
      const isBeta = String(p.beta_tester || '') === 'true';
      const ownsNimbus = !!parseOwned(p)[NIMBUS_AURA_ID];
      const activeNimbus = p.user_avatar_aura === NIMBUS_AURA_ID;
      const plus = isPlusForever(p);

      $('detail-title').textContent = nameOf(data, uid);
      $('detail-body').innerHTML = `
        <div class="dsec">
          <h3>Профиль</h3>
          <div class="drow"><span class="k">UID</span><span class="v" style="font-size:11px">${escapeHtml(uid)}</span></div>
          <div class="drow"><span class="k">Ник</span><span class="v">${escapeHtml(nameOf(data, uid))}</span></div>
          <div class="drow"><span class="k">Бета-статус</span><span class="v">${isBeta ? '<span class="pill">✓ бета</span>' : '<span class="pill off">нет</span>'}</span></div>
          <div class="drow"><span class="k">Аура «Нимб»</span><span class="v">${activeNimbus ? '<span class="pill">🔵 активна</span>' : ownsNimbus ? '<span class="pill">в наличии</span>' : '<span class="muted">нет</span>'}</span></div>
          <div class="drow"><span class="k">Plus навсегда</span><span class="v">${plus ? '<span class="pill plus">Plus ∞</span>' : '<span class="muted">нет</span>'}</span></div>
        </div>
        <div class="dsec">
          <h3>Управление</h3>
          <div class="actions">
            ${isBeta
              ? '<button type="button" class="btn-danger" data-act="unset-beta">✕ Снять бета-статус (аура остаётся)</button>'
              : '<button type="button" class="btn-primary" data-act="set-beta">🔵 Назначить бета-тестером + выдать «Нимб»</button>'}
            <button type="button" class="btn-plus" data-act="grant-plus">💚 Выдать Plus навсегда</button>
            <button type="button" class="btn-warn" data-act="energy-fill">⚡ Налить энергию до максимума</button>
            <button type="button" class="btn-danger" data-act="energy-drain">🪫 Обнулить энергию</button>
          </div>
          <div class="muted" style="font-size:11.5px;margin-top:10px;line-height:1.4">
            ⏱ Запись уходит в облако сразу, но на устройстве юзера появляется НЕ мгновенно:
            при следующем запуске приложения или входе в платную функцию (обычно ≤ 5 мин активности).
            В этой карточке актуальное состояние — из облака (жми действие → карточка перечитывается).
          </div>
        </div>`;

      $('detail-body').querySelectorAll('button[data-act]').forEach((btn) => {
        btn.addEventListener('click', () => runAction(btn.dataset.act, uid));
      });
      openPanel();
    }

    // ── Действия ────────────────────────────────────────────────────────────
    async function runAction(act, uid) {
      const btns = $('detail-body').querySelectorAll('button[data-act]');
      btns.forEach((b) => b.disabled = true);
      try {
        // Пишем в КАНОНИЧЕСКИЙ (живой) документ аккаунта, а не в осиротевший после миграции.
        const writeUid = await resolveWriteUid(uid);
        if (writeUid !== uid) toast('Запись в актуальный аккаунт: ' + writeUid, 'ok');
        if (act === 'set-beta') await setBeta(writeUid, true);
        else if (act === 'unset-beta') await setBeta(writeUid, false);
        else if (act === 'grant-plus') await grantPlusForever(writeUid);
        else if (act === 'energy-fill') await sendEnergyCommand(writeUid, 'fill');
        else if (act === 'energy-drain') await sendEnergyCommand(writeUid, 'drain');
        await openCard(writeUid); // перерисуем карточку по фактически записанному документу
        await loadBetaList();
      } catch (e) {
        toast('Ошибка: ' + e.message, 'err');
      } finally {
        $('detail-body').querySelectorAll('button[data-act]').forEach((b) => b.disabled = false);
      }
    }

    // Назначить/снять бета-статус. При назначении: выдаём «Нимб» в owned + делаем активной.
    // При снятии: убираем ТОЛЬКО флаг статуса — аура остаётся на аккаунте (навсегда).
    async function setBeta(uid, on) {
      const snap = await getDoc(doc(db, 'users', uid));
      const p = readProgress(snap.data() || {});
      if (on) {
        const owned = parseOwned(p);
        owned[NIMBUS_AURA_ID] = true;
        await updateDoc(doc(db, 'users', uid), {
          'progress.beta_tester': 'true',
          'progress.beta_tester_since': String(Date.now()),
          'progress.avatar_aura_owned_v1': JSON.stringify(owned),
          'progress.avatar_aura_gift_owned_v1': NIMBUS_AURA_ID,
          'progress.user_avatar_aura': NIMBUS_AURA_ID,
          beta_admin_updated_at: new Date().toISOString(),
        });
        await logAdmin('beta_set', uid, {});
        toast('🔵 Бета-статус выдан + «Нимб» активирован', 'ok');
      } else {
        await updateDoc(doc(db, 'users', uid), {
          'progress.beta_tester': 'false',
          beta_admin_updated_at: new Date().toISOString(),
        });
        await logAdmin('beta_unset', uid, {});
        toast('Бета-статус снят (аура осталась)', 'ok');
      }
    }

    async function grantPlusForever(uid) {
      const grantAt = String(Date.now());
      await updateDoc(doc(db, 'users', uid), {
        'progress.vip_active': 'true',
        'progress.vip_plan': 'admin_vip',
        'progress.vip_from': grantAt,
        'progress.vip_until': '0',
        'progress.vip_admin_override': 'true',
        'progress.vip_admin_grant_at': grantAt,
      });
      await logAdmin('grant_plus_forever', uid, {});
      toast('💚 Plus навсегда выдан', 'ok');
    }

    // Энергия — одноразовая команда. Клиент применит её при getEnergyState (см. energy_system.ts).
    async function sendEnergyCommand(uid, op) {
      await updateDoc(doc(db, 'users', uid), {
        'progress.admin_energy_command': JSON.stringify({ op, at: Date.now() }),
      });
      await logAdmin('energy_' + op, uid, {});
      toast(op === 'fill' ? '⚡ Команда: налить энергию' : '🪫 Команда: обнулить энергию', 'ok');
    }

    async function logAdmin(action, uid, details) {
      try {
        const ref = doc(collection(db, 'admin_log'));
        await setDoc(ref, {
          ts: new Date().toISOString(),
          tsServer: serverTimestamp(),
          adminEmail: auth.currentUser?.email || '',
          action,
          uid,
          details: details || {},
          source: 'beta_testers',
        });
      } catch { /* лог не критичен — действие уже применено */ }
    }

    // ── Панель ──────────────────────────────────────────────────────────────
    function openPanel() { $('detail').classList.add('open'); $('detail-overlay').style.display = 'block'; }
    function closePanel() { $('detail').classList.remove('open'); $('detail-overlay').style.display = 'none'; currentUid = null; }

    // ── Auth ────────────────────────────────────────────────────────────────
    function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); loadBetaList(); }
    function showLogin() { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }

    $('signin').addEventListener('click', async () => {
      try { await signInWithPopup(auth, provider); }
      catch (e) {
        try { await signInWithRedirect(auth, provider); }
        catch (e2) { $('login-error').textContent = e2.message; }
      }
    });
    $('refresh').addEventListener('click', loadBetaList);
    $('assign-btn').addEventListener('click', findAndOpen);
    $('assign-uid').addEventListener('keydown', (e) => { if (e.key === 'Enter') findAndOpen(); });
    $('detail-close').addEventListener('click', closePanel);
    $('detail-overlay').addEventListener('click', closePanel);

    getRedirectResult(auth).catch(() => {});
    onAuthStateChanged(auth, (user) => {
      if (user) showApp(); else showLogin();
    });
  </script>
</body>
</html>
