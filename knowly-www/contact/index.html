      </div>

<script>
window.I18N = {
  ru: {},
  en: {
    'nav.level': 'Level test', 'nav.guides': 'Guides',
    'nav.gift': 'Give a gift', 'nav.russia': 'Paying from Russia', 'nav.download': 'Download',
    'c.title': 'Contact us',
    'c.sub': 'A question, a problem, or an idea. Or write directly: <a href="mailto:support.phraseman@gmail.com" style="color:var(--accent-text);font-weight:600">support.phraseman@gmail.com</a>',
    'c.name': 'Name (optional)', 'c.email': 'Email for our reply *', 'c.topic': 'Topic',
    'c.topic.support': 'Support', 'c.topic.feedback': 'Feedback', 'c.topic.legal': 'Legal question', 'c.topic.other': 'Other',
    'c.msg': 'Message *', 'c.msg.ph': 'Describe your question or idea (at least 10 characters)',
    'c.send': 'Send',
    'footer.about': 'About the app', 'footer.privacy': 'Privacy', 'footer.terms': 'Terms', 'footer.deletion': 'Data deletion'
  }
};
</script>
<script>
  /* Отправка письма в поддержку. Логика без изменений при редизайне 2026-08-16:
     та же Cloud Function submitWebsiteContact, та же ловушка для ботов. */
  document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('km-contact-form');
    var toast = document.getElementById('km-toast');
    if (!form) return;

    function isEn() { return document.documentElement.lang === 'en'; }
    function say(kind, ru, en) {
      if (!toast) return;
      toast.className = 'toast' + (kind ? ' ' + kind : '');
      toast.textContent = isEn() ? en : ru;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      say('', '', '');

      var trap = document.getElementById('km-trap');
      if (trap && trap.value) {
        /* бот заполнил невидимое поле — тихо «принимаем» и ничего не шлём */
        say('ok', 'Спасибо! Сообщение принято.', 'Thank you! Your message was received.');
        return;
      }

      var cfg = window.KNOWLY_SITE || {};
      var ep = cfg.contactEndpoint;
      if (!ep) {
        say('err',
          'Не настроен адрес отправки. Напишите на support.phraseman@gmail.com',
          'Sending is not configured. Please write to support.phraseman@gmail.com');
        return;
      }

      var email = (document.getElementById('km-email') || {}).value || '';
      var message = (document.getElementById('km-msg') || {}).value || '';
      var name = (document.getElementById('km-name') || {}).value || '';
      var topic = (document.getElementById('km-topic') || {}).value || 'support';
      var btn = form.querySelector('button[type="submit"]');
      var btnLabel = btn && btn.firstElementChild;
      var idle = btnLabel ? btnLabel.textContent : '';

      if (btn) {
        btn.disabled = true;
        if (btnLabel) btnLabel.textContent = isEn() ? 'Sending…' : 'Отправка…';
      }
      try {
        var res = await fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email.trim(),
            message: message.trim(),
            name: name.trim(),
            topic: topic,
            pageUrl: typeof location !== 'undefined' ? location.href : '',
          }),
        });
        var json = {};
        try { json = await res.json(); } catch (_) { /* тело может быть пустым */ }
        if (!res.ok) throw new Error(json.error || 'Ошибка сервера (' + res.status + ')');
        say('ok',
          'Спасибо! Сообщение принято — мы его прочитаем и ответим.',
          'Thank you! Your message was received — we will read it and reply.');
        form.reset();
      } catch (err) {
        say('err',
          (err && err.message) || 'Не удалось отправить. Попробуйте позже или напишите на почту.',
          (err && err.message) || 'Could not send. Try again later or write to our email.');
      } finally {
        if (btn) {
          btn.disabled = false;
          if (btnLabel) btnLabel.textContent = idle;
        }
      }
    });
  });
</script>
