# Pixel Fold: Arena tab -> lobby contract.
# Pixel Fold centers content; use tab ids instead of home shortcuts because the
# current Home screen no longer exposes a dedicated Arena tile.
appId: app.phraseman
---
- runFlow: ../_shared/open_dev_client.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- runFlow: ../_precondition.yaml
- tapOn:
    id: "tab-arena"
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "screen-arena-lobby"
    timeout: 35000
- assertVisible:
    id: "arena-find-match"
- assertVisible:
    id: "arena-play-with-friend"
- assertVisible:
    id: "arena-rating-button"
