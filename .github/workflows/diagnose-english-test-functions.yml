name: Diagnose English test Functions

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  diagnose-functions:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/english-level-test-full-audit' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply audited release payload
        shell: bash
        run: |
          set -euo pipefail
          cat .release/english-test/part-* > /tmp/english-test-release.b64
          base64 --decode /tmp/english-test-release.b64 > /tmp/english-test-release.tar.xz
          echo "d7682645609959b249516fb22c656639b6451af6264e736111e64c296fc106f1  /tmp/english-test-release.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/english-test-release.tar.xz -C .
          node scripts/apply_english_test_release.mjs
      - name: Capture Functions install, build and tests
        id: functions
        continue-on-error: true
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/english-test-functions.log) 2>&1
          set -x
          npm ci --prefix functions
          install_status=$?
          echo "install_status=$install_status"
          if [ "$install_status" -eq 0 ]; then npm --prefix functions run build; fi
          build_status=$?
          echo "build_status=$build_status"
          if [ "$install_status" -eq 0 ] && [ "$build_status" -eq 0 ]; then
            npm --prefix functions test -- --runTestsByPath src/english_test_analytics.test.ts src/english_test_scoring.test.ts --runInBand
          fi
          test_status=$?
          echo "test_status=$test_status"
          if [ "$install_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then exit 1; fi
      - name: Upload Functions diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-test-functions-diagnostic-${{ github.run_attempt }}
          path: /tmp/english-test-functions.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail if Functions diagnostic failed
        if: steps.functions.outcome != 'success'
        shell: bash
        run: exit 1
