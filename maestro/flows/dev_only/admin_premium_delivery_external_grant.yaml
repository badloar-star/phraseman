appId: app.phraseman
---
# Preconditions:
# 1. Open phraseman:///admin_premium_delivery_test on the device.
# 2. Grant VIP to the displayed stable_id from the Admin Panel VIP tab.
# This flow verifies delivery only; it does not try to self-grant VIP from the app client.
- extendedWaitUntil:
    visible: "Admin VIP Firestore E2E"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "admin-premium-e2e-ready"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "admin-premium-e2e-pass"
    timeout: 120000
