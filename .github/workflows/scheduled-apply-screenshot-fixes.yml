name: Scheduled apply screenshot runtime fixes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-apply-screenshot-fixes-2026-08-06
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AUDIT_BRANCH: audit/screenshot-fixes-2026-08-06
      BASE_BRANCH: feature/referral-roulette
      BASE_SHA: 9629139925eaab85368fb7f26d9824003bd4ff7a
      PATCH_SHA256: ed4afb636150f42c3fcd4c55aad8361a7e77b259c616325ba6e932ed260d37e0
      JEST_SHARDS: 12
      NODE_OPTIONS: --max-old-space-size=5500
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/screenshot-fixes-2026-08-06
          fetch-depth: 1

      - name: Detect already-applied branch and preserve patch
        shell: bash
        run: |
          set -euo pipefail
          original_head="$(git rev-parse HEAD)"
          echo "ORIGINAL_HEAD=$original_head" >> "$GITHUB_ENV"
          if [[ ! -f .audit/screenshot-fixes.patch.b64.00 ]]; then
            echo 'ALREADY_APPLIED=1' >> "$GITHUB_ENV"
            echo 'Product patch is already applied; nothing to do.'
            exit 0
          fi
          cat .audit/screenshot-fixes.patch.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/screenshot-fixes.patch
          echo "$PATCH_SHA256  /tmp/screenshot-fixes.patch" | sha256sum --check

      - name: Fetch and pin the canonical base
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_BRANCH"
          actual_base="$(git rev-parse FETCH_HEAD)"
          test "$actual_base" = "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          git clean -ffd

      - name: Set up Node.js
        if: env.ALREADY_APPLIED != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        if: env.ALREADY_APPLIED != '1'
        run: npm ci

      - name: Prepare validation helpers and exact scope
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/base artifacts/patched
          cat > /tmp/expected-code.txt <<'EOF'
          app/(tabs)/home.tsx
          app/club_screen.tsx
          app/daily_task_navigation.ts
          app/daily_tasks.ts
          app/daily_tasks_es_locale.ts
          app/daily_tasks_screen.tsx
          app/home_last_lesson_resolver.ts
          app/home_screen_hydration.ts
          app/lesson1.tsx
          app/personal_plan_exercise.tsx
          app/personal_plan_progress.ts
          app/plan_content_runtime_adapter.ts
          app/review.tsx
          app/trainer_phrases_session.tsx
          app/trainer_words_session.tsx
          tests/daily_quests_active_catalog_contract.test.ts
          tests/daily_task_reroll.test.ts
          tests/daily_tasks_active_executability_contract.test.ts
          tests/daily_tasks_claim.test.ts
          tests/daily_tasks_completed_card_stability.test.ts
          tests/daily_tasks_inflight_progress.test.ts
          tests/daily_tasks_language_availability.test.ts
          tests/daily_tasks_recall_availability.test.ts
          tests/daily_tasks_safe_fallback.test.ts
          tests/daily_tasks_screen_cache.test.ts
          tests/daily_tasks_trainer_availability.test.ts
          tests/home_runtime_truth_contract.test.ts
          tests/league_focus_refresh_contract.test.ts
          tests/lesson_completion_daily_task_delivery_contract.test.ts
          tests/personal_plan_completion_persistence_contract.test.ts
          tests/plan_content_runtime_adapter.test.ts
          tests/plan_content_screenshot_phrase_integrity.test.ts
          tests/trainer_entrypoint_reservation.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected-code.txt
          sort -o /tmp/expected-code.txt /tmp/expected-code.txt

          cat > /tmp/run-jest-shards.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          count="$2"
          mkdir -p "artifacts/$label"
          for shard in $(seq 1 "$count"); do
            echo "[$label] Jest shard $shard/$count"
            set +e
            npx jest --testPathPattern=tests/ --no-cache --runInBand \
              --shard="$shard/$count" --json \
              --outputFile="artifacts/$label/root-jest-$shard.json" \
              > "artifacts/$label/root-jest-$shard.log" 2>&1
            code=$?
            set -e
            echo "$code" > "artifacts/$label/root-jest-$shard.exit"
            test -s "artifacts/$label/root-jest-$shard.json"
          done
          SH
          chmod +x /tmp/run-jest-shards.sh

      - name: Capture baseline TypeScript diagnostics
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx tsc --noEmit --pretty false > artifacts/base/typecheck.log 2>&1
          code=$?
          set -e
          echo "$code" > artifacts/base/typecheck.exit

      - name: Run baseline root Jest in bounded shards
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run assets:verify:boons
          /tmp/run-jest-shards.sh base "$JEST_SHARDS"

      - name: Apply the audited product patch
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/screenshot-fixes.patch
          git apply /tmp/screenshot-fixes.patch
          git diff --check

      - name: Enforce exact product scope
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-code.txt
          diff -u /tmp/expected-code.txt /tmp/actual-code.txt
          if grep -Ei '(^|/)(premium|revenuecat|paywall|purchase|subscription|auth|account)' /tmp/actual-code.txt; then
            echo 'Protected Premium/auth/account path changed' >&2
            exit 1
          fi

      - name: Lint changed source files
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          npx eslint \
            'app/(tabs)/home.tsx' \
            app/club_screen.tsx \
            app/daily_task_navigation.ts \
            app/daily_tasks.ts \
            app/daily_tasks_es_locale.ts \
            app/daily_tasks_screen.tsx \
            app/home_last_lesson_resolver.ts \
            app/home_screen_hydration.ts \
            app/lesson1.tsx \
            app/personal_plan_exercise.tsx \
            app/personal_plan_progress.ts \
            app/plan_content_runtime_adapter.ts \
            app/review.tsx \
            app/trainer_phrases_session.tsx \
            app/trainer_words_session.tsx

      - name: Verify repository gates
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run text-integrity:audit
          npm run scan:secrets

      - name: Run focused screenshot regression tests
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          npx jest --no-cache --runInBand --runTestsByPath \
            tests/daily_quests_active_catalog_contract.test.ts \
            tests/daily_task_reroll.test.ts \
            tests/daily_tasks_active_executability_contract.test.ts \
            tests/daily_tasks_claim.test.ts \
            tests/daily_tasks_completed_card_stability.test.ts \
            tests/daily_tasks_inflight_progress.test.ts \
            tests/daily_tasks_language_availability.test.ts \
            tests/daily_tasks_recall_availability.test.ts \
            tests/daily_tasks_safe_fallback.test.ts \
            tests/daily_tasks_screen_cache.test.ts \
            tests/daily_tasks_trainer_availability.test.ts \
            tests/home_runtime_truth_contract.test.ts \
            tests/league_focus_refresh_contract.test.ts \
            tests/lesson_completion_daily_task_delivery_contract.test.ts \
            tests/personal_plan_completion_persistence_contract.test.ts \
            tests/plan_content_runtime_adapter.test.ts \
            tests/plan_content_screenshot_phrase_integrity.test.ts \
            tests/trainer_entrypoint_reservation.test.ts \
            --json --outputFile=artifacts/focused-jest.json \
            > artifacts/focused-jest.log 2>&1

      - name: Capture patched TypeScript diagnostics
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx tsc --noEmit --pretty false > artifacts/patched/typecheck.log 2>&1
          code=$?
          set -e
          echo "$code" > artifacts/patched/typecheck.exit

      - name: Reject new TypeScript diagnostics
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def normalized(path: str) -> set[str]:
              ansi = re.compile(r'\x1b\[[0-9;]*m')
              result = set()
              for raw in Path(path).read_text(encoding='utf-8', errors='replace').splitlines():
                  line = ansi.sub('', raw.strip())
                  if not line:
                      continue
                  line = re.sub(r'\(\d+,\d+\)', '(#,#)', line)
                  result.add(line)
              return result

          base_exit = int(Path('artifacts/base/typecheck.exit').read_text().strip())
          patched_exit = int(Path('artifacts/patched/typecheck.exit').read_text().strip())
          base = normalized('artifacts/base/typecheck.log')
          patched = normalized('artifacts/patched/typecheck.log')
          new = sorted(patched - base)
          Path('artifacts/new-typecheck-diagnostics.txt').write_text('\n'.join(new), encoding='utf-8')
          print({'base_exit': base_exit, 'patched_exit': patched_exit, 'new_diagnostics': len(new)})
          if base_exit == 0 and patched_exit != 0:
              raise SystemExit('TypeScript became red after patch')
          if new:
              raise SystemExit('Patch introduced new TypeScript diagnostics')
          PY

      - name: Run patched root Jest in bounded shards
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: /tmp/run-jest-shards.sh patched "$JEST_SHARDS"

      - name: Reject new root Jest failures
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def collect(label: str):
              suites = set()
              tests = set()
              for path in sorted(Path(f'artifacts/{label}').glob('root-jest-*.json')):
                  data = json.loads(path.read_text(encoding='utf-8'))
                  for suite in data.get('testResults', []):
                      if suite.get('status') == 'failed':
                          suites.add(suite.get('name', ''))
                      for assertion in suite.get('assertionResults', []):
                          if assertion.get('status') == 'failed':
                              tests.add(f"{suite.get('name', '')}::{assertion.get('fullName', assertion.get('title', ''))}")
              return suites, tests

          base_suites, base_tests = collect('base')
          patched_suites, patched_tests = collect('patched')
          report = {
              'base_failed_suites': len(base_suites),
              'patched_failed_suites': len(patched_suites),
              'new_failed_suites': sorted(patched_suites - base_suites),
              'base_failed_tests': len(base_tests),
              'patched_failed_tests': len(patched_tests),
              'new_failed_tests': sorted(patched_tests - base_tests),
          }
          Path('artifacts/jest-baseline-comparison.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report['new_failed_suites'] or report['new_failed_tests']:
              raise SystemExit('Patch introduced new root Jest failures')
          PY

      - name: Validate Cloud Functions
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          npm ci
          npm run build
          npm test -- --runInBand

      - name: Upload validation evidence
        if: always() && env.ALREADY_APPLIED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-fixes-scheduled-validation
          path: artifacts
          retention-days: 7

      - name: Commit and replace temporary audit history
        if: env.ALREADY_APPLIED != '1'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/staged-code.txt
          diff -u /tmp/expected-code.txt /tmp/staged-code.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair screenshot-reported learning flows'
          git push \
            --force-with-lease="refs/heads/$AUDIT_BRANCH:$ORIGINAL_HEAD" \
            origin "HEAD:refs/heads/$AUDIT_BRANCH"
