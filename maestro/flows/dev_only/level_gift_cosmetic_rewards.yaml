appId: app.phraseman
---
- runFlow: ../_dismiss_bug_hunt.yaml
- runFlow: ../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    point: "10%,95%"
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 120000

- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-open-testers"
    direction: DOWN
    timeout: 30000
    speed: 80
    visibilityPercentage: 40
- tapOn:
    id: "settings-open-testers"

- extendedWaitUntil:
    visible:
      id: "testers-section-levelup"
    timeout: 30000
- tapOn:
    id: "testers-section-levelup"

# Level 15: gifted custom avatar with exact preview metadata.
- scrollUntilVisible:
    element:
      id: "admin-level-gift-15"
    direction: DOWN
    timeout: 30000
    speed: 70
    visibilityPercentage: 40
- tapOn:
    id: "admin-level-gift-15"
- extendedWaitUntil:
    visible:
      id: "level-gift-modal"
    timeout: 20000
- tapOn:
    id: "level-gift-box-open"
- extendedWaitUntil:
    visible:
      id: "level-gift-cosmetic-preview"
    timeout: 20000
- tapOn:
    id: "level-gift-open-avatar"
- extendedWaitUntil:
    visible:
      id: "screen-avatar-select"
    timeout: 20000
- assertVisible: "Подарок"
- pressKey: Back

# Level 35: gifted avatar aura with preview and avatar customization jump.
- extendedWaitUntil:
    visible:
      id: "testers-section-levelup"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "admin-level-gift-35"
    direction: DOWN
    timeout: 30000
    speed: 70
    visibilityPercentage: 40
- tapOn:
    id: "admin-level-gift-35"
- extendedWaitUntil:
    visible:
      id: "level-gift-modal"
    timeout: 20000
- tapOn:
    id: "level-gift-box-open"
- extendedWaitUntil:
    visible:
      id: "level-gift-cosmetic-preview"
    timeout: 20000
- tapOn:
    id: "level-gift-open-avatar"
- extendedWaitUntil:
    visible:
      id: "screen-avatar-select"
    timeout: 20000
- assertVisible: "Подарок"
