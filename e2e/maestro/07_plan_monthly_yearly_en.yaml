# зачем: dev-подписка monthly/yearly составной ссылкой set=plus:on,plan:<…> — ромб Plus-вкладки исчезает, на yearly значок Ultra.
appId: app.phraseman
name: 07 dev-подписка monthly → yearly (en)
---
- runFlow: _prelude_home_en.yaml
- takeScreenshot: 01_home_free
- openLink: "phraseman://dev_state?set=plus:on,plan:monthly"
- extendedWaitUntil:
    visible: "DEV-STATE OK"
    timeout: 60000
- takeScreenshot: 02_devstate_monthly_result
- openLink: "phraseman://dev_moments_preview?state=promo"
- waitForAnimationToEnd
- openLink: "phraseman://(tabs)/home"
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: 03_home_monthly
- openLink: "phraseman://dev_state?set=plus:on,plan:yearly"
- extendedWaitUntil:
    visible: "DEV-STATE OK"
    timeout: 60000
- openLink: "phraseman://dev_moments_preview?state=promo"
- waitForAnimationToEnd
- openLink: "phraseman://(tabs)/home"
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: 04_home_yearly_ultra
