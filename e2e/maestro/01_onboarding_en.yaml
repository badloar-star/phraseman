# зачем (план 150, путь 1): новичок проходит онбординг по-английски до Главной; запускать ТОЛЬКО на Pixel_8_fresh (clearState).
# Тексты шагов берём из доступности (accessibilityText): заголовки части шагов наружу не отдаются.
# retry нужен, потому что dev-клиент после смены файлов в рабочем дереве перезагружает бандл (экран «Loading from 10.0.2.2:8081…»).
appId: app.phraseman
name: 01 Онбординг en → пейвол → Главная
---
- launchApp:
    clearState: true
    stopApp: true
- openLink: "exp+phraseman://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 300000
- retry:
    maxRetries: 4
    commands:
      - tapOn:
          text: "Get started"
          optional: true
      - extendedWaitUntil:
          visible: "Your data stays yours"
          timeout: 25000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Later"
          optional: true
      - extendedWaitUntil:
          visible: "Back. Step 1 of 9"
          timeout: 25000
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Back. Step 3 of 9"
    timeout: 20000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "TikTok"
    timeout: 20000
- tapOn: "TikTok"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Choose language"
    timeout: 20000
- tapOn: "Choose language"
- extendedWaitUntil:
    visible: "Turn on reminders"
    timeout: 20000
- tapOn: "Not now"
- extendedWaitUntil:
    visible: "Share usage stats"
    timeout: 20000
- tapOn: "Yes"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Nothing is charged today"
    timeout: 20000
- tapOn: "Continue"
# оплата онбординга: плитки Year/Month, кнопка пробного
- extendedWaitUntil:
    visible: "Try 3 days free"
    timeout: 40000
- assertVisible: "Year"
- assertVisible: "Month"
- tapOn:
    point: "11%,11%"
- extendedWaitUntil:
    visible: "Start lesson 1"
    timeout: 150000
- assertVisible: "Lessons"
- assertVisible: "Flashcards"
