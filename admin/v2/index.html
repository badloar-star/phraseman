<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Админка Phraseman</title>
  <link rel="stylesheet" href="/v2/styles/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#overview" aria-label="Phraseman Admin, обзор">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span><strong>Phraseman</strong><small>операционная панель</small></span>
      </a>
      <nav id="primary-nav" class="primary-nav"></nav>
      <div class="sidebar-footer">
        <span class="environment-dot" aria-hidden="true"></span>
        <span><strong>Рабочее окружение</strong><small>изменения влияют на пользователей</small></span>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button id="mobile-nav-toggle" class="icon-button mobile-only" type="button" aria-label="Открыть меню" title="Открыть меню">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div id="breadcrumbs" class="breadcrumbs" aria-label="Путь раздела"></div>
        <div class="topbar-actions">
          <a class="legacy-admin-link" href="/legacy.html" target="_blank" rel="noopener" aria-label="Открыть старую админку в новой вкладке" data-tooltip="Открыть старую админку в новой вкладке — для функций, которых ещё нет в Admin 2">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-9 9M19 13v6H5V5h6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <span class="legacy-admin-link-label">Старая админка</span>
          </a>
          <a href="#support" title="Открыть почту поддержки">Почта</a>
          <a href="#analytics" title="Открыть аналитику">Аналитика</a>
          <a href="#admin-settings" title="Открыть настройки внешнего вида и поведения Admin v2">Настройки</a>
          <span id="auth-status" class="auth-status" role="status">Проверка доступа…</span>
        </div>
      </header>
      <div id="global-message" class="global-message" role="status" aria-live="polite" hidden></div>
      <div id="app" class="page" aria-live="polite"></div>
    </main>
  </div>

  <div id="dialog-root"></div>
  <script src="/v2/vendor/hammer.min.js"></script>
  <script src="/v2/vendor/chart.umd.js"></script>
  <script src="/v2/vendor/chartjs-plugin-zoom.min.js"></script>
  <script src="/v2/scripts/components/analytics-language.js"></script>
  <script src="/v2/scripts/pages/product-analytics.js"></script>
  <script src="/v2/scripts/pages/product-sessions.js"></script>
  <script src="/v2/scripts/pages/learning-diagnostics.js"></script>
  <script src="/v2/scripts/pages/conversion-diagnostics.js"></script>
  <script src="/v2/scripts/pages/retention-diagnostics.js"></script>
  <script src="/v2/scripts/pages/subscription-analytics.js"></script>
  <script src="/v2/scripts/pages/monthly-decision-pack.js"></script>
  <script type="module" src="/v2/scripts/admin-router.js"></script>
</body>
</html>
