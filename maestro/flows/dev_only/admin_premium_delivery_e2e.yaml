appId: app.phraseman
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 5000
- openLink: phraseman:///admin_premium_delivery_test
- waitForAnimationToEnd:
    timeout: 5000
- openLink: phraseman:///admin_premium_delivery_test
- extendedWaitUntil:
    visible: "Admin VIP Firestore E2E"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "admin-premium-e2e-ready"
    timeout: 45000
- tapOn:
    id: "admin-premium-e2e-auth-matrix"
- extendedWaitUntil:
    visible:
      id: "admin-premium-e2e-auth-matrix-pass"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "admin-premium-e2e-pass"
    timeout: 45000
