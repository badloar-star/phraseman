<style>
/* ============================================================
   Learning V2 · «Атлас» · токены макетов
   Источник цветов хрома — components/ui/v2_theme.ts (Deep Forest V2) и
   docs/v2/mockups/02-phrase-builder.html (эталон, одобрен владельцем).
   Свет глав (--ch-*) — содержательный: температура сцены главы из
   content/learning-v2-course/curriculum/en/ПЛАН_КУРСА.md, а не тема UI.
   Законы владельца: без обводок контейнеров, без подписей-расшифровок
   мелким шрифтом, без эмодзи и растра (только SVG/градиент/глифы), всё крупно.
   Движение: только transform/opacity/clip-path; ease-out; reduced motion всегда.
   ============================================================ */
:root {
  /* ---- время и кривые (constants/motion + v2motion) ---- */
  --tf: 1;
  --t-press: calc(120ms * var(--tf));
  --t-fast: calc(180ms * var(--tf));
  --t-normal: calc(240ms * var(--tf));
  --t-slow: calc(320ms * var(--tf));
  --t-celebrate: calc(420ms * var(--tf));
  --t-scene: calc(640ms * var(--tf));
  --t-breath: calc(2400ms * var(--tf));
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-spring: cubic-bezier(0.38, 0.70, 0.125, 1);
  --ease-slide: cubic-bezier(0.33, 0.52, 0.25, 0.99);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-inout: cubic-bezier(0.77, 0, 0.175, 1);

  /* ---- форма ---- */
  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;
  --r-pill: 999px;

  /* ---- типографика (v2_theme.type, крупно, без микро-текста) ---- */
  --font: "Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-rune: "Segoe UI Historic", "Noto Sans Runic", "Apple Symbols", var(--font);
  --fs-hero: 44px;
  --fs-title: 28px;
  --fs-section: 22px;
  --fs-card: 17px;
  --fs-body: 15px;
  --fs-label: 13px;
  --fs-num: 34px;

  /* ---- слои ---- */
  --z-map: 1;
  --z-float: 10;
  --z-header: 20;
  --z-backdrop: 30;
  --z-sheet: 40;
  --z-toast: 50;
  --z-iris: 60;
}

/* ============================================================
   Свет глав. Одна глава = одна сцена = одна температура света.
   Урок 1 «Первая неделя в Дублине» (ПЛАН_КУРСА.md):
   1 утро в офисе · 2 кофе с коллегой · 3 знакомство с командой ·
   4 квартира и погода · 5 обед с командой · 6 пятница, паб ·
   7 воскресный звонок домой.
   --ch     основной свет (светлый, читается на тёмном как текст)
   --ch-2   тот же свет, глубже (низ «фонаря», полка кнопки)
   --ch-ink тёмная краска на свету (текст на заливке)
   --ch-glow / --ch-soft   свечение и тональная подложка

   ============================================================ */
[data-ch="1"] {
  --ch: #6EDCC4;
  --ch-2: #2F9F88;
  --ch-3: #145E4F;
  --ch-ink: #03251D;
  --ch-glow: rgba(110, 220, 196, 0.42);
  --ch-soft: rgba(110, 220, 196, 0.13);

}

  --ch: #F28A9C;

  --ch: #8AAAF2;
  --ch-2: #5170C9;
  --ch-3: #2C4078;
  --ch-ink: #06132E;
  --ch-glow: rgba(138, 170, 242, 0.42);

<style>
/* ============================================================
   Рама телефона и общие компоненты хрома («Атлас», Learning V2).
   Всё, что повторяется между экранами: статус-бар, кнопки, чипы кошелька,
   3D-клавиша CTA, шторка, вуаль, тост «спокойного отказа», скелетон, ирис.
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: #06090A; }
body {
  font-family: var(--font);
  color: #E8EDEA;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }
button { font-family: inherit; }

.stage {
  display: flex;
  gap: 40px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
  padding: 36px 24px 80px;
}

/* ---------- Телефон ---------- */
.phone {
  width: 390px;
  height: 844px;
  position: relative;
  overflow: hidden;
  border-radius: 48px;
  display: flex;
  flex-direction: column;
  user-select: none;
  color: var(--text);
  background:
    radial-gradient(120% 60% at 50% -8%, var(--sheen), transparent 60%),
    linear-gradient(175deg, var(--bg-a), var(--bg-b));
  box-shadow: 0 40px 90px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  isolation: isolate;
}
.phone::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  border-radius: inherit;
  background: radial-gradient(135% 92% at 50% 46%, transparent 64%, rgba(0, 0, 0, 0.34) 100%);
}
.statusbar {
  height: 54px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 30px 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.1px;
  color: var(--text);
  position: relative;
  z-index: var(--z-header);
}
.statusbar .sb-right { display: flex; align-items: center; gap: 6px; }
.statusbar svg { width: 18px; height: 12px; }
.home-indicator {
  position: absolute;
  left: 50%;
  bottom: 9px;
  width: 134px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.35);
  transform: translateX(-50%);
  z-index: var(--z-toast);
  pointer-events: none;
}

/* ---------- Кнопки-иконки, чипы ---------- */
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  background: linear-gradient(160deg, var(--elev2), var(--card));
  color: var(--text-2);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  box-shadow: 0 6px 14px var(--shadow), inset 0 1px 0 var(--inner-light);
  transition: transform var(--t-press) var(--ease-out);
}
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 22px; height: 22px; }

.chip {
  height: 36px;
  padding: 0 12px 0 10px;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  background: linear-gradient(160deg, var(--elev2), var(--card));
  box-shadow: 0 6px 14px var(--shadow), inset 0 1px 0 var(--inner-light);
  white-space: nowrap;
}
.chip .glyph {
  font-family: var(--font-rune);
  font-size: 17px;
  font-weight: 700;
  line-height: 1;
  color: var(--gold);
}
.chip.energy .glyph { color: var(--energy); font-family: var(--font); }
.chip svg { width: 18px; height: 18px; }

/* ---------- 3D-клавиша (DuoPressable / PressableHybrid) ----------
   Цельная площадка + полка того же цвета темнее; нажатие вдавливает
   площадку в полку целиком. Цвет клавиши задают --k-a/--k-b/--k-c/--k-shelf/--k-ink;
   в сцене главы их переопределяет свет главы (см. .btn-key.ch). */
.btn-key {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  height: 56px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.1px;
  color: var(--k-ink);
  background: linear-gradient(180deg, var(--k-a) 0%, var(--k-b) 48%, var(--k-c) 100%);
  box-shadow:
    0 6px 0 var(--k-shelf),
    0 16px 30px -6px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.34);
  transform: translateY(0);
  transition: transform var(--t-press) var(--ease-out), box-shadow var(--t-press) var(--ease-out);
  overflow: hidden;
  isolation: isolate;
}
.btn-key:active,
.btn-key.is-pressed {
  transform: translateY(6px);
  box-shadow:
    0 0 0 var(--k-shelf),
    0 6px 14px -4px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.24);
}
.btn-key svg { width: 22px; height: 22px; flex: 0 0 auto; }
/* Одноразовый проход света по клавише при появлении (внимание к действию). */
.btn-key::after {
  content: "";
  position: absolute;
  top: -20%;
  bottom: -20%;
  left: 0;
  width: 46%;
  background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.45) 50%, transparent 100%);
  transform: translateX(-160%) skewX(-18deg);
  opacity: 0;
  pointer-events: none;
}
.btn-key.sweep::after {
  animation: keySweep calc(900ms * var(--tf)) var(--ease-slide) calc(380ms * var(--tf)) 1 both;
}
@keyframes keySweep {
  0% { transform: translateX(-160%) skewX(-18deg); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translateX(360%) skewX(-18deg); opacity: 0; }
}
.btn-key.ch {
  --k-a: color-mix(in oklab, var(--ch) 78%, white);
  --k-b: var(--ch);
  --k-c: var(--ch-2);
  --k-shelf: var(--ch-3);
  --k-ink: var(--ch-ink);
}
.btn-key.quiet {
  --k-a: var(--elev3);
  --k-b: var(--elev2);
  --k-c: var(--elev);
  --k-shelf: #000000;
  --k-ink: var(--text);
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.55), 0 12px 24px -8px rgba(0, 0, 0, 0.4), inset 0 1px 0 var(--inner-light);
}
.btn-key.quiet:active { box-shadow: 0 0 0 rgba(0, 0, 0, 0.55), 0 4px 10px -4px rgba(0, 0, 0, 0.4), inset 0 1px 0 var(--inner-light); }
.btn-key.gold {
  --k-a: #F6E3A1;
  --k-b: #E9C86A;
  --k-c: #C99B33;
  --k-shelf: #7A5C14;
  --k-ink: #231A04;
}
.btn-text {
  border: none;
  background: transparent;
  cursor: pointer;
  height: 48px;
  padding: 0 16px;
  font-size: 16px;
  font-weight: 700;
  color: var(--muted);
  border-radius: 14px;
  transition: transform var(--t-press) var(--ease-out), color var(--t-fast);
}
.btn-text:active { transform: scale(0.97); color: var(--text); }

/* ---------- Вуаль и шторка ---------- */
.backdrop {
  position: absolute;
  inset: 0;
  z-index: var(--z-backdrop);
  background:
    radial-gradient(120% 90% at 50% 100%, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.66) 70%);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-normal) var(--ease-out);
}
.backdrop.is-on { opacity: 1; pointer-events: auto; }

.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: var(--z-sheet);
  border-radius: 30px 30px 0 0;
  padding: 10px 22px 40px;
  background: linear-gradient(180deg, var(--elev) 0%, var(--card) 100%);
  box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 var(--inner-light);
  transform: translateY(104%);
  transition: transform var(--t-slow) var(--ease-drawer);
  will-change: transform;
}
.sheet.is-on { transform: translateY(0); }
.sheet .grabber {
  width: 36px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.18);
  margin: 0 auto 16px;
}

/* ---------- Тост «спокойный отказ» ---------- */
.toast {
  position: absolute;
  left: 50%;
  bottom: 118px;
  z-index: var(--z-toast);
  transform: translate(-50%, 14px);
  opacity: 0;
  padding: 12px 18px;
  border-radius: var(--r-pill);
  background: linear-gradient(160deg, var(--elev3), var(--elev));
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 var(--inner-light);
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  transition: transform var(--t-normal) var(--ease-out), opacity var(--t-normal) var(--ease-out);
}
.toast.is-on { transform: translate(-50%, 0); opacity: 1; }
.toast svg { width: 18px; height: 18px; color: var(--muted); }

/* ---------- Скелетон: геометрия зарезервирована, свет проходит ---------- */
.skel {
  position: relative;
  overflow: hidden;
  background: var(--elev);
  border-radius: 14px;
}
.skel::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.06) 50%, transparent 100%);
  animation: skelSweep calc(1400ms * var(--tf)) linear infinite;
}
@keyframes skelSweep { to { transform: translateX(100%); } }

/* ---------- Ирис: переход в занятие из точки действия ---------- */
.iris {
  position: absolute;
  inset: 0;
  z-index: var(--z-iris);
  pointer-events: none;
  clip-path: circle(0px at var(--ix, 50%) var(--iy, 80%));
  background: var(--bg);
  opacity: 1;
}
.iris.is-open {
  transition: clip-path var(--t-scene) var(--ease-inout);
  clip-path: circle(140% at var(--ix, 50%) var(--iy, 80%));
  pointer-events: auto;
}

/* ---------- Шапка экрана ---------- */
.hdr {
  position: relative;
  z-index: var(--z-header);
  padding: 4px 18px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hdr .grow { flex: 1; min-width: 0; }
.h-title {
  font-size: var(--fs-title);
  font-weight: 900;
  letter-spacing: -0.6px;
  line-height: 1.12;
  color: var(--text);
  text-wrap: balance;
}
.h-label {
  font-size: var(--fs-label);
  font-weight: 800;
  letter-spacing: 0.4px;
  color: var(--muted);
}

/* ---------- Звёзды оценки (SVG) ---------- */
.stars { display: inline-flex; gap: 3px; }
.stars svg { width: 12px; height: 12px; color: var(--gold); }
.stars svg.off { color: rgba(255, 255, 255, 0.16); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  :root { --tf: 0.001; }
}

</style>

<script>
/* ============================================================
   Геометрия маршрутов карты. Не змейка: у каждой главы своя форма пути,
   продиктованная сценой. Доска главы = 390 px шириной, высота своя.
   Порядок сессий всегда однозначен: одна непрерывная линия света через
   8 точек (7 занятий + печать главы / врата экзамена в конце).
   Точки — центры узлов. Узлы: 60–76 px, печать 96 px, врата 128×100 px.
   ============================================================ */
(function () {
  const W = 390;
  const CX = W / 2;

  function polar(cx, cy, r, deg) {
    const a = (deg * Math.PI) / 180;
    return { x: Math.round(cx + r * Math.cos(a)), y: Math.round(cy + r * Math.sin(a)) };
  }

  /* Глава 1 «Утро в офисе»: лестница — шаг вправо, шаг вниз, вход в здание.
     Печать — площадка внизу по центру. */
  function stairs() {
    const pts = [
      { x: 72, y: 84 }, { x: 160, y: 84 }, { x: 160, y: 176 }, { x: 250, y: 176 },
      { x: 250, y: 268 }, { x: 330, y: 268 }, { x: 330, y: 362 }, { x: CX, y: 486 },
    ];
    return { pts, h: 580, style: "steps" };
  }

  /* Глава 2 «Кофе с коллегой»: кольцо чашки — 7 занятий по кромке, печать в центре. */
  function ring() {
    const cy = 268, r = 132;
    const pts = [];
    for (let i = 0; i < 7; i += 1) pts.push(polar(CX, cy, r, -90 + i * (360 / 7)));
    pts.push({ x: CX, y: cy });
    return { pts, h: 460, style: "ring", ring: { cx: CX, cy, r } };
  }

  /* Глава 3 «Знакомство с командой»: два ряда, как на командном фото. */
  function rows() {
    const pts = [
      { x: 62, y: 96 }, { x: 150, y: 96 }, { x: 240, y: 96 }, { x: 328, y: 96 },
      { x: 284, y: 196 }, { x: CX, y: 196 }, { x: 106, y: 196 }, { x: CX, y: 332 },
    ];
    return { pts, h: 420, style: "curve" };
  }

  /* Глава 4 «Квартира и погода»: косой дождь — одна струя сверху справа вниз влево. */
  function rain() {
    const pts = [];
    for (let i = 0; i < 7; i += 1) pts.push({ x: 330 - i * 45, y: 84 + i * 68 });
    pts.push({ x: CX, y: 604 });
    return { pts, h: 690, style: "line" };
  }

  /* Глава 5 «Обед с командой»: стол — вытянутая петля, печать во главе стола. */
  function track() {
    const pts = [
      { x: 78, y: 104 }, { x: 166, y: 82 }, { x: 256, y: 82 }, { x: 336, y: 112 },
      { x: 336, y: 238 }, { x: 256, y: 268 }, { x: 166, y: 268 }, { x: 78, y: 236 },
    ];
    return { pts, h: 340, style: "curve" };
  }

  /* Глава 6 «Пятница, паб»: быстрая речь — тугой зигзаг, единственный на карте, намеренно. */
  function zigzag() {
    const pts = [];
    for (let i = 0; i < 7; i += 1) pts.push({ x: i % 2 === 0 ? 132 : 258, y: 72 + i * 52 });
    pts.push({ x: CX, y: 470 });
    return { pts, h: 560, style: "line" };
  }

  /* Глава 7 «Звонок домой»: спираль наружу — неделя собирается в одно, врата внизу. */
  function spiral() {
    const cy = 272;
    const pts = [];
    for (let i = 0; i < 7; i += 1) {
      const r = 76 + i * 14;
      const deg = 90 - (6 - i) * 51.4;
      pts.push(polar(CX, cy, r, deg));
    }
    pts.push({ x: CX, y: 560 });
    return { pts, h: 660, style: "curve", gate: true };
  }

  const SHAPES = { stairs, ring, rows, rain, track, zigzag, spiral };

  /* Гладкая кривая Катмулла–Рома через точки → кубические Безье. */
  function curvePath(pts) {
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i += 1) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x} ${p2.y}`;
    }
    return d;
  }

  /* Ломаная со скруглёнными углами (лестница). */
  function stepsPath(pts, radius) {
    const r = radius || 26;
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i += 1) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const v1 = { x: a.x - b.x, y: a.y - b.y };
      const v2 = { x: c.x - b.x, y: c.y - b.y };
      const l1 = Math.hypot(v1.x, v1.y), l2 = Math.hypot(v2.x, v2.y);
      const rr = Math.min(r, l1 / 2, l2 / 2);
      const p1 = { x: b.x + (v1.x / l1) * rr, y: b.y + (v1.y / l1) * rr };
      const p2 = { x: b.x + (v2.x / l2) * rr, y: b.y + (v2.y / l2) * rr };
      d += ` L${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q${b.x} ${b.y} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    const last = pts[pts.length - 1];
    d += ` L${last.x} ${last.y}`;
    return d;
  }

  function linePath(pts) {
    return pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x} ${p.y}`).join(" ");
  }

  /* Кольцо: дуги по окружности между 7 точками, затем мягкий заход в центр. */
  function ringPath(pts, ring) {
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < 7; i += 1) d += ` A${ring.r} ${ring.r} 0 0 1 ${pts[i].x} ${pts[i].y}`;
    const last = pts[6], c = pts[7];
    d += ` Q${(last.x + c.x) / 2 - 30} ${(last.y + c.y) / 2 - 40} ${c.x} ${c.y}`;
    return d;
  }

  function routeFor(shapeName) {
    const r = SHAPES[shapeName]();
    let d;
    if (r.style === "steps") d = stepsPath(r.pts);
    else if (r.style === "line") d = linePath(r.pts);
    else if (r.style === "ring") d = ringPath(r.pts, r.ring);
    else d = curvePath(r.pts);
    return Object.assign(r, { d, w: W });
  }

  /* Длина пути до каждой точки (для света прогресса) — по готовому <path>. */
  function lengthsAtPoints(pathEl, pts) {
    const total = pathEl.getTotalLength();
    const step = 3;
    const samples = [];
    for (let l = 0; l <= total; l += step) {
      const p = pathEl.getPointAtLength(l);
      samples.push({ l, x: p.x, y: p.y });
    }
    return pts.map((pt) => {
      let best = samples[0], bd = Infinity;
      for (const s of samples) {
        const dd = (s.x - pt.x) ** 2 + (s.y - pt.y) ** 2;
        if (dd < bd) { bd = dd; best = s; }
      }
      return best.l;
    });
  }

  window.ROUTES = { routeFor, lengthsAtPoints, W };
})();

</script>
<script>
/* ============================================================
   MapKit — сборка и жизнь карты урока (общее для макетов 03–07).
   const kit = MapKit.mount({ phone, canvas, scroll, hdr, jump, toast,
                              backdrop, nodeSheet, runeChip, runeCount,
                              countEl, spectrumEl, onTap })
   kit.build() · kit.apply(model, {instant}) · kit.makeModel(doneUpTo)
   kit.base(model, {noEnter, top}) · kit.returnComplete(token) ·
   kit.chapterUnlock(token) · kit.flyRunes(el, n) · kit.deny(el, text) ·
   kit.openNodeSheet(n) · kit.closeSheet() · kit.scrollToCurrent()
   Любые таймеры хореографий регистрируются через kit.later(fn, ms) и
   отменяются при смене состояния (kit.base) — иначе поздняя шторка
   всплывала поверх следующего состояния.
   ============================================================ */
(function () {
  const { CHAPTERS, SESSIONS, TYPE_LABEL } = window.COURSE;
  const { routeFor, lengthsAtPoints } = window.ROUTES;

  const tf = () => Number(getComputedStyle(document.documentElement).getPropertyValue("--tf")) || 1;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms * tf()));
  const reduced = () => document.documentElement.getAttribute("data-reduced") === "1";

  function plural(n, a, b, c) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return a;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b;
    return c;
  }

  function ringSVG() {
    const r = 44, c = 48, segs = 7, gap = 10;
    const circ = 2 * Math.PI * r;
    const segLen = circ / segs - gap;
    let paths = "";
    for (let i = 0; i < segs; i += 1) {
      const off = -(i * circ) / segs - gap / 2;
      paths += `<circle class="seg" data-i="${i}" cx="${c}" cy="${c}" r="${r}" stroke-dasharray="${segLen} ${circ - segLen}" stroke-dashoffset="${off}" transform="rotate(-90 ${c} ${c})"/>`;
    }
    return `<svg class="ring" viewBox="0 0 96 96"><circle class="track" cx="${c}" cy="${c}" r="${r}"/>${paths}</svg>`;
  }

  function makeModel(doneUpTo, extra) {
    const done = new Set();
    const stars = new Map();
    for (let n = 1; n <= doneUpTo; n += 1) { done.add(n); stars.set(n, [3, 2, 3, 3, 1, 3, 2][n % 7]); }
    const m = { done, stars, current: doneUpTo >= 56 ? null : doneUpTo + 1 };
    return Object.assign(m, extra || {});
  }

  function mount(cfg) {
    const phone = cfg.phone;
    const canvas = cfg.canvas;
    const scroll = cfg.scroll;
    const refs = { chapters: [], nodes: new Map(), seals: new Map(), gate: null, spectrum: [] };
    let model = null;
    let runToken = 0;
    const timers = [];
    let toastTimer = null;

    function later(fn, ms) { const t = setTimeout(fn, ms * tf()); timers.push(t); return t; }
    function cancelAll() { timers.splice(0).forEach(clearTimeout); }

    function build() {
      canvas.innerHTML = "";
      refs.chapters = []; refs.nodes.clear(); refs.seals.clear();
      let gi = 0;
      CHAPTERS.forEach((chapter) => {
        const route = routeFor(chapter.shape);
        const sec = document.createElement("section");
        sec.className = "ch";
        sec.setAttribute("data-ch", String(chapter.n));
        sec.innerHTML = `
          <div class="ch-ground"></div>
          <div class="ch-glow" style="left:${route.pts[0].x - 130}px;top:${route.pts[0].y + 40}px"></div>
          <header class="ch-head" style="--i:${gi}">
            <div class="t"><div class="ch-num">Глава ${chapter.n}</div><h2 class="ch-title">${chapter.title}</h2><div class="ch-scene">${chapter.scene}</div></div>
            <div class="ch-status"></div>
          </header>
          <div class="board" style="height:${route.h}px">
            <svg class="route" width="390" height="${route.h}" viewBox="0 0 390 ${route.h}" aria-hidden="true">
              <path class="street" d="${route.d}"/>
              <path class="glow" d="${route.d}"/>
              <path class="lit" d="${route.d}"/>
            </svg>
            <div class="spark" style="offset-path: path('${route.d}')"></div>
            <div class="fog"><div class="sweep"></div></div>
          </div>`;
        gi += 1;
        const board = sec.querySelector(".board");
        const sessions = SESSIONS.filter((s) => s.ch === chapter.n);
        sessions.forEach((s, i) => {
          const p = route.pts[i];
          const elm = document.createElement("button");
          if (s.role === "final_exam") {
            elm.className = "gate";
            elm.innerHTML = `<div class="light"></div><div class="arch"><div class="inner"><span class="rune">ᛞ</span></div></div><span class="label">Экзамен</span>`;
            refs.gate = elm;
          } else if (s.role === "chapter_checkpoint") {
            elm.className = "seal";
            elm.innerHTML = `<span class="ground"></span><span class="flash"></span>${ringSVG()}<span class="face"><span class="rune">ᛝ</span></span><span class="label">Проверка</span>`;
            refs.seals.set(s.n, elm);
          } else {
            elm.className = "node";
            elm.innerHTML = `<span class="ground"></span><span class="halo"></span><span class="gem"></span><span class="stars"></span><span class="pill">Продолжить</span>`;
            refs.nodes.set(s.n, elm);
          }
          elm.style.setProperty("--x", p.x + "px");
          elm.style.setProperty("--y", p.y + "px");
          elm.style.setProperty("--i", String(gi));
          elm.setAttribute("data-n", String(s.n));
          elm.setAttribute("aria-label", `Занятие ${s.n}. ${s.grammar}`);
          elm.addEventListener("click", () => (cfg.onTap ? cfg.onTap(s.n, kit) : defaultTap(s.n)));
          board.appendChild(elm);
          gi += 1;
        });
        canvas.appendChild(sec);
        const pathEl = sec.querySelector(".lit");
        const total = pathEl.getTotalLength();
        const lens = lengthsAtPoints(pathEl, route.pts);
        sec.querySelectorAll(".glow, .lit").forEach((p) => { p.style.strokeDasharray = String(total); p.style.strokeDashoffset = String(total); });
        refs.chapters.push({ sec, route, total, lens, chapter, pathEl, sessions });
      });
      if (cfg.spectrumEl) {
        cfg.spectrumEl.innerHTML = "";
        refs.spectrum = CHAPTERS.map((c) => { const s = document.createElement("span"); s.setAttribute("data-ch", String(c.n)); cfg.spectrumEl.appendChild(s); return s; });
      }
    }

    function nodeState(n) {
      if (model.done.has(n)) return "done";
      if (model.current === n) return "current";
      if (model.current !== null && n === model.current + 1) return "next";
      return "locked";
    }

    function apply(m, opts) {
      model = m;
      const o = opts || {};
      refs.chapters.forEach((c) => {
        const sealN = c.sessions[7].n;
        const sealPassed = m.done.has(sealN);
        const chOpen = c.sessions.some((s) => m.done.has(s.n) || m.current === s.n);
        c.sec.classList.toggle("locked", !chOpen);
        c.sec.classList.toggle("done", sealPassed);
        const status = c.sec.querySelector(".ch-status");
        const doneCount = c.sessions.slice(0, 7).filter((s) => m.done.has(s.n)).length;
        status.innerHTML = sealPassed ? `<svg><use href="#i-check"/></svg>` : chOpen ? `${doneCount}/7` : `<svg><use href="#i-lock"/></svg>`;
        let litIdx = -1;
        c.sessions.forEach((s, i) => { if (m.done.has(s.n) || m.current === s.n) litIdx = i; });
        const lit = litIdx < 0 ? 0 : c.lens[litIdx];
        c.sec.querySelectorAll(".glow, .lit").forEach((p) => {
          if (o.instant) p.style.transition = "none";
          p.style.strokeDashoffset = String(c.total - lit);
          if (o.instant) { void p.getBoundingClientRect(); p.style.transition = ""; }
        });
        if (refs.spectrum.length) {
          const chCount = c.sessions.filter((s) => m.done.has(s.n)).length;
          refs.spectrum[c.chapter.n - 1].style.setProperty("--p", String(chCount / 8));
        }
        c.sessions.forEach((s) => {
          if (s.role === "final_exam") {
            const g = refs.gate;
            g.classList.remove("locked", "available", "passed");
            g.classList.add(m.done.has(s.n) ? "passed" : m.current === s.n ? "available" : "locked");
            g.querySelector(".label").textContent = m.done.has(s.n) ? "Сдан" : "Экзамен";
          } else if (s.role === "chapter_checkpoint") {
            const el = refs.seals.get(s.n);
            el.classList.remove("locked", "available", "passed");
            el.classList.add(m.done.has(s.n) ? "passed" : m.current === s.n ? "available" : "locked");
            el.querySelectorAll(".seg").forEach((sg, i) => sg.classList.toggle("on", i < doneCount));
            el.querySelector(".label").textContent = m.done.has(s.n) ? "Глава закрыта" : "Проверка";
          } else {
            const el = refs.nodes.get(s.n);
            const st = nodeState(s.n);
            el.classList.remove("done", "current", "next", "locked");
            el.classList.add(st);
            const gem = el.querySelector(".gem");
            gem.innerHTML = st === "locked" ? `<svg><use href="#i-lock"/></svg>` : st === "done" ? `<svg><use href="#i-check"/></svg>` : String(s.pos);
            el.querySelector(".stars").innerHTML = st === "done" ? window.starsHTML(m.stars.get(s.n) ?? 3) : "";
            el.querySelector(".pill").textContent = m.done.size === 0 ? "Начать" : "Продолжить";
          }
        });
      });
      if (cfg.countEl) cfg.countEl.textContent = `${m.done.size} из 56`;
      const curCh = m.current ? Math.ceil(m.current / 8) : 7;
      if (cfg.hdr) cfg.hdr.setAttribute("data-ch", String(curCh));
      if (cfg.jump) {
        cfg.jump.setAttribute("data-ch", String(curCh));
        const lbl = cfg.jump.querySelector("[data-jump-label]");
        if (lbl) lbl.textContent = !m.current ? "Урок пройден" : m.done.size === 0 ? "Начать" : "Продолжить";
      }
    }

    function currentEl() { if (!model || !model.current) return null; return refs.nodes.get(model.current) || refs.seals.get(model.current) || refs.gate; }
    function elTop(el) { return el.offsetTop + el.parentElement.offsetTop + el.parentElement.parentElement.offsetTop; }
    function scrollToCurrent(behavior) {
      const el = currentEl(); if (!el) return;
      scroll.scrollTo({ top: Math.max(0, elTop(el) - 300), behavior: behavior || "smooth" });
    }
    function scrollToNode(n, offset, behavior) {
      const el = refs.nodes.get(n) || refs.seals.get(n) || refs.gate;
      scroll.scrollTo({ top: Math.max(0, elTop(el) - (offset == null ? 300 : offset)), behavior: behavior || "auto" });
    }

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.target === currentEl() && cfg.jump) cfg.jump.classList.toggle("is-on", !e.isIntersecting && phone.getAttribute("data-state") !== "skeleton");
      });
    }, { root: scroll, threshold: 0.3 });
    function watchCurrent() { io.disconnect(); const el = currentEl(); if (el) io.observe(el); else if (cfg.jump) cfg.jump.classList.remove("is-on"); }
    if (cfg.jump) cfg.jump.addEventListener("click", () => scrollToCurrent("smooth"));

    const chIO = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting && e.intersectionRatio > 0.35 && cfg.hdr) cfg.hdr.querySelector(".h-label").setAttribute("data-ch", e.target.getAttribute("data-ch")); });
    }, { root: scroll, threshold: [0.35, 0.6] });

    function showToast(text, icon) {
      if (!cfg.toast) return;
      cfg.toast.querySelector("[data-toast-text]").textContent = text;
      const use = cfg.toast.querySelector("use"); if (use) use.setAttribute("href", icon || "#i-lock");
      cfg.toast.classList.add("is-on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => cfg.toast.classList.remove("is-on"), 1800 * tf());
    }
    function deny(el, text) { el.classList.remove("is-denied"); void el.offsetWidth; el.classList.add("is-denied"); showToast(text); }

    function defaultTap(n) {
      const s = SESSIONS[n - 1];
      const el = refs.nodes.get(n) || refs.seals.get(n) || refs.gate;
      if (model.done.has(n)) { openNodeSheet(n); return; }
      if (model.current === n) { showToast(s.role === "chapter_checkpoint" ? "Открывается печать главы (макет 05)" : s.role === "final_exam" ? "Открываются врата экзамена (макет 05)" : "Открывается билет занятия (макет 04)", "#i-play"); return; }
      if (s.role === "chapter_checkpoint") {
        const left = 7 - SESSIONS.filter((x) => x.ch === s.ch && x.pos < 8 && model.done.has(x.n)).length;
        deny(el, `Осталось ${left} ${plural(left, "занятие", "занятия", "занятий")}`);
        return;
      }
      if (s.role === "final_exam") { deny(el, "Сначала печать главы 7"); return; }
      const chOpen = SESSIONS.some((x) => x.ch === s.ch && (model.done.has(x.n) || model.current === x.n));
      deny(el, chOpen ? `Сначала занятие ${model.current}` : `Сначала проверка главы ${s.ch - 1}`);
    }

    function openNodeSheet(n) {
      if (!cfg.nodeSheet) return;
      const s = SESSIONS[n - 1];
      const sh = cfg.nodeSheet;
      sh.setAttribute("data-ch", String(s.ch));
      sh.querySelector("[data-ns-gem]").textContent = s.pos;
      sh.querySelector("[data-ns-title]").textContent = s.grammar;
      sh.querySelector("[data-ns-kind]").textContent = `${TYPE_LABEL[s.type]} · ${s.moment}`;
      sh.querySelector("[data-ns-stars]").innerHTML = window.starsHTML(model.stars.get(n) ?? 3, 22);
      if (cfg.backdrop) cfg.backdrop.classList.add("is-on");
      sh.classList.add("is-on");
      const key = sh.querySelector(".btn-key"); if (key) { key.classList.remove("sweep"); void key.offsetWidth; key.classList.add("sweep"); }
    }
    function closeSheet() { if (cfg.backdrop) cfg.backdrop.classList.remove("is-on"); if (cfg.nodeSheet) cfg.nodeSheet.classList.remove("is-on"); }
    if (cfg.backdrop) cfg.backdrop.addEventListener("click", closeSheet);
    if (cfg.nodeSheet) { const c = cfg.nodeSheet.querySelector("[data-ns-close]"); if (c) c.addEventListener("click", closeSheet); }

    function enter() {
      phone.classList.remove("is-entering"); void phone.offsetWidth; phone.classList.add("is-entering");
      later(() => phone.classList.remove("is-entering"), 2600);
    }

    async function flyRunes(fromEl, count) {
      const chip = cfg.runeChip; const counter = cfg.runeCount;
      if (!chip) { await wait(200); return; }
      const pr = phone.getBoundingClientRect();
      const a = fromEl.getBoundingClientRect();
      const b = chip.getBoundingClientRect();
      const sx = a.left + a.width / 2 - pr.left, sy = a.top + a.height / 2 - pr.top;
      const ex = b.left + b.width / 2 - pr.left, ey = b.top + b.height / 2 - pr.top;
      const glyphs = ["ᚠ", "ᚢ", "ᚦ", "ᚨ", "ᚱ", "ᚲ", "ᚷ"];
      const start = counter ? Number(counter.textContent) : 0;
      for (let i = 0; i < count; i += 1) {
        const f = document.createElement("span");
        f.className = "flyer"; f.textContent = glyphs[(i + Math.floor(Math.random() * 7)) % 7];
        phone.appendChild(f);
        const mx = sx + (ex - sx) * 0.5 + (i - count / 2) * 26, my = sy + (ey - sy) * 0.42 - 60;
        const anim = f.animate([
          { transform: `translate(${sx - 11}px, ${sy - 11}px) scale(.6) rotate(0deg)`, opacity: 0 },
          { transform: `translate(${mx - 11}px, ${my - 11}px) scale(1.15) rotate(${120 + i * 40}deg)`, opacity: 1, offset: .45 },
          { transform: `translate(${ex - 11}px, ${ey - 11}px) scale(.5) rotate(${300 + i * 40}deg)`, opacity: .9 },
        ], { duration: reduced() ? 1 : 620 * tf(), delay: reduced() ? 0 : i * 90 * tf(), easing: "cubic-bezier(.33,.52,.25,.99)", fill: "forwards" });
        anim.onfinish = () => { f.remove(); chip.classList.remove("is-bump"); void chip.offsetWidth; chip.classList.add("is-bump"); if (counter) counter.textContent = String(start + Math.round(((i + 1) / count) * 15)); };
      }
      await wait(620 + count * 90);
    }

    async function returnComplete(token) {
      const n = model.current;
      const el = refs.nodes.get(n);
      const next = n + 1;
      await wait(260); if (token !== runToken) return;
      const m2 = makeModel(n); m2.stars.set(n, 3);
      apply(m2, {});
      el.classList.add("is-land");
      el.querySelectorAll(".stars svg").forEach((s, i) => { s.classList.add("pop"); s.style.animationDelay = `${i * 120 * tf()}ms`; });
      await wait(160); if (token !== runToken) return;
      await flyRunes(el, 5); if (token !== runToken) return;
      const c = refs.chapters[Math.ceil(n / 8) - 1];
      const idx = c.sessions.findIndex((s) => s.n === n);
      const spark = c.sec.querySelector(".spark");
      const from = c.lens[idx], to = c.lens[idx + 1];
      spark.animate([{ offsetDistance: `${from}px`, opacity: 0 }, { offsetDistance: `${from + (to - from) * .1}px`, opacity: 1, offset: .12 }, { offsetDistance: `${to}px`, opacity: 1, offset: .9 }, { offsetDistance: `${to}px`, opacity: 0 }], { duration: 640 * tf(), easing: "cubic-bezier(.33,.52,.25,.99)", fill: "forwards" });
      await wait(560); if (token !== runToken) return;
      const nextEl = refs.nodes.get(next) || refs.seals.get(next) || refs.gate;
      nextEl.classList.add("is-pop");
      later(() => { nextEl.classList.remove("is-pop"); el.classList.remove("is-land"); }, 700);
      watchCurrent();
    }

    async function chapterUnlock(token) {
      const seal = refs.seals.get(16);
      await wait(300); if (token !== runToken) return;
      seal.classList.remove("is-stamp"); void seal.offsetWidth; seal.classList.add("is-stamp");
      apply(makeModel(16), {});
      await wait(200); if (token !== runToken) return;
      await flyRunes(seal, 7); if (token !== runToken) return;
      const c3 = refs.chapters[2];
      scroll.scrollTo({ top: c3.sec.offsetTop - 40, behavior: "smooth" });
      await wait(420); if (token !== runToken) return;
      c3.sec.classList.add("is-unlocking");
      c3.sec.classList.remove("locked");
      c3.sec.querySelectorAll(".node, .seal, .ch-head").forEach((n, i) => { n.style.setProperty("--i", String(i)); });
      phone.classList.add("is-entering");
      await wait(900); if (token !== runToken) return;
      phone.classList.remove("is-entering"); c3.sec.classList.remove("is-unlocking");
      refs.nodes.get(17).classList.add("is-pop");
      later(() => refs.nodes.get(17).classList.remove("is-pop"), 700);
      seal.classList.remove("is-stamp");
      watchCurrent();
    }

    function base(m, o) {
      runToken += 1;
      cancelAll();
      closeSheet();
      if (cfg.toast) cfg.toast.classList.remove("is-on");
      phone.querySelectorAll(".flyer").forEach((f) => f.remove());
      apply(m, { instant: true });
      refs.chapters.forEach((c) => { c.sec.classList.remove("is-unlocking", "is-entering"); chIO.observe(c.sec); });
      if (cfg.jump) cfg.jump.classList.remove("is-on");
      watchCurrent();
      if (!(o && o.noEnter)) enter();
      scroll.scrollTo({ top: o && o.top != null ? o.top : 0, behavior: "auto" });
      return runToken;
    }

    const kit = {
      refs, build, apply, makeModel, base, enter, flyRunes, returnComplete, chapterUnlock,
      deny, showToast, openNodeSheet, closeSheet, scrollToCurrent, scrollToNode, watchCurrent, later, cancelAll, wait, tf,
      get model() { return model; },
      get token() { return runToken; },
      nodeEl: (n) => refs.nodes.get(n) || refs.seals.get(n) || refs.gate,
      plural,
    };
    return kit;
  }

  window.MapKit = { mount, makeModel, ringSVG };
})();

</script>
<script>
/* ============================================================
   Showcase — панель витрины для макетов «Атласа».
   Showcase.init({ title, kicker, lead, states:[{id,label,group,apply}],
                   notes: html, nav: [{href,label}], onTheme })
   - переключает состояния экрана (data-state на телефоне + apply()),
   - тему хрома (data-theme на <html>), замедление 4× (--tf), reduced motion,
   - «Повторить» перезапускает текущее состояние (все анимации с нуля).
   Никаких зависимостей. Всё, что оно делает с DOM телефона, — через apply().
   ============================================================ */
(function () {
  const root = document.documentElement;
  // Перехват ошибок макета: смотреть window.__mockupErrors в консоли.
  window.__mockupErrors = [];
  window.addEventListener("error", (e) => window.__mockupErrors.push(`${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}`));
  window.addEventListener("unhandledrejection", (e) => window.__mockupErrors.push(String(e.reason && (e.reason.stack || e.reason))));
  const THEMES = [
    { id: "forest", label: "Лес", sw: "#47C870" },
    { id: "gold", label: "Золото", sw: "#D6B35A" },
    { id: "coral", label: "Коралл", sw: "#FF7F50" },
  ];
  const state = { current: null, slow: false, reduced: false, theme: "forest", cfg: null };

  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        if (k === "class") n.className = attrs[k];
        else if (k === "html") n.innerHTML = attrs[k];
        else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
        else n.setAttribute(k, attrs[k]);
      }
    }
    (children || []).forEach((c) => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return n;
  }

  function applyMotionFlags() {
    root.style.setProperty("--tf", state.reduced ? 0.001 : state.slow ? 4 : 1);
    if (state.reduced) root.setAttribute("data-reduced", "1");
    else root.removeAttribute("data-reduced");
  }

  /* Перезапуск CSS-анимаций внутри контейнера: снять и вернуть класс через reflow. */
  function replayAnimations(container) {
    container.querySelectorAll("[class]").forEach((n) => {
      const cls = n.getAttribute("class");
      if (!cls) return;
      n.style.animation = "none";
      void n.offsetWidth;
      n.style.animation = "";
    });
  }

  function setState(id, opts) {
    const cfg = state.cfg;
    const s = cfg.states.find((x) => x.id === id);
    if (!s) return;
    state.current = id;
    const phone = document.querySelector(".phone");
    if (phone) phone.setAttribute("data-state", id);
    document.querySelectorAll(".pbtn[data-state-id]").forEach((b) => {
      b.setAttribute("aria-pressed", b.getAttribute("data-state-id") === id ? "true" : "false");
    });
    if (typeof s.apply === "function") s.apply(Object.assign({ replay: false }, opts || {}));
    const noteBox = document.getElementById("state-note");
    if (noteBox) noteBox.innerHTML = s.note || "";
    try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (e) { /* песочница артефакта запрещает историю: состояние живёт только в панели */ }
  }

  /* На узком экране (телефон) рама 390 px масштабируется под ширину окна:
     страница никогда не прокручивается вбок, макет смотрится на реальном айфоне. */
  function fitPhone() {
    const phone = document.querySelector(".phone");
    if (!phone) return;
    const z = Math.min(1, (window.innerWidth - 8) / 390);
    phone.style.zoom = z < 1 ? String(z) : "";
  }
  window.addEventListener("resize", fitPhone);

  function init(cfg) {
    state.cfg = cfg;
    fitPhone();
    const panel = document.querySelector(".panel");
    if (!panel) return;
    panel.innerHTML = "";

    const h1 = el("h1", null, [el("small", null, [cfg.kicker || "Learning V2 · Атлас"]), cfg.title]);
    panel.appendChild(h1);
    if (cfg.lead) panel.appendChild(el("p", { class: "lead", html: cfg.lead }));

    if (cfg.nav && cfg.nav.length) {
      const nav = el("div", { class: "nav" });
      cfg.nav.forEach((n) => nav.appendChild(el("a", { href: n.href }, [n.label])));
      panel.appendChild(nav);
    }

    // Состояния (группами)
    const groups = [];
    cfg.states.forEach((s) => {
      const g = s.group || "Состояния";
      if (!groups.includes(g)) groups.push(g);
    });
    groups.forEach((g) => {
      const box = el("div");
      box.appendChild(el("h2", null, [g]));
      const grp = el("div", { class: "group" });
      cfg.states
        .filter((s) => (s.group || "Состояния") === g)
        .forEach((s) => {
          grp.appendChild(
            el("button", {
              class: "pbtn",
              "data-state-id": s.id,
              "aria-pressed": "false",
              onclick: () => setState(s.id, { replay: true }),
            }, [s.label]),
          );
        });
      box.appendChild(grp);
      panel.appendChild(box);
    });

    // Управление движением
    const motionBox = el("div");
    motionBox.appendChild(el("h2", null, ["Движение"]));
    const mg = el("div", { class: "group" });
    const replayBtn = el("button", { class: "pbtn replay", onclick: () => setState(state.current, { replay: true }) }, ["Повторить"]);
    const slowBtn = el("button", {
      class: "pbtn", "aria-pressed": "false",
      onclick: (e) => {
        state.slow = !state.slow;
        e.currentTarget.setAttribute("aria-pressed", String(state.slow));
        applyMotionFlags();
        setState(state.current, { replay: true });
      },
    }, ["Замедлить 4×"]);
    const rmBtn = el("button", {
      class: "pbtn", "aria-pressed": "false",
      onclick: (e) => {
        state.reduced = !state.reduced;
        e.currentTarget.setAttribute("aria-pressed", String(state.reduced));
        applyMotionFlags();
        setState(state.current, { replay: true });
      },
    }, ["Reduced motion"]);
    mg.appendChild(replayBtn);
    mg.appendChild(slowBtn);
    mg.appendChild(rmBtn);
    motionBox.appendChild(mg);
    panel.appendChild(motionBox);

    // Тема хрома
    if (cfg.themes !== false) {
      const tb = el("div");
      tb.appendChild(el("h2", null, ["Тема хрома приложения"]));
      const tg = el("div", { class: "group" });
      THEMES.forEach((t) => {
        const b = el("button", {
          class: "pbtn", "data-theme-id": t.id, "aria-pressed": String(t.id === state.theme),
          onclick: () => {
            state.theme = t.id;
            root.setAttribute("data-theme", t.id);
            document.querySelectorAll(".pbtn[data-theme-id]").forEach((x) => x.setAttribute("aria-pressed", String(x.getAttribute("data-theme-id") === t.id)));
            if (cfg.onTheme) cfg.onTheme(t.id);
          },
        });
        const sw = el("span", { class: "sw" });
        sw.style.background = t.sw;
        b.appendChild(sw);
        b.appendChild(document.createTextNode(t.label));
        tg.appendChild(b);
      });
      tb.appendChild(tg);
      panel.appendChild(tb);
    }

    // Заметка состояния + общие заметки
    panel.appendChild(el("div", { class: "note", id: "state-note" }));
    if (cfg.notes) panel.appendChild(el("div", { class: "note", html: cfg.notes }));

    const fromHash = location.hash.replace("#", "");
    const first = cfg.states.find((s) => s.id === fromHash) ? fromHash : cfg.states[0].id;
    root.setAttribute("data-theme", state.theme);
    setState(first, { replay: true });
  }

  window.Showcase = { init, setState, replayAnimations, get state() { return state; } };
})();

</script>
<script>
(function () {
  document.getElementById("sb").outerHTML = window.statusbarHTML();
  const { CHAPTERS, LESSONS } = window.COURSE;
  const phone = document.querySelector(".phone");
  const tf = () => Number(getComputedStyle(document.documentElement).getPropertyValue("--tf")) || 1;
  const reduced = () => document.documentElement.getAttribute("data-reduced") === "1";
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms * tf()));
  const stamp = document.getElementById("stamp");

  function sealHTML() {
    return `${window.MapKit.ringSVG()}<div class="flash"></div><div class="rings"><i style="--i:0"></i><i style="--i:1"></i></div><div class="face"><span class="rune">ᛝ</span></div>`;
  }
  function gateHTML() { return `<div class="flash"></div><div class="rings"><i style="--i:0"></i><i style="--i:1"></i></div><div class="arch"><div class="inner"><span class="rune">ᛞ</span></div></div>`; }

  function flyRunes(count, delta) {
    const chip = document.getElementById("chip-runes"); const counter = document.getElementById("rune-count");
    const src = document.getElementById("rune-row");
    const pr = phone.getBoundingClientRect(); const a = src.getBoundingClientRect(); const b = chip.getBoundingClientRect();
    const sx = a.right - 40 - pr.left, sy = a.top + a.height / 2 - pr.top;
    const ex = b.left + b.width / 2 - pr.left, ey = b.top + b.height / 2 - pr.top;
    const glyphs = ["ᚠ", "ᚢ", "ᚦ", "ᚨ", "ᚱ", "ᚲ", "ᚷ", "ᚹ", "ᛃ"];
    const start = Number(counter.textContent);
    for (let i = 0; i < count; i += 1) {
      const f = document.createElement("span"); f.className = "flyer"; f.textContent = glyphs[(i * 4 + Math.floor(Math.random() * 9)) % 9];
      phone.appendChild(f);
      const mx = sx + (ex - sx) * .5 + (i - count / 2) * 20, my = sy + (ey - sy) * .4 - 80;
      f.animate([
        { transform: `translate(${sx - 11}px, ${sy - 11}px) scale(.6) rotate(0deg)`, opacity: 0 },
        { transform: `translate(${mx - 11}px, ${my - 11}px) scale(1.2) rotate(${120 + i * 40}deg)`, opacity: 1, offset: .45 },
        { transform: `translate(${ex - 11}px, ${ey - 11}px) scale(.5) rotate(${300 + i * 40}deg)`, opacity: .9 },
      ], { duration: reduced() ? 1 : 620 * tf(), delay: reduced() ? 0 : i * 90 * tf(), easing: "cubic-bezier(.33,.52,.25,.99)", fill: "forwards" }).onfinish = () => {
        f.remove(); chip.classList.remove("is-bump"); void chip.offsetWidth; chip.classList.add("is-bump");
        counter.textContent = String(start + Math.round(((i + 1) / count) * delta));
      };
    }
  }

  function skillsHTML(items) {
    return `<div class="h r-in" style="--d:1150">Что вы теперь умеете</div>` + items.map((it, i) => `<div class="skill ${it.ok ? "" : "review"}" style="--i:${i}"><div class="ic"><svg><use href="${it.ok ? "#i-check" : "#i-refresh"}"/></svg></div><span>${it.t}</span><span class="tag">${it.ok ? "Закрепилось" : "Стоит повторить"}</span></div>`).join("");
  }

  function setup(o) {
    timers.splice(0).forEach(clearTimeout);
    phone.querySelectorAll(".flyer").forEach((f) => f.remove());
    const chNum = o.ch; const ch = CHAPTERS[chNum - 1];
    phone.setAttribute("data-ch", String(Math.min(7, chNum + 1)));
    document.getElementById("rune-count").textContent = "135";
    stamp.className = "stamp" + (o.gate ? " gate" : "");
    stamp.innerHTML = o.gate ? gateHTML() : sealHTML();
    document.getElementById("r-label").textContent = o.gate ? "Урок 1 · Экзамен" : `Глава ${chNum} · Проверка`;
    document.getElementById("r-title").textContent = o.gate ? "Урок пройден" : "Глава закрыта";
    document.getElementById("r-sub").textContent = o.gate ? "Первая неделя в Дублине" : `Глава ${chNum} · ${ch.scene}`;
    document.getElementById("skills").innerHTML = skillsHTML(o.skills);
    const seven = document.getElementById("seven");
    seven.style.display = o.gate ? "" : "none";
    seven.innerHTML = o.gate ? ["ᚠ", "ᚢ", "ᚦ", "ᚨ", "ᚱ", "ᚲ", "ᛝ"].map((g, i) => `<span style="--i:${i}">${g}</span>`).join("") : "";
    document.querySelector("#rune-row span:first-child").textContent = o.gate ? "Руны за урок" : "Руны за главу";
    document.querySelector("#rune-row .v").innerHTML = `<span class="g">ᚠ</span>+${o.runes}`;
    const next = document.getElementById("next");
    if (o.gate) {
      next.setAttribute("data-ch", "1");
      document.getElementById("next-gem").textContent = "2";
      document.getElementById("next-k").textContent = "Открылся урок 2";
      document.getElementById("next-t").textContent = LESSONS[1].arc;
      document.getElementById("next-s").textContent = LESSONS[1].system;
      document.getElementById("cta-label").textContent = "К атласу";
    } else {
      const nx = CHAPTERS[chNum];
      next.setAttribute("data-ch", String(chNum + 1));
      document.getElementById("next-gem").textContent = "1";
      document.getElementById("next-k").textContent = `Открылась глава ${chNum + 1}`;
      document.getElementById("next-t").textContent = nx.title;
      document.getElementById("next-s").textContent = nx.scene;
      document.getElementById("cta-label").textContent = `К главе ${chNum + 1}`;
    }
    document.getElementById("secondary").textContent = o.skills.some((s) => !s.ok) ? "Разбор ошибок" : "На карту";
    phone.classList.remove("is-on"); void phone.offsetWidth; phone.classList.add("is-on");
    const key = document.getElementById("cta"); key.classList.remove("sweep"); void key.offsetWidth; key.classList.add("sweep");
    later(() => flyRunes(o.gate ? 9 : 7, o.runes), 1850);
  }

  const ALL = [
    { ok: true, t: "Сказать, какой человек рядом" },
    { ok: true, t: "Успокоить: you are not alone" },
    { ok: true, t: "Различать am и are на слух" },
    { ok: true, t: "Комплимент коллеге вслух" },
  ];
  const MIXED = [
    { ok: true, t: "Сказать, какой человек рядом" },
    { ok: true, t: "Успокоить: you are not alone" },
    { ok: false, t: "Различать am и are на слух" },
    { ok: false, t: "Комплимент коллеге вслух" },
  ];
  const EXAM = [
    { ok: true, t: "Рассказать о себе и о неделе" },
    { ok: true, t: "Описать людей, погоду и квартиру" },
    { ok: true, t: "Говорить быстро: I'm, you're, isn't" },
    { ok: false, t: "Отрицание с we и they" },
  ];

  const states = [
    { id: "all", group: "Итог главы", label: "Всё закрепилось", note: "<b>Печать ставится с ударом (единственное место с весом):</b> золотое лицо падает 1.6 → .94 → 1 (560 мс), вспышка, два кольца удара расходятся, печать осаживается на 3 px. Затем «Что вы теперь умеете» входит по строке (130 мс), 7 рун летят в кошелёк, и карточка следующей главы показывает её свет (роза) ещё до карты.", apply() { setup({ ch: 2, runes: 40, skills: ALL }); } },
    { id: "mixed", group: "Итог главы", label: "Есть что повторить", note: "<b>Слабый результат не блокирует.</b> Глава всё равно закрыта (правило владельца: следующий урок открывается прохождением, а не оценкой). Слабые умения помечены «Стоит повторить» тёплым цветом, не красным; вторичная кнопка ведёт в разбор.", apply() { setup({ ch: 2, runes: 25, skills: MIXED }); } },
    { id: "ch6", group: "Итог главы", label: "Глава 6 → 7", note: "<b>Другая температура.</b> Тот же экран для главы 6 (паб, фиолет): открылась глава 7 в золоте заката. Показывает, что свет следующей главы — часть сцены результата.", apply() { setup({ ch: 6, runes: 40, skills: ALL }); } },
    { id: "exam", group: "Итог урока", label: "Экзамен сдан", note: "<b>Урок пройден.</b> Врата золотятся с тем же ударом, семь печатей урока встают в ряд (90 мс), «Руны за урок» +120 девятью символами, и открывается следующая карта атласа: «Знакомство с городом». Клавиша «К атласу» уводит к колоде, где вторая карта распечатывается (макет 02).", apply() { setup({ ch: 7, runes: 120, skills: EXAM, gate: true }); } },
  ];

  window.Showcase.init({
    kicker: "Learning V2 · Атлас · макет 07",
    title: "Результат проверки и печать главы",
    lead: "Печать ставится с весом, умения вместо оценки, руны каскадом, следующая глава показывает свой свет заранее. Слабое место — приглашение повторить, не приговор.",
    nav: [{ href: "https://claude.ai/code/artifact/8a2168ce-3053-4293-97df-4956d0482718", label: "← Индекс" }, { href: "https://claude.ai/code/artifact/abf78e96-713d-4274-b3de-8d2bd2aaf05b", label: "06 Финал" }, { href: "https://claude.ai/code/artifact/ecf68378-bc39-4bea-8e63-4e105f775f7c", label: "08 Состояния →" }],
    states,
    notes: `<b>Тексты</b> — боевые строки <code>learning_v2_checkpoint_copy</code>: «Что вы теперь умеете», «Закрепилось», «Стоит повторить», «Глава закрыта». <b>Награда</b> начислена локально и сверена с фактом перед показом (фундамент «поздравляем фактом»); показ не durable: пропущенная анимация ничего не стоит.`,
  });
})();
</script>
