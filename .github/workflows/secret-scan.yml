name: Secret Scan

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan past commits, not just the diff.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fast, dependency-free pre-check (same engine as the local pre-commit hook).
      - name: Lightweight secret pre-check
        run: node scripts/scan_secrets.mjs

      # Authoritative scan (includes full git history and the default ruleset).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # One-time, read-only production diagnostic. It runs only for the explicitly
  # marked default-branch commit and prints sanitized account identifiers.
  vitalii-account-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[diag-vitalii]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: phraseman-ea0b3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover Firebase Admin service account
        env:
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, sys
          from pathlib import Path

          try:
              secrets = json.loads(os.environ.get('REPO_SECRETS_JSON', '{}'))
          except Exception:
              secrets = {}

          credential = Path(os.environ['RUNNER_TEMP']) / 'firebase-admin-vitalii.json'
          for key, value in secrets.items():
              if not value:
                  continue
              candidates = [str(value)]
              try:
                  candidates.append(base64.b64decode(''.join(str(value).split()), validate=True).decode('utf-8'))
              except Exception:
                  pass
              for candidate in candidates:
                  try:
                      data = json.loads(candidate)
                  except Exception:
                      continue
                  if not isinstance(data, dict):
                      continue
                  if data.get('type') == 'service_account' and data.get('project_id') == 'phraseman-ea0b3':
                      credential.write_text(candidate, encoding='utf-8')
                      with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                          env.write(f'GOOGLE_APPLICATION_CREDENTIALS={credential}\n')
                      print(f'Using Firebase Admin credential from secret {key}; value is masked and never printed.')
                      sys.exit(0)

          print('No phraseman-ea0b3 service-account JSON was found in repository secrets.', file=sys.stderr)
          sys.exit(31)
          PY

      - name: Run sanitized read-only account diagnostic
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/vitalii-node"
          mkdir -p "$runtime"
          cd "$runtime"
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$runtime/node_modules" node scripts/_recovery/diag_vitalii_readonly.js
