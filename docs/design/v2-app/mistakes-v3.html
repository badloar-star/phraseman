<script>
(() => {
const { icon, phone, col, block, sheet } = K;
const cta = (t, x = '') => `<div class="ac-cta t"${x}>${t}</div>`;
const ctaF = (t) => cta(t, ' style="flex:1;width:auto"');
const ctaOff = `<div class="ac-cta" style="opacity:.4;box-shadow:none">Проверить</div>`;
const bot = (i) => `<div class="bot2">${i}</div>`;
const back = (right = '') => `<div class="topbar"><span class="rb t">${icon('back', 's20')}</span><div class="flex">${right}</div></div>`;
const barX = (r = '') => `<div class="flex" style="gap:14px;margin-top:6px"><span class="rb t">${icon('close', 's20')}</span><div class="grow">${r}</div></div>`;
const ring = (p) => { const r = 100, c = 2 * Math.PI * r; return `<svg viewBox="0 0 236 236"><circle cx="118" cy="118" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="16"/><circle cx="118" cy="118" r="${r}" fill="none" stroke="var(--acc)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 118 118)"/></svg>`; };
const mini = (n, of = 4) => `<div class="mini">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`;

const stp = (done, of = 4) => `<div class="stp">${Array.from({ length: of }, (_, i) => `${i ? `<b class="${i < done ? 'on' : ''}"></b>` : ''}<i class="${i < done ? 'on' : ''}">${i < done ? icon('check', 's16') : i + 1}</i>`).join('')}</div>`;

const stpR = (d, of) => `<div style="margin-left:auto;width:${of === 3 ? 136 : 184}px">${stp(d, of)}</div>`;
// зачем: тост стоит над нижней кнопкой, а не на заголовке — «ничего не налезает» (OWNER_FEEDBACK)
const toast = (t, b, bottom = 108, ic = 'check') => `<div class="toastx" style="top:auto;bottom:${bottom}px">${icon(ic, 's24')}<span>${t}</span>${b ? `<b class="t">${b}</b>` : ''}</div>`;
const diff = (mine, right, lab1 = 'Твой ответ', vol) => `<div class="panel"><div class="pr"><span class="lab">${lab1}</span><span class="df">${mine}</span></div><div class="pr"><span class="lab">Правильно</span><span class="df grow">${right}</span>${vol ? `<span style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex:none">${icon('vol', 's18')}</span>` : ''}</div></div>`;
const X = (w) => `<span class="x">${w}</span>`, Y = (w) => `<span class="y">${w}</span>`;
const WHY = 'Про него и про неё действие получает <b>-s</b>: I work, she work<b>s</b>.';
const MINE = `She ${X('work')} at home`, RIGHT = `She ${Y('works')} at home`;
const big = (t, s) => `<div style="font-size:60px;line-height:62px;font-weight:800;letter-spacing:-1.5px">${t}</div><div class="sec2" style="font-size:15px;margin-top:2px">${s}</div>`;

// ---------- конструкторы заданий ----------
const Q = (k, v, tag, cls = 'm') => `<div class="q">${tag ? `<span class="newtag">${tag}</span><div class="k" style="margin-top:16px">${k}</div>` : `<div class="k">${k}</div>`}${v ? `<div class="v ${cls}">${v}</div>` : ''}</div>`;
const toks = (arr, used = []) => `<div class="toks" style="margin-bottom:16px">${arr.map((w) => `<span class="tok ${used.includes(w) ? 'used' : 't'}">${w}</span>`).join('')}</div>`;

const pGrid = (n, k, v, opts, tag, cls, of) => phone(`${runTop(n, of)}${Q(k, v, tag, cls)}`, { fixed: `<div class="tray">${trayG(opts)}</div>` });
const pType = (n, k, ru, typed, tag) => phone(`${runTop(n)}${Q(k, ru, tag)}<div class="fld" style="margin-top:26px">${typed}<span style="width:2px;height:26px;background:var(--acc);margin-left:1px"></span></div>`, { fixed: `<div class="tray">${cta('Проверить')}</div>` });
const pFind = (n, ru, words, sel, tag) => phone(`${runTop(n)}${Q('Найди слово с ошибкой', ru, tag)}<div class="toks" style="justify-content:center;margin-top:34px">${words.map((w, i) => `<span class="tok lg t${i === sel ? ' sel' : ''}">${w}</span>`).join('')}</div>`, { fixed: `<div class="tray">${cta('Проверить')}</div>` });

const pPairs = (n) => phone(`${runTop(n)}${Q('Соедини пары')}<div class="pairs"><div class="ok">Grandchildren</div><div class="ok">Внуки</div><div class="sel t">Although</div><div class="t">Готов</div><div class="t">Ready</div><div class="t">Через</div><div class="t">Through</div><div class="t">Хотя</div></div>`);
