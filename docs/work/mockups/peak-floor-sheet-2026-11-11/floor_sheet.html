<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пик — четыре варианта экрана</title>
<style>
:root{color-scheme:dark;--chip:#1c1c21;--chipOn:#f4f4f6;--mut:#8d8e97;--ink:#0b0b0d}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:#fff;font-family:-apple-system,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1120px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:21px;line-height:26px;margin:0 0 10px;letter-spacing:-.3px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:6px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lbl{color:var(--mut);font-size:13px;font-weight:700;margin:0 4px 0 8px}.lbl:first-child{margin-left:0}
.chp{padding:8px 13px;border-radius:999px;background:var(--chip);color:#fff;font-weight:700;font-size:13px;line-height:16px;font-family:inherit;border:0;cursor:pointer;transition:transform 140ms ease-out,background 140ms ease-out}
.chp:active{transform:scale(.96)}.chp.on{background:var(--chipOn);color:var(--ink)}
.stage{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:16px;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.cap{color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.2px}
.ph{position:relative;width:430px;max-width:100%;aspect-ratio:411.43/914.3;border-radius:34px;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ph.small{width:262px;border-radius:22px}
.ph img.fr{position:absolute;inset:0;width:100%;height:100%;display:block}
.dp{position:absolute;left:0;top:0;width:411.43px;height:914.3px;transform-origin:0 0;font-family:inherit}
.dp *{box-sizing:border-box}
.dp .a{position:absolute}
.note{color:var(--mut);font-size:14px;line-height:20px;margin:16px auto 0;text-align:center;max-width:620px;text-wrap:balance}
.note b{color:#fff}
/* ─── элементы экрана (dp) ─── */
.hit{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.hit:active{opacity:.85}
.title{font-size:32px;line-height:38px;font-weight:800;letter-spacing:-.6px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;font-size:16px;font-weight:600;white-space:nowrap}
.pill .dot{width:4px;height:4px;border-radius:2px;opacity:.6}
.hero{display:flex;flex-direction:column;gap:2px}
.hero .n{display:flex;align-items:center;gap:8px;font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.hero .p{font-size:17px;line-height:22px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px 0 16px;border-radius:24px;font-size:16px;font-weight:700;white-space:nowrap;cursor:pointer;border:0;transition:transform 120ms ease-out}
.btn:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:10px;border-radius:14px;padding:0 8px;height:50px}
.row .nm{flex:1;min-width:0;font-size:16px;line-height:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font-size:16px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.two{height:50px;gap:8px}.row.two .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row.two .nm{font-size:16px;line-height:19px}.row.two .sc{font-size:16px;line-height:19px}
.av{border-radius:50%;flex:none;display:inline-flex;position:relative}
.av img{width:100%;height:100%;border-radius:50%;display:block}
.av.ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--ring)}
.badge{position:absolute;left:-6px;top:-6px;width:20px;height:20px;border-radius:10px;font-size:15px;line-height:20px;font-weight:800;text-align:center;color:#fff;background:#34C759}
.zline{position:absolute;width:3px;border-radius:2px}
.tw{position:absolute;display:block;pointer-events:none}
.mist{position:absolute;border-radius:50%;pointer-events:none}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.pin{position:absolute;width:30px;height:30px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2.5px var(--ring),0 6px 16px rgba(0,0,0,.4)}
.pin img{width:100%;height:100%;border-radius:50%;display:block}
.pin::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--ring);opacity:.55;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.6}70%{transform:scale(1.25);opacity:0}100%{transform:scale(1.25);opacity:0}}
.bub{position:absolute;display:flex;align-items:center;gap:8px;height:36px}
.bub .sc{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bub .pin{position:relative;flex:none;pointer-events:auto}
.col5{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.col5 .sc{font-size:16px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums}
.col5 .nm{font-size:15px;line-height:18px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:1px;background:#fff;opacity:.5}
/* шторка и список */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade 200ms ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;padding:10px 16px 34px;animation:up 260ms cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.handle{width:40px;height:4px;border-radius:2px;margin:0 auto 14px;opacity:.35}
.sh-top{display:flex;align-items:center;gap:10px;height:44px}
.sh-top b{flex:1;font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.4px}
.rnd{width:44px;height:44px;border-radius:22px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.steps{display:flex;gap:8px;margin:14px 0}
.stp{flex:1;height:44px;border-radius:22px;border:0;font-weight:700;font-size:16px;line-height:44px;font-family:inherit;cursor:pointer;transition:transform 120ms ease-out}
.stp:active{transform:scale(.95)}
.rec{border-radius:20px;padding:16px 16px 16px;display:flex;align-items:center;gap:14px;min-height:88px}
.rec .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rec .who b{font-size:17px;line-height:22px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .who span{font-size:15px;line-height:19px;font-weight:600}
.rec .t{font-size:32px;line-height:36px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;font-size:15px;font-weight:700;margin-top:12px}
.full{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade 180ms ease-out}
.full .hd{display:flex;align-items:center;gap:12px;padding:40px 16px 8px;flex:none}
.full .hd b{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.4px}
.list{flex:1;overflow-y:auto;scrollbar-width:none;padding:6px 12px 24px}.list::-webkit-scrollbar{display:none}
.lrow{display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 14px;border-radius:16px;position:relative}
.lrow .pl{width:26px;font-size:16px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.lrow .nm{flex:1;min-width:0;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sc{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.lrow .zb{position:absolute;left:2px;top:6px;bottom:6px;width:3px;border-radius:2px}
.zsep{height:12px;position:relative}.zsep::after{content:"";position:absolute;left:14px;right:14px;top:5px;height:2px;border-radius:1px;background:var(--sep)}
@media (prefers-reduced-motion:reduce){.pin::before{animation:none;opacity:.35}.scrim,.sheet,.full{animation:none}.chp,.btn,.stp{transition:none}}
</style>

<script>
/* ─── модель комнаты (как в правилах Ядра 04.11): неделя по монетам; топ-5 по монетам + все, кто на вершине (15 этаж, 5 ступень); последние 5 вниз ─── */
(() => {
  const NAMES = ['Лидия', 'Ирина', 'Natalia', 'Олег', 'Мария', 'Денис', 'Алина', 'Pavel', 'Софья', 'Тимур', 'Eva', 'Артём', 'Вера', 'Максим', 'Юлия', 'Игорь', 'Нина', 'Роман', 'Ольга', 'Kirill', 'Анна', 'Глеб', 'Полина', 'Егор', 'Ксения', 'Сергей', 'Дарья', 'Илья', 'Яна', 'Лев'];
  const COINS = [1840, 1612, 1490, 1388, 1275, 1190, 1104, 980, 902, 861, 790, 744, 702, 655, 610, 566, 520, 488, 451, 402, 366, 330, 295, 250, 214, 180, 120, 76, 33, 0];
  const TOP_FLOORS = [13, 11, 10, 8, 6]; // где на башне стоят лидеры по монетам (для варианта «Карта» — без наложений)
  const SUMMIT = { floor: 15, step: 5 };
  const room = ({ me = 12, coins = null, summit = false, myFloor = 7, myStep = 3, extraSummit = [] } = {}) => {
    const m = NAMES.map((name, i) => ({ uid: 'u' + i, name, weekCoins: COINS[i], coinRank: 3 + ((i * 7) % 16), floor: i < 5 ? TOP_FLOORS[i] : 1 + ((i * 5) % 13), step: 1 + (i % 5), me: false }));
    [7, 10, 14, 17, 20, 25].forEach((k) => { if (m[k]) m[k].floor = 7; }); const mine = m[me - 1]; mine.me = true; mine.name = 'Ты'; mine.coinRank = 7; mine.floor = myFloor; mine.step = myStep; if (coins != null) mine.weekCoins = coins;
    if (summit) { mine.floor = SUMMIT.floor; mine.step = SUMMIT.step; }
    extraSummit.forEach((i) => { m[i - 1].floor = SUMMIT.floor; m[i - 1].step = SUMMIT.step; });
    const ranked = m.slice().sort((a, b) => b.weekCoins - a.weekCoins);

  };

  window.PeakModel = { SUMMIT, room, record, fmtMs, group };
})();

      + `<div class="sh-top"><b>Этаж ${f}</b></div>`
      + `<div class="steps">${chips}</div>${body}`
      + `<div style="display:flex;align-items:baseline;gap:8px;margin-top:22px"><b style="font-size:19px;line-height:24px;font-weight:800">Сейчас на этаже</b><span style="font-size:17px;font-weight:700;color:${t.secondary}">${here.length}</span></div>${occ}</div>`;
  };
  /* ─── «Все участники»: монеты вместо ступеней; зоны — цветная полоса слева и стрелка, без слов ─── */
  const allScreen = (t, ranked) => {
    let prev = ''; const rows = ranked.map((r) => {
      const z = r.byTop5 ? 'up' : r.down ? 'down' : 'stay'; const sep = prev && z !== prev ? `<div class="zsep" style="--sep:${z === 'down' ? hexA(RED, .4) : hexA(t.text, .12)}"></div>` : ''; prev = z;
      const bar = r.up ? `<span class="zb" style="background:${GREEN}"></span>` : r.down ? `<span class="zb" style="background:${RED}"></span>` : '';
      const arrow = r.up ? I.up(GREEN) : r.down ? I.down(RED) : '<span style="width:20px"></span>';
      return sep + `<div class="lrow" style="${r.me ? 'background:' + hexA(t.accent, .18) : ''}">${bar}<span class="pl" style="color:${t.secondary}">${r.place}</span>${av(r, 36, r.bySummit && !r.byTop5)}<span class="nm" style="color:${t.text}">${esc(r.name)}</span><span class="sc" style="color:${r.weekCoins === 0 ? t.mutedText : t.accent}">${M.group(r.weekCoins)}</span>${arrow}</div>`;
    }).join('');
    return `<div class="full" style="background:${t.bg};color:${t.text};--ring:${t.accent}"><div class="hd"><button class="rnd" data-act="back" aria-label="Назад" style="background:${t.opaqueControl};color:${t.text}">${I.left}</button><b>Все участники</b></div><div class="list">${rows}</div></div>`;
  };
  /* ─── сборка телефона ─── */
  const phone = (v, small) => {
    const t = T[THEME][AP]; const s = scene(t, AP); const ranked = M.room(STATES[STATE][1]); const me = ranked.find((r) => r.me);
    const inner = stars(STARS) + VARIANTS[v](s, ranked, me) + (ALL ? allScreen(t, ranked) : '') + (SHEET ? sheet(t, ranked) : '');
    return `<div class="col"><span class="cap">${VARS[v]}</span><div class="ph${small ? ' small' : ''}" data-var="${v}"><img class="fr" alt="" src="${A.bg[THEME + '_' + AP]}"><div class="dp" style="--ring:${s.ring}">${inner}</div></div></div>`;
  };
  const ctl = (id, items, cur, key) => { document.getElementById(id).innerHTML = items.map(([k, n]) => `<button class="chp${cur === k ? ' on' : ''}" data-${key}="${k}">${n}</button>`).join(''); };
  const fit = () => { document.querySelectorAll('.ph').forEach((ph) => { const k = ph.clientWidth / W; ph.querySelector('.dp').style.transform = `scale(${k})`; }); };
  const render = () => {
    window.__peakDone = false;
    ctl('cVar', Object.keys(VARS).map((k) => [k, VARS[k]]), VAR, 'var'); ctl('cView', [['one', 'Один'], ['all', 'Все четыре рядом']], VIEW, 'view');
    ctl('cTheme', [['graphite', 'Затмение'], ['ink', 'Сумерки']], THEME, 'pktheme'); ctl('cAp', [['dark', 'Тёмная'], ['light', 'Светлая']], AP, 'ap'); ctl('cState', Object.keys(STATES).map((k) => [k, STATES[k][0]]), STATE, 'state');
    const stage = document.getElementById('stage');
    stage.innerHTML = VIEW === 'one' ? phone(VAR, false) : Object.keys(VARS).map((v) => phone(v, true)).join('');
    document.getElementById('note').innerHTML = VIEW === 'one' ? NOTES[VAR] + ' Тап по этажу башни — рекорд ступени; «Все участники» — полный список с монетами.' : 'Четыре структуры рядом. Тап по любому телефону переключает его в одиночный показ.';
    fit(); window.__peakDone = true;
    console.log(LOG, 'render', JSON.stringify({ v: VAR, theme: THEME, ap: AP, state: STATE, view: VIEW, sheet: SHEET, all: ALL })); // guard-ok: журнал макета
  };
  document.body.addEventListener('click', (e) => {
    const c = (a) => { const el = e.target.closest('[data-' + a + ']'); return el ? el.dataset[a] : null; };
    const v = c('var'); if (v && e.target.closest('.chp')) { VAR = v; SHEET = null; ALL = false; render(); return; }
    const vw = c('view'); if (vw) { VIEW = vw; SHEET = null; ALL = false; render(); return; }
    const th = c('pktheme'); if (th) { THEME = th; render(); return; } const ap = c('ap'); if (ap) { AP = ap; render(); return; } const st = c('state'); if (st) { STATE = st; SHEET = null; render(); return; }
    const act = c('act');
    if (!act) { if (VIEW === 'all' && e.target.closest('.ph')) { VAR = e.target.closest('.ph').dataset.var; VIEW = 'one'; render(); } return; }
    if (VIEW === 'all' && e.target.closest('.ph')) VAR = e.target.closest('.ph').dataset.var;
    if (act === 'all') ALL = true; else if (act === 'back') ALL = false;
    else if (act === 'floor') SHEET = { floor: Number(e.target.closest('[data-floor]').dataset.floor), step: 1 };
    else if (act === 'close') SHEET = null; else if (act === 'step') SHEET = { ...SHEET, step: Number(e.target.closest('[data-step]').dataset.step) };
    else if (act === 'prevf') SHEET = { floor: Math.max(1, SHEET.floor - 1), step: 1 }; else if (act === 'nextf') SHEET = { floor: Math.min(15, SHEET.floor + 1), step: 1 };
    if (VIEW === 'all' && (ALL || SHEET)) VIEW = 'one';
    render();
  });
  window.addEventListener('resize', fit);
  render();
  window.__peak = { render, set: (o) => { if (o.v) VAR = o.v; if (o.theme) THEME = o.theme; if (o.ap) AP = o.ap; if (o.state) STATE = o.state; if (o.view) VIEW = o.view; if ('sheet' in o) SHEET = o.sheet; if ('all' in o) ALL = o.all; render(); }, get: () => ({ VAR, THEME, AP, STATE, VIEW, SHEET, ALL }) };
})();
</script>
</body></html>
