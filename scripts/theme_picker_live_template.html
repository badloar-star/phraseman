<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор темы — экраны приложения</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0b0b0d; color: #f2f2f4; min-height: 100vh; }
  body.light { background: #e9e9ee; color: #16171a; }
  /* ── панель управления: контейнеры без обводок, тон и тень ── */
  #ctl { position: sticky; top: 0; z-index: 50; padding: 14px 18px 12px; background: rgba(20,20,23,.94); backdrop-filter: blur(14px); box-shadow: 0 10px 30px -12px rgba(0,0,0,.7); }
  body.light #ctl { background: rgba(244,244,248,.95); box-shadow: 0 10px 30px -14px rgba(40,40,80,.35); }
  #themes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tb { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px; border: 0; border-radius: 17px; background: #2a2a2f; color: inherit; font: 600 13px/1 inherit; cursor: pointer; }
  body.light .tb { background: #dcdce4; }
  .tb i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .tb.on { background: #f2f2f4; color: #0b0b0d; box-shadow: 0 6px 14px -6px rgba(0,0,0,.6); }
  body.light .tb.on { background: #16171a; color: #fff; }
  #row2 { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  #row2 label { font: 600 13px/1 inherit; opacity: .8; }
  #sl { width: 260px; accent-color: #9aa0ff; }
  #sv { font: 700 15px/1 inherit; min-width: 40px; }
  .seg { display: inline-flex; background: #2a2a2f; border-radius: 17px; padding: 3px; }
  body.light .seg { background: #dcdce4; }
  .seg button { border: 0; background: transparent; color: inherit; height: 28px; padding: 0 14px; border-radius: 14px; font: 600 13px/1 inherit; cursor: pointer; }
  .seg button.on { background: #f2f2f4; color: #0b0b0d; }
  body.light .seg button.on { background: #16171a; color: #fff; }
  #sel { margin-top: 12px; font: 700 15px/1.3 inherit; }
  #sel small { font-weight: 500; opacity: .6; margin-left: 8px; }
  /* ── экраны ── */
  #scr { display: flex; gap: 28px; padding: 26px 22px 60px; overflow-x: auto; align-items: flex-start; }
  .col { flex: none; }
  .cap { font: 700 13px/1 inherit; opacity: .65; margin: 0 0 10px 6px; }
  .phone { width: 360px; height: 780px; border-radius: 38px; overflow: hidden; position: relative; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; box-shadow: 0 30px 60px -28px rgba(0,0,0,.7); }
  .bd { position: absolute; inset: 0; pointer-events: none; }
  .scroll { position: absolute; inset: 0; overflow: hidden; padding: 0 16px; }
  .sb { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; font: 600 13px/1 inherit; }
  .sb svg { width: 15px; height: 15px; fill: currentColor; }
  .plate { background: linear-gradient(180deg, var(--plateFrom), var(--plateTo)); box-shadow: 0 16px 28px -14px var(--plateShadow); }
  .raised { background: linear-gradient(180deg, var(--raisedFrom), var(--raisedTo)); box-shadow: 0 26px 40px -14px var(--raisedShadow); }
  .ctl { background: var(--control); }
  .sec { color: var(--secondary); }
  .mut { color: var(--muted); }
  .ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .coin { width: 22px; height: 22px; border-radius: 50%; flex: none; background: center/cover no-repeat; }
  .pill { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 16px; }
  .pill b { display: block; font-size: 14px; line-height: 16px; }
  .pill span { display: block; font-size: 13px; line-height: 16px; color: var(--secondary); }
  .rb { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .art { position: relative; flex: none; }
  .art img, .art .tint { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .art .tint { background: var(--accentBright); -webkit-mask: var(--mask) center/contain no-repeat; mask: var(--mask) center/contain no-repeat; }
  .tabs { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; }
  .tabs .t { width: 54px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: var(--secondary); }
  .tabs .t.on { color: var(--text); }
  .home-ind { position: absolute; left: 50%; bottom: 8px; width: 120px; height: 4px; margin-left: -60px; border-radius: 2px; background: var(--text); opacity: .85; }
  .row { display: flex; align-items: center; }
  h1 { font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -.5px; }
  .lrow { height: 64px; border-radius: 20px; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 14px; margin-bottom: 10px; }
  .lrow .n { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .lrow .tt { font-size: 15px; font-weight: 700; line-height: 20px; }
  .lrow .ss { font-size: 12px; line-height: 16px; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
  .lrow.lock .tt { color: var(--secondary); }
  .cta { height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 700; font-size: 16px; background: var(--cta); color: var(--ctaInk); box-shadow: 0 14px 24px -10px var(--ctaShadow); }
</style>
</head>

function applyVars(el, g) {
  const v = {
    bg: g.bg, bgTop: g.bgTop, text: g.text, secondary: g.secondary, muted: g.mutedText, accent: g.accent, accentBright: g.accentBright, accentInk: g.accentInk,

    raisedShadow: g.raisedShadow, control: g.opaqueControl, dividerTone: g.dividerTone, good: g.good, bad: g.bad, trackOff: g.trackOff, progA: g.progressGradient[0], progB: g.progressGradient[1],

}
function backdrop(g) {
  const glow = (g.bgGlow || []).some((c) => alphaOf(c) > 0) ? g.bgGlow : null;
  const spots = [[78, 36, 6, 2, 72], [62, 32, 108, 56, 74], [80, 28, 26, 108, 76]];
  const layers = glow ? spots.map((s, i) => 'radial-gradient(ellipse ' + s[0] + '% ' + s[1] + '% at ' + s[2] + '% ' + s[3] + '%, ' + rgba(glow[i]) + ' 0%, ' + rgba(glow[i], 0) + ' ' + s[4] + '%)').join(',') + ',' : '';
  return '<div class="bd" style="background:' + layers + 'linear-gradient(180deg,' + hex6(g.bgTop) + ' 0%,' + hex6(g.bg) + ' 60%)"></div>';
}
function render() {
  const g = tokens();
  document.body.classList.toggle('light', g.isLight);
  const wrap = document.getElementById('scr');
  wrap.innerHTML = SCREENS.map((s) => '<div class="col"><div class="cap">' + s.name + '</div><div class="phone" data-k="' + s.k + '">' + backdrop(g) + s.html() + '</div></div>').join('');
  wrap.querySelectorAll('.phone').forEach((p) => applyVars(p, g));
  document.getElementById('sv').textContent = fmt(S.v);
  document.getElementById('sel').innerHTML = 'Выбрано: ' + THEME_NAMES[S.id] + ' · ' + fmt(S.v) + ' · ' + (S.light ? 'светлая' : 'тёмная') + '<small>' + S.id + '</small>';
  document.querySelectorAll('.tb').forEach((b) => b.classList.toggle('on', b.dataset.id === S.id));
  document.querySelectorAll('#app button').forEach((b) => b.classList.toggle('on', (b.dataset.a === 'light') === S.light));
}
function init() {
  const box = document.getElementById('themes');
  box.innerHTML = IDS.map((id) => { const t = LG.liquidGlassTokens(id, { level: 'calm', appearance: 'dark', intensity: 1 }); return '<button class="tb" data-id="' + id + '"><i style="background:' + hex6(t.accent) + '"></i>' + (THEME_NAMES[id] || id) + '</button>'; }).join('');
  box.addEventListener('click', (e) => { const b = e.target.closest('.tb'); if (b) { S.id = b.dataset.id; render(); } });
  const sl = document.getElementById('sl'); sl.value = S.v;
  sl.addEventListener('input', () => { S.v = parseFloat(sl.value); render(); });
  document.getElementById('app').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { S.light = b.dataset.a === 'light'; render(); } });
  render();
}
init();
</script>
</body>
