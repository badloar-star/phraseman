appId: app.phraseman
---
- runFlow: ../../_shared/boot_to_home.yaml
- tapOn:
    id: "home-stats-card"
- extendedWaitUntil:
    visible:
      id: "screen-streak-stats"
    timeout: 30000
- assertVisible:
    id: "stats-learning-health-card"
- assertVisible:
    id: "stats-rhythm-week-card"
- assertVisible:
    id: "stats-today-action"
- assertVisible:
    id: "stats-bonus-collapsed"
- takeScreenshot: stats_overview_top
- tapOn:
    id: "stats-bonus-collapsed"
- assertVisible:
    id: "stats-bonus-expanded"
- scrollUntilVisible:
    element:
      id: "stats-activity-365"
    direction: DOWN
    timeout: 30000
    speed: 70
    visibilityPercentage: 35
- assertVisible:
    id: "stats-activity-365"
- takeScreenshot: stats_activity_365
- scrollUntilVisible:
    element:
      id: "stats-details-toggle"
    direction: DOWN
    timeout: 30000
    speed: 70
    visibilityPercentage: 45
- tapOn:
    id: "stats-details-toggle"
- assertVisible:
    id: "stats-details-expanded"
- takeScreenshot: stats_details_expanded
