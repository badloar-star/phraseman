appId: app.phraseman
clearState: false
---
- runFlow: codex_today_2026_05_21_seed_no_limits.yaml

# Lesson words typo regression: past-tense words must keep final "d".
- openLink: "phraseman://lesson_words?id=11&tab=list&qaFocusWords=charged,mailed,packed,turned"
- extendedWaitUntil:
    visible:
      id: "lesson-words-tab-list"
    timeout: 30000
- assertVisible:
    id: "lesson-word-text-charged"
- assertVisible:
    id: "lesson-word-text-mailed"
- assertVisible:
    id: "lesson-word-text-packed"
- assertVisible:
    id: "lesson-word-text-turned"
- assertVisible:
    id: "lesson-word-section-verbs"
- takeScreenshot: codex_today_words_past_d
- takeScreenshot: codex_today_words_no_section_overlap

# Lesson 9 intro copy/color contract: no old "Не так для..." wording.
- openLink: "phraseman://lesson1?id=9&from=maestro&replayIntro=1&replayIntroAt=20260521"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: codex_today_lesson9_intro_copy

# Flashcards audio report control must stay in the header, away from playback buttons.
- openLink: "phraseman://flashcards_audio"
- extendedWaitUntil:
    visible:
      id: "flashcards-audio-report"
    timeout: 45000
- assertVisible:
    id: "flashcards-audio-refresh"
- takeScreenshot: codex_today_flashcards_audio_report_header

# Stats cards touched today must render.
- openLink: "phraseman://streak_stats"
- extendedWaitUntil:
    visible:
      id: "screen-streak-stats"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "stats-learning-health-card"
    direction: DOWN
    timeout: 30000
    speed: 70
    visibilityPercentage: 35
- assertVisible:
    id: "stats-learning-health-card"
- scrollUntilVisible:
    element:
      id: "stats-rhythm-week-card"
    direction: DOWN
    timeout: 30000
    speed: 70
    visibilityPercentage: 35
- assertVisible:
    id: "stats-rhythm-week-card"
- takeScreenshot: codex_today_stats_balance_top

- openLink: "phraseman://streak_stats?qa365=1"
- extendedWaitUntil:
    visible:
      id: "stats-activity-365"
    timeout: 45000
- assertVisible:
    id: "activity-365-card"
- takeScreenshot: codex_today_stats_activity_365

# League chat must still open; unread badge logic is covered by Jest/source contract.
- openLink: "phraseman://club_screen"
- extendedWaitUntil:
    visible:
      id: "club-tab-chat"
    timeout: 45000
- tapOn:
    id: "club-tab-chat"
- extendedWaitUntil:
    visible:
      id: "league-chat-panel"
    timeout: 45000
- assertVisible:
    id: "league-chat-input"
- takeScreenshot: codex_today_league_chat_panel
