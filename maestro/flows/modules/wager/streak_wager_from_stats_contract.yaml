# Assumes the current screen is Streak Stats. Places tier 0 if no active wager exists.
appId: app.phraseman
---
- runFlow:
    when:
      visible:
        id: "wager-open"
    commands:
      - tapOn:
          id: "wager-open"
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            notVisible:
              id: "wager-modal"
          commands:
            - swipe:
                direction: UP
                duration: 450
            - waitForAnimationToEnd:
                timeout: 800
            - runFlow:
                when:
                  visible:
                    id: "wager-open"
                commands:
                  - tapOn:
                      id: "wager-open"
- extendedWaitUntil:
    visible:
      id: "wager-modal"
    timeout: 15000
- tapOn:
    id: "wager-tier-0"
- tapOn:
    id: "wager-place"
- extendedWaitUntil:
    visible:
      id: "wager-confirm-confirm"
    timeout: 15000
- tapOn:
    id: "wager-confirm-confirm"
- extendedWaitUntil:
    visible:
      id: "wager-active-card"
    timeout: 30000
