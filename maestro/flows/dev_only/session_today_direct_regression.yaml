appId: app.phraseman
clearState: false
---
# Direct regression flow for the fixes checked in this Codex session.
# It uses app deeplinks so onboarding/auth state cannot hide UI regressions.

- openLink: "phraseman:///lesson_words?id=1&tab=list"
- runFlow: ../_shared/accept_ios_open_prompt.yaml
- runFlow:
    when:
      visible: "(Позже|Пізніше|Mas tarde|Más tarde)"
    commands:
      - tapOn: "(Позже|Пізніше|Mas tarde|Más tarde)"
      - waitForAnimationToEnd:
          timeout: 5000
- openLink: "phraseman:///lesson_words?id=1&tab=list"
- runFlow: ../_shared/accept_ios_open_prompt.yaml
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn:
          point: "70%,67%"
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible:
      id: "lesson-words-header-back"
    timeout: 60000
- assertVisible:
    id: "lesson-words-tab-list"
- assertVisible: "Сообщить о баге"

# Training tab shows learned/total counter instead of the old percent strip.
- tapOn:
    id: "lesson-words-tab-train"
- extendedWaitUntil:
    visible:
      id: "lesson-words-option-correct"
    timeout: 60000
- assertVisible:
    id: "lesson-words-progress-counter"
- assertVisible:
    id: "lesson-words-option-correct"
- takeScreenshot: session_today_words_counter

# Settings keeps active VIP themed and does not say Premium can be bought separately.
- openLink: "phraseman:///settings"
- runFlow: ../_shared/accept_ios_open_prompt.yaml
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn:
          point: "70%,67%"
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "settings-vip-card"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 25
- assertVisible:
    id: "settings-vip-subtitle"
- assertVisible: "VIP-доступ активен."
- assertNotVisible: "Premium можно купить отдельно"
- assertVisible: "Сообщить о баге"
- takeScreenshot: session_today_settings_vip
