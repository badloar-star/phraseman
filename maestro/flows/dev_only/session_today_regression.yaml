appId: app.phraseman
---
- runFlow:
    when:
      visible: "Phraseman"
    commands:
      - tapOn: "Phraseman"
      - waitForAnimationToEnd:
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 120000
- runFlow: ../_dismiss_bug_hunt.yaml
- runFlow: ../_precondition.yaml
- runFlow:
    when:
      visible: "(Позже|Пізніше|Mas tarde|Más tarde)"
    commands:
      - tapOn: "(Позже|Пізніше|Mas tarde|Más tarde)"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 60000

# Lessons -> first lesson menu -> vocabulary opens directly to the word list.
- tapOn:
    id: "tab-index"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "lessons-row-1"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 25
- tapOn:
    id: "lessons-row-1"
- extendedWaitUntil:
    visible:
      id: "lesson-menu-back"
    timeout: 30000
- tapOn:
    id: "lesson-menu-words"
- extendedWaitUntil:
    visible:
      id: "lesson-words-header-back"
    timeout: 60000
- assertVisible:
    id: "lesson-words-tab-list"
- assertVisible: "Сообщить о баге"

# Training tab keeps a learned/total counter instead of the old percent bar.
- tapOn:
    id: "lesson-words-tab-train"
- extendedWaitUntil:
    visible:
      id: "lesson-words-option-correct"
    timeout: 60000
- assertVisible:
    id: "lesson-words-progress-counter"
- assertVisible:
    id: "lesson-words-option-correct"

# Settings keeps the VIP card themed and without the old Premium upsell text.
- tapOn:
    id: "lesson-words-header-back"
- extendedWaitUntil:
    visible:
      id: "lesson-menu-back"
    timeout: 30000
- tapOn:
    id: "lesson-menu-back"
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 30000
- tapOn:
    point: "90%,95%"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-vip-card"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 25
- assertVisible:
    id: "settings-vip-subtitle"
- assertVisible: "VIP-доступ активен."
- assertNotVisible: "Premium можно купить отдельно"
- assertVisible: "Сообщить о баге"
