<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phraseman · Ежедневное путешествие</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #0e100c;
      --ink-soft: #141811;
      --panel: #181c15;
      --panel-raised: #242b1f;
      --panel-muted: #2c3327;
      --lime: #c6ff34;
      --lime-soft: #eaffae;
      --on-lime: #07110a;
      --gold: #e3cc88;
      --gold-deep: #6f6035;
      --ivory: #f4f0e6;
      --muted: #aeb6a5;
      --dim: #737c6d;
      --shadow: rgba(5, 7, 4, 0.55);
      --ray-opacity: 0.68;
      --hero-scale: 1.9;
      --impact-opacity: 0.72;
      --phone-width: 390px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 8%, #303829 0, #191d16 34%, #0a0c09 78%),
        var(--ink);
      color: var(--ivory);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
    }

    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--lime);
      outline-offset: 3px;
    }

    .prototype {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      gap: 18px;
      padding: 24px 20px 32px;
    }

    .device {
      width: min(var(--phone-width), 96vw);
      aspect-ratio: 390 / 780;
      max-height: 82vh;
      padding: 10px;
      border-radius: 52px;
      background: #080907;
      box-shadow:
        0 42px 100px rgba(0, 0, 0, 0.58),
        inset 0 1px rgba(255, 255, 255, 0.08),
        inset 0 -1px rgba(255, 255, 255, 0.04);
      position: relative;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 43px;
      background: var(--ink-soft);
    }

    .island {
      position: absolute;
      z-index: 60;
      top: 12px;
      left: 50%;
      width: 112px;
      height: 29px;
      transform: translateX(-50%);
      border-radius: 18px;
      background: #030403;
    }

    .statusbar {
      position: absolute;
      z-index: 50;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 17px 24px 0;
      display: flex;
      justify-content: space-between;
      color: var(--ivory);
      font-size: 14px;
      font-weight: 700;
    }

    .overlay {
      position: absolute;
      z-index: 30;
      inset: 0;
      background: rgba(5, 7, 4, 0.84);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }
    .overlay.is-open { pointer-events: auto; }

    .scene-actions {
      position: absolute;
      z-index: 48;
      top: 51px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .skip-action, .close-action {
      min-height: 44px;
      color: var(--ivory);
      background: rgba(36, 43, 31, 0.9);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    }
    .skip-action { padding: 0 17px; border-radius: 16px; }
    .close-action { width: 44px; border-radius: 50%; font-size: 22px; }
    .skip-action:hover, .close-action:hover { background: var(--lime); color: var(--on-lime); }

    .calendar-modal {
      position: absolute;
      z-index: 36;
      top: 102px;
      left: 12px;
      right: 12px;
      padding: 22px 18px 20px;
      border-radius: 32px;
      background:
        radial-gradient(circle at 85% 0%, rgba(198, 255, 52, 0.11), transparent 32%),
        linear-gradient(160deg, #252c20, #151912 76%);
      box-shadow: 0 28px 62px rgba(0, 0, 0, 0.48), inset 0 1px rgba(255, 255, 255, 0.06);
      transform-origin: 50% 24%;
      will-change: transform, opacity;
    }

    .day-count { margin: 0 0 5px; color: var(--lime); font-size: 15px; font-weight: 700; }
    .chapter-title { margin: 0; font-size: 28px; line-height: 1.08; font-weight: 700; letter-spacing: -0.04em; }

    .chapter-rail {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 20px 0 18px;
    }
    .chapter-chip {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 17px;
      background: #151912;
      color: var(--dim);
      font-size: 18px;
      font-weight: 700;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.035);
    }
    .chapter-chip.is-current {
      background: var(--lime);
      color: var(--on-lime);
      box-shadow: 0 10px 24px rgba(198, 255, 52, 0.18);
    }
    .chapter-chip.is-finale { background: #332f20; color: var(--gold); }

    .rule {
      height: 1px;
      margin-bottom: 18px;
      background: linear-gradient(90deg, transparent, rgba(244, 240, 230, 0.13), transparent);
    }

    .gift-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 11px 8px;
    }

    .gift {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 8px 5px 4px;
      border-radius: 18px;
      background: linear-gradient(145deg, #2c3427, #1b2018);
      color: var(--ivory);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24), inset 0 1px rgba(255, 255, 255, 0.04);
      overflow: visible;
      will-change: transform, opacity;
    }
    .gift img { width: 66%; height: 66%; object-fit: contain; filter: drop-shadow(0 6px 7px rgba(0, 0, 0, 0.42)); }
    .gift-day {
      position: absolute;
      top: 6px;
      left: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }
    .gift-amount {
      position: absolute;
      right: 7px;
      bottom: 5px;
      color: var(--ivory);
      font-size: 14px;
      font-weight: 700;
    }
    .gift.is-received { opacity: 0.36; filter: saturate(0.15); }
    .gift.is-received::after {
      content: "✓";
      position: absolute;
      top: 5px;
      right: 5px;
      width: 21px;
      height: 21px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #66705e;
      color: var(--ivory);
      font-size: 13px;
      font-weight: 700;
    }
    .gift.is-today {
      z-index: 3;
      background: radial-gradient(circle at 50% 28%, var(--lime-soft), var(--lime) 68%, #a8dc24);
      color: var(--on-lime);
      box-shadow: 0 0 0 8px rgba(198, 255, 52, 0.08), 0 0 34px rgba(198, 255, 52, 0.34);
      transform: translateY(-3px);
    }
    .gift.is-today .gift-day, .gift.is-today .gift-amount { color: var(--on-lime); }
    .gift.is-milestone:not(.is-today) {
      background: linear-gradient(145deg, #3b3727, #242319);
      color: var(--gold);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28), inset 0 1px rgba(255, 239, 181, 0.08);
    }
    .gift.is-milestone:not(.is-today) .gift-amount { color: var(--gold); }

    .hero-layer {
      position: absolute;
      z-index: 42;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
    }
    .rays {
      position: absolute;
      top: 39%;
      left: 50%;
      width: 330px;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(from 0deg, rgba(213, 255, 105, 0.78) 0 7deg, transparent 7deg 19deg);
      mask: radial-gradient(circle, transparent 0 24%, #000 42%, rgba(0, 0, 0, 0.76) 60%, transparent 72%);
      opacity: 0;
      will-change: transform, opacity;
    }
    .impact-ring {
      position: absolute;
      top: 39%;
      left: 50%;
      width: 126px;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px rgba(234, 255, 174, 0.78), 0 0 42px rgba(198, 255, 52, 0.32);
      opacity: 0;
      will-change: transform, opacity;
    }
    .impact-ring.ring-two { width: 166px; }
    .impact-ring.ring-three { width: 212px; }

    .hero-gift {
      position: absolute;
      top: 39%;
      left: 50%;
      width: 94px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 25px;
      transform: translate(-50%, -50%) scale(0.72);
      background: radial-gradient(circle at 50% 25%, var(--lime-soft), var(--lime) 70%, #a5d923);
      color: var(--on-lime);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38), 0 0 72px rgba(198, 255, 52, 0.34), inset 0 1px rgba(255, 255, 255, 0.48);
      will-change: transform, opacity;
    }
    .hero-gift img { width: 74%; height: 74%; object-fit: contain; filter: drop-shadow(0 8px 8px rgba(27, 42, 3, 0.26)); }
    .hero-amount {
      position: absolute;
      right: 8px;
      bottom: 6px;
      color: var(--on-lime);
      font-size: 15px;
      font-weight: 700;
    }

    .detail-modal {
      position: absolute;
      z-index: 40;
      left: 18px;
      right: 18px;
      bottom: 42px;
      min-height: 286px;
      padding: 91px 22px 20px;
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 0%, rgba(198, 255, 52, 0.14), transparent 40%),
        linear-gradient(155deg, #293126, #151912 78%);
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.52), inset 0 1px rgba(255, 255, 255, 0.06);
      opacity: 0;
      will-change: transform, opacity;
    }
    .detail-title { margin: 0; color: var(--ivory); font-size: 23px; line-height: 1.14; font-weight: 700; letter-spacing: -0.03em; }
    .detail-copy { margin: 10px 0 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
    .detail-actions { display: grid; gap: 10px; margin-top: 18px; }
    .apply-gift, .later-gift {
      width: 100%;
      min-height: 48px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
    }
    .apply-gift { background: var(--lime); color: var(--on-lime); box-shadow: 0 12px 28px rgba(198, 255, 52, 0.18); }
    .later-gift { background: var(--panel-muted); color: var(--ivory); }
    .apply-gift:hover { background: var(--lime-soft); }
    .later-gift:hover { background: #394232; }

    .playback {
      width: min(650px, 96vw);
      padding: 16px;
      display: grid;
      grid-template-columns: auto auto minmax(120px, 1fr) auto;
      align-items: center;
      gap: 10px;
      border-radius: 22px;
      background: rgba(24, 28, 21, 0.9);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.32), inset 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
    }
    .control-button {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 15px;
      background: var(--panel-raised);
      color: var(--ivory);
      font-size: 14px;
      font-weight: 700;
    }
    .control-button:hover { background: var(--lime); color: var(--on-lime); }
    .scrubber { width: 100%; accent-color: var(--lime); cursor: pointer; }
    .timecode { min-width: 62px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }

    .sound-console {
      width: min(650px, 96vw);
      padding: 14px 16px 16px;
      display: grid;
      gap: 12px;
      border-radius: 22px;
      background: rgba(24, 28, 21, 0.9);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.32), inset 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
    }
    .sound-console-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sound-console-title { margin: 0; color: var(--ivory); font-size: 16px; font-weight: 700; }
    .sound-toggle {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 15px;
      background: var(--lime);
      color: var(--on-lime);
      font-size: 14px;
      font-weight: 700;
    }
    .sound-packs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .sound-packs::-webkit-scrollbar { display: none; }
    .sound-pack {
      flex: 0 0 auto;
      min-width: 88px;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 14px;
      background: var(--panel-raised);
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }
    .sound-pack:hover { color: var(--ivory); }
    .sound-pack.is-selected { background: var(--lime); color: var(--on-lime); }

    .tweaks-launcher {
      position: fixed;
      z-index: 90;
      right: 20px;
      bottom: 20px;
      min-width: 52px;
      min-height: 52px;
      padding: 0 17px;
      border-radius: 18px;
      background: var(--lime);
      color: var(--on-lime);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.42);
    }

    .tweaks {
      position: fixed;
      z-index: 89;
      right: 20px;
      bottom: 82px;
      width: min(310px, calc(100vw - 40px));
      padding: 20px;
      border-radius: 24px;
      background: rgba(24, 28, 21, 0.97);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.58), inset 0 1px rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.97);
      transition: opacity 180ms ease-out, transform 180ms ease-out;
    }
    .tweaks.is-open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .tweaks h2 { margin: 0 0 18px; font-size: 22px; font-weight: 700; }
    .field { display: grid; gap: 8px; margin-top: 16px; }
    .field label, .field output { color: var(--ivory); font-size: 15px; font-weight: 700; }
    .field-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .field select {
      min-height: 44px;
      padding: 0 12px;
      border: 0;
      border-radius: 14px;
      background: var(--panel-muted);
      color: var(--ivory);
      font-size: 15px;
    }
    .toggle { display: flex; align-items: center; gap: 11px; min-height: 44px; color: var(--ivory); font-size: 15px; font-weight: 700; }
    .toggle input { width: 22px; height: 22px; accent-color: var(--lime); }

    [data-intensity="calm"] { --ray-opacity: 0.35; --hero-scale: 1.58; --impact-opacity: 0.38; }
    [data-intensity="cinematic"] { --ray-opacity: 0.68; --hero-scale: 1.9; --impact-opacity: 0.72; }
    [data-intensity="epic"] { --ray-opacity: 0.88; --hero-scale: 2.16; --impact-opacity: 0.92; }

    @media (max-height: 780px) {
      .device { max-height: 76vh; }
      .prototype { padding-top: 12px; }
    }

    @media (max-width: 620px) {
      .prototype { padding: 12px 8px 86px; }
      .device { max-height: 78vh; }
      .playback { grid-template-columns: 1fr 1fr; }
      .scrubber { grid-column: 1 / -1; grid-row: 2; }
      .timecode { justify-self: end; }
      .tweaks-launcher { right: 12px; bottom: 12px; }
      .tweaks { right: 12px; bottom: 74px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
        animation-duration: 1ms !important;
      }
    }
  </style>
</head>
<body data-intensity="cinematic">
  <main class="prototype">
    <div class="device" aria-label="Мобильный прототип Phraseman">
      <div class="screen">
        <div class="island" aria-hidden="true"></div>
        <div class="statusbar"><span>9:41</span><span>● ● ●</span></div>

        <section class="overlay" id="rewardOverlay" aria-label="Ежедневный подарок" aria-live="polite">
          <div class="scene-actions" id="sceneActions">
            <button class="skip-action" id="skipScene" type="button">Пропустить</button>
            <button class="close-action" id="closeScene" type="button" aria-label="Закрыть">×</button>
          </div>

          <div class="calendar-modal" id="calendarModal">
            <p class="day-count" id="dayCount">ДЕНЬ 3 ИЗ 50</p>
            <h2 class="chapter-title" id="chapterTitle">Глава I · Пробуждение</h2>
            <nav class="chapter-rail" id="chapterRail" aria-label="Пять глав цикла"></nav>
            <div class="rule" aria-hidden="true"></div>
            <div class="gift-grid" id="giftGrid"></div>
          </div>

          <div class="detail-modal" id="detailModal">
            <h2 class="detail-title" id="detailTitle">Полная энергия в запасе</h2>
            <p class="detail-copy" id="detailCopy">Используй, когда энергия закончится.</p>
            <div class="detail-actions">
              <button class="apply-gift" id="applyGift" type="button">Применить</button>
              <button class="later-gift" id="laterGift" type="button">Позже</button>
            </div>
          </div>

          <div class="hero-layer" id="heroLayer" aria-hidden="true">
            <div class="rays" id="rays"></div>
            <div class="impact-ring" id="ringOne"></div>
            <div class="impact-ring ring-two" id="ringTwo"></div>
            <div class="impact-ring ring-three" id="ringThree"></div>
            <div class="hero-gift" id="heroGift">
              <img id="heroArt" src="../../assets/images/level-spin-rewards/energy_full.webp" alt="">
              <span class="hero-amount" id="heroAmount">MAX</span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <section class="playback" aria-label="Управление прототипом">
      <button class="control-button" id="playPause" type="button">Пауза</button>
      <button class="control-button" id="replay" type="button">Повторить</button>
      <input class="scrubber" id="scrubber" type="range" min="0" max="6200" value="0" aria-label="Таймлайн анимации">
      <output class="timecode" id="timecode" for="scrubber">0,0 / 6,2</output>
    </section>

    <section class="sound-console" aria-label="Варианты саунд-дизайна">
      <div class="sound-console-head">
        <h2 class="sound-console-title">Саунд-дизайн</h2>
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">Включить звук</button>
      </div>
      <div class="sound-packs" role="group" aria-label="Пять вариантов звучания">
        <button class="sound-pack is-selected" data-sound-pack="crystal" type="button" aria-pressed="true">Кристалл</button>
        <button class="sound-pack" data-sound-pack="runes" type="button" aria-pressed="false">Руны</button>
        <button class="sound-pack" data-sound-pack="arcade" type="button" aria-pressed="false">Игра</button>
        <button class="sound-pack" data-sound-pack="cinematic" type="button" aria-pressed="false">Кино</button>
        <button class="sound-pack" data-sound-pack="tactile" type="button" aria-pressed="false">Тактильно</button>
      </div>
      <audio id="sceneAudio" preload="auto"></audio>
      <audio id="tapAudio" preload="auto"></audio>
    </section>
  </main>

  <button class="tweaks-launcher" id="tweaksLauncher" type="button" aria-expanded="false" aria-controls="tweaksPanel">Tweaks</button>
  <aside class="tweaks" id="tweaksPanel" aria-label="Tweaks">
    <h2>Tweaks</h2>
    <div class="field">
      <label for="intensity">Интенсивность</label>
      <select id="intensity">
        <option value="calm">Спокойная</option>
        <option value="cinematic" selected>Кинематографичная</option>
        <option value="epic">Эпическая</option>
      </select>
    </div>
    <div class="field">
      <div class="field-row"><label for="dayPicker">День цикла</label><output id="dayOutput" for="dayPicker">3</output></div>
      <input id="dayPicker" type="range" min="1" max="50" value="3" aria-label="День цикла">
    </div>
    <div class="field">
      <label for="cyclePicker">Круг путешествия</label>
      <select id="cyclePicker">
        <option value="0">Главы I–V</option>
        <option value="5">Главы VI–X</option>
      </select>
    </div>
    <label class="toggle" for="reduceMotion"><input id="reduceMotion" type="checkbox">Reduced Motion</label>
  </aside>

  <script>
    const rewards = Object.freeze([
      ['pearls',10],['runes',100],['energy_full',1],['spins',1],['freeze',1],
      ['pearls',20],['runes',200],['energy_plus',2],['spins',2],['runes',500],
      ['pearls',20],['runes',200],['energy_plus',2],['spins',1],['freeze',1],
      ['pearls',50],['runes',300],['energy_full',1],['spins',2],['runes',600],
      ['pearls',50],['runes',300],['energy_plus',3],['spins',2],['freeze',1],
      ['pearls',100],['runes',400],['energy_full',1],['spins',3],['runes',700],
      ['pearls',100],['runes',400],['energy_plus',3],['spins',2],['freeze',2],
      ['pearls',150],['runes',500],['energy_full',1],['spins',3],['runes',800],
      ['pearls',150],['runes',500],['energy_plus',3],['spins',3],['freeze',2],
      ['pearls',250],['runes',750],['energy_full',1],['spins',5],['runes',1000],
    ].map(([kind, amount], index) => Object.freeze({ day: index + 1, kind, amount })));

    const artByKind = Object.freeze({
      pearls: '../../assets/images/level-spin-rewards/pearls_100.webp',
      runes: '../../assets/images/level-spin-rewards/wasabiInk/rune.webp',
      energy_full: '../../assets/images/level-spin-rewards/energy_full.webp',
      energy_plus: '../../assets/images/level-spin-rewards/energy_plus3.webp',
      spins: '../../assets/images/spin/wasabiInk/spin-ticket.webp',
      freeze: '../../assets/images/streak_icons/wasabiInk/streak-freeze-wasabiInk.webp',
    });

    const chapterNames = Object.freeze(['Пробуждение', 'Разгон', 'Ритм', 'Сила', 'Вершина']);
    const duration = 6200;
    const soundPacks = Object.freeze({
      crystal: Object.freeze({ master: 'daily-journey-audio/crystal-master.mp3', tap: 'daily-journey-audio/crystal-tap.mp3' }),
      runes: Object.freeze({ master: 'daily-journey-audio/runes-master.mp3', tap: 'daily-journey-audio/runes-tap.mp3' }),
      arcade: Object.freeze({ master: 'daily-journey-audio/arcade-master.mp3', tap: 'daily-journey-audio/arcade-tap.mp3' }),
      cinematic: Object.freeze({ master: 'daily-journey-audio/cinematic-master.mp3', tap: 'daily-journey-audio/cinematic-tap.mp3' }),
      tactile: Object.freeze({ master: 'daily-journey-audio/tactile-master.mp3', tap: 'daily-journey-audio/tactile-tap.mp3' }),
    });
    const nativeReduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let selectedDay = 3;
    let chapterOffset = 0;
    let userReduceMotion = false;
    let sceneDismissed = false;
    let selectedSoundPack = 'crystal';
    let soundEnabled = false;

    const $ = (id) => document.getElementById(id);
    const overlay = $('rewardOverlay');
    const sceneActions = $('sceneActions');
    const calendarModal = $('calendarModal');
    const heroLayer = $('heroLayer');
    const heroGift = $('heroGift');
    const rays = $('rays');
    const detailModal = $('detailModal');
    const ringOne = $('ringOne');
    const ringTwo = $('ringTwo');
    const ringThree = $('ringThree');
    const scrubber = $('scrubber');
    const timecode = $('timecode');
    const playPause = $('playPause');
    const sceneAudio = $('sceneAudio');
    const tapAudio = $('tapAudio');

    sceneAudio.src = soundPacks[selectedSoundPack].master;
    tapAudio.src = soundPacks[selectedSoundPack].tap;

    const clamp01 = (value) => Math.max(0, Math.min(1, value));
    const range = (time, start, end) => clamp01((time - start) / (end - start));
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const mix = (from, to, amount) => from + (to - from) * amount;

    function roman(value) {
      const pairs = [['X',10],['IX',9],['V',5],['IV',4],['I',1]];
      let number = value;
      let result = '';
      for (const [glyph, amount] of pairs) {
        while (number >= amount) { result += glyph; number -= amount; }
      }
      return result;
    }

    function rewardState(reward, day) {
      if (reward.day < day) return 'received';
      if (reward.day === day) return 'today';
      return 'future';
    }

    function chapterRewards(day) {
      const start = Math.floor((day - 1) / 10) * 10;
      return rewards.slice(start, start + 10);
    }

    function amountLabel(reward) {
      if (reward.kind === 'energy_full') return 'MAX';
      if (reward.kind === 'energy_plus') return `+${reward.amount}`;
      return String(reward.amount);
    }

    function accessibleRewardLabel(reward) {
      if (reward.kind === 'energy_full') return 'Полная энергия в запас';
      if (reward.kind === 'energy_plus') return `${reward.amount} энергии в запас`;
      if (reward.kind === 'spins') return `${reward.amount} спинов`;
      if (reward.kind === 'freeze') return `${reward.amount} заморозки`;
      if (reward.kind === 'runes') return `${reward.amount} рун`;
      return `${reward.amount} жемчужин`;
    }

    function rewardCopy(reward) {
      const spinWord = reward.amount === 1 ? 'спин' : reward.amount < 5 ? 'спина' : 'спинов';
      const freezeWord = reward.amount === 1 ? 'заморозка' : 'заморозки';
      if (reward.kind === 'energy_full') return ['Полная энергия в запасе', 'Используй, когда энергия закончится.'];
      if (reward.kind === 'energy_plus') return [`+${reward.amount} энергии в запасе`, 'Используй в нужный момент.'];
      if (reward.kind === 'spins') return [`${reward.amount} ${spinWord} в запасе`, 'Открой колесо, когда захочешь.'];
      if (reward.kind === 'freeze') return [`${reward.amount} ${freezeWord} в запасе`, 'Она защитит следующий пропуск.'];
      if (reward.kind === 'runes') return [`${reward.amount} рун уже у тебя`, 'Награда начислена автоматически.'];
      return [`${reward.amount} жемчужин уже у тебя`, 'Награда начислена автоматически.'];
    }

    function sceneValues(time) {
      const intro = easeOut(range(time, 0, 600));
      const pulseTime = range(time, 2800, 4100);
      const pulse = pulseTime > 0 && pulseTime < 1 ? Math.max(0, Math.sin(pulseTime * Math.PI * 6)) : 0;
      const dissolve = easeOut(range(time, 4100, 4700));
      const hero = easeOut(range(time, 4700, 5600));
      const detail = easeOut(range(time, 5600, 6200));
      return { intro, pulse, dissolve, hero, detail };
    }

    function renderJourney() {
      const active = rewards[selectedDay - 1];
      const chapterIndex = Math.floor((selectedDay - 1) / 10);
      const absoluteChapter = chapterOffset + chapterIndex + 1;
      $('dayCount').textContent = `ДЕНЬ ${selectedDay} ИЗ 50`;
      $('chapterTitle').textContent = `Глава ${roman(absoluteChapter)} · ${chapterNames[chapterIndex]}`;
      $('chapterRail').innerHTML = chapterNames.map((_, index) => {
        const classes = ['chapter-chip'];
        if (index === chapterIndex) classes.push('is-current');
        if (index === 4 && index !== chapterIndex) classes.push('is-finale');
        return `<div class="${classes.join(' ')}" aria-label="Глава ${roman(chapterOffset + index + 1)}">${roman(chapterOffset + index + 1)}</div>`;
      }).join('');
      $('giftGrid').innerHTML = chapterRewards(selectedDay).map((reward) => {
        const state = rewardState(reward, selectedDay);
        const milestone = reward.day % 10 === 0 ? ' is-milestone' : '';
        return `<div class="gift is-${state}${milestone}" data-day="${reward.day}" aria-label="День ${reward.day}: ${accessibleRewardLabel(reward)}">
          <span class="gift-day">${reward.day}</span>
          <img src="${artByKind[reward.kind]}" alt="">
          <span class="gift-amount">${amountLabel(reward)}</span>
        </div>`;
      }).join('');

      const [title, copy] = rewardCopy(active);
      $('detailTitle').textContent = title;
      $('detailCopy').textContent = copy;
      $('heroArt').src = artByKind[active.kind];
      $('heroAmount').textContent = amountLabel(active);
      $('dayOutput').textContent = String(selectedDay);
    }

    function applyFrame(time) {
      const reduce = userReduceMotion || nativeReduceMotion.matches;
      const value = reduce ? sceneValues(Math.max(6200, time)) : sceneValues(time);
      const visible = sceneDismissed ? 0 : 1;
      overlay.classList.toggle('is-open', visible > 0.01);
      overlay.style.opacity = String(value.intro * visible);
      sceneActions.style.opacity = String((1 - value.detail) * visible);
      sceneActions.style.pointerEvents = value.detail > 0.98 || sceneDismissed ? 'none' : 'auto';

      calendarModal.style.opacity = String(value.intro * (1 - value.dissolve));
      calendarModal.style.transform = `translateY(${mix(18, 0, value.intro)}px) scale(${1 - value.dissolve * 0.045})`;

      const today = document.querySelector('.gift.is-today');
      if (today) {
        const todayScale = reduce ? 1 : 1 + value.pulse * 0.09;
        today.style.transform = `translateY(-3px) scale(${todayScale})`;
        today.style.opacity = String(1 - value.dissolve);
      }

      const style = getComputedStyle(document.body);
      const targetScale = Number.parseFloat(style.getPropertyValue('--hero-scale')) || 1.9;
      const rayOpacity = Number.parseFloat(style.getPropertyValue('--ray-opacity')) || 0.68;
      const impactOpacity = Number.parseFloat(style.getPropertyValue('--impact-opacity')) || 0.72;
      heroLayer.style.opacity = String(value.hero * visible);
      heroGift.style.transform = `translate(-50%, -50%) scale(${mix(0.72, targetScale, value.hero)})`;
      rays.style.opacity = reduce ? '0' : String(value.hero * rayOpacity * visible);
      rays.style.transform = `translate(-50%, -50%) rotate(${value.hero * 34}deg) scale(${mix(0.72, 1.08, value.hero)})`;

      const impact = reduce ? 0 : Math.sin(range(time, 4850, 5450) * Math.PI) * impactOpacity;
      [ringOne, ringTwo, ringThree].forEach((ring, index) => {
        const ringProgress = easeOut(range(time, 4820 + index * 70, 5380 + index * 90));
        ring.style.opacity = String(Math.max(0, impact * (1 - index * 0.18)));
        ring.style.transform = `translate(-50%, -50%) scale(${mix(0.6, 1.25 + index * 0.12, ringProgress)})`;
      });

      detailModal.style.opacity = String(value.detail * visible);
      detailModal.style.transform = `translateY(${mix(22, 0, value.detail)}px)`;
      scrubber.value = String(Math.round(time));
      timecode.value = `${(time / 1000).toFixed(1).replace('.', ',')} / 6,2`;
    }

    function createSceneController({ onFrame, onFinish }) {
      let elapsed = 0;
      let startedAt = 0;
      let playing = false;
      let raf = 0;

      const frame = (now) => {
        if (!playing) return;
        elapsed = Math.min(duration, elapsed + now - startedAt);
        startedAt = now;
        onFrame(elapsed, duration);
        if (elapsed >= duration) {
          playing = false;
          onFinish();
          return;
        }
        raf = requestAnimationFrame(frame);
      };

      const api = Object.freeze({
        play() {
          if (playing || elapsed >= duration) return;
          playing = true;
          startedAt = performance.now();
          playPause.textContent = 'Пауза';
          raf = requestAnimationFrame(frame);
        },
        pause() {
          playing = false;
          cancelAnimationFrame(raf);
          playPause.textContent = 'Продолжить';
        },
        seek(ms) {
          sceneDismissed = false;
          elapsed = Math.max(0, Math.min(duration, ms));
          onFrame(elapsed, duration);
        },
        replay() {
          sceneDismissed = false;
          elapsed = 0;
          onFrame(0, duration);
          api.play();
        },
        skip() {
          sceneDismissed = false;
          playing = false;
          cancelAnimationFrame(raf);
          elapsed = duration;
          onFrame(duration, duration);
          onFinish();
        },
        dismiss() {
          playing = false;
          cancelAnimationFrame(raf);
          sceneDismissed = true;
          overlay.classList.remove('is-open');
          overlay.style.opacity = '0';
          playPause.textContent = 'Воспроизвести';
        },
        destroy() {
          playing = false;
          cancelAnimationFrame(raf);
        },
        isPlaying() { return playing; },
        elapsed() { return elapsed; },
      });
      return api;
    }

    const controller = createSceneController({
      onFrame: applyFrame,
      onFinish() {
        playPause.textContent = 'Воспроизвести';
      },
    });

    function stopSceneAudio() {
      sceneAudio.pause();
      sceneAudio.currentTime = 0;
    }

    function syncSceneAudio(elapsedMs, shouldPlay) {
      const target = Math.max(0, Math.min(duration / 1000, elapsedMs / 1000));
      if (Math.abs(sceneAudio.currentTime - target) > 0.08) sceneAudio.currentTime = target;
      if (soundEnabled && shouldPlay) void sceneAudio.play().catch(() => {});
    }

    function playTapAudio() {
      if (!soundEnabled) return;
      tapAudio.currentTime = 0;
      void tapAudio.play().catch(() => {});
    }

    function selectSoundPack(id) {
      if (!soundPacks[id] || id === selectedSoundPack) return;
      selectedSoundPack = id;
      stopSceneAudio();
      tapAudio.pause();
      tapAudio.currentTime = 0;
      sceneAudio.src = soundPacks[id].master;
      tapAudio.src = soundPacks[id].tap;
      sceneAudio.load();
      tapAudio.load();
      document.querySelectorAll('[data-sound-pack]').forEach((button) => {
        const selected = button.dataset.soundPack === id;
        button.classList.toggle('is-selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      if (soundEnabled) replayForMotionPreference();
    }

    function replayForMotionPreference() {
      if (userReduceMotion || nativeReduceMotion.matches) {
        stopSceneAudio();
        controller.pause();
        controller.seek(6200);
        playPause.textContent = 'Воспроизвести';
        return;
      }
      controller.replay();
      syncSceneAudio(0, true);
    }

    $('skipScene').addEventListener('click', () => { stopSceneAudio(); controller.skip(); });
    $('closeScene').addEventListener('click', () => { stopSceneAudio(); controller.dismiss(); });
    $('applyGift').addEventListener('click', () => { stopSceneAudio(); playTapAudio(); controller.dismiss(); });
    $('laterGift').addEventListener('click', () => { stopSceneAudio(); playTapAudio(); controller.dismiss(); });
    $('replay').addEventListener('click', replayForMotionPreference);
    playPause.addEventListener('click', () => {
      if (controller.elapsed() >= duration) { replayForMotionPreference(); return; }
      if (controller.isPlaying()) {
        controller.pause();
        sceneAudio.pause();
      } else {
        controller.play();
        syncSceneAudio(controller.elapsed(), true);
      }
    });
    scrubber.addEventListener('input', (event) => {
      controller.pause();
      sceneAudio.pause();
      const elapsedMs = Number(event.target.value);
      controller.seek(elapsedMs);
      syncSceneAudio(elapsedMs, false);
    });
    $('soundToggle').addEventListener('click', (event) => {
      soundEnabled = !soundEnabled;
      event.currentTarget.setAttribute('aria-pressed', String(soundEnabled));
      event.currentTarget.textContent = soundEnabled ? 'Выключить звук' : 'Включить звук';
      if (soundEnabled) replayForMotionPreference(); else stopSceneAudio();
    });
    document.querySelectorAll('[data-sound-pack]').forEach((button) => {
      button.addEventListener('click', () => selectSoundPack(button.dataset.soundPack));
    });

    $('tweaksLauncher').addEventListener('click', () => {
      const panel = $('tweaksPanel');
      const open = panel.classList.toggle('is-open');
      $('tweaksLauncher').setAttribute('aria-expanded', String(open));
    });
    $('intensity').addEventListener('change', (event) => {
      document.body.dataset.intensity = event.target.value;
      applyFrame(controller.elapsed());
    });
    $('dayPicker').addEventListener('input', (event) => {
      selectedDay = Number(event.target.value);
      renderJourney();
      replayForMotionPreference();
    });
    $('cyclePicker').addEventListener('change', (event) => {
      chapterOffset = Number(event.target.value);
      renderJourney();
      replayForMotionPreference();
    });
    $('reduceMotion').addEventListener('change', (event) => {
      userReduceMotion = event.target.checked;
      replayForMotionPreference();
    });
    nativeReduceMotion.addEventListener?.('change', replayForMotionPreference);
    window.addEventListener('pagehide', () => {
      controller.destroy();
      stopSceneAudio();
      tapAudio.pause();
    }, { once: true });

    renderJourney();
    applyFrame(0);
    replayForMotionPreference();
  </script>
</body>
</html>
