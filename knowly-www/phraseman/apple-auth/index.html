<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening PhraseMan...</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07090d;
      color: #f4f7fb;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, calc(100vw - 40px));
      text-align: center;
    }
    a {
      color: #6db7ff;
      font-weight: 700;
    }
    .muted {
      color: #9ba7b6;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening PhraseMan...</h1>
    <p class="muted">If nothing happens, tap the link below.</p>
    <p><a id="open-link" href="phraseman://apple-auth">Open app</a></p>
  </main>
  <script>
    (function () {
      var target = 'phraseman://apple-auth' + window.location.search + window.location.hash;
      var link = document.getElementById('open-link');
      link.href = target;
      window.location.replace(target);
    }());
  </script>
</body>
</html>
