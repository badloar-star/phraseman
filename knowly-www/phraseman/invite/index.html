<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-key="title">Phraseman Invite</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --card: #1b1f25;
      --text: #f7f8fa;
      --muted: #a7afbd;
      --line: rgba(255,255,255,0.12);
      --blue: #6aa7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% -10%, #223047 0, var(--bg) 52%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }
    .code {
      display: none;
      margin: 18px 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      letter-spacing: 0.16em;
      font-weight: 800;
      font-size: 22px;
      text-align: center;
    }
    .actions {
      display: grid;
      gap: 10px;
    }
    a {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #06111f;
      background: var(--blue);
      border-radius: 12px;
      padding: 14px 16px;
      font-weight: 800;
    }
    a.secondary {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
    }
    small {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n-key="heading">Open Phraseman</h1>
    <p data-i18n-key="intro">We are opening the invitation in the app. If nothing happens, install Phraseman and come back to this page.</p>
    <div id="code" class="code"></div>
    <div class="actions">
      <a id="openApp" href="phraseman://invite" data-i18n-key="openApp">Open in Phraseman</a>
      <a id="store" class="secondary" href="https://play.google.com/store/apps/details?id=app.phraseman" data-i18n-key="install">Install Phraseman</a>
    </div>
    <small id="hint" data-i18n-key="hint">After installing, tap "Open in Phraseman" again so the invite code is applied.</small>
  </main>

  <script>
    (function () {
      var translations = {
        title: {
          ru: 'Приглашение в Phraseman',
          uk: 'Запрошення у Phraseman',
          es: 'Invitación de Phraseman',
          'pt-BR': 'Convite do Phraseman',
          vi: 'Lời mời Phraseman',
          id: 'Undangan Phraseman',
          tr: 'Phraseman Daveti',
          pl: 'Zaproszenie Phraseman',
        },
        heading: {
          ru: 'Открыть Phraseman',
          uk: 'Відкрити Phraseman',
          es: 'Abrir Phraseman',
          'pt-BR': 'Abrir o Phraseman',
          vi: 'Mở Phraseman',
          id: 'Buka Phraseman',
          tr: 'Phraseman’i aç',
          pl: 'Otwórz Phraseman',
        },
        intro: {
          ru: 'Открываем приглашение в приложении. Если ничего не произошло — установи Phraseman и вернись на эту страницу.',
          uk: 'Відкриваємо запрошення у застосунку. Якщо нічого не сталося — встанови Phraseman і повернися на цю сторінку.',
          es: 'Estamos abriendo la invitación en la app. Si no pasa nada, instala Phraseman y vuelve a esta página.',
          'pt-BR': 'Estamos abrindo o convite no app. Se nada acontecer, instale o Phraseman e volte para esta página.',
          vi: 'Chúng tôi đang mở lời mời trong ứng dụng. Nếu không có gì xảy ra, hãy cài đặt Phraseman rồi quay lại trang này.',
          id: 'Kami sedang membuka undangan di aplikasi. Jika tidak terjadi apa-apa, instal Phraseman lalu kembali ke halaman ini.',
          tr: 'Daveti uygulamada açıyoruz. Hiçbir şey olmazsa Phraseman’i yükleyip bu sayfaya geri dönün.',
          pl: 'Otwieramy zaproszenie w aplikacji. Jeśli nic się nie stanie, zainstaluj Phraseman i wróć na tę stronę.',
        },
        openApp: {
          ru: 'Открыть в Phraseman',
          uk: 'Відкрити у Phraseman',
          es: 'Abrir en Phraseman',
          'pt-BR': 'Abrir no Phraseman',
          vi: 'Mở trong Phraseman',
          id: 'Buka di Phraseman',
          tr: 'Phraseman’de aç',
          pl: 'Otwórz w Phraseman',
        },
        install: {
          ru: 'Установить Phraseman',
          uk: 'Встановити Phraseman',
          es: 'Instalar Phraseman',
          'pt-BR': 'Instalar Phraseman',
          vi: 'Cài đặt Phraseman',
          id: 'Instal Phraseman',
          tr: 'Phraseman’i yükle',
          pl: 'Zainstaluj Phraseman',
        },
        installAppStore: {
          ru: 'Установить из App Store',
          uk: 'Встановити з App Store',
          es: 'Instalar desde App Store',
          'pt-BR': 'Instalar pela App Store',
          vi: 'Cài đặt từ App Store',
          id: 'Instal dari App Store',
          tr: 'App Store’dan yükle',
          pl: 'Zainstaluj z App Store',
        },
        installGooglePlay: {
          ru: 'Установить из Google Play',
          uk: 'Встановити з Google Play',
          es: 'Instalar desde Google Play',
          'pt-BR': 'Instalar pelo Google Play',
          vi: 'Cài đặt từ Google Play',
          id: 'Instal dari Google Play',
          tr: 'Google Play’den yükle',
          pl: 'Zainstaluj z Google Play',
        },
        hint: {
          ru: 'После установки нажми «Открыть в Phraseman» ещё раз, чтобы применился код приглашения.',
          uk: 'Після встановлення натисни «Відкрити у Phraseman» ще раз, щоб застосувався код запрошення.',
          es: 'Después de instalar, toca “Abrir en Phraseman” otra vez para aplicar el código de invitación.',
          'pt-BR': 'Depois de instalar, toque em “Abrir no Phraseman” novamente para aplicar o código do convite.',
          vi: 'Sau khi cài đặt, hãy chạm lại vào “Mở trong Phraseman” để áp dụng mã mời.',
          id: 'Setelah menginstal, ketuk “Buka di Phraseman” lagi agar kode undangan diterapkan.',
          tr: 'Yükledikten sonra davet kodunun uygulanması için “Phraseman’de aç” düğmesine tekrar dokunun.',
          pl: 'Po instalacji ponownie dotknij „Otwórz w Phraseman”, aby zastosować kod zaproszenia.',
        },
        hintIos: {
          ru: 'При установке мы скопируем приглашение. После установки открой Phraseman и разреши вставку — код применится сам. Или введи код вручную: Друзья → «Ввести код».',
          uk: 'Під час встановлення ми скопіюємо запрошення. Після встановлення відкрий Phraseman і дозволь вставлення — код застосується сам. Або введи код вручну: Друзі → «Ввести код».',
          es: 'Al instalar copiaremos la invitación. Después abre Phraseman y permite pegar: el código se aplicará solo. O escríbelo a mano: Amigos → «Ingresar código».',
          'pt-BR': 'Ao instalar, copiaremos o convite. Depois abra o Phraseman e permita colar: o código será aplicado sozinho. Ou digite-o em Amigos → «Inserir código».',
          vi: 'Khi cài đặt, chúng tôi sẽ sao chép lời mời. Sau đó mở Phraseman và cho phép dán — mã sẽ tự áp dụng. Hoặc nhập tay: Bạn bè → «Nhập mã».',
          id: 'Saat memasang, kami menyalin undangan. Setelah itu buka Phraseman dan izinkan tempel — kode diterapkan otomatis. Atau masukkan manual: Teman → «Masukkan kode».',
          tr: 'Yükleme sırasında daveti kopyalarız. Sonra Phraseman’i aç ve yapıştırmaya izin ver — kod kendiliğinden uygulanır. Ya da elle gir: Arkadaşlar → «Kod gir».',
          pl: 'Przy instalacji skopiujemy zaproszenie. Potem otwórz Phraseman i zezwól na wklejenie — kod zastosuje się sam. Albo wpisz go ręcznie: Znajomi → «Wpisz kod».',
        },
        hintAndroid: {
          ru: 'На Android ссылка установки сама переносит код приглашения через Google Play.',
          uk: 'На Android посилання встановлення саме переносить код запрошення через Google Play.',
          es: 'En Android, el enlace de instalación también lleva el código de invitación a través de Google Play.',
          'pt-BR': 'No Android, o link de instalação também leva o código do convite pelo Google Play.',
          vi: 'Trên Android, liên kết cài đặt cũng chuyển mã mời qua Google Play.',
          id: 'Di Android, tautan instalasi juga membawa kode undangan melalui Google Play.',
          tr: 'Android’de yükleme bağlantısı davet kodunu Google Play üzerinden de taşır.',
          pl: 'Na Androidzie link instalacyjny przenosi też kod zaproszenia przez Google Play.',
        },
      };
      var locale = new URLSearchParams(window.location.search).get('lang') || navigator.language || '';
      var normalized = String(locale).toLowerCase();
      var lang =
        normalized.startsWith('ru') ? 'ru' :
        normalized.startsWith('uk') ? 'uk' :
        normalized.startsWith('pt') ? 'pt-BR' :
        normalized.startsWith('vi') ? 'vi' :
        normalized.startsWith('id') ? 'id' :
        normalized.startsWith('tr') ? 'tr' :
        normalized.startsWith('pl') ? 'pl' :
        normalized.startsWith('es') ? 'es' :
        '';
      var params = new URLSearchParams(window.location.search);
      var ref = String(params.get('ref') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
      var isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(navigator.userAgent);
      var appUrl = 'phraseman://invite' + (ref ? '?ref=' + encodeURIComponent(ref) : '');
      var androidStore = 'https://play.google.com/store/apps/details?id=app.phraseman' +
        (ref ? '&referrer=' + encodeURIComponent('ref=' + ref) : '');
      var iosStore = 'https://apps.apple.com/app/id6764800879';

      var openApp = document.getElementById('openApp');
      var store = document.getElementById('store');
      var code = document.getElementById('code');
      var hint = document.getElementById('hint');

      function tr(key, defaultText) {
        return (lang && translations[key] && translations[key][lang]) || defaultText;
      }

      if (lang) {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n-key]').forEach(function (node) {
          var key = node.getAttribute('data-i18n-key');
          var value = key && translations[key] && translations[key][lang];
          if (value) node.textContent = value;
        });
      }

      openApp.href = appUrl;
      store.href = isiOS ? iosStore : androidStore;
      store.textContent = isiOS ? tr('installAppStore', 'Install from App Store') : tr('installGooglePlay', 'Install from Google Play');

      if (ref) {
        code.style.display = 'block';
        code.textContent = ref;
        hint.textContent = isiOS
          ? tr('hintIos', 'When you install, we copy your invite. After installing, open Phraseman and allow paste — the code applies itself. Or enter it manually: Friends → "Enter code".')
          : tr('hintAndroid', 'On Android the install link also carries the invite code through Google Play.');
      }

      // iOS: App Store не передаёт параметры установки (нет Install Referrer),
      // поэтому при переходе в стор кладём инвайт-ссылку в буфер — приложение
      // прочитает её при первом запуске (промпт «Разрешить вставку»).
      if (isiOS && ref) {
        store.addEventListener('click', function (ev) {
          ev.preventDefault();
          var dest = store.href;
          var done = false;
          var go = function () {
            if (done) return;
            done = true;
            window.location.href = dest;
          };
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(window.location.href).then(go, go);
              setTimeout(go, 600); // страховка: не держим пользователя, если промис завис
            } else {
              go();
            }
          } catch (e) {
            go();
          }
        });
      }

      window.location.href = appUrl;
      if (isAndroid) {
        setTimeout(function () { window.location.href = androidStore; }, 1400);
      } else if (!isiOS) {
        setTimeout(function () { window.location.href = store.href; }, 1800);
      }
    })();
  </script>
</body>
</html>
