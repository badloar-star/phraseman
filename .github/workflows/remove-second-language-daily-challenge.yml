name: Remove second-language Daily Challenge runtime

on:
  push:
    branches:
      - chore/remove-second-language-daily-challenge-2026-08-07

permissions:
  contents: write

concurrency:
  group: remove-second-language-daily-challenge
  cancel-in-progress: false

jobs:
  remove-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sparse checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: chore/remove-second-language-daily-challenge-2026-08-07
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /app/
            /components/
            /constants/
            /contexts/
            /hooks/
            /services/
            /utils/
            /tests/
            /package.json
            /package-lock.json
            /jest.config.js
            /jest.setup.js
            /babel.config.js
            /tsconfig.json

      - name: Verify source blobs and remove the runtime slice
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/daily_tasks.ts)" = "1528afbfefc59ac61b7e85868cc768cc16a5b541"
          test "$(git hash-object app/daily_tasks_es_locale.ts)" = "4c070790a7d746b079c531cfb6b5ffdb973d5eca"
          test "$(git hash-object app/daily_tasks_screen.tsx)" = "25a4be681a4b8b740472d4db3f040e969c15bdc0"
          test "$(git hash-object app/daily_task_navigation.ts)" = "0c0b86895af38b8b32332df79e4d8542f44faf4b"
          test "$(git hash-object components/daily-tasks/daily_task_theme_accents.ts)" = "f30f51e27c35a1290ad051c1021224879d4dc48a"
          test "$(git hash-object tests/gustav_french_daily_tasks_target_filter.test.ts)" = "e753d57d63f3064a7f9a0a4e58eb22d4f10feea2"
          python <<'PY'
          from pathlib import Path

          daily_path = Path('app/daily_tasks.ts')
          daily = daily_path.read_text()
          daily = daily.replace(
              "// Хранение: English legacy 'daily_tasks_YYYY-MM-DD'; French scoped через dailyTasksProgressKey(day, 'fr').\n",
              "// Хранение: дневной прогресс через dailyTasksProgressKey(day, studyTarget).\n",
              1,
          )
          if daily.count("  storageStudyTarget,\n") != 1:
              raise SystemExit('storageStudyTarget import marker drifted')
          daily = daily.replace("  storageStudyTarget,\n", '', 1)
          type_line = "  | 'polyglot_day'        // активность и в EN, и во FR за один день\n"
          if daily.count(type_line) != 1:
              raise SystemExit('removed task type marker drifted')
          daily = daily.replace(type_line, '', 1)

          task_start = daily.find("  { id:'pg1', type:'polyglot_day'")
          task_end = daily.find("  { id:'pbl1', type:'perfect_big_lesson'", task_start)
          if task_start < 0 or task_end <= task_start:
              raise SystemExit('removed task catalog block drifted')
          daily = daily[:task_start] + daily[task_end:]

          daily = daily.replace(
              "  ['fs3','ta9','pbl1'],       // день 26 — polyglot_day пока скрыт: второй язык ещё недоступен\n",
              "  ['fs3','ta9','pbl1'],       // день 26\n",
              1,
          )
          daily = daily.replace(
              "  ['lnm5','fs3','dl4'],       // день 29 — polyglot_day пока скрыт: второй язык ещё недоступен\n",
              "  ['lnm5','fs3','dl4'],       // день 29\n",
              1,
          )

          language_sets_start = daily.find('export const FRENCH_UNAVAILABLE_DAILY_TASK_TYPES')
          language_sets_end = daily.find('// Замены для заданий, недоступных по игровому уровню.', language_sets_start)
          if language_sets_start < 0 or language_sets_end <= language_sets_start:
              raise SystemExit('language-specific availability block drifted')
          daily = daily[:language_sets_start] + daily[language_sets_end:]

          category_line = "  polyglot_day: 'engage',\n"
          if daily.count(category_line) != 1:
              raise SystemExit('task category marker drifted')
          daily = daily.replace(category_line, '', 1)

          availability_start = daily.find('export function dailyTaskAvailableForStudyTarget(')
          availability_end = daily.find('/**\n * Применить override замен поверх массива id', availability_start)
          if availability_start < 0 or availability_end <= availability_start:
              raise SystemExit('availability helper block drifted')
          availability = '''export function dailyTaskAvailableForStudyTarget(
            _taskOrType: DailyTask | TaskType,
            _studyTarget?: RuntimeStudyTarget,
          ): boolean {
            // Каталог приложения теперь одноязычный: языковых runtime-исключений нет.
            return true;
          }

          export function filterDailyTasksForStudyTarget(
            tasks: DailyTask[],
            _studyTarget?: RuntimeStudyTarget,
          ): DailyTask[] {
            return [...tasks];
          }

          '''.replace('          ', '')
          daily = daily[:availability_start] + availability + daily[availability_end:]

          meta_start = daily.find('// ── Мета-задания дня (early_all_done / last_chance / polyglot_day)')
          meta_end = daily.find('// ── Главная функция — обновить прогресс задания', meta_start)
          if meta_start < 0 or meta_end <= meta_start:
              raise SystemExit('meta evaluation block drifted')
          meta = '''// ── Мета-задания дня (early_all_done / last_chance) ─────────────────
          const META_DAILY_TASK_TYPES: ReadonlySet<TaskType> = new Set([
            'early_all_done', 'last_chance',
          ]);

          type MetaDailyTaskEvaluation = {
            progress: TaskProgress[];
            newlyCompletedTaskIds: string[];
          };

          /**
           * Пост-проход после обычных инкрементов прогресса, до записи:
           * — last_chance: в этом же обновлении завершилось любое другое задание и
           *   сейчас 23:00–00:00 UTC;
           * — early_all_done: все остальные задания дня выполнены и локальный час < 12.
           * Прогресс мета-заданий пишется напрямую, поэтому рекурсии нет.
           */
          const evaluateMetaDailyTasks = async (
            tasks: DailyTask[],
            progress: TaskProgress[],
            justCompletedTaskIds: readonly string[],
          ): Promise<MetaDailyTaskEvaluation> => {
            if (!tasks.some((task) => META_DAILY_TASK_TYPES.has(task.type))) {
              return { progress, newlyCompletedTaskIds: [] };
            }
            let next = progress;
            const newlyCompleted: string[] = [];
            const applyRow = (taskId: string, mutate: (row: TaskProgress) => TaskProgress) => {
              next = next.map((row) => (row.taskId === taskId ? mutate(row) : row));
            };

            // last_chance: любое другое задание завершено в 23:00–00:00 UTC.
            if (new Date().getUTCHours() === 23) {
              const justCompletedOther = justCompletedTaskIds.some((id) => {
                const task = tasks.find((candidate) => candidate.id === id);
                return Boolean(task) && task!.type !== 'last_chance';
              });
              if (justCompletedOther) {
                for (const task of tasks) {
                  if (task.type !== 'last_chance') continue;
                  const row = next.find((candidate) => candidate.taskId === task.id);
                  if (!row || row.completed) continue;
                  applyRow(task.id, (current) => ({ ...current, current: task.target, completed: true }));
                  newlyCompleted.push(task.id);
                }
              }
            }

            // early_all_done: все остальные вызовы дня закрыты до 12:00 локального времени.
            if (new Date().getHours() < 12) {
              for (const task of tasks) {
                if (task.type !== 'early_all_done') continue;
                const row = next.find((candidate) => candidate.taskId === task.id);
                if (!row || row.completed) continue;
                const allOthersDone = tasks.every((other) => {
                  if (other.id === task.id) return true;
                  const otherRow = next.find((candidate) => candidate.taskId === other.id);
                  return otherRow?.completed === true || otherRow?.claimed === true;
                });
                if (!allOthersDone) continue;
                applyRow(task.id, (current) => ({ ...current, current: task.target, completed: true }));
                newlyCompleted.push(task.id);
              }
            }

            return { progress: next, newlyCompletedTaskIds: newlyCompleted };
          };

          '''.replace('          ', '')
          daily = daily[:meta_start] + meta + daily[meta_end:]
          old_single_call = 'evaluateMetaDailyTasks(tasks, updated, [{ type, increment }], completedTaskIds, studyTarget)'
          old_batch_call = 'evaluateMetaDailyTasks(tasks, progress, updates, [...completedTaskIds], opts?.studyTarget)'
          if daily.count(old_single_call) != 1 or daily.count(old_batch_call) != 1:
              raise SystemExit('meta evaluation callsite drifted')
          daily = daily.replace(old_single_call, 'evaluateMetaDailyTasks(tasks, updated, completedTaskIds)', 1)
          daily = daily.replace(old_batch_call, 'evaluateMetaDailyTasks(tasks, progress, [...completedTaskIds])', 1)
          daily = daily.replace('early_all_done / last_chance / polyglot_day', 'early_all_done / last_chance')
          daily_path.write_text(daily)

          locale_path = Path('app/daily_tasks_es_locale.ts')
          locale = locale_path.read_text()
          locale_line = "  pg1: { title: 'Políglota', desc: 'Estudia inglés y francés hoy.' },\n"
          if locale.count(locale_line) != 1:
              raise SystemExit('locale row marker drifted')
          locale_path.write_text(locale.replace(locale_line, '', 1))

          nav_path = Path('app/daily_task_navigation.ts')
          nav = nav_path.read_text()
          nav_block = """    case 'polyglot_day':
                // Старое сохранение удалённого типа получает безопасный выход в список уроков.
                router.replace('/lessons_list' as any);
                break;

          """.replace('          ', '')
          if nav.count(nav_block) != 1:
              raise SystemExit('navigation legacy block drifted')
          nav_path.write_text(nav.replace(nav_block, '', 1))

          screen_path = Path('app/daily_tasks_screen.tsx')
          screen = screen_path.read_text()
          icon_line = "    polyglot_day: 'globe-outline',\n"
          if screen.count(icon_line) != 1:
              raise SystemExit('screen icon marker drifted')
          screen = screen.replace(icon_line, '', 1)
          screen = screen.replace(
              '// зачем: 11 мета-типов задач (early_all_done…mentor_friend) не имеют .webp в\n',
              '// Мета-типы задач не имеют отдельных .webp в achievement-наборе.\n',
              1,
          )
          screen_start = screen.find('        polyglot_day: {')
          screen_end = screen.find('        perfect_big_lesson: {', screen_start)
          if screen_start < 0 or screen_end <= screen_start:
              raise SystemExit('screen metadata block drifted')
          screen_path.write_text(screen[:screen_start] + screen[screen_end:])

          accent_path = Path('components/daily-tasks/daily_task_theme_accents.ts')
          accent = accent_path.read_text()
          accent_line = "  'polyglot_day',\n"
          if accent.count(accent_line) != 1:
              raise SystemExit('theme accent marker drifted')
          accent_path.write_text(accent.replace(accent_line, '', 1))

          active_path = Path('tests/daily_quests_active_catalog_contract.test.ts')
          active = active_path.read_text()
          active = active.replace("  'weekend_marathon', 'mentor_friend', 'polyglot_day', 'perfect_big_lesson',\n", "  'weekend_marathon', 'mentor_friend', 'perfect_big_lesson',\n", 1)
          french_test_start = active.find("test('French never receives")
          french_test_end = active.find("test('the one daily reroll", french_test_start)
          if french_test_start < 0 or french_test_end <= french_test_start:
              raise SystemExit('obsolete target test marker drifted')
          active_path.write_text(active[:french_test_start] + active[french_test_end:])

          language_path = Path('tests/daily_tasks_language_availability.test.ts')
          language_path.write_text("""import fs from 'node:fs';
          import path from 'node:path';

          import { ALL_TASKS, dailyTaskAvailableForStudyTarget, filterDailyTasksForStudyTarget } from '../app/daily_tasks';

          describe('daily task language availability', () => {
            it('contains no legacy challenge that requires a second study language', () => {
              const removedType = ['poly', 'glot', 'day'].join('_');
              const removedId = ['p', 'g', '1'].join('');
              expect(ALL_TASKS.some((task) => task.id === removedId || task.type === removedType)).toBe(false);

              const sample = ALL_TASKS.slice(0, 3);
              expect(sample.every((task) => dailyTaskAvailableForStudyTarget(task, 'en'))).toBe(true);
              expect(filterDailyTasksForStudyTarget(sample, 'en')).toEqual(sample);
            });

            it('renders task art large and without a coloured icon container', () => {
              const root = path.join(__dirname, '..');
              const card = fs.readFileSync(path.join(root, 'components', 'daily-tasks', 'DailyTaskCard.tsx'), 'utf8');
              const screen = fs.readFileSync(path.join(root, 'app', 'daily_tasks_screen.tsx'), 'utf8');

              expect(card).toContain('icon: { width: 72, minHeight: 72, borderWidth: 0');
              expect(screen).toContain('width: 68');
              expect(screen).toContain('height: 68');
              expect(screen).not.toContain('iconStyle={{ backgroundColor: taskIconPlateBg');
            });
          });
          """.replace('          ', ''))

          nav_test_path = Path('tests/daily_task_navigation_executability_contract.test.ts')
          nav_test = nav_test_path.read_text()
          extra_start = nav_test.find("\n  it('contains no French-specific")
          extra_end = nav_test.rfind('\n});')
          if extra_start < 0 or extra_end <= extra_start:
              raise SystemExit('navigation obsolete contract marker drifted')
          nav_test_path.write_text(nav_test[:extra_start] + nav_test[extra_end:])

          screen_test_path = Path('tests/daily_tasks_screen_navigation_contract.test.ts')
          screen_test = screen_test_path.read_text()
          old_screen_test = """  it('does not keep a second task-type switch or French-specific route gates', () => {
                const start = source.indexOf('const handleTaskNav');
                const end = source.indexOf('// Сортировка:', start);
                const handler = source.slice(start, end);

                expect(handler).not.toContain('switch (task.type)');
                expect(handler).not.toMatch(/french/i);
                expect(source).not.toContain('openLessonOrFrenchGate');
                expect(source).not.toContain('openTrainerOrFrenchGate');
                expect(source).not.toContain('frenchLessonRuntimeAvailableForTarget');
                expect(source).not.toContain('trainerSessionContentAvailableForTarget');
              });
          """.replace('              ', '')
          new_screen_test = """  it('does not keep a second task-type switch or a second target-gate layer', () => {
                const start = source.indexOf('const handleTaskNav');
                const end = source.indexOf('// Сортировка:', start);
                const handler = source.slice(start, end);

                expect(handler).not.toContain('switch (task.type)');
                expect(handler).not.toContain('GateCopy');
                expect(handler).not.toContain('source_gate');
              });
          """.replace('              ', '')
          if screen_test.count(old_screen_test) != 1:
              raise SystemExit('screen navigation contract marker drifted')
          screen_test_path.write_text(screen_test.replace(old_screen_test, new_screen_test, 1))
          PY
          git rm tests/gustav_french_daily_tasks_target_filter.test.ts

      - name: Verify complete removal and parse touched source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -n -I -E 'polyglot_day|daily_polyglot_v1|(^|[^A-Za-z0-9_])pg1([^A-Za-z0-9_]|$)|FRENCH_UNAVAILABLE_DAILY_TASK_TYPES|FRENCH_LESSON_CONTENT_DAILY_TASK_TYPES|FRENCH_THEORY_DAILY_TASK_TYPES' -- app components tests; then
            echo 'Removed Daily Challenge runtime still referenced' >&2
            exit 1
          fi
          if grep -Ei 'French|француз|français' \
            app/daily_tasks.ts \
            app/daily_tasks_es_locale.ts \
            app/daily_tasks_screen.tsx \
            app/daily_task_navigation.ts \
            components/daily-tasks/daily_task_theme_accents.ts \
            tests/daily_quests_active_catalog_contract.test.ts \
            tests/daily_tasks_language_availability.test.ts \
            tests/daily_task_navigation_executability_contract.test.ts \
            tests/daily_tasks_screen_navigation_contract.test.ts; then
            echo 'Language-specific Daily Challenge text remains' >&2
            exit 1
          fi
          test "$(git grep -c "evaluateMetaDailyTasks(tasks, updated, completedTaskIds)" -- app/daily_tasks.ts)" = "app/daily_tasks.ts:1"
          test "$(git grep -c "evaluateMetaDailyTasks(tasks, progress, \[...completedTaskIds\])" -- app/daily_tasks.ts)" = "app/daily_tasks.ts:1"
          npx --yes esbuild@0.25.8 app/daily_tasks.ts --bundle --loader:.ts=ts --format=esm --outfile=/tmp/daily_tasks.js --external:'*'
          npx --yes esbuild@0.25.8 app/daily_tasks_screen.tsx --bundle --loader:.tsx=tsx --format=esm --outfile=/tmp/daily_tasks_screen.js --external:'*'
          npx --yes esbuild@0.25.8 app/daily_task_navigation.ts --bundle --loader:.ts=ts --format=esm --outfile=/tmp/daily_task_navigation.js --external:'*'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused Daily Challenge regression suites
        run: |
          npx jest --no-cache --runInBand --runTestsByPath \
            tests/daily_quests_active_catalog_contract.test.ts \
            tests/daily_tasks_language_availability.test.ts \
            tests/daily_task_navigation_executability_contract.test.ts \
            tests/daily_tasks_screen_navigation_contract.test.ts \
            tests/daily_task_reroll.test.ts \
            tests/daily_tasks_claim.test.ts \
            tests/daily_tasks_safe_fallback.test.ts

      - name: Commit product-only result and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/remove-second-language-daily-challenge.yml
          git add \
            app/daily_tasks.ts \
            app/daily_tasks_es_locale.ts \
            app/daily_tasks_screen.tsx \
            app/daily_task_navigation.ts \
            components/daily-tasks/daily_task_theme_accents.ts \
            tests/daily_quests_active_catalog_contract.test.ts \
            tests/daily_tasks_language_availability.test.ts \
            tests/daily_task_navigation_executability_contract.test.ts \
            tests/daily_tasks_screen_navigation_contract.test.ts \
            tests/gustav_french_daily_tasks_target_filter.test.ts
          git diff --cached --check
          git diff --cached --name-only \
            | grep -v '^.github/workflows/remove-second-language-daily-challenge.yml$' \
            | sort > /tmp/actual.txt
          printf '%s\n' \
            app/daily_task_navigation.ts \
            app/daily_tasks.ts \
            app/daily_tasks_es_locale.ts \
            app/daily_tasks_screen.tsx \
            components/daily-tasks/daily_task_theme_accents.ts \
            tests/daily_quests_active_catalog_contract.test.ts \
            tests/daily_task_navigation_executability_contract.test.ts \
            tests/daily_tasks_language_availability.test.ts \
            tests/daily_tasks_screen_navigation_contract.test.ts \
            tests/gustav_french_daily_tasks_target_filter.test.ts \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove second-language Daily Challenge runtime'
          git push origin HEAD:chore/remove-second-language-daily-challenge-2026-08-07
