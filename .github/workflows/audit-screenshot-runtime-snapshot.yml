name: Export screenshot runtime audit snapshot

on:
  push:
    branches:
      - audit/screenshot-fixes-2026-08-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/screenshot-fixes-2026-08-06
          fetch-depth: 1

      - name: Build source-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          git ls-files \
            | grep -E '^(app|components|constants|hooks|tests|functions/src|scripts)/.*\.(ts|tsx|js|jsx|mjs|cjs|json)$|^(package.json|package-lock.json|tsconfig.json|jest\.config\.(js|cjs|mjs|ts)|app\.json|eas\.json)$' \
            > /tmp/source-files.txt
          test -s /tmp/source-files.txt
          tar -czf phraseman-runtime-source.tgz -T /tmp/source-files.txt
          cp /tmp/source-files.txt source-files.txt
          git rev-parse HEAD > source-head-sha.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phraseman-runtime-source
          path: |
            phraseman-runtime-source.tgz
            source-files.txt
            source-head-sha.txt
          retention-days: 3
