appId: app.phraseman
name: 15 Paywall layout generic
---
- tapOn:
    point: "14%,93%"
- extendedWaitUntil:
    visible: ".*0/10.*"
    timeout: 60000
- openLink: "phraseman://dev_state?set=uiLang:ru,appearance:dark"
- extendedWaitUntil:
    visible: "DEV-STATE OK"
    timeout: 60000
- back
- waitForAnimationToEnd
- openLink: "phraseman://premium_modal?context=generic&_dev_state=live"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: paywall_generic_dark
- back
- waitForAnimationToEnd
- openLink: "phraseman://dev_state?set=uiLang:ru,appearance:light"
- extendedWaitUntil:
    visible: "DEV-STATE OK"
    timeout: 60000
- back
- waitForAnimationToEnd
- openLink: "phraseman://premium_modal?context=generic&_dev_state=live"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: paywall_generic_light
- back
- waitForAnimationToEnd
