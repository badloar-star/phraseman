appId: app.phraseman
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "phraseman:///settings_testers"
- extendedWaitUntil:
    visible: "Админ панель"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "admin-scenario-inbox-flow"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 50
- tapOn:
    id: "admin-scenario-inbox-flow"
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 60000
- tapOn:
    id: "home-app-messages-button"
- tapOn:
    id: "vip-survey-inbox-cta"
- extendedWaitUntil:
    visible:
      id: "vip-survey-modal"
    timeout: 30000
- tapOn:
    id: "vip-survey-option-most_useful-lessons"
- tapOn:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-option-linger_screen-lessons"
- tapOn:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-option-less_interesting-too_easy"
- tapOn:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-option-first_time_confusing-what_next"
- tapOn:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-option-expected_missing-more_explanations"
- tapOn:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-option-overloaded_screen-home"
- tapOn:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-comment-one_thing_week"
- inputText: "Улучшить понятность главной"
- tapOn:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-comment-feature_request"
- inputText: "План обучения"
- tapOn:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-comment-friend_recommendation"
- inputText: "Удобно учить фразы каждый день"
- tapOn:
    id: "vip-survey-primary"
- extendedWaitUntil:
    visible: "Спасибо за помощь!"
    timeout: 30000
- tapOn:
    id: "vip-survey-primary"
- extendedWaitUntil:
    visible:
      id: "vip-survey-review-prompt"
    timeout: 60000
- assertVisible: "Ваш Plus активирован"
- tapOn:
    id: "vip-survey-review-write"
- takeScreenshot: vip_survey_e2e_pass
