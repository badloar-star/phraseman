<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Аналитика Phraseman</title>
  <link rel="stylesheet" href="/v2/styles/admin.css">
</head>
<body class="analytics-only">
  <div class="admin-shell">
    <aside class="sidebar" aria-label="Навигация аналитики">
      <a class="brand" href="#product" aria-label="Phraseman Analytics">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span><strong>Phraseman</strong><small>read-only аналитика</small></span>
      </a>
      <nav class="primary-nav" aria-label="Разделы">
        <a href="#product" title="Аналитика продукта">Продукт</a>
        <a href="#subscriptions" title="Жизненный цикл подписок">Подписки</a>
        <a href="#monthly" title="Ежемесячный пакет решений">Пакет решений</a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" title="Открыть текущую полную админку">Legacy‑админка</a>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="breadcrumbs" aria-label="Путь раздела">Админка / Аналитика</div>
        <div class="topbar-actions">
          <a href="../index.html" title="Вернуться ко всем прежним инструментам">Все инструменты</a>
          <span id="auth-status" class="auth-status" role="status">Проверка доступа…</span>
          <button id="auth-action" class="button small" type="button" disabled title="Войти или выйти из учётной записи">Войти</button>
        </div>
      </header>
      <div id="global-message" class="global-message" role="status" aria-live="polite" hidden></div>
      <div id="app" class="page" aria-live="polite"></div>
    </main>
  </div>

  <script src="/v2/scripts/components/analytics-language.js"></script>
  <script src="/v2/scripts/pages/product-analytics.js"></script>
  <script src="/v2/scripts/pages/product-sessions.js"></script>
  <script src="/v2/scripts/pages/learning-diagnostics.js"></script>
  <script src="/v2/scripts/pages/conversion-diagnostics.js"></script>
  <script src="/v2/scripts/pages/retention-diagnostics.js"></script>
  <script src="/v2/scripts/pages/subscription-analytics.js"></script>
  <script src="/v2/scripts/pages/monthly-decision-pack.js"></script>
  <script type="module" src="/v2/scripts/admin-analytics-app.js"></script>
</body>
</html>
