name: Apply durable lesson Daily Challenge delivery v2

on:
  push:
    branches:
      - fix/lesson-daily-task-delivery-2026-08-07

permissions:
  contents: write

concurrency:
  group: apply-lesson-daily-task-delivery-v2
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sparse checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/lesson-daily-task-delivery-2026-08-07
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /app/
            /components/
            /constants/
            /contexts/
            /hooks/
            /services/
            /utils/
            /lib/
            /modules/
            /tests/
            /package.json
            /package-lock.json
            /jest.config.js
            /jest.setup.js
            /babel.config.js
            /tsconfig.json

      - name: Recover audited Daily Challenge core patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/daily_tasks.ts)" = "d9dc22bc341f3313607a2551132a6a1c4235a1de"
          test "$(git hash-object app/lesson1.tsx)" = "c76c1261492888cad4eb3ac67b9a5a8fd9744b7c"
          python <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/apply-lesson-daily-task-delivery.yml').read_text().splitlines()
          step = next(i for i, line in enumerate(lines) if line.strip() == '- name: Verify source blobs and apply durable delivery patch')
          run_line = next(i for i in range(step + 1, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name:'))
          command = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[run_line + 1:end]
          ) + '\n'
          lesson_start = command.index("lesson_path = Path('app/lesson1.tsx')")
          command = command[:lesson_start] + "PY\n"
          Path('/tmp/apply-daily-core.sh').write_text(command)
          PY
          bash /tmp/apply-daily-core.sh

      - name: Apply lesson boundary delivery and blocking retry
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('app/lesson1.tsx')
          source = path.read_text()

          old_import = "import { getTodayKey, pruneDatedDailyTasksStorageKeys, resetAndUpdateTaskProgress, updateMultipleTaskProgress, updateTaskProgress } from './daily_tasks';"
          new_import = "import { deliverDailyTaskProgressEvent, getTodayKey, pruneDatedDailyTasksStorageKeys, resetAndUpdateTaskProgress, updateMultipleTaskProgress, updateTaskProgress } from './daily_tasks';"
          if source.count(old_import) != 1:
              raise SystemExit('lesson daily-task import marker drifted')
          source = source.replace(old_import, new_import, 1)

          old_ref = "  const cycleEndCallbackRef = useRef<(() => void) | null>(null);\n"
          new_ref = "  const cycleEndCallbackRef = useRef<(() => void | Promise<void>) | null>(null);\n  const cycleEndContinueInFlightRef = useRef(false);\n"
          if source.count(old_ref) != 1:
              raise SystemExit('cycle callback ref marker drifted')
          source = source.replace(old_ref, new_ref, 1)

          delivery_start = source.index("        updateMultipleTaskProgress(\n          lessonFinishUpdates,")
          delivery_end = source.index("        void bumpStatsDaily('lessons_completed', 1, studyTargetRef.current);", delivery_start)
          delivery_block = '''        const finishDailyTaskEventId = [
            'lesson-finish',
            finishTodayKey,
            safeProgressEventPart(studyTargetRef.current),
            safeProgressEventPart(lessonId),
            safeProgressEventPart(nextAttemptId),
          ].join(':');
          const startLessonFinishDelivery = () => deliverDailyTaskProgressEvent(
            finishDailyTaskEventId,
            lessonFinishUpdates,
            { studyTarget: studyTargetRef.current },
          );
          let lessonFinishDeliveryPromise = startLessonFinishDelivery();
          void lessonFinishDeliveryPromise.catch((deliveryError) => {
            void trackFeatureError('lesson', 'daily_task_delivery', deliveryError, {
              lessonId,
              finishDailyTaskEventId,
            }, 'lesson1');
          });
          '''.replace('          ', '')
          source = source[:delivery_start] + delivery_block + source[delivery_end:]

          assignment_start = source.index("        const hasErrors = np.some(x => x !== 'correct' && x !== 'replay_correct');")
          assignment_end_marker = "        setShowCycleEndModal(true);"
          assignment_end = source.index(assignment_end_marker, assignment_start) + len(assignment_end_marker)
          assignment_block = '''        const finalizeLessonCompletion = async () => {
            try {
              try {
                await lessonFinishDeliveryPromise;
              } catch {
                // The first attempt starts while the learner reads the completion modal.
                // A failed Continue performs one explicit retry with the same event id.
                lessonFinishDeliveryPromise = startLessonFinishDelivery();
                await lessonFinishDeliveryPromise;
              }
            } catch (deliveryError) {
              void trackFeatureError('lesson', 'daily_task_delivery_retry', deliveryError, {
                lessonId,
                finishDailyTaskEventId,
              }, 'lesson1');
              emitAppEvent('action_toast', {
                type: 'error',
                messageRu: 'Урок завершён, но вызовы не сохранились. Нажми «Продолжить» ещё раз.',
                messageUk: 'Урок завершено, але виклики не збереглися. Натисни «Продовжити» ще раз.',
                messageEs: 'La lección terminó, pero los desafíos no se guardaron. Pulsa «Continuar» otra vez.',
              });
              return;
            }
            setShowCycleEndModal(false);
            cycleEndCallbackRef.current = null;
            navigate();
          };

          const hasErrors = np.some(x => x !== 'correct' && x !== 'replay_correct');
          cycleEndContinueInFlightRef.current = false;
          cycleEndCallbackRef.current = finalizeLessonCompletion;
          setCycleEndHasErrors(hasErrors);
          setShowCycleEndModal(true);'''.replace('          ', '')
          source = source[:assignment_start] + assignment_block + source[assignment_end:]

          close_start = source.index("      onClose={() => {\n        setShowCycleEndModal(false);")
          close_end_marker = "      }}"
          close_end = source.index(close_end_marker, close_start) + len(close_end_marker)
          close_block = '''      onClose={() => {
            const callback = cycleEndCallbackRef.current;
            if (!callback || cycleEndContinueInFlightRef.current) return;
            cycleEndContinueInFlightRef.current = true;
            void Promise.resolve(callback()).finally(() => {
              cycleEndContinueInFlightRef.current = false;
            });
          }}'''.replace('          ', '')
          source = source[:close_start] + close_block + source[close_end:]
          path.write_text(source)
          PY

      - name: Add focused delivery tests
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          Path('tests/daily_task_progress_event_delivery.test.ts').write_text("""import AsyncStorage from '@react-native-async-storage/async-storage';
          import {
            deliverDailyTaskProgressEvent,
            getTodayKey,
            getTodayTasksSafe,
            loadTodayProgress,
          } from '../app/daily_tasks';
          import { dailyTasksAdminOverrideKey, dailyTasksProgressKey } from '../app/target_storage_keys';

          jest.mock('@react-native-async-storage/async-storage');
          jest.mock('../app/config', () => ({ IS_EXPO_GO: true, CLOUD_SYNC_ENABLED: false }));
          jest.mock('../app/debug-logger', () => ({ DebugLogger: { error: jest.fn() } }));
          jest.mock('../app/events', () => ({ emitAppEvent: jest.fn() }));
          jest.mock('../app/premium_guard', () => ({ getVerifiedPremiumStatus: jest.fn(async () => false) }));
          jest.mock('../app/shards_system', () => ({ getShardsBalance: jest.fn(async () => 100) }));
          jest.mock('../app/active_recall', () => ({ countDueItemsToday: jest.fn(async () => 100) }));
          jest.mock('../app/trainer_store', () => ({
            getTrainerCounts: jest.fn(async () => ({ words: 100, phrases: 100, arena: 0 })),
          }));
          jest.mock('../app/lifetime_profile_stats', () => ({ bumpDailyTaskClaimed: jest.fn() }));

          const storage: Record<string, string> = {};

          function installStorageMocks(): void {
            (AsyncStorage.getItem as jest.Mock).mockImplementation((key: string) =>
              Promise.resolve(storage[key] ?? null));
            (AsyncStorage.setItem as jest.Mock).mockImplementation((key: string, value: string) => {
              storage[key] = value;
              return Promise.resolve();
            });
            (AsyncStorage.multiGet as jest.Mock).mockImplementation((keys: string[]) =>
              Promise.resolve(keys.map((key) => [key, storage[key] ?? null])));
            (AsyncStorage.multiSet as jest.Mock).mockImplementation((pairs: Array<[string, string]>) => {
              pairs.forEach(([key, value]) => { storage[key] = value; });
              return Promise.resolve();
            });
            (AsyncStorage.removeItem as jest.Mock).mockImplementation((key: string) => {
              delete storage[key];
              return Promise.resolve();
            });
            (AsyncStorage.multiRemove as jest.Mock).mockImplementation((keys: string[]) => {
              keys.forEach((key) => delete storage[key]);
              return Promise.resolve();
            });
            (AsyncStorage.getAllKeys as jest.Mock).mockImplementation(() => Promise.resolve(Object.keys(storage)));
          }

          beforeEach(() => {
            jest.clearAllMocks();
            Object.keys(storage).forEach((key) => delete storage[key]);
            installStorageMocks();
            storage.user_total_xp = '0';
            storage[dailyTasksAdminOverrideKey()] = JSON.stringify({
              dayKey: getTodayKey(),
              taskIds: ['da1'],
            });
          });

          async function lessonCompleteProgress(): Promise<number> {
            const tasks = await getTodayTasksSafe();
            expect(tasks.map((task) => task.id)).toEqual(['da1']);
            const progress = await loadTodayProgress(tasks);
            return progress.find((row) => row.taskId === 'da1')?.current ?? -1;
          }

          describe('durable Daily Challenge progress events', () => {
            it('applies the same lesson-finish event exactly once', async () => {
              const eventId = `lesson-finish:${getTodayKey()}:en:1:attempt_1`;
              await expect(deliverDailyTaskProgressEvent(eventId, [
                { type: 'lesson_complete', increment: 1 },
              ])).resolves.toBe('applied');
              await expect(deliverDailyTaskProgressEvent(eventId, [
                { type: 'lesson_complete', increment: 1 },
              ])).resolves.toBe('already-applied');
              await expect(lessonCompleteProgress()).resolves.toBe(1);
            });

            it('replays a prepared event without double increment after the progress write failed', async () => {
              const tasks = await getTodayTasksSafe();
              await loadTodayProgress(tasks);
              const progressKey = dailyTasksProgressKey(getTodayKey());
              const eventId = `lesson-finish:${getTodayKey()}:en:1:attempt_2`;
              let failProgressOnce = true;
              (AsyncStorage.setItem as jest.Mock).mockImplementation((key: string, value: string) => {
                if (key === progressKey && failProgressOnce) {
                  failProgressOnce = false;
                  return Promise.reject(new Error('progress_write_failed'));
                }
                storage[key] = value;
                return Promise.resolve();
              });

              await expect(deliverDailyTaskProgressEvent(eventId, [
                { type: 'lesson_complete', increment: 1 },
              ])).rejects.toThrow('progress_write_failed');

              installStorageMocks();
              await expect(deliverDailyTaskProgressEvent(eventId, [
                { type: 'lesson_complete', increment: 1 },
              ])).resolves.toBe('applied');
              await expect(lessonCompleteProgress()).resolves.toBe(1);
            });

            it('recovers a prepared event when Daily Challenges load after an interrupted delivery', async () => {
              const tasks = await getTodayTasksSafe();
              await loadTodayProgress(tasks);
              const progressKey = dailyTasksProgressKey(getTodayKey());
              const eventId = `lesson-finish:${getTodayKey()}:en:1:attempt_3`;
              (AsyncStorage.setItem as jest.Mock).mockImplementation((key: string, value: string) => {
                if (key === progressKey) return Promise.reject(new Error('disk_full'));
                storage[key] = value;
                return Promise.resolve();
              });

              await expect(deliverDailyTaskProgressEvent(eventId, [
                { type: 'lesson_complete', increment: 1 },
              ])).rejects.toThrow('disk_full');

              installStorageMocks();
              await expect(lessonCompleteProgress()).resolves.toBe(1);
              await expect(deliverDailyTaskProgressEvent(eventId, [
                { type: 'lesson_complete', increment: 1 },
              ])).resolves.toBe('applied');
              await expect(lessonCompleteProgress()).resolves.toBe(1);
            });
          });
          """.replace('          ', ''))

          Path('tests/lesson_completion_daily_task_delivery_contract.test.ts').write_text("""import fs from 'fs';
          import path from 'path';

          const ROOT = path.resolve(__dirname, '..');
          const daily = fs.readFileSync(path.join(ROOT, 'app/daily_tasks.ts'), 'utf8').replace(/\\r\\n/g, '\\n');
          const lesson = fs.readFileSync(path.join(ROOT, 'app/lesson1.tsx'), 'utf8').replace(/\\r\\n/g, '\\n');

          describe('lesson completion Daily Challenge delivery', () => {
            it('prepares an idempotent target journal before writing progress', () => {
              const start = daily.indexOf('export const deliverDailyTaskProgressEvent');
              const end = daily.indexOf('// ── Главная функция', start);
              const body = daily.slice(start, end);
              const prepare = body.indexOf("'daily_task_progress_event_not_prepared'");
              const progress = body.indexOf('await saveTodayProgressStrict(current');
              const finalize = body.indexOf("'daily_task_progress_event_not_finalized'");

              expect(prepare).toBeGreaterThanOrEqual(0);
              expect(progress).toBeGreaterThan(prepare);
              expect(finalize).toBeGreaterThan(progress);
              expect(body).toContain('mergeProgressAtLeast(current, entry.targetRows)');
            });

            it('starts delivery while the completion modal is visible and retries the same event on Continue', () => {
              expect(lesson).toContain('const finishDailyTaskEventId = [');
              expect(lesson).toContain('let lessonFinishDeliveryPromise = startLessonFinishDelivery();');
              expect(lesson).toContain('lessonFinishDeliveryPromise = startLessonFinishDelivery();');
              expect(lesson).toContain('cycleEndCallbackRef.current = finalizeLessonCompletion;');
              expect(lesson).not.toContain('updateMultipleTaskProgress(\\n          lessonFinishUpdates,');
            });

            it('does not close or navigate until delivery succeeds', () => {
              const start = lesson.indexOf('const finalizeLessonCompletion = async');
              const end = lesson.indexOf('const hasErrors =', start);
              const body = lesson.slice(start, end);
              const awaitDelivery = body.indexOf('await lessonFinishDeliveryPromise;');
              const close = body.indexOf('setShowCycleEndModal(false);');
              const navigate = body.indexOf('navigate();');

              expect(awaitDelivery).toBeGreaterThanOrEqual(0);
              expect(close).toBeGreaterThan(awaitDelivery);
              expect(navigate).toBeGreaterThan(close);
              expect(body).toContain('Нажми «Продолжить» ещё раз');
            });

            it('guards double taps on the modal Continue button synchronously', () => {
              expect(lesson).toContain('const cycleEndContinueInFlightRef = useRef(false);');
              expect(lesson).toContain('if (!callback || cycleEndContinueInFlightRef.current) return;');
              expect(lesson).toContain('cycleEndContinueInFlightRef.current = true;');
            });
          });
          """.replace('          ', ''))
          PY

      - name: Static and parse validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python <<'PY'
          from pathlib import Path
          daily = Path('app/daily_tasks.ts').read_text()
          lesson = Path('app/lesson1.tsx').read_text()
          assert 'export const deliverDailyTaskProgressEvent' in daily
          assert 'daily_task_progress_event_not_prepared' in daily
          assert 'daily_task_progress_event_not_finalized' in daily
          assert 'mergeProgressDeliveryJournalTargets' in daily
          assert 'await saveTodayProgressStrict(applied.progress' in daily
          assert 'let lessonFinishDeliveryPromise = startLessonFinishDelivery();' in lesson
          assert 'cycleEndCallbackRef.current = finalizeLessonCompletion;' in lesson
          assert 'updateMultipleTaskProgress(\n          lessonFinishUpdates,' not in lesson
          PY
          npx --yes esbuild@0.25.8 app/daily_tasks.ts --bundle --loader:.ts=ts --format=esm --outfile=/tmp/daily_tasks.js --external:'*'
          npx --yes esbuild@0.25.8 app/lesson1.tsx --bundle --loader:.tsx=tsx --format=esm --outfile=/tmp/lesson1.js --external:'*'
          npx --yes esbuild@0.25.8 tests/daily_task_progress_event_delivery.test.ts --bundle --loader:.ts=ts --format=cjs --outfile=/tmp/delivery_test.js --external:'*'
          npx --yes esbuild@0.25.8 tests/lesson_completion_daily_task_delivery_contract.test.ts --bundle --loader:.ts=ts --format=cjs --outfile=/tmp/delivery_contract.js --external:'*'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused regression suites
        run: |
          npx jest --no-cache --runInBand --runTestsByPath \
            tests/daily_task_progress_event_delivery.test.ts \
            tests/lesson_completion_daily_task_delivery_contract.test.ts \
            tests/daily_task_reroll.test.ts \
            tests/daily_tasks_claim.test.ts

      - name: Commit product-only result and remove workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-lesson-daily-task-delivery.yml
          git rm .github/workflows/apply-lesson-daily-task-delivery-v2.yml
          git add \
            app/daily_tasks.ts \
            app/lesson1.tsx \
            tests/daily_task_progress_event_delivery.test.ts \
            tests/lesson_completion_daily_task_delivery_contract.test.ts
          git diff --cached --check
          git diff --cached --name-only \
            | grep -v '^.github/workflows/apply-lesson-daily-task-delivery' \
            | sort > /tmp/actual.txt
          printf '%s\n' \
            app/daily_tasks.ts \
            app/lesson1.tsx \
            tests/daily_task_progress_event_delivery.test.ts \
            tests/lesson_completion_daily_task_delivery_contract.test.ts \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make lesson Daily Challenge delivery durable'
          git push origin HEAD:fix/lesson-daily-task-delivery-2026-08-07
