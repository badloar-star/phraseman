# Opens Lesson 1 words training and taps the correct option. Guards against
# crashes where a delayed queue transition tries to read `word` from an
# undefined queue entry after answering.
appId: app.phraseman
---
- runFlow: ../../dev_only/lesson_words_short_contract.yaml
- tapOn:
    id: "lesson-words-option-correct"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "lesson-words-training"
- assertNotVisible:
    id: "lesson-words-complete"
- assertNotVisible:
    text: "Cannot read property 'word' of undefined"
- assertNotVisible:
    text: "Uncaught Error"
