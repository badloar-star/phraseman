appId: app.phraseman
---
- runFlow: ../../_shared/open_dev_client.yaml
- runFlow: ../../_dismiss_bug_hunt.yaml
- runFlow: ../../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "50%,92%"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../_precondition.yaml
- tapOn:
    id: "tab-friends"
- extendedWaitUntil:
    visible:
      id: "screen-friends"
    timeout: 30000
- assertVisible:
    id: "friends-row-.*"
- tapOn:
    id: "tab-arena"
- extendedWaitUntil:
    visible:
      id: "screen-arena-lobby"
    timeout: 30000
- tapOn:
    id: "arena-play-with-friend"
- extendedWaitUntil:
    visible:
      id: "arena-friend-pick-.*"
    timeout: 30000
- tapOn:
    id: "arena-friend-pick-.*"
- extendedWaitUntil:
    visible:
      id: "arena-send-friend-invite-.*"
    timeout: 15000
- tapOn:
    id: "arena-send-friend-invite-.*"
