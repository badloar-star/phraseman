<style>
/* ───────── Разбор отличий паритета «приложение = макет» (25.10) ─────────
   зачем (координатор 25.10): по каждой строке status_diff гейта — пара «макет / приложение» и рекомендация Макетов, что правда:
   макет (чиним приложение) или приложение (обновляем эталон с причиной). Третья кнопка — «переснять»: отличия по сути нет,
   кадр снят не в том состоянии. Выбор владельца хранится в этом браузере; «Скопировать решения» — текст для координатора.
   Строки: 66 строк выпуска R1 вне отложенной сортировки (b_reshoot / c_owner_decides / d_mockup_stale) из
   docs/phraseman-2.0/registries/visual_parity.json. Картинки — сжатые копии склеек docs/phraseman-2.0/evidence/parity/*.png.
   Собрано скриптом из реестра; страницу руками не править — пересобрать. */
@font-face { font-family: 'Inter'; src: url('fonts/Inter-Regular.ttf') format('truetype'); font-weight: 400 500; }
@font-face { font-family: 'Inter'; src: url('fonts/Inter-SemiBold.ttf') format('truetype'); font-weight: 600; }
@font-face { font-family: 'Inter'; src: url('fonts/Inter-Bold.ttf') format('truetype'); font-weight: 700; }
:root { --bg: #111215; --card: #1A1C21; --card2: #22252B; --tx: #EEEFF2; --sec: #A4A7B1; --mut: #757884;
  --m: #F2A35E; --mBg: rgba(242, 163, 94, .14); --a: #6FC7F0; --aBg: rgba(111, 199, 240, .14); --r: #A9ADB8; --rBg: rgba(169, 173, 184, .12); --ok: #7FD69A; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
.pr-top { position: sticky; top: 0; z-index: 5; background: rgba(17, 18, 21, .94); backdrop-filter: blur(12px); padding: 18px 32px 14px; box-shadow: 0 10px 24px -18px rgba(0, 0, 0, .9); }
.pr-h1 { margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -.2px; }
.pr-lead { margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--sec); max-width: 1100px; }
.pr-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; }
.pr-stat { font-size: 15px; font-weight: 600; color: var(--sec); }
.pr-stat b { color: var(--tx); font-variant-numeric: tabular-nums; }
.pr-seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--card); gap: 2px; }
.pr-seg button, .pr-btn { all: unset; cursor: pointer; white-space: nowrap; height: 34px; padding: 0 14px; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; color: var(--sec); transition: background-color 160ms ease, color 160ms ease, transform 120ms ease-out; }
.pr-seg button[aria-pressed="true"] { background: #33363E; color: var(--tx); }
.pr-btn { background: var(--card2); color: var(--tx); height: 38px; border-radius: 11px; }
.pr-btn:hover { background: #2C2F36; }
.pr-seg button:active, .pr-btn:active, .pr-pick button:active { transform: scale(.97); }
button:focus-visible { outline: 2px solid #8FB4FF; outline-offset: 2px; }
.pr-list { padding: 20px 32px 60px; display: flex; flex-direction: column; gap: 22px; }
.pr-group { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--mut); margin: 14px 0 -8px; }
.pr-row { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 22px; padding: 18px; border-radius: 18px; background: var(--card); box-shadow: 0 14px 30px -22px rgba(0, 0, 0, .9); }
.pr-row.done { background: #181A1E; }

.pr-shot img { display: block; width: 100%; height: auto; }
.pr-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pr-id { font-size: 13px; font-weight: 700; color: var(--mut); letter-spacing: .4px; }
.pr-title { font-size: 18px; line-height: 24px; font-weight: 700; }
.pr-mock { font-size: 13px; line-height: 18px; color: var(--mut); }
.pr-rec { border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 21px; }

.pr-rec.m { background: var(--mBg); } .pr-rec.m b { color: var(--m); }
.pr-rec.a { background: var(--aBg); } .pr-rec.a b { color: var(--a); }
.pr-rec.r { background: var(--rBg); } .pr-rec.r b { color: var(--r); }
.pr-diffs { margin: 0; padding-left: 18px; font-size: 13px; line-height: 19px; color: var(--sec); }
.pr-diffs li + li { margin-top: 5px; }
details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--sec); }
.pr-pick { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.pr-pick button { all: unset; cursor: pointer; min-height: 42px; padding: 8px 14px; border-radius: 11px; background: var(--card2); color: var(--tx); font-size: 14px; line-height: 19px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: background-color 160ms ease, transform 120ms ease-out, box-shadow 160ms ease; }
.pr-pick button:hover { background: #2C2F36; }
.pr-pick button .rc { font-size: 12px; font-weight: 600; color: var(--mut); }
.pr-pick button[aria-pressed="true"][data-v="m"] { background: var(--mBg); box-shadow: inset 0 0 0 1px rgba(242, 163, 94, .45); }
.pr-pick button[aria-pressed="true"][data-v="a"] { background: var(--aBg); box-shadow: inset 0 0 0 1px rgba(111, 199, 240, .45); }
.pr-pick button[aria-pressed="true"][data-v="r"] { background: var(--rBg); box-shadow: inset 0 0 0 1px rgba(169, 173, 184, .4); }
.pr-pick button[aria-pressed="true"]::after { content: "✓"; color: var(--ok); font-weight: 700; }
.pr-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); opacity: 0; padding: 12px 18px; border-radius: 12px; background: #2B2E35; color: var(--tx);
  font-size: 14px; font-weight: 600; transition: opacity 180ms ease, transform 220ms cubic-bezier(0.23, 1, 0.32, 1); pointer-events: none; }
.pr-toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 1100px) { .pr-row { grid-template-columns: 1fr; } .pr-top, .pr-list { padding-left: 16px; padding-right: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="pr-top">
  <h1 class="pr-h1">Разбор отличий: макет или приложение</h1>
  <p class="pr-lead">По каждой строке — слева макет, справа приложение. Выбери, что правда. «Макет» — чиним приложение. «Приложение» — обновляем эталон. «Переснять» — отличия по сути нет, кадр снят не в том состоянии.</p>
  <div class="pr-bar">
    <span class="pr-stat">Выбрано <b id="cnt-done">0</b> из <b id="cnt-all">0</b></span>
    <span class="pr-stat">Рекомендую: макет <b id="cnt-m">0</b> · приложение <b id="cnt-a">0</b> · переснять <b id="cnt-r">0</b></span>
    <span class="pr-seg" role="group" aria-label="Показать"><button data-f="decide" aria-pressed="true">Нужен выбор</button><button data-f="r" aria-pressed="false">Переснять</button><button data-f="all" aria-pressed="false">Все</button><button data-f="open" aria-pressed="false">Не выбрано</button></span>
    <button class="pr-btn" id="accept">Согласен с рекомендациями в невыбранных</button>
    <button class="pr-btn" id="copy">Скопировать решения</button>
  </div>
</header>
<main class="pr-list" id="list"></main>
<div class="pr-toast" id="toast" role="status" aria-live="polite"></div>

const ITEMS = [{"id":"cards-018","rec":"r","why":"Экран верный. Одна колонка вместо двух — это положение ползунка масштаба перед съёмкой, плюс кадр на украинском.","img":"parity-diff-review/cards-018.webp","w":1400,"h":1013,"title":"Набор · До добавления · лайк раньше времени","mock":"cards-v2.html · телефон 15","diffs":["вид карточек: 1 столбец (ползунок вправо), в образце сетка 2 столбца","[язык] кадр на uk — переснять на ru"]},{"id":"cards-019","rec":"r","why":"То же: шапка, кнопки и тост совпали, колонки — положение ползунка. Переснять на русском.","img":"parity-diff-review/cards-019.webp","w":1400,"h":1013,"title":"Набор · Добавлен · отклик","mock":"cards-v2.html · телефон 16","diffs":["вид карточек: 1 столбец, в образце сетка 2 столбца","[язык] кадр на uk — переснять на ru"]},{"id":"cards-022","rec":"r","why":"Снято не то состояние (шторка «Новая карточка» вместо редактора). Сравнивать нечего.","img":"parity-diff-review/cards-022.webp","w":1400,"h":1013,"title":"Редактор карточки и создание набора · Правка · дубликат","mock":"cards-v2.html · телефон 24","diffs":["[состояние] в образце №24 полноэкранный редактор с живым превью карточки — нужна ссылка dev_state на это состояние","нет карточки-превью над полями","[язык] кадр на uk — переснять на ru"]},{"id":"cards-046","rec":"r","why":"Состав и тексты совпали, мешает только клавиатура на кадре.","img":"parity-diff-review/cards-046.webp","w":1400,"h":1013,"title":"Мои наборы — остальные состояния · Поиск — ничего не найдено","mock":"cards-v2.html · телефон 66","diffs":["[кадр: экранная клавиатура] Клавиатура ОС на кадре — спрятать перед съёмкой (hidekb); в образце её нет."]},{"id":"cards-053","rec":"r","why":"На кадре другой экран: нет тестового чужого набора с откликами. Нужна подмена Ядра.","img":"parity-diff-review/cards-053.webp","w":1400,"h":1003,"title":"Отклик, лайк и жалобы · Меню автора: закрепить / скрыть","mock":"cards-states.html · телефон 47","diffs":["[состояние не то] Открыт список «Мои наборы», а не нужное состояние; ссылка ведёт только на список (шагов нет — «дальше тапами»).","Нужен ЧУЖОЙ опубликованный набор с откликами и открытая шторка «Отклик»; в demo_published есть только свои наборы — подмены чужого набора и откликов нет (запрос Ядру: подмена «чужой набор + отклики»). Плюс: меню автора — только для автора набора."]},{"id":"cards-057","rec":"r","why":"Как выше: нет тестового чужого набора с откликами — снять нельзя.","img":"parity-diff-review/cards-057.webp","w":1400,"h":1003,"title":"Отклик, лайк и жалобы · Жалоба на комментарий","mock":"cards-states.html · телефон 51","diffs":["[состояние не то] Открыт список «Мои наборы», а не нужное состояние; ссылка ведёт только на список (шагов нет — «дальше тапами»).","Нужен ЧУЖОЙ опубликованный набор с откликами и открытая шторка «Отклик»; в demo_published есть только свои наборы — подмены чужого набора и откликов нет (запрос Ядру: подмена «чужой набор + отклики»). Далее тап «⋯» → «Пожаловаться»."]},{"id":"cards-058","rec":"r","why":"Состояние достигается только реальной жалобой в прод. Нужна подмена результата отправки.","img":"parity-diff-review/cards-058.webp","w":1400,"h":1003,"title":"Отклик, лайк и жалобы · Жалоба на комментарий отправлена","mock":"cards-states.html · телефон 52","diffs":["[состояние не то] Открыт список «Мои наборы», а не нужное состояние; ссылка ведёт только на список (шагов нет — «дальше тапами»).","Состояние достигается только реальной записью в прод (публичный отклик / жалоба модераторам) — без «да» владельца не снимать; нужна подмена результата отправки (session_result-подобная)."]},{"id":"cards-059","rec":"r","why":"Как выше: нужна подмена результата отправки жалобы.","img":"parity-diff-review/cards-059.webp","w":1400,"h":1003,"title":"Отклик, лайк и жалобы · Жалоба на набор отправлена","mock":"cards-states.html · телефон 53","diffs":["[состояние не то] Открыт список «Мои наборы», а не нужное состояние; ссылка ведёт только на список (шагов нет — «дальше тапами»).","Состояние достигается только реальной записью в прод (публичный отклик / жалоба модераторам) — без «да» владельца не снимать; нужна подмена результата отправки (session_result-подобная)."]},{"id":"cards-064","rec":"r","why":"Состав совпал; на кадре форма ещё пустая и открыта клавиатура.","img":"parity-diff-review/cards-064.webp","w":1400,"h":1013,"title":"Редактор карточки — все состояния · Сохранено","mock":"cards-v2.html · телефон 24","diffs":["[состояние не то] Форма пустая («Слово», поле пусто), «Добавить» неактивна; в образце заполнено «Layover / пересадка» и кнопка активна — нужны шаги ввода (Сверка).","[кадр: экранная клавиатура] Клавиатура ОС на кадре — спрятать перед съёмкой (hidekb); в образце её нет."]},{"id":"cards-065","rec":"r","why":"Состав совпал. В кадре закрытый набор, в макете опубликованный — снять опубликованный.","img":"parity-diff-review/cards-065.webp","w":1400,"h":1013,"title":"Создание набора — все состояния · Правка своего набора","mock":"cards-v2.html · телефон 23","diffs":["[состояние не то] В приложении приватный набор «Работа»: «Только я» выбрано (белая плашка), переключатель активен; в образце №23 — опубликованный набор («Все» выбрано, сегмент приглушён) — нужен образец приватной правки или другой набор в кадре (Макеты/Сверка).","[данные] «Работа», 22 карточки, B1 против «Мой опубликованный», 10 карточек."]},{"id":"cards-066","rec":"r","why":"Снято не то состояние (шторка поверх «Нового набора»).","img":"parity-diff-review/cards-066.webp","w":1400,"h":1013,"title":"Создание набора — все состояния · Только для меня","mock":"cards-v2.html · телефон 22","diffs":["[состояние] нужна съёмка самого экрана «Новый набор» с выбранным «Только я»","переключатель «Только я» серый приглушённый, в образце белый","название пустое, карточек 0","[язык] кадр на uk — переснять на ru"]},{"id":"cards-071","rec":"r","why":"На кадре «Сохранённые», а не создание набора на 50 карточек.","img":"parity-diff-review/cards-071.webp","w":1400,"h":1003,"title":"Создание набора — все цели из 3» и плашка «+30 монет» — как в макете. Кнопки снять после 4 с.","img":"parity-diff-review/moments-v3-m18-a.webp","w":1080,"h":2400,"title":"Итог диалога · «{Имя} думает…» → реакция (≥1,0 с) → каскад целей по 300 мс → +монеты → цифры → кнопки","mock":"engagement-moments-v3-all.html","diffs":["Заголовок / подпись: в эталоне «Эмма довольна» / «Закажи кофе · 3 цели из 3»; в приложении «Эмма: отлично!» / «Закажи кофе · 5 из 5».","Список целей: в эталоне строки с разделителями, в приложении без разделителей.","«+30 монет»: в эталоне серая плашка-строка с монетой; в приложении крупная надпись «+30» без плашки.","Кнопки «Следующий сценарий» и «Разобрать 2 фразы» на кадре отсутствуют (каскад ещё идёт или их нет) — нужен кадр после ~4 с."]},{"id":"streak-milestone-d0003","rec":"m","why":"Огонь залит не так, искра стоит, плашка темнее. Детали анимации — по эталону.","img":"parity-diff-review/streak-milestone-d0003.webp","w":1080,"h":2400,"title":"Рубеж серии дней — окно поверх итога · серия стала 3 дней","mock":"engagement-moments-v3-all.html","diffs":["Огонь в тосте: в эталоне залитый светло-мятный с тёмной сердцевиной (заливка 3/10 мягким градиентом по всему силуэту), в приложении контур с заливкой только нижней четверти.","Искра: в эталоне точка вылетает над огнём справа сверху; в приложении неподвижная точка на середине высоты между огнём и текстом.","Плашка тоста: в эталоне светлее, серо-бирюзовое стекло; в приложении темнее и зеленее."]},{"id":"streak-milestone-d0014","rec":"m","why":"Искра стоит на месте, плашка темнее — по эталону.","img":"parity-diff-review/streak-milestone-d0014.webp","w":1080,"h":2400,"title":"Рубеж серии дней — окно поверх итога · серия стала 14 дней","mock":"engagement-moments-v3-all.html","diffs":["Искра: в приложении неподвижная точка на середине высоты между огнём и текстом; в эталоне в этом кадре искры нет (вылетает и гаснет над огнём).","Плашка тоста: в приложении темнее и зеленее эталонной серо-бирюзовой."]},{"id":"streak-milestone-d0030","rec":"m","why":"Ореол слишком яркий — в эталоне мягкое тусклое свечение.","img":"parity-diff-review/streak-milestone-d0030.webp","w":1080,"h":2400,"title":"Рубеж серии дней — окно поверх итога · серия стала 30 дней","mock":"engagement-moments-v3-all.html","diffs":["Ореол вокруг огня: в приложении заметно ярче и плотнее — у огня ≈#2A4640 против ≈#19221F–#1A2425 в эталоне на всех тактах 1–8 с (эталон: --acc-soft rgba(126,240,200,.24), пульс opacity .55–1, blur 10px, затухание к 65 % радиуса; приложение: [MOMENT-GLOW] #7EF0C83D, opacity 0,783, size 320). Фон за пределами ореола сов…"]},{"id":"streak-milestone-d0100","rec":"m","why":"Ореол маленький и яркий — в эталоне широкое мягкое.","img":"parity-diff-review/streak-milestone-d0100.webp","w":1080,"h":2400,"title":"Рубеж серии дней — окно поверх итога · серия стала 100 дней","mock":"engagement-moments-v3-all.html","diffs":["Ореол (после 39f5d3c45): цвет теперь зелёный, как в эталоне, но пятно меньше и намного ярче, с ярким центром; в эталоне — широкое мягкое тусклое свечение."]},{"id":"streak-milestone-d0365","rec":"m","why":"В эталоне без ореола и с искрами вокруг огня.","img":"parity-diff-review/streak-milestone-d0365.webp","w":1080,"h":2400,"title":"Рубеж серии дней — окно поверх итога · серия стала 365 дней","mock":"engagement-moments-v3-all.html","diffs":["Ореол: в эталоне его нет (тёмный фон); в приложении яркое мятное пятно за огнём и заголовком.","Искры вокруг огня (4–5 белых точек) в эталоне есть, в приложении нет."]},{"id":"streak-milestone-d1000","rec":"m","why":"Финальный огонь в эталоне золотой и без ореола.","img":"parity-diff-review/streak-milestone-d1000.webp","w":1080,"h":2400,"title":"Рубеж серии дней — окно поверх итога · серия стала 1000 дней","mock":"engagement-moments-v3-all.html","diffs":["Огонь финальной стадии: в эталоне золотой, в приложении белый.","Ореол: в эталоне его нет; в приложении яркое мятное пятно за огнём и заголовком."]}];
const KEY = 'parity-diff-review-2026-10-25';
const LABEL = { m: 'Правда — макет', a: 'Правда — приложение', r: 'Переснять' };
const SUB = { m: 'чиним приложение', a: 'обновляем эталон', r: 'отличия нет' };
const REC_HEAD = { m: 'Рекомендую: макет — чиним приложение', a: 'Рекомендую: приложение — обновить эталон', r: 'Рекомендую: переснять' };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { console.warn('[PARITY-REVIEW] выбор не прочитан из браузера', e); picks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) { console.warn('[PARITY-REVIEW] выбор не сохранён в браузере', e); } };
let filter = 'decide';

function rowHtml(it) {
  const pick = picks[it.id];
  return `<article class="pr-row${pick ? ' done' : ''}" id="row-${it.id}" data-id="${it.id}">
    <a class="pr-shot" href="${it.img}" target="_blank" rel="noopener"><img src="${it.img}" width="${it.w}" height="${it.h}" loading="lazy" alt="Макет и приложение: ${esc(it.title)}"></a>
    <div class="pr-side">
      <div><div class="pr-id">${it.id}</div><div class="pr-title">${esc(it.title)}</div>${it.mock ? `<div class="pr-mock">Макет: ${esc(it.mock)}</div>` : ''}</div>
      <div class="pr-rec ${it.rec}"><b>${REC_HEAD[it.rec]}</b>${esc(it.why)}</div>
      ${it.diffs.length ? `<details${it.rec !== 'r' ? ' open' : ''}><summary>Записанные отличия · ${it.diffs.length}</summary><ul class="pr-diffs">${it.diffs.map((d) => `<li>${esc(d)}</li>`).join('')}</ul></details>` : ''}
      <div class="pr-pick" role="group" aria-label="Что правда">${['m', 'a', 'r'].map((v) => `<button data-v="${v}" aria-pressed="${pick === v}">${LABEL[v]} <span class="rc">${it.rec === v ? 'рекомендую · ' : ''}${SUB[v]}</span></button>`).join('')}</div>
    </div></article>`;
}
function visible(it) {
  if (filter === 'all') return true;
  if (filter === 'open') return !picks[it.id];
  if (filter === 'r') return it.rec === 'r';
  return it.rec !== 'r';
}
function render() {
  const list = document.getElementById('list');
  const shown = ITEMS.filter(visible);
  const groups = filter === 'all' || filter === 'open' ? [['m', 'Рекомендую: чинить приложение'], ['a', 'Рекомендую: обновить эталон'], ['r', 'Рекомендую: переснять']] : null;
  list.innerHTML = groups
    ? groups.map(([k, t]) => { const g = shown.filter((it) => it.rec === k); return g.length ? `<div class="pr-group">${t} · ${g.length}</div>${g.map(rowHtml).join('')}` : ''; }).join('')
    : shown.map(rowHtml).join('');
  if (!shown.length) list.innerHTML = '<p class="pr-lead">Здесь всё выбрано.</p>';
  counts();
}
function counts() {
  document.getElementById('cnt-all').textContent = ITEMS.length;
  document.getElementById('cnt-done').textContent = ITEMS.filter((it) => picks[it.id]).length;
  for (const k of ['m', 'a', 'r']) document.getElementById('cnt-' + k).textContent = ITEMS.filter((it) => it.rec === k).length;
}
function toast(text) { const t = document.getElementById('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); }

// выбор — мгновенно в интерфейсе и в браузере; повторный тап по выбранному снимает выбор
document.getElementById('list').addEventListener('click', (e) => {
  const b = e.target.closest('.pr-pick button'); if (!b) return;
  const row = b.closest('.pr-row'); const id = row.dataset.id; const v = b.dataset.v;
  if (picks[id] === v) delete picks[id]; else picks[id] = v;
  save();
  row.classList.toggle('done', Boolean(picks[id]));
  row.querySelectorAll('.pr-pick button').forEach((x) => x.setAttribute('aria-pressed', String(picks[id] === x.dataset.v)));
  counts();
});
document.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.f; b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); render(); window.scrollTo({ top: 0 });
}));
document.getElementById('accept').addEventListener('click', () => {
  let n = 0; for (const it of ITEMS) if (!picks[it.id]) { picks[it.id] = it.rec; n += 1; }
  save(); render(); toast(n ? `Принято рекомендаций: ${n}` : 'Все строки уже выбраны');
});
document.getElementById('copy').addEventListener('click', async () => {
  const line = (it) => `${it.id} — ${picks[it.id] ? LABEL[picks[it.id]] : 'не выбрано'}${picks[it.id] && picks[it.id] !== it.rec ? ` (рекомендация была: ${LABEL[it.rec]})` : ''}`;
  const text = `Разбор отличий паритета, выбор владельца (${ITEMS.filter((it) => picks[it.id]).length} из ${ITEMS.length}):\n${ITEMS.map(line).join('\n')}`;
  try { await navigator.clipboard.writeText(text); toast('Решения скопированы — отправь координатору'); }
  catch (e) {
    console.warn('[PARITY-REVIEW] буфер обмена недоступен, показываю текст', e);
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;inset:10% 10%;z-index:9;background:#1A1C21;color:#EEE;font:13px/1.5 monospace;padding:12px;border:0;border-radius:12px';
    document.body.appendChild(ta); ta.select(); ta.addEventListener('blur', () => ta.remove()); toast('Выдели и скопируй текст');
  }
});
render();
</script>
