name: Kick screenshot fixes validator

on:
  pull_request_target:
    types: [edited, ready_for_review]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.pull_request.number == 17 &&
      github.event.pull_request.head.ref == 'audit/screenshot-fixes-2026-08-06' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned screenshot validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scheduled-apply-screenshot-fixes.yml --repo "$GITHUB_REPOSITORY" --ref master
