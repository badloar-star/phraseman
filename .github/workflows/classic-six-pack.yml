name: Classic ES 01-06 complete pack
on:
  pull_request:
    branches: [feature/referral-roulette]
    paths:
      - 'content/classic-authoring/grammar/**'
      - '.github/workflows/classic-six-pack.yml'
permissions:
  contents: read
concurrency:
  group: classic-six-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /content/classic-authoring/grammar/
            /app/lesson_intro_screens.tsx
            /app/lesson_intro_screens_lesson*_v2.ts
            /app/lesson_data_types.ts
            /app/lesson_help.tsx
            /app/lesson_help_theory_registry.ts
            /components/lesson_help_theory_ui.tsx
      - name: Archive authoring overlay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: classic-six-source
          path: content/classic-authoring/grammar/classic6
          retention-days: 7
      - name: Compile all six; check offline reader, practice and reference sources
        working-directory: content/classic-authoring/grammar/classic6
        run: |
          set -euo pipefail
          python3 -B build.py "$RUNNER_TEMP/classic-six"
          python3 -B verify.py "$RUNNER_TEMP/classic-six"
          cp -R .. "$RUNNER_TEMP/classic-six/source"
      - name: Save the integrated course
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PhraseMan-Classic-ES-01-06-complete
          path: ${{ runner.temp }}/classic-six
          retention-days: 14
          if-no-files-found: error
