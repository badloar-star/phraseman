<body>
<div class="page">
  <h1>Оформление: светлая / тёмная + оттенок + насыщенность</h1>
  <p class="lead">Все цвета обеих Главных и экрана «Оформление» считаются из двух чисел — оттенка и насыщенности — одной функцией в OKLCH. Фон сцены — тот же расчёт, что в приложении (scene_palette.ts). Кастомные иконки цвет не меняют, всё остальное меняет.</p>

    <button class="chip on" id="plusBtn">Как с Plus: вкл</button>
    <span class="sep"></span>
    <button class="chip" id="refBtn">Наложить кадр приложения</button>
    <button class="chip" id="evBtn" style="display:none"></button>
    <span class="sep"></span>
    <button class="chip" id="pgBtn">Фон страницы: тёмный</button>

<script src="theme_sliders_exact_assets/scene-approved.js"></script>
<script>
(() => {
'use strict';
const LOG = '[THEME-SLIDERS]';
const SA = window.SceneApproved; const C = SA.color; const okRgb = C.okRgb; const hex = C.hex;
const A = 'theme_sliders_exact_assets/';
/* ───────── значки Ionicons (шрифт приложения) ───────── */
const CODE = { flame: 'f314', bell: 'f47f', flash: 'f316', play: 'f4c6', chat: 'f213', copy: 'f290', trend: 'f5fb', clip: 'f248', next: 'f23b', home: 'f382', book: 'f1a6', vid: 'f4ce', ppl: 'f4a3', gear: 'f56c', diamond: 'f2a1', lock: 'f3c7', sun: 'f5ae', moon: 'f461', back: 'f229', refresh: 'f514', check: 'f21d', palette: 'f27e' };
const io = (n) => `<i class="io">&#x${CODE[n]};</i>`;
/* ───────── состояние ───────── */
const STD = { H: 250, S: 35 }; // «Стандартный» = сегодняшний вид по умолчанию (оттенок кадров эмулятора, насыщенность accent C ≈ 0,056)
const st = { ap: 'dark', H: STD.H, S: STD.S, plus: true, set: 'standard', ref: false, pg: 'dark' };
const SETS = [
  { id: 'standard', name: 'Стандартные', tint: true },
  { id: 'aurora', name: 'Аврора', tint: false, dir: 'sets/aurora/home-aurora-' },
  { id: 'sagePorcelain', name: 'Фарфор', tint: false, dir: 'sets/sagePorcelain/home-sagePorcelain-' },
];
/* ───────── ЦВЕТА: одна функция из (оформление, оттенок, насыщенность) — так же будет в коде ───────── */
const ok = (L, c, h) => hex(okRgb(L, Math.max(0, c), ((h % 360) + 360) % 360));
const CMAX = 0.16; // насыщенность 100 % = chroma акцента 0,16; стандарт 35 % ≈ 0,056
function tokens(ap, H, S) {
  const dark = ap === 'dark'; const s = Math.max(S, 4); const Ca = (s / 100) * CMAX; const k = Math.min(3, s / STD.S);
  const n = Math.min(0.05, 1);
  const t = {
    ap, H, S, Ca, accent: ok(dark ? 0.70 : 0.52, Ca, H), accentTint: ok(dark ? 0.70 : 0.55, Ca, H),
    bg: dark ? ok(0.175, 0.015 * k, H + 3) : ok(0.952, 0.012 * k, H - 2),
    card: dark ? ok(0.224, 0.014 * k, H + 3) : ok(0.993, 0.003 * k, H - 2),
    card2: dark ? ok(0.197, 0.013 * k, H - 2) : ok(0.962, 0.010 * k, H + 3),
    ctl: dark ? ok(0.30, 0.020 * k, H + 2) : ok(0.925, 0.011 * k, H),
    raise: dark ? ok(0.31, 0.020 * k, H) : ok(0.985, 0.004 * k, H),
    tab: dark ? ok(0.215, 0.016 * k, H - 25) : ok(0.922, 0.015 * k, H - 30), tabsel: dark ? ok(0.407, 0.022 * k, H) : ok(0.896, 0.013 * k, H - 10),
    tx: dark ? '#F7FAFE' : '#16191C', sec: dark ? ok(0.78, 0.016 * k, H) : ok(0.46, 0.018 * k, H), sec2: dark ? ok(0.72, 0.026 * k, H) : ok(0.48, 0.030 * k, H),
    hair: dark ? 'rgba(255,255,255,.07)' : 'rgba(20,28,40,.08)', solid: dark ? '#F2F6FB' : '#16191C', onsolid: dark ? '#0B0F14' : '#FFFFFF',
  };
  t.acc = dark ? ok(0.72, Ca * 1.1, H) : ok(0.50, Ca * 1.2, H);
  return t;
}
const cssVars = (t) => `--bg:${t.bg};--card:${t.card};--card2:${t.card2};--ctl:${t.ctl};--raise:${t.raise};--tab:${t.tab};--tabsel:${t.tabsel};--tx:${t.tx};--sec:${t.sec};--sec2:${t.sec2};--hair:${t.hair};--solid:${t.solid};--onsolid:${t.onsolid};--acc:${t.acc};` +
  `--sb:${t.ap === 'dark' ? '#fff' : '#fff'};--gest:${t.ap === 'dark' ? 'rgba(255,255,255,.85)' : 'rgba(20,24,30,.7)'};` +
  (t.ap === 'dark' ? '--shc:0 12px 28px -16px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);--sht:0 14px 30px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);--shr:0 6px 14px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)' :
   '--shc:0 12px 30px -16px rgba(40,60,90,.38),inset 0 1px 0 rgba(255,255,255,.9);--sht:0 14px 30px -14px rgba(40,60,90,.35),inset 0 1px 0 rgba(255,255,255,.8);--shr:0 6px 14px -8px rgba(40,60,90,.3),inset 0 1px 0 #fff');
