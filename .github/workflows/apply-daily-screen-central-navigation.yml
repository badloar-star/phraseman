name: Apply Daily Challenges screen navigation fix

on:
  push:
    branches:
      - fix/daily-screen-central-navigation-2026-08-07

permissions:
  contents: write

concurrency:
  group: apply-daily-screen-central-navigation
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/daily-screen-central-navigation-2026-08-07
          fetch-depth: 0

      - name: Verify source blob and apply narrow patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/daily_tasks_screen.tsx)" = "f0757122c6d8b5e6d4529d387d943528ff30a1a3"
          python <<'PY'
          from pathlib import Path

          path = Path('app/daily_tasks_screen.tsx')
          source = path.read_text()

          old_import = "import { claimTaskWithReward, DailyTask, dailyTaskAvailableForStudyTarget, filterDailyTasksForStudyTarget, getTodayTasks, getTodayKey, getArenaComboRequirement, getTodayTasksSafe, loadTodayProgress, TaskProgress, TaskType, rerollDailyTask, getDailyRerollsLeftToday, DAILY_TASK_REROLL_MAX_PER_DAY, } from './daily_tasks';\nimport { LESSONS_WITH_IRREGULAR_VERBS } from './irregular_verbs_data';"
          new_import = "import { claimTaskWithReward, DailyTask, filterDailyTasksForStudyTarget, getTodayTasks, getTodayKey, getArenaComboRequirement, getTodayTasksSafe, loadTodayProgress, TaskProgress, TaskType, rerollDailyTask, getDailyRerollsLeftToday, DAILY_TASK_REROLL_MAX_PER_DAY, } from './daily_tasks';\nimport { navigateDailyTask } from './daily_task_navigation';"
          if source.count(old_import) != 1:
              raise SystemExit('daily_tasks import marker drifted')
          source = source.replace(old_import, new_import, 1)

          obsolete_imports = [
              "import { primeLessonScreenFromStorage } from './lesson_screen_bootstrap';\n",
              "import { dailyTasksAchievementAllDoneStreakKey, lastOpenedLessonKey, storageStudyTarget } from './target_storage_keys';\n",
              "import { dailyPhraseContentAvailableForTarget, frenchDailyPhraseGateCopy } from './daily_phrase_target_gate';\n",
              "import { flashcardsSourceGatedContentAvailableForTarget, frenchFlashcardsGateCopy } from './flashcards_target_gate';\n",
              "import { frenchLessonRuntimeAvailableForTarget } from './french_content_source_gate';\n",
              "import { lessonSupportContentAvailableForTarget } from './lesson_support_target_gate';\n",
              "import { diagnosticContentAvailableForTarget, frenchDiagnosticGateCopy } from './diagnostic_target_gate';\n",
              "import { frenchTrainerGateCopy, trainerSessionContentAvailableForTarget } from './trainer_target_gate';\n",
              "import { getVerifiedPremiumStatus } from './premium_guard';\n",
              "import type { TrainerSessionRoute } from './trainer_session';\n",
              "import { startReservedTrainerSession } from './trainer_session_navigation';\n",
              "import { frenchVocabularyGateCopy, vocabularyContentAvailableForTarget, type VocabularyGateSurface } from './vocabulary_target_gate';\n",
          ]
          for item in obsolete_imports:
              if source.count(item) != 1:
                  raise SystemExit(f'import marker drifted: {item.strip()}')
              source = source.replace(item, '', 1)

          insert_after = "import { dailyTaskBackgroundArt } from './daily_task_background_art';\n"
          if source.count(insert_after) != 1:
              raise SystemExit('target-storage insertion marker drifted')
          source = source.replace(
              insert_after,
              insert_after + "import { dailyTasksAchievementAllDoneStreakKey } from './target_storage_keys';\n",
              1,
          )

          lock_line = "    const trainerSessionStartLockRef = useRef(false);\n"
          if source.count(lock_line) != 1:
              raise SystemExit('trainer lock marker drifted')
          source = source.replace(lock_line, '', 1)

          start_marker = "    const handleTaskNav = async (task: DailyTask) => {"
          end_marker = "    // Сортировка: готово к награде → в процессе → завершено"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end <= start:
              raise SystemExit('navigation handler markers drifted')
          replacement = """    // Один источник маршрутизации для карточки, модалки и любых будущих entry point.\n    // Центральный helper содержит проверенные пути /review, autoPractice и доступность уроков.\n    const handleTaskNav = useCallback(async (task: DailyTask) => {\n        await navigateDailyTask({ lang, router, studyTarget, task });\n    }, [lang, router, studyTarget]);\n"""
          source = source[:start] + replacement + source[end:]
          path.write_text(source)

          test_path = Path('tests/daily_tasks_screen_navigation_contract.test.ts')
          test_path.write_text("""import fs from 'fs';
          import path from 'path';

          const ROOT = path.resolve(__dirname, '..');
          const source = fs
            .readFileSync(path.join(ROOT, 'app/daily_tasks_screen.tsx'), 'utf8')
            .replace(/\\r\\n/g, '\\n');

          describe('Daily Challenges screen navigation', () => {
            it('delegates every task start to the central route resolver', () => {
              expect(source).toContain(\"import { navigateDailyTask } from './daily_task_navigation';\");
              expect(source).toContain('await navigateDailyTask({ lang, router, studyTarget, task });');
              expect(source).toContain('void handleTaskNav(taskToStart);');
            });

            it('does not keep a second task-type switch or French-specific route gates', () => {
              const start = source.indexOf('const handleTaskNav');
              const end = source.indexOf('// Сортировка:', start);
              const handler = source.slice(start, end);

              expect(handler).not.toContain('switch (task.type)');
              expect(handler).not.toMatch(/french/i);
              expect(source).not.toContain('openLessonOrFrenchGate');
              expect(source).not.toContain('openTrainerOrFrenchGate');
              expect(source).not.toContain('frenchLessonRuntimeAvailableForTarget');
              expect(source).not.toContain('trainerSessionContentAvailableForTarget');
            });
          });
          """.replace('          ', ''))
          PY

      - name: Verify exact scope and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object app/daily_tasks_screen.tsx)" = "25a4be681a4b8b740472d4db3f040e969c15bdc0"
          test "$(git hash-object tests/daily_tasks_screen_navigation_contract.test.ts)" = "501931995684ef3feb98288c029c34b1319a795c"
          python <<'PY'
          from pathlib import Path
          source = Path('app/daily_tasks_screen.tsx').read_text()
          assert "import { navigateDailyTask } from './daily_task_navigation';" in source
          assert 'await navigateDailyTask({ lang, router, studyTarget, task });' in source
          start = source.index('const handleTaskNav')
          end = source.index('// Сортировка:', start)
          handler = source[start:end]
          assert 'switch (task.type)' not in handler
          assert 'openLessonOrFrenchGate' not in source
          assert 'openTrainerOrFrenchGate' not in source
          assert 'frenchLessonRuntimeAvailableForTarget' not in source
          PY
          npx --yes esbuild@0.25.8 app/daily_tasks_screen.tsx --loader:.tsx=tsx --format=esm --outfile=/tmp/daily_tasks_screen.js --external:'*'
          npx --yes esbuild@0.25.8 tests/daily_tasks_screen_navigation_contract.test.ts --loader:.ts=ts --format=cjs --outfile=/tmp/daily_tasks_screen_test.js --external:'*'

      - name: Commit product-only result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-daily-screen-central-navigation.yml
          git add app/daily_tasks_screen.tsx tests/daily_tasks_screen_navigation_contract.test.ts
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/actual.txt
          printf '%s\n' app/daily_tasks_screen.tsx tests/daily_tasks_screen_navigation_contract.test.ts | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: centralize Daily Challenges screen navigation'
          git push origin HEAD:fix/daily-screen-central-navigation-2026-08-07
