let timers=new Set(),frames=new Set(),previousFocus=null,toastTimer=null,busy=false;
const later=(fn,ms,motion=true)=>{const id=setTimeout(()=>{timers.delete(id);fn()},state.reduced&&motion?Math.min(ms,30):ms);timers.add(id);return id};
function clearMotion(){timers.forEach(clearTimeout);timers.clear();frames.forEach(cancelAnimationFrame);frames.clear();busy=false;document.querySelector('#toast-root').innerHTML=''}
function count(el,target,prefix=''){if(!el)return;const start=performance.now();const tick=now=>{const t=state.reduced?1:Math.min((now-start)/1250,1);el.textContent=prefix+Math.round(target*(1-Math.pow(1-t,3))).toLocaleString('ru-RU');if(t<1){const id=requestAnimationFrame(n=>{frames.delete(id);tick(n)});frames.add(id)}};tick(start)}
const btn=(text,action,kind='primary')=>`<button class="${kind}" data-action="${action}">${text}</button>`;
const go=(id)=>`data-go="${id}"`;
const row=(title,sub,ic,attrs='')=>`<button class="list-row" ${attrs}><span class="medallion">${icon(ic)}</span><span class="body"><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</span>${icon('chevron')}</button>`;
const head=(title,back='home',right='')=>`<div class="head"><button class="icon-btn flat" ${go(back)} aria-label="Назад">${icon('back')}</button><h2>${title}</h2>${right||'<span style="width:44px"></span>'}</div>`;
function nav(){document.querySelector('#navigation').innerHTML=screens.map((s,i)=>`${s[2]?`<div class="navgroup">${s[2]}</div>`:''}<button class="navitem ${s[0]===state.screen?'active':''}" ${go(s[0])} ${s[0]===state.screen?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')}</span><span>${s[1]}</span></button>`).join('');document.querySelector('#mobile-nav').innerHTML=screens.map(s=>`<option value="${s[0]}" ${s[0]===state.screen?'selected':''}>${s[1]}</option>`).join('');document.querySelector('#bottom-nav').innerHTML=[['home','home','Главная'],['library','cards','Карточки'],['worlds','chat','Диалоги'],['club','trophy','Клуб'],['shop','bag','Магазин']].map(([id,ic,label])=>`<button ${go(id)} class="${id===state.screen?'active':''}">${icon(ic)}${label}</button>`).join('');document.querySelector('#bottom-nav').classList.toggle('hidden',['practice','result','onboarding','dialogue'].includes(state.screen));const s=screens.find(s=>s[0]===state.screen);document.querySelector('#note-number').textContent=`${String(screens.indexOf(s)+1).padStart(2,'0')} / 14 · ${s[1]}`;document.querySelector('#note-title').textContent=s[3];document.querySelector('#note-copy').textContent=s[4];document.querySelector('#states').innerHTML=s[5].map((x,i)=>`<button data-state="${i}">${x}</button>`).join('')}

case 'logout':case 'delete-account':showModal(name==='logout'?'Выйти из аккаунта?':'Удаление аккаунта.',`<p>Это только макет подтверждения. Данные и аккаунт не изменяются.</p>${btn('Вернуться','account')}`);break;
case 'sync':toast('Синхронизировано · демонстрационный статус');break;case 'export':toast('Предпросмотр экспорта. Личные данные не запрашиваются.');break;
case 'help':showModal('Мы рядом.',`<p>Расскажите, что случилось.</p><form id="help-form"><textarea class="search" name="message" required maxlength="1000" placeholder="Ваше сообщение" aria-label="Сообщение в поддержку" rows="4"></textarea><button type="submit" class="primary">Посмотреть подтверждение</button></form>`);break;
case 'about':showModal('Phraseman.',`<p>Язык становится частью жизни.</p><small>Интерактивная дизайн-концепция · сентябрь 2026</small>${btn('Закрыть','close')}`);break;
case 'grid':state.grid=!state.grid;document.querySelector('#words').classList.toggle('grid',state.grid);document.querySelector('[data-action=grid]').innerHTML=icon(state.grid?'list':'grid');document.querySelector('#words').animate([{opacity:.4,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:state.reduced?0:250});break;
case 'filter-all':case 'filter-hard':state.filter=name==='filter-hard';document.querySelector('#words').innerHTML=wordMarkup();document.querySelector('[data-action=filter-all]').classList.toggle('active',!state.filter);document.querySelector('[data-action=filter-hard]').classList.toggle('active',state.filter);break;
case 'add-word':showModal('Ещё одна нужная фраза.',`<form id="word-form"><div class="field"><label>Фраза<input class="search" name="en" required maxlength="100"></label></div><div class="field"><label>Перевод<input class="search" name="ru" required maxlength="100"></label></div><button class="primary" type="submit">Добавить карточку</button></form>`);break;
case 'collection-menu':showModal('Ваш набор.',`${row('Добавить карточку','','plus','data-action="add-word"')}${row('Опубликовать набор','Поделиться с сообществом','globe','data-action="publish"')}${row('Пожаловаться','Сообщить о содержимом','flag','data-action="report"')}`);break;
case 'publish':showModal('Поделиться знаниями.',`<p>Предпросмотр публикации набора «Слова, которые рядом». В приложении набор станет доступен сообществу после подтверждения.</p>${btn('Показать подтверждение','publish-done')}`);break;case 'publish-done':closeModal();toast('Публикация показана. Набор никуда не отправлен.');break;
case 'report':showModal('Сообщить о наборе.',`<p>Что требует внимания?</p>${['Ошибка в переводе','Неподходящее содержание','Другая причина'].map(x=>`<button class="choice" data-report="${x}">${x}</button>`).join('')}`);break;
}}
function demoState(i){const s=state.screen;if(s==='home'&&i===0)action('achievement');if(s==='home'&&i===1)render('profile');if(s==='profile')action(i?'appearance':'achievement');if(s==='library')action(i?'training':'create');if(s==='practice')action(['flip','card-known','card-repeat'][i]);if(s==='result'){state.result=['new','received','none'][i];render()}if(s==='wallet'){if(i===0){state.walletEmpty=false;if(!state.credited){state.wallet+=24;state.earned+=24;state.credited=true}}else state.walletEmpty=i===1;render()}if(s==='club'){if(i===0){state.rank=state.rank===3?4:3;render()}else action(i===1?'week':'chest')}if(s==='collectibles'){if(i===0){const d=document.querySelector('details');d.open=!d.open}else action(i===1?'artifact':'secret')}if(s==='shop'){if(i===0)action('categories');else productModal('forest',i===2)}if(s==='worlds')action(i?'world-locked':'world-coffee');if(s==='dialogue'){if(i===0)sendChat('What would you recommend?');else action(i===1?'hint':'voice')}if(s==='onboarding'){if(i===1){state.onboard=0;render()}else action('onboard-next')}if(s==='settings')action(['promo','appearance','account'][i]);if(s==='collection')action(['grid','filter-hard','add-word'][i])}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){render(b.dataset.go);return}if(b.dataset.action){action(b.dataset.action);return}if(b.dataset.state!==undefined){demoState(Number(b.dataset.state));return}if(b.dataset.library){state.library=b.dataset.library;render();return}if(b.dataset.product){productModal(b.dataset.product);return}if(b.dataset.buy){buy(b.dataset.buy);return}if(b.dataset.category){state.category=b.dataset.category;render('shop');return}if(b.dataset.currency){state.currency=b.dataset.currency;render();return}if(b.dataset.choice){state.choices[onboardingSteps[state.onboard]]=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});return}if(b.dataset.hint){const text=b.dataset.hint;closeModal();const input=document.querySelector('#chat-input');input.value=text;input.focus();return}if(b.dataset.theme){document.querySelectorAll('[data-theme]').forEach(x=>x.style.outline=x===b?'2px solid #d2dfc0':'none');const colors=[['#101715','#1a2420','#c9dfba'],['#1b1712','#2a241c','#e0c393'],['#111b21','#1d2e37','#bcd5df']][Number(b.dataset.theme)];['--bg','--panel','--accent'].forEach((k,i)=>document.querySelector('.glass').style.setProperty(k,colors[i]));return}if(b.dataset.toggle){const k=b.dataset.toggle;state.settings[k]=!state.settings[k];b.setAttribute('aria-checked',state.settings[k]);return}if(b.dataset.locale){closeModal();toast(`Выбран ${b.dataset.locale}. Пример интерфейса остаётся русским.`);return}if(b.dataset.quiz!==undefined){b.style.borderColor=Number(b.dataset.quiz)===1?'#c9dfba':'#ddaf97';b.insertAdjacentHTML('beforeend',Number(b.dataset.quiz)===1?icon('check'):' · попробуйте ещё');return}if(b.dataset.word!==undefined){const w=state.words[Number(b.dataset.word)];showModal(escapeText(w[0]),`<p>${escapeText(w[1])}</p>${btn('Произнести '+icon('sound'),'sound','secondary')}${btn('Тренироваться','restart-practice')}`);return}if(b.dataset.report){showModal('Спасибо за внимание.',`<div class="success-icon">${icon('check')}</div><p>Так выглядит подтверждение жалобы. Сообщение из макета не отправляется.</p>${btn('Вернуться','close')}`)}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const data=new FormData(form);if(form.id==='chat-form'){sendChat(document.querySelector('#chat-input').value)}if(form.id==='create-form'){const name=String(data.get('name')).trim();if(!name)return;showModal('Набор создан.',`<div class="success-icon">${icon('check')}</div><h3>${escapeText(name)}</h3><p>Теперь добавьте первую фразу.</p>${btn('Добавить карточку','add-word')}`)}if(form.id==='word-form'){state.words.push([String(data.get('en')),String(data.get('ru')),false]);state.wordQuery='';state.filter=false;render('collection');toast('Карточка добавлена в макет')}if(form.id==='promo-form')showModal('Код проверен.',`<div class="success-icon">${icon('spark')}</div><p>Предпросмотр успешной активации. Настоящий промокод и награды не запрашиваются.</p>${btn('Готово','close')}`);if(form.id==='help-form'){closeModal();toast('Предпросмотр: обращение принято. Отправка не выполнялась.')}});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){state.wordQuery=e.target.value;document.querySelector('#words').innerHTML=wordMarkup()}});
document.querySelector('#device-size').addEventListener('change',e=>{document.querySelector('.phone').style.width=`min(${e.target.value}px,100%)`});
document.querySelector('#mobile-nav').addEventListener('change',e=>render(e.target.value));document.querySelector('#reduce').checked=state.reduced;document.body.classList.toggle('reduce',state.reduced);document.querySelector('#reduce').addEventListener('change',e=>{state.reduced=e.target.checked;document.body.classList.toggle('reduce',state.reduced);render()});
document.addEventListener('keydown',e=>{const sheet=document.querySelector('.sheet');if(e.key==='Escape'&&sheet){closeModal();return}if(e.key==='Tab'&&sheet){const focusable=[...sheet.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
// All demo timers are finite; navigation cancels them. Keeping a pending swipe
// alive across tab hiding prevents leaving the card in its off-screen state.
const hash=location.hash.slice(1);render(screens.some(s=>s[0]===hash)?hash:'home');
</script></body></html>
