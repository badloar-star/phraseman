appId: app.phraseman
---
- runFlow: ../_shared/open_dev_client_for_deeplink.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- openLink: "phraseman:///settings_testers"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Админ панель"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "admin-preview-vip-survey-notification"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 50
- tapOn:
    id: "admin-preview-vip-survey-notification"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "home-app-messages-button"
    timeout: 30000
- tapOn:
    id: "home-app-messages-button"
- extendedWaitUntil:
    visible:
      id: "vip-survey-inbox-cta"
    timeout: 30000
- tapOn:
    id: "vip-survey-inbox-cta"
- extendedWaitUntil:
    visible:
      id: "vip-survey-modal"
    timeout: 30000
- tapOn:
    id: "vip-survey-option-most_useful-lessons"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "vip-survey-option-linger_screen-lessons"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "vip-survey-option-less_interesting-too_easy"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "vip-survey-option-first_time_confusing-what_next"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "vip-survey-option-expected_missing-more_explanations"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "vip-survey-option-overloaded_screen-home"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "vip-survey-comment-one_thing_week"
- inputText: "Улучшить понятность главной"
- assertVisible:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "vip-survey-comment-feature_request"
- inputText: "План обучения"
- assertVisible:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "vip-survey-comment-friend_recommendation"
- inputText: "Удобно учить фразы каждый день"
- assertVisible:
    id: "vip-survey-primary"
- tapOn:
    id: "vip-survey-primary"
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible: "Спасибо за помощь!"
    timeout: 30000
- tapOn:
    id: "vip-survey-primary"
- runFlow:
    when:
      visible:
        id: "vip-celebration-cta"
    commands:
      - tapOn:
          id: "vip-celebration-cta"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "vip-survey-review-prompt"
    timeout: 60000
- assertVisible: "Ваш VIP активирован"
- assertVisible: "Написать отзыв"
- tapOn:
    id: "vip-survey-review-write"
- runFlow: ../_shared/accept_ios_open_prompt.yaml
- takeScreenshot: vip_survey_e2e_pass
