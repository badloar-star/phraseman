</script><script>/* peak-app.js — страница макета «Пик»: реальный кадр Сверки (data:) + слои по токенам темы в dp (кадр 1080×2400 = 411,43 × 914,3 dp, 2,625 px/dp).
   «Было» — кадр как есть. «Станет»: участок кадра ниже строки «Этаж 1» (комната, топ-3, «6 место», «Все участники») закрашивается самим кадром (полоса пикселей

(() => {

  let MODE = pick('mode', ['was', 'now'], 'now'); let THEME = pick('theme', ['graphite', 'ink'], 'graphite'); let AP = pick('ap', ['dark', 'light'], 'dark'); let STATE = pick('state', ['plain', 'top5', 'zero', 'summit', 'norec'], 'plain');
  let SCREEN = 'main'; let SHEET = null; let STEP = 1;
  const STATES = { plain: ['Обычное', { me: 12 }], top5: ['Я в топ-5', { me: 3 }], zero: ['0 монет', { me: 30, coins: 0 }], summit: ['Я на вершине', { me: 18, summit: true }], norec: ['Нет рекорда', { me: 12 }] };

  /* закраска участка кадра: полоса x = 3 px (orig) растягивается на [x0, x1] × [y0, y1] — вертикальный градиент фона сохраняется */

    const x0 = 30 * k; const x1 = 640 * k; const y0 = 536 * k; const y1 = 1465 * k; const w = Math.round(x1 - x0); const h = Math.round(y1 - y0);
    const t = document.createElement('canvas'); t.width = w; t.height = h; const tg = t.getContext('2d'); tg.drawImage(img, 3 * k, y0, 1.5 * k, h, 0, 0, w, h);
    const fade = (x0f, y0f, x1f, y1f) => { const gr = tg.createLinearGradient(x0f, y0f, x1f, y1f); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)'); tg.globalCompositeOperation = 'destination-in'; tg.fillStyle = gr; tg.fillRect(0, 0, w, h); };

  };

  const icon = { back: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>', chev: '<svg viewBox="0 0 24 24" width="16" height="16"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>', play: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>' };

  };

    ctl('cMode', [['was', 'Было'], ['now', 'Станет']], MODE, 'mode'); ctl('cTheme', [['graphite', 'Затмение'], ['ink', 'Сумерки']], THEME, 'theme'); ctl('cAp', [['dark', 'Тёмная'], ['light', 'Светлая']], AP, 'ap'); ctl('cState', Object.keys(STATES).map((k) => [k, STATES[k][0]]), STATE, 'state');
    const ranked = D.room(STATES[STATE][1]); const me = ranked.find((r) => r.me);
    ph.innerHTML = '<img class="fr" alt="" src="' + F[THEME + '_' + AP] + '"><canvas class="pt"></canvas><div class="dp" style="transform:scale(' + scale + ')"></div>';
    const img = ph.querySelector('img.fr'); if (!img.complete) await new Promise((r) => { img.onload = r; });
    const dp = ph.querySelector('.dp');
