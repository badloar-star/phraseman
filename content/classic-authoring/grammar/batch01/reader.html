function say(){const sp=window.speechSynthesis;if(!sp)return alert(T('Системная озвучка недоступна.','Системне озвучення недоступне.'));const voices=sp.getVoices().filter(v=>v.localService&&/^es(?:-|_)/i.test(v.lang)),voice=voices.find(v=>v.lang.toLowerCase()==='es-es')||voices[0];if(!voice)return alert(T('Испанский голос не найден. Установи системный испанский голос; онлайн-замены нет.','Іспанський голос не знайдено. Установи системний іспанський голос; онлайн-заміни немає.'));sp.cancel();const u=new SpeechSynthesisUtterance(P().targetText);u.voice=voice;u.lang=voice.lang;const rate=prompt(T('Скорость 0,75 / 1 / 1,25','Швидкість 0,75 / 1 / 1,25'),String(read('rate-es',1)));if(rate===null)return;u.rate=[.75,1,1.25].includes(Number(rate.replace(',','.')))?Number(rate.replace(',','.')):1;write('rate-es',u.rate);sp.speak(u)}
if(window.speechSynthesis)window.speechSynthesis.getVoices();document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.lang){lang=el.dataset.lang;write('lang',lang);fb='';draw();return;}const a=el.dataset.a,n=Number(el.dataset.i),s=st(),p=P();if(a==='lesson')pick(n);else if(a==='tab')nav(el.dataset.k);else if(a==='launch'||a==='back')nav('practice');else if(a==='prevIntro'||a==='nextIntro'){ip+=a==='nextIntro'?1:-1;draw()}else if(a==='word'){const w=p.practiceWords[s.slot];if(!w)return;const val=w.choices[n];if(val===w.correct){s.slot++;fb='';if(s.slot===p.practiceWords.length&&!s.done.includes(p.id))s.done.push(p.id);persist()}else fb=T('Пока не подходит для этого образца. ','Це не підходить для цього зразка. ')+w.explanation[lang];draw()}else if(a==='next'){if(s.idx===49)nav('summary');else{here(li,s.idx+1,true);nav('practice')}}else if(a==='missing'){const j=L().phrases.findIndex(x=>!s.done.includes(x.id));if(j>=0){here(li,j,true);nav('practice')}}else if(a==='run'){here(li,n,true);nav('practice')}else if(a==='goto'){const r=refs.get(el.dataset.id);if(r){here(r.i,r.j,false);nav('analysis')}}else if(a==='explain')nav('analysis');else if(a==='why')nav('theory');else if(a==='tip'){fb=p.practiceWords[s.slot].explanation[lang];draw()}else if(a==='retry'){s.slot=0;persist();nav('practice')}else if(a==='say')say()});draw();
