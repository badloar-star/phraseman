<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скриншоты магазинов 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
/* зачем (запас R1 №6): рамки скриншотов App Store / Google Play для PhraseMan 2.0 — подпись-результат сверху, экран снизу.
   Стиль владельца: глубокие тона темы «Аврора», без обводок, без мелких подписей под заголовком. Экраны пока — образцы ×3; финальные кадры
   снимает Сверка на эмуляторе на каждом из 9 языков интерфейса и кладёт в store/shots/<lang>/<n>.png (страница берёт их, если есть). */
:root { --bg: #070709; --tx: #F5F5F7; --sc: #A6A6AD; --chip: #18181C; --chip-on: #F2F1F6; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.page { max-width: 1480px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-size: 34px; line-height: 40px; letter-spacing: -.6px; margin: 0; }
.lead { color: var(--sc); font-size: 16px; line-height: 24px; max-width: 900px; margin: 10px 0 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; align-items: center; }
.chip { height: 38px; padding: 0 15px; border-radius: 19px; background: var(--chip); color: var(--tx); font: 600 14px Inter, sans-serif; border: 0; cursor: pointer; transition: transform 140ms ease, background 140ms ease; }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--chip-on); color: #0B0C0E; }
.sep { width: 1px; height: 24px; background: #2A2A30; margin: 0 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; margin-top: 26px; }
.cell .meta { margin-top: 10px; font-size: 13px; line-height: 18px; color: var(--sc); }
.cell .meta b { color: var(--tx); font-weight: 700; }
.shot { position: relative; width: 100%; overflow: hidden; border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
.shot > .frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
/* сам кадр в пикселях магазина */
.frame { overflow: hidden; background: #121216; }
.frame .glow { position: absolute; inset: 0; }
.frame .cap { position: absolute; left: 6%; right: 6%; text-align: center; font-weight: 800; color: #fff; letter-spacing: -.02em; text-wrap: balance; }
.frame .ph { position: absolute; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 40px 80px rgba(0,0,0,.55)); }
.frame .ph img { display: block; width: 100%; height: auto; }
.frame .fade { position: absolute; left: 0; right: 0; bottom: 0; }
.warn { margin-top: 18px; padding: 12px 16px; border-radius: 14px; background: #1A1410; color: #F2C48D; font-size: 14px; line-height: 20px; display: none; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } h1 { font-size: 28px; line-height: 34px; } }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>Скриншоты магазинов 2.0</h1>
  <p class="lead">Семь кадров: сначала то, что доступно бесплатно, без пейвола. Подпись говорит о результате, а не о названии экрана. Экраны сейчас — образцы; финальные кадры снимает Сверка на эмуляторе на языке витрины. Кнопки сверху меняют язык и магазин.</p>
  <div class="ctl" id="langs"></div>
  <div class="ctl" id="stores"></div>
  <div class="warn" id="warn"></div>
  <div class="grid" id="grid"></div>
</div>
<script src="store/captions.js"></script>
<script>
(() => {
  const S = window.STORE;
  const qs = new URLSearchParams(location.search);
  const st = { lang: qs.get('lang') || 'ru', store: qs.get('store') || 'ios' };
  try { const saved = JSON.parse(localStorage.getItem('store-shots') || 'null'); if (saved && !qs.get('lang')) Object.assign(st, saved); } catch (e) { console.warn('[STORE-SHOTS] localStorage недоступен:', e.message); }
  // зачем: размеры кадра — доли ширины, чтобы одна раскладка работала и для 1290×2796, и для 1080×1920 (у Play экран уходит за нижний край — так принято в витринах)
  const geom = (sz) => {
    const tall = sz.h / sz.w > 2;
    return { capTop: sz.w * (tall ? 0.15 : 0.085), capSize: sz.w * (tall ? 0.072 : 0.066), phW: sz.w * (tall ? 0.80 : 0.70), phTop: sz.w * (tall ? 0.62 : 0.43) };
  };
  const shotSrc = (f, lang) => `store/shots/${lang}/${String(f.n).padStart(2, '0')}.png`;
  const frameHtml = (f, lang, sz) => {
    const g = geom(sz);
    const glow = `radial-gradient(120% 60% at 15% 0%, ${f.tone[0]} 0%, rgba(0,0,0,0) 60%), radial-gradient(90% 50% at 100% 35%, ${f.tone[0]}99 0%, rgba(0,0,0,0) 65%), linear-gradient(180deg, #141418 0%, ${f.tone[1]} 100%)`;
    return `<div class="frame" style="width:${sz.w}px;height:${sz.h}px" data-n="${f.n}"><div class="glow" style="background:${glow}"></div>
      <div class="cap" style="top:${g.capTop}px;font-size:${g.capSize}px;line-height:${Math.round(g.capSize * 1.12)}px" lang="${lang}">${f.cap[lang]}</div>
      <div class="ph" style="top:${g.phTop}px;width:${g.phW}px"><img src="${shotSrc(f, lang)}" alt="" onerror="this.onerror=null;this.src='${f.src}'"></div>
      <div class="fade" style="height:${sz.h * 0.08}px;background:linear-gradient(180deg,rgba(18,18,22,0),${f.tone[1]})"></div></div>`;
  };
  // режим экспорта: один кадр в пикселях магазина (снимает playwright)
  if (qs.get('export')) {
    const f = S.frames.find((x) => String(x.n) === qs.get('n')) || S.frames[0];
    const sz = S.sizes[st.store];
    document.body.innerHTML = frameHtml(f, st.lang, sz);
    document.body.style.cssText = `margin:0;width:${sz.w}px;height:${sz.h}px;overflow:hidden;background:#121216`;
    const fr = document.querySelector('.frame'); fr.style.position = 'relative';
    return;
  }
  const save = () => { try { localStorage.setItem('store-shots', JSON.stringify(st)); } catch (e) { console.warn('[STORE-SHOTS] не сохранил выбор:', e.message); } };
  const chips = (el, items, key) => { el.innerHTML = items.map(([v, t]) => `<button class="chip${st[key] === v ? ' on' : ''}" data-v="${v}" type="button">${t}</button>`).join(''); el.onclick = (e) => { const b = e.target.closest('.chip'); if (!b) return; st[key] = b.dataset.v; save(); render(); }; };
  function render() {
    document.documentElement.lang = st.lang === 'pt-BR' ? 'pt' : st.lang;
    chips(document.getElementById('langs'), S.langs, 'lang');
    chips(document.getElementById('stores'), Object.entries(S.sizes).map(([k, v]) => [k, v.name]), 'store');
    const sz = S.sizes[st.store];
    const grid = document.getElementById('grid');
    grid.innerHTML = S.frames.map((f) => `<div class="cell"><div class="shot" style="aspect-ratio:${sz.w}/${sz.h}">${frameHtml(f, st.lang, sz)}</div><div class="meta"><b>${f.n}. ${f.screen}</b> · ${f.access}</div></div>`).join('');
    const fit = () => grid.querySelectorAll('.shot').forEach((s) => { const k = s.clientWidth / sz.w; s.firstElementChild.style.transform = `scale(${k})`; });
    fit(); window.onresize = fit;
    // зачем: подпись не должна вылезать за 3 строки — проверяем по факту вёрстки и показываем, где сократить
    const over = [...grid.querySelectorAll('.cap')].filter((c) => c.scrollHeight / parseFloat(c.style.lineHeight) > 3.05).map((c) => c.closest('.frame').dataset.n);
    const w = document.getElementById('warn'); w.style.display = over.length ? 'block' : 'none';
    w.textContent = over.length ? `Подпись длиннее трёх строк: кадры ${over.join(', ')} — сократить текст на этом языке.` : '';
  }
  render();
})();
</script>
</body>
</html>
