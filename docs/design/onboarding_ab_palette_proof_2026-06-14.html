<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Онбординг A/B — синий vs зелёный (живые токены)</title>
<style>
  :root{ font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body{ margin:0; background:#000; color:#fff; padding:24px; }
  h1{ font-size:18px; font-weight:700; margin:0 0 4px; }
  .sub{ color:#888; font-size:13px; margin:0 0 24px; }
  .pair{ display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:920px; }
  /* Карточка-телефон с реальными токенами темы */
  .screen{
    border-radius:28px; padding:22px 18px 26px; min-height:520px;
    position:relative; overflow:hidden; border:1px solid rgba(255,255,255,0.08);
  }
  .label{ font-size:11px; font-weight:800; letterSpacing:1.4px; text-transform:uppercase; margin-bottom:18px; }
  .brand{ font-size:13px; font-weight:800; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }
  .h{ font-size:26px; font-weight:900; line-height:1.1; margin:0 0 8px; }
  .lead{ font-size:13px; font-weight:700; margin:0 0 18px; }
  .progress{ height:8px; border-radius:6px; overflow:hidden; margin:0 0 20px; }
  .progressFill{ height:100%; width:62%; border-radius:6px; }
  .pills{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px; }
  .pill{ font-size:12px; font-weight:800; padding:7px 12px; border-radius:999px; border-width:1px; border-style:solid; }
  .card{ border-radius:18px; padding:14px; border-width:1px; border-style:solid; margin-bottom:10px; }
  .cardActive{ border-radius:18px; padding:14px; border-width:1.5px; border-style:solid; margin-bottom:10px; }
  .cardTitle{ font-size:14px; font-weight:900; margin:0 0 3px; }
  .cardSub{ font-size:11px; font-weight:700; margin:0; }
  .cta{ border-radius:16px; padding:16px; text-align:center; font-size:17px; font-weight:900; margin-top:14px; }
  .ghost{ text-align:center; font-size:13px; font-weight:700; margin-top:12px; }
  .tokens{ margin-top:14px; font-size:10px; line-height:1.5; opacity:.5; }
  .swrow{ display:flex; gap:5px; margin-top:6px; }
  .sw{ width:22px; height:22px; border-radius:5px; border:1px solid rgba(255,255,255,.12); }
</style>
</head>
<body>
  <h1>Онбординг A/B — синий vs зелёный</h1>
  <p class="sub">Эти два экрана нарисованы РОВНО теми же цветовыми токенами (OnboardingTheme), что зашиты в код приложения. Так выглядят две группы 50/50.</p>
  <div class="pair" id="pair"></div>

<script>
// ── Точная копия токенов из components/onboarding.tsx ──
const BLUE = {
  accent:'#2f6bff', accent2:'#6D99FF', accentDeep:'#134BCD', accentIce:'#9cc0ff',
  accentBg:'rgba(47,107,255,0.16)', accentBgSoft:'rgba(47,107,255,0.10)',
  accentBorder:'rgba(47,107,255,0.42)', accentBorderSoft:'rgba(109,153,255,0.30)',
  textPrimary:'#eaf1ff', textMuted:'#93a6c8', ctaText:'#04122e',
  bgEdge:'#05080f', bgTop:'#0B0909', bgBottom:'#091120',
};
const GREEN = {
  accent:'#22c55e', accent2:'#5BE9A6', accentDeep:'#0f7a43', accentIce:'#9ff5cf',
  accentBg:'rgba(34,197,94,0.16)', accentBgSoft:'rgba(34,197,94,0.10)',
  accentBorder:'rgba(34,197,94,0.42)', accentBorderSoft:'rgba(91,233,166,0.30)',
  textPrimary:'#e9fff4', textMuted:'#8fc7ac', ctaText:'#03130b',
  bgEdge:'#03100a', bgTop:'#06140d', bgBottom:'#08251a',
};

function screen(name, t){
  return `
  <div class="screen" style="background:linear-gradient(160deg, ${t.bgBottom}, ${t.bgTop} 55%, ${t.bgEdge});">
    <div class="label" style="color:${t.textMuted}">${name}</div>
    <div class="brand" style="color:${t.accent}">PHRASEMAN</div>
    <div class="h" style="color:${t.textPrimary}">Аня, твой план готов</div>
    <div class="lead" style="color:${t.textMuted}">Английский для путешествий · 12 недель</div>

    <div class="progress" style="background:${t.accentBgSoft}">
      <div class="progressFill" style="background:linear-gradient(90deg, ${t.accent}, ${t.accent2})"></div>
    </div>

    <div class="pills">
      <span class="pill" style="color:${t.accent2}; background:${t.accentBg}; border-color:${t.accentBorder}">Путешествия</span>
      <span class="pill" style="color:${t.accent2}; background:${t.accentBg}; border-color:${t.accentBorder}">A1</span>
      <span class="pill" style="color:${t.accent2}; background:${t.accentBg}; border-color:${t.accentBorder}">15 мин/день</span>
    </div>

    <div class="cardActive" style="background:${t.accentBg}; border-color:${t.accentBorder}">
      <div class="cardTitle" style="color:${t.textPrimary}">Неделя 1 — открыта сейчас</div>
      <div class="cardSub" style="color:${t.textMuted}">Старт с A1, 15 минут в день</div>
    </div>
    <div class="card" style="background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.10)">
      <div class="cardTitle" style="color:${t.textMuted}">🔒 Недели 2–12</div>
      <div class="cardSub" style="color:${t.textMuted}">Откроются после подписки</div>
    </div>

    <div class="cta" style="background:${t.accent}; color:${t.ctaText}">Начать бесплатно</div>
    <div class="ghost" style="color:${t.textMuted}">Продолжить без плана</div>

    <div class="tokens" style="color:${t.textMuted}">
      accent ${t.accent} · accent2 ${t.accent2} · deep ${t.accentDeep}
      <div class="swrow">
        <div class="sw" style="background:${t.accent}"></div>
        <div class="sw" style="background:${t.accent2}"></div>
        <div class="sw" style="background:${t.accentDeep}"></div>
        <div class="sw" style="background:${t.accentIce}"></div>
        <div class="sw" style="background:${t.bgBottom}"></div>
        <div class="sw" style="background:${t.bgTop}"></div>
      </div>
    </div>
  </div>`;
}

document.getElementById('pair').innerHTML =
  screen('Группа A · синий', BLUE) + screen('Группа B · зелёный', GREEN);
</script>
</body>
</html>
