appId: app.phraseman
---
- runFlow: ../_shared/open_dev_client_for_deeplink.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- openLink: "phraseman://admin_premium_delivery_test"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "69%,54%"
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible:
        id: "vip-celebration-cta"
    commands:
      - tapOn:
          id: "vip-celebration-cta"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: "VIP активирован"
    commands:
      - tapOn: "Начать"
      - waitForAnimationToEnd:
          timeout: 5000
- openLink: "phraseman://admin_premium_delivery_test"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "screen-admin-premium-delivery-e2e"
    timeout: 60000
- assertVisible:
    id: "admin-premium-e2e-context"
- assertVisible:
    id: "admin-premium-e2e-verified"
- scrollUntilVisible:
    element:
      id: "admin-premium-e2e-auth-matrix"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 40
- tapOn:
    id: "admin-premium-e2e-auth-matrix"
- extendedWaitUntil:
    visible:
      id: "admin-premium-e2e-pass"
    timeout: 240000
- extendedWaitUntil:
    visible:
      id: "admin-premium-e2e-auth-matrix-pass"
    timeout: 30000
- takeScreenshot: admin_vip_delivery_e2e_pass
