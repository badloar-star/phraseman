name: Apply isolated runtime safety fixes

on:
  push:
    branches:
      - audit/remove-french-runtime-fixes-2026-08-05
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-isolated-runtime-safety-fixes
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remove-french-runtime-fixes-2026-08-05
          fetch-depth: 1

      - name: Apply exact guarded patches
        run: python3 scripts/audit_apply_safe_runtime_fixes.py

      - name: Validate diff
        run: git diff --check

      - name: Commit isolated fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/achievements_screen.tsx \
            app/review.tsx \
            app/personal_plan_complete.tsx \
            components/settings/StudyLanguagePicker.tsx \
            tests/runtime_failure_states_contract.test.ts
          git commit -m 'fix: make runtime failures explicit and retryable'
          git push origin HEAD:audit/remove-french-runtime-fixes-2026-08-05
