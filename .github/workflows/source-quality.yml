name: Source Quality Gates

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  source-quality:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies for root typecheck
        run: npm --prefix functions ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: No visible loading audit
        run: npm run audit:no-visible-loading -- --changed

  app-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # maxWorkers=1 is required by this suite (shared module/global state across tests).
      # The single long-lived worker accumulates module/global state across ~137 suites,
      # so the default ~2-4GB V8 heap OOMs mid-run (exit 134). Raise the heap ceiling;
      # do NOT parallelize (that breaks the shared-state contract this suite relies on).
      - name: Jest (app tests)
        run: npx jest --testPathPattern=tests/ --ci --maxWorkers=1
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  removed-theme-guard:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prevent removed themes from returning
        run: npm run test:removed-themes -- --ci

  functions-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: cd functions && npm ci

      # functions/package.json → "test": "jest --no-coverage".
      - name: Jest (functions tests)
        run: cd functions && npx jest --ci

