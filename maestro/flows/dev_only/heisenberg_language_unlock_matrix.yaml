appId: app.phraseman
---
- runFlow: ../_shared/open_dev_client.yaml
- runFlow: ../_dismiss_bug_hunt.yaml
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: "88%,93%"
- waitForAnimationToEnd:
    timeout: 5000
# Dismiss optional auth prompt. If it is not present, this tap lands on an inert lower settings area.
- tapOn:
    point: "50%,73%"
- waitForAnimationToEnd:
    timeout: 3000
# Dismiss optional VIP activation modal.
- tapOn:
    point: "50%,86%"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-language-row"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 40
- tapOn:
    id: "settings-language-row"
- extendedWaitUntil:
    visible:
      id: "settings-language-screen"
    timeout: 20000
- assertVisible:
    id: "settings-language-row-pt-BR"
- assertVisible:
    id: "settings-language-row-vi"
- assertVisible:
    id: "settings-language-row-id"
- assertVisible:
    id: "settings-language-row-tr"
- assertVisible:
    id: "settings-language-row-pl"
- tapOn:
    id: "settings-language-row-pt-BR"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "settings-language-row-vi"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "settings-language-row-id"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "settings-language-row-tr"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "settings-language-row-pl"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "settings-language-back"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 20000
