appId: app.phraseman
---
- runFlow: ../_dismiss_bug_hunt.yaml
- runFlow: ../_precondition.yaml
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "settings-open-testers"
    direction: DOWN
    timeout: 25000
    speed: 80
    visibilityPercentage: 40
- tapOn:
    id: "settings-open-testers"
- scrollUntilVisible:
    element:
      id: "testers-section-trainer_debug"
    timeout: 65000
    direction: DOWN
    speed: 55
    visibilityPercentage: 20
- tapOn:
    id: "testers-section-trainer_debug"
- extendedWaitUntil:
    visible:
      id: "trainer-qa-seed-weak"
    timeout: 15000
- tapOn:
    id: "trainer-qa-seed-weak"
- takeScreenshot: trainer_qa_seed_weak
- tapOn:
    id: "trainer-qa-open-hub"
- extendedWaitUntil:
    visible:
      id: "screen-trainer"
    timeout: 30000
- takeScreenshot: trainer_qa_hub_seeded
