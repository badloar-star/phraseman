# Smoke-тест новых достижений (социал, арена, тренер, кастомизация, вехи):
# 1. Загружает приложение
# 2. Открывает Testers → нажимает «Seed: все новые достижения»
# 3. Убеждается что seed прошёл без ошибок
# 4. Переходит на экран достижений
# 5. Открывает секцию «Особые» в аккордеоне
# 6. Прокручивает и проверяет видимость ключевых новых достижений
# 7. Возвращается
appId: app.phraseman
---
- runFlow: ../_shared/boot_to_home.yaml

# ── Шаг 1: Открыть Testers ────────────────────────────────────────────────────
- tapOn:
    point: "90%,95%"
- waitForAnimationToEnd:
    timeout: 4000

# Скролл до секции с достижениями в Testers
- scrollUntilVisible:
    element:
      id: "testers-seed-new-achievements"
    direction: DOWN
    timeout: 20000
    speed: 60
    visibilityPercentage: 30

# ── Шаг 2: Запустить seed новых достижений ────────────────────────────────────
- tapOn:
    id: "testers-seed-new-achievements"
- waitForAnimationToEnd:
    timeout: 8000

# Seed показывает диалог — закрываем его
- runFlow:
    when:
      visible: "Seed завершён"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 2000

# ── Шаг 3: Перейти на экран достижений ───────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "(Достижения|Досягнення|Logros)"
    direction: DOWN
    timeout: 15000
    speed: 60
    visibilityPercentage: 30
- tapOn:
    text: "(Достижения|Досягнення|Logros)"
- waitForAnimationToEnd:
    timeout: 4000

# ── Шаг 4: Открыть секцию «Особые» ───────────────────────────────────────────
- assertVisible:
    text: "(Особые|Особливі|Especiales)"
- tapOn:
    text: "(Особые|Особливі|Especiales)"
- waitForAnimationToEnd:
    timeout: 2000

# ── Шаг 5: Проверить новые достижения из «Особые» ────────────────────────────
- scrollUntilVisible:
    element:
      text: "(Не один в поле|Не один у полі)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(Не один в поле|Не один у полі)"

- scrollUntilVisible:
    element:
      text: "(Дед Мороз|Дід Мороз)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(Дед Мороз|Дід Мороз)"

- scrollUntilVisible:
    element:
      text: "(Машина победы|Машина перемоги)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(Машина победы|Машина перемоги)"

- scrollUntilVisible:
    element:
      text: "(Первая тренировка|Перше тренування)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(Первая тренировка|Перше тренування)"

- scrollUntilVisible:
    element:
      text: "(Своё лицо|Своє обличчя)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(Своё лицо|Своє обличчя)"

- scrollUntilVisible:
    element:
      text: "(Коллекционер|Колекціонер)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(Коллекционер|Колекціонер)"

# ── Шаг 6: Проверить вехи — открыть секцию XP ────────────────────────────────
- tapOn:
    text: "(Опыт|Досвід|Experiencia)"
- waitForAnimationToEnd:
    timeout: 2000

- scrollUntilVisible:
    element:
      text: "(Полтинник|П'ятдесятник)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(Полтинник|П'ятдесятник)"

- scrollUntilVisible:
    element:
      text: "(75К — и не останавливаться|75К — і не зупинятись)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(75К — и не останавливаться|75К — і не зупинятись)"

# ── Шаг 7: Проверить квизы — открыть секцию Квизы ────────────────────────────
- tapOn:
    text: "(Квизы|Квізи|Cuestionarios)"
- waitForAnimationToEnd:
    timeout: 2000

- scrollUntilVisible:
    element:
      text: "(Первые десять|Перші десять)"
    direction: DOWN
    timeout: 10000
    speed: 60
    visibilityPercentage: 20
- assertVisible:
    text: "(Первые десять|Перші десять)"

# ── Шаг 8: Нажать на одно достижение — проверить модальное окно ──────────────
- tapOn:
    text: "(Первые десять|Перші десять)"
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    text: "(10 квизовых сессий|10 квізових сесій)"

# Закрыть модальное окно
- tapOn:
    text: "(Закрыть|Закрити|Cerrar)"
- waitForAnimationToEnd:
    timeout: 2000

# ── Шаг 9: Назад ─────────────────────────────────────────────────────────────
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd:
    timeout: 3000
