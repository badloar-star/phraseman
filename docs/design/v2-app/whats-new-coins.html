<style>
/* ───────── PhraseMan 2.0 · окно «Встречайте PhraseMan 2.0» — пересчёт старых бонусов в монеты ─────────
   зачем (владелец 15.10 через координатора; Макеты): эталон для сверки. Основа — макет Fable whats-new-coins.html (скопирован, оригинал не правлен).
   Решения владельца 15.10: только заголовок «Встречайте PhraseMan 2.0» + анимация пересчёта в монеты, без рассказа о новом;
   09:12 — суммы только реально начисленные сервером, строки с нулём НЕ показываются. Кадры: (а) опыт + жемчуг + вращения,
   (б) только жемчуг, (в) ничего не начислено — только заголовок. Темы по умолчанию: светлая «Сумерки» (ink), тёмная «Океан» (marine);
   цвета — liquidGlassTokens кода (intensity 1). Порядок строк и тексты — как в коде (modules/legacy_bonus: опыт → жемчуг → вращения;
   строка «старое число → +монеты», курса в строке нет). Главная кнопка — ctaFill (правило владельца «кнопки не сливаются»). */
@font-face { font-family: Inter; src: url(fonts/Inter-Regular.ttf); font-weight: 400; }
@font-face { font-family: Inter; src: url(fonts/Inter-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Inter; src: url(fonts/Inter-Bold.ttf); font-weight: 700; }
@font-face { font-family: Inter; src: url(fonts/Inter-Black.ttf); font-weight: 800 900; }
:root { --page: #0F1013; --page-tx: #E6E6E8; --page-sec: #8A8A90; --page-btn: #1C1C20; --ease-out: cubic-bezier(.22,1,.36,1); --ease-in: cubic-bezier(.55,0,1,.45); --spring: cubic-bezier(.34,1.56,.64,1); }
/* тема «Сумерки» — светлая по умолчанию (ink, light) */
.th-ink { --bg0: #F3F4FD; --bg1: #EAEBFE; --bg2: #ECE4F7; --glowA: #C9CCFDB3; --glowB: #E0CEF899; --glowC: #E0E2FE80;
  --tx: #17181E; --sc: #595A63; --mu: #5E5F67; --acc: #5F5CB1; --acc-ink: #FFFFFF; --acc-soft: #E6E9FFF7; --acc-glow: rgba(95,92,177,.45);
  --cta: #1D1D2F; --cta-ink: #FFFFFF; --card: #FCFCFF; --ctrl: #DBDDEC; --tilebg: #FBFBFE; --sheet: #FBFBFEFA; --sheet-solid: #FBFBFE; --scrim: rgba(20,22,28,.45);
  --grab: rgba(23,24,30,.22); --sh: 0 10px 22px -12px #36365929; --sho: 0 14px 26px -14px #33335775; --sb: #17181E; }
/* тема «Океан» — тёмная по умолчанию (marine, dark) */
.th-marine { --bg0: #002936; --bg1: #000F16; --bg2: #001B17; --glowA: #008AA4C7; --glowB: #008F84B3; --glowC: #00596D85;
  --tx: #F6FBFD; --sc: #B8CFD6; --mu: #98ACB1; --acc: #5CCFEB; --acc-ink: #001A22; --acc-soft: #006C859E; --acc-glow: rgba(92,207,235,.5);
  --cta: #D0EAED; --cta-ink: #010708; --card: #002027; --ctrl: #123037; --tilebg: #03171C; --sheet: #03171CF5; --sheet-solid: #03171C; --scrim: rgba(0,0,0,.6);
  --grab: rgba(246,251,253,.22); --sh: 0 16px 28px -14px rgba(0,0,0,.85); --sho: 0 26px 40px -14px rgba(0,0,0,.9); --sb: #F6FBFD; }
html, body { margin: 0; padding: 0; background: var(--page); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.lab { min-height: 100vh; color: var(--page-tx); font-family: Inter, system-ui, sans-serif; padding: 18px 16px 40px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.lab h1 { font-size: 20px; margin: 4px 0 0; font-weight: 700; }
.lab .btn { height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: #F2F1F6; color: #0B0C0E; font: 600 13px/1 Inter, system-ui, sans-serif; cursor: pointer; }
.grid { display: flex; flex-wrap: wrap; gap: 28px 24px; justify-content: center; }
.col { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 390px; }
.col .lbl { font-size: 14px; font-weight: 700; color: #E6E6E8; text-align: center; }
.col .onn { font-size: 12px; line-height: 1.45; color: var(--page-sec); text-align: center; max-width: 380px; }
/* ───────── телефон ───────── */
.ph { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; isolation: isolate; color: var(--tx); font-family: Inter, system-ui, sans-serif;
  box-shadow: 0 0 0 8px #121216, 0 0 0 9px #2A2A2E, 0 30px 80px rgba(0,0,0,.6);
  background: radial-gradient(78% 36% at 6% 2%, var(--glowA), transparent 72%), radial-gradient(62% 32% at 108% 56%, var(--glowB), transparent 74%), radial-gradient(80% 28% at 26% 108%, var(--glowC), transparent 76%), linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg2)); }
.ph .sb { position: absolute; top: 0; left: 0; right: 0; height: 48px; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 8px 28px 0 36px; font-weight: 600; font-size: 16px; color: var(--sb); }
.ph .hi { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--tx); opacity: .9; z-index: 80; }
/* ───────── Главная (фон под окном) ───────── */
.home { position: absolute; inset: 0; padding: 60px 12px 0; overflow: hidden; z-index: 1; filter: blur(14px) saturate(1.1); transform: scale(1.03); transform-origin: 50% 40%; }
.hrow { display: flex; align-items: center; gap: 10px; }
.pl { height: 46px; padding: 0 14px; border-radius: 23px; display: inline-flex; align-items: center; gap: 10px; background: var(--card); box-shadow: var(--sh); }
.pl b { font-size: 16px; font-weight: 700; } .pl .coinimg { width: 24px; height: 24px; }
.cir { width: 46px; height: 46px; border-radius: 50%; background: var(--card); box-shadow: var(--sh); margin-left: auto; }
.trow { min-height: 58px; border-radius: 14px; margin-top: 10px; background: var(--card); box-shadow: var(--sho); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; } .tiles i { aspect-ratio: 1; border-radius: 22px; background: var(--card); box-shadow: var(--sh); }
/* ───────── затемнение + шторка ───────── */
.dim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%; z-index: 40; border-radius: 28px 28px 0 0; background: var(--sheet); box-shadow: 0 -24px 60px rgba(0,0,0,.35);
  transform: translate3d(0, 104%, 0); transition: transform 560ms var(--ease-out); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.sheet::-webkit-scrollbar { display: none; }
.sheet.in { transform: translate3d(0, 0, 0); }
.sheet .grab { position: sticky; top: 0; z-index: 5; padding: 8px 0 10px; background: linear-gradient(180deg, var(--sheet-solid) 55%, transparent); }
.sheet .grab i { display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--grab); margin: 0 auto; }
.body { position: relative; padding: 0 20px; }
.rv { opacity: 0; transform: translate3d(0, 10px, 0); transition: opacity 420ms var(--ease-out), transform 520ms var(--ease-out); transition-delay: var(--d, 0ms); }
.sheet.in .rv { opacity: 1; transform: translate3d(0, 0, 0); }
.title { font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -.4px; margin: 6px 0 4px; text-align: center; color: var(--tx); }
.conv { margin-top: 6px; }
.conv .h { font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -.2px; color: var(--tx); text-align: center; }
/* зачем (координатор 15.10): подзаголовок «Всё, что ты накопил раньше, не пропадает — вот итог.» убран — после решения 09:12 (только начисленное сервером) это неправда для многих; заголовок блока и «Итого» остаются */
.conv .h { margin-bottom: 14px; }
.plate { border-radius: 18px; padding: 14px; background: var(--card); box-shadow: var(--sh); position: relative; }
.hero { display: flex; align-items: center; gap: 16px; padding: 2px 2px 12px; }
.bigcoin { position: relative; width: 64px; height: 64px; flex: none; border-radius: 50%; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
.bigcoin .coinimg { position: absolute; inset: 0; border-radius: 50%; }
.bigcoin .mask { position: absolute; inset: 1px; border-radius: 50%; overflow: hidden; pointer-events: none; }
.bigcoin .mask::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 60%; transform: translate3d(-160%, 0, 0) rotate(18deg); background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0)); opacity: 0; }
.bigcoin.shine .mask::after { animation: sheen 820ms cubic-bezier(.4,0,.2,1) forwards; }
@keyframes sheen { 0% { transform: translate3d(-160%, 0, 0) rotate(18deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate3d(260%, 0, 0) rotate(18deg); opacity: 0; } }
.bigcoin .ring { position: absolute; inset: -2px; border-radius: 50%; box-shadow: 0 0 0 2px var(--acc-glow), 0 0 24px 6px var(--acc-glow); opacity: 0; pointer-events: none; }
.bigcoin.shine .ring { animation: ring 760ms var(--ease-out) forwards; }
@keyframes ring { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.hnum { flex: 1; min-width: 0; }
.hnum .k { font-size: 13px; line-height: 17px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--sc); }
.hnum .num { font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums; color: var(--tx); }
.hnum .unit { font-size: 13px; line-height: 18px; color: var(--sc); margin-top: -2px; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { position: relative; min-height: 50px; padding: 7px 10px 7px 8px; border-radius: 14px; display: flex; align-items: center; gap: 10px; background: var(--ctrl); transition: background 360ms var(--ease-out); }
.row .tile { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--tilebg); flex: none; display: flex; align-items: center; justify-content: center; color: var(--tx); transition: background 360ms var(--ease-out); }
.row .tile svg { width: 19px; height: 19px; display: block; transition: opacity 240ms, transform 320ms var(--spring); }
.row .tile .ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.4); transition: opacity 240ms, transform 360ms var(--spring); color: var(--acc-ink); }
.row .tile .ok svg { width: 18px; height: 18px; }
.row .cp { flex: 1; min-width: 0; }
.row .tt { font-size: 16px; line-height: 20px; font-weight: 700; color: var(--tx); transition: color 360ms; }
.row .val { position: relative; flex: none; min-width: 64px; text-align: right; font-size: 16px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--tx); }
.row .val .old { display: block; transition: opacity 240ms; }
.row .val .new { position: absolute; right: 0; top: 0; color: var(--acc); opacity: 0; transform: translate3d(0, 6px, 0); transition: opacity 320ms var(--ease-out), transform 420ms var(--spring); }
.row.active .tile { background: var(--acc-soft); }
.row.done { background: var(--card); }
.row.done .tt { color: var(--sc); }
.row.done .tile { background: var(--acc); }
.row.done .tile > svg { opacity: 0; transform: scale(.6); }
.row.done .tile .ok { opacity: 1; transform: scale(1); }
.row.done .val .old { opacity: 0; }
.row.done .val .new { opacity: 1; transform: translate3d(0, 0, 0); }
.chip { position: absolute; right: 0; bottom: calc(100% + 4px); white-space: nowrap; padding: 4px 9px; border-radius: 999px; background: var(--acc-soft); color: var(--acc); font-size: 13px; line-height: 16px; font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; animation: chip 980ms cubic-bezier(.22,1,.36,1) forwards; }
@keyframes chip { 0% { opacity: 0; transform: translate3d(0, 6px, 0) scale(.86); } 14% { opacity: 1; transform: translate3d(0, -2px, 0) scale(1); } 68% { opacity: 1; transform: translate3d(0, -16px, 0) scale(1); } 100% { opacity: 0; transform: translate3d(0, -26px, 0) scale(.98); } }
.cta { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; margin: 20px 0 0; border: 0; border-radius: 26px; background: var(--cta); color: var(--cta-ink); font: 700 16px/1 Inter, system-ui, sans-serif; cursor: pointer; transition: transform 160ms var(--ease-out); }
.cta:active { transform: scale(.97); }
.body .safe { height: 36px; }
.fx { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.fc { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; will-change: transform, opacity; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
/* состояние (в): ничего не начислено — только заголовок и «Понятно» */
.ph.empty .conv { display: none; }

    function flyCoin(from, to, side, dur, onArrive) {
      var el = document.createElement('span'); el.className = 'fc coinimg'; q('fx').appendChild(el);
      var cx = (from.x + to.x) / 2 + side * (70 + Math.random() * 40), cy = Math.min(from.y, to.y) - 30 - Math.random() * 30, t0 = 0;
      raf(function (ts) { if (!t0) t0 = ts; var p = Math.min(1, (ts - t0) / dur), e = easeInOut(p), u = 1 - e;
        var x = u * u * from.x + 2 * u * e * cx + e * e * to.x, y = u * u * from.y + 2 * u * e * cy + e * e * to.y;
        var sc = p < .18 ? .4 + (p / .18) * .6 : 1 - Math.max(0, (p - .8) / .2) * .5;
        el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + sc.toFixed(3) + ')'; el.style.opacity = p < .1 ? (p / .1).toFixed(2) : '1';
        if (p >= 1) { el.remove(); onArrive(); return false; } return true; });
    }
    function coinBump(scale, dur) { if (RM || !q('bigcoin').animate) return; q('bigcoin').animate([{ transform: 'scale(1)' }, { transform: 'scale(' + scale + ')' }, { transform: 'scale(1)' }], { duration: dur, easing: 'cubic-bezier(.34,1.56,.64,1)' }); }
    function burnRow(i) {
      var row = root.querySelector('.row[data-i="' + i + '"]'), old = row.querySelector('.old'), val = row.querySelector('.val');
      var coins = rows[i].coins, n = 6, per = Math.floor(coins / n), rest = coins - per * (n - 1);
      row.classList.add('active'); countDown(old, rows[i].from, 520);
      after(80, function () { var chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = '+' + fmt(coins) + ' ' + plural(coins, T.coin); val.appendChild(chip); after(1000, function () { chip.remove(); }); });
      var to = localPoint(q('bigcoin'));
      for (var k = 0; k < n; k++) (function (k) { after(60 + k * 70, function () { flyCoin(localPoint(old), to, k % 2 ? 1 : -1, 640, function () { bumpTarget(k === n - 1 ? rest : per); coinBump(1.06, 220); }); }); })(k);
      after(560, function () { row.classList.remove('active'); row.classList.add('done'); });
    }
    function finish() { var big = q('bigcoin'); big.classList.remove('shine'); void big.offsetWidth; big.classList.add('shine'); coinBump(1.14, 640); }
    function finalState() { root.querySelectorAll('.row').forEach(function (r) { r.classList.add('done'); }); counter.target = TOTAL; setCounter(TOTAL); }
    function play() {
      clearAll(); q('fx').innerHTML = ''; root.querySelectorAll('.row').forEach(function (r) { r.classList.remove('done', 'active'); }); q('bigcoin').classList.remove('shine');
      counter = { shown: 0, target: 0, anchor: 0, t0: 0, running: false, onSettle: null }; setCounter(0);
      var sheet = q('sheet'); sheet.classList.remove('in'); void sheet.offsetWidth;
      if (RM) { sheet.classList.add('in'); finalState(); return; }
      after(60, function () { sheet.classList.add('in'); });
      if (!rows.length) return;
      var started = false; counter.onSettle = function () { if (counter.target === TOTAL && !started) { started = true; finish(); } };
      rows.forEach(function (_, i) { after(1100 + i * 720, function () { burnRow(i); }); });
    }
    return { play: play };
  }

  var coin = '<span class="coinimg"></span>';
  var html = PHONES.map(function (p, n) {
    return '<div class="col"><div class="lbl">' + p[0] + '</div>' +
      '<div class="ph ' + p[2] + (STATES[p[1]].length ? '' : ' empty') + '" data-vid="wn-' + (n + 1) + '">' +
        '<div class="sb"><span>9:41</span></div>' +
        '<div class="home"><div class="hrow"><div class="pl">' + coin + '<b>2 140</b></div><div class="cir"></div></div><div class="trow"></div><div class="trow"></div><div class="trow"></div><div class="tiles"><i></i><i></i><i></i></div></div>' +
        '<div class="dim"></div>' +
        '<div class="sheet" data-id="sheet" role="dialog" aria-modal="true"><div class="grab"><i></i></div><div class="body">' +
          '<h1 class="title rv" style="--d:120ms">' + T.title + '</h1>' +
          '<div class="conv rv" style="--d:200ms"><div class="h">' + T.convert + '</div>' +
            '<div class="plate"><div class="hero"><div class="bigcoin" data-id="bigcoin"><span class="coinimg"></span><span class="mask"></span><span class="ring"></span></div>' +
            '<div class="hnum"><div class="k">' + T.total + '</div><div class="num" data-id="total">0</div><div class="unit" data-id="unit"></div></div></div>' +
            '<div class="rows" data-id="rows"></div></div></div>' +
          '<button class="cta rv" style="--d:260ms" type="button">' + T.cta + '</button><div class="safe"></div><div class="fx" data-id="fx"></div>' +
        '</div></div><div class="hi"></div></div>' +
      '<div class="onn">' + p[3] + '</div></div>';
  }).join('');
  document.getElementById('grid').innerHTML = html;
  var players = [].map.call(document.querySelectorAll('.ph'), function (ph, n) { return mount(ph, STATES[PHONES[n][1]]); });
  function playAll() { players.forEach(function (p) { p.play(); }); }
  document.getElementById('replay').addEventListener('click', playAll);
  var started = false; function start() { if (started) return; started = true; playAll(); }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(start); setTimeout(start, 900); } else start();
})();
