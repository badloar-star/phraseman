<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пробы голосов</title>
<style>
/* зачем (владелец 11.11): страница, где можно подряд прослушать свои голоса ElevenLabs по языкам и отметить понравившиеся —
   по отметкам потом выбираем, какими голосами озвучивать разделы. Разделение — тоном и тенью, без обводок. */
:root { --bg: #0A0B0E; --card: #15171C; --card2: #1D2027; --tx: #EEF1F6; --mut: #9BA2AF; --acc: #7C9BFF; --gold: #F2C14E; --ease: cubic-bezier(.23, 1, .32, 1); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--tx); font-family: Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.page { max-width: 1120px; margin: 0 auto; padding: 28px 16px 140px; }
h1 { font-size: 26px; line-height: 32px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.4px; }
.lead { font-size: 15px; line-height: 22px; color: var(--mut); margin: 0 0 22px; max-width: 72ch; }
.bar { position: sticky; top: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px; border-radius: 22px; background: var(--card); box-shadow: 0 14px 26px -16px rgba(0, 0, 0, .7); margin-bottom: 18px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.tab { height: 40px; padding: 0 14px; border-radius: 13px; background: transparent; color: var(--mut); font-weight: 600; font-size: 14px; transition: background 200ms var(--ease), color 200ms var(--ease); }
.tab b { font-weight: 500; opacity: .7; margin-left: 6px; }
.tab.on { background: var(--card2); color: var(--tx); }
.only { height: 40px; padding: 0 14px; border-radius: 13px; background: transparent; color: var(--mut); font-weight: 600; font-size: 14px; }
.only.on { background: color-mix(in srgb, var(--gold) 18%, var(--card)); color: var(--gold); }
.phrase { font-size: 15px; line-height: 22px; color: var(--mut); margin: 0 4px 16px; }
.phrase q { color: var(--tx); quotes: "«" "»"; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; }
.card > div { min-width: 0; }
.card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px; border-radius: 22px; background: var(--card); transition: background 200ms var(--ease); }
.card.playing { background: var(--card2); }
.play { width: 52px; height: 52px; border-radius: 50%; background: var(--acc); color: #0A0B0E; display: grid; place-items: center; transition: transform 240ms cubic-bezier(.3, 1.4, .5, 1); }
.play:active { transform: scale(.92); }
.play svg { width: 20px; height: 20px; fill: currentColor; }
.name { font-size: 15px; line-height: 20px; font-weight: 700; overflow-wrap: anywhere; }
.desc { font-size: 13px; line-height: 18px; color: var(--mut); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.open .desc { -webkit-line-clamp: unset; }
.meta { font-size: 12px; line-height: 16px; color: var(--mut); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.alt { height: 26px; padding: 0 10px; border-radius: 9px; background: var(--card2); color: var(--tx); font-size: 12px; font-weight: 600; }
.card.playing .alt { background: color-mix(in srgb, var(--tx) 12%, var(--card2)); }
.star { width: 40px; height: 40px; border-radius: 13px; background: transparent; color: var(--mut); font-size: 22px; line-height: 1; transition: transform 240ms cubic-bezier(.3, 1.4, .5, 1), color 200ms; }
.star.on { color: var(--gold); transform: scale(1.12); }
.empty { color: var(--mut); padding: 40px 4px; font-size: 15px; }
.picks { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(18px); box-shadow: 0 -14px 30px -18px rgba(0, 0, 0, .8); display: flex; gap: 12px; align-items: center; justify-content: center; }
.picks span { min-width: 0; font-size: 14px; color: var(--mut); max-width: 70ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picks span b { color: var(--tx); font-weight: 600; }
.copy { height: 44px; padding: 0 18px; border-radius: 14px; background: var(--acc); color: #0A0B0E; font-weight: 700; font-size: 14px; white-space: nowrap; }
.copy[disabled] { opacity: .35; cursor: default; }
</style>
</head>
<body>
<div class="page">
  <h1>Пробы ваших голосов</h1>
  <p class="lead">Все голоса, которые вы создали в ElevenLabs, с одной и той же фразой на каждом языке. Нажмите на круг, чтобы послушать, и на звезду, чтобы отметить понравившийся. Внизу — кнопка, которая копирует список отмеченных: пришлите его мне.</p>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <button class="only" id="only">★ Только отмеченные</button>
  </div>
  <p class="phrase" id="phrase"></p>
  <div class="grid" id="grid"></div>
</div>
<div class="picks"><span id="picksText"></span><button class="copy" id="copy">Скопировать список</button></div>
<script src="data.js"></script>
<script>
(function () {
  var TAG = '[VOICE-AUDITION]';
  var data = window.AUDITION;
  if (!data) { document.getElementById('grid').innerHTML = '<div class="empty">Не найден файл с пробами (data.js). Запустите генерацию проб заново.</div>'; console.error(TAG, 'нет window.AUDITION — data.js не загрузился'); return; }
  var LANGS = [['en', 'Английский'], ['es', 'Испанский'], ['de', 'Немецкий'], ['fr', 'Французский'], ['it', 'Итальянский'], ['ru', 'Русский']];
  var LANG_NAME = {}; LANGS.forEach(function (l) { LANG_NAME[l[0]] = l[1]; });
  var KEY = 'pm_voice_audition_picks_2026_11_11';
  var picks = {};
  // зачем: отметки должны пережить перезагрузку страницы; хранилище может быть недоступно (частный режим) — тогда отметки живут до закрытия.
  try { picks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { console.warn(TAG, 'отметки не прочитаны из хранилища:', e); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) { console.warn(TAG, 'отметки не сохранены:', e); } }
  var state = { lang: 'en', only: false, playing: null };
  var audio = new Audio();
  var PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', STOP = '<svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function stop() { audio.pause(); state.playing = null; mark(); }
  function play(id, lang) {
    var key = id + '_' + lang;
    if (state.playing === key) { stop(); return; }
    state.playing = key;
    audio.src = 'audio/' + key + '.mp3';
    audio.play().catch(function (e) { console.error(TAG, 'проба не проигралась', key, e); if (state.playing === key) stop(); });
    mark();
  }
  audio.addEventListener('ended', stop);
  audio.addEventListener('error', function () { console.error(TAG, 'файл пробы не открылся', audio.src); stop(); });

  function mark() {
    document.querySelectorAll('.card').forEach(function (card) {
      var on = !!state.playing && state.playing.indexOf(card.dataset.id + '_') === 0;
      card.classList.toggle('playing', on);
      card.querySelector('.play').innerHTML = state.playing === card.dataset.id + '_' + state.lang ? STOP : PLAY;
    });
  }

  function renderTabs() {
    document.getElementById('tabs').innerHTML = LANGS.map(function (l) {
      var n = data.voices.filter(function (v) { return v.langs.indexOf(l[0]) >= 0; }).length;
      return '<button class="tab' + (state.lang === l[0] ? ' on' : '') + '" data-lang="' + l[0] + '">' + l[1] + '<b>' + n + '</b></button>';
    }).join('');
    document.getElementById('only').classList.toggle('on', state.only);
  }

  function render() {
    renderTabs();
    document.getElementById('phrase').innerHTML = 'Фраза: <q>' + esc(data.phrases[state.lang]) + '</q>';
    var list = data.voices.filter(function (v) { return v.langs.indexOf(state.lang) >= 0 && (!state.only || picks[v.id]); });
    document.getElementById('grid').innerHTML = list.length ? list.map(function (v) {
      var others = v.langs.filter(function (l) { return l !== state.lang; });
      return '<div class="card" data-id="' + v.id + '">' +
        '<button class="play" data-play="' + state.lang + '" aria-label="Слушать">' + PLAY + '</button>' +
        '<div><div class="name">' + esc(v.name) + '</div>' +
        (v.description ? '<div class="desc" data-more>' + esc(v.description) + '</div>' : '') +
        '<div class="meta">' + (v.created ? '<span>создан ' + v.created.split('-').reverse().join('.') + '</span>' : '') +
        others.map(function (l) { return '<button class="alt" data-play="' + l + '">▶ ' + LANG_NAME[l].toLowerCase() + '</button>'; }).join('') + '</div></div>' +
        '<button class="star' + (picks[v.id] ? ' on' : '') + '" data-star aria-label="Отметить">' + (picks[v.id] ? '★' : '☆') + '</button></div>';
    }).join('') : '<div class="empty">' + (state.only ? 'В этом языке пока ничего не отмечено.' : 'Для этого языка проб нет.') + '</div>';
    mark();
    var chosen = data.voices.filter(function (v) { return picks[v.id]; });
    document.getElementById('picksText').innerHTML = chosen.length ? 'Отмечено: <b>' + chosen.length + '</b> — ' + esc(chosen.map(function (v) { return v.name; }).join(', ')) : 'Отметьте звездой голоса, которые нравятся';
    document.getElementById('copy').disabled = !chosen.length;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, [data-more]');
    if (!t) return;
    var card = t.closest('.card');
    if (t.dataset.lang) { stop(); state.lang = t.dataset.lang; render(); }
    else if (t.id === 'only') { state.only = !state.only; render(); }
    else if (t.dataset.play && card) play(card.dataset.id, t.dataset.play);
    else if (t.hasAttribute('data-star') && card) { if (picks[card.dataset.id]) delete picks[card.dataset.id]; else picks[card.dataset.id] = 1; save(); render(); }
    else if (t.hasAttribute('data-more') && card) card.classList.toggle('open');
    else if (t.id === 'copy') {
      var text = data.voices.filter(function (v) { return picks[v.id]; }).map(function (v) { return v.name + ' — ' + v.langs.map(function (l) { return LANG_NAME[l].toLowerCase(); }).join(' + ') + ' — ' + v.id; }).join('\n');
      var done = function () { t.textContent = 'Скопировано'; setTimeout(function () { t.textContent = 'Скопировать список'; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function (err) { console.error(TAG, 'буфер обмена отказал:', err); window.prompt('Скопируйте список вручную:', text); });
      else window.prompt('Скопируйте список вручную:', text);
    }
  });
  render();
})();
</script>
</body>
</html>
