  <link rel="stylesheet" href="./theme-bridge.css?v=20260816-2" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') document.documentElement.setAttribute('data-theme', stored);
      } catch (e) { /* приватный режим */ }
    })();
  </script>
