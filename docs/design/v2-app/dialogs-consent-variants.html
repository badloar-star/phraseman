<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Согласие: варианты</title>
<link rel="stylesheet" href="kit.css">
<style>
@font-face { font-family: IoniconsApp; src: url(assets/Ionicons.ttf); }
.io { font-family: IoniconsApp; font-style: normal; font-weight: 400; line-height: 1; display: inline-block; }

/* ── темы ── */
.ph.th-ink { --bg: linear-gradient(180deg, #F3F4FD 0%, #EAEBFE 55%, #ECE4F7 100%); --top: #F3F4FD; --bot: #ECE4F7; --tx: #17181E; --sec: #595A63;
  --card: #FCFCFF; --ctl: #E6E7F4; --ctl2: #D8D9EA; --sh: 0 10px 26px -14px rgba(51, 51, 87, .30), inset 0 1px 0 rgba(255, 255, 255, .9);
  --sh2: 0 26px 50px -22px rgba(51, 51, 87, .55); --acc: oklch(.52 .14 282); --solid: #17181E; --on-solid: #FFFFFF; --good: #2B8A5E;
  --sb: #111; --dimc: rgba(23, 24, 30, .38); --lz: .55; --cz: .15; --lw: .58; --cw: .14; }
.ph.th-marine { --bg: linear-gradient(180deg, #002936 0%, #000F16 55%, #001B17 100%); --top: #002936; --bot: #001B17; --tx: #F6FBFD; --sec: #B8CFD6;
  --card: #002027; --ctl: #123037; --ctl2: #1D3F47; --sh: 0 12px 28px -14px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .06);
  --sh2: 0 30px 60px -24px rgba(0, 0, 0, .9); --acc: oklch(.82 .11 215); --solid: #F6FBFD; --on-solid: #00131A; --good: #4CC98C;
  --sb: #fff; --dimc: rgba(0, 0, 0, .55); --lz: .40; --cz: .11; --lw: .78; --cw: .11; }
.ph.th-ink, .ph.th-marine { background: var(--bg) !important; color: var(--tx); }
.ph.th-ink .sb, .ph.th-marine .sb { color: var(--sb); background: none; }
.ph.th-ink .sb .bat, .ph.th-marine .sb .bat { border-color: currentColor; }
.ph.th-ink .sb .bat::after, .ph.th-marine .sb .bat::after { background: currentColor; }
.ph.th-ink .sb .sys svg { filter: brightness(0); }
.ph.th-marine .sb svg { filter: none; }
/* статус-бар поверх обложки — белый в обеих темах */
.ph.onart .sb { color: #fff; } .ph.onart .sb .sys svg { filter: none !important; }

/* ── общие детали ── */
.qhd { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.qhd .tt { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -.5px; display: flex; align-items: center; gap: 6px; }
.qhd .tt .io { font-size: 17px; color: var(--sec); margin-top: 3px; }
.qhd .sp { flex: 1; }
.qsub { font-size: 15px; line-height: 20px; color: var(--sec); margin-top: 2px; }
.qround { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: var(--card); box-shadow: var(--sh); font-size: 20px; color: var(--tx); flex: none; }
.qround.glass { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.qbtn { height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700; padding: 0 22px; white-space: nowrap; }
.qbtn .io { font-size: 18px; }
.qbtn.solid { background: var(--solid); color: var(--on-solid); }
.qbtn.white { background: #FFFFFF; color: #121318; }
.qbtn.ctl { background: var(--ctl); color: var(--tx); height: 50px; border-radius: 25px; font-size: 16px; }
.qbtn.glass { background: rgba(255, 255, 255, .16); color: #fff; height: 50px; border-radius: 25px; font-size: 16px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.qbtn + .qbtn { margin-top: 12px; }
.qnote { font-size: 13px; line-height: 17px; color: var(--sec); text-align: center; margin-top: 8px; }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { height: 34px; padding: 0 12px; border-radius: 17px; background: var(--ctl); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--tx); }
.qchip.glass { background: rgba(255, 255, 255, .16); color: #fff; }
.qcard { border-radius: 26px; background: var(--card); box-shadow: var(--sh); padding: 16px; }
.qk { font-size: 13px; line-height: 17px; font-weight: 700; color: var(--sec); display: flex; align-items: center; gap: 6px; }
.qk .io { font-size: 14px; }
.qt { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.3px; text-wrap: balance; margin-top: 4px; }
.qm { font-size: 14px; line-height: 19px; color: var(--sec); }
.qsay { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.qsay .sp { width: 44px; height: 44px; border-radius: 22px; background: var(--ctl); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; color: var(--tx); }
.qsay .sp.on { background: var(--solid); color: var(--on-solid); }
.qsay .en { font-size: 19px; line-height: 24px; font-weight: 700; }
.qsay .ru { font-size: 14px; line-height: 19px; color: var(--sec); }
.qlock { display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; color: var(--sec); }
.qlock .io { font-size: 15px; }
.stars { display: inline-flex; gap: 2px; font-size: 12px; color: var(--acc); vertical-align: middle; }
.stars .off { opacity: .28; }
.rbar { height: 4px; border-radius: 2px; background: var(--ctl); overflow: hidden; }
.rbar i { display: block; height: 100%; background: var(--acc); border-radius: 2px; }

/* аватар с кольцом Plus (эталон plus-ring-etalon.html): зазор — подложкой, чтобы его не снимала страховка обводок */
.pav { position: relative; display: inline-flex; border-radius: 50%; padding: 2.5px; flex: none; background: conic-gradient(from 200deg, #8E7CFF, #6FA8FF, #7FE0D8, #C69BFF, #8E7CFF); }
.pav .gap { display: flex; padding: 2px; border-radius: 50%; background: var(--top); }
.pav .gap img { display: block; border-radius: 50%; }
.pav .pin { position: absolute; right: -2px; bottom: -2px; width: 15px; height: 15px; border-radius: 50%; background: linear-gradient(135deg, #8E7CFF, #6FA8FF); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 8.5px; box-shadow: 0 0 0 2px var(--top); }
.onart .pav .gap { background: rgba(0, 0, 0, .25); } .onart .pav .pin { box-shadow: 0 0 0 2px rgba(0, 0, 0, .25); }

/* плавающий таббар 2.0 (как в эталоне Главной), подписи из кода: Главная · Обучение · Видео · Сообщество · Настройки */
.qfade { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 30; pointer-events: none; background: linear-gradient(to bottom, color-mix(in srgb, var(--bot) 0%, transparent), var(--bot) 72%); }
.tbar { position: absolute; left: 12px; right: 12px; bottom: 26px; height: 66px; border-radius: 33px; z-index: 35; display: flex; padding: 0 9px; backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); }
.th-ink .tbar { background: linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(246, 246, 253, .92)); box-shadow: inset 1px 1.5px 0 -.2px rgba(255, 255, 255, .95), 0 20px 40px -18px rgba(51, 51, 87, .5); }
.th-marine .tbar { background: linear-gradient(180deg, rgba(6, 56, 70, .84), rgba(0, 28, 36, .94)); box-shadow: inset 1px 1.5px 0 -.2px rgba(255, 255, 255, .16), 0 22px 44px -14px rgba(0, 0, 0, .85); }
.tbar .cap { position: absolute; top: 9px; bottom: 9px; left: calc(9px + (100% - 18px) / 5); width: calc((100% - 18px) / 5); border-radius: 18px; }
.th-ink .tbar .cap { background: rgba(23, 24, 30, .07); }
.th-marine .tbar .cap { background: rgba(255, 255, 255, .11); box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .14); }
.tbar .ti { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; line-height: 12px; position: relative; z-index: 1; color: var(--sec); }
.tbar .ti .io { font-size: 22px; }
.tbar .ti.on { color: var(--tx); font-weight: 700; }

/* шторка и затемнение */
.qdim { position: absolute; inset: 0; z-index: 40; background: var(--dimc); }
.qsheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 45; border-radius: 30px 30px 0 0; background: var(--card); box-shadow: 0 -20px 50px -20px rgba(0, 0, 0, .45); padding: 10px 20px 34px; }
.qgrab { width: 40px; height: 5px; border-radius: 3px; background: var(--ctl2); margin: 0 auto 14px; }

/* кадр эпизода: градиент главы + фраза эпизода (вместо стоп-кадра сериала) */
.still { position: relative; border-radius: 18px; overflow: hidden; color: #fff; }
.still .gl { position: absolute; right: -14px; top: -10px; font-size: 120px; color: rgba(255, 255, 255, .12); transform: rotate(-8deg); }
.still .ph1 { position: absolute; left: 14px; right: 14px; bottom: 12px; font-size: 21px; line-height: 25px; font-weight: 700; letter-spacing: -.2px; text-wrap: balance; }
.still .no { position: absolute; left: 10px; top: 10px; height: 26px; padding: 0 9px; border-radius: 13px; background: rgba(0, 0, 0, .24); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.still .no .io { font-size: 12px; }
.still .st { position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 13px; background: rgba(255, 255, 255, .24); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.still .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, .26); }
.still .prog i { display: block; height: 100%; background: #fff; }
.still.lock::after { content: ''; position: absolute; inset: 0; background: rgba(8, 10, 18, .40); }
.still.lock .no, .still.lock .ph1 { z-index: 1; }
.still.lock .ph1 { opacity: .78; }

.thm { padding: 14px 0 0; display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.chp { height: 38px; padding: 0 14px; border-radius: 19px; background: #1C1C1F; color: #C9C9CF; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; cursor: pointer; }
.chp.on { background: #F2F1F6; color: #0B0C0E; }
.rec { display: inline-block; margin-left: 10px; padding: 3px 10px; border-radius: 9px; background: rgba(110, 200, 140, .16); color: #5FD08E; font-size: 13px; font-weight: 700; vertical-align: middle; }
.cmp { border-collapse: collapse; width: 100%; max-width: 1400px; font-size: 14px; line-height: 20px; color: #C9C9CF; margin-top: 6px; }
.cmp th, .cmp td { text-align: left; vertical-align: top; padding: 11px 16px 11px 0; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .08); }
.cmp th { color: #8E8E96; font-size: 13px; font-weight: 700; }
.cmp td b { color: #F2F2F4; }
@media (prefers-reduced-motion: reduce) { .ph *, .ph *::before, .ph *::after { transition: none !important; animation: none !important; } }

/* ── общее ── */
.hm-top { display: flex; align-items: center; gap: 8px; }
.hm-pill { height: 36px; padding: 0 12px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; background: var(--card); box-shadow: var(--sh); font-size: 15px; font-weight: 700; color: var(--tx); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hm-pill img { width: 20px; height: 20px; border-radius: 50%; display: block; }
.hm-pill .io { font-size: 18px; }
.hm-pill.glass { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.hm-pill.ember { color: oklch(.64 .19 28); }
.th-marine .hm-pill.ember { color: oklch(.76 .15 30); }
.hm-pill.glass.ember { color: #FFB4A3; }
.hm-pill .sub { font-size: 12px; font-weight: 700; opacity: .8; }
.hm-bell { position: relative; }
.hm-bell i.dot { position: absolute; right: 9px; top: 9px; width: 8px; height: 8px; border-radius: 4px; background: oklch(.64 .19 28); box-shadow: 0 0 0 2px var(--card); }
.hm-sp { flex: 1; }
.hm-off { display: flex; align-items: center; gap: 10px; border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 19px; background: var(--card); box-shadow: var(--sh); color: var(--tx); }
.hm-off .io { font-size: 18px; color: var(--sec); }
.hm-off b { font-weight: 700; }
.hm-off.glass { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); backdrop-filter: blur(16px); }
.hm-off.glass .io { color: #fff; }
.hm-h { display: flex; align-items: baseline; gap: 8px; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -.2px; }
.hm-h span { margin-left: auto; font-size: 15px; font-weight: 400; color: var(--sec); }
/* ───────── PhraseMan 2.0 · Диалоги · «Сцена» v2 (правки владельца 21.10) ─────────
   зачем: 1) «каждая цветовая тема имеет свои цвета» — ни одного зашитого оттенка: всё из токенов темы (liquidGlassTokens, уровень
   «Акцент»), переменные кладутся на телефон; 2) «обрезано ничего не должно быть» — у колец, теней и подписей нет overflow:hidden-
   соседей, длинные названия переносятся, есть проверка на телефоне 360 px; 3) «выбирается ДИАЛОГ» — главный выбор — карточка
   диалога (название, мир, цели), собеседник — часть карточки. Веса 400/700, обводок контейнеров нет. */
.page-lead b { color: #F2F2F4; }
.dl-need { max-width: 430px; margin-top: 12px; font-size: 13px; line-height: 19px; color: #A9A9B2; }
.dl-need b { color: #E6E6EA; font-weight: 700; }
.dl-need ul { margin: 4px 0 0; padding-left: 18px; }
.dl-why { max-width: 1100px; margin-top: 14px; font-size: 15px; line-height: 23px; color: #C9C9CF; }
.dl-why b { color: #F2F2F4; }
.dl-why ul { margin: 8px 0 0; padding-left: 20px; }
.thm { flex-wrap: wrap; row-gap: 8px; }
.thm .lb { font-size: 13px; color: #8E8E96; font-weight: 700; margin-right: 6px; }
.thm .sw { width: 14px; height: 14px; border-radius: 7px; margin-right: 6px; flex: none; }
.thm + .thm { margin-top: 0; padding-top: 8px; }
.gal .phones { gap: 26px 20px; }

/* ── телефон в теме: все цвета — переменные из токенов ── */
.ph.dl { background: linear-gradient(180deg, var(--top) 0%, var(--bg0) 55%, var(--bot) 100%) !important; color: var(--tx); }
.ph.dl .sb { color: var(--tx); background: none; }
.ph.dl .sb .bat { border-color: currentColor; } .ph.dl .sb .bat::after { background: currentColor; }
.ph.dl.lt .sb .sys svg { filter: brightness(0); }
.ph.dl.narrow { width: 360px; height: 780px; border-radius: 48px; }
.ph.dl .tbar { background: color-mix(in srgb, var(--card) 88%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 14%, transparent), 0 20px 40px -18px var(--shc); }
.ph.dl .tbar .cap { background: var(--sel); }
.ph.dl .tbar .ti.on { color: var(--acc); }
.ph.dl .qfade { background: linear-gradient(to bottom, color-mix(in srgb, var(--bot) 0%, transparent), var(--bot) 72%); }
.ph.dl .qround, .ph.dl .hm-pill { background: var(--card); color: var(--tx); }
.ph.dl .qbtn.solid { background: var(--cta); color: var(--cta-ink); }
.ph.dl .qbtn.ctl, .ph.dl .qchip { background: var(--ctl); color: var(--tx); }
.ph.dl .qsheet { background: var(--sheet); }
.ph.dl .qdim { background: color-mix(in srgb, #000 48%, transparent); }
.ph.dl .pav .gap { background: var(--top); }
.ph.dl .pav .pin { box-shadow: 0 0 0 2px var(--top); }
/* «стекло» на сцене — тоном текста темы, а не белым: читается и в светлых темах */
.gl { background: color-mix(in srgb, var(--tx) 12%, transparent); color: var(--tx); box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 18%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

/* ── сцена: свет из bgGlow и accentGradient темы ── */
.sc { position: relative; color: var(--tx); isolation: isolate; border-radius: 0 0 36px 36px; }
.sc .light { position: absolute; inset: 0; z-index: -2; border-radius: inherit; overflow: hidden;
  background: radial-gradient(70% 46% at 84% 14%, var(--l1), transparent 70%), radial-gradient(60% 42% at 8% 0%, var(--l2), transparent 72%),
    radial-gradient(80% 50% at 50% 100%, var(--l3), transparent 70%), linear-gradient(170deg, var(--top), var(--bg0)); }
/* зачем (владелец 22.10 ночью через координатора: в тёмном «сливается и некрасиво»): в тёмном оформлении низ сцены был цветом фона,
   а панель — почти тем же (контраст на стыке 1,01–1,05). Основа сцены в тёмном — 30 % акцента темы поверх фона, без чёрного затемнения:
   стык ≥ 1,34 во всех 23 темах (светлые ≈ 1,2), вторичный текст на сцене ≥ 5,4. Проверка — таблица «Тон сцены и панели». */
.ph.dl:not(.lt) .sc .light { background: radial-gradient(70% 46% at 84% 14%, var(--l1), transparent 70%), radial-gradient(60% 42% at 8% 0%, var(--l2), transparent 72%),
  linear-gradient(170deg, color-mix(in srgb, var(--g1) 30%, var(--top)), color-mix(in srgb, var(--g2) 30%, var(--bg0))); }
.ph.dl:not(.lt) .sc .scrim { display: none; }
.sc.eve .light::after { content: ''; position: absolute; right: -10%; top: -6%; width: 80%; height: 60%; background: radial-gradient(closest-side, color-mix(in srgb, var(--acc) 45%, transparent), transparent); }
.sc .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; z-index: -1; border-radius: inherit; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bot) 62%, transparent)); }
/* место под 3D-героя: свет в тон темы + метка, кого рисовать (метка сверху — не спорит с заголовком) */
.h3d { position: absolute; z-index: 0; pointer-events: none; }
.h3d .halo { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(closest-side, var(--halo), color-mix(in srgb, var(--halo) 20%, transparent) 62%, transparent); }
.h3d .floor { position: absolute; left: 16%; right: 16%; bottom: 0; height: 8%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, #000 30%, transparent), transparent); }
.h3d .ini { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 88px; font-weight: 700; letter-spacing: -2px; color: color-mix(in srgb, var(--tx) 22%, transparent); }
/* метка прижата к правому краю места героя — длинная подпись растёт внутрь экрана, а не за край */
.h3d .tag { position: absolute; right: 0; top: 2%; white-space: nowrap; height: 24px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--tx); background: color-mix(in srgb, var(--tx) 12%, transparent); }
.h3d .tag .io { font-size: 12px; }
.h3d.dim .halo, .h3d.dim .ini { opacity: .45; }
.sc-top { position: absolute; left: 20px; right: 20px; top: 56px; z-index: 2; display: flex; align-items: center; gap: 8px; }
.sc-body { position: absolute; left: 20px; right: 20px; bottom: 56px; z-index: 2; }
.sc-kick { font-size: 14px; line-height: 19px; color: var(--sec); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sc-kick .io { font-size: 14px; }
.sc-title { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.6px; margin-top: 4px; text-wrap: balance; overflow-wrap: anywhere; }
.narrow .sc-title { font-size: 28px; line-height: 34px; }
.sc-title.s { font-size: 28px; line-height: 34px; }
.sc-sub { font-size: 15px; line-height: 21px; color: var(--sec); margin-top: 8px; text-wrap: pretty; }
.sc-prog { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; color: var(--sec); flex-wrap: wrap; }
.sc-prog .bar { flex: 0 0 72px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--tx) 18%, transparent); overflow: hidden; }
.sc-prog .bar i { display: block; height: 100%; background: var(--acc); }
.sc-cta { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
.sc-cta .qbtn { flex: 1; min-width: 0; margin: 0; background: var(--cta); color: var(--cta-ink); }
.sc-cta .qbtn.off { opacity: .45; }
.sc-cta .qround { width: 54px; height: 54px; border-radius: 27px; font-size: 22px; }
.gpill { height: 36px; padding: 0 12px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gpill .io { font-size: 16px; }
.gpill.plus { background: color-mix(in srgb, var(--acc) 26%, transparent); color: var(--tx); }
.sp { flex: 1; }
.chip-pp { display: inline-flex; align-items: center; gap: 6px; }

/* ── панель над сценой ── */
.dpanel { position: relative; z-index: 3; margin: -38px 16px 0; border-radius: 28px; background: var(--card); box-shadow: 0 26px 50px -22px var(--shc); padding: 16px; }
.ph-h { display: flex; align-items: baseline; gap: 8px; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -.2px; }
.ph-h span { margin-left: auto; font-size: 15px; font-weight: 400; color: var(--sec); white-space: nowrap; }
/* фильтр миров — сегмент, без горизонтальной обрезки: переносится */
.wseg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.wseg .qchip { height: 34px; }
.wseg .qchip.on { background: var(--cta); color: var(--cta-ink); }

/* карточка диалога: название, мир, цели; собеседник — внутри */
.dcards { display: grid; gap: 10px; margin-top: 12px; }
.dcard { position: relative; border-radius: 22px; padding: 14px 14px 14px 16px; background: var(--ctl); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
.dcard.cur { background: color-mix(in srgb, var(--acc) 16%, var(--ctl)); }
.dcard .w { grid-column: 1; font-size: 13px; line-height: 17px; font-weight: 700; color: var(--sec); display: flex; align-items: center; gap: 6px; }
.dcard .w .io { font-size: 14px; }
.dcard .t { grid-column: 1; font-size: 17px; line-height: 22px; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.dcard .g { grid-column: 1; font-size: 14px; line-height: 19px; color: var(--sec); }
.dcard .who { grid-column: 1; display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; line-height: 19px; color: var(--sec); min-width: 0; }
.dcard .who b { color: var(--tx); font-weight: 700; }
.dcard .end { grid-column: 2; grid-row: 1 / span 4; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dcard .ok { width: 28px; height: 28px; border-radius: 14px; background: var(--good); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.dcard .go { width: 36px; height: 36px; border-radius: 18px; background: var(--cta); color: var(--cta-ink); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.dcard .ring { font-size: 12px; font-weight: 700; color: var(--acc); font-variant-numeric: tabular-nums; }
/* лицо собеседника — тоном темы; кольцо — тенью-обводкой без обрезки (у родителя нет overflow) */
.av { flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--acc-ink);
  background: linear-gradient(150deg, var(--g1), var(--g2)); }

/* ── диалог ── */
.dl-head { position: relative; height: 250px; border-radius: 0; }
.narrow .dl-head { height: 220px; }
.dl-bar { position: absolute; left: 16px; right: 16px; top: 54px; z-index: 3; display: flex; align-items: center; gap: 8px; }
.dl-who { position: absolute; left: 20px; right: 150px; bottom: 44px; z-index: 2; }
.dl-who b { display: block; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -.4px; }
.dl-who span { display: block; font-size: 14px; line-height: 19px; color: var(--sec); text-wrap: balance; }
.chat { position: relative; z-index: 3; margin: -26px 0 0; border-radius: 28px 28px 0 0; background: var(--card); box-shadow: 0 -10px 40px -24px var(--shc); padding: 18px 16px 0; min-height: 720px; }
.goal-toast { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13.5px; font-weight: 700; background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); margin: 4px auto 10px; }
.msg { max-width: 84%; margin: 0 0 10px; padding: 11px 14px; border-radius: 20px; font-size: 16.5px; line-height: 23px; overflow-wrap: anywhere; }
.msg.them { background: var(--ctl); color: var(--tx); border-bottom-left-radius: 6px; }
.msg.me { margin-left: auto; background: var(--cta); color: var(--cta-ink); border-bottom-right-radius: 6px; }
.msg .tr { display: block; margin-top: 8px; padding-top: 8px; font-size: 14.5px; line-height: 20px; color: var(--sec); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--tx) 12%, transparent); }
.msg .tap { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--acc); }
.msg .tap .io { font-size: 14px; }
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; border-radius: 20px; border-bottom-left-radius: 6px; background: var(--ctl); }
.typing i { width: 7px; height: 7px; border-radius: 4px; background: var(--sec); opacity: .7; }
.composer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 35; padding: 12px 16px 34px; background: linear-gradient(to bottom, color-mix(in srgb, var(--card-o) 0%, transparent), var(--card-o) 28%); }
.composer .row { display: flex; align-items: center; gap: 10px; }
.composer .dfield { flex: 1; min-width: 0; height: 52px; border-radius: 26px; background: var(--ctl); display: flex; align-items: center; padding: 0 18px; font-size: 16px; color: var(--sec); white-space: nowrap; }
.composer .mic { width: 64px; height: 64px; border-radius: 32px; flex: none; background: var(--cta); color: var(--cta-ink); display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 14px 28px -12px var(--shc); }
.composer .hint { text-align: center; font-size: 13px; color: var(--sec); margin-top: 8px; }
.goals-chip { height: 36px; padding: 0 12px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; white-space: nowrap; }

/* цели */
.goal { display: flex; align-items: center; gap: 12px; padding: 9px 0; font-size: 16px; line-height: 21px; }
.goal .ck { width: 26px; height: 26px; border-radius: 13px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--tx) 22%, transparent); color: transparent; }
.goal.on .ck { background: var(--good); box-shadow: none; color: #fff; }
.goal.miss { color: var(--sec); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.stat { border-radius: 18px; padding: 12px; }
.stat b { display: block; font-size: 24px; line-height: 28px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--sec); }
.btns { display: grid; gap: 10px; margin: 16px 16px 40px; }
.btns .qbtn + .qbtn { margin-top: 0; }

/* согласие */
.consent .qsheet { padding-top: 0; }
.consent .sheet-art { position: relative; height: 180px; margin: 0 -20px 16px; border-radius: 30px 30px 0 0; }
.consent h3 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -.3px; }
.consent p { margin: 10px 0 0; font-size: 16px; line-height: 23px; color: var(--sec); }
.consent .dnote { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 14px; line-height: 20px; color: var(--sec); }
.consent .dnote .io { font-size: 18px; color: var(--acc); }

/* лимит */
.meter { display: flex; gap: 4px; margin-top: 12px; }
.meter i { flex: 1; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--tx) 18%, transparent); }
.meter i.on { background: var(--acc); }
.plus-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 16px; line-height: 21px; }
.plus-row .io { font-size: 20px; color: var(--acc); width: 26px; text-align: center; }
.hm-off.gl { background: color-mix(in srgb, var(--tx) 12%, transparent); color: var(--tx); }
.hm-off.gl .io { color: var(--tx); }
@media (prefers-reduced-motion: reduce) { .ph *, .ph *::before, .ph *::after { transition: none !important; animation: none !important; } }

/* ── лист согласия без букв (владелец 22.10): варианты верха ── */
.consent .cv-top { display: grid; place-items: center; }
.consent .cv-art { position: relative; z-index: 1; width: 150px; height: 150px; object-fit: contain; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .28)); }
.consent .cv-pair { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; padding: 0 16px; }
.consent .cv-who { display: grid; justify-items: center; gap: 4px; width: 110px; text-align: center; color: var(--tx); }
.consent .cv-who b { font-size: 15px; }
.consent .cv-who small { font-size: 12px; line-height: 15px; color: var(--sec); }
.consent .cv-av { width: 62px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.consent .cv-link { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
.consent .cv-corner { position: absolute; right: 10px; top: 8px; width: 70px; height: 70px; object-fit: contain; z-index: 1; opacity: .95; }
.consent .cv-chat { position: relative; z-index: 1; width: 100%; padding: 16px 92px 8px 18px; }
.consent .cv-chat .msg { font-size: 13.5px; line-height: 18px; padding: 8px 11px; margin-bottom: 6px; max-width: 92%; }

</style>
</head>

  <p class="page-lead">Владелец 22.10: в листе согласия не нравятся огромные буквы-заглушки «М» и «Д» вместо персонажей. Три варианта верха листа без букв — на настоящем входе в «Диалоги», в цветах любой из тем. Код приложения не менялся.</p>

  <div class="msg them">Hi! You must be new here. I'm Marina, I run the design team.</div>
  <div class="msg me">Hi Marina, I'm Alex. I'm the new QA engineer.</div>
  <div style="text-align:center"><span class="goal-toast">${io('checkmark-circle')}назвать себя</span></div>
  <div class="msg them t">Nice to meet you, Alex! What are you working on today?<span class="tr">Приятно познакомиться, Алекс! Над чем ты сегодня работаешь?</span></div>
  <div class="msg them t">Do you need anything from my team?<span class="tap">${io('language-outline')}Перевести</span></div>
  <div class="typing" aria-label="Марина пишет"><i></i><i></i><i></i></div>`;
const goalsList = (goals, done) => goals.map((g, i) => `<div class="goal${done.includes(i) ? ' on' : ' miss'}"><span class="ck">${io('checkmark')}</span>${g}</div>`).join('');

/* что нарисовать */
const NEED = {
  hub: ['3D: Мила по пояс, смотрит на зрителя, рука приподнята «привет»', 'Без собственного цвета: свет и фон сцены дают токены темы, герой — нейтральный, чтобы жить в любой из 23 тем', 'Значки миров: Общение, Дела, Поездки, Повседневное'],
  pick: ['3D: Марина по пояс, с планшетом, деловая полуулыбка'],
  talk: ['3D: Марина крупно (плечи и голова), 3 эмоции: слушает · улыбается · ждёт ответа'],
  done: ['3D: Марина довольна, кивает или большой палец вверх', 'Праздничное сияние за героем — цвет берётся из акцента темы'],
  consent: ['3D: Мила и Денис вместе, приветливо, для шапки листа'],
  limit: ['3D: Мила сидит, ждёт (поза «до встречи»), приглушённо'],
  plus: ['3D: Мила, как на входе'],
  off: ['3D: Мила, приглушённо, «на паузе» (взгляд в сторону)'],
};
const need = (k) => `<div class="dl-need"><b>Картинки:</b><ul>${NEED[k].map((x) => `<li>${x}</li>`).join('')}</ul></div>`;

/* ═════ A · Сцена ═════ */
const stage = (s, inner, h, pid, pose, box, top) => `<div class="sc${s.eve ? ' eve' : ''}" style="height:${h}px"><div class="light"></div>${h3d(pid, box, pose, s.off || s.limit)}<div class="scrim"></div>`
  + `<div class="sc-top">${top || `${quota(s)}<span class="sp"></span>${avatarMe(s.plus)}`}</div><div class="sc-body">${s.off ? `<div style="margin-bottom:14px">${offBar()}</div>` : ''}${inner}</div></div>`;
const heroBox = (s) => s.narrow ? 'right:8px;top:100px;width:176px;height:220px' : 'right:10px;top:96px;width:216px;height:270px';
const hubInner = (s) => {
  if (s.off) return `<div class="sc-kick">Продолжить · Общение</div><div class="sc-title">Диалоги недоступны</div><div class="sc-sub">Собеседник отвечает с сервера — разговор продолжится, когда появится сеть.</div><div class="sc-cta"><div class="qbtn off">${io('reload')}Повторить</div></div>`;
  if (s.limit) return `<div class="sc-kick">${io('time-outline')}Новые ответы 1 ноября</div><div class="sc-title s">Ответы месяца закончились — продолжи с Plus</div><div class="meter">${Array.from({ length: 10 }, () => '<i class="on"></i>').join('')}</div><div class="sc-prog">30 из 30 ответов · голосом 3 раза в день</div><div class="sc-cta"><div class="qbtn t">${io('diamond')}Plus снимает лимит</div></div>`;
  return `<div class="sc-kick">${io('people-outline')}Общение · с Милой</div><div class="sc-title">Поздороваться после знакомства</div><div class="sc-prog"><span class="bar"><i style="width:33%"></i></span>2 из 6 целей</div><div class="sc-cta"><div class="qbtn t">${io('play')}Продолжить</div><span class="qround gl t" aria-label="Сказать голосом">${io('mic')}</span></div>`;
};
const dialogsPanel = (s) => `<div class="dpanel"${s.off ? ' style="opacity:.6"' : ''}><div class="ph-h">Диалоги<span>76</span></div><div class="wseg"><span class="qchip on t">Все</span>${Object.values(WORLD).map(([n]) => `<span class="qchip t">${n}</span>`).join('')}</div>`
  + `<div class="dcards">${dcard('work_01')}${dcard('travel_02')}${dcard('social_19')}${dcard('everyday_01', 'done')}</div></div>`;
const plusPanel = () => `<div class="dpanel"><div class="plus-row">${io('infinite')}Диалоги без лимита</div><div class="plus-row">${io('mic')}Голосом без лимита</div><div class="plus-row">${io('flash')}Уроки без энергии</div></div>`;
const hub = (s, o = {}) => T(phone(`${stage(s, hubInner(s), s.narrow ? 470 : 520, 'mila', s.limit ? 'ждёт' : s.off ? 'на паузе' : 'машет', heroBox(s))}${s.limit ? plusPanel() : dialogsPanel(s)}<div style="height:140px"></div>`,
  { time: s.time, inStyle: 'padding:0', fixed: tabbar() }), { ...o, narrow: s.narrow });
const pick = (s, o = {}) => T(phone(stage(s, `<div class="sc-kick">${io('briefcase-outline')}Дела · с Мариной</div><div class="sc-title s">${D.work_01.t}</div><div class="sc-sub">${D.work_01.brief}</div><div class="sc-cta"><div class="qbtn t">${io('play')}Начать диалог</div></div>`, s.narrow ? 600 : 560, 'marina', 'с планшетом', s.narrow ? 'right:8px;top:100px;width:160px;height:190px' : 'right:10px;top:96px;width:196px;height:230px', `<span class="qround gl t">${io('chevron-back')}</span><b style="font-size:17px">Диалог</b><span class="sp"></span>${quota(s)}`)
  + `<div class="dpanel"><div class="ph-h">Цели диалога<span>6</span></div>${goalsList(D.work_01.list, [])}</div><div class="dpanel" style="margin-top:14px"><div class="ph-h">Ещё в «Делах»<span>19</span></div><div class="dcards">${dcard('work_06')}${dcard('work_02', 'done')}</div></div><div style="height:140px"></div>`,
  { time: s.time, inStyle: 'padding:0', fixed: tabbar() }), { ...o, narrow: s.narrow });
const talk = (s, o = {}) => T(phone(`<div class="sc dl-head"><div class="light"></div>${h3d('marina', s.narrow ? 'right:8px;top:98px;width:140px;height:120px' : 'right:12px;top:98px;width:170px;height:150px', 'слушает')}<div class="scrim"></div>`
  + `<div class="dl-bar"><span class="qround gl t">${io('close')}</span><span class="sp"></span><span class="goals-chip gl t">${io('flag-outline')}Цели 2 из 6</span></div><div class="dl-who"><b>Марина</b><span>Представиться коллеге</span></div></div><div class="chat">${chat()}</div>`,
  { time: s.time, inStyle: 'padding:0', fixed: `<div class="composer"><div class="row"><div class="dfield">Напиши или говори</div><span class="mic t" aria-label="Зажми и говори">${io('mic')}</span></div><div class="hint">Или зажми и говори</div></div>` }), { ...o, narrow: s.narrow });
const done = (s, o = {}) => T(phone(stage(s, `<div class="sc-kick">Представиться коллеге · с Мариной</div><div class="sc-title">Диалог пройден</div><div class="stats3"><div class="stat gl"><b>5/6</b><span>целей</span></div><div class="stat gl"><b>92%</b><span>точность</span></div><div class="stat gl"><b>1</b><span>ошибка</span></div></div>`, 520, 'marina', 'довольна', heroBox(s), `<span class="qround gl t">${io('close')}</span><span class="sp"></span>`)
  + `<div class="dpanel"><div class="ph-h">Цели<span>5 из 6</span></div>${goalsList(D.work_01.list, [0, 1, 2, 3, 4])}</div><div class="btns"><div class="qbtn solid t">Готово</div><div class="qbtn ctl t">${io('refresh')}Повторить ошибки</div><div class="qbtn ctl t">Ещё раз</div></div>`,
  { time: s.time, inStyle: 'padding:0' }), { ...o, narrow: s.narrow });
const consentSheet = () => `<div class="qdim"></div><div class="qsheet consent"><div class="sheet-art sc"><div class="light"></div>${h3d('mila', 'left:24px;top:14px;width:160px;height:166px', 'с Денисом')}${h3d('denis', 'right:24px;top:18px;width:150px;height:160px')}</div>`
  + `<h3>Включить AI-диалоги?</h3><p>Практикуй переписки с персонажами, выполняй задачи и получай обратную связь. Для этого твои сообщения отправляются в OpenAI.</p><div class="dnote">${io('shield-checkmark-outline')}<span>Можно выключить в настройках в любой момент.</span></div>`
  + `<div style="margin-top:18px"><div class="qbtn solid t">Включить</div><div class="qbtn ctl t">Не сейчас</div></div></div>`;
const consent = (s, o = {}) => T(phone(`${stage(s, hubInner(s), 520, 'mila', 'машет', heroBox(s))}${dialogsPanel(s)}`, { time: s.time, inStyle: 'padding:0', fixed: tabbar(), overlay: consentSheet() }), { ...o, narrow: s.narrow });
const SCREENS = { hub, pick, talk, done, consent, limit: hub, plus: hub, off: hub };

window.DLG = { io, T, THEMES, THEME_IDS, P, D, WORLD, av, h3d, dcard, avatarMe, tabbar, quota, offBar, goalsList, need, NEED, stage, heroBox, hubInner, dialogsPanel, plusPanel, hub, pick, talk, done, consent, consentSheet, SCREENS, setTheme: (id, ap) => { if (id) TH = id; if (ap) AP = ap; }, getTheme: () => [TH, AP] };
})();

</script>
<script>
/* зачем (владелец 22.10 утром): в листе «Включить AI-диалоги?» не нравятся огромные буквы-заглушки «М»/«Д» вместо персонажей.
   Три варианта верха листа без букв, на настоящем входе в «Диалоги» и в цветах выбранной темы:
   (а) герой-предмет dialogs_scene_consent (картинка Codex); (б) два собеседника значками — 3D-аватаров в assets нет, поэтому
   как в самом диалоге (значок в стеклянном круге); (в) живой мини-диалог, как в приложении сейчас (DialogueConsentChatReplay). */
(() => {
const { block, col } = K;
const D = window.DLG;
const { io, THEMES, THEME_IDS } = D;
let [TH, AP] = D.getTheme();

const TEXT = `<h3>Включить AI-диалоги?</h3><p>Практикуй переписки с персонажами, выполняй задачи и получай обратную связь. Для этого твои сообщения отправляются в OpenAI.</p><div class="dnote">${io('shield-checkmark-outline')}<span>Можно выключить в настройках в любой момент.</span></div>`
  + `<div style="margin-top:18px"><div class="qbtn solid t">Включить</div><div class="qbtn ctl t">Не сейчас</div></div>`;
const art = (name, cls = 'cv-art') => `<img class="${cls}" src="assets/v2art/${AP === 'dark' ? 'dark' : 'light'}/${name}.webp" alt="">`;

const TOPS = {
  a: () => `<div class="sheet-art sc cv-top"><div class="light"></div>${art('dialogs_scene_consent')}</div>`,
  b: () => `<div class="sheet-art sc cv-top"><div class="light"></div><div class="cv-pair">`
    + `<div class="cv-who"><span class="cv-av gl">${io('happy-outline')}</span><b>Мила</b><small>тепло подхватывает разговор</small></div>`
    + `<span class="cv-link gl">${io('chatbubbles-outline')}</span>`
    + `<div class="cv-who"><span class="cv-av gl">${io('cafe-outline')}</span><b>Денис</b><small>не торопится, читает детали</small></div></div></div>`,
  c: () => `<div class="sheet-art sc cv-top"><div class="light"></div>${art('dialogs_scene_consent', 'cv-corner')}<div class="cv-chat">`
    + `<div class="msg them">Hi! I'm Mila. How was your weekend?</div><div class="msg me">It was great, thanks! I went hiking.</div>`
    + `<div class="msg them">Nice! Where did you go?</div></div></div>`,
};
const VARIANTS = [
  ['a', 'а · Герой-предмет', 'Картинка состояния «согласие» (пузыри и щит) на свету темы. Спокойно, без лиц — та же картинка, что на входе в «Диалоги», лист и экран за ним говорят одним языком.'],
  ['b', 'б · Двое собеседников', '3D-аватаров собеседников в assets нет, поэтому — как в самом диалоге: значок в стеклянном круге, имя и короткий характер. Сразу понятно, с кем будешь говорить.'],
  ['c', 'в · Живой мини-диалог', 'Так лист выглядит в приложении сейчас (DialogueConsentChatReplay): реплики появляются по очереди. Добавлен свет темы и маленький герой в углу — без букв.'],
];
const screen = (v) => {
  const s = { time: '9:41' };
  const sheet = `<div class="qdim"></div><div class="qsheet consent">${TOPS[v]()}${TEXT}</div>`;
  const sc = `<div class="sc" style="height:520px"><div class="light"></div><div class="scrim"></div><div class="sc-top">${D.quota(s)}<span class="sp"></span>${D.avatarMe(false)}</div><div class="sc-body">${D.hubInner(s)}</div></div>`;
  return D.T(K.phone(`${sc}${D.dialogsPanel(s)}`, { time: s.time, inStyle: 'padding:0', fixed: D.tabbar(), overlay: sheet }));
};
const report = () => `<section class="block" id="cv-app"><h2>В приложении букв нет</h2><p>Настоящий лист <code>components/AiDialogConsentModal.tsx</code> берёт верх из <code>components/feature_intro/DialogueConsentChatReplay.tsx</code> — это анимированные пузыри переписки (вариант «в» без света и героя). В макетах <code>dialogs.html</code> и <code>dialogs-gaps-states.html</code> лист тоже с пузырями переписки, букв нет. Буквы «М»/«Д» были только в макетах «Сцены»: <code>dialogs-scene-states.html</code> (состояние «согласие») и <code>dialogs-scene-concepts.html</code> — заменю на выбранный вариант.</p></section>`;
const controls = () => `<div class="thm"><span class="lb">Тема</span>${THEME_IDS.map((id) => `<span class="chp${id === TH ? ' on' : ''}" data-th="${id}">${THEMES[id].name}</span>`).join('')}</div>`
  + `<div class="thm"><span class="lb">Оформление</span>${[['dark', 'Тёмное'], ['light', 'Светлое']].map(([a, l]) => `<span class="chp${a === AP ? ' on' : ''}" data-ap="${a}">${l}</span>`).join('')}</div>`;
const render = () => {
  document.getElementById('ctl').innerHTML = controls();
  document.getElementById('root').innerHTML = block('cv', `Верх листа «Включить AI-диалоги?» — три варианта · ${THEMES[TH].name}, ${AP === 'dark' ? 'тёмное' : 'светлое'}`, 'Под листом — настоящий вход в «Диалоги», цвета из выбранной темы.',
    VARIANTS.map(([v, t, d]) => col(t, screen(v) + `<div class="dl-need">${d}</div>`))) + report();
  K.init();
};
document.getElementById('ctl').addEventListener('click', (e) => {
  const c = e.target.closest('.chp'); if (!c) return;
  if (c.dataset.th) TH = c.dataset.th; if (c.dataset.ap) AP = c.dataset.ap;
  D.setTheme(TH, AP); render();
});
render();
})();

</script>
</body>
