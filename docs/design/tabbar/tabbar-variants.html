<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таббар 2.0 — три стиля</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; background: #0A0A0B; color: #ECEAE7;
  font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 1320px; margin: 0 auto; padding: 32px 16px 80px; }
h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.4px; }
h2 { font-size: 18px; margin: 44px 0 16px; color: #CFCBC5; font-weight: 600; }
.lead { color: #9C9894; margin: 0 0 18px; font-size: 15px; }
.btn {
  appearance: none; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
  color: #F2EDE6; font: 600 15px/1 Inter, sans-serif; padding: 12px 20px; border-radius: 999px; cursor: pointer;
}
.btn:hover { background: rgba(255,255,255,.1); }
.ref { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* ---------- крупные образцы на тёмном фоне, как на референсе ---------- */
.stage-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .stage-grid { grid-template-columns: 1fr; } }
.stage {
  position: relative; aspect-ratio: 1448 / 1086; border-radius: 20px; overflow: hidden;
  background: radial-gradient(90% 70% at 50% 18%, #202022, #0E0E0F 72%);
  display: flex; align-items: center; justify-content: center;
}
.stage .label { position: absolute; z-index: 3; top: 14px; left: 18px; font-size: 14px; color: #A9A49E; font-weight: 600; }
.stage .scaler { transform-origin: 50% 50%; }

/* ---------- телефоны ---------- */
.phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(390px, 1fr)); gap: 28px; justify-items: center; }
.phone-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.phone-col .label { font-size: 15px; font-weight: 600; color: #D8D3CC; }
.phone {
  position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden;
  background: linear-gradient(#161618, #0D0D0E); box-shadow: 0 0 0 10px #1B1B1D, 0 30px 80px rgba(0,0,0,.6);
}
.status { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 36px; font-weight: 600; font-size: 16px; background: linear-gradient(#161618 60%, rgba(22,22,24,0)); }
.screen { position: absolute; inset: 0; overflow-y: auto; padding: 58px 14px 130px; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: rgba(255,255,255,.55); z-index: 6; }

/* фейковая Главная в текущем графитовом стиле — только фон, чтобы было видно стекло */
.card { position: relative; border-radius: 18px; background: rgba(30,30,32,.92); border: 1px solid rgba(255,255,255,.07); padding: 16px; margin-bottom: 12px; overflow: hidden; }
.card::before { content: ""; position: absolute; width: 220px; height: 160px; right: -60px; top: -60px; background: radial-gradient(closest-side, rgba(255,255,255,.07), transparent); }
.hdr { display: flex; align-items: center; justify-content: space-between; margin: 4px 4px 14px; }
.logo { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }
.round { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); }
.row { display: flex; gap: 10px; }
.pill { flex: 1; border-radius: 16px; background: rgba(30,30,32,.92); border: 1px solid rgba(255,255,255,.08); padding: 10px 14px; font-weight: 700; }
.pill small { display: block; color: #9A9690; font-weight: 500; font-size: 13px; margin-top: 2px; }
.over { font-size: 12px; letter-spacing: 1.6px; color: #9A9690; font-weight: 700; }
.title { font-size: 19px; font-weight: 800; margin-top: 6px; }
.track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 12px; }
.track i { display: block; height: 100%; width: 22%; border-radius: 3px; background: #E7E1D8; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.tile { border-radius: 16px; background: rgba(30,30,32,.92); border: 1px solid rgba(255,255,255,.07); padding: 10px; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; }
.tile .art { flex: 1; border-radius: 10px; margin-bottom: 8px; }
.tile b { font-size: 16px; }
.task { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); margin-top: 8px; font-weight: 700; }
.task span { margin-left: auto; color: #9A9690; font-weight: 600; }
.check { width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid #6E6A66; }
.vids { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.vid { height: 128px; border-radius: 16px; position: relative; overflow: hidden; }
.vid::after { content: ""; position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px; border-radius: 19px; background: rgba(0,0,0,.45); }
.big { font-size: 22px; font-weight: 800; line-height: 1.2; margin-top: 6px; }
.muted { color: #9A9690; margin-top: 6px; }

/* ---------- ТАББАР ---------- */
.bar-wrap {
  position: absolute; left: 12px; right: 12px; bottom: 26px; z-index: 4;
  transform-origin: 50% 100%;
  /* разжатие 260 мс, как в приложении (TAB_SCROLL_EXPAND_MS) */
  transition: transform 260ms cubic-bezier(.33,1,.68,1), opacity 260ms cubic-bezier(.33,1,.68,1);
}
.bar-wrap.collapsed { transform: translateY(8px) scale(.9); opacity: .94; transition-duration: 220ms; }
.stage .bar-wrap { position: relative; left: auto; right: auto; bottom: auto; width: 366px; }
.stage .bar-wrap::after { bottom: -40px; height: 18px; left: 6%; right: 6%; filter: blur(7px); }
.bar-wrap::after { /* тень-пятно под капсулой, как на рендере */
  content: ""; position: absolute; left: 8%; right: 8%; bottom: -22px; height: 22px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0,0,0,.75), transparent); filter: blur(4px); pointer-events: none; z-index: -1;
}
.bar {
  position: relative; height: 66px; border-radius: 33px; touch-action: none; user-select: none;
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bot));
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%); backdrop-filter: blur(var(--blur)) saturate(140%);
  box-shadow: 0 22px 44px -14px rgba(0,0,0,.8), 0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
.bar::before, .cap::before { /* кромка-блик: градиентная рамка толщиной 1px */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.bar::before { background: var(--rim); }
.bar::after { /* вторая, внутренняя кромка — «толщина стекла» */
  content: ""; position: absolute; inset: 5px; border-radius: 28px; border: 1px solid rgba(255,255,255,.045); pointer-events: none;
}
.cap {
  position: absolute; top: 9px; bottom: 9px; left: 0; border-radius: 18px; z-index: 1;
  background: var(--cap-bg); box-shadow: var(--cap-glow), inset 0 1px 0 rgba(255,255,255,.2);
  /* пружина с лёгким перелётом — едет, а не телепортируется */
  transition: transform 460ms cubic-bezier(.28,1.32,.5,1), box-shadow 200ms, filter 200ms;
  will-change: transform;
}
.cap::before { background: var(--cap-rim); }
.cap.dragging { transition: box-shadow 200ms, filter 200ms; }
.cap.lifted { filter: brightness(1.15); box-shadow: var(--cap-glow), 0 8px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28); }
.tabs { position: absolute; inset: 0; padding: 0 9px; display: flex; z-index: 2; }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: #8D8A87; font-size: 10.5px; font-weight: 500; letter-spacing: -0.1px; cursor: pointer;
  transition: color 220ms ease;
}
.tab svg { width: 20px; height: 20px; transition: transform 280ms cubic-bezier(.3,1.5,.5,1); }
.tab.pressed svg { transform: scale(.88); transition-duration: 110ms; }
.tab.on { color: var(--on); font-weight: 600; }
.tab.hover { color: #D5CEC6; }
.tab .fill { fill: currentColor; fill-opacity: 0; transition: fill-opacity 220ms; }
.tab.on .fill { fill-opacity: .95; }
.tab.on .soft { fill: currentColor; fill-opacity: .18; }

/* ---------- три стиля ---------- */
.v-a { /* А — дымчатое стекло, нейтральное */
  --bg-top: rgba(46,46,50,.60); --bg-bot: rgba(20,20,22,.72); --blur: 26px;
  --rim: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.06) 60%, rgba(255,255,255,.12));
  --cap-bg: linear-gradient(165deg, rgba(255,255,255,.17), rgba(255,255,255,.05) 60%, rgba(255,255,255,.03));
  --cap-rim: linear-gradient(160deg, rgba(255,255,255,.5), rgba(255,255,255,.08) 55%, rgba(255,255,255,.18));
  --cap-glow: 0 0 16px rgba(255,255,255,.07);
  --on: #F5F2EE;
}
.v-b { /* Б — плотный графит, затемнение сильнее */
  --bg-top: rgba(32,32,35,.78); --bg-bot: rgba(14,14,16,.88); --blur: 16px;
  --rim: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.05));
  --cap-bg: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
  --cap-rim: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.06));
  --cap-glow: 0 4px 14px rgba(0,0,0,.35);
  --on: #F2F0ED;
}
.v-c { /* В — тёплая кромка, как на рендере */
  --bg-top: rgba(42,40,38,.64); --bg-bot: rgba(18,17,16,.76); --blur: 22px;
  --rim: linear-gradient(90deg, rgba(255,226,190,.62), rgba(255,236,214,.24) 22%, rgba(255,255,255,.10) 55%, rgba(255,255,255,.08) 80%, rgba(255,255,255,.24));
  --cap-bg: radial-gradient(120% 95% at 22% 0%, rgba(255,232,204,.32), rgba(255,236,214,.08) 55%, rgba(255,255,255,.03));
  --cap-rim: linear-gradient(150deg, rgba(255,228,196,.8), rgba(255,236,214,.14) 50%, rgba(255,236,214,.32));
  --cap-glow: 0 0 22px rgba(255,210,160,.22), 0 0 2px rgba(255,220,180,.35);
  --on: #F6E9DA;
}
</style>
</head>

  <h1>Таббар 2.0 — три стиля</h1>
  <p class="lead">Листайте экран в телефоне — таббар плавно сжимается и разжимается. Нажмите вкладку — капсула едет. Зажмите капсулу и тяните — отпустите над нужной вкладкой.</p>

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const easeInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function setupBar(wrap) {
  const bar = wrap.querySelector('.bar');
  const cap = wrap.querySelector('.cap');
  const tabs = [...wrap.querySelectorAll('.tab')];
  const PAD = 9; // замер с референса: капсула отстоит от края панели на 9 px
  let idx = 0, slotW = 0, curX = PAD, down = null, dragging = false, holdTimer = 0;

  const xFor = (i) => PAD + i * slotW;
  const nearest = (x) => Math.max(0, Math.min(4, Math.round((x - PAD) / slotW)));
  const setX = (x, lift) => { curX = x; cap.style.transform = `translateX(${x}px) scale(${lift ? 1.06 : 1})`; };

  function layout() { slotW = (bar.clientWidth - PAD * 2) / 5; cap.style.width = slotW + 'px'; cap.classList.add('dragging'); setX(xFor(idx)); void cap.offsetWidth; cap.classList.remove('dragging'); }
  function select(i) {
    idx = i;
    tabs.forEach((t, k) => { t.classList.toggle('on', k === i); t.classList.remove('hover'); });
    cap.classList.remove('dragging', 'lifted');
    void cap.offsetWidth; // зачем: включить пружинный transition до смены позиции — иначе прыжок
    setX(xFor(i), false);
  }
  const localX = (e) => { const r = bar.getBoundingClientRect(); return (e.clientX - r.left) * (bar.clientWidth / r.width); };

  function startDrag(x) {
    dragging = true;
    tabs.forEach((t) => t.classList.remove('pressed'));
    cap.classList.add('dragging', 'lifted');
    moveTo(x);
  }
  function moveTo(x) {
    const cx = Math.max(PAD, Math.min(PAD + 4 * slotW, x - slotW / 2));
    setX(cx, true);
    const n = nearest(cx);
    tabs.forEach((t, k) => t.classList.toggle('hover', k === n && k !== idx));
  }
  function endDrag() { dragging = false; select(nearest(curX)); }

  bar.addEventListener('pointerdown', (e) => {
    const x = localX(e);
    const i = Math.max(0, Math.min(4, Math.floor((x - PAD) / slotW)));
    down = { sx: e.clientX, i };
    tabs[i].classList.add('pressed');
    bar.setPointerCapture(e.pointerId);
    holdTimer = setTimeout(() => startDrag(x), 170); // зажал ~0.17 с — капсула «берётся» в палец
  });
  bar.addEventListener('pointermove', (e) => {
    if (!down) return;
    const x = localX(e);
    if (!dragging && Math.abs(e.clientX - down.sx) > 8) { clearTimeout(holdTimer); startDrag(x); }
    if (dragging) moveTo(x);
  });
  const finish = () => {
    if (!down) return;
    clearTimeout(holdTimer);
    tabs.forEach((t) => t.classList.remove('pressed'));
    if (dragging) endDrag(); else select(down.i);
    down = null;
  };
  bar.addEventListener('pointerup', finish);
  bar.addEventListener('pointercancel', finish);

  async function dragDemo(from, to, ms = 950) {
    const a = xFor(from) + slotW / 2, b = xFor(to) + slotW / 2;
    tabs[from].classList.add('pressed');
    await sleep(170);
    startDrag(a);
    const t0 = performance.now();
    await new Promise((res) => {
      const step = (now) => {
        const t = Math.min(1, (now - t0) / ms);
        moveTo(a + (b - a) * easeInOut(t));
        if (t < 1) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
    await sleep(120);
    endDrag();
  }

  layout();
  window.addEventListener('resize', layout);
  return { select, dragDemo };
}

function setupScroll(screen, wrap) {
  // те же пороги, что в приложении: TAB_SCROLL_* в app/(tabs)/_layout.tsx
  let lastY = 0, collapsed = false, lastToggle = 0;
  const set = (c, immediate) => {
    if (c === collapsed) return;
    const now = performance.now();
    if (!immediate && now - lastToggle < 140) return;
    lastToggle = now; collapsed = c;
    wrap.classList.toggle('collapsed', c);
  };
  screen.addEventListener('scroll', () => {
    const y = Math.max(0, screen.scrollTop);
    const d = y - lastY; lastY = y;
    if (y <= 10) return set(false, true);
    if (d >= 5 && y >= 36) return set(true, false);
    if (d <= -5) set(false, false);
  }, { passive: true });
}

const stages = document.getElementById('stages');
const phones = document.getElementById('phones');
const players = [];

VARIANTS.forEach((v) => {
  const st = document.createElement('div');
  st.className = `stage ${v.cls}`;
  st.innerHTML = `<div class="label">${v.title}</div><div class="scaler">${barHTML()}</div>`;
  stages.appendChild(st);
  const stageApi = setupBar(st.querySelector('.bar-wrap'));

  const col = document.createElement('div');
  col.className = 'phone-col';
  col.innerHTML = `<div class="label">${v.title}</div>
    <div class="phone ${v.cls}"><div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="screen">${HOME}</div>${barHTML()}<div class="home-ind"></div></div>`;
  phones.appendChild(col);
  const screen = col.querySelector('.screen');
  const wrap = col.querySelector('.bar-wrap');
  setupScroll(screen, wrap);
  const api = setupBar(wrap);
  players.push({ screen, api, stageApi });
});

function fitStages() { document.querySelectorAll('.stage .scaler').forEach((sc) => { const w = sc.parentElement.clientWidth; sc.style.transform = 'scale(' + (w * 0.843 / 366) + ')'; }); }
fitStages(); window.addEventListener('resize', fitStages);

let demoRunning = false;
async function demo() {
  if (demoRunning) return;
  demoRunning = true;
  await Promise.all(players.map(async ({ screen, api, stageApi }) => {
    screen.scrollTo({ top: 0 });
    await sleep(250);
    screen.scrollTo({ top: 560, behavior: 'smooth' });
    await sleep(1400);
    screen.scrollTo({ top: 0, behavior: 'smooth' });
    await sleep(1300);
    api.select(2); stageApi.select(2); await sleep(800);
    api.select(4); stageApi.select(4); await sleep(800);
    await Promise.all([api.dragDemo(4, 1), stageApi.dragDemo(4, 1)]);
    await sleep(800);
    api.select(0); stageApi.select(0);
  }));
  demoRunning = false;
}
document.getElementById('demo').addEventListener('click', demo);
setTimeout(demo, 900);
</script>
