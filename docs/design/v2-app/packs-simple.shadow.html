<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наборы сообщества — один вариант («Тень», копия на утверждение)</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="cards-glass.css">
<link rel="stylesheet" href="cards-section.css">
<style>
  /* зачем (владелец 04.10: «ни один не нравится», «делай, развивай»): один простой вариант на основе УТВЕРЖДЁННОГО каталога «Карточек» — те же строки наборов, тот же стиль. Никаких новых идей. */
  .scr > .in { min-height: 100%; }
  .bot2 { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; padding: 18px 20px 34px; background: linear-gradient(rgba(12,12,13,0), rgba(12,12,13,.94) 40%); }
  .tabs3 { display: flex; gap: 22px; margin-top: 6px; } .tabs3 span { font-size: 17px; font-weight: 600; color: var(--sec); padding-bottom: 8px; } .tabs3 span.on { color: #fff; box-shadow: inset 0 -3px 0 var(--acc); }
  .tag2 { display: inline-flex; height: 22px; padding: 0 8px; border-radius: 7px; background: var(--acc); color: var(--on); font-size: 12px; font-weight: 700; align-items: center; margin-left: 8px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.09); font-size: 15px; font-weight: 700; }
  .bar3 { position: absolute; left: 50%; transform: translateX(-50%); bottom: 32px; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 30px; background: linear-gradient(150deg, color-mix(in srgb, var(--g1) 20%, rgba(28,28,34,.94)), rgba(16,16,20,.94)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .bar3 .b { height: 44px; padding: 0 22px; border-radius: 22px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--sec); } .bar3 .b.on { background: var(--acc); color: var(--on); }
  .bar3 .plus { width: 48px; height: 48px; border-radius: 50%; background: var(--acc); color: var(--on); display: flex; align-items: center; justify-content: center; }
  .chip.on { background: #222224; } .meta span { display: inline-flex; align-items: center; gap: 5px; }
</style>
<link rel="stylesheet" href="shadow-skin.css">
</head>
<body>
<div class="page">
  <h1 class="page-h1">Наборы сообщества — один вариант</h1>
  <p class="page-lead">Один простой вариант: те же строки наборов и тот же стиль, что в утверждённых «Карточках». Над каждым экраном — что это за экран.</p>
  <div class="ctl"><div class="chips2" id="chips"></div></div>
  <div id="root"></div>
</div>
<script src="kit.js"></script>
<script>
(() => {
const { icon, phone, col, block, sheet } = K;
const ch = `<span class="ch">${icon('fwd', 's20')}</span>`;
const meta = (h, p, c) => `<span>${icon('heart', 's18')}${h}</span><span>${icon('people', 's18')}${p}</span>${c ? `<span>${icon('chat', 's18')}${c}</span>` : ''}`;
const row = (t, a, m, n, o = {}) => `<div class="card t"><div class="row" style="min-height:74px"><div class="tx"><div class="tt">${t}${o.top ? '<span class="tag2">Топ</span>' : ''}</div><div class="st" style="font-size:16px">${a}</div><div class="meta">${m}</div></div>${o.edit ? `<span class="cntp">${icon('edit', 's16')}</span>` : ''}<span class="cntp">${n}</span>${ch}</div></div>`;
const PK = [['B2 глаголы', 'Ирина', meta(3, 11, 1), 49, { top: 1 }], ['Family', 'Лидия', meta(4, 9), 20, {}], ['Антоніми дієслів', 'Natalia', meta(1, 2), 30, {}], ['Фразовые глаголы с get', 'Марк', meta(12, 31, 4), 40, { top: 1 }], ['В аэропорту', 'Olena', meta(6, 14), 18, {}]];
const head = `<div class="flex" style="justify-content:space-between;align-items:center;margin-top:6px"><div class="tabs3"><span>Пик</span><span>Друзья</span><span class="on">Наборы</span></div><div class="flex" style="gap:8px"><span class="rb t">${icon('search', 's20')}</span><span class="lg">EN${icon('down', 's16')}</span></div></div><div class="lt"><div class="ti" style="font-size:30px">Наборы сообщества</div></div>`;
const bar = (on) => `<div class="bar3"><span class="b${on === 0 ? ' on' : ''}">Новые</span><span class="plus">${icon('plus', 's24')}</span><span class="b${on === 1 ? ' on' : ''}">Топ</span></div>`;
const word = (w, tr) => `<div class="card t"><div class="row" style="min-height:64px"><div class="tx"><div class="tt m">${w}</div><div class="st">${tr}</div></div></div></div>`;

const s1 = () => phone(`${head}<div class="card t" style="margin-top:14px"><div class="row"><div class="tile">${icon('edit', 's20')}</div><div class="tx"><div class="tt m">Продолжить создание набора</div></div>${ch}</div></div><div class="stack" style="margin-top:12px">${PK.map(([t, a, m, n, o]) => row(t, a, m, n, o)).join('')}</div><div style="height:90px"></div>`, { fixed: bar(0) });
const s2 = () => phone(`<div class="flex" style="gap:12px;margin-top:4px"><span class="rb t">${icon('back', 's20')}</span><div class="grow" style="display:flex;align-items:center;gap:10px;height:46px;border-radius:23px;padding:0 16px;background:rgba(255,255,255,.08);font-size:17px">${icon('search', 's20')}<span class="grow">глаголы</span>${icon('close', 's18')}</div></div><div class="stack" style="margin-top:16px;opacity:.35">${row(...PK[0])}</div><div class="stack" style="margin-top:10px">${row(...PK[3])}</div><div class="stack" style="margin-top:10px;opacity:.35">${row(...PK[2])}</div>`, { fixed: bar(1), overlay: sheet('lp', `<div style="font-size:18px;font-weight:700;padding:0 4px 8px">Фразовые глаголы с get</div><div class="card t"><div class="row"><div class="tile">${icon('flag', 's20')}</div><div class="tx"><div class="tt m">Пожаловаться на набор</div></div></div></div><div class="card t" style="margin-top:9px"><div class="row"><div class="tile">${icon('close', 's20')}</div><div class="tx"><div class="tt m">Не показывать мне</div></div></div></div>`, true) });
const s3 = () => phone(`${head}<div class="center" style="margin-top:110px;text-align:center"><div class="tile t61" style="margin:0 auto">${icon('people', 's26')}</div><div style="font-size:20px;font-weight:700;margin-top:20px">Здесь появятся наборы после публикации.</div></div>`, { fixed: bar(0) });
const s4 = () => phone(`<div class="topbar"><span class="rb t">${icon('back', 's20')}</span><span class="rb t">${icon('dotsV', 's18')}</span></div><div style="font-size:34px;line-height:40px;font-weight:700;margin-top:14px">B2 глаголы</div><div class="flex" style="margin-top:10px;color:var(--sec);font-size:16px;gap:12px">Ирина<span style="margin-left:auto;display:flex;gap:16px;align-items:center">${meta(3, 11, 1)}</span></div><div class="sec" style="margin-top:26px"><div class="ti">Карточки<span class="n">49</span></div></div><div class="stack">${word('Lay', 'класть')}${word('Claim', 'утверждать')}${word('Convince', 'убеждать')}</div>`, { fixed: `<div class="bot2"><div class="ac-cta t">Добавить себе</div></div>` });

const L = ['1 · Каталог наборов', '2 · Поиск: долгое нажатие на набор', '3 · Пока нет наборов', '4 · Набор до добавления'];
document.getElementById('root').innerHTML = block('v', 'Вкладка «Наборы»', '', [col(L[0], s1()), col(L[1], s2()), col(L[2], s3()), col(L[3], s4())]);
K.init();
const THEMES = [['Аврора', '#38E0AA', '#7C5CFF', '#7EF0C8', '#04261D'], ['Ирис', '#788CFF', '#FF78C8', '#C7C9FF', '#1B1C4A'], ['Магма', '#FF5A28', '#FFAA3C', '#FFB27A', '#3A1204'], ['Полночь', '#286EFF', '#00D2FF', '#8CC4FF', '#06224D'], ['Нефрит', '#14BEA0', '#1E78C8', '#7FE6D2', '#032A24'], ['Орхидея', '#D246FF', '#FF3C8C', '#EAA6FF', '#3A0A4A']];
let theme = 0;
const applyTheme = () => { const T = THEMES[theme]; document.querySelectorAll('.ph').forEach((p) => { p.style.setProperty('--g1', T[1]); p.style.setProperty('--g2', T[2]); p.style.setProperty('--acc', T[3]); p.style.setProperty('--on', T[4]); }); document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('on', i === theme)); };
document.getElementById('chips').innerHTML = THEMES.map((T, i) => `<span class="chip" data-i="${i}"><i class="sw" style="background:linear-gradient(135deg,${T[1]},${T[2]})"></i>${T[0]}</span>`).join('');
document.getElementById('chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (!c) return; theme = +c.dataset.i; applyTheme(); });
applyTheme();
})();
</script>
</body>
</html>
