<style>
/* ============================================================
   Learning V2 · «Атлас» · токены макетов
   Источник цветов хрома — components/ui/v2_theme.ts (Deep Forest V2) и
   docs/v2/mockups/02-phrase-builder.html (эталон, одобрен владельцем).
   Свет глав (--ch-*) — содержательный: температура сцены главы из
   content/learning-v2-course/curriculum/en/ПЛАН_КУРСА.md, а не тема UI.
   Законы владельца: без обводок контейнеров, без подписей-расшифровок
   мелким шрифтом, без эмодзи и растра (только SVG/градиент/глифы), всё крупно.
   Движение: только transform/opacity/clip-path; ease-out; reduced motion всегда.
   ============================================================ */
:root {
  /* ---- время и кривые (constants/motion + v2motion) ---- */
  --tf: 1;
  --t-press: calc(120ms * var(--tf));
  --t-fast: calc(180ms * var(--tf));
  --t-normal: calc(240ms * var(--tf));
  --t-slow: calc(320ms * var(--tf));
  --t-celebrate: calc(420ms * var(--tf));
  --t-scene: calc(640ms * var(--tf));
  --t-breath: calc(2400ms * var(--tf));
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-spring: cubic-bezier(0.38, 0.70, 0.125, 1);
  --ease-slide: cubic-bezier(0.33, 0.52, 0.25, 0.99);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-inout: cubic-bezier(0.77, 0, 0.175, 1);

  /* ---- форма ---- */
  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;
  --r-pill: 999px;

  /* ---- типографика (v2_theme.type, крупно, без микро-текста) ---- */
  --font: "Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-rune: "Segoe UI Historic", "Noto Sans Runic", "Apple Symbols", var(--font);
  --fs-hero: 44px;
  --fs-title: 28px;
  --fs-section: 22px;
  --fs-card: 17px;
  --fs-body: 15px;
  --fs-label: 13px;
  --fs-num: 34px;

  /* ---- слои ---- */
  --z-map: 1;
  --z-float: 10;
  --z-header: 20;
  --z-backdrop: 30;
  --z-sheet: 40;
  --z-toast: 50;
  --z-iris: 60;
}

/* ============================================================
   Свет глав. Одна глава = одна сцена = одна температура света.
   Урок 1 «Первая неделя в Дублине» (ПЛАН_КУРСА.md):
   1 утро в офисе · 2 кофе с коллегой · 3 знакомство с командой ·
   4 квартира и погода · 5 обед с командой · 6 пятница, паб ·
   7 воскресный звонок домой.
   --ch     основной свет (светлый, читается на тёмном как текст)
   --ch-2   тот же свет, глубже (низ «фонаря», полка кнопки)
   --ch-ink тёмная краска на свету (текст на заливке)
   --ch-glow / --ch-soft   свечение и тональная подложка
   --ch-ground              оттенок «земли» района карты
   ============================================================ */
[data-ch="1"] {
  --ch: #6EDCC4;
  --ch-2: #2F9F88;
  --ch-3: #145E4F;
  --ch-ink: #03251D;
  --ch-glow: rgba(110, 220, 196, 0.42);
  --ch-soft: rgba(110, 220, 196, 0.13);
  --ch-ground: #0B1A17;
}
[data-ch="2"] {
  --ch: #EDB667;
  --ch-2: #B97E2E;
  --ch-3: #6E4A16;
  --ch-ink: #2A1704;
  --ch-glow: rgba(237, 182, 103, 0.42);
  --ch-soft: rgba(237, 182, 103, 0.13);
  --ch-ground: #1A130A;
}
[data-ch="3"] {
  --ch: #F28A9C;
  --ch-2: #BE5468;
  --ch-3: #72303E;
  --ch-ink: #2B0A12;
  --ch-glow: rgba(242, 138, 156, 0.42);
  --ch-soft: rgba(242, 138, 156, 0.13);
  --ch-ground: #1B0F13;
}
[data-ch="4"] {
  --ch: #8AAAF2;
  --ch-2: #5170C9;
  --ch-3: #2C4078;
  --ch-ink: #06132E;
  --ch-glow: rgba(138, 170, 242, 0.42);
  --ch-soft: rgba(138, 170, 242, 0.13);
  --ch-ground: #0D1220;
}
[data-ch="5"] {
  --ch: #A9DB6C;
  --ch-2: #6FA636;
  --ch-3: #3F6320;
  --ch-ink: #122500;
  --ch-glow: rgba(169, 219, 108, 0.42);
  --ch-soft: rgba(169, 219, 108, 0.13);
  --ch-ground: #111A0A;
}
[data-ch="6"] {
  --ch: #C99EF2;
  --ch-2: #8F5FCB;
  --ch-3: #54367A;

/* Reduced motion: всё мгновенно, вечные циклы стоят на «живом» кадре. */

</style>
<style>
/* ============================================================
   Рама телефона и общие компоненты хрома («Атлас», Learning V2).
   Всё, что повторяется между экранами: статус-бар, кнопки, чипы кошелька,
   3D-клавиша CTA, шторка, вуаль, тост «спокойного отказа», скелетон, ирис.
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: #06090A; }
body {
  font-family: var(--font);
  color: #E8EDEA;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }
button { font-family: inherit; }

.stage {
  display: flex;
  gap: 40px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
  padding: 36px 24px 80px;
}

/* ---------- Телефон ---------- */
.phone {
  width: 390px;
  height: 844px;
  position: relative;
  overflow: hidden;
  border-radius: 48px;
  display: flex;
  flex-direction: column;
  user-select: none;
  color: var(--text);
  background:
    radial-gradient(120% 60% at 50% -8%, var(--sheen), transparent 60%),
    linear-gradient(175deg, var(--bg-a), var(--bg-b));
  box-shadow: 0 40px 90px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  isolation: isolate;
}
.phone::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  border-radius: inherit;
  background: radial-gradient(135% 92% at 50% 46%, transparent 64%, rgba(0, 0, 0, 0.34) 100%);
}
.statusbar {
  height: 54px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 30px 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.1px;
  color: var(--text);
  position: relative;
  z-index: var(--z-header);
}
.statusbar .sb-right { display: flex; align-items: center; gap: 6px; }
.statusbar svg { width: 18px; height: 12px; }
.home-indicator {
  position: absolute;
  left: 50%;
  bottom: 9px;
  width: 134px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.35);
  transform: translateX(-50%);
  z-index: var(--z-toast);
  pointer-events: none;
}

/* ---------- Кнопки-иконки, чипы ---------- */
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  background: linear-gradient(160deg, var(--elev2), var(--card));
  color: var(--text-2);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  box-shadow: 0 6px 14px var(--shadow), inset 0 1px 0 var(--inner-light);
  transition: transform var(--t-press) var(--ease-out);
}
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 22px; height: 22px; }

.chip {
  height: 36px;
  padding: 0 12px 0 10px;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  background: linear-gradient(160deg, var(--elev2), var(--card));
  box-shadow: 0 6px 14px var(--shadow), inset 0 1px 0 var(--inner-light);
  white-space: nowrap;
}
.chip .glyph {
  font-family: var(--font-rune);
  font-size: 17px;
  font-weight: 700;
  line-height: 1;
  color: var(--gold);
}
.chip.energy .glyph { color: var(--energy); font-family: var(--font); }
.chip svg { width: 18px; height: 18px; }

/* ---------- 3D-клавиша (DuoPressable / PressableHybrid) ----------
   Цельная площадка + полка того же цвета темнее; нажатие вдавливает
   площадку в полку целиком. Цвет клавиши задают --k-a/--k-b/--k-c/--k-shelf/--k-ink;
   в сцене главы их переопределяет свет главы (см. .btn-key.ch). */
.btn-key {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  height: 56px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.1px;
  color: var(--k-ink);
  background: linear-gradient(180deg, var(--k-a) 0%, var(--k-b) 48%, var(--k-c) 100%);
  box-shadow:
    0 6px 0 var(--k-shelf),
    0 16px 30px -6px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.34);
  transform: translateY(0);
  transition: transform var(--t-press) var(--ease-out), box-shadow var(--t-press) var(--ease-out);
  overflow: hidden;
  isolation: isolate;
}
.btn-key:active,
.btn-key.is-pressed {
  transform: translateY(6px);
  box-shadow:
    0 0 0 var(--k-shelf),
    0 6px 14px -4px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.24);
}
.btn-key svg { width: 22px; height: 22px; flex: 0 0 auto; }
/* Одноразовый проход света по клавише при появлении (внимание к действию). */
.btn-key::after {
  content: "";
  position: absolute;
  top: -20%;
  bottom: -20%;
  left: 0;
  width: 46%;
  background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.45) 50%, transparent 100%);
  transform: translateX(-160%) skewX(-18deg);
  opacity: 0;
  pointer-events: none;
}
.btn-key.sweep::after {
  animation: keySweep calc(900ms * var(--tf)) var(--ease-slide) calc(380ms * var(--tf)) 1 both;
}
@keyframes keySweep {
  0% { transform: translateX(-160%) skewX(-18deg); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translateX(360%) skewX(-18deg); opacity: 0; }
}
.btn-key.ch {
  --k-a: color-mix(in oklab, var(--ch) 78%, white);
  --k-b: var(--ch);
  --k-c: var(--ch-2);
  --k-shelf: var(--ch-3);
  --k-ink: var(--ch-ink);
}
.btn-key.quiet {
  --k-a: var(--elev3);
  --k-b: var(--elev2);
  --k-c: var(--elev);
  --k-shelf: #000000;
  --k-ink: var(--text);
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.55), 0 12px 24px -8px rgba(0, 0, 0, 0.4), inset 0 1px 0 var(--inner-light);
}
.btn-key.quiet:active { box-shadow: 0 0 0 rgba(0, 0, 0, 0.55), 0 4px 10px -4px rgba(0, 0, 0, 0.4), inset 0 1px 0 var(--inner-light); }
.btn-key.gold {
  --k-a: #F6E3A1;
  --k-b: #E9C86A;
  --k-c: #C99B33;
  --k-shelf: #7A5C14;
  --k-ink: #231A04;
}
.btn-text {
  border: none;
  background: transparent;
  cursor: pointer;
  height: 48px;
  padding: 0 16px;
  font-size: 16px;
  font-weight: 700;
  color: var(--muted);
  border-radius: 14px;
  transition: transform var(--t-press) var(--ease-out), color var(--t-fast);
}
.btn-text:active { transform: scale(0.97); color: var(--text); }

/* ---------- Вуаль и шторка ---------- */
.backdrop {
  position: absolute;
  inset: 0;
  z-index: var(--z-backdrop);
  background:
    radial-gradient(120% 90% at 50% 100%, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.66) 70%);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-normal) var(--ease-out);
}
.backdrop.is-on { opacity: 1; pointer-events: auto; }

.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: var(--z-sheet);
  border-radius: 30px 30px 0 0;
  padding: 10px 22px 40px;
  background: linear-gradient(180deg, var(--elev) 0%, var(--card) 100%);
  box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 var(--inner-light);
  transform: translateY(104%);
  transition: transform var(--t-slow) var(--ease-drawer);
  will-change: transform;
}
.sheet.is-on { transform: translateY(0); }
.sheet .grabber {
  width: 36px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.18);
  margin: 0 auto 16px;
}

/* ---------- Тост «спокойный отказ» ---------- */
.toast {
  position: absolute;
  left: 50%;
  bottom: 118px;
  z-index: var(--z-toast);
  transform: translate(-50%, 14px);
  opacity: 0;
  padding: 12px 18px;
  border-radius: var(--r-pill);
  background: linear-gradient(160deg, var(--elev3), var(--elev));
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 var(--inner-light);
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  transition: transform var(--t-normal) var(--ease-out), opacity var(--t-normal) var(--ease-out);
}
.toast.is-on { transform: translate(-50%, 0); opacity: 1; }
.toast svg { width: 18px; height: 18px; color: var(--muted); }

/* ---------- Скелетон: геометрия зарезервирована, свет проходит ---------- */
.skel {
  position: relative;
  overflow: hidden;
  background: var(--elev);
  border-radius: 14px;
}
.skel::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.06) 50%, transparent 100%);
  animation: skelSweep calc(1400ms * var(--tf)) linear infinite;
}
@keyframes skelSweep { to { transform: translateX(100%); } }

/* ---------- Ирис: переход в занятие из точки действия ---------- */
.iris {
  position: absolute;
  inset: 0;
  z-index: var(--z-iris);
  pointer-events: none;
  clip-path: circle(0px at var(--ix, 50%) var(--iy, 80%));
  background: var(--bg);
  opacity: 1;
}
.iris.is-open {
  transition: clip-path var(--t-scene) var(--ease-inout);
  clip-path: circle(140% at var(--ix, 50%) var(--iy, 80%));
  pointer-events: auto;
}

/* ---------- Шапка экрана ---------- */
.hdr {
  position: relative;
  z-index: var(--z-header);
  padding: 4px 18px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hdr .grow { flex: 1; min-width: 0; }
.h-title {
  font-size: var(--fs-title);
  font-weight: 900;
  letter-spacing: -0.6px;
  line-height: 1.12;
  color: var(--text);
  text-wrap: balance;
}
.h-label {
  font-size: var(--fs-label);
  font-weight: 800;
  letter-spacing: 0.4px;
  color: var(--muted);
}

/* ---------- Звёзды оценки (SVG) ---------- */
.stars { display: inline-flex; gap: 3px; }
.stars svg { width: 12px; height: 12px; color: var(--gold); }
.stars svg.off { color: rgba(255, 255, 255, 0.16); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  :root { --tf: 0.001; }
}

</style>
<style>
/* ============================================================
   Карта урока: «ночной город, который ты зажигаешь».
   Районы (главы), улица (путь), фонари (узлы), печати глав, врата экзамена,
   туман закрытых глав, хореографии возврата. Общий файл для макетов 03–07.
   ============================================================ */
.map-hdr {
  padding: 2px 16px 14px;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-a) 72%, transparent 100%);
}
.map-hdr .row1 { display: flex; align-items: center; gap: 12px; }
.map-hdr .row1 .h-label { flex: 1; min-width: 0; }
.map-hdr .h-title { font-size: 26px; padding: 0 2px; }
.map-hdr .h-label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.map-hdr .h-label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ch); box-shadow: 0 0 10px var(--ch-glow); transition: background var(--t-slow), box-shadow var(--t-slow); }
.map-hdr .wallet { display: flex; gap: 8px; }
.progress-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 2px; }
.progress-row .count { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.spectrum { flex: 1; display: flex; gap: 3px; height: 6px; }
.spectrum span { flex: 1; border-radius: 3px; background: rgba(255,255,255,.07); position: relative; overflow: hidden; }
.spectrum span::after { content: ""; position: absolute; inset: 0; background: var(--ch); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform var(--t-scene) var(--ease-out); box-shadow: 0 0 8px var(--ch-glow); }

.map-scroll { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; z-index: var(--z-map); scrollbar-width: none; }
.map-scroll::-webkit-scrollbar { display: none; }
.map-canvas { position: relative; padding-bottom: 120px; }

/* ---------- Глава = район ---------- */
.ch { position: relative; }
.ch-ground {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(90% 40% at 20% 8%, var(--ch-soft), transparent 70%),
    linear-gradient(180deg, var(--ch-ground) 0%, transparent 60%);
  opacity: .9;
  transition: opacity var(--t-scene);
}
.ch.locked .ch-ground { opacity: .28; }
.ch-glow {
  position: absolute; width: 260px; height: 260px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, var(--ch-glow), transparent);
  opacity: .35;
  animation: drift calc(14000ms * var(--tf)) ease-in-out infinite alternate;
  will-change: transform;
}
.ch.locked .ch-glow { display: none; }
@keyframes drift { from { transform: translate(0, 0); } to { transform: translate(24px, -18px); } }

.ch-head { position: relative; padding: 26px 22px 6px; display: flex; align-items: flex-start; gap: 12px; }
.ch-head .t { flex: 1; min-width: 0; }
.ch-num { font-size: 13px; font-weight: 800; letter-spacing: .6px; color: var(--ch); margin-bottom: 4px; transition: color var(--t-slow); }
.ch-title { font-size: 30px; font-weight: 900; letter-spacing: -.8px; line-height: 1.06; color: var(--text); }
.ch-scene { margin-top: 4px; font-size: 15.5px; font-weight: 600; color: var(--muted); }
.ch.locked .ch-num { color: var(--ghost); }
.ch.locked .ch-title { color: var(--text-2); opacity: .55; }
.ch.locked .ch-scene { opacity: .55; }
.ch-status {
  flex: 0 0 auto; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center;
  background: linear-gradient(160deg, var(--elev2), var(--card));
  box-shadow: 0 6px 14px var(--shadow), inset 0 1px 0 var(--inner-light);
  font-size: 14px; font-weight: 800; color: var(--text-2); font-variant-numeric: tabular-nums;
}
.ch-status svg { width: 20px; height: 20px; color: var(--ghost); }
.ch.done .ch-status { background: linear-gradient(160deg, #D19E1D, #FFD86E 55%, #E3A812); color: #241A05; box-shadow: 0 8px 18px rgba(255,212,59,.28), inset 0 1px 0 rgba(255,255,255,.5); }
.ch.done .ch-status svg { color: #241A05; }

/* ---------- Доска и улица ---------- */
.board { position: relative; width: 390px; margin-top: 26px; }
.route { position: absolute; left: 0; top: 0; overflow: visible; }
.route .street { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
.route .glow { fill: none; stroke: var(--ch); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; opacity: .16; }
.route .lit { fill: none; stroke: var(--ch); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.route .glow, .route .lit { transition: stroke-dashoffset var(--t-scene) var(--ease-out); }
.ch.locked .route .street { stroke: rgba(255,255,255,.045); }
.spark {
  position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, var(--ch) 45%, transparent 72%);
  box-shadow: 0 0 18px 4px var(--ch-glow); opacity: 0; pointer-events: none;
  offset-rotate: 0deg;
}

/* ---------- Узел-фонарь ---------- */
.node {
  position: absolute; --s: 60px;
  left: calc(var(--x) - var(--s) / 2); top: calc(var(--y) - var(--s) / 2);
  width: var(--s); height: var(--s);
  border: none; background: transparent; cursor: pointer; padding: 0;
  color: var(--text);
  transition: transform var(--t-normal) var(--ease-spring);
}
.node.current { --s: 76px; }
.node.next { --s: 64px; }
.node .ground {
  position: absolute; left: 50%; top: 62%; width: calc(var(--s) * 2.3); height: calc(var(--s) * 1.35);
  transform: translate(-50%, -32%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, var(--ch-glow), transparent);
  opacity: 0; transition: opacity var(--t-scene);
}
.node.done .ground { opacity: .5; }
.node.current .ground { opacity: .85; }
.node .halo {
  position: absolute; inset: -16px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, transparent 58%, var(--ch-glow) 64%, transparent 100%);
}
.node.current .halo { opacity: 1; animation: breath var(--t-breath) ease-in-out infinite; will-change: transform, opacity; }
:root[data-reduced="1"] .node.current .halo { animation: none; opacity: .7; }
@keyframes breath { 0%, 100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.14); opacity: 1; } }
.node .gem {
  position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  font-size: 22px; font-weight: 900; letter-spacing: -.5px; font-variant-numeric: tabular-nums;
  transition: transform var(--t-press) var(--ease-out), box-shadow var(--t-slow), background var(--t-slow);
}
.node.current .gem { font-size: 28px; }
.node .gem svg { width: 26px; height: 26px; }
.node.done .gem, .node.current .gem {
  color: var(--ch-ink);
  background: radial-gradient(circle at 34% 26%, color-mix(in oklab, var(--ch) 58%, white) 0%, var(--ch) 40%, var(--ch-2) 100%);
  box-shadow: 0 14px 26px -10px var(--ch-glow), inset 0 -10px 16px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.42);
}
.node.next .gem {
  color: var(--ch);
  background: radial-gradient(circle at 50% 42%, var(--ch-soft) 0%, var(--elev2) 60%, var(--card) 100%);
  box-shadow: 0 10px 20px -10px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.1);
  animation: warm calc(3600ms * var(--tf)) ease-in-out infinite;
}
@keyframes warm { 0%, 100% { box-shadow: 0 10px 20px -10px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.1); } 50% { box-shadow: 0 10px 22px -8px var(--ch-glow), inset 0 1px 0 rgba(255,255,255,.14); } }
:root[data-reduced="1"] .node.next .gem { animation: none; }
.node.locked .gem {
  color: var(--ghost);
  background: radial-gradient(circle at 34% 26%, var(--elev3) 0%, var(--card) 72%);
  box-shadow: 0 8px 16px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
}
.node.locked .gem svg { width: 20px; height: 20px; opacity: .7; }
.node.current .gem::after, .seal.available .face::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%);
  transform: translateX(-130%);
  animation: glint calc(5200ms * var(--tf)) linear infinite;
}
:root[data-reduced="1"] .node.current .gem::after, :root[data-reduced="1"] .seal.available .face::after { animation: none; opacity: 0; }
@keyframes glint { 0%, 78% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
.node:active .gem { transform: scale(.94); }
.node.locked:active .gem { transform: scale(.96); }
.node .stars { position: absolute; top: 100%; left: 50%; transform: translate(-50%, 5px); }
.node .stars svg { width: 12px; height: 12px; }
.node .stars svg.pop { animation: starPop var(--t-celebrate) var(--ease-spring) both; }
@keyframes starPop { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
.node .pill {
  position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%);
  padding: 8px 14px; border-radius: var(--r-pill); white-space: nowrap;
  font-size: 14px; font-weight: 800; color: var(--ch-ink);
  background: linear-gradient(180deg, color-mix(in oklab, var(--ch) 75%, white), var(--ch));
  box-shadow: 0 10px 20px -6px var(--ch-glow), inset 0 1px 0 rgba(255,255,255,.4);
  opacity: 0; pointer-events: none;
}
.node .pill::after { content: ""; position: absolute; left: 50%; top: 100%; width: 10px; height: 10px; background: var(--ch); transform: translate(-50%, -6px) rotate(45deg); border-radius: 2px; }
.node.current .pill { opacity: 1; animation: floatPill calc(2400ms * var(--tf)) ease-in-out infinite; }
:root[data-reduced="1"] .node.current .pill { animation: none; }
@keyframes floatPill { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -4px); } }
.node.is-denied .gem { animation: deny var(--t-normal) var(--ease-out) 1; }
@keyframes deny { 0% { transform: scale(1); } 50% { transform: scale(.96); } 100% { transform: scale(1); } }
.node.is-pop { animation: nodePop var(--t-celebrate) var(--ease-spring) both; }
@keyframes nodePop { 0% { transform: scale(.7); } 55% { transform: scale(1.1); } 100% { transform: scale(1); } }
.node.is-land .gem { animation: land var(--t-slow) var(--ease-spring) both; }
@keyframes land { 0% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* ---------- Печать главы ---------- */
.seal {
  position: absolute; --s: 96px;
  left: calc(var(--x) - var(--s) / 2); top: calc(var(--y) - var(--s) / 2);
  width: var(--s); height: var(--s); border: none; background: transparent; cursor: pointer; padding: 0;
}
.seal .ground { position: absolute; left: 50%; top: 60%; width: 220px; height: 130px; transform: translate(-50%, -32%); border-radius: 50%; background: radial-gradient(closest-side, var(--ch-glow), transparent); opacity: 0; pointer-events: none; transition: opacity var(--t-scene); }
.seal.available .ground, .seal.passed .ground { opacity: .7; }
.seal .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.seal .ring .track { fill: none; stroke: rgba(255,255,255,.09); stroke-width: 6; }
.seal .ring .seg { fill: none; stroke: var(--ch); stroke-width: 6; stroke-linecap: round; opacity: .28; transition: opacity var(--t-slow); }
.seal .ring .seg.on { opacity: 1; filter: drop-shadow(0 0 4px var(--ch-glow)); }
.seal.available .ring { animation: spin calc(24000ms * var(--tf)) linear infinite; }
:root[data-reduced="1"] .seal.available .ring { animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.seal .face {
  position: absolute; inset: 15px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 34% 26%, var(--elev3) 0%, var(--card) 76%);
  box-shadow: 0 12px 24px -10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
  transition: transform var(--t-press) var(--ease-out), background var(--t-slow), box-shadow var(--t-slow);
}
.seal .rune { font-family: var(--font-rune); font-size: 30px; font-weight: 700; color: var(--ghost); transition: color var(--t-slow); }
.seal.available .face { background: radial-gradient(circle at 34% 26%, color-mix(in oklab, var(--ch) 30%, var(--elev3)) 0%, var(--card) 76%); box-shadow: 0 12px 26px -8px var(--ch-glow), inset 0 1px 0 rgba(255,255,255,.14); }
.seal.available .rune { color: var(--ch); text-shadow: 0 0 14px var(--ch-glow); }
.seal.passed .face { background: linear-gradient(160deg, #D19E1D 0%, #FFD86E 52%, #E3A812 100%); box-shadow: 0 14px 28px -8px rgba(255,212,59,.45), inset 0 -8px 14px rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.55); }
.seal.passed .rune { color: #241A05; text-shadow: none; }
.seal.passed .ring .seg { stroke: var(--gold); }
.seal:active .face { transform: scale(.94); }
.seal .label { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 800; letter-spacing: .3px; color: var(--muted); }
.seal.available .label { color: var(--ch); }
.seal.is-stamp .face { animation: stamp calc(520ms * var(--tf)) var(--ease-spring) both; }
@keyframes stamp { 0% { transform: scale(1.32); } 55% { transform: scale(.94); } 100% { transform: scale(1); } }
.seal .flash { position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,232,150,.9), rgba(255,212,59,.35) 45%, transparent 72%); opacity: 0; pointer-events: none; }
.seal.is-stamp .flash { animation: flash calc(640ms * var(--tf)) var(--ease-out) both; }
@keyframes flash { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
.seal.is-denied .face { animation: deny var(--t-normal) var(--ease-out) 1; }

/* ---------- Врата экзамена ---------- */
.gate {
  position: absolute; width: 128px; height: 104px; left: calc(var(--x) - 64px); top: calc(var(--y) - 52px);
  border: none; background: transparent; cursor: pointer; padding: 0;
}
.gate .arch {
  position: absolute; inset: 0; border-radius: 64px 64px 20px 20px; overflow: hidden;
  background: linear-gradient(180deg, var(--elev3) 0%, var(--card) 100%);
  box-shadow: 0 16px 30px -10px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08);
  transition: transform var(--t-press) var(--ease-out);
}
.gate .inner {
  position: absolute; left: 18px; right: 18px; top: 18px; bottom: 0; border-radius: 46px 46px 6px 6px;
  background: radial-gradient(80% 90% at 50% 100%, var(--ch-3) 0%, var(--bg) 80%);
  display: grid; place-items: center;
}
.gate .rune { font-family: var(--font-rune); font-size: 34px; font-weight: 700; color: var(--ghost); }
.gate .light { position: absolute; left: 50%; bottom: -10px; width: 200px; height: 120px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, var(--ch-glow), transparent); opacity: 0; transition: opacity var(--t-scene); pointer-events: none; }
.gate.available .inner { background: radial-gradient(80% 90% at 50% 100%, var(--ch) 0%, var(--ch-2) 40%, var(--ch-3) 100%); }
.gate.available .rune { color: var(--ch-ink); }
.gate.available .light { opacity: .8; animation: breath var(--t-breath) ease-in-out infinite; }
.gate.passed .inner { background: linear-gradient(160deg, #D19E1D 0%, #FFD86E 52%, #E3A812 100%); }
.gate.passed .rune { color: #241A05; }
.gate .label { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 800; letter-spacing: .3px; color: var(--muted); }
.gate.available .label { color: var(--ch); }
.gate:active .arch { transform: scale(.96); }
.gate.is-denied .arch { animation: deny var(--t-normal) var(--ease-out) 1; }

/* ---------- Туман закрытой главы ---------- */
.fog { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(3,5,4,.2) 0%, rgba(3,5,4,.62) 40%, rgba(3,5,4,.62) 100%); opacity: 0; transition: opacity var(--t-scene) var(--ease-out); }
.ch.locked .fog { opacity: 1; }
.fog .sweep { position: absolute; left: 0; right: 0; top: -40%; height: 40%; background: linear-gradient(180deg, transparent, var(--ch-soft) 60%, transparent); opacity: 0; }
.ch.is-unlocking .fog { opacity: 0; }
.ch.is-unlocking .fog .sweep { animation: sweepDown calc(900ms * var(--tf)) var(--ease-slide) both; }
@keyframes sweepDown { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(400%); opacity: 0; } }

/* ---------- Вход строк (каскад i × 40 мс) ---------- */
.phone.is-entering .node, .phone.is-entering .seal, .phone.is-entering .gate, .phone.is-entering .ch-head {
  animation: nodeIn var(--t-slow) var(--ease-spring) both;
  animation-delay: calc(var(--i, 0) * 40ms * var(--tf));
}
@keyframes nodeIn { 0% { opacity: 0; transform: translateY(18px) scale(.85); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

/* ---------- «Продолжить» внизу (только когда текущий узел вне экрана) ---------- */
.jump {
  position: absolute; left: 50%; bottom: 44px; z-index: var(--z-float);
  transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
  height: 52px; padding: 0 20px 0 16px; border: none; border-radius: var(--r-pill); cursor: pointer;
  display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--ch-ink); white-space: nowrap;
  background: linear-gradient(180deg, color-mix(in oklab, var(--ch) 75%, white), var(--ch) 60%, var(--ch-2));
  box-shadow: 0 5px 0 var(--ch-3), 0 18px 34px -8px var(--ch-glow), inset 0 1px 0 rgba(255,255,255,.4);
  transition: transform var(--t-normal) var(--ease-out), opacity var(--t-normal) var(--ease-out), background var(--t-slow);
}
.jump.is-on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.jump:active { transform: translate(-50%, 5px); box-shadow: 0 0 0 var(--ch-3), 0 8px 16px -6px var(--ch-glow), inset 0 1px 0 rgba(255,255,255,.3); }
.jump svg { width: 22px; height: 22px; }

/* ---------- Шторка пройденного узла ---------- */
.node-sheet .s-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.node-sheet .s-gem { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 900; color: var(--ch-ink); background: radial-gradient(circle at 34% 26%, color-mix(in oklab, var(--ch) 58%, white) 0%, var(--ch) 40%, var(--ch-2) 100%); box-shadow: 0 10px 20px -8px var(--ch-glow), inset 0 2px 0 rgba(255,255,255,.4); flex: 0 0 auto; }
.node-sheet .s-title { font-size: 22px; font-weight: 900; letter-spacing: -.4px; line-height: 1.1; }
.node-sheet .s-kind { font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.node-sheet .s-result { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 18px; background: linear-gradient(160deg, var(--elev2), var(--elev)); box-shadow: inset 0 1px 0 var(--inner-light); margin-bottom: 14px; }
.node-sheet .s-result .k { font-size: 15px; font-weight: 700; color: var(--text-2); }
.node-sheet .s-result .stars svg { width: 22px; height: 22px; }
.node-sheet .actions { display: flex; flex-direction: column; gap: 8px; }

/* ---------- Оффлайн-пилюля, летящие руны, скелетон, финал ---------- */
.offline {
  position: absolute; left: 50%; top: 186px; z-index: var(--z-float); transform: translate(-50%, -8px); opacity: 0;
  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px; border-radius: var(--r-pill);
  background: linear-gradient(160deg, var(--elev3), var(--elev)); box-shadow: 0 10px 22px rgba(0,0,0,.45), inset 0 1px 0 var(--inner-light);
  font-size: 14px; font-weight: 800; color: var(--text-2); pointer-events: none; transition: transform var(--t-normal) var(--ease-out), opacity var(--t-normal);
}
.offline svg { width: 18px; height: 18px; color: var(--muted); }
.phone[data-state="offline"] .offline { transform: translate(-50%, 0); opacity: 1; }

.flyer { position: absolute; z-index: var(--z-toast); font-family: var(--font-rune); font-size: 22px; font-weight: 700; color: var(--gold); text-shadow: 0 0 12px rgba(255,212,59,.7); pointer-events: none; will-change: transform, opacity; }
.chip.is-bump { animation: bump var(--t-slow) var(--ease-spring) 1; }
@keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.16); } 100% { transform: scale(1); } }

.phone[data-state="skeleton"] .node .gem, .phone[data-state="skeleton"] .seal .face, .phone[data-state="skeleton"] .gate .arch { background: var(--elev); box-shadow: none; color: transparent; }
.phone[data-state="skeleton"] .node .ground, .phone[data-state="skeleton"] .node .halo, .phone[data-state="skeleton"] .node .pill, .phone[data-state="skeleton"] .node .stars, .phone[data-state="skeleton"] .seal .ground, .phone[data-state="skeleton"] .gate .light { opacity: 0 !important; animation: none !important; }
.phone[data-state="skeleton"] .route .lit, .phone[data-state="skeleton"] .route .glow { opacity: 0; }
.phone[data-state="skeleton"] .ch-glow { display: none; }
.phone[data-state="skeleton"] .ch-title, .phone[data-state="skeleton"] .ch-scene, .phone[data-state="skeleton"] .ch-num { color: transparent; background: var(--elev); border-radius: 8px; }
.phone[data-state="skeleton"] .chip { color: transparent; }
.phone[data-state="skeleton"] .chip .glyph, .phone[data-state="skeleton"] .chip svg { opacity: 0; }
.phone[data-state="skeleton"] .spectrum span::after { transform: scaleX(0); }
.phone[data-state="skeleton"] .node .gem::after { display: none; }

<script>
/* ============================================================
   Геометрия маршрутов карты. Не змейка: у каждой главы своя форма пути,
   продиктованная сценой. Доска главы = 390 px шириной, высота своя.
   Порядок сессий всегда однозначен: одна непрерывная линия света через
   8 точек (7 занятий + печать главы / врата экзамена в конце).
   Точки — центры узлов. Узлы: 60–76 px, печать 96 px, врата 128×100 px.
   ============================================================ */
(function () {
  const W = 390;
  const CX = W / 2;

  function polar(cx, cy, r, deg) {
    const a = (deg * Math.PI) / 180;
    return { x: Math.round(cx + r * Math.cos(a)), y: Math.round(cy + r * Math.sin(a)) };
  }

  /* Глава 1 «Утро в офисе»: лестница — шаг вправо, шаг вниз, вход в здание.
     Печать — площадка внизу по центру. */
  function stairs() {
    const pts = [
      { x: 72, y: 84 }, { x: 160, y: 84 }, { x: 160, y: 176 }, { x: 250, y: 176 },
      { x: 250, y: 268 }, { x: 330, y: 268 }, { x: 330, y: 362 }, { x: CX, y: 486 },
    ];
    return { pts, h: 580, style: "steps" };
  }

  /* Глава 2 «Кофе с коллегой»: кольцо чашки — 7 занятий по кромке, печать в центре. */
  function ring() {
    const cy = 268, r = 132;
    const pts = [];
    for (let i = 0; i < 7; i += 1) pts.push(polar(CX, cy, r, -90 + i * (360 / 7)));
    pts.push({ x: CX, y: cy });
    return { pts, h: 460, style: "ring", ring: { cx: CX, cy, r } };
  }

  /* Глава 3 «Знакомство с командой»: два ряда, как на командном фото. */
  function rows() {
    const pts = [
      { x: 62, y: 96 }, { x: 150, y: 96 }, { x: 240, y: 96 }, { x: 328, y: 96 },
      { x: 284, y: 196 }, { x: CX, y: 196 }, { x: 106, y: 196 }, { x: CX, y: 332 },
    ];
    return { pts, h: 420, style: "curve" };
  }

  /* Глава 4 «Квартира и погода»: косой дождь — одна струя сверху справа вниз влево. */
  function rain() {
    const pts = [];
    for (let i = 0; i < 7; i += 1) pts.push({ x: 330 - i * 45, y: 84 + i * 68 });
    pts.push({ x: CX, y: 604 });
    return { pts, h: 690, style: "line" };
  }

  /* Глава 5 «Обед с командой»: стол — вытянутая петля, печать во главе стола. */
  function track() {
    const pts = [
      { x: 78, y: 104 }, { x: 166, y: 82 }, { x: 256, y: 82 }, { x: 336, y: 112 },
      { x: 336, y: 238 }, { x: 256, y: 268 }, { x: 166, y: 268 }, { x: 78, y: 236 },
    ];
    return { pts, h: 340, style: "curve" };
  }

  /* Глава 6 «Пятница, паб»: быстрая речь — тугой зигзаг, единственный на карте, намеренно. */
  function zigzag() {
    const pts = [];
    for (let i = 0; i < 7; i += 1) pts.push({ x: i % 2 === 0 ? 132 : 258, y: 72 + i * 52 });
    pts.push({ x: CX, y: 470 });
    return { pts, h: 560, style: "line" };
  }

  /* Глава 7 «Звонок домой»: спираль наружу — неделя собирается в одно, врата внизу. */
  function spiral() {
    const cy = 272;
    const pts = [];
    for (let i = 0; i < 7; i += 1) {
      const r = 76 + i * 14;
      const deg = 90 - (6 - i) * 51.4;
      pts.push(polar(CX, cy, r, deg));
    }
    pts.push({ x: CX, y: 560 });
    return { pts, h: 660, style: "curve", gate: true };
  }

  const SHAPES = { stairs, ring, rows, rain, track, zigzag, spiral };

  /* Гладкая кривая Катмулла–Рома через точки → кубические Безье. */
  function curvePath(pts) {
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i += 1) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x} ${p2.y}`;
    }
    return d;
  }

  /* Ломаная со скруглёнными углами (лестница). */
  function stepsPath(pts, radius) {
    const r = radius || 26;
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i += 1) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const v1 = { x: a.x - b.x, y: a.y - b.y };
      const v2 = { x: c.x - b.x, y: c.y - b.y };
      const l1 = Math.hypot(v1.x, v1.y), l2 = Math.hypot(v2.x, v2.y);
      const rr = Math.min(r, l1 / 2, l2 / 2);
      const p1 = { x: b.x + (v1.x / l1) * rr, y: b.y + (v1.y / l1) * rr };
      const p2 = { x: b.x + (v2.x / l2) * rr, y: b.y + (v2.y / l2) * rr };
      d += ` L${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q${b.x} ${b.y} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    const last = pts[pts.length - 1];
    d += ` L${last.x} ${last.y}`;
    return d;
  }

  function linePath(pts) {
    return pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x} ${p.y}`).join(" ");
  }

  /* Кольцо: дуги по окружности между 7 точками, затем мягкий заход в центр. */
  function ringPath(pts, ring) {
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < 7; i += 1) d += ` A${ring.r} ${ring.r} 0 0 1 ${pts[i].x} ${pts[i].y}`;
    const last = pts[6], c = pts[7];
    d += ` Q${(last.x + c.x) / 2 - 30} ${(last.y + c.y) / 2 - 40} ${c.x} ${c.y}`;
    return d;
  }

  function routeFor(shapeName) {
    const r = SHAPES[shapeName]();
    let d;
    if (r.style === "steps") d = stepsPath(r.pts);
    else if (r.style === "line") d = linePath(r.pts);
    else if (r.style === "ring") d = ringPath(r.pts, r.ring);
    else d = curvePath(r.pts);
    return Object.assign(r, { d, w: W });
  }

  /* Длина пути до каждой точки (для света прогресса) — по готовому <path>. */
  function lengthsAtPoints(pathEl, pts) {
    const total = pathEl.getTotalLength();
    const step = 3;
    const samples = [];
    for (let l = 0; l <= total; l += step) {
      const p = pathEl.getPointAtLength(l);
      samples.push({ l, x: p.x, y: p.y });
    }
    return pts.map((pt) => {
      let best = samples[0], bd = Infinity;
      for (const s of samples) {
        const dd = (s.x - pt.x) ** 2 + (s.y - pt.y) ** 2;
        if (dd < bd) { bd = dd; best = s; }
      }
      return best.l;
    });
  }

  window.ROUTES = { routeFor, lengthsAtPoints, W };
})();

</script>
<script>
/* ============================================================
   AtlasKit — колода уроков (общее для макетов 01 и 02).
   AtlasKit.buildDeck(deckEl, model, { onCard })
     model: { currentLesson, doneInCurrent, doneLessons, released }
   AtlasKit.sigil(n, color) — векторный сигил урока по номеру (ноль ассетов).
   ============================================================ */
(function () {
  const { LESSONS, CHAPTERS } = window.COURSE;
  const CH_COLORS = ["#6EDCC4", "#EDB667", "#F28A9C", "#8AAAF2", "#A9DB6C", "#C99EF2", "#F2CB6E"];
  const RUNES = ["ᚠ", "ᚢ", "ᚦ", "ᚨ", "ᚱ", "ᚲ", "ᚷ", "ᚹ", "ᛃ", "ᛊ", "ᛏ", "ᛒ", "ᛗ", "ᛚ", "ᛜ"];

  function sigil(n, color) {
    const sides = 3 + (n % 5), rot = n * 13, cx = 75, cy = 75;
    let out = "";
    for (let ring = 0; ring < 3; ring += 1) {
      const r = 62 - ring * 17;
      const pts = [];
      for (let i = 0; i < sides; i += 1) {
        const a = ((360 / sides) * i + rot + ring * 9) * Math.PI / 180;
        pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
      }
      out += `<polygon points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="${ring === 0 ? 1.4 : 1}" opacity="${1 - ring * .25}"/>`;
    }
    out += `<circle cx="${cx}" cy="${cy}" r="3" fill="${color}"/><text x="${cx}" y="${cy + 8}" text-anchor="middle" font-family="Segoe UI Historic, Noto Sans Runic, Apple Symbols" font-size="22" fill="${color}" opacity=".9">${RUNES[n % 15]}</text>`;
    return `<svg viewBox="0 0 150 150">${out}</svg>`;
  }

  function cardHTML(l, m) {
    const n = l.n;
    const isDone = n <= m.doneLessons;
    const isCurrent = n === m.currentLesson;
    const isSoon = n > m.released;
    const curCh = isCurrent ? Math.min(7, Math.floor(m.doneInCurrent / 8) + 1) : 1;
    const dots = CHAPTERS.map((c) => {
      const done = isDone || (isCurrent && m.doneInCurrent >= c.n * 8);
      const now = isCurrent && !done && c.n === curCh;
      return `<span class="${done ? "on" : now ? "now" : ""}" style="--d:${isDone ? "#E9CE7A" : CH_COLORS[c.n - 1]}"></span>`;
    }).join("");
    const right = isDone
      ? `<div class="wax gold"><svg><use href="#i-check"/></svg></div>`
      : isCurrent ? ""
        : isSoon ? `<div class="wax"><svg><use href="#i-clock"/></svg></div>`
          : `<div class="wax"><span class="crack"></span><svg><use href="#i-lock"/></svg></div>`;
    const count = isDone ? `<span class="stars-total"><svg><use href="#i-star"/></svg>${140 + n * 3} из 168</span>` : isCurrent ? `${m.doneInCurrent} из 56` : "";
    const spectrum = isCurrent ? `<div class="spectrum" style="width:120px">${CHAPTERS.map((c) => `<span data-ch="${c.n}" style="--p:${Math.max(0, Math.min(1, (m.doneInCurrent - (c.n - 1) * 8) / 8))}"></span>`).join("")}</div>` : "";
    return {
      cls: "card " + (isDone ? "done" : isCurrent ? "current" : isSoon ? "soon" : "sealed"),
      ch: curCh,
      html: `
        <div class="light"></div>
        <div class="top"><div class="num">${String(n).padStart(2, "0")}</div><div class="t"><div class="arc">${l.arc}</div></div>${right}</div>
        <div class="sys">${l.system}</div>
        ${isCurrent ? `<div class="dots">${dots}</div>` : ""}
        <div class="sigil">${sigil(n, isCurrent ? CH_COLORS[curCh - 1] : "#E9CE7A")}</div>
        <div class="bottom">${spectrum}<span class="cnt">${count}</span>${isCurrent ? `<button class="open"><svg><use href="#i-play"/></svg>Открыть карту</button>` : ""}</div>`,
    };
  }

  function buildDeck(deck, m, opts) {
    deck.innerHTML = "";
    const limit = (opts && opts.limit) || LESSONS.length;
    LESSONS.slice(0, limit).forEach((l, idx) => {
      const c = cardHTML(l, m);
      const card = document.createElement("article");
      card.className = c.cls;
      card.style.setProperty("--i", String(idx));
      card.setAttribute("data-ch", String(c.ch));
      card.setAttribute("data-n", String(l.n));
      card.innerHTML = c.html;
      if (opts && opts.onCard) card.addEventListener("click", () => opts.onCard(card, l.n));
      deck.appendChild(card);
    });
  }

  window.AtlasKit = { buildDeck, cardHTML, sigil, CH_COLORS };
})();

</script>
<script>
/* ============================================================
   Showcase — панель витрины для макетов «Атласа».
   Showcase.init({ title, kicker, lead, states:[{id,label,group,apply}],
                   notes: html, nav: [{href,label}], onTheme })
   - переключает состояния экрана (data-state на телефоне + apply()),
   - тему хрома (data-theme на <html>), замедление 4× (--tf), reduced motion,
   - «Повторить» перезапускает текущее состояние (все анимации с нуля).
   Никаких зависимостей. Всё, что оно делает с DOM телефона, — через apply().
   ============================================================ */
(function () {
  const root = document.documentElement;
  // Перехват ошибок макета: смотреть window.__mockupErrors в консоли.
  window.__mockupErrors = [];
  window.addEventListener("error", (e) => window.__mockupErrors.push(`${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}`));
  window.addEventListener("unhandledrejection", (e) => window.__mockupErrors.push(String(e.reason && (e.reason.stack || e.reason))));
  const THEMES = [
    { id: "forest", label: "Лес", sw: "#47C870" },
    { id: "gold", label: "Золото", sw: "#D6B35A" },
    { id: "coral", label: "Коралл", sw: "#FF7F50" },
  ];
  const state = { current: null, slow: false, reduced: false, theme: "forest", cfg: null };

  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        if (k === "class") n.className = attrs[k];
        else if (k === "html") n.innerHTML = attrs[k];
        else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
        else n.setAttribute(k, attrs[k]);
      }
    }
    (children || []).forEach((c) => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return n;
  }

  function applyMotionFlags() {
    root.style.setProperty("--tf", state.reduced ? 0.001 : state.slow ? 4 : 1);
    if (state.reduced) root.setAttribute("data-reduced", "1");
    else root.removeAttribute("data-reduced");
  }

  /* Перезапуск CSS-анимаций внутри контейнера: снять и вернуть класс через reflow. */
  function replayAnimations(container) {
    container.querySelectorAll("[class]").forEach((n) => {
      const cls = n.getAttribute("class");
      if (!cls) return;
      n.style.animation = "none";
      void n.offsetWidth;
      n.style.animation = "";
    });
  }

  function setState(id, opts) {
    const cfg = state.cfg;
    const s = cfg.states.find((x) => x.id === id);
    if (!s) return;
    state.current = id;
    const phone = document.querySelector(".phone");
    if (phone) phone.setAttribute("data-state", id);
    document.querySelectorAll(".pbtn[data-state-id]").forEach((b) => {
      b.setAttribute("aria-pressed", b.getAttribute("data-state-id") === id ? "true" : "false");
    });
    if (typeof s.apply === "function") s.apply(Object.assign({ replay: false }, opts || {}));
    const noteBox = document.getElementById("state-note");
    if (noteBox) noteBox.innerHTML = s.note || "";
    try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (e) { /* песочница артефакта запрещает историю: состояние живёт только в панели */ }
  }

  /* На узком экране (телефон) рама 390 px масштабируется под ширину окна:
     страница никогда не прокручивается вбок, макет смотрится на реальном айфоне. */
  function fitPhone() {
    const phone = document.querySelector(".phone");
    if (!phone) return;
    const z = Math.min(1, (window.innerWidth - 8) / 390);
    phone.style.zoom = z < 1 ? String(z) : "";
  }
  window.addEventListener("resize", fitPhone);

  function init(cfg) {
    state.cfg = cfg;
    fitPhone();
    const panel = document.querySelector(".panel");
    if (!panel) return;
    panel.innerHTML = "";

    const h1 = el("h1", null, [el("small", null, [cfg.kicker || "Learning V2 · Атлас"]), cfg.title]);
    panel.appendChild(h1);
    if (cfg.lead) panel.appendChild(el("p", { class: "lead", html: cfg.lead }));

    if (cfg.nav && cfg.nav.length) {
      const nav = el("div", { class: "nav" });
      cfg.nav.forEach((n) => nav.appendChild(el("a", { href: n.href }, [n.label])));
      panel.appendChild(nav);
    }

    // Состояния (группами)
    const groups = [];
    cfg.states.forEach((s) => {
      const g = s.group || "Состояния";
      if (!groups.includes(g)) groups.push(g);
    });
    groups.forEach((g) => {
      const box = el("div");
      box.appendChild(el("h2", null, [g]));
      const grp = el("div", { class: "group" });
      cfg.states
        .filter((s) => (s.group || "Состояния") === g)
        .forEach((s) => {
          grp.appendChild(
            el("button", {
              class: "pbtn",
              "data-state-id": s.id,
              "aria-pressed": "false",
              onclick: () => setState(s.id, { replay: true }),
            }, [s.label]),
          );
        });
      box.appendChild(grp);
      panel.appendChild(box);
    });

    // Управление движением
    const motionBox = el("div");
    motionBox.appendChild(el("h2", null, ["Движение"]));
    const mg = el("div", { class: "group" });
    const replayBtn = el("button", { class: "pbtn replay", onclick: () => setState(state.current, { replay: true }) }, ["Повторить"]);
    const slowBtn = el("button", {
      class: "pbtn", "aria-pressed": "false",
      onclick: (e) => {
        state.slow = !state.slow;
        e.currentTarget.setAttribute("aria-pressed", String(state.slow));
        applyMotionFlags();
        setState(state.current, { replay: true });
      },
    }, ["Замедлить 4×"]);
    const rmBtn = el("button", {
      class: "pbtn", "aria-pressed": "false",
      onclick: (e) => {
        state.reduced = !state.reduced;
        e.currentTarget.setAttribute("aria-pressed", String(state.reduced));
        applyMotionFlags();
        setState(state.current, { replay: true });
      },
    }, ["Reduced motion"]);
    mg.appendChild(replayBtn);
    mg.appendChild(slowBtn);
    mg.appendChild(rmBtn);
    motionBox.appendChild(mg);
    panel.appendChild(motionBox);

    // Тема хрома
    if (cfg.themes !== false) {
      const tb = el("div");
      tb.appendChild(el("h2", null, ["Тема хрома приложения"]));
      const tg = el("div", { class: "group" });
      THEMES.forEach((t) => {
        const b = el("button", {
          class: "pbtn", "data-theme-id": t.id, "aria-pressed": String(t.id === state.theme),
          onclick: () => {
            state.theme = t.id;
            root.setAttribute("data-theme", t.id);
            document.querySelectorAll(".pbtn[data-theme-id]").forEach((x) => x.setAttribute("aria-pressed", String(x.getAttribute("data-theme-id") === t.id)));
            if (cfg.onTheme) cfg.onTheme(t.id);
          },
        });
        const sw = el("span", { class: "sw" });
        sw.style.background = t.sw;
        b.appendChild(sw);
        b.appendChild(document.createTextNode(t.label));
        tg.appendChild(b);
      });
      tb.appendChild(tg);
      panel.appendChild(tb);
    }

    // Заметка состояния + общие заметки
    panel.appendChild(el("div", { class: "note", id: "state-note" }));
    if (cfg.notes) panel.appendChild(el("div", { class: "note", html: cfg.notes }));

    const fromHash = location.hash.replace("#", "");
    const first = cfg.states.find((s) => s.id === fromHash) ? fromHash : cfg.states[0].id;
    root.setAttribute("data-theme", state.theme);
    setState(first, { replay: true });
  }

  window.Showcase = { init, setState, replayAnimations, get state() { return state; } };
})();

</script>
<script>
(function () {
  document.getElementById("sb").outerHTML = window.statusbarHTML();
  const phone = document.querySelector(".phone");
  const prem = document.getElementById("prem");
  const deck = document.getElementById("deck");
  const cta = document.getElementById("hero-cta");
  const street = document.getElementById("street");
  const tf = () => Number(getComputedStyle(document.documentElement).getPropertyValue("--tf")) || 1;
  const reduced = () => document.documentElement.getAttribute("data-reduced") === "1";
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms * tf()));
  let token = 0;

  /* Улица урока 1 в миниатюре: та же лестница, что на карте (routes.js). */
  const route = window.ROUTES.routeFor("stairs");
  street.setAttribute("viewBox", "0 0 390 560");
  street.innerHTML = `<path class="g" d="${route.d}"/><path class="l" id="lit" d="${route.d}"/>` + route.pts.slice(0, 7).map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="${i === 0 ? 11 : 8}" style="--i:${i}"/>`).join("");

  const MODEL = { currentLesson: 1, doneInCurrent: 0, doneLessons: 0, released: 2 };

  function resetAll() {
    token += 1; timers.splice(0).forEach(clearTimeout);
    prem.className = "prem"; prem.style.display = "";
    deck.classList.remove("is-dealing", "is-dealt");
    cta.classList.remove("is-on");
    window.AtlasKit.buildDeck(deck, MODEL, { onCard() {} });
    const lit = document.getElementById("lit");
    const total = lit.getTotalLength();
    lit.style.strokeDasharray = String(total); lit.style.strokeDashoffset = String(total); lit.style.transition = "none";
  }

  async function play() {
    resetAll();
    const my = token;
    const step = (ms) => new Promise((r) => later(r, ms));
    // 1. темнота → первый фонарь
    await step(120); if (my !== token) return;
    prem.classList.add("p1");
    await step(900); if (my !== token) return;
    // 2. улица рисуется светом, фонари зажигаются
    prem.classList.add("p2");
    const lit = document.getElementById("lit");
    lit.style.transition = `stroke-dashoffset ${1100 * tf()}ms cubic-bezier(.33,.52,.25,.99)`;
    void lit.getBoundingClientRect();
    lit.style.strokeDashoffset = "0";
    await step(1500); if (my !== token) return;
    // 3. заголовок, улица уходит вглубь
    prem.classList.add("p3");
    await step(1300); if (my !== token) return;
    // 4. премьера растворяется, колода сдаётся веером
    prem.classList.add("is-out");
    deck.classList.add("is-dealing");
    await step(520); if (my !== token) return;
    prem.style.display = "none";
    await step(32 * 46 + 100); if (my !== token) return;
    deck.classList.add("is-dealt");
    await step(500); if (my !== token) return;
    cta.classList.add("is-on");
  }

  function skipToEnd() {
    token += 1; timers.splice(0).forEach(clearTimeout);
    prem.classList.add("is-out");
    deck.classList.add("is-dealing");
    later(() => { prem.style.display = "none"; deck.classList.add("is-dealt"); cta.classList.add("is-on"); }, 520);
  }
  document.getElementById("skip").addEventListener("click", skipToEnd);
  prem.addEventListener("click", (e) => { if (e.target.id !== "skip") skipToEnd(); });
  document.getElementById("cta").addEventListener("click", () => { location.href = "https://claude.ai/code/artifact/eabf33b6-6224-41e1-a326-f9ea9471130d#opening"; });

  function returning() {
    resetAll();
    prem.style.display = "none";
    deck.classList.add("is-dealing", "is-dealt");
  }

  const states = [
    { id: "premiere", group: "Первый вход", label: "Премьера (4.4 с)", note: "<b>Один раз на аккаунт.</b> Темнота, первый фонарь (900 мс), улица урока 1 рисуется светом (1100 мс) и семь фонарей зажигаются по одному, улица уходит вглубь, поднимается «Атлас», премьера растворяется, и 32 карты сдаются веером снизу (46 мс каждая). Первая карта приподнимается, клавиша «Открыть первую карту» проходит светом. Тап в любой момент — пропуск без наказания.", apply() { play(); } },
    { id: "skip", group: "Первый вход", label: "Пропустить на середине", note: "<b>Пропуск.</b> Премьера гаснет за 520 мс, колода сдаётся сразу, клавиша на месте. Ничего не ломается, ничего не повторяется.", apply() { play(); later(skipToEnd, 1800); } },
    { id: "returning", group: "Повторные входы", label: "Вернувшийся ученик", note: "<b>Без премьеры.</b> Со второго входа раздел открывается мгновенно: колода уже на экране первым кадром (данные локальные), никаких вступлений. Премьера — событие релиза, не ритуал.", apply() { returning(); } },
    { id: "reduced", group: "Повторные входы", label: "Reduced motion", note: "<b>Reduced motion.</b> Вместо рисования улицы и веера — один кадр: «Атлас», колода и клавиша. Крест-фейд 200 мс.", apply() { document.documentElement.setAttribute("data-reduced", "1"); document.documentElement.style.setProperty("--tf", 0.001); returning(); } },
  ];

  window.Showcase.init({
    kicker: "Learning V2 · Атлас · макет 01",
    title: "Премьера раздела",
    lead: "Первый вход после релиза должен запомниться: город зажигается, поднимается «Атлас», колода сдаётся веером. Один раз, 4.4 секунды, пропускается тапом.",
    nav: [{ href: "https://claude.ai/code/artifact/8a2168ce-3053-4293-97df-4956d0482718", label: "← Индекс" }, { href: "https://claude.ai/code/artifact/eabf33b6-6224-41e1-a326-f9ea9471130d", label: "02 Атлас →" }],
    states,
    notes: `<b>Реализация в RN:</b> вся сцена — один Skia/SVG-путь со <code>strokeDashoffset</code>, семь точек и два текстовых слоя; колода — тот же список карт с каскадом transform. Флаг «премьера показана» пишется локально сразу после первого кадра (не durable-очередь показа: пропущенная премьера ничего не должна). <b>Вес:</b> ни одного ассета, ни одного запроса в сеть.`,
  });
})();
</script>
