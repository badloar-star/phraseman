name: Audit French removal inventory

on:
  push:
    branches:
      - audit/remove-french-runtime-fixes-2026-08-05
  pull_request:
    branches:
      - feature/referral-roulette
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build French removal inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          git ls-files \
            | grep -Ei '(^|/)[^/]*(french|gustav|(^|[_-])fr([_.-]|$))[^/]*($|/)' \
            | sort -u \
            > artifacts/french-path-matches.txt || true

          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          tracked = [path for path in tracked if path]

          patterns = [
              re.compile(r'French|french|FRENCH'),
              re.compile(r'["\']fr["\']'),
              re.compile(r'::fr::'),
              re.compile(r'fr-FR'),
              re.compile(r'lesson_data_fr'),
              re.compile(r'lesson_intro_screens_fr'),
              re.compile(r'FrenchStudyTarget'),
              re.compile(r'FRENCH_[A-Z0-9_]'),
          ]
          text_suffixes = {
              '.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.json', '.md', '.txt',
              '.html', '.css', '.scss', '.yml', '.yaml', '.psv', '.csv', '.xml', '.toml',
              '.rules', '.sh', '.py', '.gradle', '.properties', '.plist', '.lock',
          }

          content_matches = []
          match_reasons = {}
          for raw_path in tracked:
              path = Path(raw_path)
              if path.suffix.lower() not in text_suffixes and path.name not in {'package.json', 'package-lock.json'}:
                  continue
              try:
                  if path.stat().st_size > 12 * 1024 * 1024:
                      continue
                  text = path.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              reasons = [pattern.pattern for pattern in patterns if pattern.search(text)]
              if reasons:
                  content_matches.append(raw_path)
                  match_reasons[raw_path] = reasons

          content_matches = sorted(set(content_matches))
          Path('artifacts/french-content-matches.txt').write_text(
              ''.join(f'{path}\n' for path in content_matches),
              encoding='utf-8',
          )
          Path('artifacts/french-content-reasons.json').write_text(
              json.dumps(match_reasons, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path

          def rows(name):
              path = Path('artifacts') / name
              if not path.exists():
                  return []
              return [line.strip() for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]

          path_matches = rows('french-path-matches.txt')
          content_matches = rows('french-content-matches.txt')
          all_matches = sorted(set(path_matches) | set(content_matches))

          protected_prefixes = (
              'app/premium', 'app/paywall', 'app/revenuecat', 'app/auth',
              'functions/src/premium', 'functions/src/revenuecat', 'functions/src/auth',
              'tests/premium', 'tests/paywall', 'tests/revenuecat', 'tests/auth',
          )
          protected_names = {
              'app/cloud_sync.ts',
              'app/account_generation.ts',
              'app/user_id_policy.ts',
              'app/revenuecat_init.ts',
              'components/PremiumContext.tsx',
          }
          protected = sorted(
              path for path in all_matches
              if path in protected_names or path.startswith(protected_prefixes)
          )
          removable_candidates = sorted(set(all_matches) - set(protected))

          payload = {
              'pathMatches': path_matches,
              'contentMatches': content_matches,
              'allMatches': all_matches,
              'protectedFinanceAuthFiles': protected,
              'removableCandidates': removable_candidates,
              'counts': {
                  'pathMatches': len(path_matches),
                  'contentMatches': len(content_matches),
                  'allMatches': len(all_matches),
                  'protectedFinanceAuthFiles': len(protected),
                  'removableCandidates': len(removable_candidates),
              },
          }
          Path('artifacts/french-inventory.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          lines = [
              '# French removal inventory',
              '',
              f"- Path matches: {len(path_matches)}",
              f"- Content matches: {len(content_matches)}",
              f"- Unique matches: {len(all_matches)}",
              f"- Protected finance/auth files: {len(protected)}",
              f"- Removable candidates: {len(removable_candidates)}",
              '',
              '## Protected finance/auth files',
              '',
              *[f'- `{path}`' for path in protected],
              '',
              '## Removable candidates',
              '',
              *[f'- `{path}`' for path in removable_candidates],
              '',
          ]
          Path('artifacts/french-inventory.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

          cat artifacts/french-inventory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: french-removal-inventory
          path: artifacts/
          retention-days: 7
