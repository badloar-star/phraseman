<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Админка Phraseman</title>
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#overview" aria-label="Phraseman Admin, обзор">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span><strong>Phraseman</strong><small>операционная панель</small></span>
      </a>
      <nav id="primary-nav" class="primary-nav"></nav>
      <nav id="utility-nav" class="utility-nav" aria-label="Рабочие инструменты"></nav>
      <a class="agent-office-nav" href="#agent-office" title="Открыть стратегические решения и рекомендации агентов">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6l-8-3Z"/><path d="m8.5 12 2.2 2.2L15.8 9"/></svg>
        <span><strong>Офис агентов</strong><small>Стратегические решения</small></span>
      </a>
      <a class="agent-manager-nav" href="#agent-manager" title="Поставить задачу менеджеру агентов и проследить очередь">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M4 20v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M4 10h2m12 0h2"/></svg>
        <span><strong>Менеджер агентов</strong><small>Задачи, очереди и согласования</small></span>
      </a>
      <div class="sidebar-footer">
        <span class="environment-dot" aria-hidden="true"></span>
        <span><strong>Рабочее окружение</strong><small>изменения влияют на пользователей</small></span>
      </div>
    </aside>
    <button id="mobile-nav-backdrop" class="mobile-nav-backdrop" type="button" aria-label="Закрыть меню" tabindex="-1"></button>

    <main id="admin-workspace" class="workspace">
      <header class="topbar">
        <button id="mobile-nav-toggle" class="icon-button mobile-only" type="button" aria-controls="primary-nav" aria-expanded="false" aria-label="Открыть меню" title="Открыть меню">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div id="breadcrumbs" class="breadcrumbs" aria-label="Путь раздела"></div>
        <div id="admin-workspace-actions" class="topbar-actions">
          <a class="topbar-icon-link" href="#support" title="Открыть почту поддержки" aria-label="Почта поддержки"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></a>
          <a class="topbar-icon-link" href="#analytics" title="Открыть аналитику" aria-label="Аналитика"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></a>
          <a class="topbar-icon-link" href="#admin-settings" title="Открыть настройки внешнего вида и поведения Admin v2" aria-label="Настройки"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.23.6.83 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.68 0-1.28.4-1.51 1Z"/></svg></a>
          <span id="auth-status" class="auth-status" role="status">Проверка доступа…</span>
        </div>
      </header>
      <div id="global-message" class="global-message" role="status" aria-live="polite" hidden></div>
      <div id="app" class="page" aria-live="polite"></div>
    </main>
  </div>

  <div id="dialog-root"></div>
  <a class="legacy-admin-link" href="/legacy.html" target="_blank" rel="noopener" title="Открыть старую админку в новой вкладке" aria-label="Открыть старую админку в новой вкладке">
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
  </a>
  <script src="/vendor/hammer.min.js"></script>
  <script src="/vendor/chart.umd.js"></script>
  <script src="/vendor/chartjs-plugin-zoom.min.js"></script>
  <script src="/scripts/components/analytics-language.js"></script>
  <script src="/scripts/pages/product-analytics.js"></script>
  <script src="/scripts/pages/product-sessions.js"></script>
  <script src="/scripts/pages/learning-diagnostics.js"></script>
  <script src="/scripts/pages/conversion-diagnostics.js"></script>
  <script src="/scripts/pages/retention-diagnostics.js"></script>
  <script src="/scripts/pages/subscription-analytics.js"></script>
  <script src="/scripts/pages/monthly-decision-pack.js"></script>
  <script src="/scripts/pages/english-test-analytics.js"></script>
  <script type="module" src="/scripts/admin-router.js"></script>
</body>
</html>
