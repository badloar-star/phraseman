name: Classic course authoring preview
on:
  pull_request:
    branches: [feature/referral-roulette]
    paths:
      - 'content/classic-authoring/**'
      - '.github/workflows/classic-authoring-preview.yml'
permissions:
  contents: read
concurrency:
  group: classic-authoring-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: content/classic-authoring
      - name: Authoring regression tests
        run: python3 -B -m unittest discover -s content/classic-authoring -p test_build.py -v
      - name: Compile Spanish editorial draft
        run: python3 -B content/classic-authoring/build.py --target es --out "$RUNNER_TEMP/classic-es"
      - name: Save complete source copy alongside review output
        run: cp -R content/classic-authoring "$RUNNER_TEMP/classic-es/source"
      - name: Offline lesson, lexicon and next assignment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PhraseMan-Classic-ES
          path: ${{ runner.temp }}/classic-es
          if-no-files-found: error
          retention-days: 14
