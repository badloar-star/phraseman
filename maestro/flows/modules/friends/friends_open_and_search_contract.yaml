# Friends screen contract: verifies that a friend code containing L stays
# editable/searchable in the current inline add-friend UI.
appId: app.phraseman
---
- runFlow: ../../_shared/open_dev_client.yaml
- runFlow: ../../_dismiss_bug_hunt.yaml
- runFlow: ../../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "10%,95%"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "70%,95%"
- extendedWaitUntil:
    visible:
      id: "screen-friends"
    timeout: 30000
- tapOn:
    id: "friends-code-input"
- eraseText
- inputText: "LSB8NC"
- assertVisible: "LSB8NC"
- tapOn:
    id: "friends-search"
- extendedWaitUntil:
    visible:
      id: "friends-add-feedback"
    timeout: 20000
