buildscript {
  // kotlinVersion is provided by the host project's gradle.properties / expo setup.
  def kotlinVersion = rootProject.ext.has('kotlinVersion')
    ? rootProject.ext.get('kotlinVersion')
    : (project.hasProperty('kotlinVersion') ? project.kotlinVersion : '2.0.21')
  repositories {
    mavenCentral()
    google()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
// Required since Kotlin 2.0 whenever buildFeatures.compose is enabled.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'app.phraseman.phrasewidget'
version = '0.1.0'

android {
  namespace 'app.phraseman.phrasewidget'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }

  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

  // Jetpack Glance — App Widgets written with Compose.
  implementation 'androidx.glance:glance:1.1.1'
  implementation 'androidx.glance:glance-appwidget:1.1.1'
}
