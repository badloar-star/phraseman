# Открыть квиз с главной → экран выбора уровня → назад на главную.
# Ловит регрессии навигации (в т.ч. когда goHome из TabContext — no-op вне табов).
appId: app.phraseman
---
- runFlow: ../_shared/boot_to_home_fast.yaml
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    id: "home-quick-quizzes"
- extendedWaitUntil:
    visible:
      id: "quiz-level-select-back"
    timeout: 20000
- assertVisible:
    id: "quiz-level-select-back"
- tapOn:
    id: "quiz-level-select-back"
- extendedWaitUntil:
    visible:
      id: "home-quick-quizzes"
    timeout: 15000
