<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phraseman · Полный реестр функций</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f6f8fb;--line:#dfe5ee;--muted:#657086;--lime:#b7e35b;--ink:#07110a}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px}.top a,button{min-height:42px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#172033;padding:0 13px;text-decoration:none;cursor:pointer}.top a.primary{background:var(--lime);border-color:#8eaf2f;color:var(--ink);font-weight:700}.wrap{max-width:1500px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h1{margin:0 0 8px}.muted{color:var(--muted)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.controls input,.controls select{height:42px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fff}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.pill{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.group{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.group h2{font-size:17px;margin:0 0 10px}.row{display:flex;gap:10px;justify-content:space-between;border-top:1px solid #edf0f5;padding:11px 0;align-items:center}.row:first-of-type{border-top:0}.row b{font-size:13px}.row small{display:block;color:var(--muted);margin-top:4px;max-width:540px}.status{font-size:11px;border-radius:999px;padding:5px 8px;background:#eef3f8;white-space:nowrap}.status.inventory{background:#fff5df;color:#986514}.legacy{font-size:12px}.empty{padding:30px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:13px}@media(max-width:800px){.groups{grid-template-columns:1fr}.wrap{padding:18px}.head{display:block}.head .primary{display:inline-block;margin-top:16px}}
</style></head><body><header class="top"><strong>Phraseman Admin · Полный реестр</strong><a class="primary" href="./index.html#diagnostics">Назад в диагностику</a></header><main class="wrap"><div class="head"><div><h1>Все функции текущей админки</h1><p class="muted">441 кнопка и 936 функций из legacy inventory. Здесь видно, что уже перенесено, что guarded, а что ещё ждёт native migration.</p></div></div><div class="controls"><input id="search" aria-label="Поиск функции" placeholder="Поиск по названию, кнопке или вкладке"><select id="route"><option value="">Все 7 разделов</option></select><select id="status"><option value="">Все статусы</option><option value="inventory">Inventory</option><option value="guarded">Guarded</option><option value="ported">Ported</option><option value="fallback">Fallback</option><option value="blocked">Blocked</option></select></div><div id="summary" class="summary"></div><div id="groups" class="groups" aria-live="polite"><div class="empty">Загружаем coverage board…</div></div></main><script>
const state={board:null};const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function boot(){try{state.board=await (await fetch('../../docs/admin/ADMIN_V2_MIGRATION_COVERAGE.json',{cache:'no-store'})).json();$('route').innerHTML='<option value="">Все 7 разделов</option>'+state.board.routes.map(route=>`<option value="${esc(route)}">${esc(route)}</option>`).join('');render();}catch{$('groups').innerHTML='<div class="empty">Coverage board не загрузился. Проверьте доступ к docs/admin.</div>';}}
function render(){const q=$('search').value.toLowerCase().trim(),route=$('route').value,status=$('status').value;const rows=state.board.buttonCoverage.filter(row=>{const hay=JSON.stringify(row).toLowerCase();return(!q||hay.includes(q))&&(!route||row.target.route===route)&&(!status||row.status===status)});const by=new Map();rows.forEach(row=>{const key=row.target.route;(by.get(key)||by.set(key,[]).get(key)).push(row)});$('summary').innerHTML=[`<span class="pill">Показано: <b>${rows.length}</b></span>`,`<span class="pill">Всего кнопок: <b>${state.board.source.buttons}</b></span>`,`<span class="pill">Всего функций: <b>${state.board.source.functions}</b></span>`].join('');if(!rows.length){$('groups').innerHTML='<div class="empty">Ничего не найдено по текущему фильтру.</div>';return}$('groups').innerHTML=[...by.entries()].map(([route,items])=>`<section class="group"><h2>${esc(route)} <span class="muted">· ${items.length}</span></h2>${items.map(row=>`<div class="row"><div><b>${esc(row.legacy.text||row.legacy.id||'Без подписи')}</b><small>${esc(row.legacy.tab)} · строка ${row.legacy.line} · ${esc(row.target.permission)}</small></div><span><span class="status ${esc(row.status)}">${esc(row.status)}</span> <a class="legacy" href="../../admin/index.html#${encodeURIComponent(row.legacy.tab)}" target="_blank" rel="noreferrer" title="Открыть рабочий legacy fallback">Открыть</a></span></div>`).join('')}</section>`).join('')}
['search','route','status'].forEach(id=>$(id).addEventListener('input',render));boot();
</script></body></html>
