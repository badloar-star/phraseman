name: Deploy audited English Level Test (PR 15)

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: english-level-test-pr15-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/english-level-test-20260721' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FIREBASE_PROJECT_ID: phraseman-ea0b3

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Detect completed release
        id: release-state
        shell: bash
        run: |
          if [[ -f .english-test-release-complete ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Release marker already exists; this follow-up run is intentionally skipped.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 22
        if: steps.release-state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialise audited release payload
        if: steps.release-state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          count="$(find .english-test-bootstrap -maxdepth 1 -type f -name 'payload.part*' | wc -l | tr -d ' ')"
          test "$count" = '12'
          for n in $(seq -w 0 11); do
            test -s ".english-test-bootstrap/payload.part$n"
            wc -c ".english-test-bootstrap/payload.part$n"
            sha256sum ".english-test-bootstrap/payload.part$n"
          done
          cat .english-test-bootstrap/payload.part* > "$RUNNER_TEMP/english-test-release.b64"
          base64 --decode "$RUNNER_TEMP/english-test-release.b64" > "$RUNNER_TEMP/english-test-release.tar.gz"
          actual_sha="$(sha256sum "$RUNNER_TEMP/english-test-release.tar.gz" | awk '{print $1}')"
          echo "Archive SHA-256: $actual_sha"
          test "$actual_sha" = 'eea07f5efba6bfbc4ffdd919ddc4e448129e9907ac21aaf2b01f3b4964be38a5'
          gzip --test "$RUNNER_TEMP/english-test-release.tar.gz"
          tar -tzf "$RUNNER_TEMP/english-test-release.tar.gz" > "$RUNNER_TEMP/english-test-release-files.txt"
          sed -n '1,120p' "$RUNNER_TEMP/english-test-release-files.txt"
          tar -xzf "$RUNNER_TEMP/english-test-release.tar.gz" -C .
          test -s functions-english-test/index.js
          test -s knowly-www/english-level-test/index.html
          test -s admin/v2/english-test.html

      - name: Integrate test with Firebase Hosting and navigation
        if: steps.release-state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          function read(file) { return fs.readFileSync(file, 'utf8'); }
          function write(file, value) { fs.writeFileSync(file, value, 'utf8'); }
          function writeJson(file, value) { write(file, `${JSON.stringify(value, null, 2)}\n`); }
          function insertOnce(file, marker, insertion, sentinel) {
            let text = read(file);
            if (text.includes(sentinel)) return;
            const index = text.indexOf(marker);
            if (index < 0) throw new Error(`Integration marker not found in ${file}: ${marker}`);
            if (text.indexOf(marker, index + marker.length) >= 0) throw new Error(`Ambiguous integration marker in ${file}: ${marker}`);
            text = text.slice(0, index) + insertion + text.slice(index);
            write(file, text);
          }

          const firebase = JSON.parse(read('firebase.json'));
          const currentFunctions = Array.isArray(firebase.functions)
            ? firebase.functions
            : firebase.functions ? [firebase.functions] : [];
          const functions = currentFunctions.map((entry, index) => ({
            ...entry,
            ...(entry.codebase ? {} : { codebase: index === 0 ? 'default' : `codebase-${index}` }),
          }));
          if (!functions.some((entry) => entry.codebase === 'english-test')) {
            functions.push({
              source: 'functions-english-test',
              codebase: 'english-test',
              runtime: 'nodejs22',
              ignore: ['node_modules', '.git', 'firebase-debug.log', 'firebase-debug.*.log'],
            });
          }
          firebase.functions = functions;
          const publicHosting = Array.isArray(firebase.hosting)
            ? firebase.hosting.find((entry) => entry && entry.target === 'knowlywww')
            : null;
          if (!publicHosting) throw new Error('Firebase hosting target knowlywww is missing');
          publicHosting.rewrites ||= [];
          if (!publicHosting.rewrites.some((entry) => entry && entry.source === '/api/english-test')) {
            publicHosting.rewrites.unshift({
              source: '/api/english-test',
              function: { functionId: 'englishTestApi', region: 'us-central1' },
            });
          }
          writeJson('firebase.json', firebase);

          const pkg = JSON.parse(read('package.json'));
          pkg.scripts ||= {};
          Object.assign(pkg.scripts, {
            'english-test:generate': 'node scripts/generate_english_test_assets.mjs',
            'english-test:audit-bank': 'python3 scripts/audit_english_test_bank.py content/english-test/questions.en.json',
            'english-test:check': 'node scripts/generate_english_test_assets.mjs --check && python3 scripts/audit_english_test_bank.py content/english-test/questions.en.json && node --test tests/english_test_release.test.mjs',
            'english-test:functions:install': 'npm install --prefix functions-english-test',
            'english-test:deploy:functions': 'npx firebase-tools deploy --project phraseman-ea0b3 --only functions:english-test --non-interactive',
            'english-test:deploy:hosting': 'npx firebase-tools deploy --project phraseman-ea0b3 --only hosting:knowlywww,hosting:admin --non-interactive',
            'english-test:deploy': 'npx firebase-tools deploy --project phraseman-ea0b3 --only functions:english-test,hosting:knowlywww,hosting:admin --non-interactive',
          });
          writeJson('package.json', pkg);

          insertOnce(
            'admin/v2/index.html',
            '        <a href="#monthly" title="Ежемесячный пакет решений">Пакет решений</a>\n',
            '        <a href="/v2/english-test.html" title="Аналитика веб‑теста английского">Веб‑тест</a>\n',
            'href="/v2/english-test.html"',
          );
          insertOnce(
            'knowly-www/index.html',
            '        <a href="/guides/">Гайды</a>\n',
            '        <a href="/english-level-test/">Тест уровня</a>\n',
            'href="/english-level-test/"',
          );
          insertOnce(
            'knowly-www/sitemap.xml',
            '  <url>\n    <loc>https://knowlyapps.com/guides/</loc>',
            '  <url>\n    <loc>https://knowlyapps.com/english-level-test/</loc>\n    <lastmod>2026-07-21</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.9</priority>\n  </url>\n',
            'https://knowlyapps.com/english-level-test/',
          );

          const privacyFile = 'knowly-www/legal/privacy/index.html';
          let privacy = read(privacyFile).replaceAll('July 1, 2026', 'July 21, 2026');
          const privacySentinel = '<h2>10A. Website English Level Check</h2>';
          if (!privacy.includes(privacySentinel)) {
            const marker = '        <h2>11. AI features and OpenAI processing</h2>';
            if (!privacy.includes(marker)) throw new Error('Privacy policy section 11 marker not found');
            const section = `        <h2>10A. Website English Level Check</h2>\n        <p>The optional English Level Check on Knowly website pages can run entirely in the browser. If you leave anonymous analytics disabled, answers, the estimated level, and the certificate name are not sent to Knowly.</p>\n        <p>If you expressly enable anonymous test analytics, we process a random browser identifier, an anonymous attempt identifier, coarse campaign/referrer and device categories, question identifiers, selected option numbers, correctness calculated by the server, response-time ranges, progress and abandonment position, estimated CEFR level, certificate actions without the certificate name, and share-button channels. We do not link this website test to the Phraseman App account.</p>\n        <p>Detailed anonymous attempts are scheduled for deletion after 180 days. Hashed random-browser counters and daily aggregates are scheduled for deletion after 400 days. Rate-limit records based on a one-way truncated IP hash are short-lived. The name typed onto a certificate is rendered locally and is not included in analytics or the admin response.</p>\n\n`;
            privacy = privacy.replace(marker, section + marker);
          }
          write(privacyFile, privacy);
          NODE

      - name: Generate, audit and test release
        if: steps.release-state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate_english_test_assets.mjs
          node scripts/generate_english_test_assets.mjs --check
          python3 scripts/audit_english_test_bank.py content/english-test/questions.en.json
          npm install --prefix functions-english-test --package-lock-only --ignore-scripts
          npm ci --prefix functions-english-test --omit=dev --ignore-scripts
          node --check functions-english-test/index.js
          node --check functions-english-test/engine.js
          node --check functions-english-test/analytics.js
          node --check knowly-www/english-level-test/app.js
          node --check knowly-www/english-level-test/engine.js
          node --check knowly-www/english-level-test/certificate.js
          node --test tests/english_test_release.test.mjs
          npm audit --prefix functions-english-test --omit=dev

      - name: Discover Firebase deployment credential
        if: steps.release-state.outputs.skip != 'true'
        id: firebase-auth
        env:
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          REPO_VARS_JSON: ${{ toJSON(vars) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, sys
          from pathlib import Path
          def read_json_env(name):
              raw = os.environ.get(name, '').strip()
              if not raw: return {}
              try: data = json.loads(raw)
              except json.JSONDecodeError: return {}
              return data if isinstance(data, dict) else {}
          secrets = read_json_env('REPO_SECRETS_JSON')
          variables = read_json_env('REPO_VARS_JSON')
          relevant = sorted(key for key, value in secrets.items() if value and re.search(r'FIREBASE|GOOGLE|GCLOUD|GCP|CLOUD|WORKLOAD|SERVICE_ACCOUNT', key, re.I))
          print('Non-empty cloud/deploy secret keys:', ', '.join(relevant) if relevant else '(none)')
          def decoded_candidates(value):
              yield value
              compact = ''.join(value.split())
              try: yield base64.b64decode(compact, validate=True).decode('utf-8')
              except Exception: return
          cred_path = Path(os.environ['RUNNER_TEMP']) / 'firebase-deployment-credential.json'
          for key, value in secrets.items():
              if not value: continue
              for candidate in decoded_candidates(str(value)):
                  try: data = json.loads(candidate)
                  except Exception: continue
                  if not isinstance(data, dict): continue
                  cred_type = data.get('type')
                  project = data.get('project_id') or data.get('quota_project_id')
                  if cred_type in {'service_account', 'external_account', 'authorized_user'} and (not project or project == 'phraseman-ea0b3'):
                      cred_path.write_text(candidate, encoding='utf-8')
                      with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file: env_file.write(f'GOOGLE_APPLICATION_CREDENTIALS={cred_path}\n')
                      with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out_file: out_file.write('mode=adc\n')
                      print(f'Using Google credential from secret {key} ({cred_type}).')
                      sys.exit(0)
          for key, value in secrets.items():
              if value and re.search(r'FIREBASE.*TOKEN|TOKEN.*FIREBASE', key, re.I):
                  print(f'::add-mask::{value}')
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file: env_file.write(f'FIREBASE_DEPLOY_TOKEN={value}\n')
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out_file: out_file.write('mode=token\n')
                  print(f'Using Firebase CI token from secret {key}.')
                  sys.exit(0)
          merged = {**variables, **secrets}
          provider = next((str(v) for k, v in merged.items() if v and re.search(r'WORKLOAD.*IDENTITY.*PROVIDER|WIF.*PROVIDER', k, re.I)), '')
          account = next((str(v) for k, v in merged.items() if v and re.search(r'(WORKLOAD|WIF|DEPLOY).*SERVICE.*ACCOUNT|SERVICE.*ACCOUNT.*EMAIL', k, re.I)), '')
          if provider and account:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file: env_file.write(f'WIF_PROVIDER={provider}\nWIF_SERVICE_ACCOUNT={account}\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out_file: out_file.write('mode=wif\n')
              print('Using Workload Identity Federation configuration.')
              sys.exit(0)
          print('No Firebase/Google deployment credential exists in repository secrets or variables.', file=sys.stderr)
          sys.exit(31)
          PY

      - name: Authenticate with Google through Workload Identity
        if: steps.release-state.outputs.skip != 'true' && steps.firebase-auth.outputs.mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy isolated Functions codebase and both Hosting targets
        if: steps.release-state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(deploy --project "$FIREBASE_PROJECT_ID" --only 'functions:english-test,hosting:knowlywww,hosting:admin' --non-interactive)
          if [[ "${{ steps.firebase-auth.outputs.mode }}" == 'token' ]]; then
            args+=(--token "$FIREBASE_DEPLOY_TOKEN")
          fi
          npx --yes firebase-tools@15.24.0 "${args[@]}"

      - name: Verify production pages and API
        if: steps.release-state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local url="$1" marker="$2"
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --location --max-time 25 "$url" -o /tmp/page.html && grep --fixed-strings --quiet "$marker" /tmp/page.html; then
                echo "Verified: $url"
                return 0
              fi
              sleep 5
            done
            echo "Production verification failed: $url" >&2
            return 1
          }
          verify_page 'https://knowlyapps.web.app/english-level-test/' 'English Level Check'
          verify_page 'https://knowlyapps.com/english-level-test/' 'English Level Check'
          verify_page 'https://phraseman-ea0b3.web.app/v2/english-test.html' 'Аналитика веб-теста'
          curl --fail --silent --show-error --location --max-time 25 'https://knowlyapps.com/api/english-test' -o /tmp/api.json || true

      - name: Commit materialised audited source after successful deploy
        if: steps.release-state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .english-test-bootstrap functions-english-test/node_modules
          rm -f .github/workflows/bootstrap-english-test-release.yml
          printf 'deployed=%s\nsource_commit=%s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > .english-test-release-complete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: deploy audited English level test [skip ci]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload diagnostics on failure
        if: failure() && steps.release-state.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: english-test-pr15-release-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/english-test-release.b64
            ${{ runner.temp }}/english-test-release.tar.gz
            ${{ runner.temp }}/english-test-release-files.txt
            /tmp/api.json
          if-no-files-found: ignore
          retention-days: 2
