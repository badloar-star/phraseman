<!doctype html>
<html lang="ru" data-pktheme="graphite-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhraseMan — удобства: как сейчас и как будет</title>
<style>
/* Токены — реальные значения тем graphite / ink × dark / light (как в ux_delight_demo.html, из constants/liquidGlassThemePalette, calm). */
:root, [data-pktheme="graphite-dark"]{--bg:#0C0D10;--bgTop:#181A1F;--text:#FFFFFF;--sec:#B8B9BD;--card:#151517;--ctrl:#222429;--sheet:#222429;--cta:#F2F1F6;--ctaInk:#0B0C0E;--scrim:rgba(0,0,0,.60);--btn:#4A4B50;--ok:#47C870;--bad:#F05454;--skel:rgba(255,255,255,.08);color-scheme:dark}
[data-pktheme="graphite-light"]{--bg:#EDF0F4;--bgTop:#F5F7FA;--text:#16191C;--sec:#575B60;--card:#FEFEFF;--ctrl:#DFE3E8;--sheet:#FBFCFD;--cta:#182029;--ctaInk:#FFFFFF;--scrim:rgba(20,22,28,.45);--btn:#B3B7BB;--ok:#2E9E55;--bad:#D23C3C;--skel:rgba(0,0,0,.07);color-scheme:light}
[data-pktheme="ink-dark"]{--bg:#030408;--bgTop:#0A0C14;--text:#F9FAFE;--sec:#C1C4CF;--card:#090B13;--ctrl:#1C1F2A;--sheet:#0F111A;--cta:#DFE4F8;--ctaInk:#04050C;--scrim:rgba(0,0,0,.60);--btn:#3B3E48;--ok:#47C870;--bad:#F05454;--skel:rgba(255,255,255,.08);color-scheme:dark}
[data-pktheme="ink-light"]{--bg:#EFEFF6;--bgTop:#F6F6FB;--text:#17181E;--sec:#595A63;--card:#FEFEFF;--ctrl:#E1E2EA;--sheet:#FBFBFE;--cta:#1D1D2F;--ctaInk:#FFFFFF;--scrim:rgba(20,22,28,.45);--btn:#B5B6BD;--ok:#2E9E55;--bad:#D23C3C;--skel:rgba(0,0,0,.07);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif}
body{padding:0 16px 48px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:var(--text)}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;background:linear-gradient(var(--bg) 78%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:18px;background:var(--ctrl);color:var(--text);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--cta);color:var(--ctaInk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;max-width:1240px;margin:6px auto 0}
.demo{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.demo h2{margin:0;font-size:17px;font-weight:700}
.seg{display:flex;background:var(--ctrl);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:15px;color:var(--sec);transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--cta);color:var(--ctaInk)}
.hint{margin:0;color:var(--sec);font-size:15px}
.screen{position:relative;height:420px;border-radius:18px;overflow:hidden;background:linear-gradient(var(--bgTop),var(--bg) 60%);padding:14px;display:flex;flex-direction:column;gap:12px}
.btn{min-height:50px;border-radius:15px;background:var(--cta);color:var(--ctaInk);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 18px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.86}
.btn.sec{background:var(--ctrl);color:var(--text)}
.tile{background:var(--ctrl);border-radius:14px;min-height:52px;display:flex;align-items:center;padding:0 14px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.sub{color:var(--sec);font-size:15px}
.ico{width:24px;height:24px;flex:none}
.grow{flex:1;min-width:0}
.toast{position:absolute;left:14px;right:14px;top:14px;z-index:30;background:var(--sheet);border-radius:14px;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(-12px);pointer-events:none;transition:opacity .2s,transform .22s cubic-bezier(.2,.8,.2,1)}
.toast.show{opacity:1;transform:none}
.dotok{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.tabs{display:flex;background:var(--ctrl);border-radius:20px;padding:4px;margin-top:auto}
.tabs button{flex:1;min-height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--sec);transition:transform .12s}
.tabs button:active{transform:scale(.94)}
.tabs button[aria-current="true"]{background:var(--cta);color:var(--ctaInk)}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.menu{position:absolute;z-index:25;background:var(--sheet);border-radius:18px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.35);min-width:220px;animation:pop .18s cubic-bezier(.2,.8,.2,1) both;transform-origin:top left}
.menu button{width:100%;min-height:48px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:12px;font-weight:600;text-align:left}
.menu button:active{background:var(--ctrl)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.scrimx{position:absolute;inset:0;z-index:24;background:var(--scrim)}
.field{background:var(--ctrl);border-radius:14px;min-height:54px;padding:0 14px;border:0;width:100%;outline:none;font-size:17px}
.field:focus{box-shadow:0 0 0 2px var(--cta)}
.bub{max-width:82%;padding:12px 14px;border-radius:18px;font-weight:500;font-size:16px;user-select:none;-webkit-user-select:none}
.bub.bot{align-self:flex-start;background:var(--ctrl);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--cta);color:var(--ctaInk);border-bottom-right-radius:5px}
.bub.hold{transform:scale(1.03);transition:transform .45s}
.chipx{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;background:var(--ctrl);font-weight:700;align-self:flex-start;animation:pop .2s both}
.chipx.cta{background:var(--cta);color:var(--ctaInk)}
.wave{display:flex;gap:3px;align-items:center;height:24px}
.wave i{width:4px;border-radius:2px;background:currentColor;animation:wv .5s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}
@keyframes wv{from{height:6px}to{height:22px}}
.vid{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--btn),var(--ctrl));aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.vbar{height:8px;border-radius:4px;background:var(--ctrl);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--cta)}
.phone{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;align-content:start;padding-top:20px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:var(--sec);user-select:none;-webkit-user-select:none}
.app i{width:58px;height:58px;border-radius:16px;background:var(--ctrl);display:block;transition:transform .15s}
.app.me i{background:var(--cta);color:var(--ctaInk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;font-style:normal}
.app.held i{transform:scale(1.1)}
.prog{height:6px;border-radius:3px;background:var(--ctrl);overflow:hidden}.prog i{display:block;height:100%;background:var(--cta);transition:width .25s}
@media (prefers-reduced-motion: reduce){.menu,.chipx,.toast,.btn,.bub.hold{animation:none;transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="chips" id="themes" role="group" aria-label="Тема">
    <button class="chip" data-t="graphite-dark" aria-pressed="true">Графит · тёмная</button>
    <button class="chip" data-t="graphite-light" aria-pressed="false">Графит · светлая</button>
    <button class="chip" data-t="ink-dark" aria-pressed="false">Чернила · тёмная</button>
    <button class="chip" data-t="ink-light" aria-pressed="false">Чернила · светлая</button>
  </div>
</header>
<main class="grid" id="grid"></main>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var root=document.documentElement;
function svg(p,extra){return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '+(extra||'')+'>'+p+'</svg>'}
var I={
 home:svg('<path d="M4 11l8-7 8 7v9H4z"/>'),play:svg('<circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor"/>'),
 users:svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6M16 5a3.5 3.5 0 0 1 0 7M18 14c2.4.6 3.5 2.6 3.5 6"/>'),
 gear:svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'),
 book:svg('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>'),
 spk:svg('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>'),
 search:svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>'),
 plus:svg('<path d="M12 5v14M5 12h14"/>'),
 copy:svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
 share:svg('<path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>'),
 turtle:svg('<path d="M3 15c0-4 3.5-7 8-7s7 3 7 7zM18 12c1.5 0 3 .8 3 2.2M7 15v3M14 15v3"/>'),
 card:svg('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 9v6M9 12h6"/>'),
 back10:svg('<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/>'),
 retry:svg('<path d="M3 12a9 9 0 0 1 15.5-6.2M21 4v5h-5M21 12a9 9 0 0 1-15.5 6.2M3 20v-5h5"/>'),
 tick:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
 trash:svg('<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'),
 info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>'),
 next:svg('<path d="M5 12h14M13 6l6 6-6 6"/>')
};
var themes=$$('#themes .chip');
themes.forEach(function(b){b.addEventListener('click',function(){root.setAttribute('data-pktheme',b.dataset.t);themes.forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});

function demo(title,hint,render){
  var el=document.createElement('section');el.className='demo';
  el.innerHTML='<h2>'+title+'</h2><div class="seg" role="group"><button data-m="before" aria-pressed="true">Как сейчас</button><button data-m="after" aria-pressed="false">Как будет</button></div><p class="hint">'+hint+'</p><div class="screen"></div><div class="reset"></div>';
  $('#grid').appendChild(el);
  var scr=$('.screen',el),seg=$$('.seg button',el),mode='before',timers=[];
  var api={scr:scr,after:function(){return mode==='after'},later:function(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t},
    toast:function(txt){var t=$('.toast',scr);if(!t){t=document.createElement('div');t.className='toast';scr.appendChild(t)}t.innerHTML='<span class="dotok"></span>'+txt;t.classList.add('show');clearTimeout(api._tt);api._tt=setTimeout(function(){t.classList.remove('show')},1600)},
    redraw:function(){timers.forEach(clearTimeout);timers=[];scr.innerHTML='';render(api,scr)}};
  seg.forEach(function(b){b.addEventListener('click',function(){mode=b.dataset.m;seg.forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});api.redraw()})});
  api.redraw();return api;
}
function hold(el,ms,onHold,onTap){var t=null,done=false;
  el.addEventListener('pointerdown',function(e){done=false;el.classList.add('held');t=setTimeout(function(){done=true;el.classList.remove('held');onHold(e)},ms)});
  function up(){clearTimeout(t);el.classList.remove('held');}
  el.addEventListener('pointerup',function(){var d=done;up();if(!d&&onTap)onTap()});
  el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up);el.addEventListener('contextmenu',function(e){e.preventDefault()})}
function tabbar(active){return '<div class="tabs"><button aria-label="Главная">'+I.home+'</button><button aria-label="Уроки" '+(active==='lessons'?'aria-current="true"':'')+' data-lessons>'+I.book+'</button><button aria-label="Видео">'+I.play+'</button><button aria-label="Сообщество">'+I.users+'</button></div>'}

/* 1 — повторный тап по вкладке → наверх */
demo('1 · Повторное нажатие на вкладку','Лента уже прокручена вниз. Нажми на «Уроки» в нижней панели.',function(api,scr){
  var rows='';for(var i=1;i<=24;i++)rows+='<div class="tile">Урок '+i+'</div>';
  scr.innerHTML='<div class="list">'+rows+'</div>'+tabbar('lessons');
  var l=$('.list',scr);l.scrollTop=420;
  $('[data-lessons]',scr).addEventListener('click',function(){if(api.after())l.scrollTo({top:0,behavior:'smooth'})});
});

/* 2 — второе нажатие на звук → медленнее */
demo('2 · Второе нажатие на динамик','Нажми на динамик, потом сразу ещё раз.',function(api,scr){
  scr.innerHTML='<div class="tile" style="min-height:96px;font-size:20px;gap:12px"><span class="grow">How are you doing?</span><button class="btn sec" data-spk style="min-height:56px;width:56px;padding:0;border-radius:28px" aria-label="Озвучить">'+I.spk+'</button></div><div data-out style="min-height:60px"></div>';
  var out=$('[data-out]',scr),last=0,tm;
  $('[data-spk]',scr).addEventListener('click',function(){
    var now=Date.now(),slow=api.after()&&now-last<3000;last=now;
    out.innerHTML='<div class="chipx'+(slow?' cta':'')+'"><span class="wave" style="'+(slow?'animation-duration:1s':'')+'"><i></i><i></i><i></i><i></i></span>'+(slow?I.turtle+' Медленнее · 0,7×':'Обычная скорость · 1×')+'</div>';
    clearTimeout(tm);tm=setTimeout(function(){out.innerHTML=''},2200);});
});

/* 3 — видимая лупа */
demo('3 · Поиск наборов','Попробуй найти поиск.',function(api,scr){
  var head='<div class="row"><b style="font-size:22px" class="grow">Наборы</b>'+(api.after()?'<button class="btn sec" data-find style="min-height:48px;width:48px;padding:0;border-radius:24px" aria-label="Поиск">'+I.search+'</button>':'')+'<button class="btn" data-plus style="min-height:48px;width:48px;padding:0;border-radius:24px" aria-label="Создать">'+I.plus+'</button></div><div data-slot></div>';
  var rows='';['Еда и кафе','В аэропорту','Работа','Путешествия','Семья','Здоровье'].forEach(function(n){rows+='<div class="tile">'+n+'</div>'});
  scr.innerHTML=head+'<div class="list">'+rows+'</div>';
  var slot=$('[data-slot]',scr);
  function search(){slot.innerHTML='<input class="field" placeholder="Название набора" autofocus>';$('input',slot).focus()}
  if(api.after())$('[data-find]',scr).addEventListener('click',search);
  hold($('[data-plus]',scr),600,function(){var m=document.createElement('div');m.className='menu';m.style.right='14px';m.style.top='66px';m.style.transformOrigin='top right';
    m.innerHTML='<button data-s>'+I.search+'Поиск</button><button>'+I.info+'Сортировка</button>';scr.appendChild(m);
    var close=function(){m.remove();scr.removeEventListener('pointerdown',away,true)};var away=function(e){if(!m.contains(e.target))close()};
    scr.addEventListener('pointerdown',away,true);$('[data-s]',m).addEventListener('click',function(){close();search()});},function(){api.toast('Создание набора')});
});

/* 4 — сохранить и ещё одну */
demo('4 · Редактор карточки','Добавь несколько слов подряд.',function(api,scr){
  var n=0;
  scr.innerHTML='<input class="field" data-w placeholder="Слово"><input class="field" data-t placeholder="Перевод"><div class="chipx" data-cnt style="display:none"></div><div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">'+(api.after()?'<button class="btn" data-more>Сохранить и ещё одну</button><button class="btn sec" data-save>Сохранить</button>':'<button class="btn" data-save>Сохранить</button>')+'</div>';
  var w=$('[data-w]',scr),t=$('[data-t]',scr),c=$('[data-cnt]',scr);
  function ok(){if(!w.value.trim()){w.focus();api.toast('Впиши слово');return false}n++;return true}
  var more=$('[data-more]',scr);if(more)more.addEventListener('click',function(){if(!ok())return;w.value='';t.value='';w.focus();c.style.display='inline-flex';c.innerHTML=I.tick+'Добавлено: '+n;api.toast('Карточка сохранена')});
  $('[data-save]',scr).addEventListener('click',function(){if(!ok())return;scr.innerHTML='<div class="tile">Коллекция · '+n+' нов.</div><div class="list"><div class="tile">'+w.value+'</div></div><button class="btn" data-again>+ Новая карточка</button>';$('[data-again]',scr).addEventListener('click',function(){api.redraw()})});
});

/* 5 — тренировка запоминает настройки */
demo('5 · Настройки тренировки','Поменяй настройки, закрой экран и открой снова.',function(api,scr){
  var cfg=api._cfg||{n:20,s:60,d:'на язык'};if(!api.after())cfg={n:20,s:60,d:'на язык'};
  function opts(k,vals){return '<div class="seg" style="width:100%">'+vals.map(function(v){return '<button data-k="'+k+'" data-v="'+v+'" aria-pressed="'+(String(cfg[k])===String(v))+'">'+v+'</button>'}).join('')+'</div>'}
  scr.innerHTML='<b>Карточек</b>'+opts('n',[10,20,30])+'<b>Секунд на карточку</b>'+opts('s',[30,60,90])+'<b>Направление</b>'+opts('d',['на язык','с языка'])+'<button class="btn" style="margin-top:auto" data-go>Начать</button>';
  $$('[data-k]',scr).forEach(function(b){b.addEventListener('click',function(){cfg[b.dataset.k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;if(api.after())api._cfg=cfg;$$('[data-k="'+b.dataset.k+'"]',scr).forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
  $('[data-go]',scr).addEventListener('click',function(){scr.innerHTML='<div class="tile" style="min-height:120px;font-size:22px;justify-content:center">Тренировка: '+cfg.n+' · '+cfg.s+' с · '+cfg.d+'</div>'});
  var r=$('.reset',scr.parentNode);r.innerHTML='<button class="btn sec" style="width:100%">Закрыть и открыть снова</button>';$('button',r).onclick=function(){api.redraw()};
});

/* 6 — долгое нажатие на реплику */
demo('6 · Реплика в диалоге','Нажми на реплику собеседника и подержи.',function(api,scr){
  scr.innerHTML='<div class="bub bot" data-b style="margin-top:20px">Could you tell me where the station is?</div><div class="bub me">Sure, it is on the left.</div>';
  hold($('[data-b]',scr),api.after()?450:99999,function(){var m=document.createElement('div');m.className='menu';m.style.left='14px';m.style.top='120px';
    m.innerHTML='<button data-a="Скопировано">'+I.copy+'Копировать</button><button data-a="Отправлено">'+I.share+'Поделиться</button><button data-a="Озвучено медленно">'+I.turtle+'Медленно</button><button data-a="Сохранено в карточки">'+I.card+'В карточки</button>';
    var s=document.createElement('div');s.className='scrimx';s.style.background='transparent';scr.appendChild(s);scr.appendChild(m);
    var close=function(){m.remove();s.remove()};s.addEventListener('pointerdown',close);
    $$('[data-a]',m).forEach(function(b){b.addEventListener('click',function(){close();api.toast(b.dataset.a)})});});
});

/* 7 — итог урока */
demo('7 · Итог урока','Это экран после урока. Нажми кнопку.',function(api,scr){
  scr.innerHTML='<div style="margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:84px;height:84px;border-radius:42px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center">'+I.tick.replace('class="ico"','style="width:44px;height:44px" class="ico"')+'</div><b style="font-size:24px">Урок пройден</b><span class="sub">3 ошибки</span></div><div style="display:flex;flex-direction:column;gap:10px">'+(api.after()?'<button class="btn" data-n>Дальше: урок 8 '+I.next+'</button><button class="btn sec" data-n="Ошибки из урока 7">'+I.retry+'&nbsp;Повторить мои ошибки · 3</button><button class="btn sec" data-n="Главная">На главную</button>':'<button class="btn" data-n="Главная">На главную</button><button class="btn sec" data-n="Поделиться">Поделиться</button>')+'</div>';
  $$('[data-n]',scr).forEach(function(b){b.addEventListener('click',function(){api.toast(b.dataset.n||'Урок 8')})});
});

/* 8 — подсказка на Главной */
demo('8 · Главная: повторить слова','Нажми на «Продолжить» или на подсказку.',function(api,scr){
  scr.innerHTML='<b style="font-size:24px">Главная</b><button class="btn" data-c style="min-height:72px;font-size:19px">Продолжить урок 8</button>'+(api.after()?'<button class="chipx cta" data-r style="min-height:52px;font-size:16px">'+I.retry+'Повторить 12 слов · 2 мин</button>':'')+'<div class="tile">Серия: 5 дней</div>';
  $('[data-c]',scr).addEventListener('click',function(){api.toast('Урок 8')});
  var r=$('[data-r]',scr);if(r)r.addEventListener('click',function(){var n=1;scr.innerHTML='<div class="prog"><i style="width:8%"></i></div><div class="tile" style="min-height:140px;font-size:26px;justify-content:center" data-w>Слово 1 из 12</div><button class="btn" data-nx>Знаю</button>';
    $('[data-nx]',scr).addEventListener('click',function(){n++;if(n>12){api.redraw();api.toast('12 слов повторено');return}$('[data-w]',scr).textContent='Слово '+n+' из 12';$('.prog i',scr).style.width=Math.round(n/12*100)+'%'})});
});

/* 9 — видео */
demo('9 · Видео','Нажми на воспроизведение и пользуйся кнопками.',function(api,scr){
  var pos=222,speed=1,play=false,tm;
  function fmt(s){return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2)}
  scr.innerHTML=(api.after()?'<button class="chipx cta" data-res style="min-height:48px">'+I.play+'Продолжить с 3:42</button>':'')+'<div class="vid"><button class="btn" data-p style="width:64px;min-height:64px;padding:0;border-radius:32px">'+I.play+'</button></div><div class="vbar"><i data-b></i></div><div class="row" style="justify-content:space-between"><b data-t></b><span class="sub">10:00</span></div>'+(api.after()?'<div class="row"><button class="btn sec grow" data-bk>'+I.back10+'&nbsp;10 с</button><button class="btn sec grow" data-sp>1×</button></div>':'');
  function paint(){$('[data-b]',scr).style.width=pos/6+'%';$('[data-t]',scr).textContent=fmt(pos)}
  paint();
  $('[data-p]',scr).addEventListener('click',function(){play=!play;clearInterval(tm);if(play)tm=setInterval(function(){pos=Math.min(600,pos+speed);paint()},1000/ (api.after()?1:1));$('[data-p]',scr).innerHTML=play?svg('<path d="M8 5v14M16 5v14"/>'):I.play});
  var bk=$('[data-bk]',scr);if(bk)bk.addEventListener('click',function(){pos=Math.max(0,pos-10);paint()});
  var sp=$('[data-sp]',scr);if(sp)sp.addEventListener('click',function(){speed=speed===1?0.75:1;sp.textContent=speed===1?'1×':'0,75×'});
  var rs=$('[data-res]',scr);if(rs)rs.addEventListener('click',function(){pos=222;paint();rs.remove();api.toast('С 3:42')});
  api.later(function(){},0);
});

/* 10 — ярлыки на значке */
demo('10 · Значок приложения','Нажми на значок PhraseMan и подержи.',function(api,scr){
  var apps='';['Почта','Карты','Фото','Камера','Заметки','Часы'].forEach(function(n){apps+='<div class="app"><i></i>'+n+'</div>'});
  scr.innerHTML='<div class="phone"><div class="app me" data-me><i>P</i>PhraseMan</div>'+apps+'</div>';
  hold($('[data-me]',scr),450,function(){var m=document.createElement('div');m.className='menu';m.style.left='14px';m.style.top='150px';
    m.innerHTML=api.after()?'<button data-a="Урок 8">'+I.next+'Продолжить урок</button><button data-a="12 слов">'+I.retry+'Повторить слова</button><button data-a="Новая карточка">'+I.card+'Новая карточка</button>':'<button>'+I.info+'О приложении</button><button>'+I.trash+'Удалить значок</button>';
    var s=document.createElement('div');s.className='scrimx';s.style.background='transparent';scr.appendChild(s);scr.appendChild(m);
    var close=function(){m.remove();s.remove()};s.addEventListener('pointerdown',close);
    $$('[data-a]',m).forEach(function(b){b.addEventListener('click',function(){close();api.toast(b.dataset.a)})});});
});
})();
</script>
</body>
</html>
