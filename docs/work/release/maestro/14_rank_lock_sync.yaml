# зачем (координатор 05.11): когда панель и плитки Главной узнают о смене ранга — coinRank 0 → 3 → 0, кадр после каждой смены; строки [RANK-LOCK-SYNC] снимаются отдельно через adb logcat.
appId: app.phraseman
name: 14 rank lock sync
---
- launchApp:
    stopApp: true
- openLink: "exp+phraseman://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Today|Сегодня|Сьогодні|Пропустить|Пропустити|Skip|Start lesson 1|Continue lesson 1"
    timeout: 300000
- runFlow:
    file: _dev_state.yaml
    env:
      LINK: "onboarding=done&plus=off&newbie=on&uiLang=en&coinRank=0"
- tapOn:
    text: "Skip"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 01_rank0
- runFlow:
    file: _dev_state.yaml
    env:
      LINK: "coinRank=3"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02_rank3_after_home_link
- runFlow:
    file: _dev_state.yaml
    env:
      LINK: "coinRank=0"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03_rank0_again
