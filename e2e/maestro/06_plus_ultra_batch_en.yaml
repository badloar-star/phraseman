# зачем (координатор 17:00): пачка кадров вкладки Plus / dev-подписки / Ultra / Фразы дня одним прогоном, takeScreenshot на каждом шаге.
appId: app.phraseman
name: 06 Plus-вкладка, dev-подписка monthly/yearly, Фраза дня (en)
---
- runFlow: _prelude_home_en.yaml
- takeScreenshot: 01_home_before_plan
- tapOn:
    point: "85%,92%"
- waitForAnimationToEnd
- takeScreenshot: 02_plus_tab_top
- scroll
- scroll
- scroll
- takeScreenshot: 03_plus_tab_bottom
- openLink: "phraseman://dev_state?plan=monthly"
- extendedWaitUntil:
    visible: "DEV-STATE OK"
    timeout: 60000
- back
- waitForAnimationToEnd
- takeScreenshot: 04_home_plan_monthly
- openLink: "phraseman://dev_state?plan=yearly"
- extendedWaitUntil:
    visible: "DEV-STATE OK"
    timeout: 60000
- back
- waitForAnimationToEnd
- takeScreenshot: 05_home_plan_yearly_ultra
- tapOn: "Settings"
- waitForAnimationToEnd
- takeScreenshot: 06_settings_ultra
- tapOn:
    text: "Phrase of the day.*"
    optional: true
- takeScreenshot: 07_end
