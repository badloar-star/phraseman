<title>Плашка «Продолжить»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">
<style>
/* Раскладка: шапка-пульт (режим, тема, насыщенность) и шесть разделов-стилей; в каждом одни и те же восемь состояний карточки, как на Главной. */
:root{
  --font:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease-out:cubic-bezier(.2,1,.3,1);
  --ease-press:cubic-bezier(.3,1.4,.5,1);
  /* токены темы — их выставляет скрипт; здесь значения по умолчанию (Аврора, тёмная, «Акцент») */
  --bg:#0D0D10; --page-glow-a:rgba(56,224,170,.2); --page-glow-b:rgba(124,92,255,.2);
  --card:rgba(30,32,36,.78); --tile:#2B3230; --text:#F5F5F7; --sec:rgba(245,245,247,.66); --track:rgba(255,255,255,.12);
  --fill:#BDF5E2; --acc:#7EF0C8; --btn:#B3F3DD; --on-btn:#04261D; --ink:#BDF5E2;
  --shadow:0 18px 36px -10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35); --hi:inset 0 1px 0 rgba(255,255,255,.07);
  --f-a:#2E5C52; --f-b:#3F3A78; --on-f:#FFFFFF; --c-a:#35665C; --c-b:#453F85; --on-c:#FFFFFF;
  --g-a:#38E0AA; --g-b:#7C5CFF; --art-tint:#7EF0C8;
  --chrome:rgba(255,255,255,.07); --chrome-on:#F5F5F7;
  color-scheme:dark;
}
:root[data-mode=light]{ color-scheme:light; }
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{
  font:500 16px/1.35 var(--font); color:var(--text); background:var(--bg); min-height:100vh; position:relative; overflow-x:hidden;
  padding-block:28px 96px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background-color .3s ease,color .3s ease; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--page-bg)}
.wrap{max-width:1240px;margin:0 auto}

/* ───── пульт ───── */
.top{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:34px}
h1{font-size:clamp(26px,4.4vw,38px);font-weight:900;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.panel{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--chrome)}
.seg button{font:700 13px var(--font);height:36px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--sec);cursor:pointer;transition:background-color .2s,color .2s,transform .24s var(--ease-press)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--on-btn)}
.dots{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-radius:999px;background:var(--chrome)}
.dots button{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;background:var(--sw);box-shadow:0 0 0 0 var(--text);transition:transform .24s var(--ease-press),box-shadow .2s}
.dots button:active{transform:scale(.9)}
.dots button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px}
.nav a{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 6px;border-radius:999px;background:var(--chrome);color:var(--text);text-decoration:none;font:700 14px var(--font);transition:transform .24s var(--ease-press)}
.nav a:active{transform:scale(.96)}
.nav a b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--btn);color:var(--on-btn);font-weight:900;font-size:13px}

/* ───── раздел-стиль ───── */
.style{margin:0 0 56px;scroll-margin-top:20px}
.style>h2{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:900;letter-spacing:-.02em;margin:0 0 20px 2px}
.style>h2 b{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--btn);color:var(--on-btn);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:26px 22px}
.cell{display:flex;flex-direction:column;gap:9px;min-width:0}
.cell>small{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--sec);margin-left:6px}

/* ───── карточка: общее ───── */
.card{position:relative;width:100%;max-width:392px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .24s var(--ease-press),opacity .3s ease;color:var(--text)}
.card:active{transform:scale(.98)}
.card.busy{opacity:.72}
.card.busy .sheen{display:block}
.sheen{display:none;position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.sheen::after{content:"";position:absolute;top:0;bottom:0;width:46%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);animation:sheen 1.6s ease-in-out infinite}
@keyframes sheen{to{left:130%}}
.art{position:relative;aspect-ratio:1/1;flex:none}
.art i{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:contain}
.art .b{background-image:var(--art)}
/* арт «Продолжить» в ресурсах 3:2 с блокнотом справа; слои двигаются вместе, акцентная стрелка остаётся на листе */
.art.wide i{transform:scale(1.5) translateX(-23.5%)}
.art .a{background:var(--art-tint);-webkit-mask:var(--art-acc) center/contain no-repeat;mask:var(--art-acc) center/contain no-repeat}
.num{font-variant-numeric:tabular-nums}
.ttl{font-weight:800;letter-spacing:-.025em;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.kick{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.trk{height:6px;border-radius:3px;background:var(--track);overflow:hidden;flex:1;min-width:0}
.trk i{display:block;height:100%;border-radius:3px;background:var(--fill);width:calc(var(--p)*1%);transform-origin:left center}
.cnt{font-size:13px;font-weight:700;color:var(--sec);white-space:nowrap}
.sk{border-radius:8px;background:var(--track);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.12) 50%,transparent 80%);transform:translateX(-100%);animation:skl 1.5s ease-in-out infinite}
@keyframes skl{to{transform:translateX(100%)}}

/* ═══ A · Стекло: матовое стекло, свечение темы, арт выходит за верхний край ═══ */
.sA{border-radius:28px;min-height:112px;padding:16px 124px 16px 18px;display:flex;flex-direction:column;justify-content:center;gap:8px;background:var(--card);-webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);box-shadow:var(--shadow),var(--hi)}
.sA .glow{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.sA .glow::before{content:"";position:absolute;right:-46px;top:-60px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,var(--g-a) 0,transparent 68%);opacity:var(--glow-op)}
.sA .glow::after{content:"";position:absolute;left:-60px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--g-b) 0,transparent 70%);opacity:calc(var(--glow-op)*.55)}
.sA .art{position:absolute;right:8px;top:-16px;width:118px;transform:rotate(-6deg);filter:drop-shadow(0 14px 14px rgba(0,0,0,.34))}
.sA .kick{display:inline-flex;align-items:center;align-self:flex-start;height:22px;padding:0 10px;border-radius:11px;background:var(--tile);color:var(--ink);position:relative}
.sA .ttl{font-size:18px;position:relative}
.sA .row{display:flex;align-items:center;gap:10px;position:relative}

/* ═══ B · Обложка: цветная обложка слева, справа название и заметная кнопка ═══ */
.sB{border-radius:26px;display:flex;min-height:116px;background:var(--card);box-shadow:var(--shadow),var(--hi)}
.sB .cover{width:108px;flex:none;border-radius:26px 0 0 26px;background:linear-gradient(158deg,var(--c-a),var(--c-b));position:relative;display:grid;place-items:center;overflow:visible}
.sB .cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.sB .art{width:84px;margin-bottom:16px;transform:rotate(-5deg) translateX(8px);filter:drop-shadow(0 12px 12px rgba(0,0,0,.34));z-index:1}
.sB .cover .kick{position:absolute;left:0;right:0;bottom:11px;text-align:center;color:var(--on-c);opacity:.92;font-size:10.5px}
.sB .body{flex:1;min-width:0;padding:14px 14px 14px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.sB .ttl{font-size:16px}
.sB .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sB .cta{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px 0 13px;border-radius:18px;background:var(--btn);color:var(--on-btn);font-weight:800;font-size:14px;box-shadow:0 8px 16px -8px var(--btn)}
.sB .cta svg{width:14px;height:14px;fill:currentColor}

/* ═══ C · Билет: корешок с вырезами и пунктиром, сегментная полоса, круглая кнопка ═══ */
.sCw{filter:drop-shadow(0 16px 16px rgba(0,0,0,.22)) drop-shadow(0 2px 3px rgba(0,0,0,.18))}
[data-mode=light] .sCw{filter:drop-shadow(0 12px 12px rgba(40,40,70,.13)) drop-shadow(0 1px 2px rgba(40,40,70,.1))}
.sC{border-radius:24px;display:flex;min-height:104px;background:var(--card);
  -webkit-mask:radial-gradient(circle 10px at 96px 0,#0000 9.5px,#000 10.5px) top/100% 51% no-repeat,radial-gradient(circle 10px at 96px 100%,#0000 9.5px,#000 10.5px) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 10px at 96px 0,#0000 9.5px,#000 10.5px) top/100% 51% no-repeat,radial-gradient(circle 10px at 96px 100%,#0000 9.5px,#000 10.5px) bottom/100% 51% no-repeat}
.sC .stub{width:96px;flex:none;display:grid;place-items:center;background:var(--tile);border-radius:24px 0 0 24px}
.sC .art{width:66px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3))}
.sC .perf{width:0;margin:14px 0;border-left:2px dashed var(--track)}
.sC .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.sC .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sC .kick{color:var(--ink)}
.sC .ttl{font-size:16px;font-weight:700}
.sC .segs{display:flex;gap:3px;margin-top:2px}
.sC .segs i{flex:1;height:8px;border-radius:3px;background:var(--track)}
.sC .segs i.on{background:var(--fill)}
.sC .go{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--on-btn);box-shadow:0 10px 18px -8px var(--btn)}
.sC .go svg{width:16px;height:16px;fill:currentColor;margin-left:2px}

/* ═══ D · Орбита: арт в кольце прогресса, всё по одной линии ═══ */
.sD{border-radius:34px;min-height:112px;padding:14px 20px 14px 14px;display:flex;align-items:center;gap:16px;background:var(--card);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow),var(--hi)}
.sD .ring{position:relative;width:92px;height:92px;flex:none;border-radius:50%;
  background:conic-gradient(from 0deg,var(--fill) calc(var(--p)*1%),var(--track) 0);
  -webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,#0000 calc(100% - 7px),#000 calc(100% - 6px))}
.sD .ringw{position:relative;width:92px;height:92px;flex:none}
.sD .ringw.aura .ring{background:conic-gradient(from 210deg,var(--g-a),var(--g-b),var(--g-a));opacity:.85}
.sD .knob{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--fill);box-shadow:0 0 0 3px var(--card),0 0 14px var(--fill);transform:rotate(calc(var(--p)*3.6deg)) translateY(-42.5px)}
.sD .plate{position:absolute;inset:10px;border-radius:50%;background:var(--tile);display:grid;place-items:center}
.sD .plate .art{width:60px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.sD .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.sD .kick{color:var(--ink)}
.sD .ttl{font-size:17px}
.sD .cnt{font-size:14px}

/* ═══ E · Редакция: крупная цифра, арт призраком за краем, строгая полоса ═══ */
.sE{border-radius:28px;min-height:120px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;background:var(--card);overflow:hidden;box-shadow:var(--shadow),var(--hi)}
.sE .ghost{position:absolute;right:-30px;bottom:-44px;width:170px;opacity:.55;transform:rotate(-8deg);-webkit-mask-image:linear-gradient(to left,#000 28%,transparent 88%);mask-image:linear-gradient(to left,#000 28%,transparent 88%);pointer-events:none}
[data-mode=light] .sE .ghost{opacity:.7}
.sE .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;position:relative}
.sE .kick{color:var(--ink)}
.sE .ttl{font-size:15px;font-weight:700;color:var(--sec);position:relative;max-width:78%}
.sE .big{position:relative;display:flex;align-items:baseline;gap:6px;margin-top:2px}
.sE .big b{font-size:60px;line-height:.9;font-weight:900;letter-spacing:-.06em;background:linear-gradient(135deg,var(--g-a),var(--g-b));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sE .big b.word{font-size:40px;letter-spacing:-.04em}
.sE .big small{font-size:20px;font-weight:700;color:var(--sec)}
.sE .trk{flex:none;height:8px;margin-top:6px;position:relative}
.sE .ttl.solo{font-size:17px;font-weight:800;color:var(--text)}

/* ═══ F · Заливка: поверхность и есть цвет темы, арт крупно, текст на цвете ═══ */
.sF{border-radius:30px;min-height:112px;padding:16px 124px 16px 20px;display:flex;flex-direction:column;justify-content:center;gap:9px;background:linear-gradient(135deg,var(--f-a),var(--f-b));color:var(--on-f);box-shadow:0 20px 34px -14px var(--f-b),0 2px 6px rgba(0,0,0,.2)}
.sF::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(118deg,rgba(255,255,255,.24),transparent 42%);pointer-events:none}
.sF .art{position:absolute;right:6px;bottom:-12px;width:124px;transform:rotate(5deg);filter:drop-shadow(0 14px 14px rgba(0,0,0,.34));z-index:1}
.sF .art .a{background:var(--on-f)}
.sF .kick{opacity:.94}
.sF .ttl{font-size:18px}
.sF .row{display:flex;align-items:center;gap:10px}
.sF .trk{background:color-mix(in srgb,var(--on-f) 24%,transparent)}
.sF .trk i{background:var(--on-f)}
.sF .cnt{color:var(--on-f);opacity:.86}
.sF .sk{background:color-mix(in srgb,var(--on-f) 24%,transparent)}

.note{margin-top:8px;color:var(--sec);font-size:14px;max-width:62ch}
@media (prefers-reduced-motion:reduce){.sheen::after,.sk::after{animation:none}.card,.seg button,.dots button,.nav a{transition:none}}
@media (max-width:420px){.top{margin-bottom:24px}.grid{gap:22px 0}}
</style>

<div class="wrap">
  <div class="top">
    <h1>Плашка «Продолжить»</h1>
    <div class="panel">
      <div class="seg" id="modeSeg" role="group" aria-label="Оформление"><button data-mode="dark" aria-pressed="true">Тёмная</button><button data-mode="light" aria-pressed="false">Светлая</button></div>
      <div class="seg" id="kSeg" role="group" aria-label="Насыщенность"><button data-k="0" aria-pressed="false">Спокойно</button><button data-k="0.5" aria-pressed="true">Акцент</button><button data-k="1" aria-pressed="false">Максимум</button></div>
      <div class="dots" id="themeDots" role="group" aria-label="Тема"></div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <main id="root"></main>
  <p class="note">Скажите букву стиля. Для разных мест можно взять разные стили, например «В для уроков, Г для диалога и карточек».</p>
</div>

const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>';

/* ───── цвет ───── */
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const toHex = c => '#' + c.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix = (a,b,t) => { const x=hex(a), y=hex(b); return toHex(x.map((v,i)=>v*t+y[i]*(1-t))); };
const rgba = (h,al) => { const c=hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${al})`; };
const lin = v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); };
const lum = h => { const c=hex(h); return .2126*lin(c[0])+.7152*lin(c[1])+.0722*lin(c[2]); };
const contrast = (a,b) => { const x=lum(a), y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
const bestOn = (bgs, opts) => opts.map(o => ({o, c: Math.min(...bgs.map(b => contrast(o,b)))})).sort((p,q)=>q.c-p.c)[0].o;

let mode = 'dark', K = .5, themeId = 'aurora';
function applyTheme(){
  const T = THEMES.find(t => t.id===themeId), dark = mode==='dark', k = K, r = document.documentElement.style;
  const set = (n,v) => r.setProperty(n,v);
  set('--g-a',T.a); set('--g-b',T.b); set('--acc',T.acc);
  document.documentElement.dataset.mode = mode;
  let card, tile, text, sec, track, fill, btn, onBtn, ink, shadow, hi, bg, pageBg, fa, fb, ca, cb;
  if (dark){
    bg = '#0D0D10';
    card = rgba(mix(T.acc,'#18181B',k*.10),.78); tile = mix(T.acc,'#2A2A2C',k*.16);
    text = '#F5F5F7'; sec = 'rgba(245,245,247,.66)'; track = 'rgba(255,255,255,.12)';
    fill = mix(T.acc,'#FFFFFF',k); btn = mix(T.acc,'#F2F1F6',k); onBtn = T.on; ink = fill;
    shadow = '0 18px 36px -10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35)'; hi = 'inset 0 1px 0 rgba(255,255,255,.07)';
    const op = (.08+.62*k)*.5;
    pageBg = `radial-gradient(60% 46% at 4% 0%,${rgba(T.a,op)},transparent 70%),radial-gradient(52% 44% at 100% 38%,${rgba(T.b,op)},transparent 70%),radial-gradient(60% 40% at 30% 100%,${rgba(T.a,op*.8)},transparent 70%)`;
    fa = mix(T.a,'#1B1B1F',.34+.5*k); fb = mix(T.b,'#1B1B1F',.34+.5*k);
    ca = mix(T.a,'#25252A',.34+.56*k); cb = mix(T.b,'#25252A',.34+.56*k);
    set('--art-tint',T.acc); set('--glow-op',(.14+.34*k).toFixed(3));
    set('--chrome','rgba(255,255,255,.07)');
  } else {
    bg = '#F6F6F8';
    card = '#FFFFFF'; tile = mix(T.acc,'#F0F0F3',k*.40);
    text = '#1C1C1F'; sec = '#5A5A66'; track = 'rgba(28,28,31,.10)';
    const deep = mix(T.a,'#000000',.52);
    fill = mix(deep,'#1C1C1F',k); btn = mix(T.acc,'#1C1C1F',k); onBtn = bestOn([btn],['#FFFFFF',T.on]); ink = fill;
    shadow = '0 16px 30px -12px rgba(40,40,70,.24),0 2px 5px rgba(40,40,70,.08)'; hi = 'inset 0 1px 0 #fff';
    pageBg = `linear-gradient(165deg,${mix(T.a,'#F6F6F8',.22*k)} 0%,#F6F6F8 46%,${mix(T.b,'#F6F6F8',.20*k)} 100%)`;
    fa = mix(T.a,'#FFFFFF',.30+.46*k); fb = mix(T.b,'#FFFFFF',.30+.46*k);
    ca = mix(T.a,'#FFFFFF',.34+.46*k); cb = mix(T.b,'#FFFFFF',.34+.46*k);
    set('--art-tint',fill); set('--glow-op',(.10+.22*k).toFixed(3));
    set('--chrome','rgba(28,28,31,.07)');
  }
  const dk = '#0E0E12', wh = '#FFFFFF';
  const onF = bestOn([fa,fb],[wh,dk]), onC = bestOn([ca,cb],[wh,dk]);
  set('--bg',bg); set('--page-bg',pageBg); set('--card',card); set('--tile',tile); set('--text',text); set('--sec',sec); set('--track',track);
  set('--fill',fill); set('--btn',btn); set('--on-btn',onBtn); set('--ink',ink); set('--shadow',shadow); set('--hi',hi);
  set('--f-a',fa); set('--f-b',fb); set('--on-f',onF); set('--c-a',ca); set('--c-b',cb); set('--on-c',onC);
  const art = dark ? ART_DARK : ART_LIGHT;
  for (const n in art) { set('--A-'+n, `url(${art[n].b})`); set('--A-'+n+'-acc', `url(${art[n].a})`); }
}

/* ───── разметка ───── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = s => s.noProgress ? 0 : Math.round(s.done/s.total*100);
const artEl = s => `<div class="art${s.art==='continue'?' wide':''}" style="--art:var(--A-${s.art});--art-acc:var(--A-${s.art}-acc)"><i class="b"></i><i class="a"></i></div>`;
const cnt = s => `<span class="cnt num" data-to="${s.done}" data-of="${s.total}">${s.done} / ${s.total}</span>`;
const bar = s => `<div class="trk"><i style="--p:${pct(s)}"></i></div>`;
const label = s => `${s.badge ? s.badge + '. ' : ''}${s.title}`;
const wrapCard = (cls, s, inner) => `<div class="card ${cls}${s.busy?' busy':''}" role="button" tabindex="0" aria-label="${esc('Продолжить: ' + (s.title||'загрузка'))}"${s.busy?' aria-busy="true"':''}>${inner}<div class="sheen"></div></div>`;

const STYLES = [
  {id:'А', name:'Стекло', render:s => {
    if (s.pending) return wrapCard('sA', s, `<div class="glow"></div><div class="sk" style="width:64px;height:22px;border-radius:11px"></div><div class="sk" style="width:62%;height:20px"></div><div class="row"><div class="trk"></div><div class="sk" style="width:44px;height:14px"></div></div><div class="art" style="--art:none"><div class="sk" style="position:absolute;inset:18px;border-radius:50%"></div></div>`);
    return wrapCard('sA', s, `<div class="glow"></div>${s.badge ? `<span class="kick">${esc(s.badge)}</span>` : ''}<div class="ttl">${esc(s.title)}</div>${s.noProgress ? '' : `<div class="row">${bar(s)}${cnt(s)}</div>`}${artEl(s)}`);
  }},
  {id:'Б', name:'Обложка', render:s => {
    if (s.pending) return wrapCard('sB', s, `<div class="cover"><div class="sk" style="width:60px;height:60px;border-radius:18px"></div></div><div class="body"><div class="sk" style="width:70%;height:18px"></div><div class="foot"><div class="sk" style="width:128px;height:36px;border-radius:18px"></div><div class="sk" style="width:40px;height:14px"></div></div></div>`);
    return wrapCard('sB', s, `<div class="cover">${artEl(s)}${s.badge ? `<span class="kick">${esc(s.badge)}</span>` : ''}</div><div class="body"><div class="ttl">${esc(s.title)}</div><div class="foot"><span class="cta">${PLAY}${esc(s.cta)}</span>${s.noProgress ? '' : cnt(s)}</div></div>`);
  }},
  {id:'В', name:'Билет', render:s => {
    if (s.pending) return `<div class="sCw">${wrapCard('sC', s, `<div class="stub"><div class="sk" style="width:56px;height:56px;border-radius:16px"></div></div><div class="perf"></div><div class="main"><div class="txt"><div class="sk" style="width:56px;height:12px"></div><div class="sk" style="width:74%;height:18px"></div><div class="segs">${'<i></i>'.repeat(10)}</div></div><div class="sk" style="width:42px;height:42px;border-radius:50%"></div></div>`)}</div>`;
    const on = s.noProgress ? 0 : Math.round(s.done/s.total*10);
    return `<div class="sCw">${wrapCard('sC', s, `<div class="stub">${artEl(s)}</div><div class="perf"></div><div class="main"><div class="txt">${s.badge ? `<span class="kick">${esc(s.badge)}</span>` : ''}<div class="ttl">${esc(s.title)}</div>${s.noProgress ? '' : `<div class="segs">${Array.from({length:10},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div>`}</div><span class="go">${PLAY}</span></div>`)}</div>`;
  }},
  {id:'Г', name:'Орбита', render:s => {
    if (s.pending) return wrapCard('sD', s, `<div class="ringw"><div class="ring"></div><div class="plate"><div class="sk" style="width:52px;height:52px;border-radius:50%"></div></div></div><div class="txt"><div class="sk" style="width:56px;height:12px"></div><div class="sk" style="width:78%;height:18px"></div><div class="sk" style="width:44px;height:14px"></div></div>`);
    return wrapCard('sD', s, `<div class="ringw${s.noProgress?' aura':''}" style="--p:${s.noProgress?100:pct(s)}"><div class="ring"></div>${s.noProgress ? '' : '<div class="knob"></div>'}<div class="plate">${artEl(s)}</div></div><div class="txt">${s.badge ? `<span class="kick">${esc(s.badge)}</span>` : ''}<div class="ttl">${esc(s.title)}</div>${s.noProgress ? '' : cnt(s)}</div>`);
  }},
  {id:'Д', name:'Редакция', render:s => {
    if (s.pending) return wrapCard('sE', s, `<div class="head"><div class="sk" style="width:60px;height:12px"></div></div><div class="sk" style="width:58%;height:16px"></div><div class="sk" style="width:96px;height:46px;margin-top:2px"></div><div class="trk"></div>`);
    const ghost = `<div class="ghost">${artEl(s)}</div>`;
    if (s.noProgress) {
      const word = s.start ? '1' : s.badge;
      return wrapCard('sE', s, `${ghost}<div class="head"><span class="kick">${s.start ? 'Урок' : 'Продолжить'}</span></div><div class="big"><b class="${s.start?'':'word'}">${esc(word)}</b></div><div class="ttl solo">${esc(s.title)}</div>`);
    }
    return wrapCard('sE', s, `${ghost}<div class="head"><span class="kick">${esc(s.badge)}</span></div><div class="ttl">${esc(s.title)}</div><div class="big"><b class="num" data-to="${s.done}">${s.done}</b><small class="num">/ ${s.total}</small></div>${bar(s)}`);
  }},
  {id:'Е', name:'Заливка', render:s => {
    if (s.pending) return wrapCard('sF', s, `<div class="sk" style="width:60px;height:12px"></div><div class="sk" style="width:62%;height:20px"></div><div class="row"><div class="trk"></div><div class="sk" style="width:44px;height:14px"></div></div>`);
    return wrapCard('sF', s, `${s.badge ? `<span class="kick">${esc(s.badge)}</span>` : ''}<div class="ttl">${esc(s.title)}</div>${s.noProgress ? '' : `<div class="row">${bar(s)}${cnt(s)}</div>`}${artEl(s)}`);
  }},
];

/* ───── сборка страницы ───── */
const root = document.getElementById('root'), nav = document.getElementById('nav');
root.innerHTML = STYLES.map(st => `<section class="style" id="s-${st.id}"><h2><b>${st.id}</b>${st.name}</h2><div class="grid">${SCENES.map(s => `<div class="cell"><small>${s.label}</small>${st.render(s)}</div>`).join('')}</div></section>`).join('');
nav.innerHTML = STYLES.map(st => `<a href="#" data-to="s-${st.id}"><b>${st.id}</b>${st.name}</a>`).join('');
nav.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); const el = document.getElementById(a.dataset.to); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); });

/* ───── пульт ───── */
const dotsEl = document.getElementById('themeDots');
dotsEl.innerHTML = THEMES.map(t => `<button style="--sw:linear-gradient(135deg,${t.a},${t.b})" data-theme="${t.id}" aria-label="${t.name}" title="${t.name}" aria-pressed="${t.id===themeId}"></button>`).join('');
function pressed(group, pick){ [...group.children].forEach(b => b.setAttribute('aria-pressed', String(pick(b)))); }
document.getElementById('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.mode; pressed(e.currentTarget, x => x===b); applyTheme(); });
document.getElementById('kSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; K = Number(b.dataset.k); pressed(e.currentTarget, x => x===b); applyTheme(); });
dotsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; themeId = b.dataset.theme; pressed(dotsEl, x => x===b); applyTheme(); });
document.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('card')) { e.preventDefault(); e.target.animate([{transform:'scale(.98)'},{transform:'scale(1)'}],{duration:240,easing:'cubic-bezier(.3,1.4,.5,1)'}); } });
applyTheme();

/* ───── движение: появление раздела один раз, заполнение полос, счётчики (по просмотру; без JS всё уже видно) ───── */
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!still && 'IntersectionObserver' in window) {
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return; io.unobserve(en.target);
    en.target.querySelectorAll('.card').forEach((c, i) => {
      c.animate([{opacity:0,transform:'translateY(12px)'},{opacity:c.classList.contains('busy')?.72:1,transform:'none'}], {duration:440, delay:i*45, easing:'cubic-bezier(.2,1,.3,1)', fill:'backwards'});
      c.querySelectorAll('.trk i').forEach(f => f.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}], {duration:800, delay:140+i*45, easing:'cubic-bezier(.2,1,.3,1)', fill:'backwards'}));
      c.querySelectorAll('.segs i.on').forEach((f, j) => f.animate([{opacity:0,transform:'scaleY(.4)'},{opacity:1,transform:'none'}], {duration:360, delay:160+i*45+j*28, easing:'cubic-bezier(.2,1,.3,1)', fill:'backwards'}));
      c.querySelectorAll('.cnt[data-to],.big b[data-to]').forEach(n => {
        const to = Number(n.dataset.to), of = n.dataset.of, t0 = performance.now() + 140 + i*45, dur = 650;
        const fmt = v => of ? v + ' / ' + of : String(v);
        const tick = now => { if (now < t0) { requestAnimationFrame(tick); return; } const p = Math.min(1, (now - t0)/dur), v = Math.round(to * (1 - Math.pow(1-p,3))); n.textContent = fmt(v); if (p < 1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
        setTimeout(() => { n.textContent = fmt(to); }, 140 + i*45 + dur + 500);
      });
    });
  }), {threshold:.12});
  document.querySelectorAll('.style').forEach(s => io.observe(s));
}
