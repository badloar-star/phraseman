<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диалоги — Plus открывает сценарии</title>
<!-- зачем: владелец 11.11 — «макеты покажи всего что добавилось и как оно выглядит в приложении точно».
     Строки каталога — дословно функции блока G утверждённого макета dialogs.html (как DialogueV2CatalogueSection);
     добавлен только признак Plus из решения D204. Собрано скриптом, руками не править. -->
<link rel="stylesheet" href="kit.css">
<style>
/* Локальные детали раздела «Диалоги». kit.css/kit.js не трогаем (бриф). */
.spec { width: 100%; max-width: 1180px; border-collapse: collapse; margin-top: 22px; font-size: 14px; }
.spec th, .spec td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.spec th { color: var(--sec); font-weight: 600; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
.spec td:first-child { color: var(--sec); white-space: nowrap; width: 56px; font-weight: 700; }
.spec td:nth-child(2) { width: 52%; }
.spec a { color: #D6D6D8; border-bottom: 1px dotted var(--line-2); }
.spec .rm { color: var(--muted); }
.replay { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; margin-top: 8px; font-size: 14px; font-weight: 600; color: #DADADC; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line-2); background: #161618; }
.replay:hover { color: #fff; }
.col > .lbl .lnote { display: block; font-weight: 400; color: var(--sec); margin-top: 2px; font-size: 13px; }

/* ---- хаб: раскрытие категории ---- */
.cat-body { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 520ms cubic-bezier(.2,.9,.2,1), opacity 320ms; }
.cat-body.on { max-height: 700px; opacity: 1; }
.cat-body .dl { opacity: 0; transform: translateY(10px); }
.cat-body.on .dl { animation: rowIn 260ms cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes rowIn { to { opacity: 1; transform: none; } }
.dl.done .tt { color: #DADADC; }
.rank { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--sec); margin-top: 2px; }
.poster { background: var(--card-2); border-radius: 22px; padding: 18px 18px 18px; margin-top: 14px; }
.poster .top { display: flex; align-items: center; gap: 14px; }
.poster .rank-p { margin-left: auto; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--control); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: #DADADC; flex: none; }
.poster .tt { font-size: 20px; line-height: 24px; font-weight: 700; white-space: nowrap; }
.poster .st { font-size: 15px; line-height: 20px; color: var(--sec); margin-top: 8px; }
.poster .mem { font-size: 15px; color: #DADADC; margin-top: 8px; }

/* ---- брифинг ---- */
.brief { text-align: center; margin-top: 18px; }
.brief .med { width: 88px; height: 88px; border-radius: 28px; background: #242426; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
.brief .med .i { width: 40px; height: 40px; }
.brief .lvl { margin-top: 14px; }
.brief .ti { font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -.4px; margin-top: 10px; }
.bcard { border-radius: 18px; background: #161618; border: 1px solid var(--line); padding: 18px 18px; margin-top: 22px; }
.bcard .k { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--sec); font-weight: 700; }
.bcard .v { font-size: 17px; line-height: 24px; margin-top: 10px; }
.obj { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 16px; }
.obj:first-of-type { border-top: none; }
.obj .n { width: 26px; height: 26px; border-radius: 50%; background: var(--control); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #DADADC; flex: none; }
.obj .n.ok { background: #E9E9EB; color: #0B0C0E; }
.obj .n.ok .i { width: 15px; height: 15px; stroke-width: 2.4; }
.obj.dn { color: var(--sec); }
.obj .who { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.fx { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; padding: 14px var(--pad) 42px; background: linear-gradient(180deg, rgba(12,12,13,0), var(--bg) 34%); }
.fx .sub { text-align: center; color: var(--sec); font-size: 15px; font-weight: 600; margin-top: 12px; }
.cta.dis { background: #1E1E20; color: var(--muted); }

/* ---- модал по центру ---- */
.modal { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%) scale(.96); z-index: 50; background: var(--sheet); border: 1px solid var(--line); border-radius: 26px; padding: 24px 22px 22px; opacity: 0; pointer-events: none; transition: opacity 220ms, transform 260ms cubic-bezier(.2,1,.3,1); }
.modal.on { opacity: 1; transform: translateY(-50%); pointer-events: auto; }
.modal .h { display: flex; align-items: center; gap: 12px; font-size: 22px; line-height: 28px; font-weight: 700; }
.modal .h.center { justify-content: center; text-align: center; flex-direction: column; gap: 14px; }
.modal .p { font-size: 17px; line-height: 24px; color: #DADADC; margin-top: 12px; }
.modal .p.center { text-align: center; }
.modal .btns { display: flex; gap: 10px; margin-top: 22px; }
.modal .btns .cta { flex: 1; }
.modal .big { width: 72px; height: 72px; border-radius: 50%; background: #242426; display: flex; align-items: center; justify-content: center; }
.modal .big .i { width: 34px; height: 34px; }

/* ---- согласие ---- */
.scene { height: 150px; border-radius: 18px; background: #202022; display: flex; align-items: center; justify-content: center; gap: 18px; position: relative; overflow: hidden; }
.scene .bb { padding: 10px 14px; border-radius: 16px; background: #2C2C2E; font-size: 14px; color: #DADADC; }
.scene .bb.me { background: #D9D9DD; color: #0B0C0E; margin-top: 46px; }
.gate { text-align: center; margin-top: 150px; }
.gate .big { width: 84px; height: 84px; border-radius: 50%; background: #242426; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
.gate .big .i { width: 38px; height: 38px; }
.gate .ti { font-size: 26px; line-height: 32px; font-weight: 700; margin-top: 22px; letter-spacing: -.3px; }
.gate .p { font-size: 17px; line-height: 24px; color: var(--sec); margin-top: 10px; padding: 0 8px; }
.gate .cta { margin-top: 12px; }
.gate .p + .cta { margin-top: 30px; }

/* ---- сессия ---- */
.dh { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.dh > .tx { margin-left: 4px; }
.dtop { position: absolute; left: 0; right: 0; top: 0; z-index: 25; padding: 54px 14px 12px; background: radial-gradient(120% 60% at 50% 0%, var(--bg-top), var(--bg) 60%); background-size: 430px 932px; background-position: 0 0; }
.dtop::after { content: ""; position: absolute; left: 0; right: 0; bottom: -30px; height: 30px; background: linear-gradient(var(--bg), rgba(12,12,13,0)); pointer-events: none; }
.dh .rb.l { flex: none; }
.dh .tx { flex: 1; min-width: 0; }
.dh .ti { font-size: 20px; line-height: 24px; font-weight: 700; letter-spacing: -.2px; }
.dh .su { font-size: 15px; line-height: 19px; color: var(--sec); margin-top: 2px; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; }
.dh .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh .su .i { width: 18px; height: 18px; color: var(--sec); }
.dh .rb.sq { width: 40px; height: 40px; border-radius: 13px; }
/* энергия | реплики — одна пилюля, как «сердца | монеты» в Блице: заголовок сцены не обрезается */
.pill.duo { gap: 6px; padding: 0 12px; }
.dh .su { overflow: visible; } .dh .su .dmood { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; } .dh .su .pill { flex: none; }
.ibar .rbtn.mnone { opacity: .55; } .ibar .rbtn.mnone::after { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; height: 2px; border-radius: 1px; background: currentColor; transform: rotate(-45deg); }
.pill.duo .sep { width: 1px; height: 16px; background: var(--line-2); margin: 0 4px; display: block; }
.goal { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 12px 10px 10px; border-radius: 18px; background: #161618; border: 1px solid var(--line); }
.goal .tile { width: 46px; height: 46px; border-radius: 13px; }
.goal .k { font-size: 13px; color: var(--sec); font-weight: 600; }
.goal .v { font-size: 17px; line-height: 22px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal .tx { flex: 1; min-width: 0; }
.goal .ch { color: var(--sec); flex: none; }
.hintb { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 18px; background: var(--control); font-size: 14px; font-weight: 600; flex: none; }
.hintb .i { width: 17px; height: 17px; }
.hintb.ic { width: 40px; padding: 0; justify-content: center; border-radius: 50%; }
.hintb.ic .i { width: 20px; height: 20px; }
.chat { margin-top: 0; }
.chat .msg:first-child { margin-top: 0; }
.msg { display: flex; align-items: flex-start; gap: 10px; margin-top: 18px; }
.msg.b { justify-content: flex-start; }
.msg.u { justify-content: flex-end; }
.msg .av { width: 40px; height: 40px; border-radius: 50%; background: #242426; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 25px; color: #DADADC; }
.msg .av .i { width: 20px; height: 20px; }
.msg .bw { max-width: 78%; min-width: 0; display: flex; flex-direction: column; }
.msg.u .bw { align-items: flex-end; }
.msg .who { font-size: 14px; line-height: 19px; color: var(--sec); margin: 0 6px 6px; font-weight: 500; }
.msg .bub { padding: 14px 18px; border-radius: 22px; font-size: 17px; line-height: 24px; font-weight: 500; word-wrap: break-word; }
.msg.b .bub { background: #1D1D1F; border: 1px solid var(--line); border-radius: 20px; }
.msg.u .bub { background: #D9D9DD; color: #0B0C0E; border-radius: 20px; }
.msg .bub.tr { font-style: italic; color: #DADADC; font-weight: 400; }
.msg .bub .key { text-decoration: underline; text-decoration-color: rgba(255,255,255,.4); text-underline-offset: 4px; font-weight: 700; }
.acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.ab { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 18px; background: #1A1A1C; border: 1px solid var(--line-2); font-size: 14px; font-weight: 600; color: #DADADC; }
.ab.ic { width: 40px; padding: 0; }
.ab .i { width: 18px; height: 18px; }
.ab.live { background: #F2F1F6; color: #0B0C0E; border-color: transparent; }
.ab.on { background: #2A2A2C; color: #fff; }
.fixb { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--control); font-size: 13px; font-weight: 600; color: #DADADC; }
.fixb .i { width: 15px; height: 15px; }
.fixt { margin: 8px 4px 0; font-size: 14px; line-height: 19px; color: var(--sec); text-align: right; max-width: 78%; }
.fixt b { color: #fff; font-weight: 600; }
.fixt .i { display: inline-block; vertical-align: -3px; margin-right: 2px; }
.msg.in { animation: msgIn 360ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } }
.typing { display: inline-flex; gap: 6px; align-items: center; height: 52px; padding: 0 20px; border-radius: 20px; background: #1D1D1F; border: 1px solid var(--line); }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: #A6A6A8; animation: tdot 1.1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
@keyframes tdot { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-6px); opacity: 1; } }
.syserr { align-self: center; margin: 18px auto 0; max-width: 90%; border-radius: 16px; background: #161618; border: 1px solid var(--line); padding: 14px 16px; text-align: center; }
.syserr .p { font-size: 15px; line-height: 21px; color: #DADADC; display: flex; gap: 8px; align-items: flex-start; text-align: left; }
.syserr .p .i { flex: none; margin-top: 2px; color: var(--sec); }
.syserr .cta.sm { margin: 12px auto 0; }

/* поле ввода */
.ibar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; padding: 14px 14px 30px; background: linear-gradient(180deg, rgba(12,12,13,0), var(--bg) 30%); }
.ibar .row-i { display: flex; align-items: center; gap: 10px; }
.ibar .rbtn { width: 52px; height: 52px; border-radius: 50%; background: #1C1C1E; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; color: #DADADC; flex: none; position: relative; }
.ibar .rbtn .i { width: 24px; height: 24px; }
/* зачем (владелец 15.10, один счётчик голоса на все микрофоны): цифра остатка на кнопке микрофона в поле ввода; 0 → «PLUS»; у Plus цифры нет */
.ibar .rbtn .vbdg { position: absolute; top: -6px; right: -8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: #0B0C0E; color: #fff; font-size: 12px; line-height: 16px; font-weight: 800; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--bg, #0C0D10); z-index: 2; }
.ibar .rbtn .vbdg.plus { background: #F2F1F6; color: #0B0C0E; font-size: 10px; letter-spacing: .3px; }
.ibar .rbtn.spent { opacity: .55; }
.ibar .rbtn.live { background: #FFFFFF; color: #0B0C0E; border-color: transparent; box-shadow: 0 0 0 8px rgba(255,255,255,.08), 0 0 30px rgba(255,255,255,.22); }
.ibar .rbtn.live::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); animation: halo 1.1s ease-out infinite; }
@keyframes halo { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
.ibar .rbtn.send { background: #F2F1F6; color: #0B0C0E; border-color: transparent; }
.ibar .rbtn.send.off { background: #1C1C1E; color: var(--muted); border-color: var(--line-2); }
.ibar .rbtn .spin { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ibar .rbtn .mi { display: block; transform: translateY(-4px); }
.ibar .rbtn .dots { position: absolute; left: 0; right: 0; bottom: 9px; display: flex; justify-content: center; gap: 3px; }
.ibar .rbtn .dots i { width: 4px; height: 4px; border-radius: 50%; background: #fff; }
.ibar .rbtn .dots i.sp { opacity: .25; }
.ibar .rbtn .plus { position: absolute; right: -4px; top: -4px; height: 18px; padding: 0 6px; border-radius: 9px; background: #F2F1F6; color: #0B0C0E; font-size: 10px; font-weight: 800; display: flex; align-items: center; }
.ibar .fld { flex: 1; min-width: 0; height: 52px; border-radius: 26px; background: #1C1C1E; border: 1px solid var(--line-2); display: flex; align-items: center; padding: 0 18px; font-size: 16px; }
.ibar .fld .plc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibar .fld .plc { color: var(--muted); }
.ibar .fld .tv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibar .fld .cur { width: 2px; height: 24px; background: #fff; margin-left: 2px; animation: blink 1s steps(1) infinite; flex: none; }
@keyframes blink { 50% { opacity: 0; } }
.ibar .hint { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; font-size: 15px; font-weight: 600; color: var(--sec); min-height: 20px; }
.ibar .hint.on { color: #fff; }
.ibar .hint .lnk { color: #fff; }
.wave { display: flex; align-items: center; gap: 4px; height: 28px; justify-content: center; margin-top: 10px; }
.wave i { width: 4px; border-radius: 2px; background: #E9E9EB; height: 6px; animation: wv 900ms ease-in-out infinite; }
.wave i:nth-child(2n) { animation-duration: 760ms; } .wave i:nth-child(3n) { animation-duration: 1040ms; animation-delay: -300ms; } .wave i:nth-child(5n) { animation-delay: -600ms; }
@keyframes wv { 0%,100% { height: 6px; opacity: .55; } 50% { height: var(--h, 22px); opacity: 1; } }
.kb { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; background: #1C1C1E; border-top: 1px solid var(--line); z-index: 20; padding: 12px 6px 0; }
.kb .r { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.kb .k { width: 34px; height: 44px; border-radius: 6px; background: #3A3A3C; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 500; box-shadow: 0 1px 0 #000; }
.kb .k.w { width: 52px; background: #2A2A2C; font-size: 13px; } .kb .k.sp { width: 190px; background: #3A3A3C; }
.kb .k.ret { width: 90px; background: var(--cta); color: var(--cta-ink); font-size: 15px; font-weight: 600; }
.ibar.kbd { bottom: 250px; padding-bottom: 12px; }
/* стена лимита */
.wall { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; padding: 24px 14px 34px; background: linear-gradient(180deg, rgba(12,12,13,0), var(--bg) 22%); }
.wall .c { border-radius: 22px; background: #161618; border: 1px solid var(--line); padding: 20px 18px 18px; text-align: center; }
.wall .ti { font-size: 22px; line-height: 28px; font-weight: 700; }
.wall .p { font-size: 16px; line-height: 22px; color: var(--sec); margin-top: 8px; }
.wall .btns { display: flex; gap: 10px; margin-top: 18px; }
.wall .btns .cta { flex: 1; }
/* итоги-пилюля и слой */
.sumpill { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 20; }
.tapl { position: absolute; left: 0; right: 0; bottom: 0; top: 120px; z-index: 15; }
.veil { position: absolute; left: 0; right: 0; bottom: 34px; z-index: 20; text-align: center; color: var(--sec); font-size: 15px; font-weight: 600; }
/* шторки */
.sh-h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
/* зачем (владелец 13.10 «все модалы слушаются тему», Темы 15.10 по dialogs-036): нейтральная шторка «Тени» отменена (shadowSheetGradient=null) — как HybridSheetShell: поверхность темы + свечение акцента 12% сверху + лёгкая диагональная подсветка */
.sheet { background: linear-gradient(180deg, color-mix(in srgb, var(--cta) 12%, transparent), transparent 42%), linear-gradient(135deg, rgba(255,255,255,.06), transparent 80%), var(--sheet); }
.sh-h .ti { font-size: 22px; line-height: 28px; font-weight: 700; }
.quote { border-radius: 16px; background: #202022; padding: 16px 16px; margin-top: 18px; font-size: 17px; line-height: 24px; font-weight: 600; }
.sh-k { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--sec); font-weight: 700; margin-top: 20px; }
.sh-p { font-size: 17px; line-height: 24px; margin-top: 8px; color: #EDEDEF; }
.grow0 { flex: 1; min-width: 0; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.tiles .tp { padding: 12px 16px; border-radius: 16px; background: #1D1D1F; border: 1px solid var(--line); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.tiles .tp .m { font-size: 12px; color: var(--sec); font-weight: 600; }
.board { border-radius: 18px; background: #161618; border: 1px solid var(--line); padding: 16px 16px 14px; margin-top: 18px; }
.board .k { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--sec); font-weight: 700; }
.board .v { font-size: 24px; line-height: 30px; font-weight: 700; margin-top: 10px; }
.board .m { font-size: 16px; color: var(--sec); margin-top: 4px; }
.board .acts { margin-top: 12px; }
.mast { display: flex; gap: 4px; }
.mast i { width: 18px; height: 6px; border-radius: 3px; background: #2C2C2E; display: block; }
.mast i.on { background: #E9E9EB; }
.tipc { border-radius: 18px; background: #161618; border: 1px solid var(--line); padding: 16px 16px; margin-top: 110px; display: flex; gap: 14px; align-items: flex-start; }
.tipc .tt { font-size: 17px; font-weight: 700; }
.tipc .p { font-size: 16px; line-height: 22px; color: var(--sec); margin-top: 6px; }

/* ---- завершение (макет practice.html, 1:1) ---- */
.done-h { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.done-t { text-align: center; margin-top: 18px; }
.done-t .ti { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -.4px; }
.done-t .su { font-size: 16px; color: var(--sec); margin-top: 6px; }
.done-t .mood { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; height: 32px; padding: 0 14px; border-radius: 16px; background: var(--control); font-size: 15px; font-weight: 600; color: #DADADC; }

/* зачем (координатор 13.10, проход Дизайна по экранам завершения): в итоге диалога код показывает карточку целей (dialogue-v2-completion-goals) после монет — образец к коду */

.rate .stars .i { width: 34px; height: 34px; color: #fff; }
.rate .stars .i.off { color: #3A3A3E; }
.rate .fld { min-height: 56px; border-radius: 12px; background: #1C1C1E; border: 1px solid var(--line-2); padding: 12px 14px; font-size: 16px; line-height: 22px; margin-top: 16px; color: var(--muted); }
.rate .fld.on { color: var(--text); border-color: var(--outline); }

/* ---- liquid glass в графите на локальных поверхностях раздела ----
   зачем: владелец 26.09 — стекло «во ВСЕХ элементах». Общий слой kit.css покрывает только
   свои классы; здесь тот же ::after (блик по кромке + перелив) для деталей этой страницы.
   ::after/box-shadow элементов kit.css НЕ переопределяем. */
:where(.bcard, .goal, .hintb, .ab, .msg .bub, .typing, .syserr, .ibar .fld, .ibar .rbtn, .wall .c, .stats, .errc, .rate, .rate .fld, .board, .tipc, .poster, .tiles .tp, .fixb, .done-t .mood, .brief .med, .gate .big, .modal .big, .scene, .scene .bb) { position: relative; isolation: isolate; }
:where(.bcard, .goal, .hintb, .ab, .msg .bub, .typing, .syserr, .ibar .fld, .ibar .rbtn, .wall .c, .stats, .errc, .rate, .rate .fld, .board, .tipc, .poster, .tiles .tp, .fixb, .done-t .mood, .brief .med, .gate .big, .modal .big, .scene, .scene .bb)::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1; background: var(--lg-sheen); box-shadow: var(--lg-rim); }
:where(.bcard, .goal, .wall .c, .stats, .errc, .rate, .board, .tipc, .poster, .syserr) { -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%); }
/* светлый пузырь «Ты» — перелив мягче, иначе серый уходит в грязь */
.msg.u .bub::after { background: linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 55%); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1.5px 0 rgba(0,0,0,.10); }
.one .page-h1, .one .page-lead, .one .page-nav, .one .block > h2, .one .block > p { display: none; }
.one .page { padding: 20px 20px 20px; } .one .block { margin-top: 0; }
/* зачем (координатор 11.10): «Свободный разговор» — строка над категориями хаба (DialogsTabContent), кнопки входа — акцентом темы, а не белые.
   Free: справа замок (ряд ведёт в Plus), Plus: шеврон. «Память диалогов» здесь НЕ рисуем — она в Настройки → Приватность и данные. */
/* зачем (координатор 13.10, класс A «Аврора ＠1» по таблице DEV_SWITCHES_R1_CORE): на образце основные кнопки («Включить / Остаться / Получить Plus / К урокам / Закрыть / Открыть Plus») мятные, как в приложении на theme=grad_aurora&level=1, и у телефона есть свечение фона (--g1/--g2); раньше кнопки брали белый базовый --cta, фон был ровным. */
.ph { --g1: #38E0AA; --g2: #7C5CFF; --acc: #7EF0C8; --on: #04261D; }
.ph::before { content: ""; position: absolute; inset: -18%; z-index: -1; pointer-events: none; opacity: .62;
  background: radial-gradient(38% 26% at 18% 16%, var(--g1), transparent 70%), radial-gradient(40% 28% at 88% 44%, var(--g2), transparent 70%), radial-gradient(48% 28% at 32% 96%, var(--g1), transparent 72%); }
.ph .cta:not(.dis):not(.gh) { background: var(--acc); color: var(--on); }
.fr { margin-top: 14px; padding: 16px 16px 16px 14px; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; background: linear-gradient(135deg, color-mix(in srgb, var(--acc) 14%, #1D1D1F), #1D1D1F 70%) !important; }
.fr .fi { width: 52px; height: 52px; border-radius: 18px; flex: none; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--acc) 22%, #1D1D1F); color: var(--acc); }
.fr .ft { display: flex; align-items: center; gap: 8px; font-size: 18px; line-height: 23px; font-weight: 800; } .fr .fp { height: 20px; padding: 0 7px; border-radius: 8px; background: var(--acc); color: var(--on); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; flex: none; }
.fr .fs { font-size: 15px; line-height: 20px; color: var(--sec); margin-top: 3px; } .fr > .i, .fr > .ch { color: var(--acc); flex: none; }
.fx .cta:not(.dis):not(.gh), .poster .cta { background: var(--acc); color: var(--on); }
  .unsn { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 6px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--sec); }
</style>

<body>
<div class="page">
  <h1 class="page-h1">Диалоги — Plus открывает все сценарии</h1>
  <p class="page-lead">Раздел «Дела» раскрыт, ранг монеты 0. Меняется одно: у подписчика Plus пропадают замки и строка «Откроется на ранге N». У бесплатного аккаунта всё как было.</p>
  <div id="root"></div>
</div>
<script src="kit.js"></script>
<script>
const { icon, phone, col, block, energy, coinImg } = K;
const RK_TITLES = {"work": ["Представиться коллеге", "Спросить файл", "Подтвердить время созвона", "Написать, что опаздываешь", "Поблагодарить за инструкцию", "Уточнить простую задачу", "Попросить перенести дедлайн", "Сообщить короткий статус", "Запросить доступ", "Написать после первого рабочего дня", "Согласовать следующий шаг в команде", "Объяснить проблему и предложить решение", "Собрать доступность для встречи", "Защитить реалистичный срок", "Дать конструктивный отзыв", "Согласовать приоритеты", "Дипломатично возразить решению", "Снять риск между командами", "Провести сложные переговоры в треде"], "travel": ["Написать хозяину жилья: я приехал", "Спросить код от двери", "Уточнить время заселения", "Заказать трансфер", "Поблагодарить за подсказку", "Уточнить маршрут в чате", "Подтвердить бронь", "Написать о задержке", "Спросить, где оставить багаж", "Договориться о времени встречи", "Решить проблему с жильём", "Скоординировать группу в поездке", "Запросить изменение бронирования", "Объяснить претензию сервису", "Согласовать альтернативный маршрут", "Отстоять решение по бронированию", "Договориться о компенсации", "Разрешить ситуацию гость—хозяин—сервис", "Вести многосторонний тред при сбое поездки"], "everyday": ["Спросить совет", "Напомнить о вещи", "Поздравить с событием", "Спросить, свободен ли человек", "Написать короткое извинение", "Попросить небольшую помощь", "Договориться присмотреть за питомцем", "Выбрать подарок в групповом чате", "Уточнить детали доставки", "Поблагодарить после помощи", "Организовать общий план на выходные", "Сравнить варианты и принять решение", "Объяснить проблему соседу или сервису", "Обсудить общие правила", "Урегулировать неудобство без обвинений", "Убедить группу выбрать разумный вариант", "Провести чувствительный разговор о границах", "Разобрать противоречивую информацию", "Посредничать в личном групповом конфликте"], "social": ["Поздороваться после знакомства", "Перенести встречу", "Спросить, как добраться", "Поблагодарить за помощь", "Поздравить и задать простой вопрос", "Познакомиться в чате по интересу", "Договориться о времени и месте", "Позвать на событие", "Вежливо отменить планы", "Написать после встречи", "Собрать планы в группе", "Поддержать друга", "Снять лёгкое недопонимание", "Мягко отказать", "Обсудить ожидания в группе", "Дать деликатную обратную связь", "Обозначить личную границу", "Восстановить доверие", "Урегулировать тонкий конфликт в группе"]};
const RK_CEFR = ['A1', 'A1', 'A1', 'A1', 'A1', 'A2', 'A2', 'A2', 'A2', 'A2', 'B1', 'B1', 'B1', 'B2', 'B2', 'B2', 'C1', 'C1', 'C2'];
const RK_WORLDS = [['social', 'Общение', 'peopleF'], ['work', 'Дела', 'docF'], ['travel', 'Поездки', 'planeF'], ['everyday', 'Повседневное', 'cupF']];
const rkUnlock = (w, i) => (w === 'social' ? i : i + 1); // i — номер в разделе с 0: social_01 → 0, social_k → k−1; work/travel/everyday_k → k
const rkRow = (w, ic, i, my, doneUpTo, plus) => {
  const need = rkUnlock(w, i); const locked = need > my && !plus; const done = !locked && need <= doneUpTo;
  return `<div class="t" style="min-height:60px;border-radius:14px;background:rgba(255,255,255,.05);padding:6px 14px 6px 10px;display:flex;align-items:center;gap:16px">
    <div style="width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex:none;color:${locked ? 'var(--muted)' : 'var(--text)'}">${icon(locked ? 'lockF' : ic, 's20')}</div>
    <div class="grow" style="min-width:0"><div style="font-size:16px;line-height:22px;font-weight:600;color:${locked ? 'var(--sec)' : 'var(--text)'}">${RK_TITLES[w][i]}</div>${locked ? `<div style="display:flex;align-items:center;gap:6px;margin-top:2px;font-size:13px;line-height:18px;color:var(--sec)">Откроется на ранге ${need}<img src="${K.coin(need)}" alt="" style="width:16px;height:16px;border-radius:50%"></div>` : ''}</div>
    <span class="lvl" style="flex:none">${RK_CEFR[i]}</span><span style="color:${done ? 'var(--text)' : 'var(--sec)'};flex:none">${icon(done ? 'check' : 'fwd', 's20')}</span></div>`;
};
const rkWorld = (w, title, ic, my, doneUpTo, open, plus) => {
  const done = RK_TITLES[w].filter((_, i) => rkUnlock(w, i) <= Math.min(my, doneUpTo)).length; const total = RK_TITLES[w].length;
  return `<div class="card c2" style="padding:16px 16px 18px;border-radius:24px"><div class="flex" style="gap:12px"><div class="tile t55" style="margin-right:4px">${icon(ic, 's26')}</div><div class="grow" style="font-size:19px;line-height:24px;font-weight:700">${title}</div><span class="frac"><b>${done}</b><span> /${total}</span></span><span style="color:var(--sec);margin-left:6px">${icon(open ? 'up' : 'fwd', 's20')}</span></div>
    <div class="trk dot" style="margin:${open ? 16 : 18}px ${open ? 6 : 4}px 0"><i style="left:${Math.round(done / total * 100)}%;margin-left:${done ? -8 : 0}px"></i></div>
    ${open ? `<div class="stack" style="--g:9px;margin-top:18px">${RK_TITLES[w].map((_, i) => rkRow(w, ic, i, my, doneUpTo, plus)).join('')}</div>` : ''}</div>`;
};
const rankCat = (my, openW, doneUpTo = -1, o = {}) => phone(`
  <div class="flex" style="gap:18px"><span class="rb l t">${icon('back', 's20')}</span><div class="grow" style="font-size:34px;font-weight:700;letter-spacing:-.4px">Диалоги</div>${o.sub ? '' : energy(5, { ol: true })}</div>
  ${o.sub ? '' : `<div class="center" style="margin-top:10px"><span class="pill">${icon('chatDots', 's20')}30/30</span></div>`}
  <div class="stack" style="--g:14px;margin-top:16px">${RK_WORLDS.map(([w, t, ic]) => rkWorld(w, t, ic, my, doneUpTo, w === openW, o.plus)).join('')}</div>`, { time: '13:00' });


document.getElementById('root').innerHTML = [
  block('free', 'Бесплатный аккаунт — без изменений', 'Открыт один диалог в «Общении», остальные ждут ранга. Нажатие на закрытую строку показывает окно «Откроется на ранге N».', [
    col('Ранг 0 — «Общение»', rankCat(0, 'social')),
    col('Ранг 0 — «Дела»', rankCat(0, 'work')),
  ]),
  block('plus', 'Подписчик Plus', 'Слева — как было до правки: подписка замки не снимала. Справа — как стало: все строки открыты, каждая запускает диалог.', [
    col('Было — «Дела», ранг 0', rankCat(0, 'work', -1, { sub: true })),
    col('Стало — «Дела», ранг 0', rankCat(0, 'work', -1, { sub: true, plus: true })),
    col('Стало — «Общение», ранг 0', rankCat(0, 'social', -1, { sub: true, plus: true })),
  ]),
].join('');
// первая тема набора («Аврора») — как при открытии dialogs.html
document.querySelectorAll('.ph').forEach((p) => { p.style.setProperty('--g1', '#38E0AA'); p.style.setProperty('--g2', '#7C5CFF'); p.style.setProperty('--acc', '#7EF0C8'); p.style.setProperty('--on', '#04261D'); });
K.init();
</script>
