  <div class="gls">ОБУЧЕНИЕ</div><div class="gr sf">${row(icon('bolt', 's22'), 'Настройки обучения', '', '›')}${row(icon('chat', 's22'), 'Уведомления', '', 'Вкл ›')}${row(icon('layers', 's22'), 'Темы', '', 'Графит ›')}</div>
  <div class="gls">PHRASEMAN PLUS</div><div class="gr sf">${row(icon('bolt', 's22'), 'Подписка Plus', '', 'Не активна ›')}${row(icon('bookmark', 's22'), 'Ввести промокод', '', '›')}</div>${nav(4)}</div>`;
const dialogs = () => `<div class="nb"><div class="h1" style="font-size:36px;line-height:42px;margin-bottom:6px">Диалоги</div><div style="font-size:16px;color:var(--sc);margin:0 4px 6px">Практикуйте язык в жизненных ситуациях</div>
  <div class="dc sf on" style="margin-top:18px"><span class="ti">${icon('chat', 's26')}</span><div class="x">Свободный разговор<span class="pp">PLUS</span><s>Практика без сценария</s></div>${icon('fwd', 's20')}</div>
  ${[['bolt', 'Каждый день', 'Повседневные диалоги', '0/11'], ['play', 'Путешествия', 'В поездках и на отдыхе', '0/8'], ['people', 'Общение', 'Знакомства и разговоры', '0/13'], ['layers', 'Ситуации', 'Разные жизненные сценарии', '0/19']].map(([ic, t, s, c]) => `<div class="dc sf"><span class="ti">${icon(ic, 's26')}</span><div class="x">${t}<s>${s}</s></div><span class="f">${c} ›</span></div>`).join('')}${nav(1)}</div>`;
const pack = (n, t, a, plus) => `<div class="pk sf"><div class="ct"><b>${n}</b><span>карточек</span></div><div class="bx"><div class="tt">${t}</div><div class="au">${a}</div></div><span class="rd">${plus ? icon('plus', 's22') : icon('fwd', 's20')}</span></div>`;
const cards = () => `<div class="nb"><div class="h1">Карточки</div><div style="font-size:16px;color:var(--sc);margin:-8px 4px 0">Учите слова и фразы эффективнее</div><div class="sh" style="margin-top:20px">Лучшее у сообщества<a>Смотреть все ›</a></div>
  ${pack(49, 'B2 глаголы', 'Ирина · ♥ 3 · 11 добавили', true)}${pack(20, 'Family', 'Лидия · ♥ 4 · 9 добавили', true)}
  <div class="sh" style="margin-top:20px">Ваши карточки</div>${row(icon('bookmark', 's22'), 'Сохранённые', 'Личная коллекция', '›', { on: 1 })}${row(icon('layers', 's22'), 'Мои наборы', 'Созданные и добавленные', '›')}
  <div class="cta" style="margin-top:20px">Тренироваться с карточками →</div>${nav(1)}</div>`;
const lessons = () => `<div class="nb"><div class="hrow" style="margin-top:12px"><div class="h1" style="flex:1;margin:0">Обучение</div><span class="pl sf">${coinImg(5, 20)}<b>1 240</b></span><span class="pl sf">${icon('bolt', 's20')}<b>5</b></span></div>
  <div class="srch"><div class="f sf">${icon('search', 's18')}Урок или тема</div><span class="cir sf">${svg('<path d="M3.5 7h3.2c3.3 0 5 2.4 6.6 5s3.3 5 6.6 5H21M3.5 17h3.2c1.5 0 2.7-.5 3.7-1.4M13.3 8.4c.9-.9 2.1-1.4 3.4-1.4H21"/>')}</span></div>
  <div class="lv"><span class="l">A1</span><span class="c">2 из 8</span></div>
  ${[[1, 'Местоимения и глагол To Be', 3], [2, 'Отрицание и вопросы (To Be)', 2], [3, 'Present Simple: Утверждение', 0], [4, 'Present Simple: Отрицание', 0]].map(([n, t, s], i) => `<div class="lcd sf${i === 2 ? ' on' : ''}"><span class="n">${n}</span><span class="x">${t}</span><span class="s">${[1, 2, 3].map((k) => STAR(k <= s)).join('')}</span></div>`).join('')}${nav(1)}</div>`;
const S = [['Главная', home, 'Приказ владельца 11.10: «Сегодня» — без фона; остальные плашки — фон 50 % (текст и значки 100 %), без тёмных пятен. Тень — как у «Тени».'], ['Настройки', settings, 'Группа — одна плашка, строки внутри без своих плашек, между ними тон-разделитель.'], ['Диалоги', dialogs, '«Свободный разговор» приподнят; категории — плашки с мягкой тенью.'], ['Карточки · хаб', cards, 'Плашки наборов высотой 85; «Сохранённые» приподняты; кнопка действия — цвет темы с цветной тенью.'], ['Обучение', lessons, 'Строки уроков — плашки с тенью; текущий урок приподнят.']];
const grid = (lite) => S.map(([n, f, d]) => `<div class="col"><div class="lbl">${n}</div>${phone(f(), {}).replace('class="ph"', `class="ph${lite ? ' lite' : ''}"`)}<div class="vnt">${d}</div></div>`).join('');
document.getElementById('root').innerHTML = `<section class="block" id="dark"><h2>Тёмная «Аврора»</h2><div class="phones">${grid(false)}</div></section><section class="block" id="light"><h2>Светлая тема</h2><div class="phones">${grid(true)}</div></section>`;
K.init();
const THEMES = [['Аврора', '#38E0AA', '#7C5CFF', '#7EF0C8', '#04261D'], ['Ирис', '#788CFF', '#FF78C8', '#C7C9FF', '#1B1C4A'], ['Магма', '#FF5A28', '#FFAA3C', '#FFB27A', '#3A1204'],
  ['Полночь', '#286EFF', '#00D2FF', '#8CC4FF', '#06224D'], ['Нефрит', '#14BEA0', '#1E78C8', '#7FE6D2', '#032A24'], ['Орхидея', '#D246FF', '#FF3C8C', '#EAA6FF', '#3A0A4A']];
let theme = 0;
const LITE06 = [['#579B84', '#04261D'], ['#8384A5', '#000000'], ['#A47656', '#000000'], ['#5F81A5', '#000000'], ['#57958A', '#000000'], ['#986FA5', '#000000']]; // зачем (координатор 12.10): светлый телефон = «Пастель» нашего генератора на level 0,6 (аврора light: акцент #579B84), чтобы ссылка theme=…&level=0.6&appearance=light давала совпадение; было color-mix(g1 78%, #000)
const applyTheme = () => { const Th = THEMES[theme]; document.querySelectorAll('.ph').forEach((p) => { p.style.setProperty('--g1', Th[1]); p.style.setProperty('--g2', Th[2]); if (p.classList.contains('lite')) { p.style.setProperty('--acc', LITE06[theme][0]); p.style.setProperty('--on', LITE06[theme][1]); } else { p.style.setProperty('--acc', Th[3]); p.style.setProperty('--on', Th[4]); } }); document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('on', i === theme)); };
document.getElementById('chips').innerHTML = THEMES.map((Th, i) => `<span class="chip" data-i="${i}"><i class="sw" style="background:linear-gradient(135deg,${Th[1]},${Th[2]})"></i>${Th[0]}</span>`).join('');
document.getElementById('chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (!c) return; theme = +c.dataset.i; applyTheme(); });
applyTheme();
})();
</script>
