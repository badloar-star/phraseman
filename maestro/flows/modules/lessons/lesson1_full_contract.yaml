appId: app.phraseman
---
- runFlow: ../../_dismiss_bug_hunt.yaml
- runFlow: ../../_precondition.yaml
- runFlow:
    when:
      visible: "Открыть все"
    commands:
      - pressKey: Back
- runFlow:
    when:
      visible: "Перейти к карточкам"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 90000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "home-continue-lesson"
    timeout: 45000
- tapOn:
    point: "50%,53%"
- extendedWaitUntil:
    visible: "Начать урок"
    timeout: 30000
- tapOn:
    text: "Начать урок"
- runFlow:
    when:
      visible: "Совет"
    commands:
      - tapOn: "Начать урок"
- runFlow:
    when:
      visible: "Слова этого урока"
    commands:
      - tapOn: "Начать урок"
- runFlow:
    when:
      visible: "Порада"
    commands:
      - tapOn: "Почати урок"
- runFlow:
    when:
      visible:
        id: "lesson-intro-skip"
    commands:
      - tapOn:
          id: "lesson-intro-skip"
- extendedWaitUntil:
    visible:
      id: "lesson1-header-back"
    timeout: 30000

# Variant 1: one intentionally wrong pick must produce a result state and allow continuing.
- runFlow:
    when:
      visible:
        id: "lesson1-word-option-0"
    commands:
      - tapOn:
          id: "lesson1-word-option-0"
- runFlow:
    when:
      visible:
        id: "lesson1-word-option-1"
    commands:
      - tapOn:
          id: "lesson1-word-option-1"
- extendedWaitUntil:
    visible:
      id: "lesson1-next"
    timeout: 10000
- tapOn:
    id: "lesson1-next"

# Variant 2: 50/50 must keep the correct option tappable.
- extendedWaitUntil:
    visible:
      id: "lesson1-fifty-fifty"
    timeout: 10000
- tapOn:
    id: "lesson1-fifty-fifty"
- extendedWaitUntil:
    visible:
      id: "lesson1-word-option-correct"
    timeout: 10000
- repeat:
    times: 25
    commands:
      - runFlow:
          when:
            visible:
              id: "lesson1-word-option-correct"
          commands:
            - tapOn:
                id: "lesson1-word-option-correct"
- extendedWaitUntil:
    visible:
      id: "lesson1-next"
    timeout: 10000
- tapOn:
    id: "lesson1-next"

# Finish the whole 50-question lesson by repeatedly tapping the current correct token.
- repeat:
    times: 70
    commands:
      - repeat:
          times: 25
          commands:
            - runFlow:
                when:
                  visible:
                    id: "lesson1-word-option-correct"
                commands:
                  - tapOn:
                      id: "lesson1-word-option-correct"
      - waitForAnimationToEnd:
          timeout: 1200
      - runFlow:
          when:
            visible:
              id: "lesson1-next"
          commands:
            - tapOn:
                id: "lesson1-next"
      - runFlow:
          when:
            visible:
              id: "lesson-complete-screen"
          commands:
            - assertVisible:
                id: "lesson-complete-screen"

- extendedWaitUntil:
    visible:
      id: "lesson-complete-screen"
    timeout: 45000
- assertVisible:
    id: "lesson-complete-repeat"
- assertVisible:
    id: "lesson-complete-back-home"
