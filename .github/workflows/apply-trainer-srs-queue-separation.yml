name: Apply trainer and SRS queue separation

on:
  push:
    branches:
      - fix/trainer-srs-queue-separation-2026-08-07

permissions:
  contents: write

concurrency:
  group: apply-trainer-srs-queue-separation
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/trainer-srs-queue-separation-2026-08-07
          fetch-depth: 0

      - name: Apply narrow queue-accounting patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/trainer_words_session.tsx)" = "7a8e9eaf53661d100e09b22ef8dad570ad0a11c8"
          test "$(git hash-object app/trainer_phrases_session.tsx)" = "bec6ba2de8c0762f20bc36eff2e5e9379e63bb02"
          python <<'PY'
          from pathlib import Path

          words_path = Path('app/trainer_words_session.tsx')
          words = words_path.read_text()
          word_replacements = [
              ("  const dailySessionTracked = useRef(false);\n", ""),
              (
                  "    if (!dailySessionTracked.current) {\n      dailySessionTracked.current = true;\n      updates.push({ type: 'recall_session', increment: 1 });\n    }\n",
                  "    // «Моя практика» продвигает только собственный trainer_words-вызов.\n    // SRS recall_* принадлежит исключительно экрану /review.\n",
              ),
              ("      updates.push({ type: 'recall_answers', increment: 1 });\n", ""),
              ("      if (deck.length >= 5 && nextWrong === 0) updates.push({ type: 'recall_perfect', increment: 1 });\n", ""),
          ]
          for old, new in word_replacements:
              if words.count(old) != 1:
                  raise SystemExit(f'word trainer marker drifted: {old!r}')
              words = words.replace(old, new, 1)
          words_path.write_text(words)

          phrases_path = Path('app/trainer_phrases_session.tsx')
          phrases = phrases_path.read_text()
          phrase_replacements = [
              ("  const dailySessionTracked = useRef(false);\n", ""),
              (
                  "      if (!dailySessionTracked.current) {\n        dailySessionTracked.current = true;\n        updates.push({ type: 'recall_session', increment: 1 });\n      }\n",
                  "      // «Моя практика» продвигает только trainer_phrases/trainer_arena.\n      // SRS recall_* принадлежит исключительно экрану /review.\n",
              ),
              ("        updates.push({ type: 'recall_answers', increment: 1 });\n", ""),
              (
                  "      if (deck.length >= 5 && wrong === 0) {\n        updateMultipleTaskProgress([{ type: 'recall_perfect', increment: 1 }], { studyTarget }).catch(() => {});\n      }\n",
                  "",
              ),
          ]
          for old, new in phrase_replacements:
              if phrases.count(old) != 1:
                  raise SystemExit(f'phrase trainer marker drifted: {old!r}')
              phrases = phrases.replace(old, new, 1)
          phrases_path.write_text(phrases)

          Path('tests/trainer_daily_task_queue_separation_contract.test.ts').write_text("""import fs from 'fs';
          import path from 'path';

          const ROOT = path.resolve(__dirname, '..');
          const read = (relative: string): string =>
            fs.readFileSync(path.join(ROOT, relative), 'utf8').replace(/\\r\\n/g, '\\n');

          const words = read('app/trainer_words_session.tsx');
          const phrases = read('app/trainer_phrases_session.tsx');

          describe('trainer and SRS daily-task queue separation', () => {
            it('word trainer advances only its own trainer_words challenge', () => {
              expect(words).toContain(\"updates.push({ type: 'trainer_words', increment: 1 });\");
              expect(words).not.toContain(\"type: 'recall_session'\");
              expect(words).not.toContain(\"type: 'recall_answers'\");
              expect(words).not.toContain(\"type: 'recall_perfect'\");
              expect(words).not.toContain('dailySessionTracked');
            });

            it('phrase trainer advances only phrase/arena trainer challenges', () => {
              expect(phrases).toContain(\"card.item.queue === 'arena' ? 'trainer_arena' : 'trainer_phrases'\");
              expect(phrases).not.toContain(\"type: 'recall_session'\");
              expect(phrases).not.toContain(\"type: 'recall_answers'\");
              expect(phrases).not.toContain(\"type: 'recall_perfect'\");
              expect(phrases).not.toContain('dailySessionTracked');
            });

            it('keeps energy-spend challenge accounting in both trainer modes', () => {
              expect(words).toContain(\"type: 'energy_spend'\");
              expect(phrases).toContain(\"type: 'energy_spend'\");
            });
          });
          """.replace('          ', ''))
          PY

      - name: Verify exact result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object app/trainer_words_session.tsx)" = "670c2fe73a046a658856e32ceb89be744db89024"
          test "$(git hash-object app/trainer_phrases_session.tsx)" = "87c259b473f1f43427e21550ccf14e08e4e827b7"
          test "$(git hash-object tests/trainer_daily_task_queue_separation_contract.test.ts)" = "ed7cc040316071779ad26d238af4a76cddd40ef4"
          python <<'PY'
          from pathlib import Path
          words = Path('app/trainer_words_session.tsx').read_text()
          phrases = Path('app/trainer_phrases_session.tsx').read_text()
          assert "updates.push({ type: 'trainer_words', increment: 1 });" in words
          assert "card.item.queue === 'arena' ? 'trainer_arena' : 'trainer_phrases'" in phrases
          for source in (words, phrases):
              assert "type: 'recall_session'" not in source
              assert "type: 'recall_answers'" not in source
              assert "type: 'recall_perfect'" not in source
              assert 'dailySessionTracked' not in source
              assert "type: 'energy_spend'" in source
          PY
          npx --yes esbuild@0.25.8 app/trainer_words_session.tsx --bundle --loader:.tsx=tsx --format=esm --outfile=/tmp/trainer_words.js --external:'*'
          npx --yes esbuild@0.25.8 app/trainer_phrases_session.tsx --bundle --loader:.tsx=tsx --format=esm --outfile=/tmp/trainer_phrases.js --external:'*'
          npx --yes esbuild@0.25.8 tests/trainer_daily_task_queue_separation_contract.test.ts --bundle --loader:.ts=ts --format=cjs --outfile=/tmp/trainer_contract.js --external:'*'

      - name: Commit product-only result and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-trainer-srs-queue-separation.yml
          git add app/trainer_words_session.tsx app/trainer_phrases_session.tsx tests/trainer_daily_task_queue_separation_contract.test.ts
          git diff --cached --check
          git diff --cached --name-only | grep -v '^.github/workflows/apply-trainer-srs-queue-separation.yml$' | sort > /tmp/actual.txt
          printf '%s\n' app/trainer_phrases_session.tsx app/trainer_words_session.tsx tests/trainer_daily_task_queue_separation_contract.test.ts | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate trainer and SRS daily-task accounting'
          git push origin HEAD:fix/trainer-srs-queue-separation-2026-08-07
