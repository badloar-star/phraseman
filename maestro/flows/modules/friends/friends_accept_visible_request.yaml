# Accepts the first visible friend request on the current account.
appId: app.phraseman
---
- launchApp
- runFlow: ../../_dismiss_bug_hunt.yaml
- runFlow: ../../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "tab-friends"
- extendedWaitUntil:
    visible:
      id: "screen-friends"
    timeout: 30000
- runFlow:
    when:
      visible: "Принять"
    commands:
      - tapOn: "Принять"
- runFlow:
    when:
      visible: "Прийняти"
    commands:
      - tapOn: "Прийняти"
- runFlow:
    when:
      visible: "Aceptar"
    commands:
      - tapOn: "Aceptar"
- runFlow:
    when:
      visible:
        id: "screen-friends"
    commands:
      # Fold/tablet fallback: text taps can hit the label instead of the pressable
      # on some RN layouts, so tap the first visible accept button area.
      - tapOn:
          point: "69%,32%"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: "screen-friends"
