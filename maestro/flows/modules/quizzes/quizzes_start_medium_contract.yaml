# Opens the quiz level selector, starts Medium, and verifies the game screen
# appears. Guards against regressions where the start animation finishes but
# the selector remains stuck with dead buttons.
appId: app.phraseman
---
- runFlow: ../../_shared/boot_to_home_fast.yaml
- extendedWaitUntil:
    visible:
      id: "home-quick-quizzes"
    timeout: 60000
- tapOn:
    id: "home-quick-quizzes"
- extendedWaitUntil:
    visible:
      id: "quiz-level-select-back"
    timeout: 20000
- tapOn:
    id: "quiz-level-card-medium"
- tapOn:
    id: "quiz-level-start-medium"
- extendedWaitUntil:
    visible:
      id: "quiz-game-screen"
    timeout: 15000
