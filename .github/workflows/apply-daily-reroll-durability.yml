name: Apply durable Daily Challenge reroll

on:
  push:
    branches:
      - fix/daily-reroll-durability-2026-08-07

permissions:
  contents: write

concurrency:
  group: apply-daily-reroll-durability
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/daily-reroll-durability-2026-08-07
          fetch-depth: 0

      - name: Apply authoritative-state reroll patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/daily_tasks.ts)" = "fe200d04a19e4c3d6537732620bbf2ff91cbf8d9"
          test "$(git hash-object tests/daily_task_reroll.test.ts)" = "677c0d90c58c7e9e8280a29dfd29d48a673ff8b6"
          python <<'PY'
          from pathlib import Path

          path = Path('app/daily_tasks.ts')
          source = path.read_text()
          old_helpers = '''const emptyRerollState = (): RerollState => ({ dayKey: getTodayKey(), replacements: {} });

          const loadRerollStateRaw = async (studyTarget?: RuntimeStudyTarget): Promise<RerollState> => {
            try {
              const raw = await AsyncStorage.getItem(dailyTasksRerollKey(studyTarget));
              if (!raw) return emptyRerollState();
              const parsed = JSON.parse(raw) as RerollState;
              // Сутки кончились — стираем замены, иначе вчерашние ID попадут в сегодняшнюю тройку.
              if (!parsed || parsed.dayKey !== getTodayKey()) return emptyRerollState();
              if (!parsed.replacements || typeof parsed.replacements !== 'object') return emptyRerollState();
              return parsed;
            } catch {
              return emptyRerollState();
            }
          };

          const saveRerollState = async (
            state: RerollState,
            studyTarget?: RuntimeStudyTarget,
          ): Promise<void> => {
            try {
              await AsyncStorage.setItem(dailyTasksRerollKey(studyTarget), JSON.stringify(state));
            } catch (e) {
              if (__DEV__) console.warn('[daily_tasks]', e);
            }
          };
          '''.replace('          ', '')
          new_helpers = '''const emptyRerollState = (): RerollState => ({ dayKey: getTodayKey(), replacements: {} });

          const parseRerollState = (raw: string | null): RerollState => {
            if (!raw) return emptyRerollState();
            const parsed: unknown = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
              throw new Error('invalid_daily_task_reroll_state');
            }
            const candidate = parsed as Partial<RerollState>;
            // Сутки кончились — вчерашняя запись семантически равна пустой сегодняшней.
            if (candidate.dayKey !== getTodayKey()) return emptyRerollState();
            if (!candidate.replacements || typeof candidate.replacements !== 'object' || Array.isArray(candidate.replacements)) {
              throw new Error('invalid_daily_task_reroll_replacements');
            }
            const replacements: Record<string, string> = {};
            for (const [oldTaskId, newTaskId] of Object.entries(candidate.replacements)) {
              if (!oldTaskId.trim() || typeof newTaskId !== 'string' || !newTaskId.trim()) {
                throw new Error('invalid_daily_task_reroll_entry');
              }
              replacements[oldTaskId] = newTaskId;
            }
            return { dayKey: candidate.dayKey, replacements };
          };

          /** Critical reader: a storage/JSON failure must not look like an unused reroll allowance. */
          const loadRerollStateStrict = async (studyTarget?: RuntimeStudyTarget): Promise<RerollState> => (
            parseRerollState(await AsyncStorage.getItem(dailyTasksRerollKey(studyTarget)))
          );

          /** Tolerant reader for non-mutating UI paths. The locked commit always rechecks strictly. */
          const loadRerollStateRaw = async (studyTarget?: RuntimeStudyTarget): Promise<RerollState> => {
            try {
              return await loadRerollStateStrict(studyTarget);
            } catch {
              return emptyRerollState();
            }
          };

          const saveRerollStateStrict = async (
            state: RerollState,
            studyTarget?: RuntimeStudyTarget,
          ): Promise<void> => {
            const key = dailyTasksRerollKey(studyTarget);
            const serialized = JSON.stringify(state);
            await AsyncStorage.setItem(key, serialized);
            const verified = await AsyncStorage.getItem(key);
            if (verified !== serialized) {
              throw new Error('daily_task_reroll_state_not_persisted');
            }
          };

          /**
           * Progress is a derived cache: the reroll mapping is the only source of truth.
           * Once that mapping is durably verified, a progress-write failure must not turn a
           * successful reroll into a false error. loadTodayProgress() can reconstruct the
           * missing replacement row on the next refresh.
           *
           * Caller owns withStorageLock.
           */
          const writeDerivedRerollProgressBestEffort = async (
            todayKey: string,
            oldTaskIds: readonly string[],
            replacementTasks: readonly DailyTask[],
            studyTarget?: RuntimeStudyTarget,
          ): Promise<void> => {
            const key = dailyTasksProgressKey(todayKey, studyTarget);
            try {
              const raw = await AsyncStorage.getItem(key);
              const parsed: unknown = raw ? JSON.parse(raw) : [];
              if (!Array.isArray(parsed)) throw new Error('invalid_daily_task_progress_for_reroll');
              const oldIds = new Set(oldTaskIds);
              const filtered = (parsed as TaskProgress[]).filter((row) => !oldIds.has(row.taskId));
              const seeded = replacementTasks.map((task): TaskProgress => (
                task.type === 'arena_plays_wins_combo'
                  ? reconcileArenaComboRow(task, undefined)
                  : { taskId: task.id, current: 0, completed: false, claimed: false }
              ));
              const serialized = JSON.stringify([...filtered, ...seeded]);
              await AsyncStorage.setItem(key, serialized);
              const verified = await AsyncStorage.getItem(key);
              if (verified !== serialized) throw new Error('daily_task_reroll_progress_not_persisted');
              void pruneDatedDailyTasksStorageKeys([key]).catch(() => {});
            } catch (error) {
              DebugLogger.error('daily_tasks:writeDerivedRerollProgressBestEffort', error, 'warning');
            }
          };
          '''.replace('          ', '')
          if source.count(old_helpers) != 1:
              raise SystemExit('reroll helper block drifted')
          source = source.replace(old_helpers, new_helpers, 1)

          old_single = '''    const reserved = await withStorageLock(async (): Promise<boolean> => {
            const state = await loadRerollStateRaw(studyTarget);
            const replacements = state.replacements ?? {};
            // Повторный реролл того же задания заменяет свою же запись — лимит не тратится дважды.
            const isReplacingOwnEntry = Object.prototype.hasOwnProperty.call(replacements, taskId);
            if (!isReplacingOwnEntry && Object.keys(replacements).length >= DAILY_TASK_REROLL_MAX_PER_DAY) {
              return false;
            }
            await saveRerollState({ dayKey: todayKey, replacements: { ...replacements, [taskId]: candidate.id } }, studyTarget);
            return true;
          });
          if (!reserved) return { ok: false, reason: 'limit_reached' };

          // Замена бесплатная: резерв сразу обнуляет прогресс старой карточки.
          await withStorageLock(async () => {
            const key = dailyTasksProgressKey(todayKey, studyTarget);
            const raw = await AsyncStorage.getItem(key);
            const arr: TaskProgress[] = raw ? (JSON.parse(raw) as TaskProgress[]) : [];
            const filtered = Array.isArray(arr) ? arr.filter((p) => p.taskId !== taskId) : [];
            const seed: TaskProgress =
              candidate.type === 'arena_plays_wins_combo'
                ? reconcileArenaComboRow(candidate, undefined)
                : { taskId: candidate.id, current: 0, completed: false, claimed: false };
            filtered.push(seed);
            await AsyncStorage.setItem(key, JSON.stringify(filtered));
            void pruneDatedDailyTasksStorageKeys([key]).catch(() => {});
          });
          '''.replace('          ', '')
          new_single = '''    const committed = await withStorageLock(async (): Promise<boolean> => {
            // Critical mutation path: never convert a read/parse failure into an empty
            // allowance, otherwise a damaged storage read could grant a second reroll.
            const state = await loadRerollStateStrict(studyTarget);
            const replacements = state.replacements;
            const isReplacingOwnEntry = Object.prototype.hasOwnProperty.call(replacements, taskId);
            if (!isReplacingOwnEntry && Object.keys(replacements).length >= DAILY_TASK_REROLL_MAX_PER_DAY) {
              return false;
            }

            // The verified mapping is authoritative. Derived progress is repaired in the
            // same lock when possible, but its failure cannot invalidate this committed reroll.
            await saveRerollStateStrict({
              dayKey: todayKey,
              replacements: { ...replacements, [taskId]: candidate.id },
            }, studyTarget);
            await writeDerivedRerollProgressBestEffort(todayKey, [taskId], [candidate], studyTarget);
            return true;
          });
          if (!committed) return { ok: false, reason: 'limit_reached' };
          '''.replace('          ', '')
          if source.count(old_single) != 1:
              raise SystemExit('single reroll block drifted')
          source = source.replace(old_single, new_single, 1)

          old_set = '''    await withStorageLock(async () => {
            const state = await loadRerollStateRaw(studyTarget);
            await saveRerollState({
              dayKey: getTodayKey(),
              replacements: { ...state.replacements, ...replacements },
            }, studyTarget);

            const key = dailyTasksProgressKey(getTodayKey(), studyTarget);
            const raw = await AsyncStorage.getItem(key);
            const arr: TaskProgress[] = raw ? (JSON.parse(raw) as TaskProgress[]) : [];
            const oldIds = new Set(tasks.map((task) => task.id));
            const filtered = Array.isArray(arr) ? arr.filter((p) => !oldIds.has(p.taskId)) : [];
            const seeded = replacementTasks.map((task) => (
              task.type === 'arena_plays_wins_combo'
                ? reconcileArenaComboRow(task, undefined)
                : { taskId: task.id, current: 0, completed: false, claimed: false }
            ));
            await AsyncStorage.setItem(key, JSON.stringify([...filtered, ...seeded]));
            void pruneDatedDailyTasksStorageKeys([key]).catch(() => {});
          });
          '''.replace('          ', '')
          new_set = '''    const todayKey = getTodayKey();
            const committed = await withStorageLock(async (): Promise<boolean> => {
              const state = await loadRerollStateStrict(studyTarget);
              if (Object.keys(state.replacements).length >= DAILY_TASK_REROLL_MAX_PER_DAY) {
                return false;
              }
              await saveRerollStateStrict({
                dayKey: todayKey,
                replacements: { ...state.replacements, ...replacements },
              }, studyTarget);
              await writeDerivedRerollProgressBestEffort(
                todayKey,
                tasks.map((task) => task.id),
                replacementTasks,
                studyTarget,
              );
              return true;
            });
            if (!committed) return { ok: false, reason: 'limit_reached' };
          '''.replace('          ', '')
          if source.count(old_set) != 1:
              raise SystemExit('set reroll block drifted')
          source = source.replace(old_set, new_set, 1)
          path.write_text(source)

          contract = Path('tests/daily_task_reroll_durability_contract.test.ts')
          contract.write_text("""import fs from 'fs';
          import path from 'path';

          const ROOT = path.resolve(__dirname, '..');
          const source = fs
            .readFileSync(path.join(ROOT, 'app/daily_tasks.ts'), 'utf8')
            .replace(/\\r\\n/g, '\\n');

          function slice(start: string, end: string): string {
            const from = source.indexOf(start);
            const to = source.indexOf(end, from + start.length);
            expect(from).toBeGreaterThanOrEqual(0);
            expect(to).toBeGreaterThan(from);
            return source.slice(from, to);
          }

          describe('daily reroll durability contract', () => {
            it('uses strict state reads and verifies the authoritative write', () => {
              const save = slice('const saveRerollStateStrict', '/**\\n * Progress is a derived cache');
              expect(source).toContain('const loadRerollStateStrict');
              expect(save).toContain('await AsyncStorage.setItem(key, serialized);');
              expect(save).toContain('const verified = await AsyncStorage.getItem(key);');
              expect(save).toContain(\"throw new Error('daily_task_reroll_state_not_persisted')\");
              expect(save).not.toContain('catch');
            });

            it('commits the mapping before best-effort derived progress', () => {
              const reroll = slice('export const rerollDailyTask', '// ── Рантайм-доступность');
              const stateWrite = reroll.indexOf('await saveRerollStateStrict({');
              const progressWrite = reroll.indexOf('await writeDerivedRerollProgressBestEffort');
              expect(stateWrite).toBeGreaterThanOrEqual(0);
              expect(progressWrite).toBeGreaterThan(stateWrite);
              expect(reroll).toContain('const state = await loadRerollStateStrict(studyTarget);');
              expect(reroll).not.toContain('await saveRerollState(');
            });

            it('treats progress as recoverable derived data', () => {
              const progress = slice('const writeDerivedRerollProgressBestEffort', '/** Сколько замен ещё доступно сегодня. */');
              expect(progress).toContain(\"DebugLogger.error('daily_tasks:writeDerivedRerollProgressBestEffort'\");
              expect(progress).toContain(\"throw new Error('daily_task_reroll_progress_not_persisted')\");
              expect(progress).toContain('catch (error)');
            });
          });
          """.replace('          ', ''))

          test_path = Path('tests/daily_task_reroll.test.ts')
          test_source = test_path.read_text()
          import_marker = "  getTodayTasksSafe,\n  DAILY_TASK_REROLL_COST_SHARDS,"
          if test_source.count(import_marker) != 1:
              raise SystemExit('reroll test import marker drifted')
          test_source = test_source.replace(
              import_marker,
              "  getTodayTasksSafe,\n  loadTodayProgress,\n  DAILY_TASK_REROLL_COST_SHARDS,",
              1,
          )
          insert = r'''

            it('does not mutate progress when the authoritative reroll state write fails', async () => {
              const tasks = await getTodayTasksSafe();
              const target = tasks[0]!.id;
              const progressKey = dailyTasksProgressKey(getTodayKey());
              const rerollKey = dailyTasksRerollKey();
              const originalProgress = JSON.stringify(tasks.map((task) => ({
                taskId: task.id, current: 0, completed: false, claimed: false,
              })));
              mockStorage[progressKey] = originalProgress;
              (AsyncStorage.setItem as jest.Mock).mockImplementation((key: string, value: string) => {
                if (key === rerollKey) return Promise.reject(new Error('disk_full'));
                mockStorage[key] = value;
                return Promise.resolve();
              });

              await expect(rerollDailyTask(target)).resolves.toEqual({ ok: false, reason: 'unknown' });
              expect(mockStorage[rerollKey]).toBeUndefined();
              expect(mockStorage[progressKey]).toBe(originalProgress);
            });

            it('rejects a reroll when read-after-write cannot prove the mapping persisted', async () => {
              const tasks = await getTodayTasksSafe();
              const target = tasks[0]!.id;
              const progressKey = dailyTasksProgressKey(getTodayKey());
              const rerollKey = dailyTasksRerollKey();
              const originalProgress = JSON.stringify(tasks.map((task) => ({
                taskId: task.id, current: 0, completed: false, claimed: false,
              })));
              mockStorage[progressKey] = originalProgress;
              (AsyncStorage.setItem as jest.Mock).mockImplementation((key: string, value: string) => {
                if (key === rerollKey) return Promise.resolve();
                mockStorage[key] = value;
                return Promise.resolve();
              });

              await expect(rerollDailyTask(target)).resolves.toEqual({ ok: false, reason: 'unknown' });
              expect(mockStorage[rerollKey]).toBeUndefined();
              expect(mockStorage[progressKey]).toBe(originalProgress);
            });

            it('keeps a verified reroll successful when only derived progress persistence fails', async () => {
              const tasks = await getTodayTasksSafe();
              const target = tasks[0]!.id;
              const progressKey = dailyTasksProgressKey(getTodayKey());
              const rerollKey = dailyTasksRerollKey();
              const originalProgress = JSON.stringify(tasks.map((task) => ({
                taskId: task.id, current: 0, completed: false, claimed: false,
              })));
              mockStorage[progressKey] = originalProgress;
              let rerollCommitted = false;
              (AsyncStorage.setItem as jest.Mock).mockImplementation((key: string, value: string) => {
                if (key === rerollKey) {
                  mockStorage[key] = value;
                  rerollCommitted = true;
                  return Promise.resolve();
                }
                if (key === progressKey && rerollCommitted) {
                  return Promise.reject(new Error('progress_write_failed'));
                }
                mockStorage[key] = value;
                return Promise.resolve();
              });

              const result = await rerollDailyTask(target);
              expect(result.ok).toBe(true);
              if (!result.ok) throw new Error('expected successful reroll');
              expect(JSON.parse(mockStorage[rerollKey]!).replacements[target]).toBe(result.newTaskId);
              expect(mockStorage[progressKey]).toBe(originalProgress);

              (AsyncStorage.setItem as jest.Mock).mockImplementation((key: string, value: string) => {
                mockStorage[key] = value;
                return Promise.resolve();
              });
              const tasksAfter = await getTodayTasksSafe();
              expect(tasksAfter.some((task) => task.id === target)).toBe(false);
              expect(tasksAfter.some((task) => task.id === result.newTaskId)).toBe(true);
              const repaired = await loadTodayProgress(tasksAfter);
              expect(repaired.find((row) => row.taskId === result.newTaskId)).toMatchObject({
                current: 0, completed: false, claimed: false,
              });
            });
          '''.replace('            ', '')
          end = test_source.rfind('\n});')
          if end < 0:
              raise SystemExit('reroll test suite end marker missing')
          test_source = test_source[:end] + insert + test_source[end:]
          test_path.write_text(test_source)
          PY

      - name: Validate focused behavior
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object app/daily_tasks.ts)" = "cf12500135b3b1185f1c483ae72dec7cac23f9da"
          test "$(git hash-object tests/daily_task_reroll_durability_contract.test.ts)" = "671acbe62010cb8d59e6cd6cc67f675b818ab814"
          python <<'PY'
          from pathlib import Path
          source = Path('app/daily_tasks.ts').read_text()
          assert 'const loadRerollStateStrict' in source
          assert 'daily_task_reroll_state_not_persisted' in source
          assert 'writeDerivedRerollProgressBestEffort' in source
          assert 'await saveRerollState(' not in source
          PY
          npx --yes esbuild@0.25.8 app/daily_tasks.ts --bundle --loader:.ts=ts --format=esm --outfile=/tmp/daily_tasks.js --external:'*'
          npx --yes esbuild@0.25.8 tests/daily_task_reroll.test.ts --bundle --loader:.ts=ts --format=cjs --outfile=/tmp/reroll_test.js --external:'*'
          npx --yes esbuild@0.25.8 tests/daily_task_reroll_durability_contract.test.ts --bundle --loader:.ts=ts --format=cjs --outfile=/tmp/reroll_contract.js --external:'*'
          npx jest --no-cache --runInBand --runTestsByPath \
            tests/daily_task_reroll.test.ts \
            tests/daily_task_reroll_durability_contract.test.ts

      - name: Commit product-only result and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-daily-reroll-durability.yml
          git add app/daily_tasks.ts tests/daily_task_reroll.test.ts tests/daily_task_reroll_durability_contract.test.ts
          git diff --cached --check
          git diff --cached --name-only | grep -v '^.github/workflows/apply-daily-reroll-durability.yml$' | sort > /tmp/actual.txt
          printf '%s\n' app/daily_tasks.ts tests/daily_task_reroll.test.ts tests/daily_task_reroll_durability_contract.test.ts | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make Daily Challenge rerolls durable'
          git push origin HEAD:fix/daily-reroll-durability-2026-08-07
