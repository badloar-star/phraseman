appId: app.phraseman
---
- runFlow: ../../_shared/open_dev_client.yaml
- runFlow: ../../_dismiss_bug_hunt.yaml
- runFlow: ../../_precondition.yaml
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "10%,95%"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../_precondition.yaml
- scrollUntilVisible:
    element:
      id: "home-league-open"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 30
- tapOn:
    id: "home-league-open"
- extendedWaitUntil:
    visible:
      id: "club-tab-chat"
    timeout: 30000
- tapOn:
    id: "club-tab-chat"
- extendedWaitUntil:
    visible:
      id: "league-chat-panel"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "league-chat-input"
    timeout: 30000
- tapOn:
    id: "league-chat-input"
- inputText: "Maestro keyboard visibility"
- assertVisible:
    id: "league-chat-input"
- assertVisible: "Maestro keyboard visibility"
- assertVisible:
    id: "league-chat-send"
- hideKeyboard
