<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аккаунт — недостающие состояния</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="extension.css">
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="overlay-runtime.css">
<style>
  /* зачем (координатор 12.10, аудит покрытия первого выпуска): кадры авторизации и аккаунта, которых не было среди образцов. Все тексты — из кода приложения
     (app/account_details.tsx, app/account_switch_copy.ts, app/account_sync_copy.ts, app/account_backup_blocked_copy.ts, app/account_switch_still_running_copy.ts,
     app/account_delete_restore_prompt.ts, components/RegistrationPromptModal.tsx, components/DeleteAccountConfirmModal.tsx, app/(tabs)/settings.tsx). Стиль «Тень». */
  .ag-note { max-width: 430px; text-align: center; font-size: 13px; line-height: 18px; color: var(--sec); margin-top: -4px; }
  .ag-acc { background: var(--cta, #F2F3F6); color: var(--cta-ink, #111216); }
  .ag-del { color: #FF9A98; }
.ag-cfm-row{grid-template-columns:repeat(2,minmax(0,1fr))}.ag-cfm-row .cta{height:auto;min-height:52px;padding:8px 10px;line-height:1.15;white-space:normal;text-align:center}.ag-cfm-row .cta.gh{background:#3a3d46 !important;background-image:none !important;color:#fff !important;border:0 !important;box-shadow:none !important}.ag-cfm-row .cta.or-danger{background:#3a1e1c !important;background-image:none !important;color:#ff8c82 !important;border:0 !important;box-shadow:none !important}
</style>
<style>/* зачем (координатор 13.10, profile-030/auth-gap-009/010; код DeleteAccountConfirmModal): заголовок и текст окна удаления выровнены влево, подпись над полем — обычная 13/600 без капса */
.dm-left .modal-title, .dm-left .modal-copy { text-align: left; } .dm-left .modal-copy { font-size: 16px; line-height: 23px; margin-bottom: 18px; } .dm-left .eyebrow { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 600; margin-top: 0 !important; }</style>
</head>
<body>
<div class="page">
  <h1 class="page-h1">Аккаунт — недостающие состояния</h1>
  <p class="page-lead">Экран «Аккаунт» гостя, отказы окна входа, восстановление удалённого аккаунта, окна удаления и отказы смены аккаунта — по коду приложения. Окна выхода и прочие отказы удаления уже есть в overlays-runtime.html и profile.html.</p>
  <div id="root"></div>
</div>
<script src="kit.js"></script>
<script>
(() => {
const { icon, phone, block, coinImg } = K;
const col = (label, html, note) => `<article class="col"><div class="lbl">${label}</div>${html}${note ? `<div class="ag-note">${note}</div>` : ''}</article>`;
const chevron = `<span class="ch">${icon('fwd', 's18')}</span>`;

// ---------- экран «Аккаунт» (профиль-страница, как PRF-02) ----------
const back = (title) => `<div class="topbar"><button class="rb bare t" type="button" aria-label="Назад">${icon('back', 's21')}</button></div><div class="screen-title" style="margin-top:10px">${title}</div>`;
const row = (ic, title, sub = '', value = '', opts = {}) => `<div class="card list-row t${opts.red ? ' ag-del' : ''}"><div class="tile">${ic.startsWith('<') ? ic : icon(ic, 's20')}</div><div class="copy"><div class="title">${title}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${value ? `<div class="value">${value}</div>` : ''}${opts.chip ? opts.chip : ''}${opts.noChevron || value || opts.chip ? '' : chevron}</div>`;
const group = (title, rows) => `<div class="eyebrow" style="margin:24px 4px 10px">${title}</div><div class="list">${rows.join('')}</div>`;
const account = (o) => phone(`${back('Аккаунт')}<div class="center" style="margin-top:26px">${coinImg(5, 102)}<div class="section-title" style="margin-top:10px">${o.name || 'Не задано'}</div><button class="chipbtn t" type="button" style="margin-top:10px">Изменить имя</button></div>
  ${group('ДАННЫЕ', [
    row('user', 'Имя', 'Показывается друзьям', o.name || 'Не задано'),
    ...(o.linked ? [row('chat', 'Email', 'alex@example.com', '', { chip: `<button class="chipbtn t" type="button">${o.copied ? 'Скопировано' : 'Скопировать'}</button>` }), row('check', 'Способ входа', '', 'Google')] : [row('<svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>', 'Привязать аккаунт')]),
    row('trend', 'С нами с', '', '12.08.2025')])}
  ${group('АККАУНТ', [...(o.linked ? [row('arrowR', 'Выйти и войти под другим аккаунтом')] : []), row('trash', 'Удалить аккаунт', 'Требует отдельного подтверждения', '', { red: 1 })])}`, { time: '13:11' });

// ---------- окно входа (как overlays.html OV-AUTH-*) ----------
const ovUnder = (title = 'Главная') => `<div class="ov-underlay"><div class="topbar"><button class="rb bare" type="button" aria-label="Назад">${icon('back', 's22')}</button></div><div class="screen-title">${title}</div><div class="card ghost"></div><div class="card ghost"></div><div class="card ghost"></div></div>`;
const ovSheet = (content) => `<div class="ov-dim"></div><section class="sheet on ov-sheet" role="region"><div class="ov-grab" aria-hidden="true"></div>${content}</section>`;
const ovPhone = (content, title = 'Аккаунт', time = '9:41') => phone(ovUnder(title), { time, overlay: ovSheet(content) });
// зачем (координатор 13.10, auth-gap-003…006; код RegistrationPromptModal): Google — белая кнопка с «G», Apple — чёрная с яблоком, без значков-заглушек; ошибка входа — красный центрированный текст
const providerButton = (p) => `<button type="button" class="cta ov-provider t" style="${p === 'Google' ? 'background:#F2F1F6;color:#0B0C0E' : 'background:#000;color:#fff'};box-shadow:none;margin-top:10px"><span style="font-weight:800;font-size:18px;${p === 'Google' ? 'color:#4285F4' : ''}">${p === 'Google' ? 'G' : '&#63743;'}</span>Войти через ${p}</button>`;
const trust = `<div class="ov-trust">${icon('lockF', 's15')}Данные на устройстве сохранятся</div>`;
const later = `<button type="button" class="cta gh t" style="margin-top:10px">Позже</button>`;
// зачем (координатор 13.10, вердикт auth-gap-003/004/005): у кода RegistrationPromptModal подзаголовок «N день твоего пути уже сохранён», когда у гостя есть серия; без серии — «Твой путь сохранится и дождётся тебя». Окна ошибок входа видит гость с прогрессом, поэтому там вариант с днями.
const authHeadFor = (days) => `<div class="flex" style="justify-content:flex-end"><button class="rb fill t" type="button" aria-label="Закрыть">${icon('close', 's18')}</button></div><div class="flex" style="align-items:center;gap:14px;margin-top:2px"><span style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--sec)"><svg class="i s24" viewBox="0 0 24 24"><path d="M20 4c-6 0-11 3-13 9l-2 6 6-2c6-2 9-7 9-13z"/><path d="M8 16l7-7"/></svg></span><div><div class="ov-title ov-left">Всё в безопасности</div><div class="ov-body ov-left" style="margin-top:4px">${days ? `<b style="color:var(--text)">${days} ${days === 1 ? 'день' : days < 5 ? 'дня' : 'дней'}</b> твоего пути уже ${days === 1 ? 'сохранён' : 'сохранены'}` : 'Твой путь сохранится и дождётся тебя'}</div></div></div><div class="ov-body ov-left" style="margin-top:14px">Быстрый вход. Прогресс синхронизируется между устройствами.</div>`;
const authHead = authHeadFor(0);
// зачем: отказ входа — «ov-inline-error» (showInlineError: заголовок + текст), под ним либо «Повторить», либо «Сменить аккаунт» (RegistrationPromptModal.tsx:1205-1250, 1690-1710)
/* зачем (Авторизация 13.10, auth-gap-003): приложение ставит точку после заголовка ошибки, если там нет знака конца фразы (все 9 языков) — образец делает так же */
const authErr = (title, body, btnLabel, retry) => ovPhone(`${authHeadFor(1)}<div style="margin-top:18px">${providerButton('Google')}${providerButton('Apple')}</div><div style="margin-top:14px;text-align:center;color:#FF6B6B;font-size:15px;line-height:21px">${/[.!?…]$/.test(title) ? title : title + '.'}<br>${body}</div><button type="button" class="cta t" style="margin-top:14px;background:#F2F1F6;color:#0B0C0E">${btnLabel}</button>${trust}${later}<div class="center" style="margin-top:12px;font-size:14px;font-weight:700;line-height:22px">Политика конфиденциальности<br>Условия использования</div>`);

// ---------- системные окна (как overlays-runtime.html alertPhone) ----------
const orUnder = (title = 'Главная') => `<div class="or-underlay"><div class="topbar"><button class="rb bare" type="button" aria-label="Назад">${icon('back', 's22')}</button><span class="grow"></span><span class="pill">${title}</span></div><div class="screen-title">${title}</div><div class="card ghost"></div><div class="card ghost"></div><div class="card ghost"></div></div>`;
// зачем (координатор 13.10, auth-gap-013/016; Авторизация 0287d1a33): смена аккаунта в приложении живёт только в «Настройках» — окна открываются поверх главного экрана «Настройки» (профиль гостя «Войти», «Важное от Phraseman», группа «Обучение»), а не поверх «Аккаунта»
const orUnderSettings = () => `<div class="or-underlay"><div class="screen-title" style="margin-top:10px">Настройки</div><div class="card ghost" style="height:120px;margin-top:16px"></div><div class="card ghost" style="height:210px"></div><div class="card ghost" style="height:150px"></div></div>`;
// нижняя стеклянная шторка showGlassAlert с 3 действиями: заголовок слева, три строки — «Сохранить и сменить ›» (тёмная плашка), «Сменить без сохранения» (красная на красноватой плашке), «Остаться здесь» (серая)
const glassSheet3 = (title, rows) => `<div class="or-dim"></div><section class="modal or-region" role="region" style="left:0;right:0;bottom:0;top:auto;transform:none;border-radius:28px 28px 0 0;padding:14px 16px 34px;text-align:left"><div style="width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 14px"></div><div style="font-size:26px;line-height:32px;font-weight:700;padding:0 4px">${title}</div><div style="margin-top:30px;display:flex;flex-direction:column;gap:10px">${rows.map((r) => `<div class="t" style="height:62px;border-radius:16px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:600;background:${r.bg};color:${r.c || '#fff'}">${r.t}${r.chev ? icon('fwd', 's18') : ''}</div>`).join('')}</div></section>`;
const btn = (label, ghost = false, danger = false) => `<button class="cta ${ghost ? 'gh ' : ''}${danger ? 'or-danger ' : ''}t" type="button">${label}</button>`;
const actions = (list) => list.length ? `<div class="or-actions${list.some((i) => i.row) ? ' ag-cfm-row' : list.some((i) => i.label.length > 18) ? ' stack' : ''}" style="--or-actions:${list.length}">${list.map((i) => btn(i.label, i.ghost, i.danger)).join('')}</div>` : '';
const alertPhone = (title, body, buttons, o = {}) => phone(o.settings ? orUnderSettings() : orUnder(o.context || 'Аккаунт'), { time: '9:41', overlay: `<div class="or-dim"></div><section class="modal or-region or-alert" role="region">${o.icon ? `<div class="or-stage">${icon(o.icon, 's26')}</div>` : ''}<div class="or-title">${title}</div>${body ? `<div class="or-body">${body}</div>` : ''}${actions(buttons)}</section>` });

// ---------- окно «Удалить аккаунт?» (DeleteAccountConfirmModal) ----------
const deleteModal = (guest) => phone(`${back('Аккаунт')}<div class="card" style="height:150px;margin-top:20px;opacity:.35"></div>`, { time: '13:22', overlay: `<div class="dim on"></div><div class="modal dm-left"><div class="modal-title">Удалить аккаунт?</div><div class="modal-copy">${guest ? 'Прогресс удалится безвозвратно. Подписка в App Store или Google Play не отменится автоматически.' : 'Аккаунт удалится через 14 дней. Если передумаешь — просто войди снова тем же способом. Подписка в App Store или Google Play не отменится автоматически.'}</div><label class="eyebrow" style="display:block;margin-top:18px">Введи «УДАЛИТЬ» для подтверждения:</label><input class="field" value="УДАЛИТЬ" style="margin-top:8px"><div class="modal-actions"><button class="cta gh t" type="button">Отмена</button><button class="cta red t" type="button">Удалить</button></div></div>` });

// зачем (Дизайн 12.10): двухкнопочные окна смены аккаунта в коде — ThemedConfirmModal (макет system_23): кнопки В РЯД, серая + приглушённо-красная; образец приведён к коду, код не менялся
const SW = [{ label: 'Остаться здесь', ghost: true, row: true }, { label: 'Сменить без сохранения', danger: true, row: true }];
const BL = [
  ['acc', 'Экран «Аккаунт»', 'account_details.tsx: у гостя — «Привязать аккаунт», без «Способ входа» и «Выйти»; у привязанного — «Скопировать» меняется на «Скопировано».', [
    col('Аккаунт — гость', account({ linked: false }), 'нет строк «Email», «Способ входа», «Выйти…»'),
    col('Аккаунт — Google, адрес скопирован', account({ linked: true, name: 'Алекс', copied: true }), 'после тапа «Скопировать» подпись «Скопировано». «Выйти и войти под другим аккаунтом» — выход сразу по тапу, без окна подтверждения (account_details.tsx, 289cc8a51)'),
  ]],
  ['auth', 'Окно входа — отказы', 'Показываются внутри окна входа строкой-ошибкой; кнопка под ней зависит от причины.', [
    col('Телефон уже связан с другим аккаунтом', authErr('Телефон уже связан с другим аккаунтом', 'Твой прогресс на месте. Чтобы войти в другой аккаунт, сначала смени аккаунт.', 'Сменить аккаунт', false), 'вместо «Повторить» — «Сменить аккаунт» (account_switch_copy.ts)'),
    col('Прогресс на месте — вход отменён', authErr('Прогресс на месте', 'Не получилось сохранить его в облако перед входом, поэтому вход отменён. Попробуй ещё раз, когда интернет будет стабильнее.', 'Повторить', true), 'вход без стирания данных; «Повторить» остаётся (account_sync_copy.ts)'),
    col('Ждёт прогресс другого аккаунта', authErr('На телефоне ждёт прогресс другого аккаунта', 'Сначала переключись на него в Настройках, чтобы ничего не потерять.', 'Сменить аккаунт', false), 'account_backup_blocked_copy.ts'),
    col('Аккаунт восстановлен', authErr('Аккаунт восстановлен', 'Войди ещё раз — весь прогресс на месте.', 'Повторить', true), 'после «Восстановить» в окне ниже (RegistrationPromptModal.tsx:1257-1267)'),
  ]],
  ['restore', 'Восстановление и удаление', 'Аккаунт живёт 14 дней после удаления (функция сервера) — об этом честно говорят все окна.', [
    col('Восстановить аккаунт?', alertPhone('Восстановить аккаунт?', 'Этот аккаунт удалится через 12 дней — весь прогресс ещё на месте и вернётся полностью.', [{ label: 'Не восстанавливать', ghost: true }, { label: 'Восстановить' }], { context: 'Вход' }), 'системное окно, закрыть нельзя. Фраза «удалится через N дней» (accountRestorePromptMessage): 1 день, 2 дня, 12 дней — слово склоняется'),
    col('Аккаунт удалён', alertPhone('Аккаунт удалён', 'Этот аккаунт удалён безвозвратно. Войди другим способом или начни заново.', [{ label: 'Понятно' }], { context: 'Вход', icon: 'lockF' }), '14 дней прошли (account_delete_restore_prompt.ts)'),
    col('Удалить аккаунт? — с входом', deleteModal(false), 'вход через Google/Apple: 14 дней и «войди снова»'),
    col('Удалить аккаунт? — гость', deleteModal(true), 'гость: «Прогресс удалится безвозвратно»'),
    col('Удаление не завершилось', alertPhone('Не получилось', 'Удаление не завершилось. Проверь интернет и попробуй ещё раз.', [{ label: 'Закрыть', ghost: true }, { label: 'Повторить' }], { icon: 'lockF' }), 'DeleteAccountConfirmModal.tsx:336-352'),
  ]],
  ['switch', 'Смена аккаунта — отказы', 'Окно «Сменить аккаунт?» и причины, по которым смена отменяется без потери данных (settings.tsx).', [
    col('Сменить аккаунт? — с Plus', alertPhone('Сменить аккаунт?', 'Текущий прогресс останется привязан к аккаунту, под которым ты сейчас вошёл. Чтобы вернуться — войди под ним снова.<span class="or-next">У тебя активен Plus. После смены он перейдёт на новый аккаунт на этом телефоне.</span><span class="or-next">Перед выходом надёжно сохраним прогресс. Если соединение не ответит — отменим смену аккаунта, чтобы ничего не потерялось.</span>', [{ label: 'Отмена', ghost: true }, { label: 'Продолжить' }]), 'строка про Plus — только при реальном переносе (account_switch_copy.ts:40)'),
    col('Несохранённые карточки', phone(orUnderSettings(), { time: '9:41', overlay: glassSheet3('Несохранённые карточки будут удалены с этого телефона', [{ t: 'Сохранить и сменить', bg: '#23262F', chev: 1 }, { t: 'Сменить без сохранения', bg: '#43211F', c: '#FF8A80' }, { t: 'Остаться здесь', bg: '#3A3D46' }]) }), 'три действия — нижняя шторка поверх «Настроек» (settings.tsx:1583-1592)'),
    col('Покупка ещё синхронизируется', alertPhone('Покупка ещё синхронизируется', 'Смена аккаунта отменена: незавершённое списание монет нельзя переносить или пропускать. Подключись к интернету и попробуй снова.', SW), 'settings.tsx:1853-1885'),
    col('Нужна проверка монет', alertPhone('Нужна проверка монет', 'Смена аккаунта отменена: локальная очередь монет повреждена или принадлежит неизвестному аккаунту. Данные сохранены для восстановления.', SW), 'settings.tsx:1892-1925'),
    col('Прогресс не сохранён', alertPhone('Прогресс не сохранён', 'Смена аккаунта отменена, всё на месте. Попробуй ещё раз.', SW, { settings: true }), 'settings.tsx:1933-1955 (прежний текст про «нет соединения» устарел)'),
    col('Смена аккаунта отменена', alertPhone('Смена аккаунта отменена', 'Защитная проверка не разрешила удалить локальные данные. Всё осталось на месте — попробуй снова позже.', [{ label: 'OK' }]), 'settings.tsx:1770-1790'),
    col('Смена аккаунта ещё идёт', alertPhone('Смена аккаунта ещё идёт', 'Связь медленная. Прогресс в безопасности: если закрыть приложение, смена завершится при следующем запуске.', [{ label: 'OK' }], { icon: 'lockF' }), 'через 45 с (account_switch_still_running_copy.ts)'),
  ]],
  ['guestswitch', 'Онбординг — гость выбрал существующий Google', 'Гость нажал «У меня уже есть аккаунт» и выбрал Google, который уже есть в Phraseman: окно очереди с честным текстом вместо «Телефон уже связан…» (onboarding_account_switch_confirm.ts, account_switch_copy.ts accountSwitchRequiredGuestCopy). После «Отмена» остаёмся на экране входа; после подтверждения гостевые данные телефона стираются и вход идёт без второго окна Google.', [
    col('Этот аккаунт уже есть в Phraseman', alertPhone('Этот аккаунт уже есть в Phraseman', 'Чтобы войти в него, начатое на этом телефоне без входа придётся оставить — оно не перенесётся.', [{ label: 'Отмена', ghost: true }, { label: 'Войти в этот аккаунт' }], { context: 'Вход' }), 'themed-окно очереди (enqueueThemedBlockingChoiceAlert): «Отмена» слева, главная кнопка справа'),
  ]],
];
document.getElementById('root').innerHTML = BL.map(([id, t, l, c]) => block(id, t, l, c)).join('');
K.init();
})();
</script>
</body>
</html>
